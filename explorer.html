capture est nulle (figure 2-a) ; à α = 180°, cos α = -1 et le conatus ôte de sa traction au désir-maître (figure 2-b). La géométrie renverse le sens de « remettre d'équerre » (*norma*, l'équerre) (39.5). « Les perpendiculaires se détournent du détournement » (39.5).", "body_en": "## In Lordon\n\nWith the model of D11: at a right angle α, cos α = 0 and capture is nil (figure 2-a); at α = 180°, cos α = -1 and the conatus takes traction away from the master-desire (figure 2-b). The geometry reverses the sense of \"squaring up\" (*norma*, the carpenter's square) (39.5). \"The perpendiculars turn away from the diversion\" (39.5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D25", "file": "definitions/D25.md", "type": "definition", "partie": "3", "titre": "Aliénation comme fixation", "enonce": "L'aliénation n'est ni la perte de l'autonomie, ni la séparation d'avec sa puissance, mais la fixation de la puissance sur un très petit nombre d'objets : rétrécissement de ses effectuations, fermeture du champ de ses affectabilités.", "titre_en": "Alienation as fixation", "enonce_en": "Alienation is neither the loss of autonomy nor separation from one's power, but the fixation of power on a very small number of objects: a narrowing of its enactments, a closing of the field of its affectabilities.", "titre_de": "Entfremdung als Fixierung", "enonce_de": "Entfremdung ist weder Verlust der Autonomie noch Trennung von der eigenen Macht, sondern die Fixierung der Macht auf sehr wenige Gegenstände: eine Verengung ihrer Betätigungen, eine Schließung des Feldes ihrer Affizierbarkeiten.", "body_de": "## Bei Lordon\n\nLordon übernimmt das Schema von Pascal Sévérac (Anm. 131). Nach S29 kann man nicht von seiner Macht getrennt sein, die das eigene Sein selbst ist; nach S33 kann sich ein Affekt hartnäckig festsetzen; nach S25 ist Macht auch die Fähigkeit, auf viele Weisen affiziert zu werden (40.2-40.3). „Der an ‚sein‘ einziges Tätigkeitsobjekt gefesselte Angestellte, selbst freudig, ist nicht anders ‚entfremdet‘ als der Kokainsüchtige, dessen Geist ganz von Bildern des Pulvers erfüllt ist“ (40.2).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["40.2", "40.3"], "depends_on": ["S29", "S33", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon emprunte le schème à Pascal Sévérac (note 131). Par S29, on ne peut être séparé de sa puissance, qui est son être même ; par S33, un affect peut se fixer de façon tenace ; par S25, la puissance est aussi pouvoir d'être affecté de nombreuses manières (40.2-40.3). « Le salarié rivé, fût-ce joyeusement, à “son” unique objet d'activité n'est pas “aliéné” différemment du cocaïnomane dont l'esprit est entièrement rempli d'images de poudre » (40.2).", "body_en": "## In Lordon\n\nLordon borrows the schema from Pascal Sévérac (note 131). By S29, one cannot be separated from one's power, which is one's very being; by S33, an affect can become stubbornly fixed; by S25, power is also the capacity to be affected in many ways (40.2-40.3). \"The employee riveted, even joyfully, to 'his' one object of activity is not 'alienated' differently from the cocaine addict whose mind is entirely filled with images of powder\" (40.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S25", "S29", "S33"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D26", "file": "definitions/D26.md", "type": "definition", "partie": "3", "titre": "Classes affectives", "enonce": "Une classe est une communauté de manières de sentir, juger et désirer, déterminée par une proximité d'expériences sociales. La lutte des classes devient lutte de classes affectives : celle des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose.", "titre_en": "Affective classes", "enonce_en": "A class is a community of ways of feeling, judging and desiring, determined by a proximity of social experiences. The class struggle becomes a struggle of affective classes: that of the joyful who want nothing changed and of the discontented who want something else.", "titre_de": "Affektive Klassen", "enonce_de": "Eine Klasse ist eine Gemeinschaft von Weisen des Fühlens, Urteilens und Begehrens, bestimmt durch eine Nähe sozialer Erfahrungen. Der Klassenkampf wird zu einem Kampf affektiver Klassen: dem der Freudigen, die nichts geändert haben wollen, und dem der Unzufriedenen, die etwas anderes wollen.", "body_de": "## Bei Lordon\n\nDiese Definition „entspricht weniger der Einfachheit des anfänglichen bipolaren Schemas“, erlaubt aber Rehomogenisierungen nach anderen Prinzipien, insbesondere der Unzufriedenheit (41.4). Sie ist keine „kosmetische verbale Huldigung an Marx“: Gemeinsame Affekte haben eine Ursache, das Kapital als soziales Verhältnis (41.4).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["41.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCette définition « coïncide moins bien avec la simplicité du schéma bipolaire initial » mais permet des ré-homogénéisations selon d'autres principes, notamment le mécontentement (41.4). Elle n'est pas un « cosmétique hommage verbal à Marx » : les affects communs ont une cause, le capital comme rapport social (41.4).", "body_en": "## In Lordon\n\nThis definition \"matches less well the simplicity of the initial bipolar schema\" but allows re-homogenisations along other principles, notably discontent (41.4). It is not a \"cosmetic verbal tribute to Marx\": common affects have a cause, capital as a social relation (41.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "M01", "file": "premisses/M01.md", "type": "marx", "partie": "P", "titre": "Le rapport salarial comme double séparation", "enonce": "Le rapport salarial sépare les travailleurs des moyens de la production et de ses produits.", "titre_en": "The wage relation as a double separation", "enonce_en": "The wage relation separates workers from the means of production and from its products.", "titre_de": "Das Lohnverhältnis als doppelte Trennung", "enonce_de": "Das Lohnverhältnis trennt die Arbeitenden von den Mitteln der Produktion und von ihren Erzeugnissen.", "body_de": "## Bei Lordon\n\n„Seit Marx wissen wir“, dass die Macht der Unternehmer die Wirkung dieser Konfiguration von Strukturen ist (01.3). Die doppelte Trennung ist der strukturelle Kern der Definition des Lohnverhältnisses (04.1; D05).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« double séparation des travailleurs d’avec les moyens et les produits de la production »", "loc": ["01.3", "04.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Depuis Marx on sait » que le pouvoir des patrons est l'effet de cette configuration de structures (01.3). La double séparation est le noyau structurel de la définition du rapport salarial (04.1 ; D05).", "body_en": "## In Lordon\n\n\"Since Marx we know\" that the power of bosses is the effect of this configuration of structures (01.3). The double separation is the structural core of the definition of the wage relation (04.1; D05).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D05"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "M02", "file": "premisses/M02.md", "type": "marx", "partie": "P", "titre": "L'accumulation primitive", "enonce": "Le capitalisme n'a pu naître qu'en fermant les possibilités d'autoproduction (enclosures) et en ne laissant aux hommes dépossédés que la vente de leur force de travail.", "titre_en": "Primitive accumulation", "enonce_en": "Capitalism could only be born by closing off the possibilities of self-production (enclosures) and leaving dispossessed men nothing but the sale of their labour power.", "titre_de": "Ursprüngliche Akkumulation", "enonce_de": "Der Kapitalismus konnte nur entstehen, indem er die Möglichkeiten der Selbstversorgung verschloss (Einhegungen) und den enteigneten Menschen nichts ließ als den Verkauf ihrer Arbeitskraft.", "body_de": "## Bei Lordon\n\nLordon verweist für die historische Herausbildung der Bedingungen der Proletarisierung auf Marx und Polanyi (06.1). Er findet „den ursprünglichen Einbruch der ursprünglichen Akkumulation“ bei Antoine Doinel aus *Sie küssten und sie schlugen ihn*, der davon träumt, ein Möbelstück zu stehlen, um sich selbstständig zu machen (09.4; T010).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["06.1", "09.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon renvoie à Marx et à Polanyi pour la constitution historique des conditions de la prolétarisation (06.1). Il retrouve « l'effraction originelle de l'accumulation primitive » dans l'Antoine Doinel des *Quatre cents coups*, qui songe à voler un meuble pour se lancer dans les affaires (09.4 ; T010).", "body_en": "## In Lordon\n\nLordon refers to Marx and Polanyi for the historical constitution of the conditions of proletarianisation (06.1). He finds \"the original break-in of primitive accumulation\" in the Antoine Doinel of *The 400 Blows*, who dreams of stealing a piece of furniture to go into business (09.4; T010).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T010"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "M03", "file": "premisses/M03.md", "type": "marx", "partie": "P", "titre": "Il faut d'abord vivre", "enonce": "La présupposition première de toute existence humaine, donc de toute histoire, est que les hommes doivent pouvoir vivre : boire, manger, se loger, se vêtir.", "titre_en": "First one has to live", "enonce_en": "The first presupposition of all human existence, and so of all history, is that men must be able to live: drink, eat, find shelter, clothe themselves.", "titre_de": "Zuerst muss man leben", "enonce_de": "Die erste Voraussetzung aller menschlichen Existenz und also aller Geschichte ist, dass die Menschen leben können müssen: trinken, essen, wohnen, sich kleiden.", "body_de": "## Bei Lordon\n\nEin Zitat aus der *Deutschen Ideologie* (Marx und Engels; 08.1, Anm. 13), das den Vorrang des Grundbegehrens (D07) und durch es den Zugriff des Begehrens nach Geld (T007) begründet.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« pour vivre, il faut avant tout boire, manger, se loger, s’habiller et quelques autres choses encore »", "loc": ["08.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCitation de *L'Idéologie allemande* (Marx et Engels ; 08.1, note 13), qui fonde la priorité du désir basal (D07) et, par lui, l'emprise du désir d'argent (T007).", "body_en": "## In Lordon\n\nA quotation from *The German Ideology* (Marx and Engels; 08.1, note 13), which grounds the priority of basic desire (D07) and, through it, the hold of the desire for money (T007).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D07", "T007"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "M04", "file": "premisses/M04.md", "type": "marx", "partie": "P", "titre": "Travail et force de travail", "enonce": "L'employeur achète de la force de travail, non du travail ; la conversion de la première en le second reste à obtenir.", "titre_en": "Labour and labour power", "enonce_en": "The employer buys labour power, not labour; converting the former into the latter remains to be achieved.", "titre_de": "Arbeit und Arbeitskraft", "enonce_de": "Der Arbeitgeber kauft Arbeitskraft, nicht Arbeit; die erste in die zweite umzuwandeln, bleibt erst zu leisten.", "body_de": "## Bei Lordon\n\n„Personalverantwortliche entdecken täglich den Unterschied neu, den Marx in der Theorie zwischen Arbeit und Arbeitskraft ausgemacht hat“ (27.1): Eine Arbeitskraft zu kaufen garantiert nicht ihre tatsächliche Mobilisierung (T030).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["27.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Les recruteurs redécouvrent quotidiennement la différence théoriquement repérée par Marx entre travail et force de travail » (27.1) : l'achat d'une force de travail ne garantit pas sa mobilisation effective (T030).", "body_en": "## In Lordon\n\n\"Recruiters rediscover daily the difference Marx identified in theory between labour and labour power\" (27.1): buying a labour power does not guarantee its actual mobilisation (T030).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T030"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "M05", "file": "premisses/M05.md", "type": "marx", "partie": "P", "titre": "Le communisme, mouvement réel", "enonce": "Le communisme n'est pas un état de choses à établir ni un idéal auquel la réalité devrait se conformer : c'est le mouvement réel qui abolit l'état actuel des choses.", "titre_en": "Communism, the real movement", "enonce_en": "Communism is not a state of affairs to be established nor an ideal to which reality should conform: it is the real movement that abolishes the present state of things.", "titre_de": "Der Kommunismus, die wirkliche Bewegung", "enonce_de": "Der Kommunismus ist kein Zustand, der hergestellt werden soll, kein Ideal, nach dem sich die Wirklichkeit zu richten hätte: Er ist die wirkliche Bewegung, die den jetzigen Zustand aufhebt.", "body_de": "## Bei Lordon\n\nDie *Deutsche Ideologie* (Anm. 126), die den Abschnitt über die „Récommune“ abschließt (37.8) und die nächste Frage eröffnet: Woraus kann diese wirkliche Bewegung entstehen, wenn der freie Wille eine Fiktion ist? (38.1; T042).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Nous appelons communisme le mouvement réel qui abolit l’état actuel des choses »", "loc": ["37.8", "38.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*L'Idéologie allemande* (note 126), qui clôt la section sur la récommune (37.8) et ouvre la question suivante : d'où peut naître ce mouvement réel, si le libre arbitre est une fiction ? (38.1 ; T042).", "body_en": "## In Lordon\n\n*The German Ideology* (note 126), which closes the section on the \"récommune\" (37.8) and opens the next question: where can this real movement arise from, if free will is a fiction? (38.1; T042).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T042"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "M06", "file": "premisses/M06.md", "type": "marx", "partie": "P", "titre": "La division du travail sécrète le pouvoir", "enonce": "La division du travail produit d'elle-même du pouvoir : elle réserve à certaines places la coordination et la totalisation des informations, dont les autres n'ont qu'une vue parcellaire, et sépare la conception de l'exécution.", "titre_en": "The division of labour secretes power", "enonce_en": "The division of labour produces power of itself: it reserves to certain positions the coordination and totalisation of information, of which the others have only a partial view, and separates conception from execution.", "titre_de": "Die Arbeitsteilung sondert Macht ab", "enonce_de": "Die Arbeitsteilung bringt aus sich selbst Macht hervor: Sie behält bestimmten Positionen die Koordination und Zusammenführung der Informationen vor, von denen die anderen nur einen Teil sehen, und trennt Planung von Ausführung.", "body_de": "## Bei Lordon\n\n„Es ist die Arbeitsteilung, erklärt Marx, die *endogen* Macht absondert“ (42.1), wie die *Deutsche Ideologie* und das *Kapital* zeigen (Anm. 145). Lordon beklagt die Lesarten, die die kapitalistischen Machtverhältnisse allein auf die Eigentumsordnung zurückführten. Die „primäre Teilung“ zwischen Planung und Ausführung kehrt in 35.5 und 37.4 wieder.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["35.5", "37.4", "42.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« C'est la division du travail, explique Marx, qui sécrète *endogènement* du pouvoir » (42.1), comme le montrent *L'Idéologie allemande* et *Le Capital* (note 145). Lordon déplore les lectures qui ont réduit les rapports de pouvoir capitalistes au seul régime de propriété. La « division princeps » de la conception et de l'exécution revient en 35.5 et 37.4.", "body_en": "## In Lordon\n\n\"It is the division of labour, Marx explains, that *endogenously* secretes power\" (42.1), as *The German Ideology* and *Capital* show (note 145). Lordon deplores the readings that reduced capitalist power relations to the property regime alone. The \"primary division\" between conception and execution returns in 35.5 and 37.4.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S01", "file": "premisses/S01.md", "type": "spinoza", "partie": "P", "titre": "Le conatus", "enonce": "Chaque chose, autant qu'il est en elle, s'efforce de persévérer dans son être.", "titre_en": "The conatus", "enonce_en": "Each thing, as far as it is in itself, strives to persevere in its being.", "titre_de": "Der Conatus", "enonce_de": "Jedes Ding strebt, soweit es in sich ist, in seinem Sein zu verharren.", "body_de": "## Bei Lordon\n\nAusgangspunkt von Kapitel 1 (03.1), zitiert in der Übersetzung von Robert Misrahi (Anm. 3). Lordon liest ihn als „Kraft zu existieren“ (« force d'exister »), als die Energie, die die Körper in Bewegung setzt: siehe D01.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« chaque chose, autant qu’il est en elle, s’efforce de persévérer dans son être »", "loc": ["03.1"], "depends_on": [], "contre": [], "ethique": ["3p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPoint de départ du chapitre 1 (03.1), cité dans la traduction de Robert Misrahi (note 3). Lordon le lit comme la « force d'exister », l'énergie qui met les corps en mouvement : voir D01.", "body_en": "## In Lordon\n\nStarting point of chapter 1 (03.1), quoted in Robert Misrahi's translation (note 3). Lordon reads it as the \"force of existing\" (« force d'exister »), the energy that sets bodies in motion: see D01.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S02", "file": "premisses/S02.md", "type": "spinoza", "partie": "P", "titre": "L'argent, condensé de tous les biens", "enonce": "L'argent est devenu le condensé de tous les biens ; aussi son image occupe-t-elle l'esprit du vulgaire, qui n'imagine guère de joie qui ne soit accompagnée de l'idée de l'argent comme cause.", "titre_en": "Money, the epitome of all goods", "enonce_en": "Money has become the epitome of all goods; so its image occupies the mind of the common people, who can hardly imagine any kind of joy not accompanied by the idea of money as its cause.", "titre_de": "Das Geld, Inbegriff aller Güter", "enonce_de": "Das Geld ist zum Inbegriff aller Güter geworden; daher beherrscht sein Bild den Geist der Menge, die sich kaum eine Art von Freude vorstellen kann, die nicht von der Vorstellung des Geldes als ihrer Ursache begleitet ist.", "body_de": "## Bei Lordon\n\nEine der seltenen Stellen, an denen Spinoza von Ökonomie spricht (06.3, Anm. 6). Lordon liest darin die Geburt eines **Metabegehrens** (T006) in einer Marktwirtschaft mit Arbeitsteilung; er nimmt sie für den Massenkonsum wieder auf, wo die Aussage „ihre volle Tragweite erhält“ (12.2, Anm. 28 und 29; T013). Er unterscheidet die „gewöhnlichen Menschen“, die ohne Geld nicht auskommen, von der „Menge“ (*vulgus*), deren Geist *ganz* von ihm eingenommen ist (Anm. 7).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’argent est devenu le condensé de tous les biens »", "loc": ["06.3", "12.2"], "depends_on": [], "contre": [], "ethique": ["4appc28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'un des rares passages où Spinoza parle d'économie (06.3, note 6). Lordon y lit la naissance d'un **métadésir** (T006) dans une économie marchande à travail divisé ; il le reprend pour la consommation de masse, où l'énoncé « reçoive sa pleine dimension » (12.2, notes 28 et 29 ; T013). Il distingue le « lot commun », qui ne peut se passer d'argent, du « vulgaire », dont l'esprit en est *entièrement* occupé (note 7).", "body_en": "## In Lordon\n\nOne of the rare passages where Spinoza speaks of economics (06.3, note 6). Lordon reads in it the birth of a **meta-desire** (T006) in a market economy with a division of labour; he takes it up again for mass consumption, where the statement \"receives its full dimension\" (12.2, notes 28 and 29; T013). He distinguishes the \"common lot\", who cannot do without money, from the \"common people\" (*vulgus*), whose mind is *entirely* occupied by it (note 7).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T006", "T013"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S03", "file": "premisses/S03.md", "type": "spinoza", "partie": "P", "titre": "Le désir, essence de l'homme", "enonce": "Le désir est l'essence même de l'homme en tant qu'elle est conçue comme déterminée, par une affection quelconque d'elle-même, à faire quelque chose.", "titre_en": "Desire, the essence of man", "enonce_en": "Desire is the very essence of man insofar as it is conceived as determined, by some affection of itself, to do something.", "titre_de": "Das Begehren, das Wesen des Menschen", "enonce_de": "Das Begehren ist das Wesen des Menschen selbst, insofern es als durch irgendeine Affektion seiner selbst bestimmt aufgefasst wird, etwas zu tun.", "body_de": "## Bei Lordon\n\nErste Definition der Affekte, vollständig zitiert (08.3, Anm. 14). Lordon schließt daraus, dass der Conatus, eine allgemeine Handlungsmacht, erst unter der Wirkung einer vorausgehenden Affektion, die ihm einen Gegenstand bezeichnet, zu gerichteter Tätigkeit wird (T008).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Le désir […] est l’essence même de l’homme en tant qu’elle est conçue comme déterminée par une quelconque affection d’elle-même à faire quelque chose »", "loc": ["08.3"], "depends_on": [], "contre": [], "ethique": ["3ad1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière définition des affects, citée en entier (08.3, note 14). Lordon en tire que le conatus, puissance d'agir générique, ne devient activité dirigée que sous l'effet d'une affection antécédente qui lui désigne un objet (T008).", "body_en": "## In Lordon\n\nFirst definition of the affects, quoted in full (08.3, note 14). Lordon draws from it that the conatus, a generic power of acting, only becomes directed activity under the effect of a prior affection that designates an object for it (T008).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T008"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S04", "file": "premisses/S04.md", "type": "spinoza", "partie": "P", "titre": "On ne désire pas une chose parce qu'elle est bonne", "enonce": "Ce n'est pas parce qu'une chose est bonne que nous la désirons ; c'est parce que nous la désirons que nous la jugeons bonne.", "titre_en": "We do not desire a thing because it is good", "enonce_en": "It is not because a thing is good that we desire it; it is because we desire it that we judge it good.", "titre_de": "Wir begehren eine Sache nicht, weil sie gut ist", "enonce_de": "Nicht weil eine Sache gut ist, begehren wir sie; weil wir sie begehren, urteilen wir, dass sie gut ist.", "body_de": "## Bei Lordon\n\nIn Anm. 16 angeführt (08.3), dann in 22.2 vollständig zitiert, wo Lordon schließt, dass das Begehren **axiogen** ist (D17). In 08.3 dient sie der „radikalen Umkehrung“ der gewöhnlichen Auffassung des Begehrens: Es ist der Schub des Conatus, der die Dinge besetzt und sie zu Gegenständen des Begehrens einsetzt (T008, gegen R03). Die obige Aussage fasst die Anmerkung zusammen; Lordon zitiert sie nicht. Er kommt in 35.2 gegen jeden substanziellen Wert auf sie zurück (T037).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["08.3", "22.2", "35.2"], "depends_on": [], "contre": [], "ethique": ["3p9sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 16 (08.3), puis cité en entier en 22.2, où Lordon en tire que le désir est **axiogène** (D17). En 08.3, il sert au « renversement radical » de la conception ordinaire du désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir (T008, contre R03). L'énoncé ci-dessus résume le scolie ; Lordon ne le cite pas. Il y revient en 35.2 contre toute valeur substantielle (T037).", "body_en": "## In Lordon\n\nReferred to in note 16 (08.3), then quoted in full in 22.2, where Lordon concludes that desire is **axiogenic** (D17). In 08.3 it serves the \"radical reversal\" of the ordinary conception of desire: it is the thrust of the conatus that invests things and institutes them as objects of desire (T008, against R03). The statement above summarises the scholium; Lordon does not quote it. He returns to it in 35.2 against any substantial value (T037).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D17", "R03", "T008", "T037"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S05", "file": "premisses/S05.md", "type": "spinoza", "partie": "P", "titre": "L'association des affects", "enonce": "Du seul fait que nous avons considéré une chose en même temps que nous étions affectés d'une joie ou d'une tristesse dont elle n'était pas la cause, nous pouvons l'aimer ou la haïr.", "titre_en": "The association of affects", "enonce_en": "Simply because we have regarded a thing while affected by a joy or a sadness of which it was not the cause, we can love or hate it.", "titre_de": "Die Verknüpfung der Affekte", "enonce_de": "Allein weil wir eine Sache betrachtet haben, während wir von einer Freude oder Traurigkeit affiziert waren, deren Ursache sie nicht war, können wir sie lieben oder hassen.", "body_de": "## Bei Lordon\n\nIn Anm. 18 zitiert (08.3), in 24.1 wieder aufgenommen: Vergangene Freuden oder Traurigkeiten, die neue Gegenstände „durch Verbindung anstecken“, machen sie zu Gegenständen des Begehrens. Lordons Beispiel: Swann liebt Odette, weil sie ihn an eine Figur Botticellis erinnert.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["08.3", "24.1"], "depends_on": [], "contre": [], "ethique": ["3p15c"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 18 (08.3), repris en 24.1 : les anciennes joies ou tristesses, « contaminant par connexité » de nouveaux objets, en font des objets de désir. Exemple de Lordon : Swann aime Odette parce qu'elle lui rappelle une figure de Botticelli.", "body_en": "## In Lordon\n\nQuoted in note 18 (08.3), taken up in 24.1: past joys or sadnesses, \"contaminating by connection\" new objects, make them objects of desire. Lordon's example: Swann loves Odette because she reminds him of a figure by Botticelli.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S06", "file": "premisses/S06.md", "type": "spinoza", "partie": "P", "titre": "L'imitation des affects", "enonce": "Du fait que nous imaginons qu'une chose semblable à nous est affectée d'un affect, nous sommes affectés d'un affect semblable.", "titre_en": "The imitation of affects", "enonce_en": "From imagining that a thing like us is affected by some affect, we are affected by a like affect.", "titre_de": "Die Nachahmung der Affekte", "enonce_de": "Daraus, dass wir uns vorstellen, dass ein uns ähnliches Ding von irgendeinem Affekt affiziert ist, werden wir von einem ähnlichen Affekt affiziert.", "body_de": "## Bei Lordon\n\nIn Anm. 19 und 32 angeführt, in Kapitel 2 wieder aufgenommen (24.1, 29.2). Das Begehren zirkuliert zwischen den Individuen, die „einander durch das wechselseitige Schauspiel ihrer Antriebe zum Begehren bringen“ (08.3), vor allem über soziale Vermittlungen: Nacheiferung, Distinktion, Vorlieben und Abneigungen von Gruppen. In 34.1 weckt die *imitatio affectuum* den Neid auf die sichtbaren Freuden der Großen (T036). Auf den Konsum angewandt (12.4): Eine Gesellschaft, die ihre materiellen Ansprüche von sich aus verringerte, bliebe der Nachahmung des Begehrens ihrer Nachbarn ausgesetzt.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["08.3", "12.4", "24.1", "29.2", "34.1"], "depends_on": [], "contre": [], "ethique": ["3p27"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi des notes 19 et 32, repris au chapitre 2 (24.1, 29.2). Le désir circule entre les individus, qui « s'induisent les uns les autres à désirer par le spectacle mutuel de leurs élans » (08.3), surtout à travers des médiations sociales : émulation, distinction, goût et dégoût de groupe. En 34.1, l'*imitatio affectuum* attise l'envie des joies visibles des grands (T036). Appliqué à la consommation (12.4) : une société qui réduirait seule ses aspirations matérielles resterait exposée à l'imitation du désir de ses voisins.", "body_en": "## In Lordon\n\nReferred to in notes 19 and 32, taken up in chapter 2 (24.1, 29.2). Desire circulates between individuals, who \"induce one another to desire through the mutual spectacle of their impulses\" (08.3), above all through social mediations: emulation, distinction, group tastes and distastes. In 34.1, the *imitatio affectuum* stirs envy of the visible joys of the great (T036). Applied to consumption (12.4): a society that reduced its material aspirations on its own would remain exposed to the imitation of its neighbours' desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S07", "file": "premisses/S07.md", "type": "spinoza", "partie": "P", "titre": "La servitude", "enonce": "La servitude est l'impuissance humaine à diriger et à réprimer les affects : soumis aux affects, l'homme ne relève pas de lui-même mais de la fortune.", "titre_en": "Bondage", "enonce_en": "Bondage is human powerlessness to govern and restrain the affects: subject to the affects, man is not under his own control but under that of fortune.", "titre_de": "Die Knechtschaft", "enonce_de": "Knechtschaft ist die menschliche Ohnmacht, die Affekte zu lenken und zu zügeln: den Affekten unterworfen, steht der Mensch nicht unter seiner eigenen Gewalt, sondern unter der des Glücks.", "body_de": "## Bei Lordon\n\nErster Satz der Vorrede zum vierten Teil, *Von der menschlichen Knechtschaft oder von der Macht der Affekte*, zitiert in 08.4. Lordon vermerkt, dass die *Ethik* durchaus einen Weg der Befreiung zeichnet, aber „wenige sind die Befreiten“: Für die gewöhnlichen Menschen ist die Knechtschaft die Regel (T009).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« J’appelle Servitude l’impuissance humaine à diriger et à réprimer les affects »", "loc": ["08.4"], "depends_on": [], "contre": [], "ethique": ["4pr"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière phrase de la préface de la partie IV, *De la servitude humaine, ou de la force des affects*, citée en 08.4. Lordon note que l'*Éthique* trace bien une voie de libération, mais que « peu nombreux sont les émancipés » : pour le lot commun, la servitude est la règle (T009).", "body_en": "## In Lordon\n\nFirst sentence of the preface to Part IV, *Of Human Bondage, or the Strength of the Affects*, quoted in 08.4. Lordon notes that the *Ethics* does trace a path of liberation, but that \"few are the emancipated\": for the common lot, bondage is the rule (T009).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T009"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S08", "file": "premisses/S08.md", "type": "spinoza", "partie": "P", "titre": "La crainte", "enonce": "La crainte est une tristesse inconstante née de l'idée d'une chose future ou passée dont l'issue est pour nous en quelque mesure incertaine ; elle accompagne l'espoir, qui en est la face joyeuse.", "titre_en": "Fear", "enonce_en": "Fear is an inconstant sadness born of the idea of a future or past thing whose outcome is to some extent doubtful to us; it goes with hope, which is its joyful face.", "titre_de": "Die Furcht", "enonce_de": "Furcht ist eine unbeständige Traurigkeit, entsprungen aus der Vorstellung eines künftigen oder vergangenen Dinges, über dessen Ausgang wir in gewissem Maß im Zweifel sind; sie geht mit der Hoffnung einher, die ihr freudiges Gesicht ist.", "body_de": "## Bei Lordon\n\nDefinition der Affekte 13, zitiert in 11.1 (Anm. 24). Das „Schwanken des Gemüts“ kehrt in 31.4 wieder: Die „Zustimmungen“ der Lohnabhängigen sind immer gemischt (T034). Lordon fügt hinzu, dass Furcht und Hoffnung „der fast ständige Hintergrund des Begehrens“ sind, sobald der Gegenstand nicht unmittelbar erreichbar ist, die Hoffnung, ihn zu erlangen, mit der Furcht einhergehend, leer auszugehen (*fluctuatio animi*). *[rekonstruierter Verweis: Die Verbindung von Hoffnung und Furcht ist die Erläuterung von 3ad13; die Hoffnung wird in 3ad12 definiert.]*", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« tristesse inconstante née de l’idée d’une chose future ou passée, dont l’issue est en quelque mesure incertaine pour nous »", "loc": ["11.1", "31.4"], "depends_on": [], "contre": [], "ethique": ["3ad13"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDéfinition des affects 13, citée en 11.1 (note 24). Le « flottement de l'âme » revient en 31.4 : les « consentements » salariaux sont toujours mitigés (T034). Lordon ajoute que crainte et espoir sont « l'arrière-plan quasi permanent du désir » dès que l'objet n'est pas immédiatement à portée, l'espoir d'obtenir allant avec la crainte de manquer (*fluctuatio animi*). *[renvoi reconstruit : le lien de l'espoir et de la crainte est l'explication de 3ad13 ; l'espoir est défini en 3ad12.]*", "body_en": "## In Lordon\n\nDefinition of the affects 13, quoted in 11.1 (note 24). The \"vacillation of the mind\" returns in 31.4: wage-earners' \"consents\" are always mixed (T034). Lordon adds that fear and hope are \"the almost permanent background of desire\" whenever the object is not immediately within reach, the hope of obtaining going with the fear of going without (*fluctuatio animi*). *[reconstructed reference: the link between hope and fear is the explanation of 3ad13; hope is defined in 3ad12.]*", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S09", "file": "premisses/S09.md", "type": "spinoza", "partie": "P", "titre": "La force du désir suit celle de l'affect", "enonce": "Le désir qui naît d'une tristesse ou d'une joie est d'autant plus grand que l'affect est plus grand : plus grande est la tristesse, plus grande est la puissance d'agir par laquelle on s'efforce de l'écarter ; un homme affecté de joie désire la conserver, d'autant plus que la joie est grande.", "titre_en": "The strength of desire follows that of the affect", "enonce_en": "The desire that arises from sadness or joy is the greater, the greater the affect: the greater the sadness, the greater the power of acting with which one strives to remove it; a man affected with joy desires to preserve it, the more so the greater the joy.", "titre_de": "Die Stärke des Begehrens folgt der des Affekts", "enonce_de": "Das Begehren, das aus Traurigkeit oder Freude entspringt, ist umso größer, je größer der Affekt ist: Je größer die Traurigkeit, desto größer die Handlungsmacht, mit der man sie zu beseitigen strebt; ein von Freude affizierter Mensch begehrt, sie zu bewahren, umso mehr, je größer die Freude.", "body_de": "## Bei Lordon\n\nBeweis von III, 37, viermal zitiert: Wie jeder traurige Affekt treibt die Furcht den Conatus zu einem Überschuss an Tätigkeit, um sich von ihr zu befreien (11.1, Anm. 25; T012); die Traurigkeit sinnloser Arbeit kann zur Auflehnung treiben (22.8, Anm. 64; T026); der von der Liebe zum Herrn erfreute Angestellte begehrt, diese Freude zu bewahren (23.3, Anm. 71; T027); die aus einer Kränkung entspringende gemeinsame Traurigkeit macht die Macht der Empörung aus (38.4, Anm. 129; T042).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« plus grande est la tristesse, plus grande est la puissance d’agir par laquelle l’homme s’efforce de lutter contre la tristesse »", "loc": ["11.1", "22.8", "23.3", "38.4"], "depends_on": [], "contre": [], "ethique": ["3p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDémonstration de III, 37, citée quatre fois : comme tout affect triste, la crainte induit du conatus un surplus d'activité pour s'en défaire (11.1, note 25 ; T012) ; la tristesse du travail sans sens peut pousser à la rébellion (22.8, note 64 ; T026) ; le salarié réjoui par l'amour du maître désire conserver cette joie (23.3, note 71 ; T027) ; la tristesse commune née d'une offense fait la puissance de l'indignation (38.4, note 129 ; T042).", "body_en": "## In Lordon\n\nDemonstration of III, 37, quoted four times: like every sad affect, fear induces from the conatus a surplus of activity to rid itself of it (11.1, note 25; T012); the sadness of meaningless work can push to rebellion (22.8, note 64; T026); the employee gladdened by love of the master desires to preserve that joy (23.3, note 71; T027); the common sadness born of an offence makes the power of indignation (38.4, note 129; T042).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T012", "T026", "T027", "T042"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S10", "file": "premisses/S10.md", "type": "spinoza", "partie": "P", "titre": "L'illusion du libre arbitre", "enonce": "Les hommes se croient libres parce qu'ils sont conscients de leurs actions et ignorants des causes qui les déterminent.", "titre_en": "The illusion of free will", "enonce_en": "Men believe themselves free because they are conscious of their actions and ignorant of the causes that determine them.", "titre_de": "Die Illusion des freien Willens", "enonce_de": "Die Menschen halten sich für frei, weil sie sich ihrer Handlungen bewusst sind und die Ursachen nicht kennen, die sie bestimmen.", "body_de": "## Bei Lordon\n\nZitiert in 20.4: Spinoza leugnet nicht bloß den freien Willen, er gibt „das genetische Prinzip“ dieses Glaubens an, eine Verkürzung des Verstandes, die nur Willensakte und Handlungen registriert. Wieder aufgenommen in 24.3: Je vielfältiger und diffuser die Bestimmungen, desto mehr hält sich das Individuum für den Ursprung seines Begehrens.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Les hommes se trompent quand ils se croient libres ; car cette opinion consiste en cela seul qu’ils sont conscients de leurs actions et ignorants des causes qui les déterminent »", "loc": ["20.4", "24.3"], "depends_on": [], "contre": [], "ethique": ["2p35sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 : Spinoza ne se contente pas de nier le libre arbitre, il donne « le principe génétique » de la croyance, une troncature de l'intellection qui n'enregistre que les volitions et les actions. Repris en 24.3 : plus les déterminations sont multiples et diffuses, plus l'individu se croit l'origine de son désir.", "body_en": "## In Lordon\n\nQuoted in 20.4: Spinoza does not merely deny free will, he gives \"the genetic principle\" of the belief, a truncation of understanding that registers only volitions and actions. Taken up in 24.3: the more multiple and diffuse the determinations, the more the individual believes himself the origin of his desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S11", "file": "premisses/S11.md", "type": "spinoza", "partie": "P", "titre": "Toute chose finie est déterminée par une autre", "enonce": "Une chose finie, dont l'existence est déterminée, ne peut exister ni être déterminée à agir que si elle y est déterminée par une autre cause, elle aussi finie, et ainsi à l'infini.", "titre_en": "Every finite thing is determined by another", "enonce_en": "A finite thing with a determinate existence can neither exist nor be determined to act unless it is determined to do so by another cause, also finite, and so on to infinity.", "titre_de": "Jedes endliche Ding wird durch ein anderes bestimmt", "enonce_de": "Ein endliches Ding mit bestimmtem Dasein kann weder existieren noch zum Handeln bestimmt werden, wenn es nicht von einer anderen, ebenfalls endlichen Ursache dazu bestimmt wird, und so ins Unendliche.", "body_de": "## Bei Lordon\n\nZitiert in 20.4 (Anm. 51) und 20.5: „Wir tun etwas nur, wenn uns etwas widerfährt“. Daher die Folge Affektion-Affekt-Handlung, die Lordon zu „Affekthandlung“ zusammenzuziehen vorschlägt.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["20.4", "20.5"], "depends_on": [], "contre": [], "ethique": ["1p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 (note 51) et 20.5 : « nous ne faisons quelque chose que s'il nous arrive quelque chose ». D'où la séquence affection-affect-action, que Lordon propose de contracter en « affectaction ».", "body_en": "## In Lordon\n\nQuoted in 20.4 (note 51) and 20.5: \"we do something only if something happens to us\". Hence the sequence affection-affect-action, which Lordon proposes to contract into \"affectaction\".", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S12", "file": "premisses/S12.md", "type": "spinoza", "partie": "P", "titre": "Cause adéquate et cause inadéquate", "enonce": "Une cause est adéquate quand on peut percevoir clairement et distinctement son effet par elle seule ; inadéquate ou partielle quand on ne peut comprendre son effet par elle seule.", "titre_en": "Adequate and inadequate cause", "enonce_en": "A cause is adequate when its effect can be clearly and distinctly perceived through it alone; inadequate or partial when its effect cannot be understood through it alone.", "titre_de": "Adäquate und inadäquate Ursache", "enonce_de": "Eine Ursache ist adäquat, wenn ihre Wirkung durch sie allein klar und deutlich wahrgenommen werden kann; inadäquat oder partiell, wenn ihre Wirkung nicht durch sie allein verstanden werden kann.", "body_de": "## Bei Lordon\n\nZitiert in Anm. 50 (20.4): Jedes Ding steht „unter der Herrschaft der inadäquaten Kausalität“, teilweise von anderen Dingen zum Handeln bestimmt; daher kann keine Handlung als *ganz* die eigene beansprucht werden.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["20.4"], "depends_on": [], "contre": [], "ethique": ["3def1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 50 (20.4) : toute chose se trouve « sous l'empire de la causalité inadéquate », partiellement déterminée à agir par d'autres choses ; aucune action ne peut donc être revendiquée comme *entièrement* sienne.", "body_en": "## In Lordon\n\nQuoted in note 50 (20.4): every thing finds itself \"under the sway of inadequate causality\", partly determined to act by other things; so no action can be claimed as *entirely* one's own.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S13", "file": "premisses/S13.md", "type": "spinoza", "partie": "P", "titre": "L'ambition : vouloir que les autres vivent selon sa complexion", "enonce": "L'effort pour que les autres approuvent ce que nous aimons ou haïssons est l'ambition : chacun, par nature, désire que les autres vivent selon sa propre constitution.", "titre_en": "Ambition: wanting others to live by one's own complexion", "enonce_en": "The striving to have others approve what we love or hate is ambition: everyone, by nature, desires that others live according to his own constitution.", "titre_de": "Ehrgeiz: wollen, dass die anderen nach der eigenen Sinnesart leben", "enonce_de": "Das Streben, dass andere billigen, was wir lieben oder hassen, ist Ehrgeiz: Jeder begehrt von Natur aus, dass die anderen nach seiner eigenen Beschaffenheit leben.", "body_de": "## Bei Lordon\n\nZitiert in 20.6 (Anm. 55). Lordon sieht darin das Prinzip der Religionskriege und der „Zusammenstöße der Kulturen“, vor allem aber den Ursprung des *Urteils der Entfremdung*: Wir verweigern die Zustimmung derer, die nicht nach unserer Sinnesart leben (T022). Der Rest der Anmerkung („alle stehen einander gleichermaßen im Weg“) dient in 34.2 dazu, Herrschaft als Vorbehalt von Gegenständen des Begehrens zu denken (T036).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« chacun, par nature, désire que les autres vivent selon sa propre constitution »", "loc": ["20.6", "34.2"], "depends_on": [], "contre": [], "ethique": ["3p31csc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.6 (note 55). Lordon y voit le principe des guerres de religion et des « chocs de civilisations », et surtout l'origine du *jugement d'aliénation* : nous refusons le consentement de ceux qui ne vivent pas selon notre complexion (T022). La suite du scolie (« tous se font également obstacle ») sert en 34.2 à penser la domination comme réservation des objets de désir (T036).", "body_en": "## In Lordon\n\nQuoted in 20.6 (note 55). Lordon sees in it the principle of the wars of religion and of \"clashes of civilisations\", and above all the origin of the *judgement of alienation*: we refuse the consent of those who do not live according to our complexion (T022). The rest of the scholium (\"all equally stand in one another's way\") serves in 34.2 to think domination as the reserving of objects of desire (T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T022", "T036"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S14", "file": "premisses/S14.md", "type": "spinoza", "partie": "P", "titre": "Le bien et le mal, joie et tristesse", "enonce": "Par bien il faut entendre toute forme de joie et ce qui y conduit, notamment ce qui satisfait un désir ; par mal, toute forme de tristesse, notamment celle qui frustre un désir.", "titre_en": "Good and evil, joy and sadness", "enonce_en": "By good is to be understood every kind of joy and whatever leads to it, especially what satisfies a desire; by evil, every kind of sadness, especially that which frustrates a desire.", "titre_de": "Gut und Böse, Freude und Traurigkeit", "enonce_de": "Unter gut ist jede Art von Freude zu verstehen und was zu ihr führt, besonders was ein Begehren befriedigt; unter böse jede Art von Traurigkeit, besonders die, die ein Begehren vereitelt.", "body_de": "## Bei Lordon\n\nZitiert in Anm. 56 (20.6): Unsere Lieben und unser Hass lassen uns die Dinge bewerten; aus ihnen gehen unsere Urteile über das Leben anderer hervor.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["20.6"], "depends_on": [], "contre": [], "ethique": ["3p39sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 56 (20.6) : nos amours et nos haines nous font valoriser les choses ; c'est d'eux que procèdent nos jugements sur la vie des autres.", "body_en": "## In Lordon\n\nQuoted in note 56 (20.6): our loves and hatreds make us value things; from them proceed our judgements on the lives of others.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S15", "file": "premisses/S15.md", "type": "spinoza", "partie": "P", "titre": "L'obsequium : crainte ou amour", "enonce": "Les sujets relèvent du droit de la Cité, et non du leur propre, dans la mesure où ils craignent sa puissance ou dans la mesure où ils aiment la société civile.", "titre_en": "Obsequium: fear or love", "enonce_en": "Subjects are under the right of the Commonwealth, and not their own, to the extent that they fear its power or to the extent that they love civil society.", "titre_de": "Das Obsequium: Furcht oder Liebe", "enonce_de": "Die Untertanen stehen unter dem Recht des Gemeinwesens und nicht unter ihrem eigenen, insofern sie seine Macht fürchten oder insofern sie den bürgerlichen Zustand lieben.", "body_de": "## Bei Lordon\n\nZitiert in 21.3, in der Übersetzung von Charles Ramond (Anm. 58). Lordon zieht daraus „die bipolare affektive Wahrheit der Macht: Sie läuft mit Furcht oder mit Liebe“, gültig für alle Mächte, auch die des Arbeitgebers (D16, T024). Er liest den *Politischen Traktat* als allgemeine Theorie der Institutionen (Anm. 57).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Les sujets relèvent non de leur droit propre mais de celui de la Cité, dans la mesure même où ils craignent sa puissance, c’est-à-dire ses menaces, ou encore dans la mesure où ils aiment la société civile »", "loc": ["21.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, III, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3, dans la traduction de Charles Ramond (note 58). Lordon en tire « la vérité affective bipolaire du pouvoir : il fonctionne à la crainte ou à l'amour », valable pour tous les pouvoirs, y compris patronal (D16, T024). Il lit le *Traité politique* comme une théorie générale des institutions (note 57).", "body_en": "## In Lordon\n\nQuoted in 21.3, in Charles Ramond's translation (note 58). Lordon draws from it \"the bipolar affective truth of power: it runs on fear or on love\", valid for all powers, including the employer's (D16, T024). He reads the *Political Treatise* as a general theory of institutions (note 57).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D16", "T024"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S16", "file": "premisses/S16.md", "type": "spinoza", "partie": "P", "titre": "Une vie humaine", "enonce": "Les hommes aspirent à une vie humaine, qui ne se définit pas par la seule circulation du sang et les autres fonctions communes à tous les animaux.", "titre_en": "A human life", "enonce_en": "Men aspire to a human life, which is not defined merely by the circulation of the blood and the other functions common to all animals.", "titre_de": "Ein menschliches Leben", "enonce_de": "Die Menschen streben nach einem menschlichen Leben, das sich nicht bloß durch den Kreislauf des Blutes und die übrigen allen Tieren gemeinsamen Funktionen bestimmt.", "body_de": "## Bei Lordon\n\nZitiert in 21.3. Die Reproduktion des nackten Lebens geht kaum über „den Kreislauf des Blutes“ hinaus und bietet keinen Horizont für die Entfaltung der Handlungsmacht: daher das Interesse der Macht, ihre Untertanen zu erfreuen. Lordon vermerkt (Anm. 59), dass die Wendung wahrscheinlich auf Hobbes zielt. Sie kehrt am Ende des Buches wieder (43.2, 43.4): „darunter verstehe ich ein menschliches Leben“ ist das letzte Wort, das „wahre Gut“, auf das der Fortschritt ausgerichtet sein sollte (T049).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« une vie humaine, qui se définit non par la seule circulation du sang et par les autres fonctions communes à tous les animaux »", "loc": ["21.3", "43.2", "43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 5", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3. La reproduction de la vie nue ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon au déploiement de la puissance d'agir : d'où l'intérêt du pouvoir à réjouir ses sujets. Lordon note (note 59) que la formule vise probablement Hobbes. Elle revient à la fin du livre (43.2, 43.4) : « j'entends par là une vie humaine » est le dernier mot, le « vrai bien » vers lequel orienter le progrès (T049).", "body_en": "## In Lordon\n\nQuoted in 21.3. The reproduction of bare life hardly goes beyond \"the circulation of the blood\" and offers no horizon for the unfolding of the power of acting: hence power's interest in gladdening its subjects. Lordon notes (note 59) that the phrase probably targets Hobbes. It returns at the end of the book (43.2, 43.4): \"by that I mean a human life\" is the last word, the \"true good\" towards which progress should be oriented (T049).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S17", "file": "premisses/S17.md", "type": "spinoza", "partie": "P", "titre": "Le conatus cherche la joie", "enonce": "L'esprit s'efforce, autant qu'il le peut, d'imaginer ce qui accroît ou seconde la puissance d'agir du corps, et répugne à imaginer ce qui la réduit ; nous nous efforçons de promouvoir tout ce dont nous imaginons que cela conduit à la joie.", "titre_en": "The conatus seeks joy", "enonce_en": "The mind strives, as far as it can, to imagine what increases or aids the body's power of acting, and is averse to imagining what diminishes it; we strive to further whatever we imagine leads to joy.", "titre_de": "Der Conatus sucht die Freude", "enonce_de": "Der Geist strebt, soweit er kann, sich vorzustellen, was die Handlungsmacht des Körpers vermehrt oder fördert, und scheut sich, vorzustellen, was sie vermindert; wir streben, alles zu fördern, wovon wir uns vorstellen, dass es zur Freude führt.", "body_de": "## Bei Lordon\n\nDrei Lehrsätze, zusammen zitiert in 22.4. „Soweit es an ihm ist, sucht der Conatus seine Freude“, selbst in den ungünstigsten Lagen: Das ist die Triebfeder der spontanen Wiederverzauberung der Arbeit (T026).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’esprit, autant qu’il le peut, s’efforce d’imaginer ce qui accroît ou ce qui seconde la puissance d’agir du corps »", "loc": ["22.4", "22.8"], "depends_on": [], "contre": [], "ethique": ["3p12", "3p13c", "3p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nTrois énoncés cités ensemble en 22.4. « Autant qu'il est en lui, le conatus cherche sa joie », jusque dans les situations les plus défavorables : c'est le ressort du réenchantement spontané du travail (T026).", "body_en": "## In Lordon\n\nThree statements quoted together in 22.4. \"As far as it is in it, the conatus seeks its joy\", even in the most unfavourable situations: this is the mainspring of the spontaneous re-enchantment of work (T026).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T026"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S18", "file": "premisses/S18.md", "type": "spinoza", "partie": "P", "titre": "L'amour", "enonce": "L'amour est une joie accompagnée de l'idée d'une cause extérieure.", "titre_en": "Love", "enonce_en": "Love is a joy accompanied by the idea of an external cause.", "titre_de": "Die Liebe", "enonce_de": "Liebe ist eine Freude, begleitet von der Vorstellung einer äußeren Ursache.", "body_de": "## Bei Lordon\n\nIn Anm. 65 angeführt (Anmerkung zum Folgesatz von III, 13). Aus der genetischen Definition neu gedacht, liefert die Liebe „den allgemeinsten Begriff der Befriedigung an einem Gegenstand“, weit über die erotische Liebe hinaus; deshalb kann man von Liebe in der Lohnarbeit sprechen (23.2). Lordon übernimmt von Laurent Bove „die amouröse Struktur des Verhaltens“ beim Menschen.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p13csc", "3ad6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 65 (scolie du corollaire de III, 13). Refait d'après la définition génétique, l'amour donne « la notion la plus générale de la satisfaction objectale », bien au-delà de l'amour érotique ; c'est pourquoi on peut parler d'amour dans le salariat (23.2). Lordon reprend à Laurent Bove « la structure amoureuse du comportement » humain.", "body_en": "## In Lordon\n\nReferred to in note 65 (scholium to the corollary of III, 13). Redone from the genetic definition, love gives \"the most general notion of object satisfaction\", far beyond erotic love; this is why one can speak of love in wage labour (23.2). Lordon borrows from Laurent Bove \"the amorous structure of behaviour\" in humans.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S19", "file": "premisses/S19.md", "type": "spinoza", "partie": "P", "titre": "Réjouir les autres pour s'en réjouir", "enonce": "Nous nous efforçons de faire tout ce que nous imaginons que les hommes considèrent avec joie ; et qui agit d'une manière dont il imagine qu'elle réjouit les autres est affecté d'une joie accompagnée de l'idée de soi comme cause.", "titre_en": "Gladdening others to rejoice in it", "enonce_en": "We strive to do whatever we imagine men regard with joy; and whoever acts in a way he imagines gladdens others is affected with a joy accompanied by the idea of himself as cause.", "titre_de": "Andere erfreuen, um sich daran zu freuen", "enonce_de": "Wir streben, alles zu tun, wovon wir uns vorstellen, dass die Menschen es mit Freude betrachten; und wer so handelt, wie er sich vorstellt, dass es andere erfreut, wird von einer Freude affiziert, begleitet von der Vorstellung seiner selbst als Ursache.", "body_de": "## Bei Lordon\n\nAnm. 66 und 67 (23.1), in 23.2 wieder aufgenommen. Lordon gewinnt daraus den Mechanismus der „Forderung nach Liebe“: Ich tue, was den Herrn erfreut, damit er mich liebt und damit ich mich freue, ihn erfreut zu haben (T027).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« nous nous efforcerons d’accomplir tout ce que nous imaginons considéré avec joie par les hommes »", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p29", "3p30"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 66 et 67 (23.1), repris en 23.2. Lordon en tire le mécanisme de la « demande amoureuse » : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui (T027).", "body_en": "## In Lordon\n\nNotes 66 and 67 (23.1), taken up in 23.2. Lordon draws from it the mechanism of the \"demand for love\": I do what gladdens the master so that he loves me and so that I rejoice in having gladdened him (T027).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T027"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S20", "file": "premisses/S20.md", "type": "spinoza", "partie": "P", "titre": "L'affect, affection du corps et son idée", "enonce": "Par affects, il faut entendre les affections du corps par lesquelles sa puissance d'agir est accrue ou réduite, secondée ou réprimée, et en même temps les idées de ces affections.", "titre_en": "The affect, an affection of the body and its idea", "enonce_en": "By affects are to be understood the affections of the body by which its power of acting is increased or diminished, aided or restrained, and at the same time the ideas of these affections.", "titre_de": "Der Affekt, Affektion des Körpers und ihre Idee", "enonce_de": "Unter Affekten sind die Affektionen des Körpers zu verstehen, durch die seine Handlungsmacht vermehrt oder vermindert, gefördert oder gehemmt wird, und zugleich die Ideen dieser Affektionen.", "body_de": "## Bei Lordon\n\nZitiert in 23.2 (Anm. 69), wo Lordon daran erinnert, dass Spinoza die Freude als Vermehrung der Handlungsmacht des Körpers definiert: Der Conatus ist ein Streben nach mehr Macht, also Suche nach Freude; und in 28.2 (Anm. 87-88): Die Affekte schreiben sich zuerst in die Körper ein, haben *aber auch* einen geistigen Teil, als Ideen dieser Affektionen.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["23.2", "28.2"], "depends_on": [], "contre": [], "ethique": ["3def3"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 23.2 (note 69), où Lordon rappelle que la joie est définie par Spinoza comme augmentation de la puissance d'agir du corps : le conatus est effort vers davantage de puissance, donc recherche de la joie ; et en 28.2 (notes 87-88) : les affects s'inscrivent d'abord dans les corps, mais ont *aussi* une part mentale, comme idées de ces affections.", "body_en": "## In Lordon\n\nQuoted in 23.2 (note 69), where Lordon recalls that Spinoza defines joy as an increase in the body's power of acting: the conatus is a striving towards more power, hence a search for joy; and in 28.2 (notes 87-88): affects are inscribed first in bodies, but *also* have a mental part, as ideas of these affections.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S21", "file": "premisses/S21.md", "type": "spinoza", "partie": "P", "titre": "L'âme et le corps, une seule chose", "enonce": "L'âme et le corps sont une seule et même chose, conçue tantôt sous l'attribut de la Pensée, tantôt sous celui de l'Étendue ; il n'y a donc pas d'action causale de l'une sur l'autre.", "titre_en": "Mind and body, one and the same thing", "enonce_en": "Mind and body are one and the same thing, conceived now under the attribute of Thought, now under that of Extension; so there is no causal action of one on the other.", "titre_de": "Geist und Körper, ein und dasselbe Ding", "enonce_de": "Geist und Körper sind ein und dasselbe Ding, einmal unter dem Attribut des Denkens, einmal unter dem der Ausdehnung begriffen; daher gibt es keine kausale Einwirkung des einen auf den anderen.", "body_de": "## Bei Lordon\n\nDargelegt in 28.2, gegen Descartes' Zirbeldrüse, ohne genauen Verweis. *[rekonstruierter Verweis: III, 2 bestreitet, dass der Körper den Geist zum Denken oder der Geist den Körper zur Bewegung bestimmen kann; die Anmerkung sagt, dass sie ein und dasselbe Ding sind.]* Lordon schließt, dass die Ideen, die zum Denken gehören, „ohne Ort“ sind: Unsere Gemütszustände lassen sich nicht „innere“ nennen (T025).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["28.2"], "depends_on": [], "contre": [], "ethique": ["3p2", "3p2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExposé en 28.2, contre la glande pinéale de Descartes, sans renvoi précis. *[renvoi reconstruit : III, 2 nie que le corps puisse déterminer l'âme à penser et l'âme le corps au mouvement ; le scolie dit qu'ils sont une seule et même chose.]* Lordon en tire que les idées, appartenant à la Pensée, sont « sans lieu » : nos états d'âme ne sauraient être dits « intérieurs » (T025).", "body_en": "## In Lordon\n\nSet out in 28.2, against Descartes's pineal gland, without a precise reference. *[reconstructed reference: III, 2 denies that the body can determine the mind to think or the mind the body to move; the scholium says they are one and the same thing.]* Lordon concludes that ideas, belonging to Thought, are \"without place\": our states of mind cannot be called \"inner\" (T025).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T025"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S22", "file": "premisses/S22.md", "type": "spinoza", "partie": "P", "titre": "Faire croire aux hommes qu'ils vivent selon leur libre décret", "enonce": "Il faut conduire les hommes de telle façon qu'ils aient le sentiment, non d'être conduits, mais de vivre selon leur complexion et leur libre décret.", "titre_en": "Making men believe they live by their own free decree", "enonce_en": "Men must be led in such a way that they feel not that they are being led, but that they are living according to their own complexion and free decree.", "titre_de": "Die Menschen glauben machen, sie lebten nach ihrem freien Beschluss", "enonce_de": "Die Menschen müssen so geführt werden, dass sie nicht spüren, geführt zu werden, sondern nach ihrer eigenen Sinnesart und ihrem freien Beschluss zu leben.", "body_de": "## Bei Lordon\n\nEine an den Staat gerichtete Maxime politischer Klugheit (Anm. 92), in der Lordon „das Vorhaben des neoliberalen Unternehmens selbst“ erkennt (29.3) und die Formel des Coachings (30.1).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« conduire les hommes de façon telle qu’ils aient le sentiment, non pas d’être conduits, mais de vivre selon leur complexion et leur libre décret »", "loc": ["29.3", "30.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, X, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nMaxime de prudence politique adressée à l'État (note 92), où Lordon reconnaît « le projet même de l'entreprise néolibérale » (29.3) et la formule du coaching (30.1).", "body_en": "## In Lordon\n\nA maxim of political prudence addressed to the State (note 92), in which Lordon recognises \"the very project of the neoliberal firm\" (29.3) and the formula of coaching (30.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S23", "file": "premisses/S23.md", "type": "spinoza", "partie": "P", "titre": "On aime et hait davantage ce qu'on imagine libre", "enonce": "L'amour et la haine envers un objet que nous imaginons libre doivent être, à cause égale, plus grands qu'envers un objet nécessaire.", "titre_en": "We love and hate more what we imagine to be free", "enonce_en": "Love and hatred towards an object we imagine to be free must, other things being equal, be greater than towards a necessary object.", "titre_de": "Man liebt und hasst mehr, was man sich frei vorstellt", "enonce_de": "Liebe und Hass gegenüber einem Gegenstand, den wir uns frei vorstellen, müssen unter sonst gleichen Umständen größer sein als gegenüber einem notwendigen Gegenstand.", "body_de": "## Bei Lordon\n\nZitiert in 29.4 (Anm. 95): Spinoza „berührt hier den affektiven Mechanismus, der den politischen Konstruktivismen von vornherein ihre Grenze zieht“ (T032). Wieder aufgenommen in 34.3: Die soziale Teilung des Begehrens, diffus und unpersönlich, wird als Notwendigkeit erlebt, ein *fatum* ohne Gott (T036).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’amour et la haine doivent être plus grands, à cause égale, envers un objet que nous imaginons être libre qu’envers un objet nécessaire »", "loc": ["29.4", "34.3"], "depends_on": [], "contre": [], "ethique": ["3p49"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 29.4 (note 95) : Spinoza « touche là le mécanisme affectif qui trace d'emblée la limite des constructivismes politiques » (T032). Repris en 34.3 : la division sociale du désir, diffuse et impersonnelle, est vécue comme une nécessité, un *fatum* sans dieu (T036).", "body_en": "## In Lordon\n\nQuoted in 29.4 (note 95): Spinoza \"touches here the affective mechanism that from the outset draws the limit of political constructivisms\" (T032). Taken up in 34.3: the social division of desire, diffuse and impersonal, is experienced as a necessity, a *fatum* without a god (T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T032", "T036"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S24", "file": "premisses/S24.md", "type": "spinoza", "partie": "P", "titre": "Un affect ne cède qu'à un affect plus fort", "enonce": "Un affect ne peut être réprimé ni supprimé que par un affect contraire et plus fort que lui.", "titre_en": "An affect yields only to a stronger affect", "enonce_en": "An affect can be restrained or removed only by a contrary affect stronger than it.", "titre_de": "Ein Affekt weicht nur einem stärkeren Affekt", "enonce_de": "Ein Affekt kann nur durch einen entgegengesetzten, stärkeren Affekt gehemmt oder aufgehoben werden.", "body_de": "## Bei Lordon\n\nZitiert in 31.4 (Anm. 104): Anstelle von „Zustimmung“ gibt es nur den innerpsychischen Zusammenstoß freudiger und trauriger Affekte nach diesem Gesetz der Macht (T034).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« un affect ne peut être ni réprimé ni supprimé si ce n’est par un affect contraire et plus fort que l’affect à réprimer »", "loc": ["31.4"], "depends_on": [], "contre": [], "ethique": ["4p7"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 31.4 (note 104) : en fait de « consentement », il n'y a que l'affrontement intrapsychique des affects joyeux et tristes selon cette loi de puissance (T034).", "body_en": "## In Lordon\n\nQuoted in 31.4 (note 104): by way of \"consent\", there is only the intrapsychic clash of joyful and sad affects according to this law of power (T034).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S25", "file": "premisses/S25.md", "type": "spinoza", "partie": "P", "titre": "Être affecté de nombreuses manières est utile", "enonce": "Ce qui dispose le corps humain à être affecté de nombreuses manières, ou le rend capable d'affecter les corps extérieurs de nombreuses manières, est utile à l'homme ; d'où le conseil de donner au corps des apports aussi variés que sa structure est complexe.", "titre_en": "Being affected in many ways is useful", "enonce_en": "Whatever disposes the human body to be affected in many ways, or makes it capable of affecting external bodies in many ways, is useful to man; hence the advice to give the body nourishment as varied as its structure is complex.", "titre_de": "Auf viele Weisen affiziert zu werden ist nützlich", "enonce_de": "Was den menschlichen Körper so einrichtet, dass er auf viele Weisen affiziert werden kann, oder ihn fähig macht, äußere Körper auf viele Weisen zu affizieren, ist dem Menschen nützlich; daher der Rat, dem Körper eine Nahrung zu geben, die so vielfältig ist, wie sein Bau verwickelt ist.", "body_de": "## Bei Lordon\n\nZitiert in 33.3 (Anm. 106): Der „eigene Nutzen“ jedes Einzelnen besteht darin, den Fixierungen des Conatus zu entgehen, um die Vielfalt seiner Macht zu betätigen (T035). In 40.3 (Anm. 137-138) begründet er, mit der „diätetischen Anmerkung“ (Speisen, Düfte, Klänge, Augenfreuden), im Anschluss an Pascal Sévérac die Lesart der Entfremdung als Fixierung (D25, T044).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« ce qui prédispose la corps humain à être affecté selon de nombreuses modalités, ou le rend capable d’affecter les corps extérieurs selon de nombreuses modalités, est utile à l’homme »", "loc": ["33.3", "40.3"], "depends_on": [], "contre": [], "ethique": ["4p38", "4p45c2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 33.3 (note 106) : l'« utile propre » de chacun est d'échapper aux fixations du conatus pour effectuer la variété de sa puissance (T035). En 40.3 (notes 137-138), avec le « scolie diététique » (nourritures, senteurs, sons, plaisirs des yeux), il fonde, d'après Pascal Sévérac, la lecture de l'aliénation comme fixation (D25, T044).", "body_en": "## In Lordon\n\nQuoted in 33.3 (note 106): each one's \"own advantage\" is to escape the fixations of the conatus so as to enact the variety of its power (T035). In 40.3 (notes 137-138), with the \"dietary scholium\" (food, scents, sounds, pleasures of the eye), it grounds, following Pascal Sévérac, the reading of alienation as fixation (D25, T044).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25", "T035", "T044"], "corollaires": [], "mtime": 1794593716.1949716}, {"id": "S26", "file": "premisses/S26.md", "type": "spinoza", "partie": "P", "titre": "On ne peut pas ce qu'on imagine ne pas pouvoir", "enonce": "Ce qu'on imagine ne pas pouvoir, on l'imagine nécessairement, et l'on est par cette imagination même disposé de telle sorte qu'on ne le peut effectivement pas.", "titre_en": "One cannot do what one imagines one cannot do", "enonce_en": "What one imagines one cannot do, one imagines necessarily, and by this very imagination one is so disposed that one really cannot do it.", "titre_de": "Man kann nicht, was man sich vorstellt, nicht zu können", "enonce_de": "Was man sich vorstellt, nicht tun zu können, stellt man sich notwendig vor, und durch eben diese Vorstellung ist man so eingerichtet, dass man es wirklich nicht tun kann.", "body_de": "## Bei Lordon\n\nErläuterung der Definition der Affekte 28 (Anm. 107): „Da ist der leidenschaftliche Mechanismus, der Zuweisung in Selbstzuweisung verwandelt“ (34.1). Wieder aufgenommen in 37.5 für die „ohnmächtig machenden“ Wirkungen der Arbeitsteilung.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Tout ce qu’en effet l’on imagine ne pas pouvoir, on l’imagine nécessairement, et l’on est par cette imagination même disposé de telle sorte qu’on n’a effectivement pas le pouvoir qu’on imagine ne pas avoir »", "loc": ["34.1", "37.5"], "depends_on": [], "contre": [], "ethique": ["3ad28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExplication de la définition des affects 28 (note 107) : « voilà le mécanisme passionnel de conversion de l'assignation en auto-assignation » (34.1). Repris en 37.5 pour les effets d'« impuissantisation » de la division du travail.", "body_en": "## In Lordon\n\nExplanation of the definition of the affects 28 (note 107): \"there is the passional mechanism converting assignment into self-assignment\" (34.1). Taken up in 37.5 for the \"impotentising\" effects of the division of labour.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2087257}, {"id": "S27", "file": "premisses/S27.md", "type": "spinoza", "partie": "P", "titre": "Le désir cherche dans les autres sa confirmation", "enonce": "Si nous imaginons qu'un autre aime ou désire ce que nous-mêmes aimons ou désirons, nous l'aimerons ou le désirerons avec plus de constance.", "titre_en": "Desire seeks its confirmation in others", "enonce_en": "If we imagine that another loves or desires what we ourselves love or desire, we shall love or desire it more constantly.", "titre_de": "Das Begehren sucht seine Bestätigung bei den anderen", "enonce_de": "Stellen wir uns vor, dass ein anderer liebt oder begehrt, was wir selbst lieben oder begehren, so werden wir es beständiger lieben oder begehren.", "body_de": "## Bei Lordon\n\nAnm. 108. Mit der Anmerkung zum Folgesatz (S13) ist das der „primäre soziale Widerspruch des Begehrens“: Es sucht seine Bestätigung im Blick der anderen und versucht, die von seinen Gegenständen fernzuhalten, die es zu ihnen geführt hat (34.2; T036).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Si nous imaginons qu’un autre aime ou désire […] ce que nous-mêmes aimons ou désirons […], par là même nous aimerons, désirerons […] avec plus de constance »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": ["3p31"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 108. Avec le scolie du corollaire (S13), c'est la « contradiction sociale princeps du désir » : il cherche dans le regard des autres sa confirmation, et tente d'éloigner de ses objets ceux qu'il y a amenés (34.2 ; T036).", "body_en": "## In Lordon\n\nNote 108. With the scholium to the corollary (S13), this is the \"primary social contradiction of desire\": it seeks its confirmation in the gaze of others, and tries to keep away from its objects those it has brought to them (34.2; T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S13", "T036"], "corollaires": [], "mtime": 1794593716.2087257}, {"id": "S28", "file": "premisses/S28.md", "type": "spinoza", "partie": "P", "titre": "La nature est une et commune à tous", "enonce": "La nature humaine est une et commune à tous ; c'est la puissance et la culture qui nous trompent, en nous faisant juger différemment une même action selon qui la fait.", "titre_en": "Nature is one and common to all", "enonce_en": "Human nature is one and common to all; it is power and culture that deceive us, making us judge the same action differently according to who performs it.", "titre_de": "Die Natur ist eine und allen gemeinsam", "enonce_de": "Die menschliche Natur ist eine und allen gemeinsam; Macht und Bildung täuschen uns, indem sie uns dieselbe Handlung je nach dem, der sie vollzieht, verschieden beurteilen lassen.", "body_de": "## Bei Lordon\n\nAnm. 110 und 112. Für Lordon ist das „die radikalste Bekräftigung der grundlegenden anthropologischen Gleichheit“, die die Willkür der sozialen Klassifikationen verdeckt (34.2; T036). Er vergleicht sie mit der ersten der *Drei Reden über die Stellung der Großen* von Pascal: Euer Reichtum ist kein „Titel der Natur, sondern einer menschlichen Einrichtung“.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« La nature [humaine
