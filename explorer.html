 "titre": "L'indignation", "enonce": "L'indignation est la haine envers quelqu'un qui a fait du mal à autrui.", "citation": "", "loc": ["38.4", "39.5"], "depends_on": [], "contre": [], "ethique": ["3ad20"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Spinoza nomme génériquement “indignation” cet affect, non pas moral mais politique par excellence », qui coalise les sujets dans la révolte après une offense faite parfois à un seul (38.4). *[renvoi reconstruit : Lordon ne donne pas de référence ; la définition est celle de III, définition des affects 20. Le sens politique qu'il en tire vient surtout du* Traité politique.*]* L'indignation est le nom de la dynamique qui « réouvre l'angle α » (39.5 ; T043).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T043"], "corollaires": [], "mtime": 1794561825.2963364}, {"id": "S31", "file": "premisses/S31.md", "type": "spinoza", "partie": "P", "titre": "Les affects, propriétés naturelles de l'homme", "enonce": "Les affects doivent être considérés comme des propriétés de la nature humaine, au même titre que la chaleur, le froid, la tempête ou le tonnerre appartiennent à la nature de l'air : fâcheux, mais nécessaires, et ayant des causes déterminées.", "citation": "« comme des propriétés qui appartiennent [à la nature humaine], comme appartiennent à la nature de l’air chaleur, froid, tempête, tonnerre […] »", "loc": ["41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 4", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 141. Les affects, quoique éprouvés individuellement, « n'ont rien de subjectif : ils sont objectivement causés » ; le rapport subjectif du salarié à sa situation est objectivement produit (41.3 ; T045).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T045"], "corollaires": [], "mtime": 1794561825.2963364}, {"id": "S32", "file": "premisses/S32.md", "type": "spinoza", "partie": "P", "titre": "L'affect commun qui assemble une multitude", "enonce": "Une multitude s'assemble et s'accorde non par la raison, mais sous l'effet d'un affect commun.", "citation": "« l’affect commun par lequel une multitude pourrait venir à s’assembler »", "loc": ["41.5"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nParaphrase du *Traité politique*, VI, 1, signalée comme telle (note 143) : en maltraitant, le capitalisme nourrit l'affect commun du mécontentement (41.5 ; T046).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T046"], "corollaires": [], "mtime": 1794561825.2973597}, {"id": "S33", "file": "premisses/S33.md", "type": "spinoza", "partie": "P", "titre": "L'affect tenace", "enonce": "La force d'une passion peut surpasser les autres actions d'un homme, ou sa puissance, au point que l'affect se fixe en lui de façon tenace.", "citation": "« La force d’une passion, ou affect, peut surpasser les autres actions d’un homme, ou sa puissance, au point que l’affect se fixe en lui d’une façon tenace »", "loc": ["40.2"], "depends_on": [], "contre": [], "ethique": ["4p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 135. Avec « l'occupation de l'esprit » (Sévérac, note 136), c'est le sens à donner à l'aliénation, si l'on veut sauver le mot : l'esprit rempli par trop peu de choses, mais entièrement (40.2 ; D25).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25"], "corollaires": [], "mtime": 1794561825.2973597}, {"id": "S34", "file": "premisses/S34.md", "type": "spinoza", "partie": "P", "titre": "Rien n'est plus utile à l'homme que l'homme", "enonce": "Rien n'est plus utile à l'homme que l'homme ; les hommes conduits par la raison ne poursuivent rien pour eux-mêmes qu'ils ne le désirent aussi pour les autres.", "citation": "« rien n’est plus utile à l’homme que l’homme »", "loc": ["42.2", "43.1"], "depends_on": [], "contre": [], "ethique": ["4p18sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 147 et 155. La première formule éclaire la division du travail, « ce que les hommes ont de meilleur » (42.2 ; T047) ; la seconde donne « la formule la plus haute du communisme », la non-rivalité des vrais biens (43.1 ; T048).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047", "T048"], "corollaires": [], "mtime": 1794561825.2973597}, {"id": "S35", "file": "premisses/S35.md", "type": "spinoza", "partie": "P", "titre": "La joie de se considérer soi-même", "enonce": "La joie de considérer sa propre puissance se renouvelle chaque fois qu'on considère ses vertus : chacun s'empresse donc de raconter ses hauts faits et d'étaler ses forces, et c'est pourquoi les hommes sont pénibles les uns aux autres.", "citation": "« chacun s’empresse de raconter ses faits et gestes et d’étaler ostensiblement ses forces physiques et morales ; c’est pour cette raison aussi que les hommes sont pénibles les uns aux autres »", "loc": ["42.2"], "depends_on": [], "contre": [], "ethique": ["3p55c1sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 148. Lordon prolonge le propos « au-delà de ce qu'il dit textuellement » : le pénible est aussi la captation individuelle des joies extrinsèques de l'action collective (42.2 ; T047).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047"], "corollaires": [], "mtime": 1794561825.2989016}, {"id": "S36", "file": "premisses/S36.md", "type": "spinoza", "partie": "P", "titre": "Le vrai bien est commun", "enonce": "Le bien que désire pour soi celui qui suit la vertu, il le désirera aussi pour les autres ; les hommes, en tant qu'ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes.", "citation": "« les hommes, en tant qu’ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes »", "loc": ["42.4"], "depends_on": [], "contre": [], "ethique": ["4p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 153. Le vrai bien est celui dont il faut souhaiter que les autres le possèdent en même temps que soi, comme la raison : c'est « peut-être la définition du communisme véritable » (42.4 ; T048).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794561825.299909}, {"id": "S37", "file": "premisses/S37.md", "type": "spinoza", "partie": "P", "titre": "Prendre les hommes tels qu'ils sont", "enonce": "En politique, il faut prendre les hommes tels qu'ils sont et non tels qu'on voudrait qu'ils soient, sous peine de n'écrire qu'une chimère bonne pour l'île d'Utopie.", "citation": "« tels qu’ils sont et non tels qu’ [on] voudrait qu’ils fussent »", "loc": ["23.3", "42.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 150-151. Lordon y lit la version spinoziste de la vertu matérialiste selon Althusser : « ne plus se raconter d'histoires » (42.4). Le *Traité politique* est déjà cité ainsi en 23.3 (note 72).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.299909}, {"id": "S38", "file": "premisses/S38.md", "type": "spinoza", "partie": "P", "titre": "Cultiver la vie ou éviter la mort", "enonce": "Une Cité qui ne tient ses sujets que par la crainte mérite le nom de solitude plutôt que de Cité ; une multitude conduite par l'espoir s'applique à cultiver la vie, une multitude soumise par la crainte, seulement à éviter la mort.", "citation": "« L’une s’applique à cultiver la vie, l’autre seulement à éviter la mort »", "loc": ["43.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 4 et V, 6", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 157-158. Lordon restitue le mot « solitude » de la traduction d'Appuhn. C'est par là que « se hiérarchisent les différents régimes de la vie passionnelle collective » : non par le relâchement de la servitude, mais par le jeu plus ou moins réjouissant de leurs formes institutionnelles (43.2 ; T049).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794561825.299909}, {"id": "S39", "file": "premisses/S39.md", "type": "spinoza", "partie": "P", "titre": "Le conatus n'exclut ni conflits ni haines", "enonce": "Le droit naturel, qui s'étend aussi loin que la puissance de chacun, n'exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni rien de ce que l'appétit conseille.", "citation": "« n’exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni absolument rien de ce que l’appétit conseille »", "loc": ["43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, II, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 161. Lordon ajoute que Spinoza fait remarquer que, si les hommes étaient des sages, conduits par la raison, ils n'auraient besoin ni de lois ni d'institutions politiques ; mais ils ne le sont pas (43.3). D'où l'impossibilité d'une éradication définitive de la violence, que rêvait Marx (43.3 ; T048).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794561825.3014214}, {"id": "S40", "file": "premisses/S40.md", "type": "spinoza", "partie": "P", "titre": "La démocratie, État absolu en tout", "enonce": "La démocratie est le troisième type d'État, « absolu en tout » (*omnino absolutum imperium*).", "citation": "« J’en viens enfin à ce troisième type d’État, absolu en tout, que nous appelons “démocratique” »", "loc": ["43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, XI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 164. Chapitre inachevé, « ouverture à la fois opaque et vertigineuse » : la promesse de l'État absolu serait celle de la multitude à nouveau souveraine, toute *potestas* émanant de la *potentia multitudinis* (43.4, note 162 ; T049).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794561825.3014214}, {"id": "T001", "file": "theses/T001.md", "type": "these", "partie": "0", "titre": "Le pouvoir patronal est un effet de structure qui agit par les affects", "enonce": "Que certains hommes, les patrons, « puissent » en amener d'autres à entrer dans leur désir, ce pouvoir ne leur appartient pas : il est l'effet de la structure du rapport salarial. Mais les structures ne disent pas ce qui fait leur efficacité ; la réponse spinoziste est : les affects. D'où le programme du livre : combiner un structuralisme des rapports (Marx) et une anthropologie des passions (Spinoza).", "citation": "« la proposition de combiner un structuralisme des rapports et une anthropologie des passions »", "loc": ["01.2", "01.3", "01.4", "01.5"], "depends_on": ["M01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La Boétie avertit que l'habitude de la servitude en fait perdre de vue la condition : les asservissements réussis coupent, dans l'imagination des asservis, les affects tristes de l'idée de l'asservissement. Ainsi le fait patronal, très étonnant, n'étonne plus personne (01.2).\n2. Ce pouvoir n'appartient pas aux patrons : par M01, il est l'effet d'une configuration de structures sociales, le rapport salarial comme double séparation (01.3).\n3. Dégager les structures ne dit pas encore « à quoi » elles fonctionnent : ce qui fait *in concreto* leur efficacité, « non pas le fantôme mais le moteur dans la machine ». La réponse spinoziste est : les affects (01.4).\n4. « La vie sociale n'est que l'autre nom de la vie passionnelle collective » : sous des formes institutionnelles très diverses, affects et forces de désir restent le *primum mobile*. Reconnaître que les affects sont structurés n'interdit donc pas de reprendre le problème salarial « par les passions » (01.5). ∎\n\n## Scolie\n\nL'avant-propos s'ouvre sur Kant : le libéralisme commande de ne jamais traiter l'humanité simplement comme un moyen ; le salariat est cette « magnifique rencontre de deux libertés », celle des uns d'utiliser les autres et celle des autres de se laisser utiliser (01.1). Marx est postérieur à Spinoza, mais c'est Spinoza qui peut aider à le compléter (01.4). Le livre ne prétend pas ajouter à la psychologie ou à la sociologie du travail dans leur registre, mais leur faire « une proposition plus abstraite » (01.3).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["M01"], "mentions": ["M01"], "corollaires": [], "mtime": 1794561825.3024342}, {"id": "T002", "file": "theses/T002.md", "type": "these", "partie": "0", "titre": "Les dominés heureux et le triangle de l'engagement pour autrui", "enonce": "Le capitalisme contemporain produit des salariés contents, qui déconcertent une idée trop simple de la domination ; faute de demander ce que consentir veut dire, on se rabat sur la « servitude volontaire ». Il faut plutôt partir du triangle élémentaire : le désir d'un, la puissance d'agir des autres, et les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre.", "citation": "« le désir d’un, la puissance d’agir des autres, les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre »", "loc": ["01.5", "01.6", "01.7", "01.8", "01.9"], "depends_on": ["T001"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T001, il faut reprendre le salariat par les passions. Or il faut alors tenir ensemble des faits disparates : aller au travail pour ne pas dépérir, être racheté par ses plaisirs de consommateur, engloutir sa vie au travail, adhérer avec enthousiasme, basculer un jour dans la révolte (01.5).\n2. Le paysage passionnel du capitalisme contemporain est bien plus riche qu'au temps de Marx. Les cadres, « matériellement du côté du travail et symboliquement du côté du capital », sont le prototype du salariat content, alors même que le capitalisme régresse *aussi* vers la coercition la plus brutale. Une idée trop simple de la domination est « déconcertée au spectacle des dominés heureux » (01.6-01.7).\n3. Faute de demander ce que consentir veut dire, les faits de « consentement » déstabilisent les concepts d'exploitation, d'aliénation et de domination, et l'on ressasse la formule de la servitude volontaire (R01), oxymore suggestif mais impropre à la théorie (01.8).\n4. Être mobilisé, réticent ou révolté, ce sont autant de manières d'être affecté comme salarié, c'est-à-dire déterminé à entrer dans un désir qui n'est pas d'abord le sien. Le mystère de l'engagement pour autrui se loge dans le triangle du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre (01.9). ∎\n\n## Scolie\n\nLordon reconnaît le travail de la sociologie héritière de Bourdieu, dont la violence symbolique visait ce croisement de la domination et du consentement (01.7) ; rendre les dominés contents est l'une des plus vieilles ficelles de l'art de régner. Le but est de « discuter » le capitalisme, au double sens de la critique et de l'analyse, avec l'espoir qu'il entre « dans la région du dépassable » (01.9). Le chapitre 1 donne leurs noms aux sommets du triangle : désir-maître (D03), enrôlement (D02) ; la question du consentement est l'objet du chapitre 2.", "sections": ["Argumentation", "Scolie"], "demo_refs": ["R01", "T001"], "mentions": ["D02", "D03", "R01", "T001"], "corollaires": [], "mtime": 1794561825.3024342}, {"id": "T003", "file": "theses/T003.md", "type": "these", "partie": "1", "titre": "Le désir de faire est légitime, non le désir de faire faire", "enonce": "Au sens du conatus, la liberté d'entreprendre est la liberté de désirer, irréfragable sous les restrictions que fixe chaque société. Mais cette légitimité ne s'étend pas au désir de faire faire : dès qu'une entreprise enrôle d'autres puissances d'agir, se pose la question politique de la participation à son organisation et de l'appropriation de ses produits, celle de la capture par un désir-maître.", "citation": "« la légitimité de son “envie de faire” ne s’étend pas à une envie de faire faire »", "loc": ["03.1", "04.1"], "depends_on": ["D01", "D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, exister, c'est désirer et s'activer ; *conor* signifie « entreprendre ». L'histoire délimite les objets de désir licites ; sous ces réserves, la liberté d'entreprendre est celle du conatus, et jouit d'une évidence *a priori* (03.1).\n2. L'entreprise, en tant que désir, se conçoit donc légitimement en première personne : « j'ai envie de faire quelque chose ». Fort bien, « mais qu'il le fasse lui-même – s'il le peut » (04.1).\n3. La division du travail, jointe à l'ambition des hommes, conduit à poursuivre la plupart des désirs de production collectivement. Embarquer d'autres puissances dans son désir, c'est l'enrôlement (D02) ; c'est là que naît le rapport salarial (04.1).\n4. Cette liberté-là n'est pas *a priori* : la collaboration pose la question de ses formes politiques, celle de la capture par le sujet du désir-maître (D03) (04.1). ∎\n\n## Scolie\n\nL'entrepreneur qui proteste qu'on bride sa « liberté d'entreprendre » ne parle que des élans de son conatus : « J'ai un désir conforme à la division du travail et on m'empêche de le poursuivre » (03.1). Sur ce point, Lordon lui donne raison : rapportée à la constitution désirante de chaque être, « cette liberté-là est irréfragable » (03.1).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "D02", "D03"], "mentions": ["D01", "D02", "D03"], "corollaires": [], "mtime": 1794562498.1433263}, {"id": "T004", "file": "theses/T004.md", "type": "these", "partie": "1", "titre": "Le salariat est un cas du patronat, dont le problème est la mobilisation", "enonce": "L'enrôlement au service d'un désir-maître se rencontre bien au-delà de l'entreprise capitaliste : le salariat n'en est qu'un cas. Tout patronat doit faire se mouvoir des corps au service d'un désir qui n'est pas le leur ; la mobilisation est sa préoccupation constitutive, et la méthode du patronat capitaliste est d'abord l'argent.", "citation": "", "loc": ["04.2", "05.1"], "depends_on": ["D04", "D05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D05, le rapport salarial est un rapport d'enrôlement ; par D04, le patronat au sens général est tout rapport sous lequel un désir-maître mobilise des puissances enrôlées (04.2).\n2. Ce rapport se retrouve chez le chef de guerre, le croisé, le souverain, le dirigeant d'ONG, le mandarin universitaire, l'artiste : tous captent l'effort de leurs subordonnés (04.2).\n3. Capter suppose de mettre en mouvement. Que des personnes « acceptent » de s'activer pour un désir qui n'est pas le leur est très étrange ; seule l'habitude fait oublier l'immense travail social requis pour produire du « se mouvoir pour autrui » (05.1).\n4. Chaque patronat a ses méthodes ; celle du patronat capitaliste est *d'abord* l'argent (05.1). ∎", "sections": ["Argumentation"], "demo_refs": ["D04", "D05"], "mentions": ["D04", "D05"], "corollaires": [], "mtime": 1794561825.3044004}, {"id": "T005", "file": "theses/T005.md", "type": "these", "partie": "1", "titre": "Tous les comportements sont intéressés", "enonce": "Le patronat fonctionne à l'intérêt, c'est-à-dire au désir. Puisque l'effort de persévérer n'est jamais poursuivi qu'en première personne, toute conduite, y compris le don, doit être dite intéressée, au sens large d'un intérêt qui n'est pas le calcul.", "citation": "« ce désir-intérêt au principe de toutes les servitudes »", "loc": ["05.2"], "depends_on": ["D06", "D01"], "contre": ["R02"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D06, l'intérêt est l'objet du désir sous un autre nom ; posée l'essence désirante de l'homme (D01), tous ses comportements sont donc intéressés (05.2).\n2. Il ne reste « rien » de l'altruisme pur, mais « tout » de la chaleur des relations, si l'on refuse de réduire l'intérêt au calcul : il y a de l'intérêt dans la reconnaissance escomptée d'un don, dans l'attente d'être aimé en retour, dans les profits symboliques, sur d'autres modes que le calcul explicite (05.2).\n3. Les amis du désintéressement (R02) valident la réduction utilitariste qu'ils combattent, en abandonnant le mot d'intérêt à l'adversaire (05.2).\n4. Le conatus unifie toute la gamme des intérêts, de l'économique au moral, au symbolique et au psychique ; les rapports sociaux du capitalisme puisent dans cette gamme bien plus largement que ne le croit une lecture économiciste (05.2). ∎", "sections": ["Argumentation"], "demo_refs": ["D01", "D06", "R02"], "mentions": ["D01", "D06", "R02"], "corollaires": [], "mtime": 1794561825.3054073}, {"id": "T006", "file": "theses/T006.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est d'abord une dépendance à l'argent", "enonce": "Dans une économie à travail divisé, la reproduction matérielle, la « vie nue », passe par l'argent, et le capitalisme ne naît qu'en fermant les dernières possibilités d'autoproduction. Le rapport salarial est donc d'abord un rapport de dépendance, où l'employeur détient les conditions de la reproduction du salarié ; l'argent, qui conditionne presque tous les autres désirs, devient l'objet d'un métadésir.", "citation": "« le fond inamovible, l’arrière-plan permanent de tout ce qui pourra s’élaborer par là-dessus »", "loc": ["06.1", "06.2", "06.3", "07.3"], "depends_on": ["D07", "M02", "D05", "S02", "D08"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le capitalisme commence par le désir basal (D07), qui passe par l'argent dans une économie à travail divisé. Par l'accumulation primitive (M02), il ferme l'autoproduction et porte l'hétéronomie matérielle à un degré inouï : la dépendance intégrale à la division marchande du travail est sa condition de possibilité (06.1).\n2. Par D05, le rapport salarial permet à certains d'impliquer les autres dans leur entreprise ; il n'est possible qu'en faisant de l'argent le passage obligé et exclusif du désir basal. C'est d'abord un rapport de dépendance, fond permanent de tout le reste (06.2).\n3. Les « plans » plus raffinés (avancement, socialisation, « épanouissement ») peuvent à tout instant s'effondrer, et ne laisser debout que la dépendance matérielle, « fond brut de menace jetée sur la vie à nouveau nue » (06.2).\n4. Il n'y a que deux fournisseurs d'argent, l'employeur et le financier ; pour le salarié, c'est l'employeur. L'argent conditionne presque tous les autres désirs : c'est le « condensé de tous les biens » de Spinoza (S02), objet de métadésir (06.3).\n5. Par D08, ce désir est l'expression subjective du rapport social monétaire, dont toute l'armature institutionnelle fournit à l'économie marchande du désir l'un de ses attracteurs les plus puissants (07.3). ∎\n\n## Scolie\n\nLordon dit devoir rappeler cette évidence parce que les discours sur l'« enrichissement du travail », le « management participatif » et la « réalisation de soi » finissent par la faire oublier (06.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D05", "D07", "D08", "M02", "S02"], "mentions": ["D05", "D07", "D08", "M02", "S02"], "corollaires": [], "mtime": 1794561825.3064167}, {"id": "T007", "file": "theses/T007.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est un rapport de domination", "enonce": "La dépendance au désir d'argent, dont les employeurs sont les seuls pourvoyeurs, fait du rapport salarial un rapport de domination. L'intensité d'une domination étant proportionnée à celle du désir dont le dominant tient la clé, il n'y a pas, dans le capitalisme, de plus puissante emprise que l'enrôlement salarial.", "citation": "« il n’y a pas plus impérieux que le désir d’argent, par conséquent pas de plus puissante emprise que celle de l’enrôlement salarial »", "loc": ["08.1"], "depends_on": ["D09", "T006", "M03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T006, la mise en mouvement des corps salariés tire son énergie de la fixation du désir sur l'argent, dont les employeurs sont établis comme seuls pourvoyeurs (08.1).\n2. Par D09, il y a domination quand un agent doit passer par un autre pour accéder à son objet de désir : le rapport salarial est donc un rapport de domination (08.1).\n3. L'intensité de la domination est proportionnée à l'intensité du désir du dominé dont le dominant détient la clé (08.1).\n4. Or, quand l'hétéronomie matérielle est radicale, l'argent conditionne tous les autres désirs, et par M03 il faut d'abord vivre : aucun désir n'est plus impérieux (08.1).\n5. De 2, 3 et 4 : nulle emprise n'est plus puissante que l'enrôlement salarial (08.1). ∎", "sections": ["Démonstration"], "demo_refs": ["D09", "M03", "T006"], "mentions": ["D09", "M03", "T006"], "corollaires": [], "mtime": 1794561825.307417}, {"id": "T008", "file": "theses/T008.md", "type": "these", "partie": "1", "titre": "L'hétéronomie du désir", "enonce": "Le conatus est un élan sans direction définie, un « désir sans objet ». Ses objets lui sont tous désignés du dehors, par les affections qu'il rencontre, par la mémoire et l'association, par l'imitation des désirs d'autrui. Rien, dans la vie passionnelle, n'est de l'ordre d'une volonté autonome.", "citation": "", "loc": ["08.3", "08.4"], "depends_on": ["D01", "S03", "S04", "S05", "S06"], "contre": ["R03"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par D01, le conatus est force désirante ; ontologiquement, il est pur élan sans direction définie, « désir sans objet » selon Laurent Bove (08.3).\n2. Par S03, le désir est l'essence de l'homme déterminée par une affection à faire quelque chose : c'est une affection antécédente qui lui donne direction et objet (08.3).\n3. Par S04, ce n'est pas le désirable qui attire le désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir. La conception ordinaire (R03) est renversée (08.3).\n4. La séquence élémentaire est : une affection (ce qui arrive), un affect (son effet, triste ou joyeux), l'envie de faire qui s'ensuit. La vie du désir l'élabore par la mémoire et l'association (S05), et par l'imitation des désirs d'autrui (S06), surtout à travers des médiations sociales (08.3).\n5. Le désir et les affects sont donc profondément hétéronomes, fruits des rencontres et des dispositions formées le long de trajectoires sociales : rien d'une volonté autonome ni d'une libre autodétermination (08.4). ∎", "sections": ["Démonstration"], "demo_refs": ["D01", "R03", "S03", "S04", "S05", "S06"], "mentions": ["D01", "R03", "S03", "S04", "S05", "S06"], "corollaires": [], "mtime": 1794561825.307417}, {"id": "T009", "file": "theses/T009.md", "type": "these", "partie": "1", "titre": "La servitude volontaire n'existe pas", "enonce": "On n'est pas asservi par défaut de volonté, mais par la nécessité et l'intensité d'un désir, que les structures configurent : dans l'hétéronomie matérielle, le désir de persévérer devient désir d'argent, puis désir d'emploi salarié. Les véritables chaînes sont nos affects et nos désirs : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle, et elle est universelle.", "citation": "« La servitude volontaire n’existe pas. Il n’y a que la servitude passionnelle. Mais elle est universelle. »", "loc": ["08.2", "08.4"], "depends_on": ["T006", "T007", "T008", "S07"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le rapport salarial expose « dans sa nudité » le principe réel de l'asservissement : la nécessité et l'intensité d'un désir (T007) (08.2).\n2. Ce désir ne s'impose pas sur le mode du libre choix. Par T006, les structures de l'hétéronomie matérielle déterminent le désir de persévérer comme désir d'argent, et celui-ci comme désir d'emploi salarié ; parler ici de servitude volontaire, ce serait le dire aussi de l'otage qui obéit, un pistolet sur la tempe (08.2).\n3. L'exemple salarial n'est pas une exception : par T008, l'hétéronomie du désir est une absolue généralité (08.3-08.4).\n4. Par S07, la servitude est l'impuissance à diriger ses affects ; l'ordre fortuit des rencontres et les lois de la vie affective font de l'homme un « automate passionnel » (08.4).\n5. L'idée de servitude volontaire (R01) exprime le refus individualiste de ce verdict d'hétéronomie ; Spinoza propose un autre mécanisme de l'aliénation, par les affects et les désirs. La servitude n'est donc pas volontaire mais passionnelle, et elle est universelle (08.4). ∎", "sections": ["Démonstration"], "demo_refs": ["R01", "S07", "T006", "T007", "T008"], "mentions": ["R01", "S07", "T006", "T007", "T008"], "corollaires": [], "mtime": 1794561825.3089268}, {"id": "T010", "file": "theses/T010.md", "type": "these", "partie": "1", "titre": "La dépendance du capital et du travail est asymétrique", "enonce": "La symétrie formelle du capital et du travail cède devant deux faits : la force de travail est fongible, et le capital peut attendre alors que le salarié doit se reproduire chaque jour. Quant aux places de capitaliste et de salarié, c'est l'accès à l'argent qui les distribue : en flux pour le salarié, ce qui ne permet que de se reproduire ; en stock pour le capitaliste, ce qui permet l'avance et l'accumulation.", "citation": "« C’est une question de fric au départ »", "loc": ["09.1", "09.2", "09.3", "09.4"], "depends_on": ["T006", "D07", "M02"], "contre": ["R04"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T006, l'employeur, pourvoyeur d'argent, tient la clé du désir basal du salarié (09.1).\n2. On objecte (R04) que l'employeur dépend lui aussi de la force de travail. Mais il lui faut *de la* force de travail, non *sa* force de travail : le grand nombre des employés la rend fongible (09.2).\n3. Est dominé celui des deux qui peut le moins différer l'obtention de son objet ; or c'est le capital qui a le temps d'attendre. La situation réelle distord donc la symétrie formelle en dépendance, et en domination (09.2).\n4. En amont, le capitaliste a besoin d'un stock de fonds propres, que le banquier ne fait que compléter : le mode salarial d'accès à l'argent est le flux, le mode financier est le stock, qui seul permet de franchir le seuil de l'accumulation (09.3).\n5. Ceux qui n'ont que leur force de travail sont hors course dès le départ : Antoine Doinel, qui songe à voler un meuble pour se lancer, retrouve l'effraction de l'accumulation primitive (M02). Les autres restent rivés au désir basal (D07), dont la seule satisfaction offerte est l'enrôlement salarial (09.4). ∎", "sections": ["Argumentation"], "demo_refs": ["D07", "M02", "R04", "T006"], "mentions": ["D07", "M02", "R04", "T006"], "corollaires": [], "mtime": 1794561825.309937}, {"id": "T011", "file": "theses/T011.md", "type": "these", "partie": "1", "titre": "Domination à tous les étages", "enonce": "La grande entreprise diffracte la domination principale en une chaîne hiérarchique de dominations secondaires, où chacun est à la fois subordonné et subordonnant : une structure hiérarchique de la servitude passionnelle, chaîne montante de dépendance et descendante d'instrumentalisation. L'allongement de ces chaînes règle les conduites : il impose de ménager les intermédiaires, et produit la retenue, le compromis et le calcul.", "citation": "", "loc": ["10.1", "10.2"], "depends_on": ["T007", "T009", "D10"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le face-à-face du patron et des prolétaires (T007) a cédé la place à des structures feuilletées, où chacun vit le rapport salarial sur le mode subordonné-subordonnant (10.1).\n2. La thèse de La Boétie vaut ici mieux que son titre : il décrit une *structure hiérarchique de la servitude*, où les individus sont tenus séparément par leurs intérêts. Son renversement ne peut être à la portée d'une « volonté » (T009), puisqu'à chaque étage la domination est d'autant plus intense que le dominant local est lui-même dominé (10.1).\n3. Norbert Elias, « continuateur de La Boétie », montre que l'allongement des chaînes de dépendance incite à réguler les comportements : rompre avec éclat, c'est rompre avec celui par qui passe la poursuite des biens convoités (10.2).\n4. Le chemin du sujet désirant à l'objet désiré devient une médiation stratégique au sens de D10, que l'action soit calculée ou conduite par des habitudes incorporées (10.2). ∎", "sections": ["Argumentation"], "demo_refs": ["D10", "T007", "T009"], "mentions": ["D10", "T007", "T009"], "corollaires": [], "mtime": 1794561825.3114462}, {"id": "T012", "file": "theses/T012.md", "type": "these", "partie": "1", "titre": "La crainte et la violence se propagent le long des chaînes de dépendance", "enonce": "Toute pression venue d'en haut descend en cascade le long de la hiérarchie. Le désir d'argent restant impérieux tandis que ses conditions se durcissent, la crainte se diffuse et pousse chacun à un surcroît d'activité, qu'il reporte en violence sur ceux qui dépendent de lui. Contrainte actionnariale, concurrence et sous-traitance propagent ainsi la violence dans les entreprises et entre elles.", "citation": "« l’implacable logique qui veut que les violences exercées soient proportionnelles aux violences subies »", "loc": ["11.1", "11.2", "11.3"], "depends_on": ["T011", "S08", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T011, à chaque échelon, conserver sa position exige l'effort réclamé par l'échelon supérieur ; une pression venue d'en haut se propage donc à tous les étages, et la probabilité d'y satisfaire diminue (11.1).\n2. Par S08, la crainte accompagne le désir dès que son objet est incertain. Le désir restant intense et ses conditions plus difficiles, la balance de l'espoir et de la crainte penche vers la crainte (11.1).\n3. Par S09, comme tout affect triste, la crainte induit un surcroît de puissance d'agir pour s'en défaire ; dans un contexte de domination, ce surcroît se traduit en violence exercée sur ceux qu'on peut dominer, et sur soi (11.1).\n4. Le choc actionnarial est réexprimé en objectifs intermédiaires à chaque échelon ; reporting, mise en concurrence interne et menace du déclassement élèvent la sanction de l'échec, donc la crainte (11.2).\n5. Les relations entre entreprises forment aussi des chaînes de dépendance : la sous-traitance jette les organisations les unes contre les autres pour leur survie, et chacun reporte sa contrainte sur ceux qui dépendent de lui (11.2-11.3). ∎\n\n## Scolie\n\nExemple d'un ancien dirigeant de PME (*Ma mondialisation*, documentaire de Gilles Perret, note 27) : des donneurs d'ordre envoient à dessein de jeunes cadres, plus vulnérables, donc plus enclins à la violence économique, exiger des baisses de prix (11.3).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["S08", "S09", "T011"], "mentions": ["S08", "S09", "T011"], "corollaires": [], "mtime": 1794561825.3114462}, {"id": "T013", "file": "theses/T013.md", "type": "these", "partie": "1", "titre": "Le salariat attache aussi par la joie : le salaire et la marchandise", "enonce": "Les salariés ne tiennent pas au rapport d'enrôlement sous la seule contrainte : ils y trouvent des occasions de joie. La première est le salaire, joie de basse intensité ; la seconde, plus franche, est la consommation. La marchandise, en démultipliant les objets du désir, accroît la dépendance salariale tout en l'accompagnant d'affects joyeux, au point de durcir un renoncement au renversement du capitalisme.", "citation": "", "loc": ["12.1", "12.2", "12.3", "12.4"], "depends_on": ["T006", "S02", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Comprendre ce qui fait durer le capitalisme, c'est saisir toute la variété de ses affects : les salariés y trouvent aussi un certain compte, des occasions de joie (12.1).\n2. Par T006, le salaire satisfait le désir basal ; son obtention est le moment joyeux du rapport salarial. La joie doit être prise « avec une certaine froideur analytique » : elle peut être très basse, comme l'est d'avoir la vie sauve dans l'esclavage (12.2).\n3. Le capitalisme, surtout à l'époque fordienne, y a ajouté la consommation : la marchandise offre au désir une démultiplication sans limite de ses points d'application, et le mot de Spinoza (S02) reçoit « sa pleine dimension » (12.2).\n4. La marchandise porte donc la dépendance salariale plus haut, mais avec les affects joyeux de l'acquisition. Le discours de l'ordre établi s'adresse « au seul consommateur » en chacun et fait retomber le salarié dans l'accessoire ; la construction européenne a évincé le droit social par le droit de la concurrence, présenté comme le plus grand service rendu aux individus, mais en tant que consommateurs (12.3).\n5. L'aliénation joyeuse accepte même des affects tristes, comme l'endettement, qui redouble la dépendance salariale (12.4). Par S06, une société qui réduirait seule ses aspirations resterait exposée à l'imitation du désir de ses voisins : la bifurcation décroissante doit d'abord se construire un imaginaire refait à neuf (12.4). ∎\n\n## Scolie\n\nL'allongement des médiations entre le travail de chacun et ses objets de consommation favorise un « compartimentage » : nul ou presque ne relie l'avantage du consommateur aux sujétions du salarié (12.3). L'emprunt immobilier des « jeunes installés » les rive à l'emploi pour vingt ans ; la fascination de l'opulence a eu sa part dans le rejet des « socialismes réels » (12.4).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["S02", "S06", "T006"], "mentions": ["S02", "S06", "T006"], "corollaires": [], "mtime": 1794562498.1442955}, {"id": "T014", "file": "theses/T014.md", "type": "these", "partie": "1", "titre": "Mobiliser, c'est aligner ; réduire α est l'idée fixe patronale", "enonce": "Mobiliser est affaire de colinéarité : un conatus se laisse enrôler à proportion de son alignement sur le désir-maître ; orthogonal, il est rétif ; aligné (α = 0), il vit entièrement pour lui. Chaque conatus garde un désalignement propre, son clinamen, qui mesure ce que le patron ne captera pas ; réduire cette dérive, faire des autres le prolongement de soi, est l'idée fixe de tout désir-maître.", "citation": "« la mobilisation est affaire de colinéarité : il s’agit d’aligner le désir des enrôlés sur le désir-maître »", "loc": ["13.2", "13.3", "13.7", "14.1", "14.2", "14.3"], "depends_on": ["D04", "D11", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La question est de savoir comment certains salariés en viennent à faire cause commune avec le capital, ce qui est la réussite suprême du patronat (D04) (13.2).\n2. Par D11, l'effort utile au désir-maître est la composante alignée du conatus enrôlé, d'intensité |**d**| cos α. Un conatus se laisse donc enrôler à proportion de sa colinéarité : à α droit, la capture est nulle ; à α = 0, l'alignement est intégral (13.5-13.7).\n3. Chaque conatus fixe « spontanément » ses directions dans l'espace des objets de désir, d'où un angle α propre, son *clinamen* ; les guillemets rappellent que ces directions viennent toujours en partie du dehors (14.1, note 33).\n4. La capture croissant quand α diminue, réduire la dérive est l'idée fixe de tout désir-maître (D03) : le métadésir de « la communication intégrale du désir », d'autres refaits identiques à soi (14.2). ∎\n\n## Scolie\n\nLe contremaître, cas « bâtard » de salarié délégataire de l'autorité patronale, puis les cadres et jusqu'aux plus hauts dirigeants, qui sont des salariés, troublent depuis longtemps le face-à-face capital-travail (13.2). Le petit patron se voit en son employé et ne comprend pas qu'il serve si mal son désir ; la grande entreprise garde des maximes comme « exigeant avec les autres comme avec soi-même » ; et le vocabulaire appelle les désirs-maîtres des « directeurs » (14.2-14.3).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["D03", "D04", "D11"], "mentions": ["D03", "D04", "D11"], "corollaires": [], "mtime": 1794561825.3129659}, {"id": "T015", "file": "theses/T015.md", "type": "these", "partie": "1", "titre": "Les régimes de mobilisation changent : l'entreprise néolibérale veut α = 0", "enonce": "Parce que les structures sont historiques, la mobilisation salariale change de régime : l'« aiguillon de la faim », puis la consommation fordienne. Aucun n'a produit l'alignement parfait. L'entreprise néolibérale ne tolère plus le résidu : elle veut α = 0, la mobilisation totale, et, faute de tâches délimitées, entend conformer les désirs et les dispositions qui produisent les actions.", "citation": "", "loc": ["13.1", "14.3", "14.4", "14.5"], "depends_on": ["T007", "T013", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La configuration passionnelle de la mobilisation, déterminée par des structures plongées dans l'histoire, se transforme : le régime de « l'aiguillon de la faim », qui fait jouer « à l'os » le désir basal (T007), a cédé la place au régime fordien de la consommation (T013) ; celui-ci connaît à son tour une mutation profonde (13.1).\n2. Ni l'un ni l'autre n'a atteint la colinéarisation parfaite (T014). Le capitalisme change de méthode parce qu'il change d'ambition : les α résiduels lui sont devenus intolérables ; il veut α = 0, ce que la sociologie des organisations décrit comme un projet de mobilisation *totale* (14.3).\n3. Première cause : le pouvoir actionnarial et la dérégulation concurrentielle ont basculé le rapport de forces au point que le capital se sent autorisé à *tout* demander (14.4).\n4. Seconde cause : les tâches de l'économie de services et de l'innovation sont à contour flou. L'entreprise fordienne fixait un quantum de puissance à mobiliser et tolérait que le reste lui échappe ; l'entreprise néolibérale remonte des actions aux dispositions, et ouvre ainsi, idéalement à l'infini, le champ des actions escomptables (14.5). ∎\n\n## Scolie\n\nLe troisième régime, celui des affects joyeux intrinsèques, est l'objet du chapitre 2. Mesures de l'hégémonie actionnariale : la part des dividendes dans le PIB (3,2 % en 1982, 8,5 % en 2007, note 35), les rentabilités exigées des entreprises du CAC 40, passées de quelques pourcents à plus de 20 % (note 36) (14.4).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["T007", "T013", "T014"], "mentions": ["T007", "T013", "T014"], "corollaires": [], "mtime": 1794561825.3139768}, {"id": "T016", "file": "theses/T016.md", "type": "these", "partie": "1", "titre": "Tant qu'il ne rencontre pas de résistance, le capital avance, et gouverne par la crainte", "enonce": "L'illimitation entre dans le concept du conatus capitaliste : il veut son augmentation sans fin, sauf si des forces contraires le retiennent. La configuration néolibérale ayant fait tomber ces barrières, le capital pousse son avantage ; une part du suralignement vient d'une radicalisation du gouvernement par la crainte, qui porte la dépendance monétaire à des intensités inconnues depuis longtemps.", "citation": "« Très logiquement, tant qu’il ne rencontre pas de résistance, le capital avance. »", "loc": ["15.1", "15.2"], "depends_on": ["D01", "T015", "T012", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, le conatus est effort ; le conatus capitaliste veut sa propre augmentation sans fin, sauf le contrariement par des forces opposées. Le délire de l'illimité est un symptôme stratégique : l'indice de l'inexistence des résistances (15.1).\n2. Ce paysage de forces est celui des structures, qui seules distribuent les « ressources de pouvoir », terme qui désigne en fait un effet relationnel. De la configuration fordienne (protections, contrôle des capitaux, pas de contrainte actionnariale, politique de croissance) à la néolibérale (libéralisation, délocalisations, contrainte actionnariale, priorité à l'inflation), le rapport capital-travail est modifié du tout au tout (15.1).\n3. Le capital tire donc le profit maximal d'une situation qu'il a contribué à façonner ; la colinéarisation abandonne sa tolérance pour les déviations résiduelles et vise l'alignement parfait (T015) (15.2).\n4. Le chômage de masse rend plus facile que jamais le gouvernement par la crainte (T012) : les menaces de délocalisation et de licenciement jouent de l'affect princeps du rapport salarial, la dépendance monétaire (T006), à des intensités inédites, d'où la « coopération forcée » décrite par Thomas Coutrot (15.2, note 38). ∎\n\n## Scolie\n\nFermer un site en France parce qu'il est « insuffisamment rentable » et proposer un reclassement en Roumanie à 300 euros par mois : l'opprobre ne retient plus le capital, car il « demeure sans force » (15.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "T006", "T012", "T015"], "mentions": ["D01", "T006", "T012", "T015"], "corollaires": [], "mtime": 1794561825.3149755}, {"id": "T017", "file": "theses/T017.md", "type": "these", "partie": "1", "titre": "Il n'y a pas de morale autonome", "enonce": "La vertu des agents s'établit au voisinage de leur intérêt à la vertu. La retenue fordienne du licenciement n'était pas une morale mais l'effet de structures stables qui la rendaient peu coûteuse ; quand les structures changent, la menace sur la reproduction matérielle devient la norme, une norme pratique amoralisée qui n'exprime plus qu'un rapport de forces.", "citation": "« Il n’y a pas de morale autonome et la vertu des agents s’établit au voisinage de leurs intérêts à la vertu »", "loc": ["16.1", "16.2"], "depends_on": ["T005", "T016"], "contre": ["R05"], "ethique": [], "ref": "", "lien_explicite": false, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le chantage à la reproduction matérielle n'a atteint son intensité que par un basculement normatif : le licenciement, euphémisé en « plan social », est devenu une pratique de gestion courante (16.1).\n2. La vertu s'établit au voisinage de l'intérêt à la vertu, qu'elle soit directement profitable ou peu coûteuse (16.1). *[reconstruit : c'est l'application de l'intérêt au sens large de T005 ; Lordon renvoie seulement, en note 39, à des profits « pas nécessairement monétaires ».]*\n3. Sous le fordisme, la stabilité des structures dispensait des ajustements par les effectifs et rendait très abordable le « beau geste » du maintien de l'emploi ; le fait a pris la consistance d'une norme (R05) (16.1).\n4. Quand la déréglementation change les structures (T016), le malentendu éclate : la rupture de cette norme devient la nouvelle norme, une norme pratique amoralisée, où les uns ont toutes les cartes et les autres aucune (16.2). ∎", "sections": ["Argumentation"], "demo_refs": ["R05", "T005", "T016"], "mentions": ["R05", "T005", "T016"], "corollaires": [], "mtime": 1794561825.3159778}, {"id": "T018", "file": "theses/T018.md", "type": "these", "partie": "1", "titre": "La liquidité, paradigme du désir-maître capitaliste", "enonce": "Le désir-maître libéré trouve son modèle dans la liquidité financière : s'engager en sachant pouvoir se désengager, embaucher avec l'idée de pouvoir débaucher. Débordant les marchés d'actifs, ce schème devient le fantasme de toute une époque et pousse les désirs-maîtres à obtenir les transformations de structure qui les en rapprochent.", "citation": "", "loc": ["16.2", "16.3"], "depends_on": ["T017", "D12", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T017, imposer aux salariés la crainte pour leur reproduction est devenu normal : c'est le signe d'un désir-maître qui ne se sent plus retenu par rien. Il trouve son paradigme dans le capital financier, sous la forme de la liquidité (16.2).\n2. Par D12, la liquidité est l'engagement minimal, la réversibilité parfaite. Elle fait doublement paradigme : comme accès à l'argent, objet du métadésir (T006), et comme modèle de réversibilité totale (16.3).\n3. Le schème déborde la finance : même si aucun marché du travail n'atteindra la flexibilité des marchés financiers, la liquidité fait point de mire (16.3). ∎\n\n## Scolie\n\nLa thèse patronale selon laquelle le chômage ne baisserait qu'en affranchissant les licenciements de toute règle exprime ce métadésir : « une sorte de mai 68 pour patrons ». La théorie des marchés de concurrence pure et parfaite en porte le message : tout doit pouvoir s'ajuster instantanément, aux variations des désirs-maîtres (16.3).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D12", "T006", "T017"], "mentions": ["D12", "T006", "T017"], "corollaires": [], "mtime": 1794561825.3159778}, {"id": "T019", "file": "theses/T019.md", "type": "these", "partie": "1", "titre": "Tyrannie et terreur", "enonce": "L'égocentrisme du conatus, servi par une asymétrie de puissance, va nécessairement à l'abus : quand les structures ne retiennent plus rien des mouvements du désir-maître, la domination devient tyrannie. Son projet, rendre l'emploi aussi réversible qu'un portefeuille d'actifs, fait porter aux salariés les fluctuations de l'activité et les plonge dans un monde de terreur.", "citation": "", "loc": ["17.1", "17.2"], "depends_on": ["T018", "T016", "D13"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T018, le désir-maître, dans le paradigme de la liquidité, ne tolère plus de restriction et prend au sérieux l'idée de n'avoir plus à compter avec l'autre ; il trouve « naturels » tous ses réquisits, parce que ce sont les siens (17.1).\n2. Par T016, les structures présentes lui font droit, et rien ne le retient plus, pas même les régulations morales ou réputationnelles. Engagé dans des collaborations auxquelles il veut donner la forme de la subordination, il va à l'abus (17.1).\n3. Par D13, l'imposition unilatérale du désir de l'un à la multitude est tyrannie : le désir-maître capitaliste, qui ignore la maxime kantienne et projette la subordination sans limite des autres à son entreprise, est en devenir tyrannique (17.1).\n4. Ce désir veut liquéfier la force de travail. La part de revenu du capital était justifiée par le portage du risque, contre une rémunération salariale fixe ; c'est désormais la masse salariale qui accommode les fluctuations de l'activité, par les salaires, l'intensification ou les effectifs (17.2).\n5. La réduction à l'attente passive des commandements d'un désir tyrannique plonge le salariat dans un monde d'incertitude extrême, de terreur (17.2). ∎\n\n## Scolie\n\nCaligula demande à Lepidus s'il est de mauvaise humeur parce qu'il a fait mourir son fils ; Lepidus répond : « Mais non, Caïus, bien au contraire » (Camus, note 46). L'entreprise néolibérale n'en est pas là, et pourtant, selon un ancien cadre dirigeant, des salariés vont chaque jour au travail « morts de peur » (Teodor Limann, note 47) (17.2).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["D13", "T016", "T018"], "mentions": ["D13", "T016", "T018"], "corollaires": [], "mtime": 1794562498.1442955}, {"id": "T020", "file": "theses/T020.md", "type": "these", "partie": "2", "titre": "Le capitalisme est un régime de désir", "enonce": "Le capitalisme doit être saisi en ses structures et comme régime de désir, une épithumè : désirer y devient majoritairement désirer selon l'ordre des choses capitaliste. L'entreprise néolibérale ne s'en remet plus au travail diffus de la société : elle prend elle-même en main l'épithumogénie.", "citation": "", "loc": ["19.1", "19.2", "19.3"], "depends_on": ["D14", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T014, l'enrôlement est affaire de colinéarisation, c'est-à-dire de production des désirs adéquats au désir-maître : le capitalisme est donc aussi un régime de désir, une épithumè (D14) (19.1).\n2. Les structures objectives se prolongent en structures subjectives : elles ont leur imaginaire propre, comme configuration de désirs et d'affects. Les rapports capitalistes ont acquis assez de centralité pour organiser la plus grande part de la vie sociale ; l'épithumè capitaliste capte la grande part commune des désirs (19.1-19.2).\n3. L'épithumè est produite par le travail que la société fait sur elle-même, mais aussi par des agents qui promeuvent des imaginaires conformes à leurs projets : l'entreprise néolibérale s'investit activement dans cette épithumogénie (19.2).\n4. Dépendance monétaire, hiérarchie et consommation appartenaient déjà à l'épithumè capitaliste ; mais le projet zéro-α montre qu'elle ne s'arrête pas là (19.3). ∎\n\n## Scolie\n\nLa société capitaliste est peut-être la première à présenter un régime *d'ensemble* de désir ; celle qui l'a précédée aurait pu être une « épithumè du salut » (19.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D14", "T014"], "mentions": ["D14", "T014"], "corollaires": [], "mtime": 1794561825.317974}, {"id": "T021", "file": "theses/T021.md", "type": "these", "partie": "2", "titre": "Le projet néolibéral : des affects joyeux intrinsèques", "enonce": "Pour réduire les α résiduels, l'épithumogénie néolibérale veut produire des affects joyeux intrinsèques : faire désirer l'activité de travail pour elle-même, comme source immédiate de joie, d'« épanouissement » et de « réalisation de soi ». Si vie salariale et vie tout court se confondent, les réticents deviennent « consentants », et sont mus plus intensément.", "citation": "", "loc": ["19.4", "19.5", "21.1"], "depends_on": ["T020", "D15", "T015"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T015, l'entreprise néolibérale veut α = 0 ; par T020, elle prend l'épithumogénie en main (19.4).\n2. Le premier enrichissement, fordien, avait ajouté aux affects tristes de la faim les affects joyeux de la consommation ; il a beaucoup fait pour l'alignement, mais pas assez au jugement de l'entreprise néolibérale (19.4).\n3. Par D15, la faim était intrinsèque mais triste, la consommation joyeuse mais extrinsèque : ni l'une ni l'autre ne suffisait à désarmer l'idée que « la vraie vie est ailleurs ». L'ajout stratégique est l'affect joyeux intrinsèque, désir de l'activité pour elle-même (19.5).\n4. Les salariés se rendaient au désir-maître à contrecœur, ou en pensant à autre chose ; « consentants », ils seront « autrement mus. Autrement signifiant plus intensément » (19.5). Le projet néolibéral est un projet de réenchantement : réinternaliser les objets du désir dans l'activité salariale (21.1). ∎\n\n## Scolie\n\nLe chapitre s'ouvre sur un paradoxe : « Et contradictoirement le tyran voudrait se faire aimer ! » (19.1), qui enchaîne sur la fin du chapitre 1 (T019).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D15", "T015", "T020"], "mentions": ["D15", "T015", "T019", "T020"], "corollaires": [], "mtime": 1794561825.3189845}, {"id": "T022", "file": "theses/T022.md", "type": "these", "partie": "2", "titre": "Le consentement et l'aliénation n'existent pas", "enonce": "Si consentir est l'expression d'une intériorité librement autodéterminée, le consentement n'existe pas, car rien n'agit par soi seul : toute chose est en partie déterminée à agir par des choses extérieures. L'aliénation sombre avec lui : n'étant que l'hétérodétermination, elle est partout. Tous les désirs sont égaux sous le rapport de la détermination ; le refus de consentir aux consentements des autres vient de nos affects.", "citation": "« Détermination par le dehors, l’aliénation est elle-même sans dehors »", "loc": ["20.1", "20.3", "20.4", "20.5", "20.6", "28.3"], "depends_on": ["S10", "S11", "S12", "T008", "S13", "S14"], "contre": ["R06", "R07"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La sociologie du travail constate que les salariés « marchent d'eux-mêmes » et parle d'une nouvelle « servitude volontaire » à laquelle les asservis *consentent* (20.1). Le consentement compris comme approbation d'une volonté libre (R06) bute sur les consentements que nous refusons de valider (20.3).\n2. Par S12, toute chose est sous l'empire de la causalité inadéquate ; par S11, rien n'est déterminé à agir sans une cause extérieure. Aucune action n'est *entièrement* sienne : le consentement, compris comme approbation inconditionnée d'un sujet auto-fondé, n'existe pas (20.4).\n3. Par S10, la croyance en notre liberté naît de la conscience de nos actes jointe à l'ignorance de leurs causes. Nous sommes auto-mobiles en un sens faible, puisque c'est notre énergie qui s'active ; mais hétérodéterminés (20.4).\n4. Par T008, aucun désir n'est mon fait par sa détermination, et tout désir est mien comme expression de ma puissance. L'aliénation (R07) n'est alors qu'un autre nom de la servitude passionnelle : universelle, elle « n'existe pas » comme l'autre d'un introuvable état d'intégrité du sujet (20.5).\n5. Tous les désirs sont donc égaux sous le rapport de l'exodétermination. Le jugement d'aliénation vient de l'ambition (S13), qui veut que les autres vivent selon notre complexion, et de nos amours et haines, qui valorisent les choses (S14) (20.6). ∎\n\n## Scolie\n\nSpinoza va très loin dans le renoncement à trier : qui vivrait plus commodément au gibet qu'à sa table serait insensé de ne pas se pendre (lettre à Blyenbergh, note 53) ; et « je laisse chacun vivre selon sa complexion » (lettre à Oldenburg, note 54) (20.6). Le raisonnement se conclut en 28.3 : « Il n'y a pas plus de consentement qu'il n'y a de servitude volontaire : il n'y a que des assujettissements heureux » (T025).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "mentions": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008", "T025"], "corollaires": [], "mtime": 1794561825.3189845}, {"id": "T023", "file": "theses/T023.md", "type": "these", "partie": "2", "titre": "Le pouvoir est un art d'affecter", "enonce": "Le pouvoir est un art de faire faire ; or faire faire est l'effet même des affects, puisqu'un affect redirige le conatus et fait naître le désir de faire quelque chose. Gouverner, c'est orienter les conatus dans certaines directions : le pouvoir est l'ensemble des pratiques de la colinéarisation.", "citation": "« Le pouvoir est l’ensemble des pratiques de la colinéarisation. »", "loc": ["20.2", "21.2"], "depends_on": ["T008", "D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le pouvoir, envisagé avec Foucault comme « action sur des actions », est un *art de faire faire* (20.2, 21.2).\n2. Par T008, une affection produit en moi un affect, et par suite me fait faire quelque chose : d'un affect résultent une redirection du conatus et le désir d'agir (21.2).\n3. Donc le pouvoir, dans son mode opératoire, est production d'affects et induction par voie d'affects ; gouverner, c'est diriger au sens géométrique, orienter les conatus-vecteurs (D11) (21.2). ∎\n\n## Scolie\n\nLa philosophie politique de Spinoza se révèle ainsi philosophie des pouvoirs et des normes de toutes les institutions, et pas seulement de la Cité : les salariés sont sous l'empire de l'entreprise comme les citoyens sous celui de l'État (21.2).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["D11", "T008"], "mentions": ["D11", "T008"], "corollaires": [], "mtime": 1794561825.3199823}, {"id": "T024", "file": "theses/T024.md", "type": "these", "partie": "2", "titre": "Le pouvoir règne mieux par l'amour : l'obéissance joyeuse", "enonce": "Tout pouvoir, y compris patronal, fonctionne à la crainte ou à l'amour, et découvre qu'il est plus efficace de régner par l'amour. Réjouir l'assujetti en lui proposant des désirs qu'il prend pour les siens, et qui deviennent les siens, le met en mouvement sans réserve : le consentement a pour vrai nom l'obéissance heureuse.", "citation": "« l’univers sucré du consentement, dont le vrai nom est l’obéissance heureuse »", "loc": ["21.3", "21.4"], "depends_on": ["T023", "D16", "S16", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T023, le pouvoir procède par affects ; par D16, l'obsequium a deux formules pures, la crainte et l'amour : c'est vrai de tous les pouvoirs, y compris le pouvoir patronal (21.3).\n2. Par S16, les hommes aspirent à une vie humaine ; or la reproduction de la vie nue, à laquelle le salaire pourvoit (T006), ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon à la puissance d'agir (21.3).\n3. Réjouir l'assujetti en organisant ce déploiement, mais dans les directions du désir-maître, est donc la stratégie efficace : l'assujetti se met en mouvement sans réserve quand on lui propose des désirs qu'il prend pour les siens (21.3).\n4. Obéir est pourtant un fardeau, car les hommes n'aiment pas être sous la coupe de leurs égaux ; l'individualisme ayant ruiné la sacralisation des rois, les patrons doivent trouver d'autres procédés pour produire de l'obéissance sans fardeau (21.4). ∎", "sections": ["Argumentation"], "demo_refs": ["D16", "S16", "T006", "T023"], "mentions": ["D16", "S16", "T006", "T023"], "corollaires": [], "mtime": 1794561825.3209825}, {"id": "T025", "file": "theses/T025.md", "type": "these", "partie": "2", "titre": "Contrainte et consentement ne sont que des affects tristes ou joyeux", "enonce": "Contrainte et consentement ne se distinguent ni par la liberté ni par la topologie (l'extérieur contre l'intérieur), mais par les affects : être contraint, c'est être déterminé à faire quelque chose en s'en trouvant triste ; consentir, c'est vivre l'obéissance allégée par un affect joyeux. Il n'y a pas d'intériorité ; il n'y a que des assujettissements heureux ou tristes.", "citation": "« Le consentant n’est pas plus libre que quiconque, et pas moins “plié” que l’asservi : il est juste plié différemment et vit joyeusement sa détermination. »", "loc": ["21.4", "28.1", "28.2", "28.3"], "depends_on": ["T022", "T024", "S20", "S21"], "contre": ["R08", "R09"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T022, tous sont également asservis à leurs passions ; mais « enchaîné content ou enchaîné triste, ça n'est pas la même chose » (21.4).\n2. « Contrainte » et « consentement » sont donc les noms que prennent la tristesse et la joie dans des situations de pouvoir (T024). Ils ne désignent pas deux opérations objectives (R09) : le fait objectif est la détermination causale, et l'on n'est pas moins déterminé quand on consent (21.4).\n3. Le consentement veut toujours retourner au « noyau » intérieur du sujet (R08) (28.1). Or, par S21, l'âme et le corps sont une seule chose sous deux attributs, sans action de l'un sur l'autre ; par S20, les affects sont des affections du corps *et* leurs idées ; ces idées, relevant de la Pensée, sont sans lieu, et nos états d'âme ne sauraient être dits « intérieurs » (28.2).\n4. Consentement et intériorité sont donc solidairement vides de sens, comme les antinomies de la coercition et de la légitimité, du *hard* et du *soft power* ; leur différence vraie se ramène à la polarité du joyeux et du triste (28.3). ∎\n\n## Scolie\n\nLe mot « joug » dit les deux : « je suis sous le joug » et « je suis subjugué » (28.3). Si Spinoza refait les noms des affects, c'est pour ne pas se laisser prendre aux mots de la connaissance du premier genre, formée au voisinage des affects (21.4, notes 60-62).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["R08", "R09", "S20", "S21", "T022", "T024"], "mentions": ["R08", "R09", "S20", "S21", "T022", "T024"], "corollaires": [], "mtime": 1794561825.3219817}, {"id": "T026", "file": "theses/T026.md", "type": "these", "partie": "2", "titre": "Le ré-enchantement spontané du travail", "enonce": "Le désir étant axiogène et le conatus cherchant sa joie, le salarié peut lui-même recolorer sa situation et retrouver de l'intérêt et du sens dans des tâches imposées. Face à la menace du travail vide de sens, il n'a que deux parades : s'avouer sa déréliction (et se résigner ou se révolter), ou la repousser en recréant un désir propre, aligné mais distinct du désir-maître.", "citation": "", "loc": ["22.1", "22.2", "22.4", "22.5", "22.8"], "depends_on": ["D17", "S17", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les affects qui allègent l'obéissance viennent d'abord du salarié lui-même (22.1) : par D17, aucune situation n'impose par elle-même une valeur ou un sens ; ils sont produits par les forces désirantes qui s'en saisissent (22.2).\n2. La tâche imposée entre le plus probablement dans la complexion de l'enrôlé comme chose attristante. Mais, par S17, le conatus cherche sa joie, et peut réinvestir les situations les plus défavorables (22.4).\n3. L'enrôleur capitalise sur cette propension : l'indifférence aux contenus du « travail abstrait », identifiée par la critique marxiste, est une tendance très puissante, mais pas irrésistible (22.5).\n4. Contre la menace de dépenser sa puissance d'agir en pure perte au service d'un désir étranger, il n'y a que deux parades. Ou bien le sujet se l'avoue : il se résigne (« la vraie vie est ailleurs »), voire déprime, ou bien il se révolte, la tristesse augmentant la puissance d'agir qui lutte contre elle (S09). Ou bien il recrée un désir propre, aligné mais distinct du désir-maître, sous l'effet d'un métadésir de vivre joyeux (22.8). ∎\n\n## Scolie\n\nCôté capital, les industriels s'attachent aussi à leur « faire » particulier, avec des identités vocationnelles (identité de « bâtisseur », d'agent historique du progrès technique), alors que le capital financier, détaché de tout contenu par la diversification et la liquidité, ne peut former aucun autre désir que celui du rendement (22.6-22.7). Cas limite du conatus qui cherche sa joie : Elias, que Primo Levi décrit à Auschwitz comme « vraisemblablement un homme heureux » (22.4).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D17", "S09", "S17"], "mentions": ["D17", "S09", "S17"], "corollaires": [], "mtime": 1794561825.3229818}, {"id": "T027", "file": "theses/T027.md", "type": "these", "partie": "2", "titre": "L'amour du maître", "enonce": "Les affects d'obéissance viennent surtout du dehors, notamment de l'amour du maître : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui. Ce mécanisme général de la demande de reconnaissance fait épouser au subordonné le désir du supérieur, le long de chaînes de dépendance qui sont aussi des chaînes de reconnaissance. Ce désir est pleinement le sien : rien d'« étranger » là-dedans.", "citation": "", "loc": ["23.1", "23.2", "23.3"], "depends_on": ["S18", "S19", "S09", "T011", "T022"], "contre": ["R10"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par S18, l'amour est une joie accompagnée de l'idée d'une cause extérieure : j'obéis au maître parce qu'il est la cause imaginée de bienfaits qui me réjouissent (23.1).\n2. Par S19, je m'efforce de faire ce qui le réjouit, et je me réjouis de m'imaginer cause de sa joie : premier affect d'en être aimé, second de s'aimer soi-même. Le « maître » peut être le gourou, le parent, le professeur, le patron, l'opinion publique (23.1).\n3. Ce mécanisme est inscrit dans le conatus comme effort vers la joie ; il n'a pas besoin d'être une sublimation de l'amour parental (R10), qui n'en est que le premier point d'application (23.2).\n4. Dans l'entreprise, il conduit le demandeur à épouser et anticiper le désir de l'offreur ; par T011, il s'inscrit dans la structure hiérarchique, les chaînes de dépendance étant *aussi* des chaînes de dépendance à la reconnaissance (23.3).\n5. Par S09, l'homme affecté de joie désire la conserver : le salarié s'active joyeusement à servir un désir qui devient intégralement le sien. Par T022, ce désir n'est pas « étranger » à un noyau autonome qui n'existe pas ; la seule aliénation est la servitude passionnelle universelle (23.3). ∎\n\n## Scolie\n\nL'élargissement de la revendication salariale de l'argent à la reconnaissance, thème central de la sociologie du travail, est ainsi « obtenir la joie de la joie de celui à qui on apporte son travail, et partant son amour » (23.1). L'empressé, le fayot, l'obséquieux (« parangon bien nommé de l'*obsequium* ») cherchent aussi la joie d'être aimés du supérieur et de l'institution (23.3).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["R10", "S09", "S18", "S19", "T011", "T022"], "mentions": ["R10", "S09", "S18", "S19", "T011", "T022"], "corollaires": [], "mtime": 1794561825.323985}, {"id": "T028", "file": "theses/T028.md", "type": "these", "partie": "2", "titre": "Les images vocationnelles font désirer l'enrôlement", "enonce": "Hors de tout maître particulier, la société produit, par l'imitation socialement médiée des désirs, des images vocationnelles qui disposent les individus à désirer l'enrôlement. Plus ces déterminations sont diffuses, plus elles sont oubliées : l'individu tient ce désir venu du dehors pour « son choix », et, quand un emploi lui correspond, il « se réalise » et se meut joyeusement.", "citation": "", "loc": ["24.1", "24.2", "24.3", "24.4"], "depends_on": ["S05", "S06", "S10", "D18"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Désir sans objet, le conatus trouve ses objets dans le monde social, par association (S05) et surtout par imitation (S06) (24.1).\n2. L'imitation n'est jamais purement interpersonnelle : imiter quelqu'un, c'est déjà imiter un homme ou une femme, un riche ou un pauvre, un jeune ou un vieux, parfois un prescripteur doté de capital symbolique, et chacune de ces qualités, où s'expriment des rapports sociaux, module l'imitation. « Toute la société est à l'œuvre dans la moindre imitation de désir » (24.2).\n3. Par S10, la conscience du désir ne s'étend pas à ses causes ; à plus forte raison quand elles sont aussi diffuses et étirées. L'individu dit que c'est « son choix », sa vocation de toujours (aimer la vente « pour le contact », l'audit « pour le goût de la rigueur », l'aéronautique, le génie civil) (24.3).\n4. Ces désirs induits, devenus authentiquement intérieurs, déterminent des engagements joyeux quand un emploi les satisfait : l'individu « se réalise », il « consent » (24.3).\n5. Par D18, la société entière, par l'éducation et l'orientation, produit ainsi les images qui pré-colinéarisent les individus ; mais ce procès sans sujet n'est pas gouvernable et produit aussi des fuyards (24.4). ∎", "sections": ["Argumentation"], "demo_refs": ["D18", "S05", "S06", "S10"], "mentions": ["D18", "S05", "S06", "S10"], "corollaires": [], "mtime": 1794562518.812722}, {"id": "T029", "file": "theses/T029.md", "type": "these", "partie": "2", "titre": "Le totalitarisme de la possession des âmes", "enonce": "La précolinéarisation ne suffisant pas, l'entreprise néolibérale veut annuler α : investir totalement les salariés, refaire leurs désirs, leurs dispositions, leurs manières, jusqu'à leurs émotions, qui doivent être non plus jouées mais « authentiquement » éprouvées. C'est une visée totalitaire, celle d'une possession intégrale des individus.", "citation": "« Le capital néolibéral est le monde de la girl friend experience. »", "loc": ["25.1", "25.3", "25.4", "26.1", "26.2", "26.3"], "depends_on": ["T015", "T021", "T028"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T028, la précolinéarisation par la société est loin d'être parfaite ; par T015, la simple réduction de α ne suffit plus : l'entreprise néolibérale veut α = 0 (25.1).\n2. Par T021, elle entreprend de faire *épouser* son désir, au sens le plus exigeant. C'est un totalitarisme, non au sens classique, mais comme visée de subordination et d'investissement *total* : les salariés doivent « s'investir totalement » et sont totalement investis, envahis (25.3).\n3. Elle ne se contente plus d'obtenir des actions mais revendique la soumission de l'« intériorité » : la pleine coïncidence de l'individu et d'elle-même sous le critère du désir (25.3). Les cadres dirigeants y sont déjà alignés ; les autres seront « recolinéarisés » par les programmes de ressources humaines (25.4).\n4. Dans les services, la performance est affective. Des salariés indiens doivent adopter une identité américaine (accent, actualités, prénom) ; la *reductio ad utensilium* dit la vérité du rapport salarial (26.1).\n5. Pire : les émotions prescrites doivent être « authentiquement » éprouvées, comme l'Église demandait l'attrition et non plus la seule contrition. Le capitalisme néolibéral étend à tous les salariés le « don des larmes » des virtuoses, au prix du *double bind* de la spontanéité sur commande (26.2-26.3). ∎\n\n## Scolie\n\nLe documentaire de Jean-Robert Viallet (*La mise à mort du travail*, note 77) montre une plateforme téléphonique où l'on contrôle le chronométrage et les intonations, et un séminaire où des cadres rient sur commande ; l'animateur finit par quitter l'entreprise pour « une vie nouvelle » (25.4). Le « sourire doit être “vrai”, “naturel”, venir du “fond du cœur” » (26.3, note 82).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["T015", "T021", "T028"], "mentions": ["T015", "T021", "T028"], "corollaires": [], "mtime": 1794561825.3259847}, {"id": "T030", "file": "theses/T030.md", "type": "these", "partie": "2", "titre": "L'insondable mystère du désir enrôlé", "enonce": "Acheter une force de travail ne garantit pas sa mobilisation. Le désir étant devenu le premier réquisit, le recrutement cherche à sonder les dispositions plutôt que les compétences ; mais la complexion désirante est opaque, et cette enquête impossible voue les pratiques de recrutement à l'irrationalité. Il reste à l'entreprise à produire elle-même les désirs conformes.", "citation": "", "loc": ["27.1", "27.2", "27.3"], "depends_on": ["M04", "T029"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. L'autre face de l'utopie néolibérale est celle d'une communauté d'individus *identiquement* désirants ; mais peut-on croire le candidat qui jure n'avoir d'autre passion que les yaourts de l'entreprise ? Par M04, l'achat de la force de travail ne garantit pas sa conversion en travail (27.1).\n2. Les compétences techniques sont devenues secondaires : sans désir moteur, à quoi serviraient-elles ? Le désir occupe la place hiérarchiquement supérieure parmi les réquisits, mais oppose « son irréductible opacité » (27.1-27.2).\n3. Les emplois définis par objectifs appellent des sélections par compétences comportementales génériques, infiniment moins rationalisables que les compétences techniques ; d'où les jeux de rôle, les questionnements inquisitoriaux, la graphologie, jusqu'à la numérologie (27.3).\n4. La vérification du degré de précolinéarisation rencontrant une limite insurmontable, l'entreprise doit parfaire elle-même l'alignement (T029) (27.3). ∎\n\n## Scolie\n\nLes lettres de non-motivation de Julien Prévieux (note 83) parodient la « déclaration préalable d'intérêt » ; la réponse automatique de l'entreprise, qui n'y voit que du feu, élève la stéréotypie au carré (27.2). Nous ne vivons pas dans une économie capitaliste mais dans la *société* capitaliste (27.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["M04", "T029"], "mentions": ["M04", "T029"], "corollaires": [], "mtime": 1794561825.3269825}, {"id": "T031", "file": "theses/T031.md", "type": "these", "partie": "2", "titre": "La joie fait oublier l'hétéronomie", "enonce": "Les affects joyeux ne portent pas à penser : la pensée naît plutôt d'une rencontre contrariante. L'oubli de l'exodétermination est donc plus profond quand on est mû par la joie, et les dirigeants, pas moins déterminés que les autres, vivent leur désir comme souverain. Ce sont plutôt les commandements d'un autre qu'on hait qui font entrevoir le pliage par le dehors ; et la révolte n'est alors que la substitution d'une détermination à une autre.", "citation": "« la félicité est peu questionneuse »", "loc": ["28.4", "29.1", "29.2"], "depends_on": ["T025", "T008", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T025, consentir, c'est vivre joyeusement sa détermination. Or, comme le dit Deleuze, c'est « la violence d'un signe » qui force à chercher : la pensée naît plutôt d'un affect triste (28.4).\n2. Par T008, le désir n'est jamais *de* soi tout en étant toujours *à* soi ; sous affects joyeux, le « pas de soi » est rejeté dans l'oubli et seul reste le « à soi ». Les dirigeants ne vont pas au travail moins aliénés que leurs subordonnés : ils se meuvent seulement sous des affects d'espoir assez puissants pour vivre ce désir comme le leur souverain (28.4).\n3. Nul ne peut faire la récollection des innombrables affections qui ont formé sa complexion désirante (29.1). Par S06, le désir imité d'un autre aimé peut être réfléchi, mais, environné d'affects amoureux, il est vécu comme absolument sien (29.2).\n4. Ce sont les commandements d'un autre haï qui font entrevoir l'exodétermination ; mais la rébellion qui s'ensuit n'est que la substitution d'une détermination à une autre, sous des affects joyeux (29.2). ∎\n\n## Scolie\n\nL'adolescent de Spinoza fuit l'autorité paternelle… en s'engageant dans l'armée, préférant « en toute liberté » « le despotisme d'un tyran plutôt que les sermons paternels » (*Éthique* IV, appendice, chap. 13, note 91 ; 29.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["S06", "T008", "T025"], "mentions": ["S06", "T008", "T025"], "corollaires": [], "mtime": 1794561825.3279836}, {"id": "T032", "file": "theses/T032.md", "type": "these", "partie": "2", "titre": "Les risques du constructivisme du désir", "enonce": "Toute société façonne les désirs de ses membres, mais par un procès diffus, sans centre ni intention, qui apparaît comme une nécessité. Une instance de conditionnement visible, à laquelle on prête une intention, concentre au contraire des haines plus intenses. En prenant ouvertement en main la production des désirs, l'entreprise néolibérale prend le risque de
