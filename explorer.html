.node rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; }

<script>
const DATA = {"generated": "2026-11-13 13:03", "elements": [{"id": "D01", "file": "definitions/D01.md", "type": "definition", "partie": "1", "titre": "Conatus, énergie du désir", "enonce": "Le conatus est la force d'exister, l'énergie qui met les corps en mouvement ; chez l'homme, c'est l'énergie du désir. Exister, c'est désirer, et donc s'activer à la poursuite de ses objets.", "titre_en": "Conatus, the energy of desire", "enonce_en": "The conatus is the force of existing, the energy that sets bodies in motion; in man, it is the energy of desire. To exist is to desire, and so to busy oneself in pursuit of its objects.", "citation": "", "loc": ["03.1"], "depends_on": ["S01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLecture de S01 (03.1). Le verbe *conor* signifie « entreprendre » au sens de « commencer » : comme l'*impetus*, le conatus désigne l'impulsion qui fait passer du repos au mouvement. Lordon laisse au commentaire ontologique la question de l'origine de cette énergie : « l'énergie du conatus, c'est la vie », et, « au plus près de Spinoza », l'énergie du désir.", "body_en": "## In Lordon\n\nA reading of S01 (03.1). The verb *conor* means \"to undertake\" in the sense of \"to begin\": like the *impetus*, the conatus designates the impulse that takes one from rest to motion. Lordon leaves to ontological commentary the question of where this energy comes from: \"the energy of the conatus is life\", and, \"closest to Spinoza\", the energy of desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S01"], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D02", "file": "definitions/D02.md", "type": "definition", "partie": "1", "titre": "Enrôlement", "enonce": "L'enrôlement est le fait de faire entrer des puissances d'agir tierces dans la poursuite de son propre désir. C'est la catégorie la plus générale, dont le salariat n'est qu'un cas.", "titre_en": "Enlistment", "enonce_en": "Enlistment is bringing third-party powers of acting into the pursuit of one's own desire. It is the most general category, of which wage labour is only one case.", "citation": "", "loc": ["04.1", "04.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe rapport salarial est « un rapport d'*enrôlement* » (04.1) ; « sous l'angle de la capture », l'enrôlement est la catégorie la plus générale (04.2). Les enrôlés sont des conatus (D01) dont l'effort est capté au service d'un autre.", "body_en": "## In Lordon\n\nThe wage relation is \"a relation of *enlistment*\" (04.1); \"from the angle of capture\", enlistment is the most general category (04.2). The enlisted are conatuses (D01) whose effort is captured in the service of another.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D03", "file": "definitions/D03.md", "type": "definition", "partie": "1", "titre": "Désir-maître", "enonce": "Le désir-maître est le désir de celui qui enrôle, au service duquel sont mobilisées les puissances d'agir des enrôlés.", "titre_en": "Master-desire", "enonce_en": "The master-desire is the desire of the one who enlists, in whose service the powers of acting of the enlisted are mobilised.", "citation": "", "loc": ["04.1", "04.2", "14.3"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe terme apparaît avec la question de la *capture* « par le sujet du désir-maître » (04.1). Le vocabulaire commun ne s'y trompe pas, qui appelle les désirs-maîtres des « directeurs » (14.3) : ils orientent les conatus enrôlés (D11).", "body_en": "## In Lordon\n\nThe term appears with the question of *capture* \"by the subject of the master-desire\" (04.1). Common vocabulary is not mistaken, calling master-desires \"directors\" (14.3): they direct the enlisted conatuses (D11).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D04", "file": "definitions/D04.md", "type": "definition", "partie": "1", "titre": "Patronat (au sens général)", "enonce": "Le patronat est le rapport sous lequel un désir-maître mobilise au service de son entreprise les puissances d'agir des enrôlés. En ce sens général, le patronat est un « capturat ».", "titre_en": "Bosshood (in the general sense)", "enonce_en": "Bosshood (*patronat*) is the relation under which a master-desire mobilises the powers of acting of the enlisted in the service of its enterprise. In this general sense, bosshood is a \"capturat\", a regime of capture.", "citation": "", "loc": ["04.2"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon nomme le genre d'après l'une de ses espèces (04.2). Exemples : le chef de guerre et sa conquête, le croisé et sa croisade, le souverain (dont la puissance est en fait celle de la multitude), le patron capitaliste et son profit, mais aussi le dirigeant d'ONG, le mandarin universitaire, l'artiste et ses aides. Tous captent l'effort (conatus) de subordonnés enrôlés (D02) au service d'un désir-maître (D03).", "body_en": "## In Lordon\n\nLordon names the genus after one of its species (04.2). Examples: the warlord and his conquest, the crusader and his crusade, the sovereign (whose power is in fact that of the multitude), the capitalist boss and his profit, but also the NGO director, the academic mandarin, the artist and his assistants. All capture the effort (conatus) of enlisted subordinates (D02) in the service of a master-desire (D03).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D05", "file": "definitions/D05.md", "type": "definition", "partie": "1", "titre": "Rapport salarial", "enonce": "Le rapport salarial est l'ensemble des données structurelles (la double séparation) et des codifications juridiques qui permettent à certains individus d'en impliquer d'autres dans la réalisation de leur propre entreprise. C'est un rapport d'enrôlement.", "titre_en": "Wage relation", "enonce_en": "The wage relation is the set of structural givens (the double separation) and legal codifications that allow certain individuals to involve others in carrying out their own enterprise. It is a relation of enlistment.", "citation": "", "loc": ["04.1"], "depends_on": ["M01", "D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Faire entrer des puissances d'agir tierces dans la poursuite de son désir industriel à soi, voilà l'essence du rapport salarial » (04.1). Il combine la structure marxienne (M01) et le concept général d'enrôlement (D02).", "body_en": "## In Lordon\n\n\"Bringing third-party powers of acting into the pursuit of one's own industrial desire: that is the essence of the wage relation\" (04.1). It combines the Marxian structure (M01) with the general concept of enlistment (D02).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "M01"], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D06", "file": "definitions/D06.md", "type": "definition", "partie": "1", "titre": "Intérêt", "enonce": "L'intérêt est la prise de satisfaction, c'est-à-dire l'autre nom de l'objet du désir, dont il épouse l'infinie variété : *interesse sive appetitus*.", "titre_en": "Interest", "enonce_en": "Interest is the taking of satisfaction, that is, another name for the object of desire, whose infinite variety it follows: *interesse sive appetitus*.", "citation": "« L’intérêt c’est la prise de satisfaction, c’est-à-dire l’autre nom de l’objet du désir »", "loc": ["05.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLa formule *interesse sive appetitus* est une paraphrase de Spinoza par Lordon : « on pourrait ici paraphraser Spinoza » (05.2). Elle refuse de réduire l'intérêt au calcul utilitariste : l'intérêt économique n'est qu'une forme historiquement construite, celle qui se réfléchit dans un compte en monnaie. Lordon renvoie à son *Intérêt souverain* (2006, note 5).", "body_en": "## In Lordon\n\nThe formula *interesse sive appetitus* is Lordon's paraphrase of Spinoza: \"one could paraphrase Spinoza here\" (05.2). It refuses to reduce interest to utilitarian calculation: economic interest is only a historically constructed form, the one reflected in an account kept in money. Lordon refers to his *L'Intérêt souverain* (2006, note 5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.4897358}, {"id": "D07", "file": "definitions/D07.md", "type": "definition", "partie": "1", "titre": "Désir basal", "enonce": "Le désir basal est le désir de la reproduction matérielle, celle de la « vie nue » : le désir qui conditionne tous les autres.", "titre_en": "Basic desire", "enonce_en": "Basic desire is the desire for material reproduction, that of \"bare life\": the desire that conditions all the others.", "citation": "", "loc": ["06.1", "09.1", "09.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Le capitalisme commence par l'argent. Ou plutôt la vie nue. La vie à reproduire » (06.1). Ce désir est vécu comme contrainte ou corvée, mais il reste conceptuellement un désir : il suffit de voir l'acharnement des hommes quand les objets de leur reproduction viennent à manquer (09.1). C'est le désir qui « conditionne tout mais compte pour rien » (09.4).", "body_en": "## In Lordon\n\n\"Capitalism begins with money. Or rather with bare life. Life to be reproduced\" (06.1). This desire is experienced as constraint or chore, but conceptually it remains a desire: one need only see how fiercely men struggle when the objects of their reproduction run short (09.1). It is the desire that \"conditions everything but counts for nothing\" (09.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D08", "file": "definitions/D08.md", "type": "definition", "partie": "1", "titre": "Monnaie et argent", "enonce": "La monnaie est un rapport social : la croyance collective, produite et entretenue par des institutions, qui fait accepter un signe sans valeur intrinsèque comme moyen de paiement. L'argent est la monnaie saisie du côté des sujets : l'objet de désir que ce rapport fait naître.", "titre_en": "Money as institution and as object", "enonce_en": "Money as an institution (*monnaie*) is a social relation: the collective belief, produced and sustained by institutions, that makes a sign without intrinsic value accepted as a means of payment. Money as an object (*argent*) is that institution grasped from the side of subjects: the object of desire this relation gives rise to.", "citation": "« L’argent, c’est la monnaie saisie du côté des sujets. »", "loc": ["07.1", "07.2", "07.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon prolonge Pepita Ould-Ahmed, qui voit dans les deux mots deux points de vue disciplinaires (07.1), et s'appuie sur Michel Aglietta et André Orléan pour la monnaie comme rapport social, de nature fiduciaire (07.2). Les deux points de vue doivent être tenus ensemble, comme Bourdieu récusait l'antinomie de l'objectivisme et du subjectivisme : les structures sont présentes dans les sujets sous forme de désirs et d'affects (07.3).", "body_en": "## In Lordon\n\nLordon extends Pepita Ould-Ahmed, who sees the two French words as two disciplinary points of view (07.1), and relies on Michel Aglietta and André Orléan for money as a social relation, fiduciary in nature (07.2). The two points of view must be held together, as Bourdieu rejected the antinomy of objectivism and subjectivism: structures are present in subjects in the form of desires and affects (07.3).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D09", "file": "definitions/D09.md", "type": "definition", "partie": "1", "titre": "Domination (premier sens)", "enonce": "Il y a domination quand un agent doit en passer par un autre pour accéder à son objet de désir.", "titre_en": "Domination (first sense)", "enonce_en": "There is domination when an agent must go through another to gain access to its object of desire.", "citation": "", "loc": ["08.1", "33.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Si le premier sens de la domination consiste en la nécessité pour un agent d'en passer par un autre pour accéder à son objet de désir… » (08.1). La définition est formulée en termes de désir (D01), non de volonté ni de contrainte physique. Lordon en ajoute aussitôt la conséquence : l'intensité de la domination est proportionnée à celle du désir du dominé (T007). Ce premier sens demeure au chapitre 3, à côté d'un second (33.2 ; D20).", "body_en": "## In Lordon\n\n\"If the first sense of domination consists in the necessity for an agent to go through another to gain access to its object of desire…\" (08.1). The definition is framed in terms of desire (D01), not of will or physical constraint. Lordon immediately adds the consequence: the intensity of domination is proportionate to that of the desire of the dominated (T007). This first sense remains in chapter 3, alongside a second one (33.2; D20).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01", "D20", "T007"], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D10", "file": "definitions/D10.md", "type": "definition", "partie": "1", "titre": "Stratégie", "enonce": "Est stratégique l'ensemble des actions enchaînées pour parvenir à une fin désirée, qu'elles procèdent du calcul ou de la conduite par les affects : la stratégie est la logique même du désir.", "titre_en": "Strategy", "enonce_en": "Strategic is the whole of the actions linked together to reach a desired end, whether they proceed from calculation or from conduct by the affects: strategy is the very logic of desire.", "citation": "", "loc": ["10.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon se garde d'un sens « ouvertement réfléchi et calculateur » (10.2) : les enchaînements d'actions peuvent être des manières de faire incorporées, quasi automatiques (l'habitus de Bourdieu). Il reprend l'expression de Laurent Bove, les « stratégies du conatus » (note 23) ; l'opposition du calcul et des affects est une « fausse antinomie » (note 22).", "body_en": "## In Lordon\n\nLordon avoids an \"openly reflective and calculating\" sense (10.2): chains of action can be embodied ways of doing, quasi-automatic (Bourdieu's habitus). He takes up Laurent Bove's expression, the \"strategies of the conatus\" (note 23); the opposition between calculation and affects is a \"false antinomy\" (note 22).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D11", "file": "definitions/D11.md", "type": "definition", "partie": "1", "titre": "Colinéarité et angle α", "enonce": "Le désir-maître et chaque conatus enrôlé sont figurés par des vecteurs. L'angle α qu'ils forment mesure le désalignement de l'enrôlé : seule la composante de son effort parallèle au désir-maître (d’intensité |d| cos α) lui est utile ; la composante orthogonale (|d| sin α) lui échappe.", "titre_en": "Collinearity and the angle α", "enonce_en": "The master-desire and each enlisted conatus are represented by vectors. The angle α between them measures the misalignment of the enlisted: only the component of its effort parallel to the master-desire (of magnitude |d| cos α) is useful to it; the orthogonal component (|d| sin α) escapes it.", "citation": "", "loc": ["13.3", "13.5", "13.7", "14.1"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« S'il est question de direction et d'alignement la métaphore vectorielle est adéquate » (13.3). Lordon note **D** le désir-maître (D03) et **d** le conatus enrôlé (D02). L'enrôlement est figuré par le produit scalaire **D**·**d** = |**D**| |**d**| cos α (13.3-13.4) ; la composante utile d1 a pour longueur |**d**| cos α, inférieure à |**d**| (13.5-13.7). L'angle α est le *clinamen* du conatus individuel, son « désalignement spontané d'avec les finalités de l'entreprise » ; son sinus (la composante orthogonale d2) mesure « ce qui ne se laissera pas capturer » (14.1). La figure 1 du livre représente cette décomposition (13.8).", "body_en": "## In Lordon\n\n\"If it is a matter of direction and alignment, the vector metaphor is apt\" (13.3). Lordon writes **D** for the master-desire (D03) and **d** for the enlisted conatus (D02). Enlistment is represented by the scalar product **D**·**d** = |**D**| |**d**| cos α (13.3-13.4); the useful component d1 has length |**d**| cos α, less than |**d**| (13.5-13.7). The angle α is the *clinamen* of the individual conatus, its \"spontaneous misalignment with the firm's ends\"; its sine (the orthogonal component d2) measures \"what will not let itself be captured\" (14.1). Figure 1 of the book shows this decomposition (13.8).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D12", "file": "definitions/D12.md", "type": "definition", "partie": "1", "titre": "Liquidité", "enonce": "Au sens strict, la liquidité est la possibilité de sortir à tout instant d'un marché d'actifs sans en faire varier le prix : une promesse de réversibilité parfaite. Au sens large, elle est le droit inconditionnel du désir à s'engager en sachant pouvoir se désengager.", "titre_en": "Liquidity", "enonce_en": "In the strict sense, liquidity is the possibility of leaving an asset market at any moment without moving its price: a promise of perfect reversibility. In the broad sense, it is the unconditional right of desire to commit while knowing it can withdraw.", "citation": "", "loc": ["16.3"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe même mot désigne une propriété des marchés et l'argent lui-même, auquel cette propriété permet de revenir (16.3). Keynes avait vu le caractère antisocial de la liquidité, refus de tout engagement durable, désir de garder toutes ses options ouvertes, « c'est-à-dire de *n'avoir jamais à compter avec l'autre* » (note 40). Le schème déborde la finance et devient celui des désirs-maîtres (D03).", "body_en": "## In Lordon\n\nThe same word designates a property of markets and money itself, to which this property allows one to return (16.3). Keynes had seen the antisocial character of liquidity, a refusal of any lasting commitment, a desire to keep all one's options open, \"that is, *never to have to reckon with the other*\" (note 40). The schema overflows finance and becomes that of master-desires (D03).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D03"], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D13", "file": "definitions/D13.md", "type": "definition", "partie": "1", "titre": "Tyrannie", "enonce": "La tyrannie est l'imposition unilatérale du désir de l'un à la multitude, sans égard ni compromis : « l'unité qui ne dépend pas de la multitude ».", "titre_en": "Tyranny", "enonce_en": "Tyranny is the unilateral imposition of the desire of one on the multitude, without regard or compromise: \"the unity that does not depend on the multitude\".", "citation": "« l’unité qui ne dépend pas de la multitude est tyrannie »", "loc": ["17.1"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon écarte d'abord une objection tirée de Pascal : la tyrannie serait le « désir de domination hors de son ordre », et le désir-maître capitaliste ne sort pas de son ordre, puisqu'il ne vise que l'accumulation (17.1, notes 41-43). Il retient une autre définition de Pascal (note 44) : la non-dépendance de l'un envers la multitude, qui n'est pas une absence de relation, puisque le tyran reste le captateur de sa puissance. Exemple de Caligula, d'après Camus (note 45).", "body_en": "## In Lordon\n\nLordon first sets aside an objection drawn from Pascal: tyranny would be the \"desire for domination outside its order\", and the capitalist master-desire does not leave its order, since it aims only at accumulation (17.1, notes 41-43). He retains another definition from Pascal (note 44): the non-dependence of the one on the multitude, which is not an absence of relation, since the tyrant remains the captor of its power. The example of Caligula, after Camus (note 45).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.4982731}, {"id": "D14", "file": "definitions/D14.md", "type": "definition", "partie": "2", "titre": "Épithumè et épithumogénie", "enonce": "Une épithumè est un régime de désir : la configuration de désirs et d'affects par laquelle des structures sociales existent aussi dans les psychés. L'épithumogénie est le travail de production de désirs, mené par la société sur elle-même ou par des agents intéressés.", "titre_en": "Epithumè and epithumogeny", "enonce_en": "An epithumè is a regime of desire: the configuration of desires and affects through which social structures also exist in psyches. Epithumogeny is the work of producing desires, carried out by society on itself or by interested agents.", "citation": "", "loc": ["19.1", "19.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe mot, forgé sur le grec *épithumia*, désir (note 48), est une « paronymie foucaldienne » de l'*épistémè* (19.1). Comme l'*illusio* de Bourdieu, il nomme les forces motrices de l'engagement dans un jeu social, mais marque que cet « intérêt » est affaire de désir (D01) et d'affects. L'épithumè capitaliste s'inscrit dans le « triptyque objectal » de l'argent, de la marchandise et du travail, surmonté de la grandeur (19.2). L'épithumogénie n'est pas toujours un « procès sans sujet » : elle peut être maniée à des fins déterminées (19.2).", "body_en": "## In Lordon\n\nThe word, coined from the Greek *epithumia*, desire (note 48), is a \"Foucauldian paronymy\" of the *episteme* (19.1). Like Bourdieu's *illusio*, it names the driving forces of engagement in a social game, but marks that this \"interest\" is a matter of desire (D01) and affects. The capitalist epithumè fits into the \"object triptych\" of money, commodity and work, topped by greatness (19.2). Epithumogeny is not always a \"process without a subject\": it can be handled for determinate ends (19.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D15", "file": "definitions/D15.md", "type": "definition", "partie": "2", "titre": "Affects intrinsèques et extrinsèques", "enonce": "Un affect salarial est intrinsèque quand il naît de l'activité de travail elle-même, extrinsèque quand il naît d'objets extérieurs à elle (les biens que le salaire permet d'acheter). L'aiguillon de la faim est intrinsèque et triste ; la joie consumériste, extrinsèque et joyeuse ; l'épithumogénie néolibérale vise des affects intrinsèques joyeux.", "titre_en": "Intrinsic and extrinsic affects", "enonce_en": "A wage-labour affect is intrinsic when it arises from the work activity itself, extrinsic when it arises from objects external to it (the goods the wage can buy). The goad of hunger is intrinsic and sad; consumerist joy, extrinsic and joyful; neoliberal epithumogeny aims at intrinsic joyful affects.", "citation": "« l’aiguillon de la faim était un affect salarial intrinsèque, mais c’était un affect triste ; la joie consumériste est bien un affect joyeux, mais il est extrinsèque »", "loc": ["19.5"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLes trois régimes d'affects du salariat se lisent sur ce tableau à double entrée (19.5) :\n\n| | triste | joyeux |\n|---|---|---|\n| **intrinsèque** | l'aiguillon de la faim (T007) | les affects joyeux intrinsèques (T021) |\n| **extrinsèque** | — | la consommation (T013) |\n\nUn affect intrinsèque joyeux est « intransitif » : c'est l'activité *elle-même* qui doit devenir source de joie immédiate.", "body_en": "## In Lordon\n\nThe three regimes of affects of wage labour can be read on this two-way table (19.5):\n\n| | sad | joyful |\n|---|---|---|\n| **intrinsic** | the goad of hunger (T007) | intrinsic joyful affects (T021) |\n| **extrinsic** | — | consumption (T013) |\n\nAn intrinsic joyful affect is \"intransitive\": it is the activity *itself* that must become a source of immediate joy.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T007", "T013", "T021"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D16", "file": "definitions/D16.md", "type": "definition", "partie": "2", "titre": "Obsequium", "enonce": "L'obsequium est le complexe d'affects qui fait se mouvoir les corps assujettis vers les objets de la norme, et fait faire aux sujets les gestes conformes à ce que demande la persévérance du pouvoir.", "titre_en": "Obsequium", "enonce_en": "Obsequium is the complex of affects that moves subjected bodies towards the objects of the norm, and makes subjects perform the gestures that the persistence of power requires.", "citation": "", "loc": ["21.3"], "depends_on": ["S15"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe sujet est ici *subditus*, sujet *du* souverain, non *subjectum*, sujet souverain ; il suit (*sequor*) la règle (21.3). Par S15, l'obsequium a deux formules pures : la crainte et l'amour.", "body_en": "## In Lordon\n\nThe subject here is *subditus*, subject *of* the sovereign, not *subjectum*, sovereign subject; he follows (*sequor*) the rule (21.3). By S15, obsequium has two pure formulas: fear and love.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S15"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D17", "file": "definitions/D17.md", "type": "definition", "partie": "2", "titre": "Puissance axiogène du désir", "enonce": "Le désir est axiogène : la valeur n'est pas une propriété des choses que le désir viendrait reconnaître ; c'est une production des investissements du désir.", "titre_en": "The axiogenic power of desire", "enonce_en": "Desire is axiogenic: value is not a property of things that desire would come to recognise; it is a product of the investments of desire.", "citation": "« Loin que le désir soit une induction par la valeur, c’est la valeur qui est une production par le désir. »", "loc": ["22.2", "22.3"], "depends_on": ["S04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nConséquence de S04, qui « ruine toute possibilité d'un objectivisme de la valeur » (22.2). Ce n'est pas dire que tout se présente dans une neutralité vierge : chaque complexion valorisante, socialement et biographiquement constituée, a ses schèmes résistants, très prédéterminants mais pas entièrement saturants (22.3).", "body_en": "## In Lordon\n\nA consequence of S04, which \"ruins any possibility of an objectivism of value\" (22.2). This is not to say that everything appears in virgin neutrality: each valuing complexion, socially and biographically constituted, has its resistant schemas, highly predetermining but not entirely saturating (22.3).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S04"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D18", "file": "definitions/D18.md", "type": "definition", "partie": "2", "titre": "Images vocationnelles et précolinéarisation", "enonce": "Les images vocationnelles sont les figures d'activités et de vies désirables que la société produit et fait imiter. Elles précolinéarisent les individus : elles les disposent à désirer l'enrôlement avant même qu'ils soient enrôlés.", "titre_en": "Vocational images and precollinearisation", "enonce_en": "Vocational images are the figures of desirable activities and lives that society produces and gets imitated. They precollinearise individuals: they dispose them to desire enlistment before they are even enlisted.", "citation": "", "loc": ["24.3", "24.4", "25.1"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nSystème d'éducation, de formation et d'orientation, pouvoir du récit qu'Yves Citton qualifie de « mythocratique » (note 74) : la société entière travaille à produire ces images (24.3-24.4). La précolinéarisation réduit l'angle α (D11) mais reste « loin d'être parfaite » (25.1), d'autant que le flot des images comprend aussi le poète, le voyageur, l'artiste irrécupérable, les fuyards (24.4).", "body_en": "## In Lordon\n\nThe system of education, training and career guidance, a power of narrative that Yves Citton calls \"mythocratic\" (note 74): the whole of society works to produce these images (24.3-24.4). Precollinearisation reduces the angle α (D11) but remains \"far from perfect\" (25.1), all the more since the flow of images also includes the poet, the traveller, the unrecoverable artist, the runaways (24.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D19", "file": "definitions/D19.md", "type": "definition", "partie": "2", "titre": "Amor fati capitalistis", "enonce": "L'amor fati capitalistis est l'amour, par les salariés, de la situation que l'entreprise leur fait : la conversion de contraintes extérieures en affects joyeux et en désir propre.", "titre_en": "Amor fati capitalistis", "enonce_en": "Amor fati capitalistis is the love, by employees, of the situation the firm makes for them: the conversion of external constraints into joyful affects and into a desire of their own.", "citation": "« Produire le consentement, c’est produire l’amour par les individus de la situation qui leur est faite. »", "loc": ["30.1", "30.3"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'épithumogénie néolibérale (D14) produit de l'*amor fati*, « mais pas de n'importe quel *fatum* : le sien exclusivement, celui qu'elle abat sur des salariés au comble de l'hétéronomie » (30.1).", "body_en": "## In Lordon\n\nNeoliberal epithumogeny (D14) produces *amor fati*, \"but not of just any *fatum*: its own exclusively, the one it brings down on employees at the height of heteronomy\" (30.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D14"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D20", "file": "definitions/D20.md", "type": "definition", "partie": "3", "titre": "Domination (second sens)", "enonce": "La domination est l'effet qui confère à certains l'aptitude à se réserver des possibilités de jouissance et à en écarter les autres.", "titre_en": "Domination (second sense)", "enonce_en": "Domination is the effect that gives some the ability to reserve possibilities of enjoyment for themselves and to keep others from them.", "citation": "« l’effet qui confère à certains l’aptitude à se réserver des possibilités (de jouissance) et à en écarter les autres »", "loc": ["33.2", "34.1"], "depends_on": ["D09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe premier sens (D09) demeure (33.2) ; ce second sens vaut même quand on fait abstraction de la dépendance, et englobe domination « dure » et domination « douce ». Son enjeu est distributif : « la répartition des chances de joie », pour mêler les langages de Weber et de Spinoza (34.1).", "body_en": "## In Lordon\n\nThe first sense (D09) remains (33.2); this second sense holds even when dependence is set aside, and encompasses \"hard\" and \"soft\" domination. What is at stake is distributive: \"the distribution of chances of joy\", to mix the languages of Weber and Spinoza (34.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D09"], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D21", "file": "definitions/D21.md", "type": "definition", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La division du désir est la conversion de la division du travail en assignation des désirs : chacun est rivé aux objets que lui donne sa place. Elle est soutenue par un double imaginaire : du comblement, qui fait paraître suffisantes les petites joies des dominés, et de l'impuissance, qui les fait renoncer aux grandes.", "titre_en": "The division of desire and the imaginary of powerlessness", "enonce_en": "The division of desire is the conversion of the division of labour into an assignment of desires: each is riveted to the objects his position gives him. It is sustained by a double imaginary: of fulfilment, which makes the small joys of the dominated seem sufficient, and of powerlessness, which makes them renounce the great ones.", "citation": "", "loc": ["34.1", "34.2"], "depends_on": ["D20"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nC'est ce double imaginaire que Lordon appelle la violence symbolique « à proprement parler » (34.1). Les objets réservés aux dominants doivent être reconnus désirables par les dominés, « sous la clause décisive : désirable en général mais pas pour eux en particulier » (34.2).", "body_en": "## In Lordon\n\nIt is this double imaginary that Lordon calls symbolic violence \"properly speaking\" (34.1). The objects reserved for the dominant must be recognised as desirable by the dominated, \"under the decisive clause: desirable in general but not for them in particular\" (34.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.5022497}, {"id": "D22", "file": "definitions/D22.md", "type": "definition", "partie": "3", "titre": "Exploitation passionnelle", "enonce": "L'exploitation passionnelle est la capture, par un désir-maître, de la puissance d'agir d'enrôlés dont les passions dirigent l'effort dans sa direction. Elle est dépossession d'œuvre : du produit monétaire, et plus généralement de l'autorat, c'est-à-dire de la reconnaissance d'une œuvre collective.", "titre_en": "Passional exploitation", "enonce_en": "Passional exploitation is the capture, by a master-desire, of the power of acting of enlisted people whose passions direct their effort its way. It is a dispossession of the work done: of the monetary product, and more generally of authorship, that is, of recognition for a collective work.", "citation": "", "loc": ["35.5", "35.6"], "depends_on": ["D03", "D04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« De la puissance et des passions, de la puissance bien dirigée par des passions » : c'est ce qu'exploite le patron général (D04), le patron capitaliste convertissant cette capture en argent, les autres en reconnaissance propre à leur champ (35.6). La reconnaissance descend ensuite du sommet au long des chaînes hiérarchiques, *trickle-down economy* de la joie (35.5).", "body_en": "## In Lordon\n\n\"Power and passions, power well directed by passions\": that is what the general boss (D04) exploits, the capitalist boss converting this capture into money, the others into the recognition proper to their field (35.6). Recognition then flows down from the top along the hierarchical chains, a *trickle-down economy* of joy (35.5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D04"], "corollaires": [], "mtime": 1794571135.5076451}, {"id": "D23", "file": "definitions/D23.md", "type": "definition", "partie": "3", "titre": "Récommune", "enonce": "La récommune (*res communa*, décalquée de la *res publica*) est l'entreprise, au sens général d'un concours de puissances d'agir, constituée selon le principe de la démocratie radicale : ce qui affecte tous doit être l'objet de tous, débattu égalitairement par tous.", "titre_en": "Récommune", "enonce_en": "The récommune (*res communa*, modelled on *res publica*) is the enterprise, in the general sense of a concurrence of powers of acting, constituted on the principle of radical democracy: what affects all must be the business of all, debated equally by all.", "citation": "« ce qui affecte tous doit être l’objet de tous »", "loc": ["37.6", "37.7"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon reprend un terme de *La crise de trop* (2009, note 122). Ce que l'entreprise doit fabriquer, en quelle quantité, avec quel emploi et quelles rémunérations : rien de cela n'échappe par principe à la délibération commune (37.6). La récommune réalise l'abolition du rapport salarial comme rapport d'enrôlement (D02) (37.7).", "body_en": "## In Lordon\n\nLordon takes up a term from *La crise de trop* (2009, note 122). What the enterprise should make, in what quantity, with what staffing and what pay: none of this escapes common deliberation in principle (37.6). The récommune achieves the abolition of the wage relation as a relation of enlistment (D02) (37.7).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02"], "corollaires": [], "mtime": 1794571135.508164}, {"id": "D24", "file": "definitions/D24.md", "type": "definition", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "Devenir perpendiculaire (orthogonal), c'est rouvrir l'angle α jusqu'à l'angle droit : le conatus n'offre plus rien à la capture, parce qu'il s'efforce dans de nouvelles directions, vers de nouveaux objets de désir. À α = 180°, il s'oppose activement au désir-maître.", "titre_en": "Becoming perpendicular", "enonce_en": "Becoming perpendicular (orthogonal) is reopening the angle α up to the right angle: the conatus offers nothing more to capture, because it strives in new directions, towards new objects of desire. At α = 180°, it actively opposes the master-desire.", "citation": "« La sédition c’est le devenir orthogonal – prendre non pas la tangente mais la perpendiculaire. »", "loc": ["39.5"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nAvec le modèle de D11 : à α droit, cos α = 0 et la capture est nulle (figure 2-a) ; à α = 180°, cos α = -1 et le conatus ôte de sa traction au désir-maître (figure 2-b). La géométrie renverse le sens de « remettre d'équerre » (*norma*, l'équerre) (39.5). « Les perpendiculaires se détournent du détournement » (39.5).", "body_en": "## In Lordon\n\nWith the model of D11: at a right angle α, cos α = 0 and capture is nil (figure 2-a); at α = 180°, cos α = -1 and the conatus takes traction away from the master-desire (figure 2-b). The geometry reverses the sense of \"squaring up\" (*norma*, the carpenter's square) (39.5). \"The perpendiculars turn away from the diversion\" (39.5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794571135.50961}, {"id": "D25", "file": "definitions/D25.md", "type": "definition", "partie": "3", "titre": "Aliénation comme fixation", "enonce": "L'aliénation n'est ni la perte de l'autonomie, ni la séparation d'avec sa puissance, mais la fixation de la puissance sur un très petit nombre d'objets : rétrécissement de ses effectuations, fermeture du champ de ses affectabilités.", "titre_en": "Alienation as fixation", "enonce_en": "Alienation is neither the loss of autonomy nor separation from one's power, but the fixation of power on a very small number of objects: a narrowing of its enactments, a closing of the field of its affectabilities.", "citation": "", "loc": ["40.2", "40.3"], "depends_on": ["S29", "S33", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon emprunte le schème à Pascal Sévérac (note 131). Par S29, on ne peut être séparé de sa puissance, qui est son être même ; par S33, un affect peut se fixer de façon tenace ; par S25, la puissance est aussi pouvoir d'être affecté de nombreuses manières (40.2-40.3). « Le salarié rivé, fût-ce joyeusement, à “son” unique objet d'activité n'est pas “aliéné” différemment du cocaïnomane dont l'esprit est entièrement rempli d'images de poudre » (40.2).", "body_en": "## In Lordon\n\nLordon borrows the schema from Pascal Sévérac (note 131). By S29, one cannot be separated from one's power, which is one's very being; by S33, an affect can become stubbornly fixed; by S25, power is also the capacity to be affected in many ways (40.2-40.3). \"The employee riveted, even joyfully, to 'his' one object of activity is not 'alienated' differently from the cocaine addict whose mind is entirely filled with images of powder\" (40.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S25", "S29", "S33"], "corollaires": [], "mtime": 1794571135.50961}, {"id": "D26", "file": "definitions/D26.md", "type": "definition", "partie": "3", "titre": "Classes affectives", "enonce": "Une classe est une communauté de manières de sentir, juger et désirer, déterminée par une proximité d'expériences sociales. La lutte des classes devient lutte de classes affectives : celle des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose.", "titre_en": "Affective classes", "enonce_en": "A class is a community of ways of feeling, judging and desiring, determined by a proximity of social experiences. The class struggle becomes a struggle of affective classes: that of the joyful who want nothing changed and of the discontented who want something else.", "citation": "", "loc": ["41.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCette définition « coïncide moins bien avec la simplicité du schéma bipolaire initial » mais permet des ré-homogénéisations selon d'autres principes, notamment le mécontentement (41.4). Elle n'est pas un « cosmétique hommage verbal à Marx » : les affects communs ont une cause, le capital comme rapport social (41.4).", "body_en": "## In Lordon\n\nThis definition \"matches less well the simplicity of the initial bipolar schema\" but allows re-homogenisations along other principles, notably discontent (41.4). It is not a \"cosmetic verbal tribute to Marx\": common affects have a cause, capital as a social relation (41.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571135.50961}, {"id": "M01", "file": "premisses/M01.md", "type": "marx", "partie": "P", "titre": "Le rapport salarial comme double séparation", "enonce": "Le rapport salarial sépare les travailleurs des moyens de la production et de ses produits.", "titre_en": "The wage relation as a double separation", "enonce_en": "The wage relation separates workers from the means of production and from its products.", "citation": "« double séparation des travailleurs d’avec les moyens et les produits de la production »", "loc": ["01.3", "04.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Depuis Marx on sait » que le pouvoir des patrons est l'effet de cette configuration de structures (01.3). La double séparation est le noyau structurel de la définition du rapport salarial (04.1 ; D05).", "body_en": "## In Lordon\n\n\"Since Marx we know\" that the power of bosses is the effect of this configuration of structures (01.3). The double separation is the structural core of the definition of the wage relation (04.1; D05).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D05"], "corollaires": [], "mtime": 1794571085.9457762}, {"id": "M02", "file": "premisses/M02.md", "type": "marx", "partie": "P", "titre": "L'accumulation primitive", "enonce": "Le capitalisme n'a pu naître qu'en fermant les possibilités d'autoproduction (enclosures) et en ne laissant aux hommes dépossédés que la vente de leur force de travail.", "titre_en": "Primitive accumulation", "enonce_en": "Capitalism could only be born by closing off the possibilities of self-production (enclosures) and leaving dispossessed men nothing but the sale of their labour power.", "citation": "", "loc": ["06.1", "09.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon renvoie à Marx et à Polanyi pour la constitution historique des conditions de la prolétarisation (06.1). Il retrouve « l'effraction originelle de l'accumulation primitive » dans l'Antoine Doinel des *Quatre cents coups*, qui songe à voler un meuble pour se lancer dans les affaires (09.4 ; T010).", "body_en": "## In Lordon\n\nLordon refers to Marx and Polanyi for the historical constitution of the conditions of proletarianisation (06.1). He finds \"the original break-in of primitive accumulation\" in the Antoine Doinel of *The 400 Blows*, who dreams of stealing a piece of furniture to go into business (09.4; T010).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T010"], "corollaires": [], "mtime": 1794571085.9457762}, {"id": "M03", "file": "premisses/M03.md", "type": "marx", "partie": "P", "titre": "Il faut d'abord vivre", "enonce": "La présupposition première de toute existence humaine, donc de toute histoire, est que les hommes doivent pouvoir vivre : boire, manger, se loger, se vêtir.", "titre_en": "First one has to live", "enonce_en": "The first presupposition of all human existence, and so of all history, is that men must be able to live: drink, eat, find shelter, clothe themselves.", "citation": "« pour vivre, il faut avant tout boire, manger, se loger, s’habiller et quelques autres choses encore »", "loc": ["08.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCitation de *L'Idéologie allemande* (Marx et Engels ; 08.1, note 13), qui fonde la priorité du désir basal (D07) et, par lui, l'emprise du désir d'argent (T007).", "body_en": "## In Lordon\n\nA quotation from *The German Ideology* (Marx and Engels; 08.1, note 13), which grounds the priority of basic desire (D07) and, through it, the hold of the desire for money (T007).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D07", "T007"], "corollaires": [], "mtime": 1794571085.948283}, {"id": "M04", "file": "premisses/M04.md", "type": "marx", "partie": "P", "titre": "Travail et force de travail", "enonce": "L'employeur achète de la force de travail, non du travail ; la conversion de la première en le second reste à obtenir.", "titre_en": "Labour and labour power", "enonce_en": "The employer buys labour power, not labour; converting the former into the latter remains to be achieved.", "citation": "", "loc": ["27.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Les recruteurs redécouvrent quotidiennement la différence théoriquement repérée par Marx entre travail et force de travail » (27.1) : l'achat d'une force de travail ne garantit pas sa mobilisation effective (T030).", "body_en": "## In Lordon\n\n\"Recruiters rediscover daily the difference Marx identified in theory between labour and labour power\" (27.1): buying a labour power does not guarantee its actual mobilisation (T030).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T030"], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "M05", "file": "premisses/M05.md", "type": "marx", "partie": "P", "titre": "Le communisme, mouvement réel", "enonce": "Le communisme n'est pas un état de choses à établir ni un idéal auquel la réalité devrait se conformer : c'est le mouvement réel qui abolit l'état actuel des choses.", "titre_en": "Communism, the real movement", "enonce_en": "Communism is not a state of affairs to be established nor an ideal to which reality should conform: it is the real movement that abolishes the present state of things.", "citation": "« Nous appelons communisme le mouvement réel qui abolit l’état actuel des choses »", "loc": ["37.8", "38.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*L'Idéologie allemande* (note 126), qui clôt la section sur la récommune (37.8) et ouvre la question suivante : d'où peut naître ce mouvement réel, si le libre arbitre est une fiction ? (38.1 ; T042).", "body_en": "## In Lordon\n\n*The German Ideology* (note 126), which closes the section on the \"récommune\" (37.8) and opens the next question: where can this real movement arise from, if free will is a fiction? (38.1; T042).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T042"], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "M06", "file": "premisses/M06.md", "type": "marx", "partie": "P", "titre": "La division du travail sécrète le pouvoir", "enonce": "La division du travail produit d'elle-même du pouvoir : elle réserve à certaines places la coordination et la totalisation des informations, dont les autres n'ont qu'une vue parcellaire, et sépare la conception de l'exécution.", "titre_en": "The division of labour secretes power", "enonce_en": "The division of labour produces power of itself: it reserves to certain positions the coordination and totalisation of information, of which the others have only a partial view, and separates conception from execution.", "citation": "", "loc": ["35.5", "37.4", "42.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« C'est la division du travail, explique Marx, qui sécrète *endogènement* du pouvoir » (42.1), comme le montrent *L'Idéologie allemande* et *Le Capital* (note 145). Lordon déplore les lectures qui ont réduit les rapports de pouvoir capitalistes au seul régime de propriété. La « division princeps » de la conception et de l'exécution revient en 35.5 et 37.4.", "body_en": "## In Lordon\n\n\"It is the division of labour, Marx explains, that *endogenously* secretes power\" (42.1), as *The German Ideology* and *Capital* show (note 145). Lordon deplores the readings that reduced capitalist power relations to the property regime alone. The \"primary division\" between conception and execution returns in 35.5 and 37.4.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "S01", "file": "premisses/S01.md", "type": "spinoza", "partie": "P", "titre": "Le conatus", "enonce": "Chaque chose, autant qu'il est en elle, s'efforce de persévérer dans son être.", "titre_en": "The conatus", "enonce_en": "Each thing, as far as it is in itself, strives to persevere in its being.", "citation": "« chaque chose, autant qu’il est en elle, s’efforce de persévérer dans son être »", "loc": ["03.1"], "depends_on": [], "contre": [], "ethique": ["3p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPoint de départ du chapitre 1 (03.1), cité dans la traduction de Robert Misrahi (note 3). Lordon le lit comme la « force d'exister », l'énergie qui met les corps en mouvement : voir D01.", "body_en": "## In Lordon\n\nStarting point of chapter 1 (03.1), quoted in Robert Misrahi's translation (note 3). Lordon reads it as the \"force of existing\" (« force d'exister »), the energy that sets bodies in motion: see D01.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794571050.6035843}, {"id": "S02", "file": "premisses/S02.md", "type": "spinoza", "partie": "P", "titre": "L'argent, condensé de tous les biens", "enonce": "L'argent est devenu le condensé de tous les biens ; aussi son image occupe-t-elle l'esprit du vulgaire, qui n'imagine guère de joie qui ne soit accompagnée de l'idée de l'argent comme cause.", "titre_en": "Money, the epitome of all goods", "enonce_en": "Money has become the epitome of all goods; so its image occupies the mind of the common people, who can hardly imagine any kind of joy not accompanied by the idea of money as its cause.", "citation": "« L’argent est devenu le condensé de tous les biens »", "loc": ["06.3", "12.2"], "depends_on": [], "contre": [], "ethique": ["4appc28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'un des rares passages où Spinoza parle d'économie (06.3, note 6). Lordon y lit la naissance d'un **métadésir** (T006) dans une économie marchande à travail divisé ; il le reprend pour la consommation de masse, où l'énoncé « reçoive sa pleine dimension » (12.2, notes 28 et 29 ; T013). Il distingue le « lot commun », qui ne peut se passer d'argent, du « vulgaire », dont l'esprit en est *entièrement* occupé (note 7).", "body_en": "## In Lordon\n\nOne of the rare passages where Spinoza speaks of economics (06.3, note 6). Lordon reads in it the birth of a **meta-desire** (T006) in a market economy with a division of labour; he takes it up again for mass consumption, where the statement \"receives its full dimension\" (12.2, notes 28 and 29; T013). He distinguishes the \"common lot\", who cannot do without money, from the \"common people\" (*vulgus*), whose mind is *entirely* occupied by it (note 7).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T006", "T013"], "corollaires": [], "mtime": 1794571050.6055956}, {"id": "S03", "file": "premisses/S03.md", "type": "spinoza", "partie": "P", "titre": "Le désir, essence de l'homme", "enonce": "Le désir est l'essence même de l'homme en tant qu'elle est conçue comme déterminée, par une affection quelconque d'elle-même, à faire quelque chose.", "titre_en": "Desire, the essence of man", "enonce_en": "Desire is the very essence of man insofar as it is conceived as determined, by some affection of itself, to do something.", "citation": "« Le désir […] est l’essence même de l’homme en tant qu’elle est conçue comme déterminée par une quelconque affection d’elle-même à faire quelque chose »", "loc": ["08.3"], "depends_on": [], "contre": [], "ethique": ["3ad1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière définition des affects, citée en entier (08.3, note 14). Lordon en tire que le conatus, puissance d'agir générique, ne devient activité dirigée que sous l'effet d'une affection antécédente qui lui désigne un objet (T008).", "body_en": "## In Lordon\n\nFirst definition of the affects, quoted in full (08.3, note 14). Lordon draws from it that the conatus, a generic power of acting, only becomes directed activity under the effect of a prior affection that designates an object for it (T008).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T008"], "corollaires": [], "mtime": 1794571050.6055956}, {"id": "S04", "file": "premisses/S04.md", "type": "spinoza", "partie": "P", "titre": "On ne désire pas une chose parce qu'elle est bonne", "enonce": "Ce n'est pas parce qu'une chose est bonne que nous la désirons ; c'est parce que nous la désirons que nous la jugeons bonne.", "titre_en": "We do not desire a thing because it is good", "enonce_en": "It is not because a thing is good that we desire it; it is because we desire it that we judge it good.", "citation": "", "loc": ["08.3", "22.2", "35.2"], "depends_on": [], "contre": [], "ethique": ["3p9sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 16 (08.3), puis cité en entier en 22.2, où Lordon en tire que le désir est **axiogène** (D17). En 08.3, il sert au « renversement radical » de la conception ordinaire du désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir (T008, contre R03). L'énoncé ci-dessus résume le scolie ; Lordon ne le cite pas. Il y revient en 35.2 contre toute valeur substantielle (T037).", "body_en": "## In Lordon\n\nReferred to in note 16 (08.3), then quoted in full in 22.2, where Lordon concludes that desire is **axiogenic** (D17). In 08.3 it serves the \"radical reversal\" of the ordinary conception of desire: it is the thrust of the conatus that invests things and institutes them as objects of desire (T008, against R03). The statement above summarises the scholium; Lordon does not quote it. He returns to it in 35.2 against any substantial value (T037).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D17", "R03", "T008", "T037"], "corollaires": [], "mtime": 1794571050.6055956}, {"id": "S05", "file": "premisses/S05.md", "type": "spinoza", "partie": "P", "titre": "L'association des affects", "enonce": "Du seul fait que nous avons considéré une chose en même temps que nous étions affectés d'une joie ou d'une tristesse dont elle n'était pas la cause, nous pouvons l'aimer ou la haïr.", "titre_en": "The association of affects", "enonce_en": "Simply because we have regarded a thing while affected by a joy or a sadness of which it was not the cause, we can love or hate it.", "citation": "", "loc": ["08.3", "24.1"], "depends_on": [], "contre": [], "ethique": ["3p15c"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 18 (08.3), repris en 24.1 : les anciennes joies ou tristesses, « contaminant par connexité » de nouveaux objets, en font des objets de désir. Exemple de Lordon : Swann aime Odette parce qu'elle lui rappelle une figure de Botticelli.", "body_en": "## In Lordon\n\nQuoted in note 18 (08.3), taken up in 24.1: past joys or sadnesses, \"contaminating by connection\" new objects, make them objects of desire. Lordon's example: Swann loves Odette because she reminds him of a figure by Botticelli.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6055956}, {"id": "S06", "file": "premisses/S06.md", "type": "spinoza", "partie": "P", "titre": "L'imitation des affects", "enonce": "Du fait que nous imaginons qu'une chose semblable à nous est affectée d'un affect, nous sommes affectés d'un affect semblable.", "titre_en": "The imitation of affects", "enonce_en": "From imagining that a thing like us is affected by some affect, we are affected by a like affect.", "citation": "", "loc": ["08.3", "12.4", "24.1", "29.2", "34.1"], "depends_on": [], "contre": [], "ethique": ["3p27"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi des notes 19 et 32, repris au chapitre 2 (24.1, 29.2). Le désir circule entre les individus, qui « s'induisent les uns les autres à désirer par le spectacle mutuel de leurs élans » (08.3), surtout à travers des médiations sociales : émulation, distinction, goût et dégoût de groupe. En 34.1, l'*imitatio affectuum* attise l'envie des joies visibles des grands (T036). Appliqué à la consommation (12.4) : une société qui réduirait seule ses aspirations matérielles resterait exposée à l'imitation du désir de ses voisins.", "body_en": "## In Lordon\n\nReferred to in notes 19 and 32, taken up in chapter 2 (24.1, 29.2). Desire circulates between individuals, who \"induce one another to desire through the mutual spectacle of their impulses\" (08.3), above all through social mediations: emulation, distinction, group tastes and distastes. In 34.1, the *imitatio affectuum* stirs envy of the visible joys of the great (T036). Applied to consumption (12.4): a society that reduced its material aspirations on its own would remain exposed to the imitation of its neighbours' desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794571050.6086292}, {"id": "S07", "file": "premisses/S07.md", "type": "spinoza", "partie": "P", "titre": "La servitude", "enonce": "La servitude est l'impuissance humaine à diriger et à réprimer les affects : soumis aux affects, l'homme ne relève pas de lui-même mais de la fortune.", "titre_en": "Bondage", "enonce_en": "Bondage is human powerlessness to govern and restrain the affects: subject to the affects, man is not under his own control but under that of fortune.", "citation": "« J’appelle Servitude l’impuissance humaine à diriger et à réprimer les affects »", "loc": ["08.4"], "depends_on": [], "contre": [], "ethique": ["4pr"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière phrase de la préface de la partie IV, *De la servitude humaine, ou de la force des affects*, citée en 08.4. Lordon note que l'*Éthique* trace bien une voie de libération, mais que « peu nombreux sont les émancipés » : pour le lot commun, la servitude est la règle (T009).", "body_en": "## In Lordon\n\nFirst sentence of the preface to Part IV, *Of Human Bondage, or the Strength of the Affects*, quoted in 08.4. Lordon notes that the *Ethics* does trace a path of liberation, but that \"few are the emancipated\": for the common lot, bondage is the rule (T009).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T009"], "corollaires": [], "mtime": 1794571050.6091523}, {"id": "S08", "file": "premisses/S08.md", "type": "spinoza", "partie": "P", "titre": "La crainte", "enonce": "La crainte est une tristesse inconstante née de l'idée d'une chose future ou passée dont l'issue est pour nous en quelque mesure incertaine ; elle accompagne l'espoir, qui en est la face joyeuse.", "titre_en": "Fear", "enonce_en": "Fear is an inconstant sadness born of the idea of a future or past thing whose outcome is to some extent doubtful to us; it goes with hope, which is its joyful face.", "citation": "« tristesse inconstante née de l’idée d’une chose future ou passée, dont l’issue est en quelque mesure incertaine pour nous »", "loc": ["11.1", "31.4"], "depends_on": [], "contre": [], "ethique": ["3ad13"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDéfinition des affects 13, citée en 11.1 (note 24). Le « flottement de l'âme » revient en 31.4 : les « consentements » salariaux sont toujours mitigés (T034). Lordon ajoute que crainte et espoir sont « l'arrière-plan quasi permanent du désir » dès que l'objet n'est pas immédiatement à portée, l'espoir d'obtenir allant avec la crainte de manquer (*fluctuatio animi*). *[renvoi reconstruit : le lien de l'espoir et de la crainte est l'explication de 3ad13 ; l'espoir est défini en 3ad12.]*", "body_en": "## In Lordon\n\nDefinition of the affects 13, quoted in 11.1 (note 24). The \"vacillation of the mind\" returns in 31.4: wage-earners' \"consents\" are always mixed (T034). Lordon adds that fear and hope are \"the almost permanent background of desire\" whenever the object is not immediately within reach, the hope of obtaining going with the fear of going without (*fluctuatio animi*). *[reconstructed reference: the link between hope and fear is the explanation of 3ad13; hope is defined in 3ad12.]*", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794571050.610036}, {"id": "S09", "file": "premisses/S09.md", "type": "spinoza", "partie": "P", "titre": "La force du désir suit celle de l'affect", "enonce": "Le désir qui naît d'une tristesse ou d'une joie est d'autant plus grand que l'affect est plus grand : plus grande est la tristesse, plus grande est la puissance d'agir par laquelle on s'efforce de l'écarter ; un homme affecté de joie désire la conserver, d'autant plus que la joie est grande.", "titre_en": "The strength of desire follows that of the affect", "enonce_en": "The desire that arises from sadness or joy is the greater, the greater the affect: the greater the sadness, the greater the power of acting with which one strives to remove it; a man affected with joy desires to preserve it, the more so the greater the joy.", "citation": "« plus grande est la tristesse, plus grande est la puissance d’agir par laquelle l’homme s’efforce de lutter contre la tristesse »", "loc": ["11.1", "22.8", "23.3", "38.4"], "depends_on": [], "contre": [], "ethique": ["3p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDémonstration de III, 37, citée quatre fois : comme tout affect triste, la crainte induit du conatus un surplus d'activité pour s'en défaire (11.1, note 25 ; T012) ; la tristesse du travail sans sens peut pousser à la rébellion (22.8, note 64 ; T026) ; le salarié réjoui par l'amour du maître désire conserver cette joie (23.3, note 71 ; T027) ; la tristesse commune née d'une offense fait la puissance de l'indignation (38.4, note 129 ; T042).", "body_en": "## In Lordon\n\nDemonstration of III, 37, quoted four times: like every sad affect, fear induces from the conatus a surplus of activity to rid itself of it (11.1, note 25; T012); the sadness of meaningless work can push to rebellion (22.8, note 64; T026); the employee gladdened by love of the master desires to preserve that joy (23.3, note 71; T027); the common sadness born of an offence makes the power of indignation (38.4, note 129; T042).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T012", "T026", "T027", "T042"], "corollaires": [], "mtime": 1794571050.6108112}, {"id": "S10", "file": "premisses/S10.md", "type": "spinoza", "partie": "P", "titre": "L'illusion du libre arbitre", "enonce": "Les hommes se croient libres parce qu'ils sont conscients de leurs actions et ignorants des causes qui les déterminent.", "titre_en": "The illusion of free will", "enonce_en": "Men believe themselves free because they are conscious of their actions and ignorant of the causes that determine them.", "citation": "« Les hommes se trompent quand ils se croient libres ; car cette opinion consiste en cela seul qu’ils sont conscients de leurs actions et ignorants des causes qui les déterminent »", "loc": ["20.4", "24.3"], "depends_on": [], "contre": [], "ethique": ["2p35sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 : Spinoza ne se contente pas de nier le libre arbitre, il donne « le principe génétique » de la croyance, une troncature de l'intellection qui n'enregistre que les volitions et les actions. Repris en 24.3 : plus les déterminations sont multiples et diffuses, plus l'individu se croit l'origine de son désir.", "body_en": "## In Lordon\n\nQuoted in 20.4: Spinoza does not merely deny free will, he gives \"the genetic principle\" of the belief, a truncation of understanding that registers only volitions and actions. Taken up in 24.3: the more multiple and diffuse the determinations, the more the individual believes himself the origin of his desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6118357}, {"id": "S11", "file": "premisses/S11.md", "type": "spinoza", "partie": "P", "titre": "Toute chose finie est déterminée par une autre", "enonce": "Une chose finie, dont l'existence est déterminée, ne peut exister ni être déterminée à agir que si elle y est déterminée par une autre cause, elle aussi finie, et ainsi à l'infini.", "titre_en": "Every finite thing is determined by another", "enonce_en": "A finite thing with a determinate existence can neither exist nor be determined to act unless it is determined to do so by another cause, also finite, and so on to infinity.", "citation": "", "loc": ["20.4", "20.5"], "depends_on": [], "contre": [], "ethique": ["1p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 (note 51) et 20.5 : « nous ne faisons quelque chose que s'il nous arrive quelque chose ». D'où la séquence affection-affect-action, que Lordon propose de contracter en « affectaction ».", "body_en": "## In Lordon\n\nQuoted in 20.4 (note 51) and 20.5: \"we do something only if something happens to us\". Hence the sequence affection-affect-action, which Lordon proposes to contract into \"affectaction\".", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S12", "file": "premisses/S12.md", "type": "spinoza", "partie": "P", "titre": "Cause adéquate et cause inadéquate", "enonce": "Une cause est adéquate quand on peut percevoir clairement et distinctement son effet par elle seule ; inadéquate ou partielle quand on ne peut comprendre son effet par elle seule.", "titre_en": "Adequate and inadequate cause", "enonce_en": "A cause is adequate when its effect can be clearly and distinctly perceived through it alone; inadequate or partial when its effect cannot be understood through it alone.", "citation": "", "loc": ["20.4"], "depends_on": [], "contre": [], "ethique": ["3def1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 50 (20.4) : toute chose se trouve « sous l'empire de la causalité inadéquate », partiellement déterminée à agir par d'autres choses ; aucune action ne peut donc être revendiquée comme *entièrement* sienne.", "body_en": "## In Lordon\n\nQuoted in note 50 (20.4): every thing finds itself \"under the sway of inadequate causality\", partly determined to act by other things; so no action can be claimed as *entirely* one's own.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S13", "file": "premisses/S13.md", "type": "spinoza", "partie": "P", "titre": "L'ambition : vouloir que les autres vivent selon sa complexion", "enonce": "L'effort pour que les autres approuvent ce que nous aimons ou haïssons est l'ambition : chacun, par nature, désire que les autres vivent selon sa propre constitution.", "titre_en": "Ambition: wanting others to live by one's own complexion", "enonce_en": "The striving to have others approve what we love or hate is ambition: everyone, by nature, desires that others live according to his own constitution.", "citation": "« chacun, par nature, désire que les autres vivent selon sa propre constitution »", "loc": ["20.6", "34.2"], "depends_on": [], "contre": [], "ethique": ["3p31csc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.6 (note 55). Lordon y voit le principe des guerres de religion et des « chocs de civilisations », et surtout l'origine du *jugement d'aliénation* : nous refusons le consentement de ceux qui ne vivent pas selon notre complexion (T022). La suite du scolie (« tous se font également obstacle ») sert en 34.2 à penser la domination comme réservation des objets de désir (T036).", "body_en": "## In Lordon\n\nQuoted in 20.6 (note 55). Lordon sees in it the principle of the wars of religion and of \"clashes of civilisations\", and above all the origin of the *judgement of alienation*: we refuse the consent of those who do not live according to our complexion (T022). The rest of the scholium (\"all equally stand in one another's way\") serves in 34.2 to think domination as the reserving of objects of desire (T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T022", "T036"], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S14", "file": "premisses/S14.md", "type": "spinoza", "partie": "P", "titre": "Le bien et le mal, joie et tristesse", "enonce": "Par bien il faut entendre toute forme de joie et ce qui y conduit, notamment ce qui satisfait un désir ; par mal, toute forme de tristesse, notamment celle qui frustre un désir.", "titre_en": "Good and evil, joy and sadness", "enonce_en": "By good is to be understood every kind of joy and whatever leads to it, especially what satisfies a desire; by evil, every kind of sadness, especially that which frustrates a desire.", "citation": "", "loc": ["20.6"], "depends_on": [], "contre": [], "ethique": ["3p39sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 56 (20.6) : nos amours et nos haines nous font valoriser les choses ; c'est d'eux que procèdent nos jugements sur la vie des autres.", "body_en": "## In Lordon\n\nQuoted in note 56 (20.6): our loves and hatreds make us value things; from them proceed our judgements on the lives of others.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S15", "file": "premisses/S15.md", "type": "spinoza", "partie": "P", "titre": "L'obsequium : crainte ou amour", "enonce": "Les sujets relèvent du droit de la Cité, et non du leur propre, dans la mesure où ils craignent sa puissance ou dans la mesure où ils aiment la société civile.", "titre_en": "Obsequium: fear or love", "enonce_en": "Subjects are under the right of the Commonwealth, and not their own, to the extent that they fear its power or to the extent that they love civil society.", "citation": "« Les sujets relèvent non de leur droit propre mais de celui de la Cité, dans la mesure même où ils craignent sa puissance, c’est-à-dire ses menaces, ou encore dans la mesure où ils aiment la société civile »", "loc": ["21.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, III, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3, dans la traduction de Charles Ramond (note 58). Lordon en tire « la vérité affective bipolaire du pouvoir : il fonctionne à la crainte ou à l'amour », valable pour tous les pouvoirs, y compris patronal (D16, T024). Il lit le *Traité politique* comme une théorie générale des institutions (note 57).", "body_en": "## In Lordon\n\nQuoted in 21.3, in Charles Ramond's translation (note 58). Lordon draws from it \"the bipolar affective truth of power: it runs on fear or on love\", valid for all powers, including the employer's (D16, T024). He reads the *Political Treatise* as a general theory of institutions (note 57).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D16", "T024"], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S16", "file": "premisses/S16.md", "type": "spinoza", "partie": "P", "titre": "Une vie humaine", "enonce": "Les hommes aspirent à
