\n\nC'est la signification de « quasi-norme morale » que la stabilité de l'emploi fordien a prise aux yeux de l'opinion (16.1). L'opinion « avait cru, ou s'était aventurée à croire » que le licenciement était un interdit (16.2).", "body_en": "## As Lordon presents it\n\nThis is the meaning of \"quasi-moral norm\" that Fordist job stability took on in the eyes of public opinion (16.1). Opinion \"had believed, or had ventured to believe\" that dismissal was taboo (16.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.954705}, {"id": "R06", "file": "refutees/R06.md", "type": "refutee", "partie": "2", "titre": "Le consentement, approbation d'une volonté libre", "enonce": "Consentir serait donner l'approbation intime d'une volonté libre : le sujet authentique, autonome et auto-fondé, parlerait en son noyau quand il consent.", "titre_en": "Consent, the approval of a free will", "enonce_en": "To consent would be to give the inner approval of a free will: the authentic subject, autonomous and self-founded, would speak from its core when it consents.", "citation": "", "loc": ["20.3", "20.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nC'est la « fausse transparence » du consentement, symptôme de la métaphysique de la subjectivité (20.2-20.3). Elle bute sur les « consentements à problème » (le gourou, le voile, le travail douze heures par jour), qu'elle ne peut écarter qu'en déclarant certains objets inconsentables ou certains sujets intermittents (20.3).", "body_en": "## As Lordon presents it\n\nThis is the \"false transparency\" of consent, a symptom of the metaphysics of subjectivity (20.2-20.3). It runs up against \"problem consents\" (the guru, the veil, working twelve hours a day), which it can only set aside by declaring certain objects unconsentable or certain subjects intermittent (20.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.954705}, {"id": "R07", "file": "refutees/R07.md", "type": "refutee", "partie": "2", "titre": "L'aliénation comme étrangeté à soi", "enonce": "Être aliéné serait être séparé de soi-même : un sujet, autonome en son noyau, serait empêché de procéder de lui-même par un attachement à autre chose que lui.", "titre_en": "Alienation as estrangement from oneself", "enonce_en": "To be alienated would be to be separated from oneself: a subject, autonomous at its core, would be prevented from proceeding from itself by an attachment to something other than itself.", "citation": "", "loc": ["20.5", "23.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLordon la rattache aux lectures « pré-althussériennes » de Marx (23.3) et à l'usage courant qui réserve l'aliénation aux attachements dont nous ne voudrions pas pour nous (20.5).", "body_en": "## As Lordon presents it\n\nLordon links it to \"pre-Althusserian\" readings of Marx (23.3) and to the common usage that reserves alienation for the attachments we would not want for ourselves (20.5).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9563174}, {"id": "R08", "file": "refutees/R08.md", "type": "refutee", "partie": "2", "titre": "L'intériorité et l'intériorisation", "enonce": "Le consentement serait l'adhésion d'un for intérieur : les normes seraient « intériorisées », et nos états d'âme situés au-dedans de nous.", "titre_en": "Interiority and internalisation", "enonce_en": "Consent would be the adherence of an inner self: norms would be \"internalised\", and our states of mind located inside us.", "citation": "", "loc": ["28.1", "28.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nHéritage des « impasses cartésiennes » (28.2) : pour que l'âme commande au corps, Descartes doit leur trouver un lieu commun, la glande pinéale. Les neurosciences qui confondent l'esprit et le cerveau « continuent de fouiller “dedans” » (28.2).", "body_en": "## As Lordon presents it\n\nA legacy of the \"Cartesian dead ends\" (28.2): for the soul to command the body, Descartes must find them a common place, the pineal gland. The neurosciences that confuse the mind with the brain \"keep searching 'inside'\" (28.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9579592}, {"id": "R09", "file": "refutees/R09.md", "type": "refutee", "partie": "2", "titre": "L'antinomie de la contrainte et du consentement", "enonce": "Contrainte et consentement, coercition et légitimité, *hard power* et *soft power* désigneraient deux opérations objectives différentes : la force extérieure d'un côté, l'assentiment intérieur de l'autre.", "titre_en": "The antinomy of constraint and consent", "enonce_en": "Constraint and consent, coercion and legitimacy, *hard power* and *soft power* would designate two different objective operations: external force on one side, inner assent on the other.", "citation": "", "loc": ["21.4", "28.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne « antinomie fausse » (21.4), à laquelle même Durkheim se laisse prendre en faisant de la « contrainte » le mode opératoire des normes : il prend pour un fait objectif ce qui n'est que l'expression d'un sentiment (21.4). Même aporie pour la coercition et la légitimité, le *hard* et le *soft power* (28.3).", "body_en": "## As Lordon presents it\n\nA \"false antinomy\" (21.4), into which even Durkheim falls when he makes \"constraint\" the mode of operation of norms: he takes for an objective fact what is only the expression of a feeling (21.4). Same aporia for coercion and legitimacy, *hard* and *soft power* (28.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9579592}, {"id": "R10", "file": "refutees/R10.md", "type": "refutee", "partie": "2", "titre": "La demande d'amour au travail, sublimation de l'amour parental", "enonce": "La quête d'amour et de reconnaissance dans le travail serait une métamorphose, par sublimation, de la demande amoureuse originelle de l'enfant envers ses parents.", "titre_en": "The demand for love at work, a sublimation of parental love", "enonce_en": "The quest for love and recognition at work would be a metamorphosis, through sublimation, of the child's original demand for love towards its parents.", "citation": "", "loc": ["23.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'hypothèse ontogénétique de la psychanalyse, qui accorde à cette demande « l'absolu primat » (23.2).", "body_en": "## As Lordon presents it\n\nThe ontogenetic hypothesis of psychoanalysis, which grants this demand \"absolute primacy\" (23.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9589703}, {"id": "R11", "file": "refutees/R11.md", "type": "refutee", "partie": "3", "titre": "La valeur objective et l'exploitation comme extraction de plus-value", "enonce": "Il existerait une valeur substantielle, mesurée par le temps de travail abstrait ; l'exploitation serait l'appropriation par le capital de la plus-value, écart entre la valeur produite et la valeur de reproduction de la force de travail.", "titre_en": "Objective value, and exploitation as extraction of surplus value", "enonce_en": "There would be a substantial value, measured by abstract labour time; exploitation would be capital's appropriation of surplus value, the gap between the value produced and the value of reproducing labour power.", "citation": "", "loc": ["35.1", "35.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa théorie marxienne de la valeur-travail (35.1). Lordon y voit la principale divergence entre Marx et Spinoza, avec la dialectique du négatif : la valeur substantielle est une « figure de la transcendance subrepticement réintroduite au cœur de l'immanence » (35.2). La définition de la valeur de la force de travail est en outre circulaire : c'est le salaire qui l'indique (35.1).", "body_en": "## As Lordon presents it\n\nThe Marxian labour theory of value (35.1). Lordon sees in it the main divergence between Marx and Spinoza, together with the dialectic of the negative: substantial value is a \"figure of transcendence surreptitiously reintroduced at the heart of immanence\" (35.2). The definition of the value of labour power is moreover circular: it is the wage that indicates it (35.1).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}, {"id": "R12", "file": "refutees/R12.md", "type": "refutee", "partie": "3", "titre": "Le changement suppose le libre arbitre", "enonce": "Le déterminisme ne pourrait penser le changement, puisque « tout est écrit » ; seules des volontés libres pourraient produire le nouveau et briser leurs chaînes.", "titre_en": "Change presupposes free will", "enonce_en": "Determinism could not think change, since \"everything is written\"; only free wills could produce the new and break their chains.", "citation": "", "loc": ["38.1", "38.2", "38.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUn contresens sur le déterminisme (38.1), partagé, note Lordon, par les discours d'exaltation du soulèvement et par les apologies de l'entrepreneur : tous deux libéraux en philosophie (38.2). Le « nouveau » se veut un surgissement sans cause, c'est-à-dire un miracle (38.3).", "body_en": "## As Lordon presents it\n\nA misreading of determinism (38.1), shared, Lordon notes, by the discourses exalting uprising and by the apologies for the entrepreneur: both liberal in philosophy (38.2). The \"new\" claims to be an uncaused emergence, that is, a miracle (38.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}, {"id": "R13", "file": "refutees/R13.md", "type": "refutee", "partie": "3", "titre": "La désaliénation comme retrouvaille de sa puissance", "enonce": "L'aliéné serait « coupé de sa puissance d'agir » ; s'émanciper serait la rejoindre, la réapproprier, recoïncider avec soi.", "titre_en": "Disalienation as recovering one's power", "enonce_en": "The alienated would be \"cut off from their power of acting\"; emancipation would mean rejoining it, reappropriating it, coinciding with oneself again.", "citation": "", "loc": ["40.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schème des relectures contemporaines du jeune Marx, et, selon Pascal Sévérac, de Deleuze lui-même lisant Spinoza (40.1).", "body_en": "## As Lordon presents it\n\nThe schema of contemporary rereadings of the young Marx, and, according to Pascal Sévérac, of Deleuze himself reading Spinoza (40.1).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}, {"id": "R14", "file": "refutees/R14.md", "type": "refutee", "partie": "3", "titre": "La condition salariale fait à elle seule la classe", "enonce": "La situation objective de vendeur de force de travail déterminerait à elle seule l'appartenance de classe ; l'engagement vécu des salariés ne serait qu'une superficialité « subjectiviste ».", "titre_en": "The wage condition alone makes class", "enonce_en": "The objective situation of seller of labour power would alone determine class membership; the lived commitment of employees would be a mere \"subjectivist\" superficiality.", "citation": "", "loc": ["41.1", "41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schéma de la théorie marxienne originelle, mis en difficulté dès que le dirigeant est devenu salarié, et par la « diffusion cadriste » (41.1, note 140). Le cas limite du PDG salarié la réfute par l'absurde (41.3).", "body_en": "## As Lordon presents it\n\nThe schema of the original Marxian theory, put in difficulty as soon as the executive became an employee, and by the \"spread of the managerial layer\" (41.1, note 140). The limit case of the salaried CEO refutes it by reductio ad absurdum (41.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}, {"id": "R15", "file": "refutees/R15.md", "type": "refutee", "partie": "3", "titre": "Les classes ont disparu", "enonce": "Il n'y aurait plus de classes : la fragmentation du salariat aurait rendu caduque l'idée même de lutte des classes.", "titre_en": "Classes have disappeared", "enonce_en": "There would be no more classes: the fragmentation of wage labour would have made the very idea of class struggle obsolete.", "citation": "", "loc": ["41.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa position d'« une certaine sociologie désireuse de tourner au plus vite la page du marxisme pour mieux épouser l'air du temps libéral » (41.4).", "body_en": "## As Lordon presents it\n\nThe position of \"a certain sociology eager to turn the page on Marxism as fast as possible, the better to embrace the liberal spirit of the times\" (41.4).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}, {"id": "R16", "file": "refutees/R16.md", "type": "refutee", "partie": "3", "titre": "L'émancipation comme grand soir", "enonce": "Il suffirait d'abolir la propriété privée des moyens de production pour en finir avec la domination ; la révolution ferait advenir d'un coup un ordre tout autre, où les classes et le politique s'éteindraient.", "titre_en": "Emancipation as the \"grand soir\"", "enonce_en": "It would suffice to abolish private ownership of the means of production to put an end to domination; revolution would bring about at a stroke an entirely different order, in which classes and politics would wither away.", "citation": "", "loc": ["42.1", "43.2", "43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLes lectures trop rapides de Marx qui réduisent le pouvoir au régime de propriété (42.1) ; l'idée du « grand soir » (43.2) ; l'« extinction du politique », « fantasmagories post-politiques », peut-être « l'erreur anthropologique la plus profonde de Marx » (43.3).", "body_en": "## As Lordon presents it\n\nThe overhasty readings of Marx that reduce power to the property regime (42.1); the idea of the \"grand soir\", the great night of revolution (43.2); the \"withering away of politics\", \"post-political phantasmagorias\", perhaps \"Marx's deepest anthropological error\" (43.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9603803}], "documents": [{"name": "PARCOURS.md", "kind": "projet", "body": "# Parcours de lecture\n\nLe treillis se parcourt dans tous les sens. Pour une première lecture, voici un fil de seize étapes, de la question du livre à sa conclusion. Chaque étape renvoie à un élément ; de là, « Chemin vers » montre ce sur quoi il repose, « Conséquences » ce qui en découle.\n\n## I. La question\n\n**1.** T001. Comment certains hommes « peuvent »-ils en faire travailler d'autres pour leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza).\n\n**2.** T002. Le capitalisme contemporain produit des « dominés heureux ». Il faut repenser la domination sans recourir à la « servitude volontaire ».\n\n## II. Faire faire\n\n**3.** D01, T003. Le conatus est l'énergie du désir. Désirer faire est légitime ; faire faire, enrôler d'autres puissances (D02) au service d'un désir-maître (D03), pose une question politique.\n\n**4.** T006, T007. Dans une économie à travail divisé, la vie passe par l'argent : le rapport salarial est d'abord dépendance, donc domination, la plus puissante qui soit.\n\n**5.** T008, T009. Le désir est hétéronome : ses objets lui viennent du dehors. La servitude volontaire n'existe pas ; il n'y a que la servitude passionnelle, et elle est universelle.\n\n**6.** T014. Mobiliser, c'est aligner : le modèle de l'angle α (voir la [figure de l'angle α](#alpha)).\n\n**7.** T015, T019. Les régimes de mobilisation changent : la faim, puis la consommation, puis l'entreprise néolibérale, qui veut α = 0 et pousse la domination jusqu'à la tyrannie.\n\n## III. Joyeux automobiles\n\n**8.** T021. Le projet néolibéral : faire désirer le travail lui-même (voir la vue des [régimes d'affects](#regimes)).\n\n**9.** T022, T025. Le consentement, l'aliénation et l'intériorité n'existent pas comme on les entend ; contrainte et consentement ne sont que des affects tristes ou joyeux.\n\n**10.** T024, T027, T028. D'où vient l'obéissance joyeuse : le pouvoir règne mieux par l'amour ; l'amour du maître ; les images vocationnelles.\n\n**11.** T029, T034. L'entreprise vise la possession des âmes, mais le fond d'affects tristes demeure.\n\n## IV. Domination, émancipation\n\n**12.** T035, T036. Même joyeuse, la domination réserve le désirable aux uns et en écarte les autres.\n\n**13.** T038. L'exploitation est passionnelle : une capture de puissance d'agir, non une extraction de plus-value.\n\n**14.** T040. La récommune : l'entreprise constituée en démocratie radicale.\n\n**15.** T042, T043. Le changement sans libre arbitre : l'indignation fait « devenir perpendiculaire ».\n\n**16.** T048, T049. Le communisme véritable est un horizon ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux.\n\n", "body_en": "# Reading path\n\nThe lattice can be explored in every direction. For a first reading, here is a thread of sixteen steps, from the book's question to its conclusion. Each step points to an element; from there, \"Path to\" shows what it rests on, \"Consequences\" what follows from it.\n\n## I. The question\n\n**1.** T001. How \"can\" some men make others work for their desire? This power is an effect of structure (Marx), but structures act through the affects (Spinoza).\n\n**2.** T002. Contemporary capitalism produces \"happy dominated\" people. Domination must be rethought without resorting to \"voluntary servitude\".\n\n## II. Making others do\n\n**3.** D01, T003. The conatus is the energy of desire. Desiring to do is legitimate; having others do, enlisting other powers (D02) in the service of a master-desire (D03), raises a political question.\n\n**4.** T006, T007. In an economy with a division of labour, life goes through money: the wage relation is first dependence, hence domination, the most powerful there is.\n\n**5.** T008, T009. Desire is heteronomous: its objects come to it from outside. Voluntary servitude does not exist; there is only passional servitude, and it is universal.\n\n**6.** T014. Mobilising means aligning: the model of the angle α (see the [figure of the angle α](#alpha)).\n\n**7.** T015, T019. Regimes of mobilisation change: hunger, then consumption, then the neoliberal firm, which wants α = 0 and pushes domination as far as tyranny.\n\n## III. Joyful self-movers\n\n**8.** T021. The neoliberal project: making work itself desired (see the view of the [regimes of affects](#regimes)).\n\n**9.** T022, T025. Consent, alienation and interiority do not exist as they are usually understood; constraint and consent are only sad or joyful affects.\n\n**10.** T024, T027, T028. Where joyful obedience comes from: power reigns better through love; love of the master; vocational images.\n\n**11.** T029, T034. The firm aims at possessing souls, but the background of sad affects remains.\n\n## IV. Domination, emancipation\n\n**12.** T035, T036. Even joyful, domination reserves the desirable for some and keeps it from others.\n\n**13.** T038. Exploitation is passional: a capture of power of acting, not an extraction of surplus value.\n\n**14.** T040. The récommune: the enterprise constituted as a radical democracy.\n\n**15.** T042, T043. Change without free will: indignation makes one \"become perpendicular\".\n\n**16.** T048, T049. True communism is a horizon; but not all passional regimes are equal, and progress is the enrichment of life in joyful affects.\n"}, {"name": "NOTICE.md", "kind": "projet", "body": "# Sources, droits et mentions\n\nCe projet reconstruit l'argument d'un livre sous droits. Il n'en reproduit pas le texte : il le **reformule**, en renvoyant à chaque passage, et n'en **cite** que de courts extraits. **Pour lire Lordon, lisez Lordon.**\n\n## Le livre\n\n- Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza*, Paris, La Fabrique, 2010. © Frédéric Lordon et La Fabrique éditions.\n- Traduction anglaise : *Willing Slaves of Capital. Spinoza and Marx on Desire*, trad. Gabriel Ash, Londres, Verso, 2014.\n- Ce que le dépôt contient du livre : de courtes citations (433 passages, presque tous de quelques mots ; au plus 29 mots consécutifs pour Lordon), chacune avec son repère (section et paragraphe), et les titres de ses sections, utilisés comme repères. Le texte lui-même n'est pas distribué : le dossier `source/` est exclu du dépôt, et `outils/check.py` vérifie qu'il le reste.\n- Ces citations relèvent du droit de courte citation (Code de la propriété intellectuelle, art. L122-5, 3°) : elles sont incorporées à un travail d'analyse et leur source est indiquée. Elles ne sont **pas** couvertes par les licences du dépôt (voir `LICENSE`).\n\n## La version anglaise\n\n- La version anglaise traduit la reconstruction (titres, énoncés, démonstrations, commentaires). Elle est faite sur la reconstruction française, non sur la traduction anglaise publiée, qui n'est ni utilisée ni citée.\n- Dans les corps anglais, les mots de Lordon, quand ils sont cités, sont rendus brièvement par nous, avec les mêmes repères ; le champ `citation` garde l'original français.\n- Les titres de section et les repères (§ 08.4) renvoient à l'édition française.\n\n## Spinoza\n\n- Les liens vers l'*Éthique* renvoient à [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (en ligne : <https://treillis.qpetit.com/spinoza/>), qui publie le texte latin et des traductions du domaine public. Rien de SpinozaGraph n'est copié ici.\n- Les énoncés des prémisses S sont des reformulations de Spinoza. Les citations de Spinoza sont celles que fait Lordon, dans les traductions qu'il emploie : Robert Misrahi pour l'*Éthique* (traduction protégée), Charles Ramond pour le *Traité politique* (traduction protégée), Charles Appuhn pour quelques lettres et passages (domaine public). Elles sont courtes et sourcées.\n\n## Autres auteurs\n\nLes citations de Marx et Engels, Kant, Pascal, Camus, Bourdieu, Deleuze, Balibar et d'autres sont celles que rapporte Lordon, avec la référence qu'il donne en note.\n\n## Le projet\n\n- Reconstruction, traduction anglaise, outils et explorateur : auteur du dépôt [mqtin](https://github.com/mqtin), 2026, avec l'aide de Claude (Anthropic).\n- L'explorateur est adapté de celui d'Homo Status, autre projet du même auteur (<https://treillis.qpetit.com/status>).\n- Licences : code sous GPL-3.0, travail de reconstruction (et sa traduction) sous CC BY-SA 4.0, citations exclues (voir `LICENSE`).\n\n**Ces mentions doivent être conservées** dans toute redistribution du dépôt ou d'`explorer.html`.\n", "body_en": "# Sources, rights and credits\n\nThis project reconstructs the argument of a book under copyright. It does not reproduce its text: it **paraphrases** it, pointing to each passage, and **quotes** only short extracts. **To read Lordon, read Lordon.**\n\n## The book\n\n- Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza*, Paris, La Fabrique, 2010. © Frédéric Lordon and La Fabrique éditions.\n- English translation: *Willing Slaves of Capital. Spinoza and Marx on Desire*, trans. Gabriel Ash, London, Verso, 2014.\n- What the repository contains of the book: short quotations (433 passages, almost all a few words long; at most 29 consecutive words of Lordon), each with its locator (section and paragraph), and the titles of its sections, used as locators. The text itself is not distributed: the `source/` folder is excluded from the repository, and `outils/check.py` checks that it stays so.\n- These quotations fall under the right of short quotation (French Intellectual Property Code, art. L122-5, 3°): they are incorporated into a work of analysis and their source is given. They are **not** covered by the repository's licences (see `LICENSE`).\n\n## The English version\n\n- The English version translates the reconstruction (titles, statements, demonstrations, comments). It was made from the French reconstruction, not from the published English translation, which is neither used nor quoted.\n- In the English bodies, Lordon's words, where quoted, are our own short renderings of the French, with the same locators; the `citation` field keeps the original French.\n- Section titles and locators (§ 08.4) refer to the French edition.\n\n## Spinoza\n\n- Links to the *Ethics* point to [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (online: <https://treillis.qpetit.com/spinoza/>), which publishes the Latin text and public-domain translations, including Elwes's English. Nothing from SpinozaGraph is copied here.\n- The statements of the S premises are paraphrases of Spinoza. The quotations from Spinoza are those Lordon makes, in the translations he uses: Robert Misrahi for the *Ethics* (protected translation), Charles Ramond for the *Political Treatise* (protected translation), Charles Appuhn for a few letters and passages (public domain). They are short and sourced.\n\n## Other authors\n\nQuotations from Marx and Engels, Kant, Pascal, Camus, Bourdieu, Deleuze, Balibar and others are those Lordon reports, with the reference he gives in his notes.\n\n## The project\n\n- Reconstruction, translation, tools and explorer: repository author [mqtin](https://github.com/mqtin), 2026, with the help of Claude (Anthropic).\n- The explorer is adapted from that of Homo Status, another project by the same author (<https://treillis.qpetit.com/status>).\n- Licences: code under GPL-3.0, reconstruction work (and its translation) under CC BY-SA 4.0, quotations excluded (see `LICENSE`).\n\n**These notices must be kept** in any redistribution of the repository or of `explorer.html`.\n"}, {"name": "AGENT.md", "kind": "projet", "body": "# AGENT.md : *Capitalisme, désir et servitude* en treillis\n\nCe fichier définit l'objectif, la méthode et les conventions du projet. Il s'adresse à l'agent (Claude) et à l'auteur. Tout travail dans ce dépôt doit s'y conformer. Il évolue avec le projet, et toute modification est discutée avec l'auteur.\n\nProjets voisins : [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (l'*Éthique*, `/spinoza`) et Homo Status (`/status`, dépôt `status-and-politics`), dont ce projet reprend l'outillage et une partie des conventions.\n\n## 1. Objectif\n\nReconstruire **fidèlement** l'argument de Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza* (La Fabrique, 2010), dans l'ordre géométrique, et le rendre explorable comme un graphe. Depuis une thèse, on doit pouvoir voir le chemin qui y mène, jusqu'aux prémisses spinozistes et marxiennes, et ce qui en découle.\n\nC'est une **reconstruction, non une critique**. On ne juge pas les thèses, on ne cherche pas de rivales et on ne dit pas ce qui les réfuterait : ce travail-là appartient à Homo Status (`status-and-politics/references/lordon.md`). Ici, la seule question est : *qu'est-ce que Lordon dit, et comment est-ce que cela s'enchaîne ?*\n\n## 2. Fidélité\n\n1. **Rien qui ne soit dans le livre.** Chaque élément reformule un passage du livre. Si un pas manque pour relier deux thèses, on le signale (§ 2.4) ; on n'ajoute pas de contenu.\n2. **Toute affirmation a son repère** (champ `loc`, § 6). Dans une démonstration, chaque étape porte son repère entre parenthèses : « (08.4) ».\n3. **Les renvois à Spinoza sont ceux de Lordon.** Quand Lordon cite l'*Éthique*, on note le renvoi tel quel (champ `ethique`). Quand on identifie soi-même la proposition qu'il utilise sans la citer, on l'écrit dans le corps, marqué *[renvoi reconstruit]*.\n4. **Explicite ou reconstruit.** Le champ `lien_explicite` d'une thèse dit si Lordon fait lui-même les liens déclarés dans `depends_on` (`true`) ou si on les a reconstruits pour relier son argument (`false`). Dans le corps, un pas que Lordon ne fait pas est marqué *[reconstruit]*.\n5. **Démonstration ou argumentation.** Une thèse a une section `## Démonstration` quand Lordon déduit, et une `## Argumentation` quand il établit par exemples, analogies ou réfutation. On ne fabrique pas de déduction absente du livre.\n6. **Le vocabulaire de Lordon** est conservé (enrôlement, désir-maître, colinéarisation, épithumè…). On ne le traduit pas dans celui d'Homo Status.\n\n## 3. Types d'éléments\n\n| type | préfixe | dossier | rôle |\n|---|---|---|---|\n| `definition` | `D` | `definitions/` | un concept que Lordon définit ou forge (enrôlement, désir-maître, angle α…) |\n| `spinoza` | `S` | `premisses/` | une thèse de Spinoza que Lordon prend comme prémisse ; renvoie à l'*Éthique* (`ethique`) sans en recopier le texte, qui est dans SpinozaGraph, ou, pour une autre œuvre (*Traité politique*, lettres), la cite dans `ref` (ex. « Traité politique, III, 8 ») |\n| `marx` | `M` | `premisses/` | une thèse de Marx que Lordon prend comme prémisse (rapport salarial, double séparation, argent…) |\n| `these` | `T` | `theses/` | une thèse de Lordon, avec sa démonstration ou son argumentation |\n| `refutee` | `R` | `refutees/` | une position que Lordon réfute (servitude volontaire, consentement, intériorité…), énoncée telle qu'il la présente |\n\n- Concepts, prémisses et positions réfutées ne s'appuient que sur des concepts et des prémisses. Seules les thèses s'appuient sur des thèses.\n- Le champ `contre` d'une thèse liste les positions `R` qu'elle réfute. Ces arêtes « contre » sont distinctes des appuis : elles n'entrent ni dans le chemin ni dans les conséquences.\n- Un **corollaire** se rédige dans le fichier de sa thèse et porte l'identifiant `T012-C1`. Une **scolie** (exemples, digressions, résumés) est un commentaire et n'est pas porteuse logiquement.\n- Les identifiants sont globaux (`T012`, et non « chap. 1, thèse 12 »). Ils sont numérotés dans l'ordre d'apparition dans le livre et peuvent être renumérotés tant que le pilote n'est pas validé (§ 7) ; toute renumérotation est répercutée partout.\n\n## 4. Structure du dépôt\n\n```\nAGENT.md          ce fichier\nsections.yaml     titres des sections du livre, pour les repères (§ 6)\nREADME.md\nPARCOURS.md       parcours de lecture : un fil d'une quinzaine d'éléments, de la question du livre à sa conclusion\nPARCOURS.en.md    sa version anglaise ; de même NOTICE.en.md (§ 5 bis)\nINDEX.md          table de tous les éléments, plan par chapitre, journal\nparties/          P (prémisses), 0 (avant-propos), 1, 2, 3 (chapitres) : titre de Lordon, sections, résumé\ndefinitions/      D01.md …\npremisses/        S01.md …, M01.md …\ntheses/           T001.md …\nrefutees/         R01.md …\noutils/           build_explorer.py, explorer_template.html, check.py, extract_epub.py\nsource/           NON VERSIONNÉ : le fichier du livre et le texte extrait (§ 6)\nexplorer.html     généré\n```\n\nChaque élément porte un champ `partie` : `P` pour les prémisses S et M, sinon le chapitre où il apparaît (`0` pour l'avant-propos). `INDEX.md` est mis à jour à chaque ajout, modification ou retrait.\n\n## 5. Format d'un fichier\n\n```markdown\n---\nid: T012\ntype: these                 # definition | spinoza | marx | these | refutee\npartie: \"1\"                 # P | 0 | 1 | 2 | 3\ntitre: Titre court\nenonce: >\n  Reformulation de la thèse, en une ou deux phrases.\nloc: [\"08.2\", \"08.4\"]        # repères section.paragraphe (§ 6)\ncitation: \"« … »\"           # facultative ; une ou deux phrases au plus (§ 6)\ndepends_on: [D03, S02, T009]\ncontre: [R02]               # thèses seulement\nethique: [3p6, 3p9sc]       # identifiants de SpinozaGraph (obligatoire pour S)\nlien_explicite: true        # thèses seulement (§ 2.4)\nstatut_revision: brouillon  # brouillon | verifie-texte\n---\n\n## Énoncé\n…\n\n## Démonstration            (ou ## Argumentation)\n1. Par S02, … (08.3).\n2. Par D03 et T009, … (08.4). ∎\n\n## Scolie\nExemples et digressions du livre, résumés.\n```\n\n**§ 5 bis. Version anglaise.** Chaque élément et chaque partie a sa version anglaise dans le même fichier : `titre_en`, `enonce_en` (ou `resume_en`) dans le front-matter, et, après une ligne `<!-- en -->`, le corps anglais, avec les sections `## Demonstration` (ou `## Argument`), `## Scholium`, `## In Lordon`, `## As Lordon presents it`. Le corps anglais garde les mêmes étapes, les mêmes identifiants et les mêmes repères que le français, ce que `check.py` vérifie. Il traduit la reconstruction, jamais la traduction anglaise publiée (Verso, 2014) ; les mots de Lordon y sont rendus brièvement entre guillemets anglais, et le champ `citation` reste en français. Un document `NOM.md` a sa version dans `NOM.en.md`. Toute correction du français se reporte dans l'anglais.\n\n`depends_on` correspond exactement aux identifiants invoqués dans la démonstration ou l'argumentation. Les identifiants de l'*Éthique* suivent SpinozaGraph : `1def3`, `1ax4`, `3p6`, `3p9sc`, `3p13csc`, `3ad1` (définitions des affects), `3agd` (définition générale des affects), `4pr` (préface), `4appc28` (appendice de la partie IV, chapitre 28). Une démonstration est citée par sa proposition (`3p37` pour « III, 37, démonstration »).\n\n## 6. Droits et texte source\n\nLe livre est sous droits.\n\n- Le fichier du livre et le texte extrait vivent dans `source/`, **exclu de Git** (`.gitignore`). On ne les publie jamais, ni en tout ni en partie. `outils/check.py` signale une erreur si un fichier de `source/` est suivi par Git ou si une citation du corps dépasse 300 caractères.\n- Les citations ne sont pas couvertes par les licences du dépôt (CC BY-SA 4.0 pour la reconstruction, GPL-3.0 pour le code) : voir `LICENSE` et `NOTICE.md`, à tenir à jour.\n- Les éléments **reformulent**. Une citation (champ `citation` ou dans le corps) tient en une ou deux phrases, au plus 300 caractères, entre guillemets, avec son repère, et seulement quand la formule compte (une formule célèbre, un concept). C'est l'usage du droit de citation : courte, justifiée par l'analyse, sourcée.\n- **Repères.** Le fichier de travail est un EPUB sans pagination. Un passage est donc repéré par **section et paragraphe** : `08.4` est le 4e paragraphe de la section 08, « La servitude volontaire n'existe pas ». Les sections sont celles de la table des matières de Lordon (`sections.yaml`, qui ne contient que les titres) ; les paragraphes sont numérotés par `outils/extract_epub.py`, qui produit `source/texte/` à partir de l'EPUB. Un lecteur de l'édition papier retrouve le passage par le titre de section. Si l'auteur fournit plus tard la pagination papier, on l'ajoutera à côté.\n\n## 7. Méthode de travail\n\n1. **Pilote** : l'avant-propos et le chapitre 1. L'auteur valide le découpage et le format avant qu'on poursuive.\n2. **Un chapitre à la fois** : lecture → éléments → `INDEX.md` → `python outils/check.py` → `python outils/build_explorer.py` → relecture par l'auteur → commit.\n3. **Audit de fidélité** : chaque élément est relu contre le passage cité (reformulation exacte, repère juste, liens explicites ou reconstruits bien marqués), puis passe à `verifie-texte`.\n\n   **Ce que `verifie-texte` garantit** : l'énoncé a été relu contre les passages cités et ne dit ni plus ni moins que Lordon (ou, pour une prémisse S, que Spinoza) ; tout passage entre guillemets est dans le livre mot pour mot ; repères et notes existent et sont à leur place (`audit_forme.py`) ; aucune étape ne renvoie à un passage manifestement moins pertinent qu'un autre (`audit_reperes.py`). Le corps des thèses, des concepts et des positions réfutées a en outre été relu phrase à phrase contre le texte par l'agent (13 novembre 2026) ; celui des prémisses S et M l'a été lors de leur rédaction et par les contrôles. **Ce qu'il ne garantit pas** : une relecture par l'auteur ; elle reste ouverte, et toute correction est consignée dans le journal d'`INDEX.md`.\n4. Les commits et les push se font seulement à la demande de l'auteur.\n\n## 8. Contrôles\n\n`python outils/check.py` vérifie : identifiants et types, repères présents et bien formés, longueur des citations, existence des dépendances, absence de cycle, concordance entre `depends_on` et la démonstration, arêtes `contre` vers des `R`, renvois à l'*Éthique* existants dans SpinozaGraph (si le dépôt est à côté), cohérence avec `INDEX.md`, exclusion de `source/`, complétude et concordance de la version anglaise (§ 5 bis). L'onglet « Audit » de l'explorateur affiche les mêmes contrôles.\n\n`python outils/audit_forme.py` fait l'audit de forme, sans juger l'argument : ponctuation et guillemets, structure des fichiers (sections attendues, étapes numérotées, chacune avec son repère, ∎ final), accord entre les repères du corps et le champ `loc`, existence des paragraphes cités, présence des notes citées dans les sections citées, et présence mot pour mot dans le livre de tout passage entre guillemets. Les contrôles qui lisent le livre demandent `source/texte/`.\n\nAucun de ces contrôles ne remplace l'audit de fidélité.\n\n## 9. Style\n\nLe style est celui des projets voisins : phrases courtes, vocabulaire précis, pas de jargon ajouté. Le texte est écrit en français, et un résumé en anglais n'est donné que dans le README.\n", "body_en": ""}, {"name": "INDEX.md", "kind": "projet", "body": "# INDEX\n\nTable de tous les éléments, par partie. Chaque ligne : identifiant, titre, repères, statut. Mis à jour à chaque ajout, modification ou retrait (AGENT.md § 4).\n\n**Texte de travail** : EPUB sans pagination (calibre, 2012) ; repères par section et paragraphe, extraits par `outils/extract_epub.py` (AGENT.md § 6).\n\n## Plan\n\n| partie | titre | sections | éléments |\n|---|---|---|---|\n| P | Prémisses (Spinoza, Marx) | — | 46 |\n| 0 | Avant-propos | 01 | 2 |\n| 1 | Faire faire | 02–17 | 35 |\n| 2 | Joyeux automobiles | 18–31 | 26 |\n| 3 | Domination, émancipation | 32–43 | 28 |\n\n*Titres et sections d'après la table des matières de l'EPUB (`sections.yaml`). Repères : section.paragraphe (AGENT.md § 6).*\n\n## P. Prémisses\n\n| id | type | titre | repères | Éthique / réf. | statut |\n|---|---|---|---|---|---|\n| S01 | Spinoza | Le conatus | 03.1 | 3p6 | verifie-texte |\n| S02 | Spinoza | L'argent, condensé de tous les biens | 06.3, 12.2 | 4appc28 | verifie-texte |\n| S03 | Spinoza | Le désir, essence de l'homme | 08.3 | 3ad1 | verifie-texte |\n| S04 | Spinoza | On ne désire pas une chose parce qu'elle est bonne | 08.3, 22.2, 35.2 | 3p9sc | verifie-texte |\n| S05 | Spinoza | L'association des affects | 08.3, 24.1 | 3p15c | verifie-texte |\n| S06 | Spinoza | L'imitation des affects | 08.3, 12.4, 24.1, 29.2, 34.1 | 3p27 | verifie-texte |\n| S07 | Spinoza | La servitude | 08.4 | 4pr | verifie-texte |\n| S08 | Spinoza | La crainte | 11.1, 31.4 | 3ad13 | verifie-texte |\n| S09 | Spinoza | La force du désir suit celle de l'affect | 11.1, 22.8, 23.3, 38.4 | 3p37 | verifie-texte |\n| S10 | Spinoza | L'illusion du libre arbitre | 20.4, 24.3 | 2p35sc | verifie-texte |\n| S11 | Spinoza | Toute chose finie est déterminée par une autre | 20.4, 20.5 | 1p28 | verifie-texte |\n| S12 | Spinoza | Cause adéquate et cause inadéquate | 20.4 | 3def1 | verifie-texte |\n| S13 | Spinoza | L'ambition : vouloir que les autres vivent selon sa complexion | 20.6, 34.2 | 3p31csc | verifie-texte |\n| S14 | Spinoza | Le bien et le mal, joie et tristesse | 20.6 | 3p39sc | verifie-texte |\n| S15 | Spinoza | L'obsequium : crainte ou amour | 21.3 | Traité politique, III, 8 | verifie-texte |\n| S16 | Spinoza | Une vie humaine | 21.3, 43.2, 43.4 | Traité politique, V, 5 | verifie-texte |\n| S17 | Spinoza | Le conatus cherche la joie | 22.4, 22.8 | 3p12, 3p13c, 3p28 | verifie-texte |\n| S18 | Spinoza hèses de Spinoza et de Marx que Lordon prend comme points de départ.\n", "titre_en": "Premises", "resume_en": "The theses of Spinoza and Marx that Lordon takes as starting points.", "loc": "", "body": "Les prémisses de Spinoza (S) renvoient à l'*Éthique* dans SpinozaGraph ou, pour le *Traité politique*, à l'article cité. Ce sont celles que Lordon invoque lui-même, presque toujours en note. Elles portent sur le conatus et le désir (S01, S03, S04), la vie affective (association, imitation, amour, crainte, force des affects), la détermination et l'illusion de la liberté (S10-S12), et le pouvoir (l'*obsequium*, S15).\n\nLes prémisses de Marx (M) portent sur le rapport salarial : la double séparation, l'accumulation primitive, la priorité de la reproduction de la vie, la différence du travail et de la force de travail.", "body_en": "The Spinoza premises (S) point to the *Ethics* in SpinozaGraph or, for the *Political Treatise*, to the article cited. They are the ones Lordon himself invokes, almost always in a note. They concern the conatus and desire (S01, S03, S04), affective life (association, imitation, love, fear, the strength of the affects), determination and the illusion of freedom (S10-S12), and power (*obsequium*, S15).\n\nThe Marx premises (M) concern the wage relation: the double separation, primitive accumulation, the priority of reproducing life, the difference between labour and labour power.", "file": "parties/P.md"}, {"id": "0", "titre": "Avant-propos", "resume": "La question du livre et sa méthode : combiner un structuralisme des rapports et une anthropologie des passions.\n", "titre_en": "Foreword", "resume_en": "The book's question and its method: combining a structuralism of relations with an anthropology of the passions.", "loc": "01", "body": "Comment certains hommes « peuvent »-ils en amener d'autres à entrer dans leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza) : T001. Les « dominés heureux » du capitalisme contemporain obligent à repenser la domination et le consentement sans recourir à la « servitude volontaire » ; le livre part du triangle élémentaire du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre : T002.", "body_en": "How \"can\" some men bring others to enter into their desire? This power is an effect of structure (Marx), but structures act through the affects (Spinoza): T001. The \"happy dominated\" of contemporary capitalism force us to rethink domination and consent without resorting to \"voluntary servitude\"; the book starts from the elementary triangle of the desire of one, the power of acting of others and the affects that govern their encounter: T002.", "file": "parties/0.md"}, {"id": "1", "titre": "Faire faire", "resume": "Le désir de faire faire : l'enrôlement des puissances d'agir, la dépendance à l'argent, la servitude passionnelle, l'alignement des désirs et sa radicalisation néolibérale.\n", "titre_en": "Making others do (Faire faire)", "resume_en": "The desire to have others do: the enlistment of powers of acting, dependence on money, passional servitude, the alignment of desires and its neoliberal radicalisation.", "loc": "02–17", "body": "**Ce que le chapitre pose.** Le conatus est l'énergie du désir (D01). Le désir de faire est légitime, non le désir de faire faire, qui est enrôlement au service d'un désir-maître (T003, D02-D04). Le salariat n'est qu'un cas du patronat (T004).\n\n**La dépendance et la domination.** La reproduction de la vie nue passe par l'argent : le rapport salarial est d'abord dépendance (T006), donc domination, la plus puissante qui soit (T007). Le désir est hétéronome (T008) : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle (T009). La dépendance est asymétrique (T010) et se diffracte à tous les étages de l'entreprise (T011), où la crainte et la violence se propagent (T012).\n\n**Les régimes de mobilisation.** Le salariat attache aussi par la joie, du salaire et de la consommation (T013). Mobiliser, c'est aligner : le modèle vectoriel de l'angle α (D11, T014). L'entreprise néolibérale veut α = 0 (T015) ; tant que rien ne le retient, le capital avance et gouverne par la crainte (T016), sans morale autonome (T017), sur le modèle de la liquidité (T018), jusqu'à la tyrannie et la terreur (T019).", "body_en": "**What the chapter sets out.** The conatus is the energy of desire (D01). The desire to do is legitimate, not the desire to have others do, which is enlistment in the service of a master-desire (T003, D02-D04). Wage labour is only one case of bosshood (T004).\n\n**Dependence and domination.** The reproduction of bare life goes through money: the wage relation is first dependence (T006), hence domination, the most powerful there is (T007). Desire is heteronomous (T008): voluntary servitude does not exist, there is only passional servitude (T009). Dependence is asymmetrical (T010) and is diffracted at every level of the firm (T011), where fear and violence spread (T012).\n\n**Regimes of mobilisation.** Wage labour also binds through joy, that of the wage and of consumption (T013). Mobilising means aligning: the vector model of the angle α (D11, T014). The neoliberal firm wants α = 0 (T015); as long as nothing holds it back, capital advances and governs by fear (T016), without autonomous morality (T017), on the model of liquidity (T018), up to tyranny and terror (T019).", "file": "parties/1.md"}, {"id": "2", "titre": "Joyeux automobiles", "resume": "Les affects joyeux intrinsèques : faire désirer le travail lui-même ; le consentement, l'intériorité et l'aliénation repensés.\n", "titre_en": "Joyful self-movers (Joyeux automobiles)", "resume_en": "Intrinsic joyful affects: making work itself desired; consent, interiority and alienation rethought.", "loc": "18–31", "body": "**Le projet.** Le capitalisme est un régime de désir, une épithumè, dont l'entreprise néolibérale prend en main la production (T020). Elle vise des affects joyeux intrinsèques : faire désirer l'activité pour elle-même (D15, T021).\n\n**La critique du consentement.** Le consentement et l'aliénation n'existent pas comme on les entend : tout est déterminé (T022). Le pouvoir est un art d'affecter (T023), qui règne mieux par l'amour : le consentement est l'obéissance heureuse (T024). Contrainte et consentement ne sont que des affects tristes ou joyeux ; il n'y a pas d'intériorité (T025).\n\n**Les sources de l'obéissance joyeuse.** Le réenchantement spontané du travail par le salarié (T026), l'amour du maître et la quête de reconnaissance (T027), les images vocationnelles que produit la société (T028).\n\n**L'entreprise totalitaire et ses limites.** L'entreprise néolibérale vise la possession des âmes (T029) ; le désir des recrutés reste opaque (T030) ; la joie fait oublier l'hétéronomie (T031) ; le constructivisme visible attire la haine (T032) ; le coaching produit l'*amor fati capitalistis* (T033). Mais le fond d'affects tristes demeure, et les « consentements » restent mitigés (T034).", "body_en": "**The project.** Capitalism is a regime of desire, an epithumè, whose production the neoliberal firm takes in hand (T020). It aims at intrinsic joyful affects: making the activity desired for its own sake (D15, T021).\n\n**The critique of consent.** Consent and alienation do not exist as they are usually understood: everything is determined (T022). Power is an art of affecting (T023), which reigns better through love: consent is happy obedience (T024). Constraint and consent are only sad or joyful affects; there is no interiority (T025).\n\n**The sources of joyful obedience.** The employee's spontaneous re-enchantment of work (T026), love of the master and the quest for recognition (T027), the vocational images society produces (T028).\n\n**The totalitarian firm and its limits.** The neoliberal firm aims at possessing souls (T029); the desire of recruits remains opaque (T030); joy makes one forget heteronomy (T031); visible constructivism attracts hatred (T032); coaching produces *amor fati capitalistis* (T033). But the background of sad affects remains, and \"consents\" stay mixed (T034).", "file": "parties/2.md"}, {"id": "3", "titre": "Domination, émancipation", "resume": "La domination et l'exploitation repensées par les passions ; la sédition, la récommune et les limites du communisme.\n", "titre_en": "Domination, emancipation", "resume_en": "Domination and exploitation rethought through the passions; sedition, the récommune and the limits of communism.", "loc": "32–43", "body": "**La domination et l'exploitation.** Même joyeux, l'enrôlement reste domination : il fixe les désirs et réserve aux uns ce qu'il écarte des autres (D20, T035). La division du travail devient division du désir, par l'imaginaire de l'impuissance (D21, T036). Il n'y a pas de valeur objective (T037) : l'exploitation relève d'une politique de la capture, elle est passionnelle (D22, T038).\n\n**Les issues.** Le projet néolibéral mène à l'alternative « communisme ou totalitarisme » (T039). La récommune, entreprise constituée en démocratie radicale, abolit le rapport salarial (D23, T040), sans épuiser le communisme (T041).\n\n**La sédition.** Le changement n'exige pas le libre arbitre : l'indignation reconfigure les passions (T042) et fait « devenir perpendiculaire » (D24, T043). L'aliénation est fixation, l'émancipation défixation (D25, T044). Le paysage de classe reflète le paysage passionnel (T045) ; l'histoire bifurque par le mécontentement, en lutte de classes affectives (D26, T046).\n\n**Les limites.** La capture renaît de la division du travail et de l'économie de la joie (T047) ; le communisme véritable, vie sous la raison, est un horizon (T048) ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux (T049).", "body_en": "**Domination and exploitation.** Even joyful, enlistment remains domination: it fixes desires and reserves for some what it keeps from others (D20, T035). The division of labour becomes a division of desire, through the imaginary of powerlessness (D21, T036). There is no objective value (T037): exploitation belongs to a politics of capture, it is passional (D22, T038).\n\n**The ways out.** The neoliberal project leads to the alternative \"communism or totalitarianism\" (T039). The récommune, an enterprise constituted as a radical democracy, abolishes the wage relation (D23, T040), without exhausting communism (T041).\n\n**Sedition.** Change does not require free will: indignation reconfigures the passions (T042) and makes one \"become perpendicular\" (D24, T043). Alienation is fixation, emancipation defixation (D25, T044). The class landscape reflects the passional landscape (T045); history forks through discontent, in a struggle of affective classes (D26, T046).\n\n**The limits.** Capture is reborn from the division of labour and the economy of joy (T047); true communism, life under reason, is a horizon (T048); but not all passional regimes are equal, and progress is the enrichment of life in joyful affects (T049).", "file": "parties/3.md"}], "sections": {"01": {"titre": "Avant-propos", "partie": "0"}, "02": {"titre": "I. FAIRE FAIRE", "partie": "1"}, "03": {"titre": "Le désir de faire quelque chose", "partie": "1"}, "04": {"titre": "Le désir de faire faire : patronat et enrôlement", "partie": "1"}, "05": {"titre": "Intérêt, désir, mise en mouvement", "partie": "1"}, "06": {"titre": "La vie nue et l’argent", "partie": "1"}, "07": {"titre": "La monnaie rapport, l’argent désir", "partie": "1"}, "08": {"titre": "La servitude volontaire n’existe pas", "partie": "1"}, "09": {"titre": "L’asymétrie de l’initiative monétaire", "partie": "1"}, "10": {"titre": "Domination à tous les étages", "partie": "1"}, "11": {"titre": "Pressions ambiantes et remontée de la violence (contrainte actionnariale et concurrence)", "partie": "1"}, "12": {"titre": "Mobilisation joyeuse et iénation)", "partie": "3"}, "41": {"titre": "L’histoire comme mécontentement (brouillages et reconfigurations du paysage de classe)", "partie": "3"}, "42": {"titre": "Communisme… désir et servitude !", "partie": "3"}, "43": {"titre": "« Une viande humaine »", "partie": "3"}}, "problems": []};

// ---------- Langue ----------
// Préférence partagée avec l'accueil du site (clé treillis-lang) ; ?lang=en dans l'URL l'emporte.
const LANGS = ["fr", "en"];
let LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("treillis-lang"); if (LANGS.includes(s)) return s; } catch {}
  return (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en";
})();
const tr = (fr, en) => LANG === "en" ? en : fr;
// Champs traduits : on garde l'original (_fr) et on bascule titre / enonce / body selon la langue.
const I18N_FIELDS = ["titre", "enonce", "body", "resume"];
function swapLang(o) {
  for (const k of I18N_FIELDS) if (k in o) {
    if (!(k + "_fr" in o)) o[k + "_fr"] = o[k];
    o[k] = LANG === "en" && o[k + "_en"] ? o[k + "_en"] : o[k + "_fr"];
  }
}
function applyData() {
  DATA.elements.forEach(swapLang);
  (DATA.partie_docs || []).forEach(swapLang);
  DATA.documents.forEach(swapLang);
  for (const p of DATA.partie_docs || []) DATA.parties[p.id] = p.titre;
}
applyData();

// ---------- Modèle ----------
const TYPES = ["definition", "spinoza", "marx", "these", "refutee"];
let TYPE_LABEL, TYPE_SING, STATUT_LABEL;
function setLabels() {
  TYPE_LABEL = tr({ definition: "Concepts", spinoza: "Prémisses de Spinoza", marx: "Prémisses de Marx", these: "Thèses", refutee: "Positions réfutées", manquant: "Manquant" },
                  { definition: "Concepts", spinoza: "Spinoza premises", marx: "Marx premises", these: "Theses", refutee: "Refuted positions", manquant: "Missing" });
  TYPE_SING = tr({ definition: "Concept", spinoza: "Prémisse de Spinoza", marx: "Prémisse de Marx", these: "Thèse", refutee: "Position réfutée", manquant: "Référence manquante" },
                 { definition: "Concept", spinoza: "Spinoza premise", marx: "Marx premise", these: "Thesis", refutee: "Refuted position", manquant: "Missing reference" });
  STATUT_LABEL = tr({ brouillon: "brouillon", "verifie-texte": "vérifié sur le texte" }, { brouillon: "draft", "verifie-texte": "checked against the text" });
}
setLabels();
const STATUTS = ["brouillon", "verifie-texte"];
const STATUT_COLOR = { brouillon: "var(--muted)", "verifie-texte": "var(--ok)" };
const SPINOZA_URL = "https://treillis.qpetit.com/spinoza/#";
const partLabel = p => p === "P" ? tr("Prémisses", "Premises") : p === "0" ? tr("Avant-propos", "Foreword") : tr("Chapitre ", "Chapter ") + p;
const SECTIONS = DATA.sections || {};
const locOne = l => { const m = String(l).match(/^(\d\d)\.(\d+)$/); return m && SECTIONS[m[1]] ? `« ${SECTIONS[m[1]].titre} », ¶ ${m[2]}` : String(l); };
const pagesTxt = e => e.loc.join(" – ");
const locTitle = e => e.loc.map(locOne).join(" · ");

const els = DATA.elements;
const byId = new Map(els.map(e => [e.id, e]));
const resolve = id => byId.has(id) ? id : (id.match(/^([A-Z]\d+)-C\d+$/) && byId.has(id.split("-")[0]) ? id.split("-")[0] : id);
const typeOf = id => byId.get(id)?.type || "manquant";
const color = id => `var(--${TYPES.includes(typeOf(id)) ? typeOf(id) : "manquant"})`;

// Arêtes : dépendance -> dépendant
const parents = new Map(), children = new Map(), missing = new Set();
for (const e of els) { parents.set(e.id, []); children.set(e.id, []); }
for (const e of els) for (const d0 of e.depends_on) {
  const d = resolve(d0);
  if (!byId.has(d)) { missing.add(d); if (!children.has(d)) { children.set(d, []); parents.set(d, []); } }
  if (!parents.get(e.id).includes(d)) parents.get(e.id).push(d);
  children.get(d).push(e.id);
}
// Arêtes « contre » : thèse -> position réfutée (hors du graphe des appuis : ni chemin, ni conséquences)
const refutes = new Map(), refutedBy = new Map();
for (const e of els) { refutes.set(e.id, e.contre.map(resolve)); for (const r of refutes.get(e.id)) (refutedBy.get(r) || refutedBy.set(r, []).get(r)).push(e.id); }
function closure(start, next) {
  const seen = new Set(), stack = [...(next.get(start) || [])];
  while (stack.length) { const x = stack.pop(); if (seen.has(x) || x === start) continue; seen.add(x); stack.push(...(next.get(x) || [])); }
  return seen;
}
// Mentions inverses (qui cite cet élément dans son texte)
const mentionedBy = new Map();
for (const e of els) for (const m of e.mentions) { const r = resolve(m); if (r !== e.id) (mentionedBy.get(r) || mentionedBy.set(r, []).get(r)).push(e.id); }
for (const d of DATA.documents) for (const m of d.mentions || []) (mentionedBy.get(resolve(m)) || mentionedBy.set(resolve(m), []).get(resolve(m))).push("doc:" + d.name);

// ---------- Utilitaires ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const svgEl = (tag, attrs = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const idSort = (a, b) => a.localeCompare(b, "fr", { numeric: true });
function pill(id, withTitle = false) {
  const e = byId.get(id);
  if (id.startsWith("doc:")) return `<a class="pill" style="--c:var(--muted)" href="#${esc(id)}">${esc(id.slice(4))}</a>`;
  return `<a class="pill ${e ? "" : "missing"}" style="--c:${color(id)}" href="#${esc(id)}" title="${esc(e ? e.titre + " — " + e.enonce : tr("Référence vers un élément inexistant", "Reference to a missing element"))}">${esc(id)}${withTitle && e ? `<span class="pt">${esc(e.titre)}</span>` : ""}</a>`;
}

// ---------- Markdown minimal ----------
function inline(s) {
  const keep = [];
  const hold = h => `\u0000${keep.push(h) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
  s = s.replace(/https?:\/\/[^\s<>»)]+/g, u => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?!\s)([^_]+?)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function markdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let out = "", i = 0;
  const isBlockStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (l.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><thead><tr>" + row(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) out += "<tr>" + row(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
      const stack = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s/.test(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && stack.length))) {
        const li = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!li) { out += " " + inline(lines[i].trim()); i++; continue; }
        const ind = li[1].length, tag = /\d/.test(li[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) { out += `<${tag}><li>`; stack.push({ ind, tag }); }
        else out += "</li><li>";
        out += inline(li[3]); i++;
      }
      while (stack.length) out += `</li></${stack.pop().tag}>`;
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += `<p>${inline(buf.join(" "))}</p>`;
  }
  return out;
}
// Transforme les identifiants en liens, hors <a>, <code>, <pre>.
function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement.closest("a, code, pre")) continue;
    if (/\b[DSMTR]\d{2,3}(?:-C\d+)?\b/.test(n.nodeValue)) targets.push(n);
  }
  for (const n of targets) {
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(/\b([DSMTR]\d{2,3}(?:-C\d+)?)\b/g, (m, id, off) => {
      frag.append(n.nodeValue.slice(last, off));
      const r = resolve(id);
      if (byId.has(r)) {
        const a = document.createElement("a");
        a.className = "ref"; a.href = "#" + r; a.textContent = id;
        a.style.setProperty("--c", color(r)); a.title = byId.get(r).titre + " — " + byId.get(r).enonce;
        frag.append(a);
      } else { const s = document.createElement("span"); s.className = "ref missing"; s.textContent = id; s.title = tr("Élément inexistant", "Missing element"); frag.append(s); }
      last = off + m.length;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  }
}

const HKEY = "explorer-history";
let hist = { stack: [], i: -1 };
try { hist = JSON.parse(sessionStorage.getItem(HKEY)) || hist; } catch {}
function track(h) {
  const st = history.state;
  if (st && typeof st.i === "number" && hist.stack[st.i] === h) hist.i = st.i;      // précédent / suivant / rechargement
  else if (hist.stack[hist.i] !== h) {                                               // nouvelle visite
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(h); hist.i = hist.stack.length - 1;
    if (hist.stack.length > 200) { hist.stack.shift(); hist.i--; }
    history.replaceState({ i: hist.i }, "");
  } else history.replaceState({ i: hist.i }, "");
  try { sessionStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
  renderTrail();
}

    steps.push(`<button class="step ${cur ? "cur" : ""} ${k > hist.i ? "fwd" : ""}" data-k="${k}" ${L.c ? `style="--c:${L.c}"` : ""} title="${esc((L.id ? L.id + " — " : "") + L.t)}">${L.id ? esc(L.id) + (cur ? `<span class="tt">${esc(L.t)}</span>` : "") : esc(L.t)}</button>`);
  }
  $("#trail").innerHTML = hist.stack.length > 1 ? `<span class="lbl">${from > 0 ? "… " : ""}${tr("Historique", "History")}</span>` + steps.join(`<span class="arrow">›</span>`) : "";
}
// Aller à une page : si c'est la page précédente (ou suivante) de l'historique,
// s'y déplacer au lieu de créer une nouvelle entrée.
function go(h) {
  h = String(h || "home");
  if (hist.stack[hist.i] === h) return;
  if (hist.i > 0 && hist.stack[hist.i - 1] === h) history.back();
  else if (hist.stack[hist.i + 1] === h) history.forward();
  else location.hash = h;
}
document.addEventListener("click", ev => {
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
$("#back").onclick = () => history.back();
$("#fwd").onclick = () => history.forward();
$("#trail").onclick = ev => { const b = ev.target.closest("[data-k]"); if (b) { const d = +b.dataset.k - hist.i; if (d) history.go(d); } };

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  track(h);
  const prevSel = state.sel;
  renderView(h);
  $("#reader").scrollTop = 0;
  renderList();
  renderGraph(state.mode !== "all" && prevSel !== state.sel);
  document.querySelector("#list .sel")?.scrollIntoView({ block: "nearest" });
}
function renderView(h) {
  if (h === "home") { state.view = "home"; state.sel = null; renderHome(); }
  else if (h === "audit") { state.view = "audit"; state.sel = null; renderAudit(); }
  else if (h === "alpha") { state.view = "alpha"; state.sel = null; renderAlpha(); }
  else if (h === "regimes") { state.view = "regimes"; state.sel = null; renderRegimes(); }
  else if (h.startsWith("doc:")) { state.view = "doc:" + h.slice(4); state.sel = null; renderDoc(h.slice(4)); }
  else if (h.startsWith("partie:")) { state.view = h; state.sel = null; renderPartie(h.slice(7)); }
  else { state.view = "el"; state.sel = h; renderElement(h); }
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => fit());
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.target.matches?.("input")) { if (ev.key === "Escape") { ev.target.value = ""; state.q = ""; renderList(); ev.target.blur(); } return; }
  if (ev.key === "/") { ev.preventDefault(); $("#search").focus(); }
  else if (ev.key === "Escape") go("home");
  else if (ev.key === "[") stepSeq(-1);
  else if (ev.key === "]") stepSeq(1);
  else if (ev.key === "Backspace") history.back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "r" || ev.key === "R") $("#read").click();
  else if ("1234".includes(ev.key)) document.querySelectorAll("#toolbar [data-mode]")[+ev.key - 1].click();
});

// Textes fixes de l'interface, et bascule de langue.
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tr("Capitalisme, désir et servitude — treillis", "Capitalisme, désir et servitude (Willing Slaves of Capital) — lattice");
  $("#back").title = tr("Précédent (Alt+←)", "Back (Alt+←)");
  $("#fwd").title = tr("Suivant (Alt+→)", "Forward (Alt+→)");
  $("#search").placeholder = tr("Rechercher (id, titre, texte) — touche /", "Search (id, title, text) — key /");
  const modes = { all: ["Tout", "All", "Tout le graphe ; la sélection met en évidence ses appuis et ses conséquences", "Whole graph; the selection highlights its grounds and consequences"],
    anc: ["Chemin vers", "Path to", "Seulement le chemin qui mène à l'élément sélectionné", "Only the path leading to the selected element"],
    desc: ["Conséquences", "Consequences", "Seulement ce qui découle de l'élément sélectionné", "Only what follows from the selected element"],
    near: ["Voisinage", "Neighbours", "Voisins directs", "Direct neighbours"] };
  for (const [m, [f, en, tf, ten]] of Object.entries(modes)) { const x = $(`#toolbar [data-mode="${m}"]`); x.textContent = tr(f, en); x.title = tr(tf, ten); }
  $("#fit").textContent = tr("Recadrer", "Fit"); $("#fit").title = tr("Recadrer (touche F)", "Fit (key F)");
  $("#read").textContent = tr("Lecture", "Read"); $("#read").title = tr("Masquer le graphe pour lire (touche R)", "Hide the graph to read (key R)");
  $("#empty").textContent = tr("Aucun élément à afficher avec ces filtres.", "No element to show with these filters.");
  $("#resizer").title = tr("Glisser pour redimensionner", "Drag to resize");
  $("#meta").textContent = tr(`${els.length} éléments · généré le ${DATA.generated}`, `${els.length} elements · generated ${DATA.generated}`);
  document.querySelectorAll(".langsw [data-lang]").forEach(x => { x.classList.toggle("on", x.dataset.lang === LANG); x.setAttribute("aria-pressed", x.dataset.lang === LANG); });
  renderLegend();
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l;
  try { localStorage.setItem("treillis-lang", l); } catch {}
  const u = new URL(location.href); u.searchParams.set("lang", l);
  history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  applyData(); setLabels(); runAudit(); applyStatic();
  renderFilters(); renderTrail(); renderView(decodeURIComponent(location.hash.slice(1)) || "home"); renderList(); renderGraph();
}
document.querySelector(".langsw").onclick = ev => { const x = ev.target.closest("[data-lang]"); if (x) setLang(x.dataset.lang); };
applyStatic();
renderFilters();
route();
requestAnimationFrame(fit);
</script>
</body>
