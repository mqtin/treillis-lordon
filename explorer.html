l'intentionnalité assignable, que n'ont pas les forces du marché, « sans centre », et s'expose à la haine réservée aux causes libres.", "citation": "", "loc": ["29.3", "29.4", "29.5"], "depends_on": ["S22", "S23", "D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les constructivismes du désir, ou épithumogénies d'institution (D14), ne sont pas neufs : Spinoza conseillait à l'État de conduire les hommes de sorte qu'ils croient suivre leur libre décret (S22), et Platon en faisait le cœur de l'art politique (29.3).\n2. Le conditionnement n'est qu'un autre nom de la servitude passionnelle universelle ; mais la présence d'une instance et d'une intention identifiables fait une différence (29.3).\n3. L'auto-affection du corps social est inassignable et sans intention : elle apparaît comme une nécessité, et se rend inaperçue ou tolérable (29.4).\n4. Par S23, on hait davantage ce qu'on imagine libre : le parti, l'État, le Gosplan concentrent les haines, tandis que les forces du marché, qui ne broient pas moins, apparaissent comme un « effet de système » sans ingénieur, propice à la naturalisation ; c'est le fétichisme marchand de Marx (29.4).\n5. En se faisant ouvertement constructiviste, l'entreprise néolibérale prend le risque de la relocalisation et de l'intentionnalité assignable ; et ses sujets se croient, plus que les fidèles de l'Église d'autrefois, doués d'une autonomie de désir où toute intervention paraît une immixtion (29.5). ∎", "sections": ["Argumentation"], "demo_refs": ["D14", "S22", "S23"], "mentions": ["D14", "S22", "S23"], "corollaires": [], "mtime": 1794561825.3289855}, {"id": "T033", "file": "theses/T033.md", "type": "these", "partie": "2", "titre": "L'amor fati capitalistis", "enonce": "Le coaching et les pratiques de « motivation » transforment des contraintes extérieures en « motivation endogène » : ils produisent l'amour par les salariés de la situation qui leur est faite. Leur finalité est adaptative : refouler toute extrospection et maintenir les individus dans l'introspection, comme si ce qui leur arrive dans l'entreprise n'était pas questionnable. Les conditionneurs sont eux-mêmes conditionnés.", "citation": "« transformer une pression exogène en motivation endogène »", "loc": ["30.1", "30.2", "30.3"], "depends_on": ["D19", "S22", "T032"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T032, la manipulation visible des désirs engendre des tensions ; l'entreprise néolibérale a une tête, « qui sait ce qu'elle veut » (30.1).\n2. Le coaching va le plus loin : il veut, selon un coach, « transformer une pression exogène en motivation endogène » (note 97), ce qui est la maxime de S22 au parler managérial près. Produire le consentement, c'est produire l'*amor fati capitalistis* (D19) (30.1).\n3. Quelle que soit la rhétorique humaniste du travail sur soi, la finalité est adaptative : transfigurer la contrainte hors de tout questionnement de la contrainte. Même le coaching non directif des cadres supérieurs n'est ouvert que parce que le désir-maître est déjà rejeté dans l'impensé (30.2).\n4. L'épithumogénie capitaliste refoule l'extrospection, le regard vers les forces extérieures, au profit de l'introspection : ce qui arrive dans l'entreprise n'est pas questionnable, seule l'est la façon dont on fera avec (30.2). ∎\n\n## Scolie\n\nLes séminaires de « motivation » ne diffèrent parfois des pratiques sectaires que par l'objet. Que des entreprises ouvrent leurs portes aux caméras montre la bonne conscience des dirigeants : les conditionneurs sont conditionnés, et, comme le disait Bourdieu, les dominants sont dominés par leur propre domination (30.3).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D19", "S22", "T032"], "mentions": ["D19", "S22", "T032"], "corollaires": [], "mtime": 1794561825.329495}, {"id": "T034", "file": "theses/T034.md", "type": "these", "partie": "2", "titre": "Le voile des affects joyeux, le fond des affects tristes", "enonce": "La promesse d'affects joyeux reste brouillée par un fond d'affects tristes : derrière la colinéarisation heureuse se tient toujours la menace (déclassement, rétrogradation, renvoi). D'où le double bind du « sois spontané ». L'efficacité de la colinéarisation varie avec la proximité au désir-maître ; pour la plupart, les « consentements » restent mitigés, simples résultantes du conflit des affects joyeux et tristes.", "citation": "« désire toi-même mais d’après moi seulement »", "loc": ["31.1", "31.2", "31.3", "31.4"], "depends_on": ["T033", "T006", "T011", "S08", "S24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T033, le travail de colinéarisation tient à l'enrôlé le discours de *son* désir ; il doit faire oublier qu'il sert le désir-maître, et que sa promesse de joie a pour arrière-plan les sanctions et les menaces du rapport salarial (T006) (31.1).\n2. L'échec de la normalisation n'étant pas une option, les « déviants persistants » retrouvent le dur du rapport salarial ; le colinéarisé est sommé de se convertir aux affects joyeux sous peine d'être submergé par la crainte. D'où le *double bind* (« sois autonome mais selon ma direction »), contre lequel il n'a que l'autosuggestion, quand ce n'est pas la pathologie (31.1).\n3. L'efficacité de la colinéarisation suit à peu près le niveau hiérarchique (T011) : tout en haut, les individus sont si préalignés que le rapport peut s'inverser, et que ce sont eux qui utilisent l'organisation pour leurs passions, comme les « âmes ardentes » dont l'Église se méfie (31.2-31.3).\n4. Pour les autres, les sentiments sont mêlés, l'âme flotte (S08), et par S24 il n'y a en fait de « consentement » que l'affrontement des affects joyeux et tristes. La colinéarisation, surplombée de menace, ne peut escamoter sa part attristante : les salariés peuvent se passionner pour le contrôle de gestion, et « par moments n'en penser pas moins » (31.4). ∎\n\n## Scolie\n\nBourdieu évoque les agents qui « exploitent les institutions pour assouvir leurs pulsions » (note 100) : l'Église redoute le « subjectivisme fatal » des âmes trop ardentes, à front renversé de l'entreprise, qui se méfie du défaut de « motivation » (31.2).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["S08", "S24", "T006", "T011", "T033"], "mentions": ["S08", "S24", "T006", "T011", "T033"], "corollaires": [], "mtime": 1794561825.3305073}, {"id": "T035", "file": "theses/T035.md", "type": "these", "partie": "3", "titre": "La domination par les affects joyeux", "enonce": "Même joyeusement consenti, l'enrôlement reste domination : l'épithumogénie fixe le désir des enrôlés à des objets étroits, à l'exclusion de tous ceux qu'ils pourraient désirer comme associés. La domination est l'effet qui permet à certains de se réserver des possibilités de jouissance ; la violence symbolique de Bourdieu est une domination par les affects joyeux.", "citation": "", "loc": ["33.1", "33.2", "33.3"], "depends_on": ["T022", "D20", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Il est des « consentements » presque purement joyeux ; comment parler encore de domination ? Par T022, l'aliénation ne peut être imputée à certains seulement, et l'intéressé pourrait retourner le diagnostic à son questionneur (33.1).\n2. La domination au premier sens demeure, mais l'intérêt basal peut être surmonté de désirs plus élevés, au point que la dépendance ne laisse plus de trace affective (33.2).\n3. Or l'épithumogénie a pour effet, et pour intention, de *fixer* le désir des enrôlés : division du travail, subordination et conditionnement les rivent à un objet exclusif. Il est plein d'autres choses auxquelles ils pourraient s'intéresser comme associés : la division du travail elle-même, les rémunérations, la stratégie, le destin de la communauté productive (33.2).\n4. L'assujettissement heureux est donc « enfermement dans un domaine restreint de jouissance » ; c'est encore une domination, au sens de D20 (33.2).\n5. Par S25, l'utile propre de chacun est la variété des effectuations de sa puissance ; la domination rive les dominés à des objets de désir mineurs et se réserve les autres. Domination « dure » et « douce » ne se distinguent que par leurs affects (33.3). ∎", "sections": ["Argumentation"], "demo_refs": ["D20", "S25", "T022"], "mentions": ["D20", "S25", "T022"], "corollaires": [], "mtime": 1794561825.331503}, {"id": "T036", "file": "theses/T036.md", "type": "these", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La domination règle la distribution du désirable. La division du travail se convertit en division du désir par un double imaginaire : du comblement et de l'impuissance, qui transforme l'assignation en auto-assignation. Les objets réservés aux dominants doivent être reconnus désirables par les dominés, mais pas pour eux. Cette division arbitraire, diffuse et impersonnelle, est vécue comme une nécessité.", "citation": "« Le salarié ordinaire sait reconnaître comme désirable le pouvoir de direction mais sans en faire un objet de son désir. »", "loc": ["34.1", "34.2", "34.3"], "depends_on": ["T035", "D21", "S26", "S06", "S27", "S13", "S28", "S23"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T035, l'enjeu de la domination est distributif ; la régulation qui ajuste les désirs des dominés exige un enchantement constant, d'autant que l'imitation (S06) attise l'envie des joies visibles des grands (34.1).\n2. D'où le double imaginaire de D21 ; par S26, ce qu'on imagine ne pas pouvoir, on ne le peut effectivement pas : l'assignation devient auto-assignation (34.1).\n3. Par S27, le désir cherche sa confirmation dans le désir des autres ; par S13, chacun veut que les autres vivent selon sa complexion, et tous se font obstacle. La plupart des joies sociales sont donc différentielles : *réserver* et *écarter* sont les gestes propres de la domination (34.2).\n4. Ces assignations sont arbitraires sur un fond d'égalité anthropologique (S28) ; mais, diffuses et impersonnelles, elles sont vécues, par S23, comme une nécessité, un *fatum* sans dieu, qui attire moins de haine qu'une cause imaginée libre (34.3). ∎\n\n## Scolie\n\nLes justifications de l'arbitraire ne sortent pas, depuis les Grecs, du triangle de la naissance, de la richesse et de la compétence ; la « mythogénie contemporaine du diplôme » fournit des alibis à la répartition des individus dans la division du désir (34.3).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "mentions": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "corollaires": [], "mtime": 1794561825.331503}, {"id": "T037", "file": "theses/T037.md", "type": "these", "partie": "3", "titre": "Il n'y a pas de valeur objective, seulement des affirmations de puissance", "enonce": "Le désir étant axiogène et la réalité pleine, il n'y a pas de valeur substantielle qui puisse faire norme : vaut ce que le plus puissant a déclaré valoir. Toute demande est en dernière analyse un « parce que » du conatus ; la justification n'a qu'une valeur extrinsèque, mais vitale : contenir la violence. Renoncer à la valeur-travail n'oblige donc pas à déserter la lutte pour le partage.", "citation": "« Vaut ce que le plus puissant a déclaré valoir »", "loc": ["35.2", "35.3"], "depends_on": ["D17", "S29"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La valeur substantielle (R11) réintroduit une norme transcendante ; Spinoza la récuse au nom de l'immanence, où réalité et perfection sont une même chose (S29) (35.2).\n2. Par D17, ce n'est pas la valeur qui attire le désir, c'est le désir qui constitue les valeurs ; cela vaut pour les valeurs esthétiques, morales et économiques, comme Durkheim le voulait pour sa théorie transversale de la valeur (35.2).\n3. Les valeurs sont donc des positions et des affirmations, victoires temporaires de puissances ; les luttes de valorisation sont l'ordinaire de la vie sociale de la valeur (35.2).\n4. À la question « au nom de quoi demandez-vous ? », la réponse est toujours en dernière analyse « parce que c'est moi », par le droit naturel du conatus ; la « généralité » et la justification suivent, et leur seule valeur est de faire rempart contre le « chaos pronateur » (35.3).\n5. On peut donc contester le partage de la valeur sans théorie objective de la plus-value, en assumant la partialité de son point de vue : « voilà notre norme à nous » (35.3). ∎", "sections": ["Argumentation"], "demo_refs": ["D17", "R11", "S29"], "mentions": ["D17", "R11", "S29"], "corollaires": [], "mtime": 1794561825.3325028}, {"id": "T038", "file": "theses/T038.md", "type": "these", "partie": "3", "titre": "L'exploitation est passionnelle", "enonce": "L'exploitation ne tient pas à la privation d'une plus-value (rendue au corps salarial, elle ne serait plus exploitation), mais à son appropriation privative : elle relève d'une politique de la capture, non d'une économie de la valeur. Ce qui est capté est de la puissance d'agir, dirigée par des passions ; le patronat dépossède d'œuvre, d'argent et de reconnaissance. Faire marcher les salariés, c'est aussi leur faire prendre le désir-maître pour le leur.", "citation": "« Si exploitation il y a, elle est donc davantage du ressort d’une théorie politique de la capture que d’une théorie économique de la valeur »", "loc": ["35.4", "35.5", "35.6", "35.7"], "depends_on": ["T037", "D22", "M06", "T036", "T004"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Les salariés n'ont pas besoin de la théorie de la plus-value pour se sentir exploités ; c'est l'idée de capture qui saisit leurs protestations (35.4).\n2. Si la plus-value revenait au corps salarial lui-même, l'algèbre de la valeur-travail resterait la même, et personne ne parlerait d'exploitation : ce qui la fait est l'appropriation privative. L'exploitation relève donc d'une politique de la capture (35.4), et par T037 on peut la penser sans valeur objective.\n3. Ce qui est capté est la puissance d'agir des enrôlés, dans la tristesse ou, quand l'épithumogénie réussit, dans la joie, mais rivée à la division du désir (T036). Par M06, les contributions sont parcellaires et seule les totalise le désir-maître : la capture est dépossession d'œuvre, et d'abord d'*autorat*, la reconnaissance de l'œuvre collective allant au sommet (D22) (35.5).\n4. Comme tout patronat (T004), le patronat capitaliste capte de l'effort ; il le convertit en argent, les autres en reconnaissance ; tous ne parviennent à leurs fins que par des énergies conatives dirigées par des affects : l'exploitation est passionnelle (35.6).\n5. Faire marcher les salariés, c'est les faire se mouvoir, les faire fonctionner, et les « faire marcher » : leur faire croire que s'activer pour la capture est se « réaliser » (35.7). ∎\n\n## Scolie\n\nLe patron scientifique passe pour « découvreur », le mandarin signe l'ouvrage de ses assistants, le réalisateur se fait reconnaître seul auteur d'images que son chef-opérateur était seul capable de produire ; ce n'est pas nier l'inégalité des contributions, mais l'effacement de presque toutes derrière une seule (35.5). Quand l'exploitation passionnelle réussit très bien, « les enrôlés ne marchent plus, ils courent » (35.7).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["D22", "M06", "T004", "T036", "T037"], "mentions": ["D22", "M06", "T004", "T036", "T037"], "corollaires": [], "mtime": 1794561825.3335035}, {"id": "T039", "file": "theses/T039.md", "type": "these", "partie": "3", "titre": "Communisme ou totalitarisme", "enonce": "Le projet néolibéral reste contradictoire : les salariés « courent de travers », et la « libre volonté obéissante » peut toujours se reprendre. Son modèle, le salarié-artiste dont la créativité exige l'autonomie, mène vers la libre association des travailleurs ; pour le gros des salariés, l'« autonomie » masque au contraire une servitude inédite. L'alternative est formellement celle-ci : communisme ou totalitarisme.", "citation": "", "loc": ["36.1", "36.2", "36.3", "36.4"], "depends_on": ["T029", "T034"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T034, l'arrière-plan de menace persiste ; peu de salariés peuvent se couler sans réserve dans le projet de colonisation intégrale de leur être (T029). L'entreprise est doublement contradictoire : rétivité des salariés, et aléa irréductible du « libre arbitre », qui « ne hait rien tant que la subordination hiérarchique » (36.1).\n2. La sociologie du travail a vu dans l'artiste un modèle pour les salariés « créatifs » : sa productivité tient à la coïncidence avec son propre désir. Mais à pousser l'allègement hiérarchique, on rend les créatifs à eux-mêmes, et ils peuvent s'échapper : en reconnaissant la supériorité productive du travail non contraint, le capitalisme, demande Lordon, ne chemine-t-il pas « vers la libre association des travailleurs » ? (36.2).\n3. Le capitalisme pourrait se mettre en danger en poursuivant ce rêve, porteur de son principe antagoniste : liberté créative et collaborative, organisation délibérative-démocratique, « soit le communisme réalisé » (36.3).\n4. Il n'ira pas jusque-là : pour la plupart, l'extension de la latitude passe par le maintien de la colinéarisation ; d'où l'alternative « communisme ou totalitarisme », sur le modèle de « socialisme ou barbarie » (36.4). ∎\n\n## Scolie\n\nLordon reproche à certaines analyses, notamment *Le nouvel esprit du capitalisme* de Boltanski et Chiapello (note 118), d'avoir oublié et ce qu'ajoutaient les discours managériaux eux-mêmes, et l'étroitesse de la frange salariale réellement concernée (36.3).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["T029", "T034"], "mentions": ["T029", "T034"], "corollaires": [], "mtime": 1794562538.6220126}, {"id": "T040", "file": "theses/T040.md", "type": "these", "partie": "3", "titre": "La récommune", "enonce": "Toute entreprise qui exige plusieurs personnes est une communauté politique. Retirées les structures du rapport salarial, elle devient association, et la réponse communiste est qu'elle doit être égalitaire. L'inégalité des contributions et la division de la conception et de l'exécution ne s'effaceront que lentement ; mais l'égalité peut être réalisée très vite dans la délibération : c'est la récommune, qui abolit le rapport salarial.", "citation": "« Être le plus nombreux possible à penser le plus possible »", "loc": ["37.1", "37.2", "37.3", "37.4", "37.5", "37.6", "37.7"], "depends_on": ["T039", "T003", "D23", "M06", "S26"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T039, l'alternative est « communisme ou totalitarisme ». « Épurer les alternatives facilite les choix », et revenir au problème aussi, celui de T003 : quelqu'un veut faire quelque chose qui exige d'être plusieurs. Toute composition de puissances d'agir est politique ; la question est la constitution de cette communauté (37.1).\n2. Sous le capitalisme, on y entre par nécessité matérielle, sous une constitution monarchique, celle du désir-maître. Suspendue la nécessité, l'entreprise prend la forme de l'association : ses membres s'y rassemblent autour d'une proposition dans laquelle ils reconnaissent leur désir, formé ailleurs, et non sous menace ni induction délibérée (37.2).\n3. La position communiste est que l'égalité doit prévaloir en toute situation politique. Les contributions ne sont pourtant pas égales : le texte de *Richard III* n'est pas sur le même plan que ses costumes, et il faut pourtant des costumiers. D'où « l'équation communiste » : quelle égalité sous le legs de la division du travail, et de la séparation de la conception et de l'exécution (M06) ? (37.3-37.4)\n4. Cette division produit « empuissantisation » pour les uns et, par S26, « impuissantisation » pour les autres ; la dé-hiérarchisation contributive restera lointaine (37.5).\n5. Mais l'égalité peut être rapide dans l'ordre délibératif : être pleins associés d'un destin commun. C'est la récommune (D23), qui réalise l'abolition du rapport salarial (37.5-37.7). ∎\n\n## Scolie\n\nL'horizon est donné par Étienne Balibar (note 120) : « Être le plus nombreux possible à penser le plus possible » (37.5). Le capitalisme ayant « imbibé » le mot d'entreprise, Lordon propose de le lui rendre, « mais pour en faire aussitôt le nom de ce avec quoi il faut en finir » (37.7).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D23", "M06", "S26", "T003", "T039"], "mentions": ["D23", "M06", "S26", "T003", "T039"], "corollaires": [], "mtime": 1794562538.6220126}, {"id": "T041", "file": "theses/T041.md", "type": "these", "partie": "3", "titre": "La récommune n'épuise pas le communisme", "enonce": "La récommune reste locale : au-delà se posent la question du marché et de la planification, et surtout celle du travail. Le communisme vise aussi l'émancipation d'avec le travail, la reséparation du travail et de l'activité, et n'est pas un programme mais un mouvement réel.", "citation": "", "loc": ["37.8"], "depends_on": ["T040", "M05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T040, la récommune affranchit ses membres de la monarchie du désir-maître ; mais elle est locale, et laisse entières la coordination à l'échelle de la société (marché ou planification) et la question du travail (37.8).\n2. Antoine Artous et Moshe Postone ont retrouvé chez Marx la visée de l'émancipation *d'avec* le travail : le travail, catégorie historique propre au capitalisme, ne doit pas absorber toutes les activités possibles (37.8).\n3. Par M05, le communisme n'est pas un programme mais « le mouvement réel qui abolit l'état actuel des choses » (37.8). ∎", "sections": ["Argumentation"], "demo_refs": ["M05", "T040"], "mentions": ["M05", "T040"], "corollaires": [], "mtime": 1794561825.3345022}, {"id": "T042", "file": "theses/T042.md", "type": "these", "partie": "3", "titre": "Les passions séditieuses : le changement sans libre arbitre", "enonce": "Le déterminisme n'exclut pas le changement : le « nouveau » n'est que ce qui surprend notre entendement fini. Dans l'histoire comme ailleurs, les changements sont produits, par les passions et les institutions. Les passions qui maintiennent les hommes sous des rapports peuvent se reconfigurer pour les détruire, sous l'effet d'une affection, souvent le geste de trop du pouvoir : c'est l'indignation.", "citation": "", "loc": ["38.1", "38.2", "38.3", "38.4"], "depends_on": ["T041", "M05", "S11", "S30", "S09"], "contre": ["R12"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T041 et M05, le communisme est le mouvement réel qui abolit l'état actuel des choses ; d'où peut-il naître, si le libre arbitre est une fiction ? Le contresens qui refuse au déterminisme de penser le changement (R12) est partagé par les apologies du soulèvement et de l'entrepreneur, également libérales en philosophie (38.1-38.2).\n2. Le « nouveau » absolu serait un événement sans cause, un miracle ; par S11, il n'en est pas. Le nouveau n'est que ce qui surprend notre entendement fini (38.3).\n3. Le changement, lui, ne déroge à aucune loi : des étoiles meurent, des collines glissent. Les faits sociaux de transformation sont tout autant produits, par les énergies conatives et leurs passions, à travers les institutions, qu'on peut voir comme des dispositifs affectifs collectifs, capables d'affecter des multitudes (38.4).\n4. Ces passions se reconfigurent sous l'effet d'une affection antécédente, souvent le geste de trop du pouvoir. L'indignation (S30) coalise les sujets après une offense vécue comme les concernant tous ; par S09, plus grande la tristesse commune, plus grande la puissance d'agir qui lutte contre elle (38.4). ∎\n\n## Scolie\n\nLes matelots du *Potemkine* indignés par la condamnation de ceux qui protestaient contre la viande avariée ; une mise à pied abusive qui soulève une usine ; le plan social de trop qui met des cadres dans la rue (38.4).", "sections": ["Démonstration", "Scolie"], "demo_refs": ["M05", "R12", "S09", "S11", "S30", "T041"], "mentions": ["M05", "R12", "S09", "S11", "S30", "T041"], "corollaires": [], "mtime": 1794562538.6230173}, {"id": "T043", "file": "theses/T043.md", "type": "these", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "La sédition n'est pas un sursaut du libre arbitre : les individus sont toujours déterminés, mais désormais à autre chose, quand l'indignation l'emporte sur l'obsequium. Elle rouvre l'angle α : désalignés, les conatus n'offrent plus rien à la capture et s'efforcent vers de nouveaux objets de désir ; ils peuvent même s'opposer au désir-maître.", "citation": "", "loc": ["39.4", "39.5"], "depends_on": ["T042", "D16", "D24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T042, la rupture doit tout au déterminisme des passions, ici des passions colériques, « la meilleure, ou la moins mauvaise, des passions tristes » ; une nouvelle résultante affective fait que l'indignation qui fait bouger l'emporte sur l'obsequium (D16) qui faisait rester (39.4).\n2. L'indignation peut rester isolée ou précipiter une cristallisation plus large, comme Lip en 1973, dont on a craint qu'elle vienne à « véroler tout le corps social » (39.4).\n3. Elle conduit à vivre *ex suo ingenio*, à sa guise, c'est-à-dire « déterminé autrement », et les guises se recomposent souvent collectivement. Le patron, par un abus marginal, a converti la crainte en haine : il a lui-même décolinéarisé ses enrôlés (39.5).\n4. Par D24, la sédition est le devenir orthogonal : capture nulle à l'angle droit, opposition déclarée à 180°. Les perpendiculaires résistent au détournement en inventant de nouveaux objets de désir (39.5). ∎\n\n## Scolie\n\nEn exergue de la section, *The Misfits* : « – C'est toujours mieux qu'un salaire, non ? – Oui, tout est mieux qu'un salaire » (39.1-39.3).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["D16", "D24", "T042"], "mentions": ["D16", "D24", "T042"], "corollaires": [], "mtime": 1794561825.3355014}, {"id": "T044", "file": "theses/T044.md", "type": "these", "partie": "3", "titre": "L'aliénation est fixation, l'émancipation défixation", "enonce": "On n'est jamais séparé de sa puissance : elle est toujours en acte, et l'émancipation n'est pas une retrouvaille. Si l'on veut sauver le mot, l'aliénation est la fixation de la puissance sur peu d'objets, celle que produit le désir-maître, même joyeusement ; le devenir orthogonal est un ré-élargissement, un commencement de défixation.", "citation": "", "loc": ["40.1", "40.2", "40.3"], "depends_on": ["D25", "S29", "T043", "T038"], "contre": ["R13"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S29, il n'y a pas de puissance en réserve : le schème de la séparation (R13) contredit l'immanence (40.1).\n2. Même sous le plus tyrannique des désirs-maîtres, les individus ne sont pas séparés de leur puissance : ils sont déterminés à l'effectuer dans une direction, tristement ou joyeusement (40.2).\n3. Il y a pourtant du plus et du moins dans l'ordre de la puissance. L'exploitation passionnelle (T038) fixe la puissance sur les objets du désir-maître : c'est l'aliénation au sens de D25 (40.2-40.3).\n4. Le devenir orthogonal (T043) est donc « ré-élargissement par commencement de la défixation » (40.3). ∎", "sections": ["Argumentation"], "demo_refs": ["D25", "R13", "S29", "T038", "T043"], "mentions": ["D25", "R13", "S29", "T038", "T043"], "corollaires": [], "mtime": 1794561825.3365028}, {"id": "T045", "file": "theses/T045.md", "type": "these", "partie": "3", "titre": "Le paysage de classe est le dual du paysage passionnel", "enonce": "Passer « symboliquement du côté du capital », c'est avoir le composé affectif salarial déplacé vers la joie : la « subsomption réelle » joyeuse. L'engagement des salariés forme un continuum, de sorte que le paysage de classe, brouillé, reflète le gradient affectif du salariat. Ce gradient n'est pas subjectif : les affects sont objectivement causés.", "citation": "« passer symboliquement du côté du capital, c’est avoir la “subsomption réelle” joyeuse »", "loc": ["41.1", "41.2", "41.3"], "depends_on": ["T034", "S31"], "contre": ["R14"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le choc capital-travail n'a pas disparu, comme le montre la scène rapportée par François Ruffin, où les ouvrières d'un sous-traitant de LVMH affrontent l'assemblée des actionnaires (41.1). Mais la théorie marxienne originelle est en difficulté depuis que le dirigeant est salarié et avec la « diffusion cadriste » (41.1).\n2. Passer symboliquement du côté du capital, c'est voir son composé affectif déplacé du côté joyeux ; par T034, ce passage connaît des degrés, du rétif au salarié qui voue sa vie à l'entreprise. Le paysage de classe est brouillé par ce gradient de l'engagement, gradient de la joie (41.2).\n3. Par S31, les affects sont objectivement causés : le rapport subjectif du salarié à sa situation est objectivement produit. La condition salariale en elle-même n'épuise donc pas la vie salariale (R14), comme le montre le PDG salarié, auquel on passe sans solution de continuité (41.3). ∎", "sections": ["Argumentation"], "demo_refs": ["R14", "S31", "T034"], "mentions": ["R14", "S31", "T034"], "corollaires": [], "mtime": 1794561825.3375056}, {"id": "T046", "file": "theses/T046.md", "type": "these", "partie": "3", "titre": "L'histoire comme mécontentement", "enonce": "L'antagonisme qui peut faire bifurquer l'histoire est affectif : le choc des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose. Il y a donc toujours des classes, mais des classes affectives. En maltraitant jusqu'aux salariés les plus engagés, le capitalisme, haïssable alors qu'il veut se rendre aimable, tend à reconstituer une classe homogène des mécontents, qui menace de remettre l'histoire en marche.", "citation": "« Le mécontentement : voilà la force historique affective capable de faire bifurquer le cours des choses. »", "loc": ["41.4", "41.5"], "depends_on": ["T045", "D26", "S32"], "contre": ["R15"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T045, l'appartenance au salariat n'a plus l'homogénéité qui faisait sa force motrice ; l'histoire, qui fonctionne aux affects, ne bifurque que par les affects colériques (41.4).\n2. Contre ceux qui veulent tourner la page (R15), il y a toujours des classes, au sens de D26 ; la lutte des classes devient lutte de classes affectives (41.4).\n3. Les affects communs ont une cause : le capital comme rapport social, et finalement comme forme de vie (41.4).\n4. Le capitalisme maltraite à des échelles inouïes au moment même où il veut des salariés contents ; il nourrit ainsi l'affect commun qui peut assembler une multitude (S32). Quand la maltraitance touche les salariés les plus engagés, leur situation affective rejoint leur situation matérielle : c'est une « re-purification » de la situation de classe, et la classe des mécontents menace de remettre l'histoire en marche (41.5). ∎", "sections": ["Argumentation"], "demo_refs": ["D26", "R15", "S32", "T045"], "mentions": ["D26", "R15", "S32", "T045"], "corollaires": [], "mtime": 1794561825.3375056}, {"id": "T047", "file": "theses/T047.md", "type": "these", "partie": "3", "titre": "La capture renaît sans cesse", "enonce": "Même hors du capitalisme, le désir-maître renaît : la division du travail produit du pouvoir, les associés entrent dans l'association inégalement armés et inégalement désirants, et toute action est prise dans une économie de la joie. Les joies extrinsèques, de reconnaissance, sont différentielles et appellent la captation attributive : l'œuvre est collective, mais c'est « mon œuvre ».", "citation": "« L’œuvre est collective, mais c’est mon œuvre… »", "loc": ["42.1", "42.2", "42.3"], "depends_on": ["T046", "M06", "S34", "S35", "T005"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T046, une classe des mécontents peut se reconstituer ; mais, parviendrait-elle à renverser le capitalisme, elle n'en aurait vraisemblablement pas fini avec le désir-maître. Par M06, la division du travail sécrète du pouvoir ; abolir la propriété privée est nécessaire mais pas suffisant (R16) : la propriété étatique en URSS n'a pas changé les rapports de production (42.1).\n2. Spinoza s'intéresse lui aussi à la division du travail (*Traité théologico-politique*, V) : par S34, elle rapproche les hommes, mais ils y entrent inégalement armés, ce qui fonde toutes les captures, et inégalement désirants (42.2).\n3. Par T005, le désir est intéressé à son objet, c'est-à-dire en quête de joie : le profit monétaire n'est qu'un cas d'une économie générale de la joie. L'économie de la joie intrinsèque est non rivale ; celle de la joie extrinsèque, de la reconnaissance, est différentielle (42.2).\n4. Par S35, chacun aime contempler sa puissance et la faire voir : d'où la captation des joies extrinsèques de l'action collective. Celui qui désire davantage est « l'appropriateur en puissance », et « prendre les choses en mains » est une annonce de pronation (42.2-42.3). ∎", "sections": ["Argumentation"], "demo_refs": ["M06", "R16", "S34", "S35", "T005", "T046"], "mentions": ["M06", "R16", "S34", "S35", "T005", "T046"], "corollaires": [], "mtime": 1794562468.9048822}, {"id": "T048", "file": "theses/T048.md", "type": "these", "partie": "3", "titre": "Le communisme véritable est un horizon", "enonce": "Le communisme doit compter, comme le capitalisme, avec la servitude passionnelle. Le communisme véritable, la non-rivalité des vrais biens, supposerait des hommes conduits par la raison ; il est un horizon, une idée régulatrice. La sortie du capitalisme ne fait sortir ni de la servitude passionnelle, ni de la violence, ni des rapports de dépendance : il faut renoncer aux illusions de la société radieuse.", "citation": "« le communisme est une longue patience, un effort continu, et peut-être seulement, pour parler encore une fois comme Kant, une idée régulatrice »", "loc": ["42.4", "43.1", "43.3"], "depends_on": ["T047", "S36", "S37", "S34", "S39"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S37, il faut prendre les hommes tels qu'ils sont : le communisme doit compter avec la « force des affects » et l'universelle « servitude humaine » (42.4).\n2. Par S36, l'exploitation passionnelle prendrait fin si les hommes dirigeaient leurs désirs communs vers des biens non rivaux, comme la raison ; par S34, les hommes conduits par la raison ne poursuivent rien pour eux qu'ils ne désirent pour les autres : « la formule la plus haute du communisme » (42.4, 43.1).\n3. Mais cette hypothèse n'est pas petite. Par T047, la capture renaît de la vie passionnelle, qui préexistait au capitalisme et lui survivra ; la structure de la capture est « un attracteur très puissant » (43.1).\n4. Par S39, le conatus n'exclut ni conflits ni haines : rêver l'éradication de la violence et l'extinction du politique (R16) est une fantasmagorie ; l'horizon est d'en trouver les formes les moins destructrices, sans abolir les dépendances, ne serait-ce qu'amoureuses (43.3). ∎\n\n## Scolie\n\nLe naufragé de Pascal, fait roi par les habitants de l'île où il échoue, montre que la capture échoit même à qui ne l'a pas demandée (43.1). L'*Éthique* trace la voie de la raison, mais « la voie est escarpée » (42.4, note 154).", "sections": ["Argumentation", "Scolie"], "demo_refs": ["R16", "S34", "S36", "S37", "S39", "T047"], "mentions": ["R16", "S34", "S36", "S37", "S39", "T047"], "corollaires": [], "mtime": 1794561825.3390775}, {"id": "T049", "file": "theses/T049.md", "type": "these", "partie": "3", "titre": "Tous les régimes passionnels ne se valent pas", "enonce": "Tout ne s'équivaut pas du côté des passions : les institutions déterminent des possibilités contrastées de puissance, de désir et de joie. Une multitude conduite par l'espoir cultive la vie ; par la crainte, elle évite la mort. Le progrès, c'est l'enrichissement de la vie en affects joyeux qui élargissent les effectuations de puissance ; la démocratie radicale, que le Traité politique laisse inachevée, en est l'horizon.", "citation": "« Si l’idée de progrès a un sens, il ne peut être que l’enrichissement de la vie en affects joyeux »", "loc": ["43.2", "43.4"], "depends_on": ["T048", "S38", "S16", "S40", "T044"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T048, il faut renoncer au grand soir, mais pas aux progrès : la servitude passionnelle n'empêche pas la diversité des agencements institutionnels, et tous ne se valent pas (43.2).\n2. Par S38, le joug des affects tristes n'est pas moins joug que celui des affects joyeux, « mais il est… triste » : la crainte rive aux plus bas niveaux de puissance ; c'est par là que se hiérarchisent les régimes de la vie passionnelle collective (43.2).\n3. Le passage de la coercition aux assujettissements joyeux est un progrès, mais de second ordre, au sein du même : la capture fixe toujours les puissances (T044). Se libérer des désirs-maîtres, c'est rouvrir le spectre de leurs effectuations (43.4).\n4. La question du *Traité politique* est celle des agencements qui maximisent nos puissances d'agir et de penser ; toute *potestas* émane de la *potentia multitudinis*, et seule la démocratie, « absolu en tout » (S40), organise les retrouvailles de la multitude et de sa puissance (43.4).\n5. Le progrès est donc l'enrichissement de la vie en affects joyeux, et parmi eux en ceux qui élargissent nos effectuations de puissance et les orientent vers le vrai bien, une vie humaine (S16) (43.4). ∎\n\n## Scolie\n\nCe sont les derniers mots du livre : « j'entends par là une vie humaine » (43.4). Lordon reconnaît en note (note 163) qu'il reprend ici, pour le corps social, le schème de la dé-séparation qu'il avait écarté pour les individus.", "sections": ["Argumentation", "Scolie"], "demo_refs": ["S16", "S38", "S40", "T044", "T048"], "mentions": ["S16", "S38", "S40", "T044", "T048"], "corollaires": [], "mtime": 1794561825.3400915}, {"id": "R01", "file": "refutees/R01.md", "type": "refutee", "partie": "1", "titre": "La servitude volontaire", "enonce": "Le dominé serait serf faute de vouloir assez fort son affranchissement : sa servitude serait voulue, et une volonté plus ferme suffirait à la défaire.", "citation": "« oxymore sans doute suggestif mais qui, en soi […], cache à peine ses malfaçons »", "loc": ["01.8", "08.2", "08.4", "10.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne formule qu'on finit par « ressasser » faute d'autre chose (01.8) : celle de La Boétie, que « l'époque voudrait faire la clé de lecture du rapport salarial » (08.2). Lordon distingue le titre de la thèse : la thèse de La Boétie « vaut mieux que son titre » (08.2, 10.1). La formule suppose un individu-sujet libre d'arbitre, dont les actes seraient l'effet d'un vouloir souverain. Elle reste alors une énigme insoluble (comment vouloir un état indésirable ?) et ne peut servir que d'appel politique au soulèvement des consciences, non de compréhension par les causes (08.2).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3420918}, {"id": "R02", "file": "refutees/R02.md", "type": "refutee", "partie": "1", "titre": "L'intérêt comme calcul, le don comme désintéressement", "enonce": "L'intérêt se réduirait au calcul utilitariste ; à côté de lui existeraient des conduites désintéressées, un altruisme pur où le soi renoncerait à tout compte.", "citation": "", "loc": ["05.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nPosition des « amis du don désintéressé », en particulier du MAUSS (note 4), qui défendent l'*homo donator* contre l'*homo œconomicus* (05.2). Selon Lordon, ils valident la réduction utilitariste qu'ils combattent, en abandonnant à l'adversaire le mot d'intérêt et l'étendue d'un concept bien plus vaste.", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3420918}, {"id": "R03", "file": "refutees/R03.md", "type": "refutee", "partie": "1", "titre": "Le désir comme attraction par le désirable", "enonce": "Le désir serait la traction exercée sur nous par des choses désirables en elles-mêmes, qui préexisteraient au désir.", "citation": "", "loc": ["08.3", "22.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa « conception ordinaire du désir », que la lecture de Spinoza renverse (08.3). Lordon y revient en 22.2 contre « la représentation spontanée qui pose l'antériorité de la valeur au désir » (D17).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": ["D17"], "corollaires": [], "mtime": 1794561825.3430893}, {"id": "R04", "file": "refutees/R04.md", "type": "refutee", "partie": "1", "titre": "La symétrie du capital et du travail", "enonce": "Capital et travail dépendraient également l'un de l'autre, puisque l'employeur a autant besoin de force de travail que le salarié a besoin d'argent.", "citation": "", "loc": ["09.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'objection est formulée par Lordon lui-même (« On objectera que… », 09.2) : les « apporteurs de machines » n'ont formellement pas moins besoin des « apporteurs de travail » que l'inverse.", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3441007}, {"id": "R05", "file": "refutees/R05.md", "type": "refutee", "partie": "1", "titre": "La retenue du licenciement comme norme morale", "enonce": "Sous le fordisme, les employeurs se seraient retenus de licencier par respect d'une norme morale : priver les salariés de leur subsistance serait trop grave pour relever d'une décision économique.", "citation": "", "loc": ["16.1", "16.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nC'est la signification de « quasi-norme morale » que la stabilité de l'emploi fordien a prise aux yeux de l'opinion (16.1). L'opinion « avait cru, ou s'était aventurée à croire » que le licenciement était un interdit (16.2).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3450873}, {"id": "R06", "file": "refutees/R06.md", "type": "refutee", "partie": "2", "titre": "Le consentement, approbation d'une volonté libre", "enonce": "Consentir serait donner l'approbation intime d'une volonté libre : le sujet authentique, autonome et auto-fondé, parlerait en son noyau quand il consent.", "citation": "", "loc": ["20.3", "20.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nC'est la « fausse transparence » du consentement, symptôme de la métaphysique de la subjectivité (20.2-20.3). Elle bute sur les « consentements à problème » (le gourou, le voile, le travail douze heures par jour), qu'elle ne peut écarter qu'en déclarant certains objets inconsentables ou certains sujets intermittents (20.3).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3450873}, {"id": "R07", "file": "refutees/R07.md", "type": "refutee", "partie": "2", "titre": "L'aliénation comme étrangeté à soi", "enonce": "Être aliéné serait être séparé de soi-même : un sujet, autonome en son noyau, serait empêché de procéder de lui-même par un attachement à autre chose que lui.", "citation": "", "loc": ["20.5", "23.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLordon la rattache aux lectures « pré-althussériennes » de Marx (23.3) et à l'usage courant qui réserve l'aliénation aux attachements dont nous ne voudrions pas pour nous (20.5).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3460855}, {"id": "R08", "file": "refutees/R08.md", "type": "refutee", "partie": "2", "titre": "L'intériorité et l'intériorisation", "enonce": "Le consentement serait l'adhésion d'un for intérieur : les normes seraient « intériorisées », et nos états d'âme situés au-dedans de nous.", "citation": "", "loc": ["28.1", "28.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nHéritage des « impasses cartésiennes » (28.2) : pour que l'âme commande au corps, Descartes doit leur trouver un lieu commun, la glande pinéale. Les neurosciences qui confondent l'esprit et le cerveau « continuent de fouiller “dedans” » (28.2).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3470862}, {"id": "R09", "file": "refutees/R09.md", "type": "refutee", "partie": "2", "titre": "L'antinomie de la contrainte et du consentement", "enonce": "Contrainte et consentement, coercition et légitimité, *hard power* et *soft power* désigneraient deux opérations objectives différentes : la force extérieure d'un côté, l'assentiment intérieur de l'autre.", "citation": "", "loc": ["21.4", "28.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne « antinomie fausse » (21.4), à laquelle même Durkheim se laisse prendre en faisant de la « contrainte » le mode opératoire des normes : il prend pour un fait objectif ce qui n'est que l'expression d'un sentiment (21.4). Même aporie pour la coercition et la légitimité, le *hard* et le *soft power* (28.3).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3480852}, {"id": "R10", "file": "refutees/R10.md", "type": "refutee", "partie": "2", "titre": "La demande d'amour au travail, sublimation de l'amour parental", "enonce": "La quête d'amour et de reconnaissance dans le travail serait une métamorphose, par sublimation, de la demande amoureuse originelle de l'enfant envers ses parents.", "citation": "", "loc": ["23.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'hypothèse ontogénétique de la psychanalyse, qui accorde à cette demande « l'absolu primat » (23.2).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3480852}, {"id": "R11", "file": "refutees/R11.md", "type": "refutee", "partie": "3", "titre": "La valeur objective et l'exploitation comme extraction de plus-value", "enonce": "Il existerait une valeur substantielle, mesurée par le temps de travail abstrait ; l'exploitation serait l'appropriation par le capital de la plus-value, écart entre la valeur produite et la valeur de reproduction de la force de travail.", "citation": "", "loc": ["35.1", "35.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa théorie marxienne de la valeur-travail (35.1). Lordon y voit la principale divergence entre Marx et Spinoza, avec la dialectique du négatif : la valeur substantielle est une « figure de la transcendance subrepticement réintroduite au cœur de l'immanence » (35.2). La définition de la valeur de la force de travail est en outre circulaire : c'est le salaire qui l'indique (35.1).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3490865}, {"id": "R12", "file": "refutees/R12.md", "type": "refutee", "partie": "3", "titre": "Le changement suppose le libre arbitre", "enonce": "Le déterminisme ne pourrait penser le changement, puisque « tout est écrit » ; seules des volontés libres pourraient produire le nouveau et briser leurs chaînes.", "citation": "", "loc": ["38.1", "38.2", "38.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUn contresens sur le déterminisme (38.1), partagé, note Lordon, par les discours d'exaltation du soulèvement et par les apologies de l'entrepreneur : tous deux libéraux en philosophie (38.2). Le « nouveau » se veut un surgissement sans cause, c'est-à-dire un miracle (38.3).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.350089}, {"id": "R13", "file": "refutees/R13.md", "type": "refutee", "partie": "3", "titre": "La désaliénation comme retrouvaille de sa puissance", "enonce": "L'aliéné serait « coupé de sa puissance d'agir » ; s'émanciper serait la rejoindre, la réapproprier, recoïncider avec soi.", "citation": "", "loc": ["40.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schème des relectures contemporaines du jeune Marx, et, selon Pascal Sévérac, de Deleuze lui-même lisant Spinoza (40.1).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.350089}, {"id": "R14", "file": "refutees/R14.md", "type": "refutee", "partie": "3", "titre": "La condition salariale fait à elle seule la classe", "enonce": "La situation objective de vendeur de force de travail déterminerait à elle seule l'appartenance de classe ; l'engagement vécu des salariés ne serait qu'une superficialité « subjectiviste ».", "citation": "", "loc": ["41.1", "41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schéma de la théorie marxienne originelle, mis en difficulté dès que le dirigeant est devenu salarié, et par la « diffusion cadriste » (41.1, note 140). Le cas limite du PDG salarié la réfute par l'absurde (41.3).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3510857}, {"id": "R15", "file": "refutees/R15.md", "type": "refutee", "partie": "3", "titre": "Les classes ont disparu", "enonce": "Il n'y aurait plus de classes : la fragmentation du salariat aurait rendu caduque l'idée même de lutte des classes.", "citation": "", "loc": ["41.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa position d'« une certaine sociologie désireuse de tourner au plus vite la page du marxisme pour mieux épouser l'air du temps libéral » (41.4).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3510857}, {"id": "R16", "file": "refutees/R16.md", "type": "refutee", "partie": "3", "titre": "L'émancipation comme grand soir", "enonce": "Il suffirait d'abolir la propriété privée des moyens de production pour en finir avec la domination ; la révolution ferait advenir d'un coup un ordre tout autre, où les classes et le politique s'éteindraient.", "citation": "", "loc": ["42.1", "43.2", "43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLes lectures trop rapides de Marx qui réduisent le pouvoir au régime de propriété (42.1) ; l'idée du « grand soir » (43.2) ; l'« extinction du politique », « fantasmagories post-politiques », peut-être « l'erreur anthropologique la plus profonde de Marx » (43.3).", "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.3520877}], "documents": [{"name": "PARCOURS.md", "kind": "projet", "body": "# Parcours de lecture\n\nLe treillis se parcourt dans tous les sens. Pour une première lecture, voici un fil de seize étapes, de la question du livre à sa conclusion. Chaque étape renvoie à un élément ; de là, « Chemin vers » montre ce sur quoi il repose, « Conséquences » ce qui en découle.\n\n## I. La question\n\n**1.** T001. Comment certains hommes « peuvent »-ils en faire travailler d'autres pour leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza).\n\n**2.** T002. Le capitalisme contemporain produit des « dominés heureux ». Il faut repenser la domination sans recourir à la « servitude volontaire ».\n\n## II. Faire faire\n\n**3.** D01, T003. Le conatus est l'énergie du désir. Désirer faire est légitime ; faire faire, enrôler d'autres puissances (D02) au service d'un désir-maître (D03), pose une question politique.\n\n**4.** T006, T007. Dans une économie à travail divisé, la vie passe par l'argent : le rapport salarial est d'abord dépendance, donc domination, la plus puissante qui soit.\n\n**5.** T008, T009. Le désir est hétéronome : ses objets lui viennent du dehors. La servitude volontaire n'existe pas ; il n'y a que la servitude passionnelle, et elle est universelle.\n\n**6.** T014. Mobiliser, c'est aligner : le modèle de l'angle α (voir la [figure de l'angle α](#alpha)).\n\n**7.** T015, T019. Les régimes de mobilisation changent : la faim, puis la consommation, puis l'entreprise néolibérale, qui veut α = 0 et pousse la domination jusqu'à la tyrannie.\n\n## III. Joyeux automobiles\n\n**8.** T021. Le projet néolibéral : faire désirer le travail lui-même (voir la vue des [régimes d'affects](#regimes)).\n\n**9.** T022, T025. Le consentement, l'aliénation et l'intériorité n'existent pas comme on les entend ; contrainte et consentement ne sont que des affects tristes ou joyeux.\n\n**10.** T024, T027, T028. D'où vient l'obéissance joyeuse : le pouvoir règne mieux par l'amour ; l'amour du maître ; les images vocationnelles.\n\n**11.** T029, T034. L'entreprise vise la possession des âmes, mais le fond d'affects tristes demeure.\n\n## IV. Domination, émancipation\n\n**12.** T035, T036. Même joyeuse, la domination réserve le désirable aux uns et en écarte les autres.\n\n**13.** T038. L'exploitation est passionnelle : une capture de puissance d'agir, non une extraction de plus-value.\n\n**14.** T040. La récommune : l'entreprise constituée en démocratie radicale.\n\n**15.** T042, T043. Le changement sans libre arbitre : l'indignation fait « devenir perpendiculaire ».\n\n**16.** T048, T049. Le communisme véritable est un horizon ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux.\n\n"}, {"name": "AGENT.md", "kind": "projet", "body": "# AGENT.md : *Capitalisme, désir et servitude* en treillis\n\nCe fichier définit l'objectif, la méthode et les conventions du projet. Il s'adresse à l'agent (Claude) et à l'auteur. Tout travail dans ce dépôt doit s'y conformer. Il évolue avec le projet, et toute modification est discutée avec l'auteur.\n\nProjets voisins : [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (l'*Éthique*, `/spinoza`) et Homo Status (`/status`, dépôt `status-and-politics`), dont ce projet reprend l'outillage et une partie des conventions.\n\n## 1. Objectif\n\nReconstruire **fidèlement** l'argument de Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza* (La Fabrique, 2010), dans l'ordre géométrique, et le rendre explorable comme un graphe. Depuis une thèse, on doit pouvoir voir le chemin qui y mène, jusqu'aux prémisses spinozistes et marxiennes, et ce qui en découle.\n\nC'est une **reconstruction, non une critique**. On ne juge pas les thèses, on ne cherche pas de rivales et on ne dit pas ce qui les réfuterait : ce travail-là appartient à Homo Status (`status-and-politics/references/lordon.md`). Ici, la seule question est : *qu'est-ce que Lordon dit, et comment est-ce que cela s'enchaîne ?*\n\n## 2. Fidélité\n\n1. **Rien qui ne soit dans le livre.** Chaque élément reformule un passage du livre. Si un pas manque pour relier deux thèses, on le signale (§ 2.4) ; on n'ajoute pas de contenu.\n2. **Toute affirmation a son repère** (champ `loc`, § 6). Dans une démonstration, chaque étape porte son repère entre parenthèses : « (08.4) ».\n3. **Les renvois à Spinoza sont ceux de Lordon.** Quand Lordon cite l'*Éthique*, on note le renvoi tel quel (champ `ethique`). Quand on identifie soi-même la proposition qu'il utilise sans la citer, on l'écrit dans le corps, marqué *[renvoi reconstruit]*.\n4. **Explicite ou reconstruit.** Le champ `lien_explicite` d'une thèse dit si Lordon fait lui-même les liens déclarés dans `depends_on` (`true`) ou si on les a reconstruits pour relier son argument (`false`). Dans le corps, un pas que Lordon ne fait pas est marqué *[reconstruit]*.\n5. **Démonstration ou argumentation.** Une thèse a une section `## Démonstration` quand Lordon déduit, et une `## Argumentation` quand il établit par exemples, analogies ou réfutation. On ne fabrique pas de déduction absente du livre.\n6. **Le vocabulaire de Lordon** est conservé (enrôlement, désir-maître, colinéarisation, épithumè…). On ne le traduit pas dans celui d'Homo Status.\n\n## 3. Types d'éléments\n\n| type | préfixe | dossier | rôle |\n|---|---|---|---|\n| `definition` | `D` | `definitions/` | un concept que Lordon définit ou forge (enrôlement, désir-maître, angle α…) |\n| `spinoza` | `S` | `premisses/` | une thèse de Spinoza que Lordon prend comme prémisse ; renvoie à l'*Éthique* (`ethique`) sans en recopier le texte, qui est dans SpinozaGraph, ou, pour une autre œuvre (*Traité politique*, lettres), la cite dans `ref` (ex. « Traité politique, III, 8 ») |\n| `marx` | `M` | `premisses/` | une thèse de Marx que Lordon prend comme prémisse (rapport salarial, double séparation, argent…) |\n| `these` | `T` | `theses/` | une thèse de Lordon, avec sa démonstration ou son argumentation |\n| `refutee` | `R` | `refutees/` | une position que Lordon réfute (servitude volontaire, consentement, intériorité…), énoncée telle qu'il la présente |\n\n- Concepts, prémisses et positions réfutées ne s'appuient que sur des concepts et des prémisses. Seules les thèses s'appuient sur des thèses.\n- Le champ `contre` d'une thèse liste les positions `R` qu'elle réfute. Ces arêtes « contre » sont distinctes des appuis : elles n'entrent ni dans le chemin ni dans les conséquences.\n- Un **corollaire** se rédige dans le fichier de sa thèse et porte l'identifiant `T012-C1`. Une **scolie** (exemples, digressions, résumés) est un commentaire et n'est pas porteuse logiquement.\n- Les identifiants sont globaux (`T012`, et non « chap. 1, thèse 12 »). Ils sont numérotés dans l'ordre d'apparition dans le livre et peuvent être renumérotés tant que le pilote n'est pas validé (§ 7) ; toute renumérotation est répercutée partout.\n\n## 4. Structure du dépôt\n\n```\nAGENT.md          ce fichier\nsections.yaml     titres des sections du livre, pour les repères (§ 6)\nREADME.md\nPARCOURS.md       parcours de lecture : un fil d'une quinzaine d'éléments, de la question du livre à sa conclusion\nINDEX.md          table de tous les éléments, plan par chapitre, journal\nparties/          P (prémisses), 0 (avant-propos), 1, 2, 3 (chapitres) : titre de Lordon, sections, résumé\ndefinitions/      D01.md …\npremisses/        S01.md …, M01.md …\ntheses/           T001.md …\nrefutees/         R01.md …\noutils/           build_explorer.py, explorer_template.html, check.py, extract_epub.py\nsource/           NON VERSIONNÉ : le fichier du livre et le texte extrait (§ 6)\nexplorer.html     généré\n```\n\nChaque élément porte un champ `partie` : `P` pour les prémisses S et M, sinon le chapitre où il apparaît (`0` pour l'avant-propos). `INDEX.md` est mis à jour à chaque ajout, modification ou retrait.\n\n## 5. Format d'un fichier\n\n```markdown\n---\nid: T012\ntype: these                 # definition | spinoza | marx | these | refutee\npartie: \"1\"                 # P | 0 | 1 | 2 | 3\ntitre: Titre court\nenonce: >\n  Reformulation de la thèse, en une ou deux phrases.\nloc: [\"08.2\", \"08.4\"]        # repères section.paragraphe (§ 6)\ncitation: \"« … »\"           # facultative ; une ou deux phrases au plus (§ 6)\ndepends_on: [D03, S02, T009]\ncontre: [R02]               # thèses seulement\nethique: [3p6, 3p9sc]       # identifiants de SpinozaGraph (obligatoire pour S)\nlien_explicite: true        # thèses seulement (§ 2.4)\nstatut_revision: brouillon  # brouillon | verifie-texte\n---\n\n## Énoncé\n…\n\n## Démonstration            (ou ## Argumentation)\n1. Par S02, … (08.3).\n2. Par D03 et T009, … (08.4). ∎\n\n## Scolie\nExemples et digressions du livre, résumés.\n```\n\n`depends_on` correspond exactement aux identifiants invoqués dans la démonstration ou l'argumentation. Les identifiants de l'*Éthique* suivent SpinozaGraph : `1def3`, `1ax4`, `3p6`, `3p9sc`, `3p13csc`, `3ad1` (définitions des affects), `3agd` (définition générale des affects), `4pr` (préface), `4appc28` (appendice de la partie IV, chapitre 28). Une démonstration est citée par sa proposition (`3p37` pour « III, 37, démonstration »).\n\n## 6. Droits et texte source\n\nLe livre est sous droits.\n\n- Le fichier du livre et le texte extrait vivent dans `source/`, **exclu de Git** (`.gitignore`). On ne les publie jamais, ni en tout ni en partie.\n- Les éléments **reformulent**. Une citation (champ `citation` ou dans le corps) tient en une ou deux phrases, au plus 300 caractères, entre guillemets, avec son repère, et seulement quand la formule compte (une formule célèbre, un concept). C'est l'usage du droit de citation : courte, justifiée par l'analyse, sourcée.\n- **Repères.** Le fichier de travail est un EPUB sans pagination. Un passage est donc repéré par **section et paragraphe** : `08.4` est le 4e paragraphe de la section 08, « La servitude volontaire n'existe pas ». Les sections sont celles de la table des matières de Lordon (`sections.yaml`, qui ne contient que les titres) ; les paragraphes sont numérotés par `outils/extract_epub.py`, qui produit `source/texte/` à partir de l'EPUB. Un lecteur de l'édition papier retrouve le passage par le titre de section. Si l'auteur fournit plus tard la pagination papier, on l'ajoutera à côté.\n\n## 7. Méthode de travail\n\n1. **Pilote** : l'avant-propos et le chapitre 1. L'auteur valide le découpage et le format avant qu'on poursuive.\n2. **Un chapitre à la fois** : lecture → éléments → `INDEX.md` → `python outils/check.py` → `python outils/build_explorer.py` → relecture par l'auteur → commit.\n3. **Audit de fidélité** : chaque élément est relu contre le passage cité (reformulation exacte, repère juste, liens explicites ou reconstruits bien marqués), puis passe à `verifie-texte`.\n\n   **Ce que `verifie-texte` garantit** : l'énoncé a été relu contre les passages cités et ne dit ni plus ni moins que Lordon (ou, pour une prémisse S, que Spinoza) ; tout passage entre guillemets est dans le livre mot pour mot ; repères et notes existent et sont à leur place (`audit_forme.py`) ; aucune étape ne renvoie à un passage manifestement moins pertinent qu'un autre (`audit_reperes.py`). Le corps des thèses, des concepts et des positions réfutées a en outre été relu phrase à phrase contre le texte par l'agent (13 novembre 2026) ; celui des prémisses S et M l'a été lors de leur rédaction et par les contrôles. **Ce qu'il ne garantit pas** : une relecture par l'auteur ; elle reste ouverte, et toute correction est consignée dans le journal d'`INDEX.md`.\n4. Les commits et les push se font seulement à la demande de l'auteur.\n\n## 8. Contrôles\n\n`python outils/check.py` vérifie : identifiants et types, repères présents et bien formés, longueur des citations, existence des dépendances, absence de cycle, concordance entre `depends_on` et la démonstration, arêtes `contre` vers des `R`, renvois à l'*Éthique* existants dans SpinozaGraph (si le dépôt est à côté), cohérence avec `INDEX.md`, exclusion de `source/`. L'onglet « Audit » de l'explorateur affiche les mêmes contrôles.\n\n`python outils/audit_forme.py` fait l'audit de forme, sans juger l'argument : ponctuation et guillemets, structure des fichiers (sections attendues, étape , "T047", "T048", "T049"], "parties": {"P": "Prémisses", "0": "Avant-propos", "1": "Faire faire", "2": "Joyeux automobiles", "3": "Domination, émancipation"}, "partie_docs": [{"id": "P", "titre": "Prémisses", "resume": "Les thèses de Spinoza et de Marx que Lordon prend comme points de départ.", "loc": "", "body": "Les prémisses de Spinoza (S) renvoient à l'*Éthique* dans SpinozaGraph ou, pour le *Traité politique*, à l'article cité. Ce sont celles que Lordon invoque lui-même, presque toujours en note. Elles portent sur le conatus et le désir (S01, S03, S04), la vie affective (association, imitation, amour, crainte, force des affects), la détermination et l'illusion de la liberté (S10-S12), et le pouvoir (l'*obsequium*, S15).\n\nLes prémisses de Marx (M) portent sur le rapport salarial : la double séparation, l'accumulation primitive, la priorité de la reproduction de la vie, la différence du travail et de la force de travail.", "file": "parties/P.md"}, {"id": "0", "titre": "Avant-propos", "resume": "La question du livre et sa méthode : combiner un structuralisme des rapports et une anthropologie des passions.", "loc": "01", "body": "Comment certains hommes « peuvent »-ils en amener d'autres à entrer dans leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza) : T001. Les « dominés heureux » du capitalisme contemporain obligent à repenser la domination et le consentement sans recourir à la « servitude volontaire » ; le livre part du triangle élémentaire du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre : T002.", "file": "parties/0.md"}, {"id": "1", "titre": "Faire faire", "resume": "Le désir de faire faire : l'enrôlement des puissances d'agir, la dépendance à l'argent, la servitude passionnelle, l'alignement des désirs et sa radicalisation néolibérale.", "loc": "02–17", "body": "**Ce que le chapitre pose.** Le conatus est l'énergie du désir (D01). Le désir de faire est légitime, non le désir de faire faire, qui est enrôlement au service d'un désir-maître (T003, D02-D04). Le salariat n'est qu'un cas du patronat (T004).\n\n**La dépendance et la domination.** La reproduction de la vie nue passe par l'argent : le rapport salarial est d'abord dépendance (T006), donc domination, la plus puissante qui soit (T007). Le désir est hétéronome (T008) : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle (T009). La dépendance est asymétrique (T010) et se diffracte à tous les étages de l'entreprise (T011), où la crainte et la violence se propagent (T012).\n\n**Les régimes de mobilisation.** Le salariat attache aussi par la joie, du salaire et de la consommation (T013). Mobiliser, c'est aligner : le modèle vectoriel de l'angle α (D11, T014). L'entreprise néolibérale veut α = 0 (T015) ; tant que rien ne le retient, le capital avance et gouverne par la crainte (T016), sans morale autonome (T017), sur le modèle de la liquidité (T018), jusqu'à la tyrannie et la terreur (T019).", "file": "parties/1.md"}, {"id": "2", "titre": "Joyeux automobiles", "resume": "Les affects joyeux intrinsèques : faire désirer le travail lui-même ; le consentement, l'intériorité et l'aliénation repensés.", "loc": "18–31", "body": "**Le projet.** Le capitalisme est un régime de désir, une épithumè, dont l'entreprise néolibérale prend en main la production (T020). Elle vise des affects joyeux intrinsèques : faire désirer l'activité pour elle-même (D15, T021).\n\n**La critique du consentement.** Le consentement et l'aliénation n'existent pas comme on les entend : tout est déterminé (T022). Le pouvoir est un art d'affecter (T023), qui règne mieux par l'amour : le consentement est l'obéissance heureuse (T024). Contrainte et consentement ne sont que des affects tristes ou joyeux ; il n'y a pas d'intériorité (T025).\n\n**Les sources de l'obéissance joyeuse.** Le réenchantement spontané du travail par le salarié (T026), l'amour du maître et la quête de reconnaissance (T027), les images vocationnelles que produit la société (T028).\n\n**L'entreprise totalitaire et ses limites.** L'entreprise néolibérale vise la possession des âmes (T029) ; le désir des recrutés reste opaque (T030) ; la joie fait oublier l'hétéronomie (T031) ; le constructivisme visible attire la haine (T032) ; le coaching produit l'*amor fati capitalistis* (T033). Mais le fond d'affects tristes demeure, et les « consentements » restent mitigés (T034).", "file": "parties/2.md"}, {"id": "3", "titre": "Domination, émancipation", "resume": "La domination et l'exploitation repensées par les passions ; la sédition, la récommune et les limites du communisme.", "loc": "32–43", "body": "**La domination et l'exploitation.** Même joyeux, l'enrôlement reste domination : il fixe les désirs et réserve aux uns ce qu'il écarte des autres (D20, T035). La division du travail devient division du désir, par l'imaginaire de l'impuissance (D21, T036). Il n'y a pas de valeur objective (T037) : l'exploitation relève d'une politique de la capture, elle est passionnelle (D22, T038).\n\n**Les issues.** Le projet néolibéral mène à l'alternative « communisme ou totalitarisme » (T039). La récommune, entreprise constituée en démocratie radicale, abolit le rapport salarial (D23, T040), sans épuiser le communisme (T041).\n\n**La sédition.** Le changement n'exige pas le libre arbitre : l'indignation reconfigure les passions (T042) et fait « devenir perpendiculaire » (D24, T043). L'aliénation est fixation, l'émancipation défixation (D25, T044). Le paysage de classe reflète le paysage passionnel (T045) ; l'histoire bifurque par le mécontentement, en lutte de classes affectives (D26, T046).\n\n**Les limites.** La capture renaît de la division du travail et de l'économie de la joie (T047) ; le communisme véritable, vie sous la raison, est un horizon (T048) ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux (T049).", "file": "parties/3.md"}], "sections": {"01": {"titre": "Avant-propos", "partie": "0"}, "02": {"titre": "I. FAIRE FAIRE", "partie": "1"}, "03": {"titre": "Le désir de faire quelque chose", "partie": "1"}, "04": {"titre": "Le désir de faire faire : patronat et enrôlement", "partie": "1"}, "05": {"titre": "Intérêt, désir, mise en mouvement", "partie": "1"}, "06": {"titre": "La vie nue et l’argent", "partie": "1"}, "07": {"titre": "La monnaie rapport, l’argent désir", "partie": "1"}, "08": {"titre": "La servitude volontaire n’existe pas", "partie": "1"}, "09": {"titre": "L’asymétrie de l’initiative monétaire", "partie": "1"}, "10": {"titre": "Domination à tous les étages", "partie": "1"}, "11": {"titre": "Pressions ambiantes et remontée de la violence (contrainte actionnariale et concurrence)", "partie": "1"}, "12": {"titre": "Mobilisation joyeuse et aliénation marchande", "partie": "1"}, "13": {"titre": "L’enrôlement comme alignement", "partie": "1"}, "14": {"titre": "α =0 !", "partie": "1"}, "15": {"titre": "Intensification de la crainte", "partie": "1"}, "16": {"titre": "La liquidité, le fantasme du désir-maître capitaliste", "partie": "1"}, "17": {"titre": "Tyrannie et terreur", "partie": "1"}, "18": {"titre": "II. JOYEUX AUTOMOBILES (Salariés : les faire marcher)", "partie": "2"}, "19": {"titre": "Des affects joyeux intrinsèques", "partie": "2"}, "20": {"titre": "Les apories du consentement", "partie": "2"}, "21": {"titre": "L’obéissance joyeuse", "partie": "2"}, "22": {"titre": "Le ré-enchantement spontané", "partie": "2"}, "23": {"titre": "L’amour du maître", "partie": "2"}, "24": {"titre": "Les images vocationnelles", "partie": "2"}, "25": {"titre": "Le totalitarisme de la possession des âmes", "partie": "2"}, "26": {"titre": "Girl friend experience (après le don des larmes)", "partie": "2"}, "27": {"titre": "L’insondable mystère du désir enrôlé", "partie": "2"}, "28": {"titre": "Il n’y a pas d’intériorité (ni d’intériorisation)", "partie": "2"}, "29": {"titre": "Les ris
