] est une, et commune à tous »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VII, 27", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 110 et 112. Pour Lordon, c'est « la réaffirmation la plus radicale de l'égalité anthropologique fondamentale », que recouvre l'arbitraire des classifications sociales (34.2 ; T036). Il la rapproche du premier des *Trois discours sur la condition des grands* de Pascal : votre bien n'est pas « un titre de nature, mais d'un établissement humain ».", "body_en": "## In Lordon\n\nNotes 110 and 112. For Lordon, it is \"the most radical reaffirmation of fundamental anthropological equality\", which the arbitrariness of social classifications covers over (34.2; T036). He compares it with the first of Pascal's *Three Discourses on the Condition of the Great*: your wealth is not \"a title of nature, but of a human establishment\".", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794593716.2087257}, {"id": "S29", "file": "premisses/S29.md", "type": "spinoza", "partie": "P", "titre": "La puissance est toujours en acte", "enonce": "L'effort par lequel chaque chose s'efforce de persévérer dans son être n'est rien en dehors de son essence actuelle ; réalité et perfection sont une même chose.", "titre_en": "Power is always in act", "enonce_en": "The striving by which each thing strives to persevere in its being is nothing apart from its actual essence; reality and perfection are one and the same.", "titre_de": "Die Macht ist immer in Akt", "enonce_de": "Das Streben, mit dem jedes Ding in seinem Sein zu verharren strebt, ist nichts außer seinem wirklichen Wesen; Realität und Vollkommenheit sind ein und dasselbe.", "body_de": "## Bei Lordon\n\n*Ethik* II, Definition 6, zitiert in 35.2 und 40.1; III, 7, in Anm. 134 (40.2). Lordon schließt mit Pascal Sévérac, dass es „in der spinozistischen Ontologie keine Reserve gibt“: Die vollständige Immanenz schließt den aristotelischen Unterschied zwischen Vermögen und Akt aus; „der Conatus ist immer an der Grenze dessen, was er kann“, selbst wenn er sehr wenig kann, und der Konjunktiv der Vergangenheit, „ich hätte können“, ist „der spinozistische Unsinn schlechthin“ (40.1). Er schließt auch jeden objektiven Wert aus, der eine Norm setzen würde (35.2; T037).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Par réalité et par perfection, j’entends la même chose »", "loc": ["35.2", "40.1", "40.2"], "depends_on": [], "contre": [], "ethique": ["3p7", "2def6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*Éthique* II, définition 6, citée en 35.2 et 40.1 ; III, 7, en note 134 (40.2). Lordon en tire, avec Pascal Sévérac, qu'« il n'y a pas de réserve dans l'ontologie spinoziste » : l'immanence intégrale exclut la différence aristotélicienne de la puissance et de l'acte ; « toujours le conatus est au bout de ce qu'il peut », même s'il peut très peu, et le conditionnel passé, « j'aurais pu », est « le non-sens spinoziste par excellence » (40.1). Elle exclut aussi toute valeur objective qui ferait norme (35.2 ; T037).", "body_en": "## In Lordon\n\n*Ethics* II, definition 6, quoted in 35.2 and 40.1; III, 7, in note 134 (40.2). Lordon concludes, with Pascal Sévérac, that \"there is no reserve in Spinozist ontology\": integral immanence excludes the Aristotelian difference between potency and act; \"the conatus is always at the limit of what it can do\", even if it can do very little, and the past conditional, \"I could have\", is \"the Spinozist nonsense par excellence\" (40.1). It also excludes any objective value that would set a norm (35.2; T037).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T037"], "corollaires": [], "mtime": 1794593716.2107408}, {"id": "S30", "file": "premisses/S30.md", "type": "spinoza", "partie": "P", "titre": "L'indignation", "enonce": "L'indignation est la haine envers quelqu'un qui a fait du mal à autrui.", "titre_en": "Indignation", "enonce_en": "Indignation is hatred towards someone who has done harm to another.", "titre_de": "Die Empörung", "enonce_de": "Empörung ist Hass gegen jemanden, der einem anderen Böses getan hat.", "body_de": "## Bei Lordon\n\n„Spinoza nennt diesen nicht moralischen, sondern politischen Affekt schlechthin allgemein ‚Empörung‘“, der die Subjekte nach einer, manchmal einem Einzigen zugefügten, Kränkung im Aufstand zusammenführt (38.4). *[rekonstruierter Verweis: Lordon gibt keinen Verweis; die Definition ist die von III, Definition der Affekte 20. Den politischen Sinn, den er daraus zieht, entnimmt er vor allem dem* Politischen Traktat.*]* Die Empörung ist der Name der Dynamik, die „den Winkel α wieder öffnet“ (39.5; T043).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["38.4", "39.5"], "depends_on": [], "contre": [], "ethique": ["3ad20"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Spinoza nomme génériquement “indignation” cet affect, non pas moral mais politique par excellence », qui coalise les sujets dans la révolte après une offense faite parfois à un seul (38.4). *[renvoi reconstruit : Lordon ne donne pas de référence ; la définition est celle de III, définition des affects 20. Le sens politique qu'il en tire vient surtout du* Traité politique.*]* L'indignation est le nom de la dynamique qui « réouvre l'angle α » (39.5 ; T043).", "body_en": "## In Lordon\n\n\"Spinoza generically names 'indignation' this affect, not moral but political par excellence\", which brings subjects together in revolt after an offence sometimes done to a single one (38.4). *[reconstructed reference: Lordon gives no reference; the definition is that of III, definition of the affects 20. The political sense he draws from it comes mostly from the* Political Treatise.*]* Indignation is the name of the dynamic that \"reopens the angle α\" (39.5; T043).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T043"], "corollaires": [], "mtime": 1794593716.2107408}, {"id": "S31", "file": "premisses/S31.md", "type": "spinoza", "partie": "P", "titre": "Les affects, propriétés naturelles de l'homme", "enonce": "Les affects doivent être considérés comme des propriétés de la nature humaine, au même titre que la chaleur, le froid, la tempête ou le tonnerre appartiennent à la nature de l'air : fâcheux, mais nécessaires, et ayant des causes déterminées.", "titre_en": "The affects, natural properties of man", "enonce_en": "The affects must be regarded as properties of human nature, just as heat, cold, storm and thunder belong to the nature of the air: troublesome, but necessary, and with determinate causes.", "titre_de": "Die Affekte, natürliche Eigenschaften des Menschen", "enonce_de": "Die Affekte sind als Eigenschaften der menschlichen Natur zu betrachten, so wie Hitze, Kälte, Sturm und Donner zur Natur der Luft gehören: lästig, aber notwendig, und mit bestimmten Ursachen.", "body_de": "## Bei Lordon\n\nAnm. 141. Die Affekte, obgleich individuell empfunden, „haben nichts Subjektives: Sie sind objektiv verursacht“; das subjektive Verhältnis des Angestellten zu seiner Lage ist objektiv hervorgebracht (41.3; T045).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« comme des propriétés qui appartiennent [à la nature humaine], comme appartiennent à la nature de l’air chaleur, froid, tempête, tonnerre […] »", "loc": ["41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 4", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 141. Les affects, quoique éprouvés individuellement, « n'ont rien de subjectif : ils sont objectivement causés » ; le rapport subjectif du salarié à sa situation est objectivement produit (41.3 ; T045).", "body_en": "## In Lordon\n\nNote 141. The affects, though felt individually, \"have nothing subjective about them: they are objectively caused\"; the employee's subjective relation to his situation is objectively produced (41.3; T045).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T045"], "corollaires": [], "mtime": 1794593716.2107408}, {"id": "S32", "file": "premisses/S32.md", "type": "spinoza", "partie": "P", "titre": "L'affect commun qui assemble une multitude", "enonce": "Une multitude s'assemble et s'accorde non par la raison, mais sous l'effet d'un affect commun.", "titre_en": "The common affect that assembles a multitude", "enonce_en": "A multitude comes together and agrees not by reason, but under the effect of a common affect.", "titre_de": "Der gemeinsame Affekt, der eine Menge versammelt", "enonce_de": "Eine Menge kommt nicht durch die Vernunft zusammen und überein, sondern unter der Wirkung eines gemeinsamen Affekts.", "body_de": "## Bei Lordon\n\nEine als solche gekennzeichnete Paraphrase des *Politischen Traktats*, VI, 1 (Anm. 143): Indem er schlecht behandelt, nährt der Kapitalismus den gemeinsamen Affekt der Unzufriedenheit (41.5; T046).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« l’affect commun par lequel une multitude pourrait venir à s’assembler »", "loc": ["41.5"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nParaphrase du *Traité politique*, VI, 1, signalée comme telle (note 143) : en maltraitant, le capitalisme nourrit l'affect commun du mécontentement (41.5 ; T046).", "body_en": "## In Lordon\n\nA paraphrase of the *Political Treatise*, VI, 1, flagged as such (note 143): by mistreating, capitalism feeds the common affect of discontent (41.5; T046).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T046"], "corollaires": [], "mtime": 1794593716.2107408}, {"id": "S33", "file": "premisses/S33.md", "type": "spinoza", "partie": "P", "titre": "L'affect tenace", "enonce": "La force d'une passion peut surpasser les autres actions d'un homme, ou sa puissance, au point que l'affect se fixe en lui de façon tenace.", "titre_en": "The stubborn affect", "enonce_en": "The force of a passion can surpass a man's other actions, or his power, so that the affect becomes stubbornly fixed in him.", "titre_de": "Der hartnäckige Affekt", "enonce_de": "Die Kraft einer Leidenschaft kann die übrigen Handlungen oder die Macht eines Menschen übertreffen, sodass der Affekt sich hartnäckig in ihm festsetzt.", "body_de": "## Bei Lordon\n\nAnm. 135. Mit der „Besetzung des Geistes“ (Sévérac, Anm. 136) ist das der Sinn, den man der Entfremdung geben muss, wenn man das Wort retten will: der von zu wenigen Dingen, aber ganz erfüllte Geist (40.2; D25).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« La force d’une passion, ou affect, peut surpasser les autres actions d’un homme, ou sa puissance, au point que l’affect se fixe en lui d’une façon tenace »", "loc": ["40.2"], "depends_on": [], "contre": [], "ethique": ["4p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 135. Avec « l'occupation de l'esprit » (Sévérac, note 136), c'est le sens à donner à l'aliénation, si l'on veut sauver le mot : l'esprit rempli par trop peu de choses, mais entièrement (40.2 ; D25).", "body_en": "## In Lordon\n\nNote 135. With \"the occupation of the mind\" (Sévérac, note 136), this is the meaning to give to alienation, if one wants to save the word: the mind filled by too few things, but entirely (40.2; D25).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25"], "corollaires": [], "mtime": 1794593716.2107408}, {"id": "S34", "file": "premisses/S34.md", "type": "spinoza", "partie": "P", "titre": "Rien n'est plus utile à l'homme que l'homme", "enonce": "Rien n'est plus utile à l'homme que l'homme ; les hommes conduits par la raison ne poursuivent rien pour eux-mêmes qu'ils ne le désirent aussi pour les autres.", "titre_en": "Nothing is more useful to man than man", "enonce_en": "Nothing is more useful to man than man; men guided by reason seek nothing for themselves that they do not also desire for others.", "titre_de": "Nichts ist dem Menschen nützlicher als der Mensch", "enonce_de": "Nichts ist dem Menschen nützlicher als der Mensch; von der Vernunft geleitete Menschen erstreben nichts für sich, was sie nicht auch für die anderen begehren.", "body_de": "## Bei Lordon\n\nAnm. 147 und 155. Der erste Satz beleuchtet die Arbeitsteilung, „das Beste, was die Menschen haben“ (42.2; T047); der zweite liefert „die höchste Formel des Kommunismus“, die Nichtrivalität der wahren Güter (43.1; T048).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« rien n’est plus utile à l’homme que l’homme »", "loc": ["42.2", "43.1"], "depends_on": [], "contre": [], "ethique": ["4p18sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 147 et 155. La première formule éclaire la division du travail, « ce que les hommes ont de meilleur » (42.2 ; T047) ; la seconde donne « la formule la plus haute du communisme », la non-rivalité des vrais biens (43.1 ; T048).", "body_en": "## In Lordon\n\nNotes 147 and 155. The first phrase sheds light on the division of labour, \"the best that men have\" (42.2; T047); the second gives \"the highest formula of communism\", the non-rivalry of true goods (43.1; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047", "T048"], "corollaires": [], "mtime": 1794593716.2130382}, {"id": "S35", "file": "premisses/S35.md", "type": "spinoza", "partie": "P", "titre": "La joie de se considérer soi-même", "enonce": "La joie de considérer sa propre puissance se renouvelle chaque fois qu'on considère ses vertus : chacun s'empresse donc de raconter ses hauts faits et d'étaler ses forces, et c'est pourquoi les hommes sont pénibles les uns aux autres.", "titre_en": "The joy of contemplating oneself", "enonce_en": "The joy of contemplating one's own power is renewed each time one contemplates one's virtues: so everyone is eager to tell of his deeds and display his strength, which is why men are troublesome to one another.", "titre_de": "Die Freude, sich selbst zu betrachten", "enonce_de": "Die Freude, die eigene Macht zu betrachten, erneuert sich jedes Mal, wenn man seine Tugenden betrachtet: Daher ist jeder begierig, seine Taten zu erzählen und seine Stärke zur Schau zu stellen, weshalb die Menschen einander lästig sind.", "body_de": "## Bei Lordon\n\nAnm. 148. Lordon führt den Gedanken „über das hinaus, was er wörtlich sagt“: Lästig ist auch die individuelle Vereinnahmung der extrinsischen Freuden gemeinsamen Handelns (42.2; T047).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« chacun s’empresse de raconter ses faits et gestes et d’étaler ostensiblement ses forces physiques et morales ; c’est pour cette raison aussi que les hommes sont pénibles les uns aux autres »", "loc": ["42.2"], "depends_on": [], "contre": [], "ethique": ["3p55c1sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 148. Lordon prolonge le propos « au-delà de ce qu'il dit textuellement » : le pénible est aussi la captation individuelle des joies extrinsèques de l'action collective (42.2 ; T047).", "body_en": "## In Lordon\n\nNote 148. Lordon extends the point \"beyond what it literally says\": what is troublesome is also the individual capture of the extrinsic joys of collective action (42.2; T047).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047"], "corollaires": [], "mtime": 1794593716.2130382}, {"id": "S36", "file": "premisses/S36.md", "type": "spinoza", "partie": "P", "titre": "Le vrai bien est commun", "enonce": "Le bien que désire pour soi celui qui suit la vertu, il le désirera aussi pour les autres ; les hommes, en tant qu'ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes.", "titre_en": "The true good is common", "enonce_en": "The good that whoever follows virtue desires for himself, he will also desire for others; men, insofar as they live under the guidance of reason, are supremely useful to men.", "titre_de": "Das wahre Gut ist gemeinsam", "enonce_de": "Das Gut, das jeder, der der Tugend folgt, für sich begehrt, wird er auch für die anderen begehren; die Menschen sind, insofern sie unter der Leitung der Vernunft leben, den Menschen höchst nützlich.", "body_de": "## Bei Lordon\n\nAnm. 153. Das wahre Gut ist das, von dem wir wünschen müssen, dass die anderen es zugleich mit uns besitzen, wie die Vernunft: Es ist „vielleicht die Definition des wahren Kommunismus“ (42.4; T048).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« les hommes, en tant qu’ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes »", "loc": ["42.4"], "depends_on": [], "contre": [], "ethique": ["4p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 153. Le vrai bien est celui dont il faut souhaiter que les autres le possèdent en même temps que soi, comme la raison : c'est « peut-être la définition du communisme véritable » (42.4 ; T048).", "body_en": "## In Lordon\n\nNote 153. The true good is the one we must wish others to possess at the same time as ourselves, like reason: it is \"perhaps the definition of true communism\" (42.4; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794593716.2145905}, {"id": "S37", "file": "premisses/S37.md", "type": "spinoza", "partie": "P", "titre": "Prendre les hommes tels qu'ils sont", "enonce": "En politique, il faut prendre les hommes tels qu'ils sont et non tels qu'on voudrait qu'ils soient, sous peine de n'écrire qu'une chimère bonne pour l'île d'Utopie.", "titre_en": "Taking men as they are", "enonce_en": "In politics, men must be taken as they are and not as one would wish them to be, on pain of writing only a chimera fit for the island of Utopia.", "titre_de": "Die Menschen nehmen, wie sie sind", "enonce_de": "In der Politik muss man die Menschen nehmen, wie sie sind, und nicht, wie man sie haben möchte, sonst schreibt man nur eine Chimäre, die auf die Insel Utopia passt.", "body_de": "## Bei Lordon\n\nAnm. 150-151. Lordon liest darin die spinozistische Fassung der materialistischen Tugend nach Althusser: „sich keine Geschichten mehr erzählen“ (42.4). Der *Politische Traktat* wird schon in 23.3 so zitiert (Anm. 72).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« tels qu’ils sont et non tels qu’ [on] voudrait qu’ils fussent »", "loc": ["23.3", "42.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 150-151. Lordon y lit la version spinoziste de la vertu matérialiste selon Althusser : « ne plus se raconter d'histoires » (42.4). Le *Traité politique* est déjà cité ainsi en 23.3 (note 72).", "body_en": "## In Lordon\n\nNotes 150-151. Lordon reads in it the Spinozist version of materialist virtue according to Althusser: \"no longer telling oneself stories\" (42.4). The *Political Treatise* is already quoted this way in 23.3 (note 72).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2145905}, {"id": "S38", "file": "premisses/S38.md", "type": "spinoza", "partie": "P", "titre": "Cultiver la vie ou éviter la mort", "enonce": "Une Cité qui ne tient ses sujets que par la crainte mérite le nom de solitude plutôt que de Cité ; une multitude conduite par l'espoir s'applique à cultiver la vie, une multitude soumise par la crainte, seulement à éviter la mort.", "titre_en": "Cultivating life or avoiding death", "enonce_en": "A Commonwealth that holds its subjects only by fear deserves the name of solitude rather than Commonwealth; a multitude led by hope strives to cultivate life, a multitude subdued by fear only to avoid death.", "titre_de": "Das Leben pflegen oder den Tod meiden", "enonce_de": "Ein Gemeinwesen, das seine Untertanen nur durch Furcht hält, verdient eher den Namen einer Einöde als den eines Gemeinwesens; eine von Hoffnung geleitete Menge strebt danach, das Leben zu pflegen, eine durch Furcht unterworfene nur danach, den Tod zu meiden.", "body_de": "## Bei Lordon\n\nAnm. 157-158. Lordon stellt das Wort „Einöde“ aus der Übersetzung von Appuhn wieder her. So „werden die verschiedenen Regime des kollektiven leidenschaftlichen Lebens geordnet“: nicht nach der Lockerung der Knechtschaft, sondern nach dem mehr oder weniger erfreuenden Spiel ihrer institutionellen Formen (43.2; T049).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’une s’applique à cultiver la vie, l’autre seulement à éviter la mort »", "loc": ["43.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 4 et V, 6", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 157-158. Lordon restitue le mot « solitude » de la traduction d'Appuhn. C'est par là que « se hiérarchisent les différents régimes de la vie passionnelle collective » : non par le relâchement de la servitude, mais par le jeu plus ou moins réjouissant de leurs formes institutionnelles (43.2 ; T049).", "body_en": "## In Lordon\n\nNotes 157-158. Lordon restores the word \"solitude\" from Appuhn's translation. This is how \"the different regimes of collective passional life are ranked\": not by the loosening of bondage, but by the more or less gladdening play of their institutional forms (43.2; T049).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "S39", "file": "premisses/S39.md", "type": "spinoza", "partie": "P", "titre": "Le conatus n'exclut ni conflits ni haines", "enonce": "Le droit naturel, qui s'étend aussi loin que la puissance de chacun, n'exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni rien de ce que l'appétit conseille.", "titre_en": "The conatus excludes neither conflicts nor hatreds", "enonce_en": "Natural right, which extends as far as each one's power, excludes neither conflicts, nor hatreds, nor anger, nor deceit, nor anything appetite advises.", "titre_de": "Der Conatus schließt weder Konflikte noch Hass aus", "enonce_de": "Das natürliche Recht, das so weit reicht wie die Macht jedes Einzelnen, schließt weder Konflikte noch Hass noch Zorn noch List noch irgendetwas aus, was die Begierde rät.", "body_de": "## Bei Lordon\n\nAnm. 161. Lordon fügt hinzu, dass Spinoza bemerkt: Wären die Menschen Weise, von der Vernunft geleitet, so bräuchten sie weder Gesetze noch politische Institutionen; doch sie sind es nicht (43.3). Daher die Unmöglichkeit einer endgültigen Ausrottung der Gewalt, von der Marx träumte (43.3; T048).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« n’exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni absolument rien de ce que l’appétit conseille »", "loc": ["43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, II, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 161. Lordon ajoute que Spinoza fait remarquer que, si les hommes étaient des sages, conduits par la raison, ils n'auraient besoin ni de lois ni d'institutions politiques ; mais ils ne le sont pas (43.3). D'où l'impossibilité d'une éradication définitive de la violence, que rêvait Marx (43.3 ; T048).", "body_en": "## In Lordon\n\nNote 161. Lordon adds that Spinoza remarks that if men were sages, guided by reason, they would need neither laws nor political institutions; but they are not (43.3). Hence the impossibility of a definitive eradication of violence, which Marx dreamed of (43.3; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "S40", "file": "premisses/S40.md", "type": "spinoza", "partie": "P", "titre": "La démocratie, État absolu en tout", "enonce": "La démocratie est le troisième type d'État, « absolu en tout » (*omnino absolutum imperium*).", "titre_en": "Democracy, the absolute State in every respect", "enonce_en": "Democracy is the third type of State, \"absolute in every respect\" (*omnino absolutum imperium*).", "titre_de": "Die Demokratie, der in jeder Hinsicht absolute Staat", "enonce_de": "Die Demokratie ist der dritte Typ des Staates, „in jeder Hinsicht absolut“ (*omnino absolutum imperium*).", "body_de": "## Bei Lordon\n\nAnm. 164. Lordon zitiert den ersten Satz von Kapitel XI des *Politischen Traktats*, das der Demokratie gewidmet ist und das Spinoza unvollendet ließ.\n\nEr dient ihm zum Abschluss des Buches. Alle Macht (*potestas*) stammt aus der Macht der Menge (*potentia multitudinis*), wird aber zugunsten des Souveräns abgelenkt (43.4). Von allen Regimen gibt allein die Demokratie der Menge ihre eigene Macht zurück (43.4).\n\nLordon betont, dass Spinoza seine Worte nicht leichthin wählt: Das Versprechen des „in jeder Hinsicht absoluten“ Staates ist das einer wieder souveränen Menge. Da das Kapitel unvollendet ist, bleibt der Gedanke „eine Art Öffnung, zugleich undurchsichtig und schwindelerregend“: An uns ist es herauszufinden, wie man ihn verwirklicht (43.4; T049).\n\nAnm. 163. Lordon räumt ein, hier den Gedanken eines Körpers aufzugreifen, der seine Macht zurückgewinnt, den er zuvor beiseitegelassen hatte. Seiner Ansicht nach ist das nicht widersprüchlich, denn hier geht es um den sozialen Körper, von seinen Mitgliedern aus gesehen: Für sie hat es weiterhin Sinn, eine gewisse Kontrolle über ihr gemeinsames Handeln zurückgewinnen zu wollen, das ihnen entgleitet.\n\nLordon schreibt *Omino absolutum imperium*; der lateinische Text lautet *omnino*.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« J’en viens enfin à ce troisième type d’État, absolu en tout, que nous appelons “démocratique” »", "loc": ["43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, XI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 164. Lordon cite la première phrase du chapitre XI du *Traité politique*, consacré à la démocratie, que Spinoza n'a pas achevé.\n\nIl s'en sert pour conclure le livre. Tout pouvoir (*potestas*) vient de la puissance de la multitude (*potentia multitudinis*), mais il en est détourné au profit du souverain (43.4). De tous les régimes, seule la démocratie rend à la multitude sa propre puissance (43.4).\n\nLordon souligne que Spinoza ne choisit pas ses mots à la légère : la promesse de l'État « absolu en tout », c'est celle d'une multitude de nouveau souveraine. Comme le chapitre est inachevé, cette idée reste « une sorte d'ouverture à la fois opaque et vertigineuse » : c'est à nous de chercher comment la réaliser (43.4 ; T049).\n\nNote 163. Lordon reconnaît qu'il reprend ici l'idée d'un corps qui retrouve sa puissance, idée qu'il avait écartée plus haut. Selon lui, ce n'est pas incohérent, parce qu'il s'agit ici du corps social, vu par ses membres : il garde un sens, pour eux, de vouloir reprendre en partie la maîtrise de leur action collective, qui leur échappe.\n\nLordon écrit *Omino absolutum imperium* ; le texte latin porte *omnino*.", "body_en": "## In Lordon\n\nNote 164. Lordon quotes the first sentence of chapter XI of the *Political Treatise*, devoted to democracy, which Spinoza left unfinished.\n\nHe uses it to conclude the book. All power (*potestas*) comes from the power of the multitude (*potentia multitudinis*), but it is diverted to the benefit of the sovereign (43.4). Of all regimes, only democracy gives the multitude back its own power (43.4).\n\nLordon stresses that Spinoza does not choose his words lightly: the promise of the State \"absolute in every respect\" is that of a multitude sovereign once again. Since the chapter is unfinished, the idea remains \"a kind of opening, both opaque and dizzying\": it is up to us to find out how to bring it about (43.4; T049).\n\nNote 163. Lordon acknowledges that he is taking up here the idea of a body recovering its power, which he had set aside earlier. In his view this is not inconsistent, because what is at stake here is the social body, seen by its members: it still makes sense for them to want to regain some control over their collective action, which escapes them.\n\nLordon writes *Omino absolutum imperium*; the Latin text reads *omnino*.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T001", "file": "theses/T001.md", "type": "these", "partie": "0", "titre": "Le pouvoir patronal est un effet de structure qui agit par les affects", "enonce": "Que certains hommes, les patrons, « puissent » en amener d'autres à entrer dans leur désir, ce pouvoir ne leur appartient pas : il est l'effet de la structure du rapport salarial. Mais les structures ne disent pas ce qui fait leur efficacité ; la réponse spinoziste est : les affects. D'où le programme du livre : combiner un structuralisme des rapports (Marx) et une anthropologie des passions (Spinoza).", "titre_en": "The employer's power is an effect of structure that acts through the affects", "enonce_en": "That some men, the bosses, \"can\" bring others to enter into their desire is a power that does not belong to them: it is the effect of the structure of the wage relation. But structures do not say what makes them effective; the Spinozist answer is: the affects. Hence the book's programme: to combine a structuralism of relations (Marx) with an anthropology of the passions (Spinoza).", "titre_de": "Die Macht des Arbeitgebers ist eine Wirkung der Struktur, die durch die Affekte wirkt", "enonce_de": "Dass manche Menschen, die Unternehmer, andere dazu bringen „können“, in ihr Begehren einzutreten, ist eine Macht, die ihnen nicht gehört: Sie ist die Wirkung der Struktur des Lohnverhältnisses. Doch die Strukturen sagen nicht, was sie wirksam macht; die spinozistische Antwort lautet: die Affekte. Daher das Programm des Buches: einen Strukturalismus der Verhältnisse (Marx) mit einer Anthropologie der Leidenschaften (Spinoza) zu verbinden.", "body_de": "## Argumentation\n\n1. La Boétie warnt, dass die Gewohnheit der Knechtschaft deren Bedingung aus dem Blick verlieren lässt: Gelungene Unterwerfungen trennen in der Vorstellung der Unterworfenen die traurigen Affekte von der Idee der Unterwerfung. So erstaunt die so erstaunliche Tatsache des Arbeitgebers niemanden mehr (01.2).\n2. Diese Macht gehört nicht den Unternehmern: Nach M01 ist sie die Wirkung einer Konfiguration sozialer Strukturen, des Lohnverhältnisses als doppelter Trennung (01.3).\n3. Die Strukturen herauszuarbeiten sagt noch nicht, „womit“ sie laufen: was sie *in concreto* wirksam macht, „nicht das Gespenst, sondern der Motor in der Maschine“. Die spinozistische Antwort lautet: die Affekte (01.4).\n4. „Das soziale Leben ist nur ein anderer Name für das kollektive leidenschaftliche Leben“: Unter sehr verschiedenen institutionellen Formen bleiben Affekte und Kräfte des Begehrens das *primum mobile*. Anzuerkennen, dass die Affekte strukturiert sind, verbietet daher nicht, das Problem der Lohnarbeit „durch die Leidenschaften“ wieder aufzunehmen (01.5). ∎\n\n## Anmerkung\n\nDas Vorwort beginnt mit Kant: Der Liberalismus gebietet, die Menschheit nie bloß als Mittel zu behandeln; die Lohnarbeit ist jene „großartige Begegnung zweier Freiheiten“, der der einen, die anderen zu gebrauchen, und der der anderen, sich gebrauchen zu lassen (01.1). Marx kommt nach Spinoza, doch es ist Spinoza, der helfen kann, ihn zu vervollständigen (01.4). Das Buch beansprucht nicht, der Psychologie oder Soziologie der Arbeit in ihrem eigenen Register etwas hinzuzufügen, sondern ihnen „einen abstrakteren Vorschlag“ zu machen (01.3).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["M01"], "citation": "« la proposition de combiner un structuralisme des rapports et une anthropologie des passions »", "loc": ["01.2", "01.3", "01.4", "01.5"], "depends_on": ["M01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La Boétie avertit que l'habitude de la servitude en fait perdre de vue la condition : les asservissements réussis coupent, dans l'imagination des asservis, les affects tristes de l'idée de l'asservissement. Ainsi le fait patronal, très étonnant, n'étonne plus personne (01.2).\n2. Ce pouvoir n'appartient pas aux patrons : par M01, il est l'effet d'une configuration de structures sociales, le rapport salarial comme double séparation (01.3).\n3. Dégager les structures ne dit pas encore « à quoi » elles fonctionnent : ce qui fait *in concreto* leur efficacité, « non pas le fantôme mais le moteur dans la machine ». La réponse spinoziste est : les affects (01.4).\n4. « La vie sociale n'est que l'autre nom de la vie passionnelle collective » : sous des formes institutionnelles très diverses, affects et forces de désir restent le *primum mobile*. Reconnaître que les affects sont structurés n'interdit donc pas de reprendre le problème salarial « par les passions » (01.5). ∎\n\n## Scolie\n\nL'avant-propos s'ouvre sur Kant : le libéralisme commande de ne jamais traiter l'humanité simplement comme un moyen ; le salariat est cette « magnifique rencontre de deux libertés », celle des uns d'utiliser les autres et celle des autres de se laisser utiliser (01.1). Marx est postérieur à Spinoza, mais c'est Spinoza qui peut aider à le compléter (01.4). Le livre ne prétend pas ajouter à la psychologie ou à la sociologie du travail dans leur registre, mais leur faire « une proposition plus abstraite » (01.3).", "body_en": "## Argument\n\n1. La Boétie warns that the habit of servitude makes one lose sight of its condition: successful subjugations cut off, in the imagination of the subjugated, the sad affects from the idea of subjugation. So the employer fact, so astonishing, no longer astonishes anyone (01.2).\n2. This power does not belong to the bosses: by M01, it is the effect of a configuration of social structures, the wage relation as a double separation (01.3).\n3. Bringing out the structures does not yet say \"on what\" they run: what makes them effective *in concreto*, \"not the ghost but the engine in the machine\". The Spinozist answer is: the affects (01.4).\n4. \"Social life is only another name for collective passional life\": under very diverse institutional forms, affects and forces of desire remain the *primum mobile*. Recognising that affects are structured does not therefore forbid taking up the wage problem again \"through the passions\" (01.5). ∎\n\n## Scholium\n\nThe foreword opens with Kant: liberalism commands never to treat humanity merely as a means; wage labour is that \"magnificent encounter of two freedoms\", that of some to use others and that of the others to let themselves be used (01.1). Marx comes after Spinoza, but it is Spinoza who can help complete him (01.4). The book does not claim to add to the psychology or sociology of work in their own register, but to make them \"a more abstract proposal\" (01.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["M01"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["M01"], "mentions": ["M01"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T002", "file": "theses/T002.md", "type": "these", "partie": "0", "titre": "Les dominés heureux et le triangle de l'engagement pour autrui", "enonce": "Le capitalisme contemporain produit des salariés contents, qui déconcertent une idée trop simple de la domination ; faute de demander ce que consentir veut dire, on se rabat sur la « servitude volontaire ». Il faut plutôt partir du triangle élémentaire : le désir d'un, la puissance d'agir des autres, et les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre.", "titre_en": "The happy dominated and the triangle of commitment to others", "enonce_en": "Contemporary capitalism produces contented employees, who baffle an overly simple idea of domination; for want of asking what consenting means, one falls back on \"voluntary servitude\". One should rather start from the elementary triangle: the desire of one, the power of acting of others, and the affects, produced by the structures of the wage relation, that determine their encounter.", "titre_de": "Die glücklichen Beherrschten und das Dreieck des Engagements für andere", "enonce_de": "Der heutige Kapitalismus bringt zufriedene Angestellte hervor, die eine zu einfache Vorstellung von Herrschaft verwirren; weil man nicht fragt, was Zustimmen heißt, greift man auf die „freiwillige Knechtschaft“ zurück. Man sollte eher vom elementaren Dreieck ausgehen: dem Begehren des einen, der Handlungsmacht der anderen und den von den Strukturen des Lohnverhältnisses hervorgebrachten Affekten, die ihre Begegnung bestimmen.", "body_de": "## Argumentation\n\n1. Nach T001 muss die Lohnarbeit durch die Leidenschaften wieder aufgenommen werden. Dann aber muss man ungleichartige Tatsachen zusammenhalten: zur Arbeit gehen, um nicht zu verkümmern, sich durch seine Freuden als Konsument entschädigen, sein Leben in der Arbeit versenken, mit Begeisterung zustimmen, eines Tages in die Revolte umschlagen (01.5).\n2. Die leidenschaftliche Landschaft des heutigen Kapitalismus ist weit reicher als zu Marx' Zeiten. Die Führungskräfte, „materiell auf der Seite der Arbeit und symbolisch auf der Seite des Kapitals“, sind der Prototyp des zufriedenen Angestellten, während der Kapitalismus *zugleich* zum brutalsten Zwang zurückfällt. Eine zu einfache Vorstellung von Herrschaft ist „verwirrt vom Schauspiel der glücklichen Beherrschten“ (01.6-01.7).\n3. Weil man nicht fragt, was Zustimmen heißt, erschüttern die Tatsachen der „Zustimmung“ die Begriffe der Ausbeutung, der Entfremdung und der Herrschaft, und man wiederholt die Formel der freiwilligen Knechtschaft (R01), ein anregendes Oxymoron, aber für die Theorie untauglich (01.8).\n4. Mobilisiert, widerwillig oder aufsässig zu sein, sind ebenso viele Weisen, als Angestellter affiziert zu sein, das heißt bestimmt, in ein Begehren einzutreten, das nicht zuerst das eigene ist. Das Rätsel des Engagements für andere liegt im Dreieck aus dem Begehren des einen, der Handlungsmacht der anderen und den Affekten, die ihre Begegnung regieren (01.9). ∎\n\n## Anmerkung\n\nLordon würdigt die Arbeiten der von Bourdieu ausgehenden Soziologie, deren symbolische Gewalt auf diese Verschränkung von Herrschaft und Zustimmung zielte (01.7); die Beherrschten zufrieden zu halten ist einer der ältesten Kniffe der Regierungskunst. Ziel ist es, den Kapitalismus zu „diskutieren“, im doppelten Sinn von Kritik und Analyse, in der Hoffnung, dass er in „die Region des Überwindbaren“ eintritt (01.9). Kapitel 1 gibt den Ecken des Dreiecks Namen: Herrenbegehren (D03), Einspannung (D02); die Frage der Zustimmung ist Gegenstand von Kapitel 2.", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["R01", "T001"], "citation": "« le désir d’un, la puissance d’agir des autres, les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre »", "loc": ["01.5", "01.6", "01.7", "01.8", "01.9"], "depends_on": ["T001"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T001, il faut reprendre le salariat par les passions. Or il faut alors tenir ensemble des faits disparates : aller au travail pour ne pas dépérir, être racheté par ses plaisirs de consommateur, engloutir sa vie au travail, adhérer avec enthousiasme, basculer un jour dans la révolte (01.5).\n2. Le paysage passionnel du capitalisme contemporain est bien plus riche qu'au temps de Marx. Les cadres, « matériellement du côté du travail et symboliquement du côté du capital », sont le prototype du salariat content, alors même que le capitalisme régresse *aussi* vers la coercition la plus brutale. Une idée trop simple de la domination est « déconcertée au spectacle des dominés heureux » (01.6-01.7).\n3. Faute de demander ce que consentir veut dire, les faits de « consentement » déstabilisent les concepts d'exploitation, d'aliénation et de domination, et l'on ressasse la formule de la servitude volontaire (R01), oxymore suggestif mais impropre à la théorie (01.8).\n4. Être mobilisé, réticent ou révolté, ce sont autant de manières d'être affecté comme salarié, c'est-à-dire déterminé à entrer dans un désir qui n'est pas d'abord le sien. Le mystère de l'engagement pour autrui se loge dans le triangle du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre (01.9). ∎\n\n## Scolie\n\nLordon reconnaît le travail de la sociologie héritière de Bourdieu, dont la violence symbolique visait ce croisement de la domination et du consentement (01.7) ; rendre les dominés contents est l'une des plus vieilles ficelles de l'art de régner. Le but est de « discuter » le capitalisme, au double sens de la critique et de l'analyse, avec l'espoir qu'il entre « dans la région du dépassable » (01.9). Le chapitre 1 donne leurs noms aux sommets du triangle : désir-maître (D03), enrôlement (D02) ; la question du consentement est l'objet du chapitre 2.", "body_en": "## Argument\n\n1. By T001, wage labour must be taken up again through the passions. But one must then hold together disparate facts: going to work so as not to waste away, being redeemed by one's pleasures as a consumer, sinking one's life into work, adhering with enthusiasm, tipping over one day into revolt (01.5).\n2. The passional landscape of contemporary capitalism is far richer than in Marx's time. Managers, \"materially on the side of labour and symbolically on the side of capital\", are the prototype of the contented employee, even as capitalism *also* regresses towards the most brutal coercion. An overly simple idea of domination is \"baffled at the spectacle of the happy dominated\" (01.6-01.7).\n3. For want of asking what consenting means, the facts of \"consent\" destabilise the concepts of exploitation, alienation and domination, and one harps on the formula of voluntary servitude (R01), a suggestive oxymoron but unfit for theory (01.8).\n4. Being mobilised, reluctant or rebellious are so many ways of being affected as an employee, that is, determined to enter into a desire that is not first one's own. The mystery of commitment to others lodges in the triangle of the desire of one, the power of acting of others and the affects that govern their encounter (01.9). ∎\n\n## Scholium\n\nLordon acknowledges the work of the sociology descended from Bourdieu, whose symbolic violence aimed at this crossing of domination and consent (01.7); keeping the dominated content is one of the oldest tricks of the art of ruling. The aim is to \"discuss\" capitalism, in the double sense of critique and analysis, in the hope that it enters \"the region of the surpassable\" (01.9). Chapter 1 gives names to the vertices of the triangle: master-desire (D03), enlistment (D02); the question of consent is the subject of chapter 2.", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["R01", "T001"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["R01", "T001"], "mentions": ["D02", "D03", "R01", "T001"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T003", "file": "theses/T003.md", "type": "these", "partie": "1", "titre": "Le désir de faire est légitime, non le désir de faire faire", "enonce": "Au sens du conatus, la liberté d'entreprendre est la liberté de désirer, irréfragable sous les restrictions que fixe chaque société. Mais cette légitimité ne s'étend pas au désir de faire faire : dès qu'une entreprise enrôle d'autres puissances d'agir, se pose la question politique de la participation à son organisation et de l'appropriation de ses produits, celle de la capture par un désir-maître.", "titre_en": "The desire to do is legitimate, not the desire to have others do", "enonce_en": "In the sense of the conatus, freedom of enterprise is the freedom to desire, irrefutable under the restrictions each society sets. But this legitimacy does not extend to the desire to have others do: as soon as an enterprise enlists other powers of acting, there arises the political question of participation in its organisation and of the appropriation of its products, that of capture by a master-desire.", "titre_de": "Das Begehren zu tun ist legitim, nicht das Begehren, tun zu lassen", "enonce_de": "Im Sinne des Conatus ist die Unternehmensfreiheit die Freiheit zu begehren, unwiderlegbar innerhalb der Grenzen, die jede Gesellschaft setzt. Doch diese Legitimität erstreckt sich nicht auf das Begehren, andere tun zu lassen: Sobald ein Unternehmen andere Handlungsmächte einspannt, stellt sich die politische Frage der Beteiligung an seiner Organisation und der Aneignung seiner Erzeugnisse, die der Vereinnahmung durch ein Herrenbegehren.", "body_de": "## Argumentation\n\n1. Nach D01 heißt existieren begehren und tätig sein; *conor* bedeutet „unternehmen“. Die Geschichte grenzt die erlaubten Gegenstände des Begehrens ab; mit diesen Vorbehalten ist die Unternehmensfreiheit die des Conatus und genießt eine Selbstverständlichkeit *a priori* (03.1).\n2. Das Unternehmen als Begehren kann daher legitim in der ersten Person gedacht werden: „Ich will etwas tun“. Sehr gut, „aber er soll es selbst tun – wenn er kann“ (04.1).\n3. Die Arbeitsteilung, verbunden mit dem Ehrgeiz der Menschen, führt sie dazu, die meisten Begehren der Produktion gemeinsam zu verfolgen. Andere Mächte in sein Begehren einzubeziehen ist Einspannung (D02); hier entsteht das Lohnverhältnis (04.1).\n4. Diese Freiheit gilt nicht *a priori*: Die Zusammenarbeit wirft die Frage ihrer politischen Formen auf, die der Vereinnahmung durch das Subjekt des Herrenbegehrens (D03) (04.1). ∎\n\n## Anmerkung\n\nDer Unternehmer, der sich beklagt, man beschneide seine „Unternehmensfreiheit“, spricht nur von den Antrieben seines Conatus: „Ich habe ein Begehren, das der Arbeitsteilung entspricht, und man hindert mich, es zu verfolgen“ (03.1). In diesem Punkt gibt Lordon ihm recht: Auf die begehrende Verfassung jedes Wesens bezogen, „ist diese Freiheit unwiderlegbar“ (03.1).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D01", "D02", "D03"], "citation": "« la légitimité de son “envie de faire” ne s’étend pas à une envie de faire faire »", "loc": ["03.1", "04.1"], "depends_on": ["D01", "D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, exister, c'est désirer et s'activer ; *conor* signifie « entreprendre ». L'histoire délimite les objets de désir licites ; sous ces réserves, la liberté d'entreprendre est celle du conatus, et jouit d'une évidence *a priori* (03.1).\n2. L'entreprise, en tant que désir, se conçoit donc légitimement en première personne : « j'ai envie de faire quelque chose ». Fort bien, « mais qu'il le fasse lui-même – s'il le peut » (04.1).\n3. La division du travail, jointe à l'ambition des hommes, conduit à poursuivre la plupart des désirs de production collectivement. Embarquer d'autres puissances dans son désir, c'est l'enrôlement (D02) ; c'est là que naît le rapport salarial (04.1).\n4. Cette liberté-là n'est pas *a priori* : la collaboration pose la question de ses formes politiques, celle de la capture par le sujet du désir-maître (D03) (04.1). ∎\n\n## Scolie\n\nL'entrepreneur qui proteste qu'on bride sa « liberté d'entreprendre » ne parle que des élans de son conatus : « J'ai un désir conforme à la division du travail et on m'empêche de le poursuivre » (03.1). Sur ce point, Lordon lui donne raison : rapportée à la constitution désirante de chaque être, « cette liberté-là est irréfragable » (03.1).", "body_en": "## Argument\n\n1. By D01, to exist is to desire and to be active; *conor* means \"to undertake\". History delimits the licit objects of desire; under these reservations, freedom of enterprise is that of the conatus, and enjoys an *a priori* self-evidence (03.1).\n2. The enterprise, as desire, can therefore legitimately be conceived in the first person: \"I want to do something\". Very well, \"but let him do it himself – if he can\" (04.1).\n3. The division of labour, together with men's ambition, leads them to pursue most desires of production collectively. Bringing other powers into one's desire is enlistment (D02); this is where the wage relation is born (04.1).\n4. That freedom is not *a priori*: collaboration raises the question of its political forms, that of capture by the subject of the master-desire (D03) (04.1). ∎\n\n## Scholium\n\nThe entrepreneur who protests that his \"freedom of enterprise\" is being curbed speaks only of the impulses of his conatus: \"I have a desire in keeping with the division of labour and I am prevented from pursuing it\" (03.1). On this point, Lordon grants that he is right: related to the desiring constitution of each being, \"that freedom is irrefutable\" (03.1).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D01", "D02", "D03"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "D02", "D03"], "mentions": ["D01", "D02", "D03"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T004", "file": "theses/T004.md", "type": "these", "partie": "1", "titre": "Le salariat est un cas du patronat, dont le problème est la mobilisation", "enonce": "L'enrôlement au service d'un désir-maître se rencontre bien au-delà de l'entreprise capitaliste : le salariat n'en est qu'un cas. Tout patronat doit faire se mouvoir des corps au service d'un désir qui n'est pas le leur ; la mobilisation est sa préoccupation constitutive, et la méthode du patronat capitaliste est d'abord l'argent.", "titre_en": "Wage labour is a case of bosshood, whose problem is mobilisation", "enonce_en": "Enlistment in the service of a master-desire is found well beyond the capitalist firm: wage labour is only one case of it. Every bosshood must get bodies moving in the service of a desire that is not theirs; mobilisation is its constitutive concern, and the method of capitalist bosshood is first of all money.", "titre_de": "Die Lohnarbeit ist ein Fall des Patronats, dessen Problem die Mobilisierung ist", "enonce_de": "Einspannung im Dienst eines Herrenbegehrens findet sich weit über das kapitalistische Unternehmen hinaus: Die Lohnarbeit ist nur ein Fall davon. Jedes Patronat muss Körper im Dienst eines Begehrens in Bewegung setzen, das nicht das ihre ist; Mobilisierung ist seine konstitutive Sorge, und das Mittel des kapitalistischen Patronats ist zuerst das Geld.", "body_de": "## Argumentation\n\n1. Nach D05 ist das Lohnverhältnis ein Verhältnis der Einspannung; nach D04 ist Patronat im allgemeinen Sinn jedes Verhältnis, unter dem ein Herrenbegehren eingespannte Mächte mobilisiert (04.2).\n2. Dieses Verhältnis findet sich beim Kriegsherrn, beim Kreuzritter, beim Souverän, beim Leiter einer NGO, beim akademischen Mandarin, beim Künstler: Alle vereinnahmen die Anstrengung ihrer Untergebenen (04.2).\n3. Vereinnahmen setzt In-Bewegung-Setzen voraus. Dass Menschen „bereit sind“, sich für ein Begehren zu betätigen, das nicht das ihre ist, ist sehr seltsam; nur die Gewohnheit lässt die ungeheure soziale Arbeit vergessen, die nötig ist, um das „Sich-für-andere-Bewegen“ hervorzubringen (05.1).\n4. Jedes Patronat hat seine Mittel; das des kapitalistischen Patronats ist *zuerst* das Geld (05.1). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D04", "D05"], "citation": "", "loc": ["04.2", "05.1"], "depends_on": ["D04", "D05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D05, le rapport salarial est un rapport d'enrôlement ; par D04, le patronat au sens général est tout rapport sous lequel un désir-maître mobilise des puissances enrôlées (04.2).\n2. Ce rapport se retrouve chez le chef de guerre, le croisé, le souverain, le dirigeant d'ONG, le mandarin universitaire, l'artiste : tous captent l'effort de leurs subordonnés (04.2).\n3. Capter suppose de mettre en mouvement. Que des personnes « acceptent » de s'activer pour un désir qui n'est pas le leur est très étrange ; seule l'habitude fait oublier l'immense travail social requis pour produire du « se mouvoir pour autrui » (05.1).\n4. Chaque patronat a ses méthodes ; celle du patronat capitaliste est *d'abord* l'argent (05.1). ∎", "body_en": "## Argument\n\n1. By D05, the wage relation is a relation of enlistment; by D04, bosshood in the general sense is any relation under which a master-desire mobilises enlisted powers (04.2).\n2. This relation is found in the warlord, the crusader, the sovereign, the NGO director, the academic mandarin, the artist: all capture the effort of their subordinates (04.2).\n3. Capturing presupposes setting in motion. That people \"agree\" to busy themselves for a desire that is not theirs is very strange; only habit makes one forget the immense social work required to produce \"moving for others\" (05.1).\n4. Each bosshood has its methods; that of capitalist bosshood is *first of all* money (05.1). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D04", "D05"], "sections": ["Argumentation"], "demo_refs": ["D04", "D05"], "mentions": ["D04", "D05"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T005", "file": "theses/T005.md", "type": "these", "partie": "1", "titre": "Tous les comportements sont intéressés", "enonce": "Le patronat fonctionne à l'intérêt, c'est-à-dire au désir. Puisque l'effort de persévérer n'est jamais poursuivi qu'en première personne, toute conduite, y compris le don, doit être dite intéressée, au sens large d'un intérêt qui n'est pas le calcul.", "titre_en": "All behaviour is interested", "enonce_en": "Bosshood runs on interest, that is, on desire. Since the striving to persevere is only ever pursued in the first person, all conduct, including the gift, must be called interested, in the broad sense of an interest that is not calculation.", "titre_de": "Jedes Verhalten ist interessiert", "enonce_de": "Das Patronat läuft mit dem Interesse, das heißt mit dem Begehren. Da das Streben, im Sein zu verharren, immer nur in der ersten Person verfolgt wird, muss jedes Verhalten, auch die Gabe, interessiert heißen, im weiten Sinn eines Interesses, das kein Kalkül ist.", "body_de": "## Argumentation\n\n1. Nach D06 ist das Interesse der Gegenstand des Begehrens unter anderem Namen; bei der begehrenden Wesensart des Menschen (D01) ist daher sein ganzes Verhalten interessiert (05.2).\n2. Vom reinen Altruismus bleibt „nichts“, aber „alles“ von der Wärme der Beziehungen, wenn man sich weigert, das Interesse auf Kalkül zu verkürzen: Es gibt Interesse an der erwarteten Anerkennung einer Gabe, an der Hoffnung, wiedergeliebt zu werden, an symbolischen Gewinnen, in anderen Weisen als der ausdrücklichen Berechnung (05.2).\n3. Die Freunde der Uneigennützigkeit (R02) bestätigen die utilitaristische Verkürzung, die sie bekämpfen, indem sie das Wort Interesse ihrem Gegner überlassen (05.2).\n4. Der Conatus vereint die ganze Bandbreite der Interessen, vom ökonomischen bis zum moralischen, symbolischen und psychischen; die sozialen Verhältnisse des Kapitalismus schöpfen aus dieser Bandbreite weit mehr, als eine ökonomistische Lesart glaubt (05.2). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D01", "D06", "R02"], "citation": "« ce désir-intérêt au principe de toutes les servitudes »", "loc": ["05.2"], "depends_on": ["D06", "D01"], "contre": ["R02"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D06, l'intérêt est l'objet du désir sous un autre nom ; posée l'essence désirante de l'homme (D01), tous ses comportements sont donc intéressés (05.2).\n2. Il ne reste « rien » de l'altruisme pur, mais « tout » de la chaleur des relations, si l'on refuse de réduire l'intérêt au calcul : il y a de l'intérêt dans la reconnaissance escomptée d'un don, dans l'attente d'être aimé en retour, dans les profits symboliques, sur d'autres modes que le calcul explicite (05.2).\n3. Les amis du désintéressement (R02) valident la réduction utilitariste qu'ils combattent, en abandonnant le mot d'intérêt à l'adversaire (05.2).\n4. Le conatus unifie toute la gamme des intérêts, de l'économique au moral, au symbolique et au psychique ; les rapports sociaux du capitalisme puisent dans cette gamme bien plus largement que ne le croit une lecture économiciste (05.2). ∎", "body_en": "## Argument\n\n1. By D06, interest is the object of desire under another name; given man's desiring essence (D01), all his behaviour is therefore interested (05.2).\n2. \"Nothing\" remains of pure altruism, but \"everything\" of the warmth of relationships, if one refuses to reduce interest to calculation: there is interest in the expected recognition of a gift, in the hope of being loved in return, in symbolic profits, in modes other than explicit calculation (05.2).\n3. The friends of disinterestedness (R02) validate the utilitarian reduction they fight, abandoning the word interest to their opponent (05.2).\n4. The conatus unifies the whole range of interests, from the economic to the moral, the symbolic and the psychic; the social relations of capitalism draw on this range far more widely than an economistic reading believes (05.2). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D01", "D06", "R02"], "sections": ["Argumentation"], "demo_refs": ["D01", "D06", "R02"], "mentions": ["D01", "D06", "R02"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T006", "file": "theses/T006.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est d'abord une dépendance à l'argent", "enonce": "Dans une économie à travail divisé, la reproduction matérielle, la « vie nue », passe par l'argent, et le capitalisme ne naît qu'en fermant les dernières possibilités d'autoproduction. Le rapport salarial est donc d'abord un rapport de dépendance, où l'employeur détient les conditions de la reproduction du salarié ; l'argent, qui conditionne presque tous les autres désirs, devient l'objet d'un métadésir.", "titre_en": "The wage relation is first a dependence on money", "enonce_en": "In an economy with a division of labour, material reproduction, \"bare life\", goes through money, and capitalism is born only by closing off the last possibilities of self-production. The wage relation is therefore first a relation of dependence, in which the employer holds the conditions of the employee's reproduction; money, which conditions almost all other desires, becomes the object of a meta-desire.", "titre_de": "Das Lohnverhältnis ist zuerst eine Abhängigkeit vom Geld", "enonce_de": "In einer arbeitsteiligen Wirtschaft geht die materielle Reproduktion, das „nackte Leben“, über das Geld, und der Kapitalismus entsteht nur, indem er die letzten Möglichkeiten der Selbstversorgung verschließt. Das Lohnverhältnis ist daher zuerst ein Abhängigkeitsverhältnis, in dem der Arbeitgeber die Bedingungen der Reproduktion des Angestellten in der Hand hält; das Geld, das fast alle anderen Begehren bedingt, wird zum Gegenstand eines Metabegehrens.", "body_de": "## Argumentation\n\n1. Der Kapitalismus beginnt mit dem Grundbegehren (D07), das in einer arbeitsteiligen Wirtschaft über das Geld geht. Durch die ursprüngliche Akkumulation (M02) verschließt er die Selbstversorgung und treibt die materielle Heteronomie auf einen unerhörten Grad: Die vollständige Abhängigkeit von der marktförmigen Arbeitsteilung ist seine Möglichkeitsbedingung (06.1).\n2. Nach D05 erlaubt das Lohnverhältnis den einen, andere in ihr Unternehmen einzubeziehen; es ist nur möglich, indem es das Geld zum verbindlichen und ausschließlichen Durchgang des Grundbegehrens macht. Es ist zuerst ein Abhängigkeitsverhältnis, der ständige Hintergrund alles Übrigen (06.2).\n3. Die feineren „Ebenen“ (Aufstieg, Sozialisation, „Entfaltung“) können jederzeit zusammenbrechen und nur die materielle Abhängigkeit stehen lassen, den „rohen Hintergrund der Drohung, die auf das wieder nackte Leben fällt“ (06.2).\n4. Es gibt nur zwei Geldgeber, den Arbeitgeber und den Financier; für den Angestellten ist es der Arbeitgeber. Das Geld bedingt fast alle anderen Begehren: Es ist Spinozas „Inbegriff aller Güter“ (S02), Gegenstand eines Metabegehrens (06.3).\n5. Nach D08 ist dieses Begehren der subjektive Ausdruck des monetären sozialen Verhältnisses, dessen ganzes institutionelles Gerüst der marktförmigen Ökonomie des Begehrens einen ihrer stärksten Anziehungspunkte liefert (07.3). ∎\n\n## Anmerkung\n\nLordon sagt, er müsse an diese Selbstverständlichkeit erinnern, weil das Gerede von „Arbeitsbereicherung“, „partizipativem Management“ und „Selbstverwirklichung“ sie schließlich vergessen lässt (06.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D05", "D07", "D08", "M02", "S02"], "citation": "« le fond inamovible, l’arrière-plan permanent de tout ce qui pourra s’élaborer par là-dessus »", "loc": ["06.1", "06.2", "06.3", "07.3"], "depends_on": ["D07", "M02", "D05", "S02", "D08"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le capitalisme commence par le désir basal (D07), qui passe par l'argent dans une économie à travail divisé. Par l'accumulation primitive (M02), il ferme l'autoproduction et porte l'hétéronomie matérielle à un degré inouï : la dépendance intégrale à la division marchande du travail est sa condition de possibilité (06.1).\n2. Par D05, le rapport salarial permet à certains d'impliquer les autres dans leur entreprise ; il n'est possible qu'en faisant de l'argent le passage obligé et exclusif du désir basal. C'est d'abord un rapport de dépendance, fond permanent de tout le reste (06.2).\n3. Les « plans » plus raffinés (avancement, socialisation, « épanouissement ») peuvent à tout instant s'effondrer, et ne laisser debout que la dépendance matérielle, « fond brut de menace jetée sur la vie à nouveau nue » (06.2).\n4. Il n'y a que deux fournisseurs d'argent, l'employeur et le financier ; pour le salarié, c'est l'employeur. L'argent conditionne presque tous les autres désirs : c'est le « condensé de tous les biens » de Spinoza (S02), objet de métadésir (06.3).\n5. Par D08, ce désir est l'expression subjective du rapport social monétaire, dont toute l'armature institutionnelle fournit à l'économie marchande du désir l'un de ses attracteurs les plus puissants (07.3). ∎\n\n## Scolie\n\nLordon dit devoir rappeler cette évidence parce que les discours sur l'« enrichissement du travail », le « management participatif » et la « réalisation de soi » finissent par la faire oublier (06.2).", "body_en": "## Argument\n\n1. Capitalism begins with basic desire (D07), which goes through money in an economy with a division of labour. Through primitive accumulation (M02), it closes off self-production and carries material heteronomy to an unheard-of degree: complete dependence on the market division of labour is its condition of possibility (06.1).\n2. By D05, the wage relation allows some to involve others in their enterprise; it is possible only by making money the obligatory and exclusive passage of basic desire. It is first a relation of dependence, the permanent background of all the rest (06.2).\n3. The more refined \"planes\" (promotion, socialisation, \"fulfilment\") can collapse at any moment, leaving standing only material dependence, the \"raw background of threat cast over life once again bare\" (06.2).\n4. There are only two suppliers of money, the employer and the financier; for the employee, it is the employer. Money conditions almost all other desires: it is Spinoza's \"epitome of all goods\" (S02), the object of a meta-desire (06.3).\n5. By D08, this desire is the subjective expression of the monetary social relation, whose whole institutional framework provides the market economy of desire with one of its most powerful attractors (07.3). ∎\n\n## Scholium\n\nLordon says he must recall this obvious fact because the talk of \"job enrichment\", \"participative management\" and \"self-realisation\" ends up making it forgotten (06.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D05", "D07", "D08", "M02", "S02"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D05", "D07", "D08", "M02", "S02"], "mentions": ["D05", "D07", "D08", "M02", "S02"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T007", "file": "theses/T007.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est un rapport de domination", "enonce": "La dépendance au désir d'argent, dont les employeurs sont les seuls pourvoyeurs, fait du rapport salarial un rapport de domination. L'intensité d'une domination étant proportionnée à celle du désir dont le dominant tient la clé, il n'y a pas, dans le capitalisme, de plus puissante emprise que l'enrôlement salarial.", "titre_en": "The wage relation is a relation of domination", "enonce_en": "Dependence on the desire for money, of which employers are the only providers, makes the wage relation a relation of domination. Since the intensity of a domination is proportionate to that of the desire to which the dominant holds the key, there is in capitalism no more powerful hold than wage enlistment.", "titre_de": "Das Lohnverhältnis ist ein Herrschaftsverhältnis", "enonce_de": "Die Abhängigkeit vom Begehren nach Geld, dessen einzige Geber die Arbeitgeber sind, macht das Lohnverhältnis zu einem Herrschaftsverhältnis. Da die Stärke einer Herrschaft der des Begehrens entspricht, dessen Schlüssel der Herrschende hält, gibt es im Kapitalismus keinen mächtigeren Zugriff als die Einspannung durch Lohn.", "body_de": "## Beweis\n\n1. Nach T006 schöpft das In-Bewegung-Setzen lohnabhängiger Körper seine Energie aus der Fixierung des Begehrens auf das Geld, als dessen einzige Geber die Arbeitgeber eingesetzt sind (08.1).\n2. Nach D09 liegt Herrschaft vor, wenn ein Agent über einen anderen gehen muss, um Zugang zu seinem Gegenstand des Begehrens zu erhalten: Das Lohnverhältnis ist daher ein Herrschaftsverhältnis (08.1).\n3. Die Stärke der Herrschaft entspricht der Stärke des Begehrens des Beherrschten, dessen Schlüssel der Herrschende hält (08.1).\n4. Ist die materielle Heteronomie radikal, so bedingt das Geld alle anderen Begehren, und nach M03 muss man zuerst leben: Kein Begehren ist gebieterischer (08.1).\n5. Aus 2, 3 und 4: Kein Zugriff ist mächtiger als die Einspannung durch Lohn (08.1). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D09", "M03", "T006"], "citation": "« il n’y a pas plus impérieux que le désir d’argent, par conséquent pas de plus puissante emprise que celle de l’enrôlement salarial »", "loc": ["08.1"], "depends_on": ["D09", "T006", "M03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T006, la mise en mouvement des corps salariés tire son énergie de la fixation du désir sur l'argent, dont les employeurs sont établis comme seuls pourvoyeurs (08.1).\n2. Par D09, il y a domination quand un agent doit passer par un autre pour accéder à son objet de désir : le rapport salarial est donc un rapport de domination (08.1).\n3. L'intensité de la domination est proportionnée à l'intensité du désir du dominé dont le dominant détient la clé (08.1).\n4. Or, quand l'hétéronomie matérielle est radicale, l'argent conditionne tous les autres désirs, et par M03 il faut d'abord vivre : aucun désir n'est plus impérieux (08.1).\n5. De 2, 3 et 4 : nulle emprise n'est plus puissante que l'enrôlement salarial (08.1). ∎", "body_en": "## Demonstration\n\n1. By T006, the setting in motion of wage-earning bodies draws its energy from the fixation of desire on money, of which employers are established as the only providers (08.1).\n2. By D09, there is domination when an agent must go through another to gain access to its object of desire: the wage relation is therefore a relation of domination (08.1).\n3. The intensity of domination is proportionate to the intensity of the desire of the dominated to which the dominant holds the key (08.1).\n4. Now, when material heteronomy is radical, money conditions all other desires, and by M03 one must first live: no desire is more imperious (08.1).\n5. From 2, 3 and 4: no hold is more powerful than wage enlistment (08.1). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D09", "M03", "T006"], "sections": ["Démonstration"], "demo_refs": ["D09", "M03", "T006"], "mentions": ["D09", "M03", "T006"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T008", "file": "theses/T008.md", "type": "these", "partie": "1", "titre": "L'hétéronomie du désir", "enonce": "Le conatus est un élan sans direction définie, un « désir sans objet ». Ses objets lui sont tous désignés du dehors, par les affections qu'il rencontre, par la mémoire et l'association, par l'imitation des désirs d'autrui. Rien, dans la vie passionnelle, n'est de l'ordre d'une volonté autonome.", "titre_en": "The heteronomy of desire", "enonce_en": "The conatus is an impulse with no definite direction, a \"desire without an object\". Its objects are all designated to it from outside, by the affections it encounters, by memory and association, by the imitation of others' desires. Nothing in passional life is a matter of autonomous will.", "titre_de": "Die Heteronomie des Begehrens", "enonce_de": "Der Conatus ist ein Antrieb ohne bestimmte Richtung, ein „Begehren ohne Gegenstand“. Seine Gegenstände werden ihm alle von außen bezeichnet, durch die Affektionen, denen er begegnet, durch Gedächtnis und Verknüpfung, durch die Nachahmung des Begehrens anderer. Nichts im leidenschaftlichen Leben ist Sache eines autonomen Willens.", "body_de": "## Beweis\n\n1. Nach D01 ist der Conatus begehrende Kraft; ontologisch ist er reiner Antrieb ohne bestimmte Richtung, ein „Begehren ohne Gegenstand“ nach Laurent Bove (08.3).\n2. Nach S03 ist das Begehren das Wesen des Menschen, durch eine Affektion bestimmt, etwas zu tun: Eine vorausgehende Affektion gibt ihm Richtung und Gegenstand (08.3).\n3. Nach S04 zieht nicht das Begehrenswerte das Begehren an: Der Schub des Conatus besetzt die Dinge und setzt sie als Gegenstände des Begehrens ein. Die gewöhnliche Auffassung (R03) wird umgekehrt (08.3).\n4. Die elementare Folge ist: eine Affektion (was geschieht), ein Affekt (seine Wirkung, traurig oder freudig), der daraus folgende Drang zu handeln. Das Leben des Begehrens arbeitet sie durch Gedächtnis und Verknüpfung (S05) und durch die Nachahmung des Begehrens anderer (S06) aus, vor allem über soziale Vermittlungen (08.3).\n5. Begehren und Affekte sind daher zutiefst heteronom, Erzeugnisse von Begegnungen und von Dispositionen, die sich entlang sozialer Laufbahnen gebildet haben: nichts von einem autonomen Willen oder freier Selbstbestimmung (08.4). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D01", "R03", "S03", "S04", "S05", "S06"], "citation": "", "loc": ["08.3", "08.4"], "depends_on": ["D01", "S03", "S04", "S05", "S06"], "contre": ["R03"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par D01, le conatus est force désirante ; ontologiquement, il est pur élan sans direction définie, « désir sans objet » selon Laurent Bove (08.3).\n2. Par S03, le désir est l'essence de l'homme déterminée par une affection à faire quelque chose : c'est une affection antécédente qui lui donne direction et objet (08.3).\n3. Par S04, ce n'est pas le désirable qui attire le désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir. La conception ordinaire (R03) est renversée (08.3).\n4. La séquence élémentaire est : une affection (ce qui arrive), un affect (son effet, triste ou joyeux), l'envie de faire qui s'ensuit. La vie du désir l'élabore par la mémoire et l'association (S05), et par l'imitation des désirs d'autrui (S06), surtout à travers des médiations sociales (08.3).\n5. Le désir et les affects sont donc profondément hétéronomes, fruits des rencontres et des dispositions formées le long de trajectoires sociales : rien d'une volonté autonome ni d'une libre autodétermination (08.4). ∎", "body_en": "## Demonstration\n\n1. By D01, the conatus is desiring force; ontologically, it is pure impulse with no definite direction, a \"desire without an object\" according to Laurent Bove (08.3).\n2. By S03, desire is the essence of man determined by an affection to do something: it is a prior affection that gives it direction and object (08.3).\n3. By S04, it is not the desirable that attracts desire: it is the thrust of the conatus that invests things and institutes them as objects of desire. The ordinary conception (R03) is reversed (08.3).\n4. The elementary sequence is: an affection (what happens), an affect (its effect, sad or joyful), the urge to act that follows. The life of desire elaborates it through memory and association (S05), and through the imitation of others' desires (S06), above all through social mediations (08.3).\n5. Desire and the affects are therefore deeply heteronomous, products of encounters and of dispositions formed along social trajectories: nothing of an autonomous will or of free self-determination (08.4). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D01", "R03", "S03", "S04", "S05", "S06"], "sections": ["Démonstration"], "demo_refs": ["D01", "R03", "S03", "S04", "S05", "S06"], "mentions": ["D01", "R03", "S03", "S04", "S05", "S06"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T009", "file": "theses/T009.md", "type": "these", "partie": "1", "titre": "La servitude volontaire n'existe pas", "enonce": "On n'est pas asservi par défaut de volonté, mais par la nécessité et l'intensité d'un désir, que les structures configurent : dans l'hétéronomie matérielle, le désir de persévérer devient désir d'argent, puis désir d'emploi salarié. Les véritables chaînes sont nos affects et nos désirs : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle, et elle est universelle.", "titre_en": "Voluntary servitude does not exist", "enonce_en": "One is not enslaved by a lack of will, but by the necessity and intensity of a desire, which structures configure: in material heteronomy, the desire to persevere becomes desire for money, then desire for wage employment. Our real chains are our affects and our desires: voluntary servitude does not exist, there is only passional servitude, and it is universal.", "titre_de": "Freiwillige Knechtschaft gibt es nicht", "enonce_de": "Man ist nicht aus Mangel an Willen geknechtet, sondern durch die Notwendigkeit und Stärke eines Begehrens, das die Strukturen gestalten: In der materiellen Heteronomie wird das Begehren, im Sein zu verharren, zum Begehren nach Geld, dann zum Begehren nach Lohnarbeit. Unsere wirklichen Ketten sind unsere Affekte und unsere Begehren: Freiwillige Knechtschaft gibt es nicht, es gibt nur leidenschaftliche Knechtschaft, und sie ist allgemein.", "body_de": "## Beweis\n\n1. Das Lohnverhältnis legt das wirkliche Prinzip der Unterwerfung „in seiner Nacktheit“ offen: die Notwendigkeit und Stärke eines Begehrens (T007) (08.2).\n2. Dieses Begehren drängt sich nicht in der Weise freier Wahl auf. Nach T006 bestimmen die Strukturen der materiellen Heteronomie das Begehren, im Sein zu verharren, als Begehren nach Geld und dieses als Begehren nach Lohnarbeit; hier von freiwilliger Knechtschaft zu sprechen hieße, es auch von der Geisel zu sagen, die mit der Pistole an der Schläfe gehorcht (08.2).\n3. Das Beispiel der Lohnarbeit ist keine Ausnahme: Nach T008 ist die Heteronomie des Begehrens eine absolute Allgemeinheit (08.3-08.4).\n4. Nach S07 ist Knechtschaft die Ohnmacht, seine Affekte zu lenken; die zufällige Ordnung der Begegnungen und die Gesetze des affektiven Lebens machen den Menschen zu einem „leidenschaftlichen Automaten“ (08.4).\n5. Die Idee der freiwilligen Knechtschaft (R01) drückt die individualistische Weigerung gegenüber diesem Urteil der Heteronomie aus; Spinoza schlägt einen anderen Mechanismus der Entfremdung vor, durch Affekte und Begehren. Die Knechtschaft ist daher nicht freiwillig, sondern leidenschaftlich, und sie ist allgemein (08.4). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["R01", "S07", "T006", "T007", "T008"], "citation": "« La servitude volontaire n’existe pas. Il n’y a que la servitude passionnelle. Mais elle est universelle. »", "loc": ["08.2", "08.4"], "depends_on": ["T006", "T007", "T008", "S07"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le rapport salarial expose « dans sa nudité » le principe réel de l'asservissement : la nécessité et l'intensité d'un désir (T007) (08.2).\n2. Ce désir ne s'impose pas sur le mode du libre choix. Par T006, les structures de l'hétéronomie matérielle déterminent le désir de persévérer comme désir d'argent, et celui-ci comme désir d'emploi salarié ; parler ici de servitude volontaire, ce serait le dire aussi de l'otage qui obéit, un pistolet sur la tempe (08.2).\n3. L'exemple salarial n'est pas une exception : par T008, l'hétéronomie du désir est une absolue généralité (08.3-08.4).\n4. Par S07, la servitude est l'impuissance à diriger ses affects ; l'ordre fortuit des rencontres et les lois de la vie affective font de l'homme un « automate passionnel » (08.4).\n5. L'idée de servitude volontaire (R01) exprime le refus individualiste de ce verdict d'hétéronomie ; Spinoza propose un autre mécanisme de l'aliénation, par les affects et les désirs. La servitude n'est donc pas volontaire mais passionnelle, et elle est universelle (08.4). ∎", "body_en": "## Demonstration\n\n1. The wage relation exposes \"in its nakedness\" the real principle of enslavement: the necessity and intensity of a desire (T007) (08.2).\n2. This desire does not impose itself in the mode of free choice. By T006, the structures of material heteronomy determine the desire to persevere as desire for money, and the latter as desire for wage employment; to speak of voluntary servitude here would be to say it also of the hostage who obeys with a pistol to his temple (08.2).\n3. The wage example is no exception: by T008, the heteronomy of desire is an absolute generality (08.3-08.4).\n4. By S07, servitude is the powerlessness to govern one's affects; the fortuitous order of encounters and the laws of affective life make man a \"passional automaton\" (08.4).\n5. The idea of voluntary servitude (R01) expresses the individualist refusal of this verdict of heteronomy; Spinoza proposes another mechanism of alienation, through affects and desires. Servitude is therefore not voluntary b
