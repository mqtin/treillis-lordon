<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capitalisme, désir et servitude — treillis</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2ded5;
  --accent: #2f5d8a; --hl: #fff3c4;
  --definition: #3b6ea8; --spinoza: #6b5bb0; --marx: #2f8a5b; --these: #c0702a; --refutee: #b83a3a; --manquant: #9b9b9b;
  --ok: #2f8a5b; --warn: #b7791f; --err: #b83a3a;
  --band: rgba(0,0,0,.035); --gut: 30px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1f2023; --ink: #e8e6e1; --muted: #9a968d; --line: #33353a;
    --accent: #7fb0e0; --hl: #4a4220;
    --definition: #6d9fd6; --spinoza: #a294e0; --marx: #5fbf8b; --these: #e39a55; --refutee: #e07070; --manquant: #777;
    --band: rgba(255,255,255,.04);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

#app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.navbtn { border: 1px solid var(--line); background: none; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink); }
.navbtn:hover:not(:disabled) { background: var(--bg); }
.navbtn:disabled { opacity: .3; cursor: default; }
#nav { display: flex; gap: 4px; }
#trail { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font-size: 12px; flex: 1; }
#trail .step { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 4px; white-space: nowrap; color: var(--c, var(--muted)); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
#trail .step:hover { background: var(--bg); }
#trail .step.cur { background: var(--bg); outline: 1px solid var(--c, var(--line)); }
#trail .step.fwd { opacity: .45; }
#trail .step .tt { font-weight: 400; color: var(--muted); margin-left: 4px; }
#trail .arrow { color: var(--line); }
#trail .lbl { color: var(--muted); margin-right: 4px; white-space: nowrap; }
.seq { display: flex; gap: 6px; }
.seq a { font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; color: var(--muted); white-space: nowrap; }
.seq a:hover { color: var(--ink); border-color: var(--ink); }
.seq a.off { visibility: hidden; }

/* Barre latérale */
#side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#search { margin: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
#filters { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip.on { color: var(--ink); border-color: var(--ink); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#list { overflow: auto; flex: 1; padding: 4px 0 16px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 14px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--bg); border-left-color: var(--accent); }
.item .id { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.item .t { color: var(--ink); }
.item .snip { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .badge-err { color: var(--err); font-size: 11px; margin-left: 4px; }
mark { background: var(--hl); color: inherit; padding: 0 1px; }

/* Zone principale */
#main { display: grid; grid-template-columns: 1fr 6px var(--readerW, 44%); min-height: 0; min-width: 0; }
#main.reading { grid-template-columns: 0 0 1fr; }
#main.reading #graphwrap, #main.reading #resizer { display: none; }
#graphwrap { position: relative; min-width: 0; overflow: hidden; }
#graph { position: absolute; top: 0; bottom: 0; left: var(--gut); width: calc(100% - var(--gut)); height: 100%; display: block; cursor: grab; user-select: none; }
#graph.drag { cursor: grabbing; }
#toolbar { position: absolute; top: 10px; left: calc(var(--gut) + 10px); z-index: 3; display: flex; gap: 4px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
#toolbar button { border: 0; background: none; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--muted); }
#toolbar button:hover { background: var(--bg); color: var(--ink); }
#toolbar button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
#toolbar .sep { width: 1px; background: var(--line); margin: 2px 2px; }
#legend { position: absolute; bottom: 10px; left: calc(var(--gut) + 10px); z-index: 3; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - var(--gut) - 20px); }
#legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
#empty { position: absolute; inset: 0 0 0 var(--gut); display: none; align-items: center; justify-content: center; color: var(--muted); }
#resizer { cursor: col-resize; background: var(--line); opacity: .5; }
#resizer:hover { opacity: 1; }
#legend span.dash::before { height: 0; border-top: 2px dashed var(--c); background: none; vertical-align: 3px; }
/* Marge des parties (reprise de SpinozaGraph) : hors du graphe, ne recouvre jamais les nœuds */
#gutter { position: absolute; top: 0; bottom: 0; left: 0; width: var(--gut); background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; z-index: 2; }
.glabel { position: absolute; left: 3px; right: 3px; border-radius: 6px; background: var(--band); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.glabel:hover { border-color: var(--ink); }
.glabel span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; font-family: var(--serif); font-size: 12.5px; padding: 6px 0; }
.glabel b { font-weight: 700; }
.glabel i { color: var(--muted); }
.band { fill: var(--band); cursor: pointer; }
.band:hover { fill: var(--hl); fill-opacity: .25; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 6px 4px 0; }
.seg button { border: 0; border-right: 1px solid var(--line); background: none; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bg); color: var(--ink); font-weight: 600; }

/* Nœuds */
.node rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; }
.node .bar { fill: var(--c); stroke: none; }
.node text { fill: var(--ink); font-size: 12px; pointer-events: none; }
.node text.nid { font-weight: 700; fill: var(--c); }
.node { cursor: pointer; transition: opacity .15s; }
.node.missing rect { stroke-dasharray: 4 3; }
.node.st-brouillon rect { stroke-dasharray: none; }
.node.st-retire { opacity: .45; }
.node.sel rect { stroke-width: 3; fill: var(--hl); }
.node.dim { opacity: .18; }
.node .status { stroke: var(--panel); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .5; transition: opacity .15s; }
.edge.anc { stroke: var(--accent); stroke-width: 2.2; opacity: .95; }
.edge.desc { stroke: var(--these); stroke-width: 2.2; opacity: .95; }
.edge.dim { opacity: .07; }
.edge.missing { stroke-dasharray: 4 3; }
.edge.xpart { stroke-dasharray: 6 4; opacity: .35; }
.edge.contre { stroke: var(--refutee); stroke-dasharray: 2 4; stroke-width: 1.6; opacity: .7; }
.citation { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin: -10px 0 22px 19px; }
.citation .pg { font-style: normal; font-size: 12px; margin-left: 6px; }
#graph.m-all .edge.xpart:not(.anc):not(.desc) { display: none; }

/* Lecteur */
#reader { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); min-width: 0; }
#reader .inner { max-width: 760px; margin: 0 auto; padding: 24px 32px 80px; }
#reader .crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#reader .crumbs button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
#reader .crumbs button:hover { color: var(--ink); }
#reader h1.title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0 8px; line-height: 1.2; }
#reader h1.title .eid { color: var(--c); margin-right: 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.badge { font-size: 11px; border-radius: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--muted); }
.badge b { color: var(--ink); font-weight: 600; }
.badge.type { background: var(--c); color: #fff; border-color: var(--c); }
.enonce { font-family: var(--serif); font-size: 17px; line-height: 1.55; border-left: 3px solid var(--c); padding: 4px 0 4px 16px; margin: 0 0 22px; }
.rel { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 13px; padding: 14px 16px; background: var(--bg); border-radius: 8px; margin-bottom: 26px; }
.rel .k { color: var(--muted); }
.pill { display: inline-block; border: 1px solid var(--c, var(--line)); color: var(--c, var(--ink)); border-radius: 4px; padding: 0 6px; margin: 0 4px 4px 0; cursor: pointer; font-weight: 600; font-size: 12px; background: var(--panel); text-decoration: none; }
.pill:hover { background: var(--c); color: #fff; }
.pill.missing { --c: var(--err); border-style: dashed; }
.pill .pt { font-weight: 400; margin-left: 4px; }
.chain { margin: 0; padding: 0; list-style: none; }
.chain li { padding: 1px 0; }
.md { font-family: var(--serif); font-size: 16px; line-height: 1.65; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--sans); line-height: 1.3; }
.md h1 { font-size: 24px; }
.md h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.md h3 { font-size: 15px; margin: 22px 0 6px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.45; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-family: var(--sans); font-size: 13px; margin: 12px 0; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); }
.md blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md a.ref { font-family: var(--sans); font-size: .82em; font-weight: 700; text-decoration: none; border: 1px solid var(--c); color: var(--c); border-radius: 3px; padding: 0 4px; cursor: pointer; }
.md a.ref:hover { background: var(--c); color: #fff; }
.md .ref.missing { color: var(--err); border: 1px dashed var(--err); border-radius: 3px; padding: 0 4px; font-family: var(--sans); font-size: .82em; }
.sources { font-size: 13px; line-height: 1.5; padding-left: 0; list-style: none; }
.sources li { border-left: 3px solid var(--warn); padding: 6px 0 6px 12px; margin: 8px 0; }
.sources li.ok { border-left-color: var(--ok); }
.sources .flag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); }
.sources li.ok .flag { color: var(--ok); }
.sources .note { color: var(--muted); display: block; margin-top: 2px; }
.file { color: var(--muted); font-size: 12px; margin-top: 30px; font-family: ui-monospace, Consolas, monospace; }
.home h2 { font-family: var(--serif); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 16px 0 24px; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; border-top: 3px solid var(--c, var(--line)); }
.stat .n { font-size: 22px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; }
.audit h3 { font-size: 14px; margin: 22px 0 6px; display: flex; gap: 8px; align-items: center; }
.audit .count { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--bg); color: var(--muted); }
.audit .count.err { background: var(--err); color: #fff; }
.audit .count.warn { background: var(--warn); color: #fff; }
.audit .count.ok { background: var(--ok); color: #fff; }
.audit ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.alpha svg { width: 100%; max-width: 520px; display: block; margin: 8px auto 4px; }
.regimes table.grid { border-collapse: separate; border-spacing: 6px; width: 100%; margin: 10px 0 18px; }
.regimes .grid th { font: 600 12px/1.3 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px; }
.regimes .grid td { vertical-align: top; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); font-size: 14px; line-height: 1.5; width: 42%; }
.regimes .grid td.empty { color: var(--muted); font-style: italic; background: transparent; border-style: dashed; }
.regimes .grid td b { font-family: var(--serif); font-size: 16px; font-weight: 600; display: block; margin-bottom: 4px; }
.regimes .grid td.sad { border-left: 4px solid var(--refutee); }
.regimes .grid td.joy { border-left: 4px solid var(--these); }
.regimes ol.timeline { list-style: none; padding: 0; margin: 8px 0 18px; border-left: 2px solid var(--line); }
.regimes ol.timeline li { position: relative; padding: 2px 0 14px 18px; font-size: 14px; line-height: 1.55; }
.regimes ol.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); }
.regimes ol.timeline li b { font-family: var(--serif); font-size: 16px; }
.alpha svg text { fill: var(--ink); font-family: var(--serif); font-size: 15px; }
.alpha .ctl { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; flex-wrap: wrap; }
.alpha input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); }
.alpha .presets button { font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.alpha .read { font-family: var(--serif); font-size: 16px; border-left: 3px solid var(--accent); padding: 6px 0 6px 14px; margin: 12px 0; min-height: 3.2em; }
.alpha .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin-top: 4px; }
.alpha .bar > i { display: block; height: 100%; background: var(--these); }
.audit .hint { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
.kbd { font-family: ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>

    <div id="nav">

<script>
const DATA = {"generated": "2026-11-13 10:45", "elements": [{"id": "D01", "file": "definitions/D01.md", "type": "definition", "partie": "1", "titre": "Conatus, énergie du désir", "enonce": "Le conatus est la force d'exister, l'énergie qui met les corps en mouvement ; chez l'homme, c'est l'énergie du désir. Exister, c'est désirer, et donc s'activer à la poursuite de ses objets.", "citation": "", "loc": ["03.1"], "depends_on": ["S01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLecture de S01 (03.1). Le verbe *conor* signifie « entreprendre » au sens de « commencer » : comme l'*impetus*, le conatus désigne l'impulsion qui fait passer du repos au mouvement. Lordon laisse au commentaire ontologique la question de l'origine de cette énergie : « l'énergie du conatus, c'est la vie », et, « au plus près de Spinoza », l'énergie du désir.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S01"], "corollaires": [], "mtime": 1794561825.2533908}, {"id": "D02", "file": "definitions/D02.md", "type": "definition", "partie": "1", "titre": "Enrôlement", "enonce": "L'enrôlement est le fait de faire entrer des puissances d'agir tierces dans la poursuite de son propre désir. C'est la catégorie la plus générale, dont le salariat n'est qu'un cas.", "citation": "", "loc": ["04.1", "04.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe rapport salarial est « un rapport d'*enrôlement* » (04.1) ; « sous l'angle de la capture », l'enrôlement est la catégorie la plus générale (04.2). Les enrôlés sont des conatus (D01) dont l'effort est capté au service d'un autre.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794561825.2543838}, {"id": "D03", "file": "definitions/D03.md", "type": "definition", "partie": "1", "titre": "Désir-maître", "enonce": "Le désir-maître est le désir de celui qui enrôle, au service duquel sont mobilisées les puissances d'agir des enrôlés.", "citation": "", "loc": ["04.1", "04.2", "14.3"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe terme apparaît avec la question de la *capture* « par le sujet du désir-maître » (04.1). Le vocabulaire commun ne s'y trompe pas, qui appelle les désirs-maîtres des « directeurs » (14.3) : ils orientent les conatus enrôlés (D11).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794561825.2553847}, {"id": "D04", "file": "definitions/D04.md", "type": "definition", "partie": "1", "titre": "Patronat (au sens général)", "enonce": "Le patronat est le rapport sous lequel un désir-maître mobilise au service de son entreprise les puissances d'agir des enrôlés. En ce sens général, le patronat est un « capturat ».", "citation": "", "loc": ["04.2"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon nomme le genre d'après l'une de ses espèces (04.2). Exemples : le chef de guerre et sa conquête, le croisé et sa croisade, le souverain (dont la puissance est en fait celle de la multitude), le patron capitaliste et son profit, mais aussi le dirigeant d'ONG, le mandarin universitaire, l'artiste et ses aides. Tous captent l'effort (conatus) de subordonnés enrôlés (D02) au service d'un désir-maître (D03).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794561825.2563858}, {"id": "D05", "file": "definitions/D05.md", "type": "definition", "partie": "1", "titre": "Rapport salarial", "enonce": "Le rapport salarial est l'ensemble des données structurelles (la double séparation) et des codifications juridiques qui permettent à certains individus d'en impliquer d'autres dans la réalisation de leur propre entreprise. C'est un rapport d'enrôlement.", "citation": "", "loc": ["04.1"], "depends_on": ["M01", "D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Faire entrer des puissances d'agir tierces dans la poursuite de son désir industriel à soi, voilà l'essence du rapport salarial » (04.1). Il combine la structure marxienne (M01) et le concept général d'enrôlement (D02).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "M01"], "corollaires": [], "mtime": 1794561825.2563858}, {"id": "D06", "file": "definitions/D06.md", "type": "definition", "partie": "1", "titre": "Intérêt", "enonce": "L'intérêt est la prise de satisfaction, c'est-à-dire l'autre nom de l'objet du désir, dont il épouse l'infinie variété : *interesse sive appetitus*.", "citation": "« L’intérêt c’est la prise de satisfaction, c’est-à-dire l’autre nom de l’objet du désir »", "loc": ["05.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLa formule *interesse sive appetitus* est une paraphrase de Spinoza par Lordon : « on pourrait ici paraphraser Spinoza » (05.2). Elle refuse de réduire l'intérêt au calcul utilitariste : l'intérêt économique n'est qu'une forme historiquement construite, celle qui se réfléchit dans un compte en monnaie. Lordon renvoie à son *Intérêt souverain* (2006, note 5).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794562560.726071}, {"id": "D07", "file": "definitions/D07.md", "type": "definition", "partie": "1", "titre": "Désir basal", "enonce": "Le désir basal est le désir de la reproduction matérielle, celle de la « vie nue » : le désir qui conditionne tous les autres.", "citation": "", "loc": ["06.1", "09.1", "09.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Le capitalisme commence par l'argent. Ou plutôt la vie nue. La vie à reproduire » (06.1). Ce désir est vécu comme contrainte ou corvée, mais il reste conceptuellement un désir : il suffit de voir l'acharnement des hommes quand les objets de leur reproduction viennent à manquer (09.1). C'est le désir qui « conditionne tout mais compte pour rien » (09.4).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.258384}, {"id": "D08", "file": "definitions/D08.md", "type": "definition", "partie": "1", "titre": "Monnaie et argent", "enonce": "La monnaie est un rapport social : la croyance collective, produite et entretenue par des institutions, qui fait accepter un signe sans valeur intrinsèque comme moyen de paiement. L'argent est la monnaie saisie du côté des sujets : l'objet de désir que ce rapport fait naître.", "citation": "« L’argent, c’est la monnaie saisie du côté des sujets. »", "loc": ["07.1", "07.2", "07.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon prolonge Pepita Ould-Ahmed, qui voit dans les deux mots deux points de vue disciplinaires (07.1), et s'appuie sur Michel Aglietta et André Orléan pour la monnaie comme rapport social, de nature fiduciaire (07.2). Les deux points de vue doivent être tenus ensemble, comme Bourdieu récusait l'antinomie de l'objectivisme et du subjectivisme : les structures sont présentes dans les sujets sous forme de désirs et d'affects (07.3).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.258384}, {"id": "D09", "file": "definitions/D09.md", "type": "definition", "partie": "1", "titre": "Domination (premier sens)", "enonce": "Il y a domination quand un agent doit en passer par un autre pour accéder à son objet de désir.", "citation": "", "loc": ["08.1", "33.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Si le premier sens de la domination consiste en la nécessité pour un agent d'en passer par un autre pour accéder à son objet de désir… » (08.1). La définition est formulée en termes de désir (D01), non de volonté ni de contrainte physique. Lordon en ajoute aussitôt la conséquence : l'intensité de la domination est proportionnée à celle du désir du dominé (T007). Ce premier sens demeure au chapitre 3, à côté d'un second (33.2 ; D20).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01", "D20", "T007"], "corollaires": [], "mtime": 1794561825.2593846}, {"id": "D10", "file": "definitions/D10.md", "type": "definition", "partie": "1", "titre": "Stratégie", "enonce": "Est stratégique l'ensemble des actions enchaînées pour parvenir à une fin désirée, qu'elles procèdent du calcul ou de la conduite par les affects : la stratégie est la logique même du désir.", "citation": "", "loc": ["10.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon se garde d'un sens « ouvertement réfléchi et calculateur » (10.2) : les enchaînements d'actions peuvent être des manières de faire incorporées, quasi automatiques (l'habitus de Bourdieu). Il reprend l'expression de Laurent Bove, les « stratégies du conatus » (note 23) ; l'opposition du calcul et des affects est une « fausse antinomie » (note 22).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2593846}, {"id": "D11", "file": "definitions/D11.md", "type": "definition", "partie": "1", "titre": "Colinéarité et angle α", "enonce": "Le désir-maître et chaque conatus enrôlé sont figurés par des vecteurs. L'angle α qu'ils forment mesure le désalignement de l'enrôlé : seule la composante de son effort parallèle au désir-maître (d’intensité |d| cos α) lui est utile ; la composante orthogonale (|d| sin α) lui échappe.", "citation": "", "loc": ["13.3", "13.5", "13.7", "14.1"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« S'il est question de direction et d'alignement la métaphore vectorielle est adéquate » (13.3). Lordon note **D** le désir-maître (D03) et **d** le conatus enrôlé (D02). L'enrôlement est figuré par le produit scalaire **D**·**d** = |**D**| |**d**| cos α (13.3-13.4) ; la composante utile d1 a pour longueur |**d**| cos α, inférieure à |**d**| (13.5-13.7). L'angle α est le *clinamen* du conatus individuel, son « désalignement spontané d'avec les finalités de l'entreprise » ; son sinus (la composante orthogonale d2) mesure « ce qui ne se laissera pas capturer » (14.1). La figure 1 du livre représente cette décomposition (13.8).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794561825.2609024}, {"id": "D12", "file": "definitions/D12.md", "type": "definition", "partie": "1", "titre": "Liquidité", "enonce": "Au sens strict, la liquidité est la possibilité de sortir à tout instant d'un marché d'actifs sans en faire varier le prix : une promesse de réversibilité parfaite. Au sens large, elle est le droit inconditionnel du désir à s'engager en sachant pouvoir se désengager.", "citation": "", "loc": ["16.3"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe même mot désigne une propriété des marchés et l'argent lui-même, auquel cette propriété permet de revenir (16.3). Keynes avait vu le caractère antisocial de la liquidité, refus de tout engagement durable, désir de garder toutes ses options ouvertes, « c'est-à-dire de *n'avoir jamais à compter avec l'autre* » (note 40). Le schème déborde la finance et devient celui des désirs-maîtres (D03).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D03"], "corollaires": [], "mtime": 1794561825.2619138}, {"id": "D13", "file": "definitions/D13.md", "type": "definition", "partie": "1", "titre": "Tyrannie", "enonce": "La tyrannie est l'imposition unilatérale du désir de l'un à la multitude, sans égard ni compromis : « l'unité qui ne dépend pas de la multitude ».", "citation": "« l’unité qui ne dépend pas de la multitude est tyrannie »", "loc": ["17.1"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon écarte d'abord une objection tirée de Pascal : la tyrannie serait le « désir de domination hors de son ordre », et le désir-maître capitaliste ne sort pas de son ordre, puisqu'il ne vise que l'accumulation (17.1, notes 41-43). Il retient une autre définition de Pascal (note 44) : la non-dépendance de l'un envers la multitude, qui n'est pas une absence de relation, puisque le tyran reste le captateur de sa puissance. Exemple de Caligula, d'après Camus (note 45).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2629144}, {"id": "D14", "file": "definitions/D14.md", "type": "definition", "partie": "2", "titre": "Épithumè et épithumogénie", "enonce": "Une épithumè est un régime de désir : la configuration de désirs et d'affects par laquelle des structures sociales existent aussi dans les psychés. L'épithumogénie est le travail de production de désirs, mené par la société sur elle-même ou par des agents intéressés.", "citation": "", "loc": ["19.1", "19.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe mot, forgé sur le grec *épithumia*, désir (note 48), est une « paronymie foucaldienne » de l'*épistémè* (19.1). Comme l'*illusio* de Bourdieu, il nomme les forces motrices de l'engagement dans un jeu social, mais marque que cet « intérêt » est affaire de désir (D01) et d'affects. L'épithumè capitaliste s'inscrit dans le « triptyque objectal » de l'argent, de la marchandise et du travail, surmonté de la grandeur (19.2). L'épithumogénie n'est pas toujours un « procès sans sujet » : elle peut être maniée à des fins déterminées (19.2).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794561825.2629144}, {"id": "D15", "file": "definitions/D15.md", "type": "definition", "partie": "2", "titre": "Affects intrinsèques et extrinsèques", "enonce": "Un affect salarial est intrinsèque quand il naît de l'activité de travail elle-même, extrinsèque quand il naît d'objets extérieurs à elle (les biens que le salaire permet d'acheter). L'aiguillon de la faim est intrinsèque et triste ; la joie consumériste, extrinsèque et joyeuse ; l'épithumogénie néolibérale vise des affects intrinsèques joyeux.", "citation": "« l’aiguillon de la faim était un affect salarial intrinsèque, mais c’était un affect triste ; la joie consumériste est bien un affect joyeux, mais il est extrinsèque »", "loc": ["19.5"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLes trois régimes d'affects du salariat se lisent sur ce tableau à double entrée (19.5) :\n\n| | triste | joyeux |\n|---|---|---|\n| **intrinsèque** | l'aiguillon de la faim (T007) | les affects joyeux intrinsèques (T021) |\n| **extrinsèque** | — | la consommation (T013) |\n\nUn affect intrinsèque joyeux est « intransitif » : c'est l'activité *elle-même* qui doit devenir source de joie immédiate.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T007", "T013", "T021"], "corollaires": [], "mtime": 1794561825.2639124}, {"id": "D16", "file": "definitions/D16.md", "type": "definition", "partie": "2", "titre": "Obsequium", "enonce": "L'obsequium est le complexe d'affects qui fait se mouvoir les corps assujettis vers les objets de la norme, et fait faire aux sujets les gestes conformes à ce que demande la persévérance du pouvoir.", "citation": "", "loc": ["21.3"], "depends_on": ["S15"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe sujet est ici *subditus*, sujet *du* souverain, non *subjectum*, sujet souverain ; il suit (*sequor*) la règle (21.3). Par S15, l'obsequium a deux formules pures : la crainte et l'amour.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S15"], "corollaires": [], "mtime": 1794561825.2639124}, {"id": "D17", "file": "definitions/D17.md", "type": "definition", "partie": "2", "titre": "Puissance axiogène du désir", "enonce": "Le désir est axiogène : la valeur n'est pas une propriété des choses que le désir viendrait reconnaître ; c'est une production des investissements du désir.", "citation": "« Loin que le désir soit une induction par la valeur, c’est la valeur qui est une production par le désir. »", "loc": ["22.2", "22.3"], "depends_on": ["S04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nConséquence de S04, qui « ruine toute possibilité d'un objectivisme de la valeur » (22.2). Ce n'est pas dire que tout se présente dans une neutralité vierge : chaque complexion valorisante, socialement et biographiquement constituée, a ses schèmes résistants, très prédéterminants mais pas entièrement saturants (22.3).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S04"], "corollaires": [], "mtime": 1794561825.2649124}, {"id": "D18", "file": "definitions/D18.md", "type": "definition", "partie": "2", "titre": "Images vocationnelles et précolinéarisation", "enonce": "Les images vocationnelles sont les figures d'activités et de vies désirables que la société produit et fait imiter. Elles précolinéarisent les individus : elles les disposent à désirer l'enrôlement avant même qu'ils soient enrôlés.", "citation": "", "loc": ["24.3", "24.4", "25.1"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nSystème d'éducation, de formation et d'orientation, pouvoir du récit qu'Yves Citton qualifie de « mythocratique » (note 74) : la société entière travaille à produire ces images (24.3-24.4). La précolinéarisation réduit l'angle α (D11) mais reste « loin d'être parfaite » (25.1), d'autant que le flot des images comprend aussi le poète, le voyageur, l'artiste irrécupérable, les fuyards (24.4).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794562560.726071}, {"id": "D19", "file": "definitions/D19.md", "type": "definition", "partie": "2", "titre": "Amor fati capitalistis", "enonce": "L'amor fati capitalistis est l'amour, par les salariés, de la situation que l'entreprise leur fait : la conversion de contraintes extérieures en affects joyeux et en désir propre.", "citation": "« Produire le consentement, c’est produire l’amour par les individus de la situation qui leur est faite. »", "loc": ["30.1", "30.3"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'épithumogénie néolibérale (D14) produit de l'*amor fati*, « mais pas de n'importe quel *fatum* : le sien exclusivement, celui qu'elle abat sur des salariés au comble de l'hétéronomie » (30.1).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D14"], "corollaires": [], "mtime": 1794561825.265912}, {"id": "D20", "file": "definitions/D20.md", "type": "definition", "partie": "3", "titre": "Domination (second sens)", "enonce": "La domination est l'effet qui confère à certains l'aptitude à se réserver des possibilités de jouissance et à en écarter les autres.", "citation": "« l’effet qui confère à certains l’aptitude à se réserver des possibilités (de jouissance) et à en écarter les autres »", "loc": ["33.2", "34.1"], "depends_on": ["D09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe premier sens (D09) demeure (33.2) ; ce second sens vaut même quand on fait abstraction de la dépendance, et englobe domination « dure » et domination « douce ». Son enjeu est distributif : « la répartition des chances de joie », pour mêler les langages de Weber et de Spinoza (34.1).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D09"], "corollaires": [], "mtime": 1794561825.265912}, {"id": "D21", "file": "definitions/D21.md", "type": "definition", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La division du désir est la conversion de la division du travail en assignation des désirs : chacun est rivé aux objets que lui donne sa place. Elle est soutenue par un double imaginaire : du comblement, qui fait paraître suffisantes les petites joies des dominés, et de l'impuissance, qui les fait renoncer aux grandes.", "citation": "", "loc": ["34.1", "34.2"], "depends_on": ["D20"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nC'est ce double imaginaire que Lordon appelle la violence symbolique « à proprement parler » (34.1). Les objets réservés aux dominants doivent être reconnus désirables par les dominés, « sous la clause décisive : désirable en général mais pas pour eux en particulier » (34.2).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.266912}, {"id": "D22", "file": "definitions/D22.md", "type": "definition", "partie": "3", "titre": "Exploitation passionnelle", "enonce": "L'exploitation passionnelle est la capture, par un désir-maître, de la puissance d'agir d'enrôlés dont les passions dirigent l'effort dans sa direction. Elle est dépossession d'œuvre : du produit monétaire, et plus généralement de l'autorat, c'est-à-dire de la reconnaissance d'une œuvre collective.", "citation": "", "loc": ["35.5", "35.6"], "depends_on": ["D03", "D04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« De la puissance et des passions, de la puissance bien dirigée par des passions » : c'est ce qu'exploite le patron général (D04), le patron capitaliste convertissant cette capture en argent, les autres en reconnaissance propre à leur champ (35.6). La reconnaissance descend ensuite du sommet au long des chaînes hiérarchiques, *trickle-down economy* de la joie (35.5).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D04"], "corollaires": [], "mtime": 1794561825.266912}, {"id": "D23", "file": "definitions/D23.md", "type": "definition", "partie": "3", "titre": "Récommune", "enonce": "La récommune (*res communa*, décalquée de la *res publica*) est l'entreprise, au sens général d'un concours de puissances d'agir, constituée selon le principe de la démocratie radicale : ce qui affecte tous doit être l'objet de tous, débattu égalitairement par tous.", "citation": "« ce qui affecte tous doit être l’objet de tous »", "loc": ["37.6", "37.7"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon reprend un terme de *La crise de trop* (2009, note 122). Ce que l'entreprise doit fabriquer, en quelle quantité, avec quel emploi et quelles rémunérations : rien de cela n'échappe par principe à la délibération commune (37.6). La récommune réalise l'abolition du rapport salarial comme rapport d'enrôlement (D02) (37.7).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02"], "corollaires": [], "mtime": 1794561825.2679129}, {"id": "D24", "file": "definitions/D24.md", "type": "definition", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "Devenir perpendiculaire (orthogonal), c'est rouvrir l'angle α jusqu'à l'angle droit : le conatus n'offre plus rien à la capture, parce qu'il s'efforce dans de nouvelles directions, vers de nouveaux objets de désir. À α = 180°, il s'oppose activement au désir-maître.", "citation": "« La sédition c’est le devenir orthogonal – prendre non pas la tangente mais la perpendiculaire. »", "loc": ["39.5"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nAvec le modèle de D11 : à α droit, cos α = 0 et la capture est nulle (figure 2-a) ; à α = 180°, cos α = -1 et le conatus ôte de sa traction au désir-maître (figure 2-b). La géométrie renverse le sens de « remettre d'équerre » (*norma*, l'équerre) (39.5). « Les perpendiculaires se détournent du détournement » (39.5).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794562560.727581}, {"id": "D25", "file": "definitions/D25.md", "type": "definition", "partie": "3", "titre": "Aliénation comme fixation", "enonce": "L'aliénation n'est ni la perte de l'autonomie, ni la séparation d'avec sa puissance, mais la fixation de la puissance sur un très petit nombre d'objets : rétrécissement de ses effectuations, fermeture du champ de ses affectabilités.", "citation": "", "loc": ["40.2", "40.3"], "depends_on": ["S29", "S33", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon emprunte le schème à Pascal Sévérac (note 131). Par S29, on ne peut être séparé de sa puissance, qui est son être même ; par S33, un affect peut se fixer de façon tenace ; par S25, la puissance est aussi pouvoir d'être affecté de nombreuses manières (40.2-40.3). « Le salarié rivé, fût-ce joyeusement, à “son” unique objet d'activité n'est pas “aliéné” différemment du cocaïnomane dont l'esprit est entièrement rempli d'images de poudre » (40.2).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S25", "S29", "S33"], "corollaires": [], "mtime": 1794561825.2689161}, {"id": "D26", "file": "definitions/D26.md", "type": "definition", "partie": "3", "titre": "Classes affectives", "enonce": "Une classe est une communauté de manières de sentir, juger et désirer, déterminée par une proximité d'expériences sociales. La lutte des classes devient lutte de classes affectives : celle des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose.", "citation": "", "loc": ["41.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCette définition « coïncide moins bien avec la simplicité du schéma bipolaire initial » mais permet des ré-homogénéisations selon d'autres principes, notamment le mécontentement (41.4). Elle n'est pas un « cosmétique hommage verbal à Marx » : les affects communs ont une cause, le capital comme rapport social (41.4).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794562560.727581}, {"id": "M01", "file": "premisses/M01.md", "type": "marx", "partie": "P", "titre": "Le rapport salarial comme double séparation", "enonce": "Le rapport salarial sépare les travailleurs des moyens de la production et de ses produits.", "citation": "« double séparation des travailleurs d’avec les moyens et les produits de la production »", "loc": ["01.3", "04.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Depuis Marx on sait » que le pouvoir des patrons est l'effet de cette configuration de structures (01.3). La double séparation est le noyau structurel de la définition du rapport salarial (04.1 ; D05).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D05"], "corollaires": [], "mtime": 1794561825.2703345}, {"id": "M02", "file": "premisses/M02.md", "type": "marx", "partie": "P", "titre": "L'accumulation primitive", "enonce": "Le capitalisme n'a pu naître qu'en fermant les possibilités d'autoproduction (enclosures) et en ne laissant aux hommes dépossédés que la vente de leur force de travail.", "citation": "", "loc": ["06.1", "09.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon renvoie à Marx et à Polanyi pour la constitution historique des conditions de la prolétarisation (06.1). Il retrouve « l'effraction originelle de l'accumulation primitive » dans l'Antoine Doinel des *Quatre cents coups*, qui songe à voler un meuble pour se lancer dans les affaires (09.4 ; T010).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T010"], "corollaires": [], "mtime": 1794561825.2708418}, {"id": "M03", "file": "premisses/M03.md", "type": "marx", "partie": "P", "titre": "Il faut d'abord vivre", "enonce": "La présupposition première de toute existence humaine, donc de toute histoire, est que les hommes doivent pouvoir vivre : boire, manger, se loger, se vêtir.", "citation": "« pour vivre, il faut avant tout boire, manger, se loger, s’habiller et quelques autres choses encore »", "loc": ["08.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCitation de *L'Idéologie allemande* (Marx et Engels ; 08.1, note 13), qui fonde la priorité du désir basal (D07) et, par lui, l'emprise du désir d'argent (T007).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D07", "T007"], "corollaires": [], "mtime": 1794561825.2708418}, {"id": "M04", "file": "premisses/M04.md", "type": "marx", "partie": "P", "titre": "Travail et force de travail", "enonce": "L'employeur achète de la force de travail, non du travail ; la conversion de la première en le second reste à obtenir.", "citation": "", "loc": ["27.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Les recruteurs redécouvrent quotidiennement la différence théoriquement repérée par Marx entre travail et force de travail » (27.1) : l'achat d'une force de travail ne garantit pas sa mobilisation effective (T030).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T030"], "corollaires": [], "mtime": 1794561825.2708418}, {"id": "M05", "file": "premisses/M05.md", "type": "marx", "partie": "P", "titre": "Le communisme, mouvement réel", "enonce": "Le communisme n'est pas un état de choses à établir ni un idéal auquel la réalité devrait se conformer : c'est le mouvement réel qui abolit l'état actuel des choses.", "citation": "« Nous appelons communisme le mouvement réel qui abolit l’état actuel des choses »", "loc": ["37.8", "38.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*L'Idéologie allemande* (note 126), qui clôt la section sur la récommune (37.8) et ouvre la question suivante : d'où peut naître ce mouvement réel, si le libre arbitre est une fiction ? (38.1 ; T042).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T042"], "corollaires": [], "mtime": 1794561825.2734165}, {"id": "M06", "file": "premisses/M06.md", "type": "marx", "partie": "P", "titre": "La division du travail sécrète le pouvoir", "enonce": "La division du travail produit d'elle-même du pouvoir : elle réserve à certaines places la coordination et la totalisation des informations, dont les autres n'ont qu'une vue parcellaire, et sépare la conception de l'exécution.", "citation": "", "loc": ["35.5", "37.4", "42.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« C'est la division du travail, explique Marx, qui sécrète *endogènement* du pouvoir » (42.1), comme le montrent *L'Idéologie allemande* et *Le Capital* (note 145). Lordon déplore les lectures qui ont réduit les rapports de pouvoir capitalistes au seul régime de propriété. La « division princeps » de la conception et de l'exécution revient en 35.5 et 37.4.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2744203}, {"id": "S01", "file": "premisses/S01.md", "type": "spinoza", "partie": "P", "titre": "Le conatus", "enonce": "Chaque chose, autant qu'il est en elle, s'efforce de persévérer dans son être.", "citation": "« chaque chose, autant qu’il est en elle, s’efforce de persévérer dans son être »", "loc": ["03.1"], "depends_on": [], "contre": [], "ethique": ["3p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPoint de départ du chapitre 1 (03.1), cité dans la traduction de Robert Misrahi (note 3). Lordon le lit comme la « force d'exister », l'énergie qui met les corps en mouvement : voir D01.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794561825.275414}, {"id": "S02", "file": "premisses/S02.md", "type": "spinoza", "partie": "P", "titre": "L'argent, condensé de tous les biens", "enonce": "L'argent est devenu le condensé de tous les biens ; aussi son image occupe-t-elle l'esprit du vulgaire, qui n'imagine guère de joie qui ne soit accompagnée de l'idée de l'argent comme cause.", "citation": "« L’argent est devenu le condensé de tous les biens »", "loc": ["06.3", "12.2"], "depends_on": [], "contre": [], "ethique": ["4appc28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'un des rares passages où Spinoza parle d'économie (06.3, note 6). Lordon y lit la naissance d'un **métadésir** (T006) dans une économie marchande à travail divisé ; il le reprend pour la consommation de masse, où l'énoncé « reçoive sa pleine dimension » (12.2, notes 28 et 29 ; T013). Il distingue le « lot commun », qui ne peut se passer d'argent, du « vulgaire », dont l'esprit en est *entièrement* occupé (note 7).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T006", "T013"], "corollaires": [], "mtime": 1794561825.275414}, {"id": "S03", "file": "premisses/S03.md", "type": "spinoza", "partie": "P", "titre": "Le désir, essence de l'homme", "enonce": "Le désir est l'essence même de l'homme en tant qu'elle est conçue comme déterminée, par une affection quelconque d'elle-même, à faire quelque chose.", "citation": "« Le désir […] est l’essence même de l’homme en tant qu’elle est conçue comme déterminée par une quelconque affection d’elle-même à faire quelque chose »", "loc": ["08.3"], "depends_on": [], "contre": [], "ethique": ["3ad1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière définition des affects, citée en entier (08.3, note 14). Lordon en tire que le conatus, puissance d'agir générique, ne devient activité dirigée que sous l'effet d'une affection antécédente qui lui désigne un objet (T008).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T008"], "corollaires": [], "mtime": 1794561825.2764149}, {"id": "S04", "file": "premisses/S04.md", "type": "spinoza", "partie": "P", "titre": "On ne désire pas une chose parce qu'elle est bonne", "enonce": "Ce n'est pas parce qu'une chose est bonne que nous la désirons ; c'est parce que nous la désirons que nous la jugeons bonne.", "citation": "", "loc": ["08.3", "22.2", "35.2"], "depends_on": [], "contre": [], "ethique": ["3p9sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 16 (08.3), puis cité en entier en 22.2, où Lordon en tire que le désir est **axiogène** (D17). En 08.3, il sert au « renversement radical » de la conception ordinaire du désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir (T008, contre R03). L'énoncé ci-dessus résume le scolie ; Lordon ne le cite pas. Il y revient en 35.2 contre toute valeur substantielle (T037).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D17", "R03", "T008", "T037"], "corollaires": [], "mtime": 1794561825.2774088}, {"id": "S05", "file": "premisses/S05.md", "type": "spinoza", "partie": "P", "titre": "L'association des affects", "enonce": "Du seul fait que nous avons considéré une chose en même temps que nous étions affectés d'une joie ou d'une tristesse dont elle n'était pas la cause, nous pouvons l'aimer ou la haïr.", "citation": "", "loc": ["08.3", "24.1"], "depends_on": [], "contre": [], "ethique": ["3p15c"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 18 (08.3), repris en 24.1 : les anciennes joies ou tristesses, « contaminant par connexité » de nouveaux objets, en font des objets de désir. Exemple de Lordon : Swann aime Odette parce qu'elle lui rappelle une figure de Botticelli.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2774088}, {"id": "S06", "file": "premisses/S06.md", "type": "spinoza", "partie": "P", "titre": "L'imitation des affects", "enonce": "Du fait que nous imaginons qu'une chose semblable à nous est affectée d'un affect, nous sommes affectés d'un affect semblable.", "citation": "", "loc": ["08.3", "12.4", "24.1", "29.2", "34.1"], "depends_on": [], "contre": [], "ethique": ["3p27"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi des notes 19 et 32, repris au chapitre 2 (24.1, 29.2). Le désir circule entre les individus, qui « s'induisent les uns les autres à désirer par le spectacle mutuel de leurs élans » (08.3), surtout à travers des médiations sociales : émulation, distinction, goût et dégoût de groupe. En 34.1, l'*imitatio affectuum* attise l'envie des joies visibles des grands (T036). Appliqué à la consommation (12.4) : une société qui réduirait seule ses aspirations matérielles resterait exposée à l'imitation du désir de ses voisins.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794561825.2789192}, {"id": "S07", "file": "premisses/S07.md", "type": "spinoza", "partie": "P", "titre": "La servitude", "enonce": "La servitude est l'impuissance humaine à diriger et à réprimer les affects : soumis aux affects, l'homme ne relève pas de lui-même mais de la fortune.", "citation": "« J’appelle Servitude l’impuissance humaine à diriger et à réprimer les affects »", "loc": ["08.4"], "depends_on": [], "contre": [], "ethique": ["4pr"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nPremière phrase de la préface de la partie IV, *De la servitude humaine, ou de la force des affects*, citée en 08.4. Lordon note que l'*Éthique* trace bien une voie de libération, mais que « peu nombreux sont les émancipés » : pour le lot commun, la servitude est la règle (T009).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T009"], "corollaires": [], "mtime": 1794561825.2789192}, {"id": "S08", "file": "premisses/S08.md", "type": "spinoza", "partie": "P", "titre": "La crainte", "enonce": "La crainte est une tristesse inconstante née de l'idée d'une chose future ou passée dont l'issue est pour nous en quelque mesure incertaine ; elle accompagne l'espoir, qui en est la face joyeuse.", "citation": "« tristesse inconstante née de l’idée d’une chose future ou passée, dont l’issue est en quelque mesure incertaine pour nous »", "loc": ["11.1", "31.4"], "depends_on": [], "contre": [], "ethique": ["3ad13"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDéfinition des affects 13, citée en 11.1 (note 24). Le « flottement de l'âme » revient en 31.4 : les « consentements » salariaux sont toujours mitigés (T034). Lordon ajoute que crainte et espoir sont « l'arrière-plan quasi permanent du désir » dès que l'objet n'est pas immédiatement à portée, l'espoir d'obtenir allant avec la crainte de manquer (*fluctuatio animi*). *[renvoi reconstruit : le lien de l'espoir et de la crainte est l'explication de 3ad13 ; l'espoir est défini en 3ad12.]*", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794561825.27993}, {"id": "S09", "file": "premisses/S09.md", "type": "spinoza", "partie": "P", "titre": "La force du désir suit celle de l'affect", "enonce": "Le désir qui naît d'une tristesse ou d'une joie est d'autant plus grand que l'affect est plus grand : plus grande est la tristesse, plus grande est la puissance d'agir par laquelle on s'efforce de l'écarter ; un homme affecté de joie désire la conserver, d'autant plus que la joie est grande.", "citation": "« plus grande est la tristesse, plus grande est la puissance d’agir par laquelle l’homme s’efforce de lutter contre la tristesse »", "loc": ["11.1", "22.8", "23.3", "38.4"], "depends_on": [], "contre": [], "ethique": ["3p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nDémonstration de III, 37, citée quatre fois : comme tout affect triste, la crainte induit du conatus un surplus d'activité pour s'en défaire (11.1, note 25 ; T012) ; la tristesse du travail sans sens peut pousser à la rébellion (22.8, note 64 ; T026) ; le salarié réjoui par l'amour du maître désire conserver cette joie (23.3, note 71 ; T027) ; la tristesse commune née d'une offense fait la puissance de l'indignation (38.4, note 129 ; T042).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T012", "T026", "T027", "T042"], "corollaires": [], "mtime": 1794563090.9106283}, {"id": "S10", "file": "premisses/S10.md", "type": "spinoza", "partie": "P", "titre": "L'illusion du libre arbitre", "enonce": "Les hommes se croient libres parce qu'ils sont conscients de leurs actions et ignorants des causes qui les déterminent.", "citation": "« Les hommes se trompent quand ils se croient libres ; car cette opinion consiste en cela seul qu’ils sont conscients de leurs actions et ignorants des causes qui les déterminent »", "loc": ["20.4", "24.3"], "depends_on": [], "contre": [], "ethique": ["2p35sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 : Spinoza ne se contente pas de nier le libre arbitre, il donne « le principe génétique » de la croyance, une troncature de l'intellection qui n'enregistre que les volitions et les actions. Repris en 24.3 : plus les déterminations sont multiples et diffuses, plus l'individu se croit l'origine de son désir.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2809272}, {"id": "S11", "file": "premisses/S11.md", "type": "spinoza", "partie": "P", "titre": "Toute chose finie est déterminée par une autre", "enonce": "Une chose finie, dont l'existence est déterminée, ne peut exister ni être déterminée à agir que si elle y est déterminée par une autre cause, elle aussi finie, et ainsi à l'infini.", "citation": "", "loc": ["20.4", "20.5"], "depends_on": [], "contre": [], "ethique": ["1p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.4 (note 51) et 20.5 : « nous ne faisons quelque chose que s'il nous arrive quelque chose ». D'où la séquence affection-affect-action, que Lordon propose de contracter en « affectaction ».", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2809272}, {"id": "S12", "file": "premisses/S12.md", "type": "spinoza", "partie": "P", "titre": "Cause adéquate et cause inadéquate", "enonce": "Une cause est adéquate quand on peut percevoir clairement et distinctement son effet par elle seule ; inadéquate ou partielle quand on ne peut comprendre son effet par elle seule.", "citation": "", "loc": ["20.4"], "depends_on": [], "contre": [], "ethique": ["3def1"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 50 (20.4) : toute chose se trouve « sous l'empire de la causalité inadéquate », partiellement déterminée à agir par d'autres choses ; aucune action ne peut donc être revendiquée comme *entièrement* sienne.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2819643}, {"id": "S13", "file": "premisses/S13.md", "type": "spinoza", "partie": "P", "titre": "L'ambition : vouloir que les autres vivent selon sa complexion", "enonce": "L'effort pour que les autres approuvent ce que nous aimons ou haïssons est l'ambition : chacun, par nature, désire que les autres vivent selon sa propre constitution.", "citation": "« chacun, par nature, désire que les autres vivent selon sa propre constitution »", "loc": ["20.6", "34.2"], "depends_on": [], "contre": [], "ethique": ["3p31csc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 20.6 (note 55). Lordon y voit le principe des guerres de religion et des « chocs de civilisations », et surtout l'origine du *jugement d'aliénation* : nous refusons le consentement de ceux qui ne vivent pas selon notre complexion (T022). La suite du scolie (« tous se font également obstacle ») sert en 34.2 à penser la domination comme réservation des objets de désir (T036).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T022", "T036"], "corollaires": [], "mtime": 1794561825.2819643}, {"id": "S14", "file": "premisses/S14.md", "type": "spinoza", "partie": "P", "titre": "Le bien et le mal, joie et tristesse", "enonce": "Par bien il faut entendre toute forme de joie et ce qui y conduit, notamment ce qui satisfait un désir ; par mal, toute forme de tristesse, notamment celle qui frustre un désir.", "citation": "", "loc": ["20.6"], "depends_on": [], "contre": [], "ethique": ["3p39sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en note 56 (20.6) : nos amours et nos haines nous font valoriser les choses ; c'est d'eux que procèdent nos jugements sur la vie des autres.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2829638}, {"id": "S15", "file": "premisses/S15.md", "type": "spinoza", "partie": "P", "titre": "L'obsequium : crainte ou amour", "enonce": "Les sujets relèvent du droit de la Cité, et non du leur propre, dans la mesure où ils craignent sa puissance ou dans la mesure où ils aiment la société civile.", "citation": "« Les sujets relèvent non de leur droit propre mais de celui de la Cité, dans la mesure même où ils craignent sa puissance, c’est-à-dire ses menaces, ou encore dans la mesure où ils aiment la société civile »", "loc": ["21.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, III, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3, dans la traduction de Charles Ramond (note 58). Lordon en tire « la vérité affective bipolaire du pouvoir : il fonctionne à la crainte ou à l'amour », valable pour tous les pouvoirs, y compris patronal (D16, T024). Il lit le *Traité politique* comme une théorie générale des institutions (note 57).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D16", "T024"], "corollaires": [], "mtime": 1794561825.2837796}, {"id": "S16", "file": "premisses/S16.md", "type": "spinoza", "partie": "P", "titre": "Une vie humaine", "enonce": "Les hommes aspirent à une vie humaine, qui ne se définit pas par la seule circulation du sang et les autres fonctions communes à tous les animaux.", "citation": "« une vie humaine, qui se définit non par la seule circulation du sang et par les autres fonctions communes à tous les animaux »", "loc": ["21.3", "43.2", "43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 5", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3. La reproduction de la vie nue ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon au déploiement de la puissance d'agir : d'où l'intérêt du pouvoir à réjouir ses sujets. Lordon note (note 59) que la formule vise probablement Hobbes. Elle revient à la fin du livre (43.2, 43.4) : « j'entends par là une vie humaine » est le dernier mot, le « vrai bien » vers lequel orienter le progrès (T049).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794561825.2837796}, {"id": "S17", "file": "premisses/S17.md", "type": "spinoza", "partie": "P", "titre": "Le conatus cherche la joie", "enonce": "L'esprit s'efforce, autant qu'il le peut, d'imaginer ce qui accroît ou seconde la puissance d'agir du corps, et répugne à imaginer ce qui la réduit ; nous nous efforçons de promouvoir tout ce dont nous imaginons que cela conduit à la joie.", "citation": "« L’esprit, autant qu’il le peut, s’efforce d’imaginer ce qui accroît ou ce qui seconde la puissance d’agir du corps »", "loc": ["22.4", "22.8"], "depends_on": [], "contre": [], "ethique": ["3p12", "3p13c", "3p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nTrois énoncés cités ensemble en 22.4. « Autant qu'il est en lui, le conatus cherche sa joie », jusque dans les situations les plus défavorables : c'est le ressort du réenchantement spontané du travail (T026).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T026"], "corollaires": [], "mtime": 1794561825.2847877}, {"id": "S18", "file": "premisses/S18.md", "type": "spinoza", "partie": "P", "titre": "L'amour", "enonce": "L'amour est une joie accompagnée de l'idée d'une cause extérieure.", "citation": "", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p13csc", "3ad6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 65 (scolie du corollaire de III, 13). Refait d'après la définition génétique, l'amour donne « la notion la plus générale de la satisfaction objectale », bien au-delà de l'amour érotique ; c'est pourquoi on peut parler d'amour dans le salariat (23.2). Lordon reprend à Laurent Bove « la structure amoureuse du comportement » humain.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2857983}, {"id": "S19", "file": "premisses/S19.md", "type": "spinoza", "partie": "P", "titre": "Réjouir les autres pour s'en réjouir", "enonce": "Nous nous efforçons de faire tout ce que nous imaginons que les hommes considèrent avec joie ; et qui agit d'une manière dont il imagine qu'elle réjouit les autres est affecté d'une joie accompagnée de l'idée de soi comme cause.", "citation": "« nous nous efforcerons d’accomplir tout ce que nous imaginons considéré avec joie par les hommes »", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p29", "3p30"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 66 et 67 (23.1), repris en 23.2. Lordon en tire le mécanisme de la « demande amoureuse » : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui (T027).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T027"], "corollaires": [], "mtime": 1794561825.2857983}, {"id": "S20", "file": "premisses/S20.md", "type": "spinoza", "partie": "P", "titre": "L'affect, affection du corps et son idée", "enonce": "Par affects, il faut entendre les affections du corps par lesquelles sa puissance d'agir est accrue ou réduite, secondée ou réprimée, et en même temps les idées de ces affections.", "citation": "", "loc": ["23.2", "28.2"], "depends_on": [], "contre": [], "ethique": ["3def3"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 23.2 (note 69), où Lordon rappelle que la joie est définie par Spinoza comme augmentation de la puissance d'agir du corps : le conatus est effort vers davantage de puissance, donc recherche de la joie ; et en 28.2 (notes 87-88) : les affects s'inscrivent d'abord dans les corps, mais ont *aussi* une part mentale, comme idées de ces affections.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2867987}, {"id": "S21", "file": "premisses/S21.md", "type": "spinoza", "partie": "P", "titre": "L'âme et le corps, une seule chose", "enonce": "L'âme et le corps sont une seule et même chose, conçue tantôt sous l'attribut de la Pensée, tantôt sous celui de l'Étendue ; il n'y a donc pas d'action causale de l'une sur l'autre.", "citation": "", "loc": ["28.2"], "depends_on": [], "contre": [], "ethique": ["3p2", "3p2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExposé en 28.2, contre la glande pinéale de Descartes, sans renvoi précis. *[renvoi reconstruit : III, 2 nie que le corps puisse déterminer l'âme à penser et l'âme le corps au mouvement ; le scolie dit qu'ils sont une seule et même chose.]* Lordon en tire que les idées, appartenant à la Pensée, sont « sans lieu » : nos états d'âme ne sauraient être dits « intérieurs » (T025).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T025"], "corollaires": [], "mtime": 1794561825.2877972}, {"id": "S22", "file": "premisses/S22.md", "type": "spinoza", "partie": "P", "titre": "Faire croire aux hommes qu'ils vivent selon leur libre décret", "enonce": "Il faut conduire les hommes de telle façon qu'ils aient le sentiment, non d'être conduits, mais de vivre selon leur complexion et leur libre décret.", "citation": "« conduire les hommes de façon telle qu’ils aient le sentiment, non pas d’être conduits, mais de vivre selon leur complexion et leur libre décret »", "loc": ["29.3", "30.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, X, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nMaxime de prudence politique adressée à l'État (note 92), où Lordon reconnaît « le projet même de l'entreprise néolibérale » (29.3) et la formule du coaching (30.1).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.288805}, {"id": "S23", "file": "premisses/S23.md", "type": "spinoza", "partie": "P", "titre": "On aime et hait davantage ce qu'on imagine libre", "enonce": "L'amour et la haine envers un objet que nous imaginons libre doivent être, à cause égale, plus grands qu'envers un objet nécessaire.", "citation": "« L’amour et la haine doivent être plus grands, à cause égale, envers un objet que nous imaginons être libre qu’envers un objet nécessaire »", "loc": ["29.4", "34.3"], "depends_on": [], "contre": [], "ethique": ["3p49"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 29.4 (note 95) : Spinoza « touche là le mécanisme affectif qui trace d'emblée la limite des constructivismes politiques » (T032). Repris en 34.3 : la division sociale du désir, diffuse et impersonnelle, est vécue comme une nécessité, un *fatum* sans dieu (T036).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T032", "T036"], "corollaires": [], "mtime": 1794561825.2898035}, {"id": "S24", "file": "premisses/S24.md", "type": "spinoza", "partie": "P", "titre": "Un affect ne cède qu'à un affect plus fort", "enonce": "Un affect ne peut être réprimé ni supprimé que par un affect contraire et plus fort que lui.", "citation": "« un affect ne peut être ni réprimé ni supprimé si ce n’est par un affect contraire et plus fort que l’affect à réprimer »", "loc": ["31.4"], "depends_on": [], "contre": [], "ethique": ["4p7"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 31.4 (note 104) : en fait de « consentement », il n'y a que l'affrontement intrapsychique des affects joyeux et tristes selon cette loi de puissance (T034).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794561825.2898035}, {"id": "S25", "file": "premisses/S25.md", "type": "spinoza", "partie": "P", "titre": "Être affecté de nombreuses manières est utile", "enonce": "Ce qui dispose le corps humain à être affecté de nombreuses manières, ou le rend capable d'affecter les corps extérieurs de nombreuses manières, est utile à l'homme ; d'où le conseil de donner au corps des apports aussi variés que sa structure est complexe.", "citation": "« ce qui prédispose la corps humain à être affecté selon de nombreuses modalités, ou le rend capable d’affecter les corps extérieurs selon de nombreuses modalités, est utile à l’homme »", "loc": ["33.3", "40.3"], "depends_on": [], "contre": [], "ethique": ["4p38", "4p45c2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 33.3 (note 106) : l'« utile propre » de chacun est d'échapper aux fixations du conatus pour effectuer la variété de sa puissance (T035). En 40.3 (notes 137-138), avec le « scolie diététique » (nourritures, senteurs, sons, plaisirs des yeux), il fonde, d'après Pascal Sévérac, la lecture de l'aliénation comme fixation (D25, T044).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25", "T035", "T044"], "corollaires": [], "mtime": 1794561825.291314}, {"id": "S26", "file": "premisses/S26.md", "type": "spinoza", "partie": "P", "titre": "On ne peut pas ce qu'on imagine ne pas pouvoir", "enonce": "Ce qu'on imagine ne pas pouvoir, on l'imagine nécessairement, et l'on est par cette imagination même disposé de telle sorte qu'on ne le peut effectivement pas.", "citation": "« Tout ce qu’en effet l’on imagine ne pas pouvoir, on l’imagine nécessairement, et l’on est par cette imagination même disposé de telle sorte qu’on n’a effectivement pas le pouvoir qu’on imagine ne pas avoir »", "loc": ["34.1", "37.5"], "depends_on": [], "contre": [], "ethique": ["3ad28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExplication de la définition des affects 28 (note 107) : « voilà le mécanisme passionnel de conversion de l'assignation en auto-assignation » (34.1). Repris en 37.5 pour les effets d'« impuissantisation » de la division du travail.", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794561825.2923257}, {"id": "S27", "file": "premisses/S27.md", "type": "spinoza", "partie": "P", "titre": "Le désir cherche dans les autres sa confirmation", "enonce": "Si nous imaginons qu'un autre aime ou désire ce que nous-mêmes aimons ou désirons, nous l'aimerons ou le désirerons avec plus de constance.", "citation": "« Si nous imaginons qu’un autre aime ou désire […] ce que nous-mêmes aimons ou désirons […], par là même nous aimerons, désirerons […] avec plus de constance »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": ["3p31"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 108. Avec le scolie du corollaire (S13), c'est la « contradiction sociale princeps du désir » : il cherche dans le regard des autres sa confirmation, et tente d'éloigner de ses objets ceux qu'il y a amenés (34.2 ; T036).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S13", "T036"], "corollaires": [], "mtime": 1794561825.2933333}, {"id": "S28", "file": "premisses/S28.md", "type": "spinoza", "partie": "P", "titre": "La nature est une et commune à tous", "enonce": "La nature humaine est une et commune à tous ; c'est la puissance et la culture qui nous trompent, en nous faisant juger différemment une même action selon qui la fait.", "citation": "« La nature [humaine] est une, et commune à tous »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VII, 27", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 110 et 112. Pour Lordon, c'est « la réaffirmation la plus radicale de l'égalité anthropologique fondamentale », que recouvre l'arbitraire des classifications sociales (34.2 ; T036). Il la rapproche du premier des *Trois discours sur la condition des grands* de Pascal : votre bien n'est pas « un titre de nature, mais d'un établissement humain ».", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794561825.2943377}, {"id": "S29", "file": "premisses/S29.md", "type": "spinoza", "partie": "P", "titre": "La puissance est toujours en acte", "enonce": "L'effort par lequel chaque chose s'efforce de persévérer dans son être n'est rien en dehors de son essence actuelle ; réalité et perfection sont une même chose.", "citation": "« Par réalité et par perfection, j’entends la même chose »", "loc": ["35.2", "40.1", "40.2"], "depends_on": [], "contre": [], "ethique": ["3p7", "2def6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*Éthique* II, définition 6, citée en 35.2 et 40.1 ; III, 7, en note 134 (40.2). Lordon en tire, avec Pascal Sévérac, qu'« il n'y a pas de réserve dans l'ontologie spinoziste » : l'immanence intégrale exclut la différence aristotélicienne de la puissance et de l'acte ; « toujours le conatus est au bout de ce qu'il peut », même s'il peut très peu, et le conditionnel passé, « j'aurais pu », est « le non-sens spinoziste par excellence » (40.1). Elle exclut aussi toute valeur objective qui ferait norme (35.2 ; T037).", "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T037"], "corollaires": [], "mtime": 1794563090.9156828}, {"id": "S30", "file": "premisses/S30.md", "type": "spinoza", "partie": "P",
