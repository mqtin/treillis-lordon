    <p style="font-size:13px">Ce fichier est généré. Après modification des textes : <code>python outils/build_explorer.py</code> (ou <code>--watch</code> pour régénérer automatiquement), puis rechargez la page.</p>
  </div>`;
}
// Figure interactive : le désir-maître D, le conatus enrôlé d, l'angle α (D11, T014, D24, T043).
let alphaDeg = 35;
function renderAlpha() {
  const inner = $("#readerInner"); inner.style.removeProperty("--c");
  const ref = id => byId.has(id) ? pill(id, true) : "";
  inner.innerHTML = `<div class="alpha">
    <h1 class="title">L'angle α</h1>
    <p class="md" style="font-size:15px">Le modèle vectoriel de Lordon (13.3-13.7, 14.1, 39.5). Le désir-maître est un vecteur <b>D</b> ; chaque conatus enrôlé, un vecteur <b>d</b>. Seule la composante de <b>d</b> parallèle à <b>D</b>, de longueur |d| cos α, sert le désir-maître ; la composante orthogonale, |d| sin α, lui échappe.</p>
    <svg viewBox="-150 -180 460 240" aria-label="Décomposition du conatus enrôlé selon le désir-maître">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
      </defs>
      <line x1="-140" y1="0" x2="300" y2="0" stroke="var(--line)" stroke-width="1"/>
      <line id="aD" x1="0" y1="0" x2="260" y2="0" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah)"/>
      <text x="268" y="20" style="fill:var(--accent)">D</text>
      <line id="aD1" x1="0" y1="0" x2="0" y2="0" stroke="var(--these)" stroke-width="6" stroke-linecap="round" opacity=".55"/>
      <line id="aProj" x1="0" y1="0" x2="0" y2="0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
      <path id="aArc" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
      <text id="aLab" style="fill:var(--muted)">α</text>
      <line id="ad" x1="0" y1="0" x2="0" y2="0" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>
      <text id="adLab">d</text>
      <circle cx="0" cy="0" r="3.5" fill="var(--ink)"/>
    </svg>
    <div class="ctl"><label for="aRange">α = <b id="aVal"></b></label><input id="aRange" type="range" min="0" max="180" step="1" value="${alphaDeg}"></div>
    <div class="ctl presets">
      <button data-a="0">α = 0 : alignement intégral</button>
      <button data-a="35">dérive ordinaire</button>
      <button data-a="90">perpendiculaire</button>
      <button data-a="180">α = 180°</button>
    </div>
    <div>Part captée par le désir-maître : <b id="aCos"></b><div class="bar"><i id="aBar"></i></div></div>
    <div class="read" id="aRead"></div>
    <div class="md"><h2>Éléments</h2></div>
    <div class="relsec">${["D11", "T014", "T015", "T029", "D24", "T043", "T044"].map(ref).join("")}</div>
  </div>`;
  const R = 200, set = a => {
    alphaDeg = a;
    const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    const x = R * c, y = -R * s;
    const at = (id, o) => { const n = document.getElementById(id); for (const k in o) n.setAttribute(k, o[k]); };
    at("ad", { x2: x, y2: y }); at("adLab", { x: x + (c >= 0 ? 10 : -22), y: y - 8 });
    at("aD1", { x2: x, y2: 0 }); at("aProj", { x1: x, y1: y, x2: x, y2: 0 });
    const ar = 46, large = a > 180 ? 1 : 0;
    at("aArc", { d: a === 0 ? "" : `M${ar},0 A${ar},${ar} 0 ${large} 0 ${ar * c},${-ar * s}` });
    const m = r / 2; at("aLab", { x: (ar + 14) * Math.cos(m) - 5, y: -(ar + 14) * Math.sin(m) + 5 });
    $("#aVal").textContent = a + "°";
    $("#aCos").textContent = `cos α = ${c.toFixed(2)}`;
    $("#aBar").style.width = Math.max(0, c) * 100 + "%";
    $("#aBar").style.background = c < 0 ? "var(--refutee)" : "var(--these)";
    $("#aRead").textContent =
      a === 0 ? "α = 0 : la colinéarité parfaite. Le désir enrôlé « vit entièrement pour le désir-maître » ; c'est l'idéal de l'entreprise néolibérale (14.3)." :
      a < 90 ? "Le conatus enrôlé garde un désalignement propre, son clinamen : une part de son effort sert le désir-maître, le reste lui échappe (14.1). Réduire α est l'idée fixe patronale." :
      a === 90 ? "L'angle droit : cos α = 0, la capture est nulle. « La sédition c'est le devenir orthogonal – prendre non pas la tangente mais la perpendiculaire » (39.5)." :
      a < 180 ? "Au-delà de l'angle droit, le conatus ne se contente plus d'échapper à la capture : il commence à tirer contre le désir-maître (39.5)." :
      "α = 180°, cos α = -1 : le réalignement est négatif, « ouvertement antagoniste ». Le conatus ôte de sa traction au désir-maître (39.5, figure 2-b).";
  };
  $("#aRange").oninput = ev => set(+ev.target.value);
  inner.querySelectorAll(".presets [data-a]").forEach(btn => btn.onclick = () => { $("#aRange").value = btn.dataset.a; set(+btn.dataset.a); });
  set(alphaDeg);
}
// Vue : les régimes d'affects du salariat (D15, 13.1, 19.4-19.5, 28.3, 33.3).
function renderRegimes() {
  const inner = $("#readerInner"); inner.style.removeProperty("--c");
  const P = ids => ids.filter(id => byId.has(id)).map(id => pill(id, true)).join("");
  inner.innerHTML = `<div class="regimes">
    <h1 class="title">Les régimes d'affects</h1>
    <p class="md" style="font-size:15px">Ce qui fait marcher les salariés, selon Lordon, se range sur deux axes (19.5)&nbsp;: l'affect naît-il de l'activité de travail elle-même (<i>intrinsèque</i>) ou d'objets extérieurs à elle (<i>extrinsèque</i>) ? Est-il triste ou joyeux ? Voir ${pill("D15", true)}.</p>
    <table class="grid">
      <tr><th></th><th>triste</th><th>joyeux</th></tr>
      <tr><th>intrinsèque</th>
        <td class="sad"><b>L'aiguillon de la faim</b>Travailler pour ne pas dépérir : le désir d'éviter un mal, la vie nue (13.1, 19.5).<br>${P(["D07", "T006", "T007"])}</td>
        <td class="joy"><b>Les affects joyeux intrinsèques</b>Désirer le travail pour lui-même : « épanouissement », « réalisation de soi » (19.5, 21.1).<br>${P(["T021", "T024", "T026", "T027", "T028"])}</td></tr>
      <tr><th>extrinsèque</th>
        <td class="empty">Lordon ne nomme pas cette case.</td>
        <td class="joy"><b>La joie consumériste</b>Les biens que le salaire permet d'acheter : l'aliénation marchande (12.2-12.4, 19.5).<br>${P(["T013"])}</td></tr>
    </table>
    <div class="md"><h2>Trois régimes successifs</h2></div>
    <ol class="timeline">
      <li style="--c:var(--refutee)"><b>Le régime de Marx</b> : « l'aiguillon de la faim » fait jouer « à l'os » le désir basal (13.1). ${P(["T007"])}</li>
      <li style="--c:var(--these)"><b>Le régime fordien</b> : l'aliénation marchande joyeuse et l'accès élargi à la consommation s'ajoutent à la faim (13.1, 19.4). ${P(["T013", "T015"])}</li>
      <li style="--c:var(--accent)"><b>Le régime néolibéral</b> : l'entreprise veut α = 0 et prend en main la production des désirs ; elle y ajoute les affects joyeux intrinsèques (19.4-19.5), sans jamais effacer le fond de crainte (31.1). ${P(["T020", "T021", "T016", "T034"])}</li>
    </ol>
    <div class="md"><h2>Ce que la différence ne change pas</h2></div>
    <p class="md" style="font-size:15px">Triste ou joyeux, on est également déterminé : « contrainte » et « consentement » ne sont que les noms de la tristesse et de la joie dans des situations de pouvoir (21.4, 28.3), et domination « dure » ou « douce » ne se distinguent que par leurs affects (33.3). Mais « enchaîné content ou enchaîné triste, ça n'est pas la même chose » (21.4) : tous les régimes passionnels ne se valent pas (43.2).</p>
    <div class="relsec">${P(["T025", "T035", "T049"])}</div>
  </div>`;
  linkify(inner);
}
function renderAudit() {
  const inner = $("#readerInner"); inner.style.removeProperty("--c");
  inner.innerHTML = `<div class="audit"><h1 class="title">Audit automatique</h1>
    <p class="hint">Contrôles mécaniques (AGENT.md § 8). Ils ne remplacent pas l'audit de fidélité : chaque élément relu contre le passage cité.</p>
    ${AUDIT.map(a => `<h3>${esc(a.title)} <span class="count ${a.items.length ? a.level : "ok"}">${a.items.length || "✓"}</span></h3>
      <p class="hint">${esc(a.hint)}</p>${a.items.length ? `<ul>${a.items.map(i => `<li>${i}</li>`).join("")}</ul>` : ""}`).join("")}</div>`;
}

// ---------- Routage ----------
// ---------- Historique (synchronisé avec celui du navigateur) ----------
const HKEY = "explorer-history";
let hist = { stack: [], i: -1 };
try { hist = JSON.parse(sessionStorage.getItem(HKEY)) || hist; } catch {}
function track(h) {
  const st = history.state;
  if (st && typeof st.i === "number" && hist.stack[st.i] === h) hist.i = st.i;      // précédent / suivant / rechargement
  else if (hist.stack[hist.i] !== h) {                                               // nouvelle visite
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(h); hist.i = hist.stack.length - 1;
    if (hist.stack.length > 200) { hist.stack.shift(); hist.i--; }
    history.replaceState({ i: hist.i }, "");
  } else history.replaceState({ i: hist.i }, "");
  try { sessionStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
  renderTrail();
}
function label(h) {
  if (h === "home") return { t: "Vue d'ensemble" };
  if (h === "audit") return { t: "Audit" };
  if (h === "alpha") return { t: "L'angle α" };
  if (h === "regimes") return { t: "Les régimes d'affects" };
  if (h.startsWith("doc:")) return { t: h.slice(4) };
  if (h.startsWith("partie:")) return { t: partLabel(h.slice(7)) };
  return { id: h, t: byId.get(h)?.titre || "manquant", c: color(h) };
}
function renderTrail() {
  $("#back").disabled = hist.i <= 0;
  $("#fwd").disabled = hist.i >= hist.stack.length - 1;
  const from = Math.max(0, hist.i - 7), to = Math.min(hist.stack.length, hist.i + 3);
  const steps = [];
  for (let k = from; k < to; k++) {
    const L = label(hist.stack[k]), cur = k === hist.i;
    steps.push(`<button class="step ${cur ? "cur" : ""} ${k > hist.i ? "fwd" : ""}" data-k="${k}" ${L.c ? `style="--c:${L.c}"` : ""} title="${esc((L.id ? L.id + " — " : "") + L.t)}">${L.id ? esc(L.id) + (cur ? `<span class="tt">${esc(L.t)}</span>` : "") : esc(L.t)}</button>`);
  }
  $("#trail").innerHTML = hist.stack.length > 1 ? `<span class="lbl">${from > 0 ? "… " : ""}Historique</span>` + steps.join(`<span class="arrow">›</span>`) : "";
}
// Aller à une page : si c'est la page précédente (ou suivante) de l'historique,
// s'y déplacer au lieu de créer une nouvelle entrée.
function go(h) {
  h = String(h || "home");
  if (hist.stack[hist.i] === h) return;
  if (hist.i > 0 && hist.stack[hist.i - 1] === h) history.back();
  else if (hist.stack[hist.i + 1] === h) history.forward();
  else location.hash = h;
}
document.addEventListener("click", ev => {
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
$("#back").onclick = () => history.back();
$("#fwd").onclick = () => history.forward();
$("#trail").onclick = ev => { const b = ev.target.closest("[data-k]"); if (b) { const d = +b.dataset.k - hist.i; if (d) history.go(d); } };

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  track(h);
  const prevSel = state.sel;
  if (h === "home") { state.view = "home"; state.sel = null; renderHome(); }
  else if (h === "audit") { state.view = "audit"; state.sel = null; renderAudit(); }
  else if (h === "alpha") { state.view = "alpha"; state.sel = null; renderAlpha(); }
  else if (h === "regimes") { state.view = "regimes"; state.sel = null; renderRegimes(); }
  else if (h.startsWith("doc:")) { state.view = "doc:" + h.slice(4); state.sel = null; renderDoc(h.slice(4)); }
  else if (h.startsWith("partie:")) { state.view = h; state.sel = null; renderPartie(h.slice(7)); }
  else { state.view = "el"; state.sel = h; renderElement(h); }
  $("#reader").scrollTop = 0;
  renderList();
  renderGraph(state.mode !== "all" && prevSel !== state.sel);
  document.querySelector("#list .sel")?.scrollIntoView({ block: "nearest" });
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => fit());
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.target.matches?.("input")) { if (ev.key === "Escape") { ev.target.value = ""; state.q = ""; renderList(); ev.target.blur(); } return; }
  if (ev.key === "/") { ev.preventDefault(); $("#search").focus(); }
  else if (ev.key === "Escape") go("home");
  else if (ev.key === "[") stepSeq(-1);
  else if (ev.key === "]") stepSeq(1);
  else if (ev.key === "Backspace") history.back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "r" || ev.key === "R") $("#read").click();
  else if ("1234".includes(ev.key)) document.querySelectorAll("#toolbar [data-mode]")[+ev.key - 1].click();
});

$("#meta").textContent = `${els.length} éléments · généré le ${DATA.generated}`;
renderFilters();
route();
requestAnimationFrame(fit);
</script>
