S28", "S29", "S30", "S31", "S32", "S33", "S34", "S35", "S36", "S37", "S38", "S39", "S40", "M01", "M02", "M03", "M04", "M05", "M06", "T001", "T002", "D01", "D02", "D03", "D04", "D05", "D06", "D07", "D08", "D09", "D10", "D11", "D12", "D13", "R01", "R02", "R03", "R04", "R05", "T003", "T004", "T005", "T006", "T007", "T008", "T009", "T010", "T011", "T012", "T013", "T014", "T015", "T016", "T017", "T018", "T019", "D14", "D15", "D16", "D17", "D18", "D19", "R06", "R07", "R08", "R09", "R10", "T020", "T021", "T022", "T023", "T024", "T025", "T026", "T027", "T028", "T029", "T030", "T031", "T032", "T033", "T034", "D20", "D21", "D22", "D23", "D24", "D25", "D26", "R11", "R12", "R13", "R14", "R15", "R16", "T035", "T036", "T037", "T038", "T039", "T040", "T041", "T042", "T043", "T044", "T045", "T046", "T047", "T048", "T049"], "parties": {"P": "Prémisses", "0": "Avant-propos", "1": "Faire faire", "2": "Joyeux automobiles", "3": "Domination, émancipation"}, "partie_docs": [{"id": "P", "titre": "Prémisses", "resume": "Les thèses de Spinoza et de Marx que Lordon prend comme points de départ.\n", "titre_de": "Prämissen", "resume_de": "Die Thesen Spinozas und Marx', die Lordon als Ausgangspunkte nimmt.", "body_de": "Die Spinoza-Prämissen (S) verweisen auf die *Ethik* in SpinozaGraph oder, für den *Politischen Traktat*, auf den angeführten Artikel. Es sind die, auf die Lordon sich selbst beruft, fast immer in einer Anmerkung. Sie betreffen den Conatus und das Begehren (S01, S03, S04), das affektive Leben (Verknüpfung, Nachahmung, Liebe, Furcht, Macht der Affekte), die Bestimmung und die Illusion der Freiheit (S10-S12) und die Macht (*obsequium*, S15).\n\nDie Marx-Prämissen (M) betreffen das Lohnverhältnis: die doppelte Trennung, die ursprüngliche Akkumulation, den Vorrang der Reproduktion des Lebens, den Unterschied zwischen Arbeit und Arbeitskraft.", "titre_en": "Premises", "resume_en": "The theses of Spinoza and Marx that Lordon takes as starting points.", "loc": "", "body": "Les prémisses de Spinoza (S) renvoient à l'*Éthique* dans SpinozaGraph ou, pour le *Traité politique*, à l'article cité. Ce sont celles que Lordon invoque lui-même, presque toujours en note. Elles portent sur le conatus et le désir (S01, S03, S04), la vie affective (association, imitation, amour, crainte, force des affects), la détermination et l'illusion de la liberté (S10-S12), et le pouvoir (l'*obsequium*, S15).\n\nLes prémisses de Marx (M) portent sur le rapport salarial : la double séparation, l'accumulation primitive, la priorité de la reproduction de la vie, la différence du travail et de la force de travail.", "body_en": "The Spinoza premises (S) point to the *Ethics* in SpinozaGraph or, for the *Political Treatise*, to the article cited. They are the ones Lordon himself invokes, almost always in a note. They concern the conatus and desire (S01, S03, S04), affective life (association, imitation, love, fear, the strength of the affects), determination and the illusion of freedom (S10-S12), and power (*obsequium*, S15).\n\nThe Marx premises (M) concern the wage relation: the double separation, primitive accumulation, the priority of reproducing life, the difference between labour and labour power.", "file": "parties/P.md"}, {"id": "0", "titre": "Avant-propos", "resume": "La question du livre et sa méthode : combiner un structuralisme des rapports et une anthropologie des passions.\n", "titre_de": "Vorwort", "resume_de": "Die Frage des Buches und seine Methode: einen Strukturalismus der Verhältnisse mit einer Anthropologie der Leidenschaften verbinden.", "body_de": "Wie „können“ manche Menschen andere dazu bringen, in ihr Begehren einzutreten? Diese Macht ist eine Wirkung der Struktur (Marx), doch die Strukturen wirken durch die Affekte (Spinoza): T001. Die „glücklichen Beherrschten“ des heutigen Kapitalismus zwingen dazu, Herrschaft und Zustimmung neu zu denken, ohne auf die „freiwillige Knechtschaft“ zurückzugreifen; das Buch geht vom elementaren Dreieck aus dem Begehren des einen, der Handlungsmacht der anderen und den Affekten aus, die ihre Begegnung regieren: T002.", "titre_en": "Foreword", "resume_en": "The book's question and its method: combining a structuralism of relations with an anthropology of the passions.", "loc": "01", "body": "Comment certains hommes « peuvent »-ils en amener d'autres à entrer dans leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza) : T001. Les « dominés heureux » du capitalisme contemporain obligent à repenser la domination et le consentement sans recourir à la « servitude volontaire » ; le livre part du triangle élémentaire du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre : T002.", "body_en": "How \"can\" some men bring others to enter into their desire? This power is an effect of structure (Marx), but structures act through the affects (Spinoza): T001. The \"happy dominated\" of contemporary capitalism force us to rethink domination and consent without resorting to \"voluntary servitude\"; the book starts from the elementary triangle of the desire of one, the power of acting of others and the affects that govern their encounter: T002.", "file": "parties/0.md"}, {"id": "1", "titre": "Faire faire", "resume": "Le désir de faire faire : l'enrôlement des puissances d'agir, la dépendance à l'argent, la servitude passionnelle, l'alignement des désirs et sa radicalisation néolibérale.\n", "titre_de": "Andere tun lassen (Faire faire)", "resume_de": "Das Begehren, andere tun zu lassen: die Einspannung von Handlungsmächten, die Abhängigkeit vom Geld, die leidenschaftliche Knechtschaft, die Ausrichtung der Begehren und ihre neoliberale Radikalisierung.", "body_de": "**Was das Kapitel setzt.** Der Conatus ist die Energie des Begehrens (D01). Das Begehren zu tun ist legitim, nicht das Begehren, tun zu lassen, das Einspannung im Dienst eines Herrenbegehrens ist (T003, D02-D04). Die Lohnarbeit ist nur ein Fall des Patronats (T004).\n\n**Abhängigkeit und Herrschaft.** Die Reproduktion des nackten Lebens geht über das Geld: Das Lohnverhältnis ist zuerst Abhängigkeit (T006), also Herrschaft, die mächtigste, die es gibt (T007). Das Begehren ist heteronom (T008): Freiwillige Knechtschaft gibt es nicht, es gibt nur leidenschaftliche Knechtschaft (T009). Die Abhängigkeit ist asymmetrisch (T010) und bricht sich auf allen Stufen des Unternehmens (T011), wo sich Furcht und Gewalt ausbreiten (T012).\n\n**Die Mobilisierungsregime.** Die Lohnarbeit bindet auch durch Freude, die des Lohns und des Konsums (T013). Mobilisieren heißt ausrichten: das Vektormodell des Winkels α (D11, T014). Das neoliberale Unternehmen will α = 0 (T015); solange nichts es zurückhält, schreitet das Kapital voran und regiert durch Furcht (T016), ohne autonome Moral (T017), nach dem Vorbild der Liquidität (T018), bis zu Tyrannei und Terror (T019).", "titre_en": "Making others do (Faire faire)", "resume_en": "The desire to have others do: the enlistment of powers of acting, dependence on money, passional servitude, the alignment of desires and its neoliberal radicalisation.", "loc": "02–17", "body": "**Ce que le chapitre pose.** Le conatus est l'énergie du désir (D01). Le désir de faire est légitime, non le désir de faire faire, qui est enrôlement au service d'un désir-maître (T003, D02-D04). Le salariat n'est qu'un cas du patronat (T004).\n\n**La dépendance et la domination.** La reproduction de la vie nue passe par l'argent : le rapport salarial est d'abord dépendance (T006), donc domination, la plus puissante qui soit (T007). Le désir est hétéronome (T008) : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle (T009). La dépendance est asymétrique (T010) et se diffracte à tous les étages de l'entreprise (T011), où la crainte et la violence se propagent (T012).\n\n**Les régimes de mobilisation.** Le salariat attache aussi par la joie, du salaire et de la consommation (T013). Mobiliser, c'est aligner : le modèle vectoriel de l'angle α (D11, T014). L'entreprise néolibérale veut α = 0 (T015) ; tant que rien ne le retient, le capital avance et gouverne par la crainte (T016), sans morale autonome (T017), sur le modèle de la liquidité (T018), jusqu'à la tyrannie et la terreur (T019).", "body_en": "**What the chapter sets out.** The conatus is the energy of desire (D01). The desire to do is legitimate, not the desire to have others do, which is enlistment in the service of a master-desire (T003, D02-D04). Wage labour is only one case of bosshood (T004).\n\n**Dependence and domination.** The reproduction of bare life goes through money: the wage relation is first dependence (T006), hence domination, the most powerful there is (T007). Desire is heteronomous (T008): voluntary servitude does not exist, there is only passional servitude (T009). Dependence is asymmetrical (T010) and is diffracted at every level of the firm (T011), where fear and violence spread (T012).\n\n**Regimes of mobilisation.** Wage labour also binds through joy, that of the wage and of consumption (T013). Mobilising means aligning: the vector model of the angle α (D11, T014). The neoliberal firm wants α = 0 (T015); as long as nothing holds it back, capital advances and governs by fear (T016), without autonomous morality (T017), on the model of liquidity (T018), up to tyranny and terror (T019).", "file": "parties/1.md"}, {"id": "2", "titre": "Joyeux automobiles", "resume": "Les affects joyeux intrinsèques : faire désirer le travail lui-même ; le consentement, l'intériorité et l'aliénation repensés.\n", "titre_de": "Freudige Selbstbeweger (Joyeux automobiles)", "resume_de": "Die intrinsischen freudigen Affekte: die Arbeit selbst begehren lassen; Zustimmung, Innerlichkeit und Entfremdung neu gedacht.", "body_de": "**Das Vorhaben.** Der Kapitalismus ist ein Regime des Begehrens, eine Epithumè, deren Hervorbringung das neoliberale Unternehmen in die Hand nimmt (T020). Es zielt auf intrinsische freudige Affekte: die Tätigkeit um ihrer selbst willen begehren lassen (D15, T021).\n\n**Die Kritik der Zustimmung.** Zustimmung und Entfremdung gibt es nicht, so wie man sie gewöhnlich versteht: Alles ist bestimmt (T022). Die Macht ist eine Kunst des Affizierens (T023), die besser durch Liebe herrscht: Die Zustimmung ist glücklicher Gehorsam (T024). Zwang und Zustimmung sind nur traurige oder freudige Affekte; es gibt keine Innerlichkeit (T025).\n\n**Die Quellen des freudigen Gehorsams.** Die spontane Wiederverzauberung der Arbeit durch den Angestellten (T026), die Liebe zum Herrn und die Suche nach Anerkennung (T027), die Berufungsbilder, die die Gesellschaft hervorbringt (T028).\n\n**Das totalitäre Unternehmen und seine Grenzen.** Das neoliberale Unternehmen zielt auf den Besitz der Seelen (T029); das Begehren der Bewerber bleibt undurchsichtig (T030); die Freude lässt die Heteronomie vergessen (T031); der sichtbare Konstruktivismus zieht Hass auf sich (T032); das Coaching bringt *amor fati capitalistis* hervor (T033). Doch der Hintergrund trauriger Affekte bleibt, und die „Zustimmungen“ bleiben gemischt (T034).", "titre_en": "Joyful self-movers (Joyeux automobiles)", "resume_en": "Intrinsic joyful affects: making work itself desired; consent, interiority and alienation rethought.", "loc": "18–31", "body": "**Le projet.** Le capitalisme est un régime de désir, une épithumè, dont l'entreprise néolibérale prend en main la production (T020). Elle vise des affects joyeux intrinsèques : faire désirer l'activité pour elle-même (D15, T021).\n\n**La critique du consentement.** Le consentement et l'aliénation n'existent pas comme on les entend : tout est déterminé (T022). Le pouvoir est un art d'affecter (T023), qui règne mieux par l'amour : le consentement est l'obéissance heureuse (T024). Contrainte et consentement ne sont que des affects tristes ou joyeux ; il n'y a pas d'intériorité (T025).\n\n**Les sources de l'obéissance joyeuse.** Le réenchantement spontané du travail par le salarié (T026), l'amour du maître et la quête de reconnaissance (T027), les images vocationnelles que produit la société (T028).\n\n**L'entreprise totalitaire et ses limites.** L'entreprise néolibérale vise la possession des âmes (T029) ; le désir des recrutés reste opaque (T030) ; la joie fait oublier l'hétéronomie (T031) ; le constructivisme visible attire la haine (T032) ; le coaching produit l'*amor fati capitalistis* (T033). Mais le fond d'affects tristes demeure, et les « consentements » restent mitigés (T034).", "body_en": "**The project.** Capitalism is a regime of desire, an epithumè, whose production the neoliberal firm takes in hand (T020). It aims at intrinsic joyful affects: making the activity desired for its own sake (D15, T021).\n\n**The critique of consent.** Consent and alienation do not exist as they are usually understood: everything is determined (T022). Power is an art of affecting (T023), which reigns better through love: consent is happy obedience (T024). Constraint and consent are only sad or joyful affects; there is no interiority (T025).\n\n**The sources of joyful obedience.** The employee's spontaneous re-enchantment of work (T026), love of the master and the quest for recognition (T027), the vocational images society produces (T028).\n\n**The totalitarian firm and its limits.** The neoliberal firm aims at possessing souls (T029); the desire of recruits remains opaque (T030); joy makes one forget heteronomy (T031); visible constructivism attracts hatred (T032); coaching produces *amor fati capitalistis* (T033). But the background of sad affects remains, and \"consents\" stay mixed (T034).", "file": "parties/2.md"}, {"id": "3", "titre": "Domination, émancipation", "resume": "La domination et l'exploitation repensées par les passions ; la sédition, la récommune et les limites du communisme.\n", "titre_de": "Herrschaft, Emanzipation", "resume_de": "Herrschaft und Ausbeutung durch die Leidenschaften neu gedacht; der Aufruhr, die Récommune und die Grenzen des Kommunismus.", "body_de": "**Herrschaft und Ausbeutung.** Selbst freudig bleibt die Einspannung Herrschaft: Sie fixiert die Begehren und behält den einen vor, was sie den anderen vorenthält (D20, T035). Die Arbeitsteilung wird zu einer Teilung des Begehrens, durch das Imaginäre der Ohnmacht (D21, T036). Es gibt keinen objektiven Wert (T037): Die Ausbeutung gehört zu einer Politik der Vereinnahmung, sie ist leidenschaftlich (D22, T038).\n\n**Die Auswege.** Das neoliberale Vorhaben führt zur Alternative „Kommunismus oder Totalitarismus“ (T039). Die Récommune, ein als radikale Demokratie verfasstes Unternehmen, schafft das Lohnverhältnis ab (D23, T040), ohne den Kommunismus zu erschöpfen (T041).\n\n**Der Aufruhr.** Der Wandel verlangt keinen freien Willen: Die Empörung ordnet die Leidenschaften neu (T042) und lässt „senkrecht werden“ (D24, T043). Entfremdung ist Fixierung, Emanzipation Entfixierung (D25, T044). Die Klassenlandschaft spiegelt die leidenschaftliche Landschaft (T045); die Geschichte verzweigt sich durch die Unzufriedenheit, in einem Kampf affektiver Klassen (D26, T046).\n\n**Die Grenzen.** Die Vereinnahmung entsteht aus der Arbeitsteilung und der Ökonomie der Freude neu (T047); der wahre Kommunismus, das Leben unter der Vernunft, ist ein Horizont (T048); doch nicht alle leidenschaftlichen Regime sind gleichwertig, und Fortschritt ist die Bereicherung des Lebens an freudigen Affekten (T049).", "titre_en": "Domination, emancipation", "resume_en": "Domination and exploitation rethought through the passions; sedition, the récommune and the limits of communism.", "loc": "32–43", "body": "**La domination et l'exploitation.** Même joyeux, l'enrôlement reste domination : il fixe les désirs et réserve aux uns ce qu'il écarte des autres (D20, T035). La division du travail devient division du désir, par l'imaginaire de l'impuissance (D21, T036). Il n'y a pas de valeur objective (T037) : l'exploitation relève d'une politique de la capture, elle est passionnelle (D22, T038).\n\n**Les issues.** Le projet néolibéral mène à l'alternative « communisme ou totalitarisme » (T039). La récommune, entreprise constituée en démocratie radicale, abolit le rapport salarial (D23, T040), sans épuiser le communisme (T041).\n\n**La sédition.** Le changement n'exige pas le libre arbitre : l'indignation reconfigure les passions (T042) et fait « devenir perpendiculaire » (D24, T043). L'aliénation est fixation, l'émancipation défixation (D25, T044). Le paysage de classe reflète le paysage passionnel (T045) ; l'histoire bifurque par le mécontentement, en lutte de classes affectives (D26, T046).\n\n**Les limites.** La capture renaît de la division du travail et de l'économie de la joie (T047) ; le communisme véritable, vie sous la raison, est un horizon (T048) ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux (T049).", "body_en": "**Domination and exploitation.** Even joyful, enlistment remains domination: it fixes desires and reserves for some what it keeps from others (D20, T035). The division of labour becomes a division of desire, through the imaginary of powerlessness (D21, T036). There is no objective value (T037): exploitation belongs to a politics of capture, it is passional (D22, T038).\n\n**The ways out.** The neoliberal project leads to the alternative \"communism or totalitarianism\" (T039). The récommune, an enterprise constituted as a radical democracy, abolishes the wage relation (D23, T040), without exhausting communism (T041).\n\n**Sedition.** Change does not require free will: indignation reconfigures the passions (T042) and makes one \"become perpendicular\" (D24, T043). Alienation is fixation, emancipation defixation (D25, T044). The class landscape reflects the passional landscape (T045); history forks through discontent, in a struggle of affective classes (D26, T046).\n\n**The limits.** Capture is reborn from the division of labour and the economy of joy (T047); true communism, life under reason, is a horizon (T048); but not all passional regimes are equal, and progress is the enrichment of life in joyful affects (T049).", "file": "parties/3.md"}], "sections": {"01": {"titre": "Avant-propos", "partie": "0"}, "02": {"titre": "I. FAIRE FAIRE", "partie": "1"}, "03": {"titre": "Le désir de faire quelque chose", "partie": "1"}, "04": {"titre": "Le désir de faire faire : patronat et enrôlement", "partie": "1"}, "05": {"titre": "Intérêt, désir, mise en mouvement", "partie": "1"}, "06": {"titre": "La vie nue et l’argent", "partie": "1"}, "07": {"titre": "La monnaie rapport, l’argent désir", "partie": "1"}, "08": {"titre": "La servitude volontaire n’existe pas", "partie": "1"}, "09": {"titre": "L’asymétrie de l’initiative monétaire", "partie": "1"}, "10": {"titre": "Domination à tous les étages", "partie": "1"}, "11": {"titre": "Pressions ambiantes et remontée de la violence (contrainte actionnariale et concurrence)", "partie": "1"}, "12": {"titre": "Mobilisation joyeuse et aliénation marchande", "partie": "1"}, "13": {"titre": "L’enrôlement comme alignement", "partie": "1"}, "14": {"titre": "α =0 !", "partie": "1"}, "15": {"titre": "Intensification de la crainte", "partie": "1"}, "16": {"titre": "La liquidité, le fantasme du désir-maître capitaliste", "partie": "1"}, "17": {"titre": "Tyrannie et terreur", "partie": "1"}, "18": {"titre": "II. JOYEUX AUTOMOBILES (Salariés : les faire marcher)", "partie": "2"}, "19": {"titre": "Des affects joyeux intrinsèques", "partie": "2"}, "20": {"titre": "Les apories du consentement", "partie": "2"}, "21": {"titre": "L’obéissance joyeuse", "partie": "2"}, "22": {"titre": "Le ré-enchantement spontané", "partie": "2"}, "23": {"titre": "L’amour du maître", "partie": "2"}, "24": {"titre": "Les images vocationnelles", "partie": "2"}, "25": {"titre": "Le totalitarisme de la possession des âmes", "partie": "2"}, "26": {"titre": "Girl friend experience (après le don des larmes)", "partie": "2"}, "27": {"titre": "L’insondable mystère du désir enrôlé", "partie": "2"}, "28": {"titre": "Il n’y a pas d’intériorité (ni d’intériorisation)", "partie": "2"}, "29": {"titre": "Les risques du constructivisme du désir", "partie": "2"}, "30": {"titre": "Amor fati capitalistis", "partie": "2"}, "31": {"titre": "Le voile des affects joyeux, le fond des affects tristes", "partie": "2"}, "32": {"titre": "III. DOMINATION, ÉMANCIPATION", "partie": "3"}, "33": {"titre": "La domination repensée à l’usage du « consentement »", "partie": "3"}, "34": {"titre": "Division du désir et imaginaire de l’impuissance", "partie": "3"}, "35": {"titre": "L’exploitation passionnelle", "partie": "3"}, "36": {"titre": "Communisme ou totalitarisme (le totalitarisme, stade ultime de capitalisme)", "partie": "3"}, "37": {"titre": "Alors le (ré) communisme !", "partie": "3"}, "38": {"titre": "Les passions séditieuses", "partie": "3"}, "39": {"titre": "Devenir perpendiculaire", "partie": "3"}, "40": {"titre": "La défixation (critique de la (dés-) aliénation)", "partie": "3"}, "41": {"titre": "L’histoire comme mécontentement (brouillages et reconfigurations du paysage de classe)", "partie": "3"}, "42": {"titre": "Communisme… désir et servitude !", "partie": "3"}, "43": {"titre": "« Une viande humaine »", "partie": "3"}}, "problems": []};

// ---------- Markdown minimal ----------
function inline(s) {
  const keep = [];
  const hold = h => `\u0000${keep.push(h) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
  s = s.replace(/https?:\/\/[^\s<>»)]+/g, u => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?!\s)([^_]+?)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function markdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let out = "", i = 0;
  const isBlockStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (l.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><thead><tr>" + row(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) out += "<tr>" + row(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
      const stack = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s/.test(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && stack.length))) {
        const li = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!li) { out += " " + inline(lines[i].trim()); i++; continue; }
        const ind = li[1].length, tag = /\d/.test(li[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) { out += `<${tag}><li>`; stack.push({ ind, tag }); }
        else out += "</li><li>";
        out += inline(li[3]); i++;
      }
      while (stack.length) out += `</li></${stack.pop().tag}>`;
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += `<p>${inline(buf.join(" "))}</p>`;
  }
  return out;
}
// Transforme les identifiants en liens, hors <a>, <code>, <pre>.
function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement.closest("a, code, pre")) continue;
    if (/\b[DSMTR]\d{2,3}(?:-C\d+)?\b/.test(n.nodeValue)) targets.push(n);
  }
  for (const n of targets) {
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(/\b([DSMTR]\d{2,3}(?:-C\d+)?)\b/g, (m, id, off) => {
      frag.append(n.nodeValue.slice(last, off));
      const r = resolve(id);
      if (byId.has(r)) {
        const a = document.createElement("a");
        a.className = "ref"; a.href = "#" + r; a.textContent = id;
        a.style.setProperty("--c", color(r)); a.title = byId.get(r).titre + " — " + byId.get(r).enonce;
        frag.append(a);
      } else { const s = document.createElement("span"); s.className = "ref missing"; s.textContent = id; s.title = tr("Élément inexistant", "Missing element"); frag.append(s); }
      last = off + m.length;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  }
}

// Figure interactive : le désir-maître D, le conatus enrôlé d, l'angle α (D11, T014, D24, T043).
let alphaDeg = 35;
function renderAlpha() {
  const inner = $("#readerInner"); inner.style.removeProperty("--c");
  const ref = id => byId.has(id) ? pill(id, true) : "";
  inner.innerHTML = `<div class="alpha">
    <h1 class="title">${tr("L'angle α", "The angle α")}</h1>
    <p class="md" style="font-size:15px">${tr("Le modèle vectoriel de Lordon (13.3-13.7, 14.1, 39.5). Le désir-maître est un vecteur <b>D</b> ; chaque conatus enrôlé, un vecteur <b>d</b>. Seule la composante de <b>d</b> parallèle à <b>D</b>, de longueur |d| cos α, sert le désir-maître ; la composante orthogonale, |d| sin α, lui échappe.",
      "Lordon's vector model (13.3-13.7, 14.1, 39.5). The master-desire is a vector <b>D</b>; each enlisted conatus, a vector <b>d</b>. Only the component of <b>d</b> parallel to <b>D</b>, of length |d| cos α, serves the master-desire; the orthogonal component, |d| sin α, escapes it.")}</p>
    <svg viewBox="-150 -180 460 240" aria-label="${tr("Décomposition du conatus enrôlé selon le désir-maître", "Decomposition of the enlisted conatus along the master-desire")}">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
      </defs>
      <line x1="-140" y1="0" x2="300" y2="0" stroke="var(--line)" stroke-width="1"/>
      <line id="aD" x1="0" y1="0" x2="260" y2="0" stroke="var(--accent)" stroke-width="3" marker-end="url(#ah)"/>
      <text x="268" y="20" style="fill:var(--accent)">D</text>
      <line id="aD1" x1="0" y1="0" x2="0" y2="0" stroke="var(--these)" stroke-width="6" stroke-linecap="round" opacity=".55"/>
      <line id="aProj" x1="0" y1="0" x2="0" y2="0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
      <path id="aArc" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
      <text id="aLab" style="fill:var(--muted)">α</text>
      <line id="ad" x1="0" y1="0" x2="0" y2="0" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>
      <text id="adLab">d</text>
      <circle cx="0" cy="0" r="3.5" fill="var(--ink)"/>
    </svg>
    <div class="ctl"><label for="aRange">α = <b id="aVal"></b></label><input id="aRange" type="range" min="0" max="180" step="1" value="${alphaDeg}"></div>
    <div class="ctl presets">
      <button data-a="0">${tr("α = 0 : alignement intégral", "α = 0: complete alignment")}</button>
      <button data-a="35">${tr("dérive ordinaire", "ordinary drift")}</button>
      <button data-a="90">${tr("perpendiculaire", "perpendicular")}</button>
      <button data-a="180">α = 180°</button>
    </div>
    <div>${tr("Part captée par le désir-maître :", "Share captured by the master-desire:")} <b id="aCos"></b><div class="bar"><i id="aBar"></i></div></div>
    <div class="read" id="aRead"></div>
    <div class="md"><h2>${tr("Éléments", "Elements")}</h2></div>
    <div class="relsec">${["D11", "T014", "T015", "T029", "D24", "T043", "T044"].map(ref).join("")}</div>
  </div>`;
  const R = 200, set = a => {
    alphaDeg = a;
    const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    const x = R * c, y = -R * s;
    const at = (id, o) => { const n = document.getElementById(id); for (const k in o) n.setAttribute(k, o[k]); };
    at("ad", { x2: x, y2: y }); at("adLab", { x: x + (c >= 0 ? 10 : -22), y: y - 8 });
    at("aD1", { x2: x, y2: 0 }); at("aProj", { x1: x, y1: y, x2: x, y2: 0 });
    const ar = 46, large = a > 180 ? 1 : 0;
    at("aArc", { d: a === 0 ? "" : `M${ar},0 A${ar},${ar} 0 ${large} 0 ${ar * c},${-ar * s}` });
    const m = r / 2; at("aLab", { x: (ar + 14) * Math.cos(m) - 5, y: -(ar + 14) * Math.sin(m) + 5 });
    $("#aVal").textContent = a + "°";
    $("#aCos").textContent = `cos α = ${c.toFixed(2)}`;
    $("#aBar").style.width = Math.max(0, c) * 100 + "%";
    $("#aBar").style.background = c < 0 ? "var(--refutee)" : "var(--these)";
    $("#aRead").textContent = LANG === "de" ? (
      a === 0 ? "α = 0: vollkommene Kollinearität. Das eingespannte Begehren lebt ganz für das Herrenbegehren; das ist das Ideal des neoliberalen Unternehmens (14.3)." :
      a < 90 ? "Der eingespannte Conatus behält eine eigene Abweichung, sein Clinamen: Ein Teil seiner Anstrengung dient dem Herrenbegehren, der Rest entgeht ihm (14.1). α zu verkleinern ist die fixe Idee der Unternehmer." :
      a === 90 ? "Der rechte Winkel: cos α = 0, die Vereinnahmung ist null. Aufruhr ist Orthogonal-Werden: nicht die Tangente nehmen, sondern die Senkrechte (39.5)." :
      a < 180 ? "Jenseits des rechten Winkels entgeht der Conatus der Vereinnahmung nicht mehr nur: Er beginnt, gegen das Herrenbegehren zu ziehen (39.5)." :
      "α = 180°, cos α = -1: Die Neuausrichtung ist negativ, offen antagonistisch. Der Conatus entzieht dem Herrenbegehren Zugkraft (39.5, Abbildung 2-b).") :
      LANG === "en" ? (
      a === 0 ? "α = 0: perfect collinearity. The enlisted desire lives entirely for the master-desire; this is the ideal of the neoliberal firm (14.3)." :
      a < 90 ? "The enlisted conatus keeps a misalignment of its own, its clinamen: part of its effort serves the master-desire, the rest escapes it (14.1). Reducing α is the employer's obsession." :
      a === 90 ? "The right angle: cos α = 0, capture is nil. Sedition is becoming orthogonal: taking not the tangent but the perpendicular (39.5)." :
      a < 180 ? "Beyond the right angle, the conatus no longer merely escapes capture: it starts to pull against the master-desire (39.5)." :
      "α = 180°, cos α = -1: the realignment is negative, openly antagonistic. The conatus takes traction away from the master-desire (39.5, figure 2-b).") :
      a === 0 ? "α = 0 : la colinéarité parfaite. Le désir enrôlé « vit entièrement pour le désir-maître » ; c'est l'idéal de l'entreprise néolibérale (14.3)." :
      a < 90 ? "Le conatus enrôlé garde un désalignement propre, son clinamen : une part de son effort sert le désir-maître, le reste lui échappe (14.1). Réduire α est l'idée fixe patronale." :
      a === 90 ? "L'angle droit : cos α = 0, la capture est nulle. « La sédition c'est le devenir orthogonal – prendre non pas la tangente mais la perpendiculaire » (39.5)." :
      a < 180 ? "Au-delà de l'angle droit, le conatus ne se contente plus d'échapper à la capture : il commence à tirer contre le désir-maître (39.5)." :
      "α = 180°, cos α = -1 : le réalignement est négatif, « ouvertement antagoniste ». Le conatus ôte de sa traction au désir-maître (39.5, figure 2-b).";
  };
  $("#aRange").oninput = ev => set(+ev.target.value);
  inner.querySelectorAll(".presets [data-a]").forEach(btn => btn.onclick = () => { $("#aRange").value = btn.dataset.a; set(+btn.dataset.a); });
  set(alphaDeg);
}

      <tr><th></th><th>sad</th><th>joyful</th></tr>
      <tr><th>intrinsic</th>
        <td class="sad"><b>The goad of hunger</b>Working so as not to waste away: the desire to avoid an evil, bare life (13.1, 19.5).<br>${P(["D07", "T006", "T007"])}</td>
        <td class="joy"><b>Intrinsic joyful affects</b>Desiring work for its own sake: “fulfilment”, “self-realisation” (19.5, 21.1).<br>${P(["T021", "T024", "T026", "T027", "T028"])}</td></tr>
      <tr><th>extrinsic</th>
        <td class="empty">Lordon does not name this cell.</td>
        <td class="joy"><b>Consumerist joy</b>The goods the wage can buy: commodity alienation (12.2-12.4, 19.5).<br>${P(["T013"])}</td></tr>
    </table>
    <div class="md"><h2>Three successive regimes</h2></div>
    <ol class="timeline">
      <li style="--c:var(--refutee)"><b>Marx's regime</b>: the goad of hunger works the basic desire down to the bone (13.1). ${P(["T007"])}</li>
      <li style="--c:var(--these)"><b>The Fordist regime</b>: joyful commodity alienation and wider access to consumption are added to hunger (13.1, 19.4). ${P(["T013", "T015"])}</li>
      <li style="--c:var(--accent)"><b>The neoliberal regime</b>: the firm wants α = 0 and takes charge of producing desires; it adds intrinsic joyful affects (19.4-19.5), without ever erasing the background of fear (31.1). ${P(["T020", "T021", "T016", "T034"])}</li>
    </ol>
    <div class="md"><h2>What the difference does not change</h2></div>
    <p class="md" style="font-size:15px">Sad or joyful, one is equally determined: “constraint” and “consent” are only the names of sadness and joy in situations of power (21.4, 28.3), and “hard” and “soft” domination differ only in their affects (33.3). But to be chained and content is not the same as to be chained and sad (21.4): not all passional regimes are equal (43.2).</p>
    <div class="relsec">${P(["T025", "T035", "T049"])}</div>
  </div>`;
  linkify(inner);
}
function renderAudit() {
  const inner = $("#readerInner"); inner.style.removeProperty("--c");
  inner.innerHTML = `<div class="audit"><h1 class="title">${tr("Audit automatique", "Automatic audit")}</h1>
    <p class="hint">${tr("Contrôles mécaniques (AGENT.md § 8). Ils ne remplacent pas l'audit de fidélité : chaque élément relu contre le passage cité.", "Mechanical checks (AGENT.md § 8). They do not replace the fidelity audit: each element reread against the passage cited.")}</p>
    ${AUDIT.map(a => `<h3>${esc(a.title)} <span class="count ${a.items.length ? a.level : "ok"}">${a.items.length || "✓"}</span></h3>
      <p class="hint">${esc(a.hint)}</p>${a.items.length ? `<ul>${a.items.map(i => `<li>${i}</li>`).join("")}</ul>` : ""}`).join("")}</div>`;
}

// ---------- Routage ----------
// ---------- Historique (synchronisé avec celui du navigateur) ----------
const HKEY = "explorer-history";
let hist = { stack: [], i: -1 };
try { hist = JSON.parse(sessionStorage.getItem(HKEY)) || hist; } catch {}
function track(h) {
  const st = history.state;
  if (st && typeof st.i === "number" && hist.stack[st.i] === h) hist.i = st.i;      // précédent / suivant / rechargement
  else if (hist.stack[hist.i] !== h) {                                               // nouvelle visite
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(h); hist.i = hist.stack.length - 1;
    if (hist.stack.length > 200) { hist.stack.shift(); hist.i--; }
    history.replaceState({ i: hist.i }, "");
  } else history.replaceState({ i: hist.i }, "");
  try { sessionStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
  renderTrail();
}
function label(h) {
  if (h === "home") return { t: tr("Vue d'ensemble", "Overview") };
  if (h === "audit") return { t: "Audit" };
  if (h === "alpha") return { t: tr("L'angle α", "The angle α") };
  if (h === "regimes") return { t: tr("Les régimes d'affects", "Regimes of affects") };
  if (h.startsWith("doc:")) return { t: h.slice(4) };
  if (h.startsWith("partie:")) return { t: partLabel(h.slice(7)) };
  return { id: h, t: byId.get(h)?.titre || tr("manquant", "missing"), c: color(h) };
}
function renderTrail() {
  $("#back").disabled = hist.i <= 0;
  $("#fwd").disabled = hist.i >= hist.stack.length - 1;
  const from = Math.max(0, hist.i - 7), to = Math.min(hist.stack.length, hist.i + 3);
  const steps = [];
  for (let k = from; k < to; k++) {
    const L = label(hist.stack[k]), cur = k === hist.i;
    steps.push(`<button class="step ${cur ? "cur" : ""} ${k > hist.i ? "fwd" : ""}" data-k="${k}" ${L.c ? `style="--c:${L.c}"` : ""} title="${esc((L.id ? L.id + " — " : "") + L.t)}">${L.id ? esc(L.id) + (cur ? `<span class="tt">${esc(L.t)}</span>` : "") : esc(L.t)}</button>`);
  }
  $("#trail").innerHTML = hist.stack.length > 1 ? `<span class="lbl">${from > 0 ? "… " : ""}${tr("Historique", "History")}</span>` + steps.join(`<span class="arrow">›</span>`) : "";
}
// Aller à une page : si c'est la page précédente (ou suivante) de l'historique,
// s'y déplacer au lieu de créer une nouvelle entrée.
function go(h) {
  h = String(h || "home");
  if (hist.stack[hist.i] === h) return;
  if (hist.i > 0 && hist.stack[hist.i - 1] === h) history.back();
  else if (hist.stack[hist.i + 1] === h) history.forward();
  else location.hash = h;
}
document.addEventListener("click", ev => {
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
$("#back").onclick = () => history.back();
$("#fwd").onclick = () => history.forward();
$("#trail").onclick = ev => { const b = ev.target.closest("[data-k]"); if (b) { const d = +b.dataset.k - hist.i; if (d) history.go(d); } };

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  track(h);
  const prevSel = state.sel;
  renderView(h);
  $("#reader").scrollTop = 0;
  renderList();
  renderGraph(state.mode !== "all" && prevSel !== state.sel);
  document.querySelector("#list .sel")?.scrollIntoView({ block: "nearest" });
}
function renderView(h) {
  if (h === "home") { state.view = "home"; state.sel = null; renderHome(); }
  else if (h === "audit") { state.view = "audit"; state.sel = null; renderAudit(); }
  else if (h === "alpha") { state.view = "alpha"; state.sel = null; renderAlpha(); }
  else if (h === "regimes") { state.view = "regimes"; state.sel = null; renderRegimes(); }
  else if (h.startsWith("doc:")) { state.view = "doc:" + h.slice(4); state.sel = null; renderDoc(h.slice(4)); }
  else if (h.startsWith("partie:")) { state.view = h; state.sel = null; renderPartie(h.slice(7)); }
  else { state.view = "el"; state.sel = h; renderElement(h); }
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => fit());
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.target.matches?.("input")) { if (ev.key === "Escape") { ev.target.value = ""; state.q = ""; renderList(); ev.target.blur(); } return; }
  if (ev.key === "/") { ev.preventDefault(); $("#search").focus(); }
  else if (ev.key === "Escape") go("home");
  else if (ev.key === "[") stepSeq(-1);
  else if (ev.key === "]") stepSeq(1);
  else if (ev.key === "Backspace") history.back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "r" || ev.key === "R") $("#read").click();
  else if ("1234".includes(ev.key)) document.querySelectorAll("#toolbar [data-mode]")[+ev.key - 1].click();
});

// Textes fixes de l'interface, et bascule de langue.
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tr("Capitalisme, désir et servitude — treillis", "Capitalisme, désir et servitude (Willing Slaves of Capital) — lattice");
  $("#back").title = tr("Précédent (Alt+←)", "Back (Alt+←)");
  $("#fwd").title = tr("Suivant (Alt+→)", "Forward (Alt+→)");
  $("#search").placeholder = tr("Rechercher (id, titre, texte) — touche /", "Search (id, title, text) — key /");
  const modes = { all: ["Tout", "All", "Tout le graphe ; la sélection met en évidence ses appuis et ses conséquences", "Whole graph; the selection highlights its grounds and consequences"],
    anc: ["Chemin vers", "Path to", "Seulement le chemin qui mène à l'élément sélectionné", "Only the path leading to the selected element"],
    desc: ["Conséquences", "Consequences", "Seulement ce qui découle de l'élément sélectionné", "Only what follows from the selected element"],
    near: ["Voisinage", "Neighbours", "Voisins directs", "Direct neighbours"] };
  for (const [m, [f, en, tf, ten]] of Object.entries(modes)) { const x = $(`#toolbar [data-mode="${m}"]`); x.textContent = tr(f, en); x.title = tr(tf, ten); }
  $("#fit").textContent = tr("Recadrer", "Fit"); $("#fit").title = tr("Recadrer (touche F)", "Fit (key F)");
  $("#read").textContent = tr("Lecture", "Read"); $("#read").title = tr("Masquer le graphe pour lire (touche R)", "Hide the graph to read (key R)");
  $("#empty").textContent = tr("Aucun élément à afficher avec ces filtres.", "No element to show with these filters.");
  $("#resizer").title = tr("Glisser pour redimensionner", "Drag to resize");
  $("#meta").textContent = tr(`${els.length} éléments · généré le ${DATA.generated}`, `${els.length} elements · generated ${DATA.generated}`, `${els.length} Elemente · erzeugt am ${DATA.generated}`);
  document.querySelectorAll(".langsw [data-lang]").forEach(x => { x.classList.toggle("on", x.dataset.lang === LANG); x.setAttribute("aria-pressed", x.dataset.lang === LANG); });
  renderLegend();
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l;
  try { localStorage.setItem("treillis-lang", l); } catch {}
  const u = new URL(location.href); u.searchParams.set("lang", l);
  history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  applyData(); setLabels(); runAudit(); applyStatic();
  renderFilters(); renderTrail(); renderView(decodeURIComponent(location.hash.slice(1)) || "home"); renderList(); renderGraph();
}
document.querySelector(".langsw").onclick = ev => { const x = ev.target.closest("[data-lang]"); if (x) setLang(x.dataset.lang); };
applyStatic();
renderFilters();
route();
requestAnimationFrame(fit);
</script>
</body>
