titre_de": "Macht ist eine Kunst des Affizierens", "enonce_de": "Macht ist eine Kunst, andere tun zu lassen; und andere tun zu lassen ist die eigentliche Wirkung der Affekte, da ein Affekt den Conatus umlenkt und das Begehren entstehen lässt, etwas zu tun. Regieren heißt, Conatus in bestimmte Richtungen auszurichten: Macht ist die Gesamtheit der Praktiken der Kollinearisierung.", "body_de": "## Beweis\n\n1. Die Macht, mit Foucault als „Handeln auf Handlungen“ gesehen, ist eine *Kunst, andere tun zu lassen* (20.2, 21.2).\n2. Nach T008 erzeugt eine Affektion in mir einen Affekt und lässt mich dadurch etwas tun: Aus einem Affekt folgen eine Umlenkung des Conatus und das Begehren zu handeln (21.2).\n3. Die Macht ist also in ihrer Wirkungsweise Hervorbringung von Affekten und Anstoß auf dem Weg der Affekte; regieren heißt lenken im geometrischen Sinn, Conatus-Vektoren ausrichten (D11) (21.2). ∎\n\n## Anmerkung\n\nSpinozas politische Philosophie erweist sich so als Philosophie der Mächte und Normen aller Institutionen und nicht nur des Gemeinwesens: Die Angestellten stehen unter der Herrschaft des Unternehmens wie die Bürger unter der des Staates (21.2).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D11", "T008"], "citation": "« Le pouvoir est l’ensemble des pratiques de la colinéarisation. »", "loc": ["20.2", "21.2"], "depends_on": ["T008", "D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le pouvoir, envisagé avec Foucault comme « action sur des actions », est un *art de faire faire* (20.2, 21.2).\n2. Par T008, une affection produit en moi un affect, et par suite me fait faire quelque chose : d'un affect résultent une redirection du conatus et le désir d'agir (21.2).\n3. Donc le pouvoir, dans son mode opératoire, est production d'affects et induction par voie d'affects ; gouverner, c'est diriger au sens géométrique, orienter les conatus-vecteurs (D11) (21.2). ∎\n\n## Scolie\n\nLa philosophie politique de Spinoza se révèle ainsi philosophie des pouvoirs et des normes de toutes les institutions, et pas seulement de la Cité : les salariés sont sous l'empire de l'entreprise comme les citoyens sous celui de l'État (21.2).", "body_en": "## Demonstration\n\n1. Power, seen with Foucault as \"action upon actions\", is an *art of having others do* (20.2, 21.2).\n2. By T008, an affection produces an affect in me, and thereby makes me do something: from an affect result a redirection of the conatus and the desire to act (21.2).\n3. So power, in its mode of operation, is the production of affects and induction by way of affects; governing is directing in the geometrical sense, orienting conatus-vectors (D11) (21.2). ∎\n\n## Scholium\n\nSpinoza's political philosophy thus turns out to be a philosophy of the powers and norms of all institutions, and not only of the Commonwealth: employees are under the rule of the firm as citizens are under that of the State (21.2).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D11", "T008"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D11", "T008"], "mentions": ["D11", "T008"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T024", "file": "theses/T024.md", "type": "these", "partie": "2", "titre": "Le pouvoir règne mieux par l'amour : l'obéissance joyeuse", "enonce": "Tout pouvoir, y compris patronal, fonctionne à la crainte ou à l'amour, et découvre qu'il est plus efficace de régner par l'amour. Réjouir l'assujetti en lui proposant des désirs qu'il prend pour les siens, et qui deviennent les siens, le met en mouvement sans réserve : le consentement a pour vrai nom l'obéissance heureuse.", "titre_en": "Power reigns better through love: joyful obedience", "enonce_en": "Every power, including the employer's, runs on fear or on love, and discovers that it is more effective to reign through love. Gladdening the subject by offering him desires he takes for his own, and which become his own, sets him moving without reserve: the true name of consent is happy obedience.", "titre_de": "Die Macht herrscht besser durch Liebe: der freudige Gehorsam", "enonce_de": "Jede Macht, auch die des Arbeitgebers, läuft mit Furcht oder mit Liebe und entdeckt, dass es wirksamer ist, durch Liebe zu herrschen. Den Untertan zu erfreuen, indem man ihm Begehren anbietet, die er für seine eigenen hält und die seine eigenen werden, setzt ihn rückhaltlos in Bewegung: Der wahre Name der Zustimmung ist glücklicher Gehorsam.", "body_de": "## Argumentation\n\n1. Nach T023 verfährt die Macht durch Affekte; nach D16 hat das Obsequium zwei reine Formeln, Furcht und Liebe: Das gilt für alle Mächte, auch die des Arbeitgebers (21.3).\n2. Nach S16 streben die Menschen nach einem menschlichen Leben; doch die Reproduktion des nackten Lebens, für die der Lohn sorgt (T006), geht kaum über „den Kreislauf des Blutes“ hinaus und bietet der Handlungsmacht keinen Horizont (21.3).\n3. Den Untertan zu erfreuen, indem man diese Entfaltung ordnet, aber in den Richtungen des Herrenbegehrens, ist daher die wirksame Strategie: Das Subjekt setzt sich rückhaltlos in Bewegung, wenn man ihm Begehren anbietet, die es für seine eigenen hält (21.3).\n4. Gehorchen bleibt dennoch eine Last, denn die Menschen stehen nicht gern unter der Fuchtel ihresgleichen; da der Individualismus die Sakralisierung der Könige zerstört hat, müssen die Unternehmer andere Verfahren finden, um Gehorsam ohne Last hervorzubringen (21.4). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D16", "S16", "T006", "T023"], "citation": "« l’univers sucré du consentement, dont le vrai nom est l’obéissance heureuse »", "loc": ["21.3", "21.4"], "depends_on": ["T023", "D16", "S16", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T023, le pouvoir procède par affects ; par D16, l'obsequium a deux formules pures, la crainte et l'amour : c'est vrai de tous les pouvoirs, y compris le pouvoir patronal (21.3).\n2. Par S16, les hommes aspirent à une vie humaine ; or la reproduction de la vie nue, à laquelle le salaire pourvoit (T006), ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon à la puissance d'agir (21.3).\n3. Réjouir l'assujetti en organisant ce déploiement, mais dans les directions du désir-maître, est donc la stratégie efficace : l'assujetti se met en mouvement sans réserve quand on lui propose des désirs qu'il prend pour les siens (21.3).\n4. Obéir est pourtant un fardeau, car les hommes n'aiment pas être sous la coupe de leurs égaux ; l'individualisme ayant ruiné la sacralisation des rois, les patrons doivent trouver d'autres procédés pour produire de l'obéissance sans fardeau (21.4). ∎", "body_en": "## Argument\n\n1. By T023, power proceeds through affects; by D16, obsequium has two pure formulas, fear and love: this is true of all powers, including the employer's (21.3).\n2. By S16, men aspire to a human life; but the reproduction of bare life, which the wage provides for (T006), hardly goes beyond \"the circulation of the blood\" and offers no horizon to the power of acting (21.3).\n3. Gladdening the subject by organising this unfolding, but in the directions of the master-desire, is therefore the effective strategy: the subject sets himself moving without reserve when offered desires he takes for his own (21.3).\n4. Obeying is nonetheless a burden, for men do not like being under the thumb of their equals; individualism having ruined the sacralisation of kings, bosses must find other procedures to produce obedience without burden (21.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D16", "S16", "T006", "T023"], "sections": ["Argumentation"], "demo_refs": ["D16", "S16", "T006", "T023"], "mentions": ["D16", "S16", "T006", "T023"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T025", "file": "theses/T025.md", "type": "these", "partie": "2", "titre": "Contrainte et consentement ne sont que des affects tristes ou joyeux", "enonce": "Contrainte et consentement ne se distinguent ni par la liberté ni par la topologie (l'extérieur contre l'intérieur), mais par les affects : être contraint, c'est être déterminé à faire quelque chose en s'en trouvant triste ; consentir, c'est vivre l'obéissance allégée par un affect joyeux. Il n'y a pas d'intériorité ; il n'y a que des assujettissements heureux ou tristes.", "titre_en": "Constraint and consent are only sad or joyful affects", "enonce_en": "Constraint and consent are distinguished neither by freedom nor by topology (the outside against the inside), but by the affects: to be constrained is to be determined to do something while being saddened by it; to consent is to live obedience lightened by a joyful affect. There is no interiority; there are only happy or sad subjections.", "titre_de": "Zwang und Zustimmung sind nur traurige oder freudige Affekte", "enonce_de": "Zwang und Zustimmung unterscheiden sich weder durch die Freiheit noch durch eine Topologie (das Außen gegen das Innen), sondern durch die Affekte: Gezwungen sein heißt, bestimmt zu sein, etwas zu tun, und darüber traurig zu werden; zustimmen heißt, einen von einem freudigen Affekt erleichterten Gehorsam zu leben. Es gibt keine Innerlichkeit; es gibt nur glückliche oder traurige Unterwerfungen.", "body_de": "## Beweis\n\n1. Nach T022 sind alle gleichermaßen ihren Leidenschaften unterworfen; doch zufrieden oder traurig angekettet zu sein, „ist nicht dasselbe“ (21.4).\n2. „Zwang“ und „Zustimmung“ sind daher die Namen, die Traurigkeit und Freude in Machtsituationen annehmen (T024). Sie bezeichnen nicht zwei objektive Vorgänge (R09): Die objektive Tatsache ist die kausale Bestimmung, und man ist nicht weniger bestimmt, wenn man zustimmt (21.4).\n3. Die Zustimmung will immer auf den inneren „Kern“ des Subjekts zurückgehen (R08) (28.1). Doch nach S21 sind Geist und Körper ein Ding unter zwei Attributen, ohne Einwirkung des einen auf den anderen; nach S20 sind die Affekte Affektionen des Körpers *und* deren Ideen; diese Ideen, die zum Denken gehören, sind ohne Ort, und unsere Gemütszustände lassen sich nicht „innere“ nennen (28.2).\n4. Zustimmung und Innerlichkeit sind daher gemeinsam ohne Sinn, wie die Antinomien von Zwang und Legitimität, von *hard* und *soft power*; ihr wahrer Unterschied läuft auf die Polarität von freudig und traurig hinaus (28.3). ∎\n\n## Anmerkung\n\nDas französische Wort *joug*, Joch, sagt beides: „Ich stehe unter dem Joch“ und „Ich bin unterjocht“ (28.3). Wenn Spinoza die Namen der Affekte neu bildet, dann, um sich nicht von den Wörtern der Erkenntnis erster Gattung fangen zu lassen, die in der Nähe der Affekte gebildet sind (21.4, Anm. 60-62).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["R08", "R09", "S20", "S21", "T022", "T024"], "citation": "« Le consentant n’est pas plus libre que quiconque, et pas moins “plié” que l’asservi : il est juste plié différemment et vit joyeusement sa détermination. »", "loc": ["21.4", "28.1", "28.2", "28.3"], "depends_on": ["T022", "T024", "S20", "S21"], "contre": ["R08", "R09"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T022, tous sont également asservis à leurs passions ; mais « enchaîné content ou enchaîné triste, ça n'est pas la même chose » (21.4).\n2. « Contrainte » et « consentement » sont donc les noms que prennent la tristesse et la joie dans des situations de pouvoir (T024). Ils ne désignent pas deux opérations objectives (R09) : le fait objectif est la détermination causale, et l'on n'est pas moins déterminé quand on consent (21.4).\n3. Le consentement veut toujours retourner au « noyau » intérieur du sujet (R08) (28.1). Or, par S21, l'âme et le corps sont une seule chose sous deux attributs, sans action de l'un sur l'autre ; par S20, les affects sont des affections du corps *et* leurs idées ; ces idées, relevant de la Pensée, sont sans lieu, et nos états d'âme ne sauraient être dits « intérieurs » (28.2).\n4. Consentement et intériorité sont donc solidairement vides de sens, comme les antinomies de la coercition et de la légitimité, du *hard* et du *soft power* ; leur différence vraie se ramène à la polarité du joyeux et du triste (28.3). ∎\n\n## Scolie\n\nLe mot « joug » dit les deux : « je suis sous le joug » et « je suis subjugué » (28.3). Si Spinoza refait les noms des affects, c'est pour ne pas se laisser prendre aux mots de la connaissance du premier genre, formée au voisinage des affects (21.4, notes 60-62).", "body_en": "## Demonstration\n\n1. By T022, all are equally enslaved to their passions; but to be chained and content or chained and sad \"is not the same thing\" (21.4).\n2. \"Constraint\" and \"consent\" are therefore the names that sadness and joy take in situations of power (T024). They do not designate two objective operations (R09): the objective fact is causal determination, and one is no less determined when one consents (21.4).\n3. Consent always wants to return to the subject's inner \"core\" (R08) (28.1). But, by S21, mind and body are one thing under two attributes, with no action of one on the other; by S20, affects are affections of the body *and* their ideas; these ideas, belonging to Thought, are without place, and our states of mind cannot be called \"inner\" (28.2).\n4. Consent and interiority are therefore jointly void of meaning, like the antinomies of coercion and legitimacy, of *hard* and *soft power*; their true difference comes down to the polarity of joyful and sad (28.3). ∎\n\n## Scholium\n\nThe French word *joug*, yoke, says both: \"I am under the yoke\" and \"I am subjugated\" (28.3). If Spinoza remakes the names of the affects, it is so as not to be caught by the words of knowledge of the first kind, formed in the vicinity of the affects (21.4, notes 60-62).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R08", "R09", "S20", "S21", "T022", "T024"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R08", "R09", "S20", "S21", "T022", "T024"], "mentions": ["R08", "R09", "S20", "S21", "T022", "T024"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T026", "file": "theses/T026.md", "type": "these", "partie": "2", "titre": "Le ré-enchantement spontané du travail", "enonce": "Le désir étant axiogène et le conatus cherchant sa joie, le salarié peut lui-même recolorer sa situation et retrouver de l'intérêt et du sens dans des tâches imposées. Face à la menace du travail vide de sens, il n'a que deux parades : s'avouer sa déréliction (et se résigner ou se révolter), ou la repousser en recréant un désir propre, aligné mais distinct du désir-maître.", "titre_en": "The spontaneous re-enchantment of work", "enonce_en": "Since desire is axiogenic and the conatus seeks its joy, the employee can himself recolour his situation and find interest and meaning again in imposed tasks. Faced with the threat of meaningless work, he has only two defences: to admit his dereliction to himself (and resign himself or rebel), or to push it back by recreating a desire of his own, aligned with but distinct from the master-desire.", "titre_de": "Die spontane Wiederverzauberung der Arbeit", "enonce_de": "Da das Begehren axiogen ist und der Conatus seine Freude sucht, kann der Angestellte seine Lage selbst neu einfärben und in auferlegten Aufgaben wieder Interesse und Sinn finden. Gegen die Drohung sinnloser Arbeit hat er nur zwei Abwehrmittel: sich seine Verlassenheit einzugestehen (und sich zu fügen oder sich aufzulehnen) oder sie zurückzudrängen, indem er ein eigenes Begehren neu schafft, ausgerichtet auf das Herrenbegehren, aber von ihm verschieden.", "body_de": "## Argumentation\n\n1. Die Affekte, die den Gehorsam erleichtern, kommen zuerst vom Angestellten selbst (22.1): Nach D17 erzwingt keine Lage von sich aus einen Wert oder einen Sinn; sie werden von den begehrenden Kräften hervorgebracht, die sich ihrer bemächtigen (22.2).\n2. Die auferlegte Aufgabe tritt höchstwahrscheinlich als betrübende Sache in die Komplexion der Eingespannten ein. Doch nach S17 sucht der Conatus seine Freude und kann die ungünstigsten Lagen neu besetzen (22.4).\n3. Der Einspannende zieht aus dieser Neigung Kapital: Die Gleichgültigkeit gegenüber den Inhalten der „abstrakten Arbeit“, die die marxistische Kritik ausgemacht hat, ist eine sehr starke, aber keine unwiderstehliche Tendenz (22.5).\n4. Gegen die Drohung, seine Handlungsmacht im Dienst eines fremden Begehrens umsonst zu verausgaben, gibt es nur zwei Abwehrmittel. Entweder gesteht das Subjekt es sich ein: Es fügt sich („das wahre Leben ist anderswo“), fällt sogar in Depression, oder es lehnt sich auf, da die Traurigkeit die Handlungsmacht vermehrt, die sie bekämpft (S09). Oder es schafft sich ein eigenes Begehren neu, ausgerichtet auf das Herrenbegehren, aber von ihm verschieden, unter der Wirkung eines Metabegehrens, freudig zu leben (22.8). ∎\n\n## Anmerkung\n\nAuf der Seite des Kapitals hängen auch Industrielle an ihrem besonderen „Machen“, mit beruflichen Identitäten (der Identität des „Erbauers“, des geschichtlichen Trägers technischen Fortschritts), während das Finanzkapital, durch Streuung und Liquidität von jedem Inhalt gelöst, kein anderes Begehren bilden kann als das nach Rendite (22.6-22.7). Ein Grenzfall des Conatus, der seine Freude sucht: Elias, den Primo Levi in Auschwitz als „wahrscheinlich einen glücklichen Menschen“ beschreibt (22.4).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D17", "S09", "S17"], "citation": "", "loc": ["22.1", "22.2", "22.4", "22.5", "22.8"], "depends_on": ["D17", "S17", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les affects qui allègent l'obéissance viennent d'abord du salarié lui-même (22.1) : par D17, aucune situation n'impose par elle-même une valeur ou un sens ; ils sont produits par les forces désirantes qui s'en saisissent (22.2).\n2. La tâche imposée entre le plus probablement dans la complexion de l'enrôlé comme chose attristante. Mais, par S17, le conatus cherche sa joie, et peut réinvestir les situations les plus défavorables (22.4).\n3. L'enrôleur capitalise sur cette propension : l'indifférence aux contenus du « travail abstrait », identifiée par la critique marxiste, est une tendance très puissante, mais pas irrésistible (22.5).\n4. Contre la menace de dépenser sa puissance d'agir en pure perte au service d'un désir étranger, il n'y a que deux parades. Ou bien le sujet se l'avoue : il se résigne (« la vraie vie est ailleurs »), voire déprime, ou bien il se révolte, la tristesse augmentant la puissance d'agir qui lutte contre elle (S09). Ou bien il recrée un désir propre, aligné mais distinct du désir-maître, sous l'effet d'un métadésir de vivre joyeux (22.8). ∎\n\n## Scolie\n\nCôté capital, les industriels s'attachent aussi à leur « faire » particulier, avec des identités vocationnelles (identité de « bâtisseur », d'agent historique du progrès technique), alors que le capital financier, détaché de tout contenu par la diversification et la liquidité, ne peut former aucun autre désir que celui du rendement (22.6-22.7). Cas limite du conatus qui cherche sa joie : Elias, que Primo Levi décrit à Auschwitz comme « vraisemblablement un homme heureux » (22.4).", "body_en": "## Argument\n\n1. The affects that lighten obedience come first from the employee himself (22.1): by D17, no situation imposes a value or a meaning by itself; they are produced by the desiring forces that take hold of it (22.2).\n2. The imposed task most probably enters the complexion of the enlisted as a saddening thing. But, by S17, the conatus seeks its joy, and can reinvest the most unfavourable situations (22.4).\n3. The enlister capitalises on this propensity: indifference to the contents of \"abstract labour\", identified by Marxist critique, is a very powerful tendency, but not an irresistible one (22.5).\n4. Against the threat of spending one's power of acting for nothing in the service of an alien desire, there are only two defences. Either the subject admits it to himself: he resigns himself (\"real life is elsewhere\"), even falls into depression, or he rebels, sadness increasing the power of acting that fights against it (S09). Or he recreates a desire of his own, aligned with but distinct from the master-desire, under the effect of a meta-desire to live joyfully (22.8). ∎\n\n## Scholium\n\nOn the side of capital, industrialists also become attached to their particular \"making\", with vocational identities (the identity of \"builder\", of historical agent of technical progress), whereas financial capital, detached from all content by diversification and liquidity, can form no desire other than for returns (22.6-22.7). A limit case of the conatus seeking its joy: Elias, whom Primo Levi describes at Auschwitz as \"probably a happy man\" (22.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D17", "S09", "S17"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D17", "S09", "S17"], "mentions": ["D17", "S09", "S17"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T027", "file": "theses/T027.md", "type": "these", "partie": "2", "titre": "L'amour du maître", "enonce": "Les affects d'obéissance viennent surtout du dehors, notamment de l'amour du maître : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui. Ce mécanisme général de la demande de reconnaissance fait épouser au subordonné le désir du supérieur, le long de chaînes de dépendance qui sont aussi des chaînes de reconnaissance. Ce désir est pleinement le sien : rien d'« étranger » là-dedans.", "titre_en": "Love of the master", "enonce_en": "The affects of obedience come above all from outside, notably from love of the master: I do what gladdens the master so that he loves me and so that I rejoice in having gladdened him. This general mechanism of the demand for recognition makes the subordinate espouse the desire of the superior, along chains of dependence that are also chains of recognition. This desire is fully his own: nothing \"alien\" in it.", "titre_de": "Die Liebe zum Herrn", "enonce_de": "Die Affekte des Gehorsams kommen vor allem von außen, insbesondere aus der Liebe zum Herrn: Ich tue, was den Herrn erfreut, damit er mich liebt und damit ich mich freue, ihn erfreut zu haben. Dieser allgemeine Mechanismus der Forderung nach Anerkennung lässt den Untergebenen das Begehren des Vorgesetzten übernehmen, entlang von Abhängigkeitsketten, die auch Anerkennungsketten sind. Dieses Begehren ist ganz das seine: nichts „Fremdes“ daran.", "body_de": "## Beweis\n\n1. Nach S18 ist Liebe eine Freude, begleitet von der Vorstellung einer äußeren Ursache: Ich gehorche dem Herrn, weil er die vorgestellte Ursache von Wohltaten ist, die mich erfreuen (23.1).\n2. Nach S19 strebe ich, zu tun, was ihn erfreut, und freue mich, mich als Ursache seiner Freude vorzustellen: zuerst der Affekt, von ihm geliebt zu werden, dann der, sich selbst zu lieben. Der „Herr“ kann der Guru sein, die Eltern, der Lehrer, der Chef, die öffentliche Meinung (23.1).\n3. Dieser Mechanismus ist dem Conatus als Streben nach Freude eingeschrieben; er muss keine Sublimierung der Elternliebe sein (R10), die nur sein erster Angriffspunkt ist (23.2).\n4. Im Unternehmen führt er den, der fordert, dazu, das Begehren dessen, der gibt, zu übernehmen und vorwegzunehmen; nach T011 ist er der hierarchischen Struktur eingeschrieben, da die Abhängigkeitsketten *auch* Ketten der Abhängigkeit von Anerkennung sind (23.3).\n5. Nach S09 begehrt ein von Freude affizierter Mensch, sie zu bewahren: Der Angestellte betätigt sich freudig im Dienst eines Begehrens, das ganz das seine wird. Nach T022 ist dieses Begehren nicht „fremd“ gegenüber einem autonomen Kern, den es nicht gibt; die einzige Entfremdung ist die allgemeine leidenschaftliche Knechtschaft (23.3). ∎\n\n## Anmerkung\n\nDie Ausweitung der Lohnforderungen vom Geld auf die Anerkennung, ein zentrales Thema der Arbeitssoziologie, bedeutet also, „die Freude an der Freude dessen zu erlangen, dem man seine Arbeit bringt, und damit seine Liebe“ (23.1). Der Übereifrige, der Klassenliebling, der Unterwürfige („treffend benanntes Musterbild des *obsequium*“) suchen ebenfalls die Freude, vom Vorgesetzten und von der Institution geliebt zu werden (23.3).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["R10", "S09", "S18", "S19", "T011", "T022"], "citation": "", "loc": ["23.1", "23.2", "23.3"], "depends_on": ["S18", "S19", "S09", "T011", "T022"], "contre": ["R10"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par S18, l'amour est une joie accompagnée de l'idée d'une cause extérieure : j'obéis au maître parce qu'il est la cause imaginée de bienfaits qui me réjouissent (23.1).\n2. Par S19, je m'efforce de faire ce qui le réjouit, et je me réjouis de m'imaginer cause de sa joie : premier affect d'en être aimé, second de s'aimer soi-même. Le « maître » peut être le gourou, le parent, le professeur, le patron, l'opinion publique (23.1).\n3. Ce mécanisme est inscrit dans le conatus comme effort vers la joie ; il n'a pas besoin d'être une sublimation de l'amour parental (R10), qui n'en est que le premier point d'application (23.2).\n4. Dans l'entreprise, il conduit le demandeur à épouser et anticiper le désir de l'offreur ; par T011, il s'inscrit dans la structure hiérarchique, les chaînes de dépendance étant *aussi* des chaînes de dépendance à la reconnaissance (23.3).\n5. Par S09, l'homme affecté de joie désire la conserver : le salarié s'active joyeusement à servir un désir qui devient intégralement le sien. Par T022, ce désir n'est pas « étranger » à un noyau autonome qui n'existe pas ; la seule aliénation est la servitude passionnelle universelle (23.3). ∎\n\n## Scolie\n\nL'élargissement de la revendication salariale de l'argent à la reconnaissance, thème central de la sociologie du travail, est ainsi « obtenir la joie de la joie de celui à qui on apporte son travail, et partant son amour » (23.1). L'empressé, le fayot, l'obséquieux (« parangon bien nommé de l'*obsequium* ») cherchent aussi la joie d'être aimés du supérieur et de l'institution (23.3).", "body_en": "## Demonstration\n\n1. By S18, love is a joy accompanied by the idea of an external cause: I obey the master because he is the imagined cause of benefits that gladden me (23.1).\n2. By S19, I strive to do what gladdens him, and I rejoice in imagining myself the cause of his joy: first the affect of being loved by him, second that of loving oneself. The \"master\" can be the guru, the parent, the teacher, the boss, public opinion (23.1).\n3. This mechanism is inscribed in the conatus as a striving towards joy; it need not be a sublimation of parental love (R10), which is only its first point of application (23.2).\n4. In the firm, it leads the one who asks to espouse and anticipate the desire of the one who gives; by T011, it is inscribed in the hierarchical structure, the chains of dependence being *also* chains of dependence on recognition (23.3).\n5. By S09, a man affected with joy desires to preserve it: the employee busies himself joyfully serving a desire that becomes entirely his own. By T022, this desire is not \"alien\" to an autonomous core that does not exist; the only alienation is universal passional servitude (23.3). ∎\n\n## Scholium\n\nThe broadening of wage demands from money to recognition, a central theme of the sociology of work, thus means \"obtaining the joy of the joy of the one to whom one brings one's work, and hence his love\" (23.1). The eager beaver, the teacher's pet, the obsequious (\"aptly named paragon of *obsequium*\") also seek the joy of being loved by the superior and by the institution (23.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R10", "S09", "S18", "S19", "T011", "T022"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R10", "S09", "S18", "S19", "T011", "T022"], "mentions": ["R10", "S09", "S18", "S19", "T011", "T022"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T028", "file": "theses/T028.md", "type": "these", "partie": "2", "titre": "Les images vocationnelles font désirer l'enrôlement", "enonce": "Hors de tout maître particulier, la société produit, par l'imitation socialement médiée des désirs, des images vocationnelles qui disposent les individus à désirer l'enrôlement. Plus ces déterminations sont diffuses, plus elles sont oubliées : l'individu tient ce désir venu du dehors pour « son choix », et, quand un emploi lui correspond, il « se réalise » et se meut joyeusement.", "titre_en": "Vocational images make people desire enlistment", "enonce_en": "Apart from any particular master, society produces, through the socially mediated imitation of desires, vocational images that dispose individuals to desire enlistment. The more diffuse these determinations, the more they are forgotten: the individual takes this desire from outside for \"his choice\", and, when a job matches it, he \"fulfils himself\" and moves joyfully.", "titre_de": "Berufungsbilder lassen die Einspannung begehren", "enonce_de": "Unabhängig von jedem besonderen Herrn bringt die Gesellschaft durch die sozial vermittelte Nachahmung der Begehren Berufungsbilder hervor, die die Individuen darauf vorbereiten, die Einspannung zu begehren. Je diffuser diese Bestimmungen, desto mehr werden sie vergessen: Das Individuum hält dieses von außen kommende Begehren für „seine Wahl“, und wenn eine Stelle ihm entspricht, „verwirklicht es sich“ und bewegt sich freudig.", "body_de": "## Argumentation\n\n1. Als Begehren ohne Gegenstand findet der Conatus seine Gegenstände in der sozialen Welt, durch Verknüpfung (S05) und vor allem durch Nachahmung (S06) (24.1).\n2. Die Nachahmung ist nie rein zwischenmenschlich: Jemanden nachzuahmen heißt schon, einen Mann oder eine Frau nachzuahmen, einen Reichen oder einen Armen, einen Jungen oder einen Alten, manchmal einen Tonangebenden mit symbolischem Kapital, und jede dieser Eigenschaften, in denen sich soziale Verhältnisse ausdrücken, moduliert die Nachahmung. „Die ganze Gesellschaft ist in der geringsten Nachahmung eines Begehrens am Werk“ (24.2).\n3. Nach S10 erstreckt sich das Bewusstsein des Begehrens nicht auf seine Ursachen; umso weniger, wenn sie so diffus und weit verzweigt sind. Das Individuum sagt, es sei „seine Wahl“, seine lebenslange Berufung (den Vertrieb lieben „wegen des menschlichen Kontakts“, die Wirtschaftsprüfung „aus Sinn für Strenge“, die Luftfahrt, den Bauingenieursberuf) (24.3).\n4. Diese angeregten, wahrhaft innerlich gewordenen Begehren bestimmen freudige Bindungen, wenn eine Stelle sie befriedigt: Das Individuum „verwirklicht sich“, es „stimmt zu“ (24.3).\n5. Nach D18 bringt die ganze Gesellschaft durch Erziehung und Berufsberatung so die Bilder hervor, die die Individuen präkollinearisieren; doch dieser Prozess ohne Subjekt lässt sich nicht steuern und bringt auch Ausreißer hervor (24.4). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D18", "S05", "S06", "S10"], "citation": "", "loc": ["24.1", "24.2", "24.3", "24.4"], "depends_on": ["S05", "S06", "S10", "D18"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Désir sans objet, le conatus trouve ses objets dans le monde social, par association (S05) et surtout par imitation (S06) (24.1).\n2. L'imitation n'est jamais purement interpersonnelle : imiter quelqu'un, c'est déjà imiter un homme ou une femme, un riche ou un pauvre, un jeune ou un vieux, parfois un prescripteur doté de capital symbolique, et chacune de ces qualités, où s'expriment des rapports sociaux, module l'imitation. « Toute la société est à l'œuvre dans la moindre imitation de désir » (24.2).\n3. Par S10, la conscience du désir ne s'étend pas à ses causes ; à plus forte raison quand elles sont aussi diffuses et étirées. L'individu dit que c'est « son choix », sa vocation de toujours (aimer la vente « pour le contact », l'audit « pour le goût de la rigueur », l'aéronautique, le génie civil) (24.3).\n4. Ces désirs induits, devenus authentiquement intérieurs, déterminent des engagements joyeux quand un emploi les satisfait : l'individu « se réalise », il « consent » (24.3).\n5. Par D18, la société entière, par l'éducation et l'orientation, produit ainsi les images qui pré-colinéarisent les individus ; mais ce procès sans sujet n'est pas gouvernable et produit aussi des fuyards (24.4). ∎", "body_en": "## Argument\n\n1. A desire without an object, the conatus finds its objects in the social world, through association (S05) and above all through imitation (S06) (24.1).\n2. Imitation is never purely interpersonal: to imitate someone is already to imitate a man or a woman, a rich or a poor person, a young or an old one, sometimes a trendsetter endowed with symbolic capital, and each of these qualities, in which social relations are expressed, modulates imitation. \"The whole of society is at work in the least imitation of desire\" (24.2).\n3. By S10, consciousness of desire does not extend to its causes; all the more so when they are so diffuse and drawn out. The individual says it is \"his choice\", his lifelong vocation (loving sales \"for the human contact\", auditing \"for the taste of rigour\", aeronautics, civil engineering) (24.3).\n4. These induced desires, become authentically inner, determine joyful commitments when a job satisfies them: the individual \"fulfils himself\", he \"consents\" (24.3).\n5. By D18, the whole of society, through education and career guidance, thus produces the images that precollinearise individuals; but this process without a subject cannot be governed and also produces runaways (24.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D18", "S05", "S06", "S10"], "sections": ["Argumentation"], "demo_refs": ["D18", "S05", "S06", "S10"], "mentions": ["D18", "S05", "S06", "S10"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T029", "file": "theses/T029.md", "type": "these", "partie": "2", "titre": "Le totalitarisme de la possession des âmes", "enonce": "La précolinéarisation ne suffisant pas, l'entreprise néolibérale veut annuler α : investir totalement les salariés, refaire leurs désirs, leurs dispositions, leurs manières, jusqu'à leurs émotions, qui doivent être non plus jouées mais « authentiquement » éprouvées. C'est une visée totalitaire, celle d'une possession intégrale des individus.", "titre_en": "The totalitarianism of possessing souls", "enonce_en": "Since precollinearisation does not suffice, the neoliberal firm wants to cancel α: to invest employees totally, to remake their desires, their dispositions, their manners, down to their emotions, which must no longer be acted but \"authentically\" felt. It is a totalitarian aim, that of a complete possession of individuals.", "titre_de": "Der Totalitarismus des Besitzes der Seelen", "enonce_de": "Da die Präkollinearisierung nicht genügt, will das neoliberale Unternehmen α aufheben: die Angestellten ganz besetzen, ihre Begehren, ihre Dispositionen, ihre Umgangsformen umformen, bis hin zu ihren Gefühlen, die nicht mehr gespielt, sondern „authentisch“ empfunden werden müssen. Das ist ein totalitäres Ziel, das eines vollständigen Besitzes der Individuen.", "body_de": "## Argumentation\n\n1. Nach T028 ist die Präkollinearisierung durch die Gesellschaft weit von der Vollkommenheit entfernt; nach T015 genügt die bloße Verkleinerung von α nicht mehr: Das neoliberale Unternehmen will α = 0 (25.1).\n2. Nach T021 macht es sich daran, sein Begehren *übernehmen* zu lassen, im anspruchsvollsten Sinn. Das ist ein Totalitarismus, nicht im klassischen Sinn, sondern als Ziel *totaler* Unterordnung und Besetzung: Die Angestellten müssen „sich ganz einbringen“ und werden ganz besetzt, überflutet (25.3).\n3. Es begnügt sich nicht mehr damit, Handlungen zu erhalten, sondern beansprucht die Unterwerfung der „Innerlichkeit“: das volle Zusammenfallen des Individuums mit sich selbst unter dem Kriterium des Begehrens (25.3). Die leitenden Führungskräfte sind bereits ausgerichtet; die anderen werden durch Personalprogramme „rekollinearisiert“ (25.4).\n4. In den Dienstleistungen ist die Leistung affektiv. Indische Angestellte müssen eine amerikanische Identität annehmen (Akzent, Tagesgeschehen, Vorname); die *reductio ad utensilium* spricht die Wahrheit des Lohnverhältnisses aus (26.1).\n5. Schlimmer: Die vorgeschriebenen Gefühle müssen „authentisch“ empfunden werden, so wie die Kirche dahin kam, die Attrition und nicht mehr nur die Kontrition zu verlangen. Der neoliberale Kapitalismus dehnt die „Gabe der Tränen“ der Virtuosen auf alle Angestellten aus, um den Preis des *double bind* der befohlenen Spontaneität (26.2-26.3). ∎\n\n## Anmerkung\n\nDer Dokumentarfilm von Jean-Robert Viallet (*La mise à mort du travail*, Anm. 77) zeigt ein Callcenter, in dem Zeitvorgaben und Tonfall überwacht werden, und ein Seminar, in dem Führungskräfte auf Befehl lachen; der Moderator verlässt am Ende das Unternehmen für „ein neues Leben“ (25.4). Das „Lächeln muss ‚echt‘, ‚natürlich‘ sein, ‚von Herzen‘ kommen“ (26.3, Anm. 82).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["T015", "T021", "T028"], "citation": "« Le capital néolibéral est le monde de la girl friend experience. »", "loc": ["25.1", "25.3", "25.4", "26.1", "26.2", "26.3"], "depends_on": ["T015", "T021", "T028"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T028, la précolinéarisation par la société est loin d'être parfaite ; par T015, la simple réduction de α ne suffit plus : l'entreprise néolibérale veut α = 0 (25.1).\n2. Par T021, elle entreprend de faire *épouser* son désir, au sens le plus exigeant. C'est un totalitarisme, non au sens classique, mais comme visée de subordination et d'investissement *total* : les salariés doivent « s'investir totalement » et sont totalement investis, envahis (25.3).\n3. Elle ne se contente plus d'obtenir des actions mais revendique la soumission de l'« intériorité » : la pleine coïncidence de l'individu et d'elle-même sous le critère du désir (25.3). Les cadres dirigeants y sont déjà alignés ; les autres seront « recolinéarisés » par les programmes de ressources humaines (25.4).\n4. Dans les services, la performance est affective. Des salariés indiens doivent adopter une identité américaine (accent, actualités, prénom) ; la *reductio ad utensilium* dit la vérité du rapport salarial (26.1).\n5. Pire : les émotions prescrites doivent être « authentiquement » éprouvées, comme l'Église demandait l'attrition et non plus la seule contrition. Le capitalisme néolibéral étend à tous les salariés le « don des larmes » des virtuoses, au prix du *double bind* de la spontanéité sur commande (26.2-26.3). ∎\n\n## Scolie\n\nLe documentaire de Jean-Robert Viallet (*La mise à mort du travail*, note 77) montre une plateforme téléphonique où l'on contrôle le chronométrage et les intonations, et un séminaire où des cadres rient sur commande ; l'animateur finit par quitter l'entreprise pour « une vie nouvelle » (25.4). Le « sourire doit être “vrai”, “naturel”, venir du “fond du cœur” » (26.3, note 82).", "body_en": "## Argument\n\n1. By T028, precollinearisation by society is far from perfect; by T015, merely reducing α no longer suffices: the neoliberal firm wants α = 0 (25.1).\n2. By T021, it sets out to have its desire *espoused*, in the most demanding sense. This is a totalitarianism, not in the classical sense, but as an aim of *total* subordination and investment: employees must \"invest themselves totally\" and are totally invested, invaded (25.3).\n3. It is no longer content to obtain actions but claims the submission of \"interiority\": the full coincidence of the individual with itself under the criterion of desire (25.3). Senior executives are already aligned; the others will be \"recollinearised\" by human resources programmes (25.4).\n4. In services, performance is affective. Indian employees must adopt an American identity (accent, current affairs, first name); the *reductio ad utensilium* tells the truth of the wage relation (26.1).\n5. Worse: the prescribed emotions must be \"authentically\" felt, as the Church came to demand attrition and no longer contrition alone. Neoliberal capitalism extends to all employees the virtuosos' \"gift of tears\", at the price of the *double bind* of spontaneity on command (26.2-26.3). ∎\n\n## Scholium\n\nJean-Robert Viallet's documentary (*La mise à mort du travail*, note 77) shows a call centre where timing and intonation are monitored, and a seminar where managers laugh on command; the facilitator ends up leaving the firm for \"a new life\" (25.4). The \"smile must be 'true', 'natural', come 'from the bottom of the heart'\" (26.3, note 82).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T015", "T021", "T028"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T015", "T021", "T028"], "mentions": ["T015", "T021", "T028"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T030", "file": "theses/T030.md", "type": "these", "partie": "2", "titre": "L'insondable mystère du désir enrôlé", "enonce": "Acheter une force de travail ne garantit pas sa mobilisation. Le désir étant devenu le premier réquisit, le recrutement cherche à sonder les dispositions plutôt que les compétences ; mais la complexion désirante est opaque, et cette enquête impossible voue les pratiques de recrutement à l'irrationalité. Il reste à l'entreprise à produire elle-même les désirs conformes.", "titre_en": "The unfathomable mystery of enlisted desire", "enonce_en": "Buying a labour power does not guarantee its mobilisation. Desire having become the first requirement, recruitment tries to probe dispositions rather than skills; but the desiring complexion is opaque, and this impossible inquiry dooms recruitment practices to irrationality. It remains for the firm to produce the conforming desires itself.", "titre_de": "Das unergründliche Rätsel des eingespannten Begehrens", "enonce_de": "Eine Arbeitskraft zu kaufen garantiert nicht ihre Mobilisierung. Da das Begehren zur ersten Anforderung geworden ist, versucht die Rekrutierung, eher Dispositionen als Fertigkeiten zu ergründen; doch die begehrende Komplexion ist undurchsichtig, und diese unmögliche Untersuchung verurteilt die Praktiken der Rekrutierung zur Irrationalität. Dem Unternehmen bleibt, die passenden Begehren selbst hervorzubringen.", "body_de": "## Argumentation\n\n1. Die andere Seite der neoliberalen Utopie ist die einer Gemeinschaft *gleich* begehrender Individuen; doch kann man dem Bewerber glauben, der schwört, keine andere Leidenschaft zu haben als die Joghurts des Unternehmens? Nach M04 garantiert der Kauf von Arbeitskraft nicht ihre Umwandlung in Arbeit (27.1).\n2. Die technischen Fertigkeiten sind zweitrangig geworden: Wozu dienten sie ohne ein treibendes Begehren? Das Begehren nimmt unter den Anforderungen den hierarchisch höchsten Platz ein, setzt aber „seine unaufhebbare Undurchsichtigkeit“ entgegen (27.1-27.2).\n3. Über Ziele definierte Stellen verlangen eine Auswahl nach allgemeinen Verhaltenskompetenzen, die unendlich weniger rationalisierbar sind als technische Fertigkeiten; daher Rollenspiele, inquisitorische Befragungen, Graphologie, sogar Numerologie (27.3).\n4. Da die Prüfung des Präkollinearisierungsgrads an eine unüberwindbare Grenze stößt, muss das Unternehmen die Ausrichtung selbst vervollkommnen (T029) (27.3). ∎\n\n## Anmerkung\n\nJulien Prévieux' Briefe der Nichtmotivation (Anm. 83) parodieren die „vorherige Interessenbekundung“; die automatische Antwort des Unternehmens, die nichts bemerkt, potenziert die Stereotypie (27.2). Wir leben nicht in einer kapitalistischen Wirtschaft, sondern in einer kapitalistischen *Gesellschaft* (27.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["M04", "T029"], "citation": "", "loc": ["27.1", "27.2", "27.3"], "depends_on": ["M04", "T029"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. L'autre face de l'utopie néolibérale est celle d'une communauté d'individus *identiquement* désirants ; mais peut-on croire le candidat qui jure n'avoir d'autre passion que les yaourts de l'entreprise ? Par M04, l'achat de la force de travail ne garantit pas sa conversion en travail (27.1).\n2. Les compétences techniques sont devenues secondaires : sans désir moteur, à quoi serviraient-elles ? Le désir occupe la place hiérarchiquement supérieure parmi les réquisits, mais oppose « son irréductible opacité » (27.1-27.2).\n3. Les emplois définis par objectifs appellent des sélections par compétences comportementales génériques, infiniment moins rationalisables que les compétences techniques ; d'où les jeux de rôle, les questionnements inquisitoriaux, la graphologie, jusqu'à la numérologie (27.3).\n4. La vérification du degré de précolinéarisation rencontrant une limite insurmontable, l'entreprise doit parfaire elle-même l'alignement (T029) (27.3). ∎\n\n## Scolie\n\nLes lettres de non-motivation de Julien Prévieux (note 83) parodient la « déclaration préalable d'intérêt » ; la réponse automatique de l'entreprise, qui n'y voit que du feu, élève la stéréotypie au carré (27.2). Nous ne vivons pas dans une économie capitaliste mais dans la *société* capitaliste (27.2).", "body_en": "## Argument\n\n1. The other face of the neoliberal utopia is that of a community of *identically* desiring individuals; but can one believe the candidate who swears he has no other passion than the firm's yoghurts? By M04, buying labour power does not guarantee its conversion into labour (27.1).\n2. Technical skills have become secondary: without a driving desire, what use would they be? Desire occupies the hierarchically highest place among the requirements, but opposes \"its irreducible opacity\" (27.1-27.2).\n3. Jobs defined by objectives call for selection by generic behavioural skills, infinitely less rationalisable than technical skills; hence role plays, inquisitorial questioning, graphology, even numerology (27.3).\n4. Checking the degree of precollinearisation meeting an insurmountable limit, the firm must perfect the alignment itself (T029) (27.3). ∎\n\n## Scholium\n\nJulien Prévieux's letters of non-motivation (note 83) parody the \"prior declaration of interest\"; the firm's automatic reply, which notices nothing, squares the stereotypy (27.2). We do not live in a capitalist economy but in capitalist *society* (27.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["M04", "T029"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["M04", "T029"], "mentions": ["M04", "T029"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T031", "file": "theses/T031.md", "type": "these", "partie": "2", "titre": "La joie fait oublier l'hétéronomie", "enonce": "Les affects joyeux ne portent pas à penser : la pensée naît plutôt d'une rencontre contrariante. L'oubli de l'exodétermination est donc plus profond quand on est mû par la joie, et les dirigeants, pas moins déterminés que les autres, vivent leur désir comme souverain. Ce sont plutôt les commandements d'un autre qu'on hait qui font entrevoir le pliage par le dehors ; et la révolte n'est alors que la substitution d'une détermination à une autre.", "titre_en": "Joy makes one forget heteronomy", "enonce_en": "Joyful affects do not prompt thought: thought arises rather from a thwarting encounter. Forgetting exodetermination is therefore deeper when one is moved by joy, and executives, no less determined than others, live their desire as sovereign. It is rather the commands of another whom one hates that give a glimpse of being bent from outside; and revolt is then only the substitution of one determination for another.", "titre_de": "Die Freude lässt die Heteronomie vergessen", "enonce_de": "Freudige Affekte regen nicht zum Denken an: Das Denken entsteht eher aus einer hemmenden Begegnung. Das Vergessen der Fremdbestimmung ist daher tiefer, wenn man von Freude bewegt wird, und die Führungskräfte, nicht weniger bestimmt als die anderen, erleben ihr Begehren als souverän. Eher lassen die Befehle eines gehassten anderen ahnen, von außen gebeugt zu werden; und die Revolte ist dann nur die Ersetzung einer Bestimmung durch eine andere.", "body_de": "## Argumentation\n\n1. Nach T025 heißt Zustimmen, seine Bestimmung freudig zu leben. Nun ist es, wie Deleuze sagt, „die Gewalt eines Zeichens“, die zum Suchen zwingt: Das Denken entsteht eher aus einem traurigen Affekt (28.4).\n2. Nach T008 ist das Begehren nie *von* einem selbst und doch immer *das eigene*; unter freudigen Affekten fällt das „nicht von einem selbst“ dem Vergessen anheim, und nur das „Eigene“ bleibt. Die Führungskräfte gehen nicht weniger entfremdet zur Arbeit als ihre Untergebenen: Sie bewegen sich nur unter Affekten der Hoffnung, die stark genug sind, dieses Begehren als souverän das ihre zu erleben (28.4).\n3. Niemand kann sich die zahllosen Affektionen in Erinnerung rufen, die seine begehrende Komplexion geformt haben (29.1). Nach S06 kann man über das von einem geliebten anderen nachgeahmte Begehren nachdenken, doch, von Affekten der Liebe umgeben, wird es als unbedingt das eigene erlebt (29.2).\n4. Es sind die Befehle eines gehassten anderen, die die Fremdbestimmung ahnen lassen; doch die folgende Auflehnung ist nur die Ersetzung einer Bestimmung durch eine andere, unter freudigen Affekten (29.2). ∎\n\n## Anmerkung\n\nSpinozas Jüngling flieht die väterliche Autorität … indem er sich zum Heer meldet und „in voller Freiheit“ „den Despotismus eines Tyrannen den väterlichen Ermahnungen“ vorzieht (*Ethik* IV, Anhang, Kap. 13, Anm. 91; 29.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["S06", "T008", "T025"], "citation": "« la félicité est peu questionneuse »", "loc": ["28.4", "29.1", "29.2"], "depends_on": ["T025", "T008", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T025, consentir, c'est vivre joyeusement sa détermination. Or, comme le dit Deleuze, c'est « la violence d'un signe » qui force à chercher : la pensée naît plutôt d'un affect triste (28.4).\n2. Par T008, le désir n'est jamais *de* soi tout en étant toujours *à* soi ; sous affects joyeux, le « pas de soi » est rejeté dans l'oubli et seul reste le « à soi ». Les dirigeants ne vont pas au travail moins aliénés que leurs subordonnés : ils se meuvent seulement sous des affects d'espoir assez puissants pour vivre ce désir comme le leur souverain (28.4).\n3. Nul ne peut faire la récollection des innombrables affections qui ont formé sa complexion désirante (29.1). Par S06, le désir imité d'un autre aimé peut être réfléchi, mais, environné d'affects amoureux, il est vécu comme absolument sien (29.2).\n4. Ce sont les commandements d'un autre haï qui font entrevoir l'exodétermination ; mais la rébellion qui s'ensuit n'est que la substitution d'une détermination à une autre, sous des affects joyeux (29.2). ∎\n\n## Scolie\n\nL'adolescent de Spinoza fuit l'autorité paternelle… en s'engageant dans l'armée, préférant « en toute liberté » « le despotisme d'un tyran plutôt que les sermons paternels » (*Éthique* IV, appendice, chap. 13, note 91 ; 29.2).", "body_en": "## Argument\n\n1. By T025, consenting is living one's determination joyfully. Now, as Deleuze says, it is \"the violence of a sign\" that forces one to seek: thought arises rather from a sad affect (28.4).\n2. By T008, desire is never *from* oneself while always being *one's own*; under joyful affects, the \"not from oneself\" is cast into oblivion and only the \"one's own\" remains. Executives do not go to work less alienated than their subordinates: they merely move under affects of hope powerful enough to live this desire as sovereignly theirs (28.4).\n3. No one can recollect the countless affections that formed his desiring complexion (29.1). By S06, the desire imitated from a loved other can be reflected on, but, surrounded by affects of love, it is lived as absolutely one's own (29.2).\n4. It is the commands of a hated other that give a glimpse of exodetermination; but the rebellion that follows is only the substitution of one determination for another, under joyful affects (29.2). ∎\n\n## Scholium\n\nSpinoza's adolescent flees paternal authority… by enlisting in the army, preferring \"in complete freedom\" \"the despotism of a tyrant to paternal lectures\" (*Ethics* IV, appendix, chap. 13, note 91; 29.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S06", "T008", "T025"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S06", "T008", "T025"], "mentions": ["S06", "T008", "T025"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T032", "file": "theses/T032.md", "type": "these", "partie": "2", "titre": "Les risques du constructivisme du désir", "enonce": "Toute société façonne les désirs de ses membres, mais par un procès diffus, sans centre ni intention, qui apparaît comme une nécessité. Une instance de conditionnement visible, à laquelle on prête une intention, concentre au contraire des haines plus intenses. En prenant ouvertement en main la production des désirs, l'entreprise néolibérale prend le risque de l'intentionnalité assignable, que n'ont pas les forces du marché, « sans centre », et s'expose à la haine réservée aux causes libres.", "titre_en": "The risks of the constructivism of desire", "enonce_en": "Every society shapes the desires of its members, but through a diffuse process, without centre or intention, which appears as a necessity. A visible conditioning agency, to which an intention is attributed, by contrast concentrates more intense hatreds. By openly taking the production of desires in hand, the neoliberal firm takes the risk of assignable intentionality, which the \"centreless\" forces of the market do not run, and exposes itself to the hatred reserved for free causes.", "titre_de": "Die Risiken des Konstruktivismus des Begehrens", "enonce_de": "Jede Gesellschaft formt die Begehren ihrer Mitglieder, aber durch einen diffusen Prozess ohne Zentrum und Absicht, der als Notwendigkeit erscheint. Eine sichtbare Instanz der Konditionierung, der man eine Absicht zuschreibt, zieht dagegen stärkeren Hass auf sich. Indem es die Hervorbringung der Begehren offen in die Hand nimmt, geht das neoliberale Unternehmen das Risiko einer zurechenbaren Absichtlichkeit ein, das die Kräfte des Marktes „ohne Zentrum“ nicht laufen, und setzt sich dem Hass aus, der freien Ursachen vorbehalten ist.", "body_de": "## Argumentation\n\n1. Konstruktivismen des Begehrens oder institutionelle Epithumogenien (D14) sind nicht neu: Spinoza riet dem Staat, die Menschen so zu führen, dass sie glauben, ihrem freien Beschluss zu folgen (S22), und Platon machte daraus das Herz der politischen Kunst (29.3).\n2. Konditionierung ist nur ein anderer Name für die allgemeine leidenschaftliche Knechtschaft; doch das Vorhandensein einer erkennbaren Instanz und Absicht macht einen Unterschied (29.3).\n3. Die Selbstaffektion des sozialen Körpers ist nicht zurechenbar und hat keine Absicht: Sie erscheint als Notwendigkeit und macht sich unbemerkt oder erträglich (29.4).\n4. Nach S23 hassen wir mehr, was wir uns frei vorstellen: Die Partei, der Staat, der Gosplan ziehen den Hass auf sich, während die Kräfte des Marktes, die nicht weniger zermalmen, als „Systemwirkung“ ohne Ingenieur erscheinen, die der Naturalisierung förderlich ist; das ist Marx' Warenfetischismus (29.4).\n5. Indem das neoliberale Unternehmen offen konstruktivistisch wird, geht es das Risiko der Verortung und der zurechenbaren Absichtlichkeit ein; und seine Untertanen halten sich, mehr als die Gläubigen der Kirche von einst, für mit einer Autonomie des Begehrens begabt, in der jeder Eingriff wie eine Einmischung wirkt (29.5). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D14", "S22", "S23"], "citation": "", "loc": ["29.3", "29.4", "29.5"], "depends_on": ["S22", "S23", "D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les constructivismes du désir, ou épithumogénies d'institution (D14), ne sont pas neufs : Spinoza conseillait à l'État de conduire les hommes de sorte qu'ils croient suivre leur libre décret (S22), et Platon en faisait le cœur de l'art politique (29.3).\n2. Le conditionnement n'est qu'un autre nom de la servitude passionnelle universelle ; mais la présence d'une instance et d'une intention identifiables fait une différence (29.3).\n3. L'auto-affection du corps social est inassignable et sans intention : elle apparaît comme une nécessité, et se rend inaperçue ou tolérable (29.4).\n4. Par S23, on hait davantage ce qu'on imagine libre : le parti, l'État, le Gosplan concentrent les haines, tandis que les forces du marché, qui ne broient pas moins, apparaissent comme un « effet de système » sans ingénieur, propice à la naturalisation ; c'est le fétichisme marchand de Marx (29.4).\n5. En se faisant ouvertement constructiviste, l'entreprise néolibérale prend le risque de la relocalisation et de l'intentionnalité assignable ; et ses sujets se croient, plus que les fidèles de l'Église d'autrefois, doués d'une autonomie de désir où toute intervention paraît une immixtion (29.5). ∎", "body_en": "## Argument\n\n1. Constructivisms of desire, or institutional epithumogenies (D14), are not new: Spinoza advised the State to lead men so that they believe they follow their own free decree (S22), and Plato made it the heart of the political art (29.3).\n2. Conditioning is only another name for universal passional servitude; but the presence of an identifiable agency and intention makes a difference (29.3).\n3. The self-affection of the social body cannot be assigned and has no intention: it appears as a necessity, and makes itself unnoticed or tolerable (29.4).\n4. By S23, we hate more what we imagine free: the party, the State, the Gosplan concentrate hatreds, while market forces, which grind no less, appear as a \"system effect\" with no engineer, conducive to naturalisation; this is Marx's commodity fetishism (29.4).\n5. By becoming openly constructivist, the neoliberal firm takes the risk of relocation and of assignable intentionality; and its subjects believe themselves, more than the faithful of the Church of old, endowed with an autonomy of desire in which any intervention looks like interference (29.5). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D14", "S22", "S23"], "sections": ["Argumentation"], "demo_refs": ["D14", "S22", "S23"], "mentions": ["D14", "S22", "S23"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T033", "file": "theses/T033.md", "type": "these", "partie": "2", "titre": "L'amor fati capitalistis", "enonce": "Le coaching et les pratiques de « motivation » transforment des contraintes extérieures en « motivation endogène » : ils produisent l'amour par les salariés de la situation qui leur est faite. Leur finalité est adaptative : refouler toute extrospection et maintenir les individus dans l'introspection, comme si ce qui leur arrive dans l'entreprise n'était pas questionnable. Les conditionneurs sont eux-mêmes conditionnés.", "titre_en": "Amor fati capitalistis", "enonce_en": "Coaching and \"motivation\" practices transform external constraints into \"endogenous motivation\": they produce employees' love of the situation made for them. Their purpose is adaptive: to repress all extrospection and keep individuals in introspection, as if what happens to them in the firm were not open to question. The conditioners are themselves conditioned.", "titre_de": "Amor fati capitalistis", "enonce_de": "Coaching und „Motivations“praktiken verwandeln äußere Zwänge in „endogene Motivation“: Sie bringen die Liebe der Angestellten zu der ihnen bereiteten Lage hervor. Ihr Zweck ist anpassend: jede Extrospektion zu verdrängen und die Individuen in der Introspektion zu halten, als stünde nicht in Frage, was ihnen im Unternehmen geschieht. Die Konditionierenden sind selbst konditioniert.", "body_de": "## Argumentation\n\n1. Nach T032 erzeugt die sichtbare Manipulation der Begehren Spannungen; das neoliberale Unternehmen hat einen Kopf, „der weiß, was er will“ (30.1).\n2. Das Coaching geht am weitesten: Es will nach einem Coach „einen exogenen Druck in endogene Motivation verwandeln“ (Anm. 97), was, bis auf das Managementidiom, die Maxime von S22 ist. Zustimmung hervorbringen heißt *amor fati capitalistis* (D19) hervorbringen (30.1).\n3. Wie humanistisch die Rhetorik der Arbeit an sich selbst auch sei, ihr Zweck ist anpassend: den Zwang zu verklären, ohne jede Infragestellung des Zwangs. Selbst das nicht direktive Coaching leitender Führungskräfte ist nur offen, weil das Herrenbegehren bereits ins Ungedachte verwiesen ist (30.2).\n4. Die kapitalistische Epithumogenie verdrängt die Extrospektion, den Blick auf die äußeren Kräfte, zugunsten der Introspektion: Was im Unternehmen geschieht, steht nicht in Frage, nur wie man damit zurechtkommen wird (30.2). ∎\n\n## Anmerkung\n\n„Motivations“seminare unterscheiden sich von sektiererischen Praktiken manchmal nur durch ihren Gegenstand. Dass Unternehmen den Kameras ihre Türen öffnen, zeigt das gute Gewissen der Führungskräfte: Die Konditionierenden sind konditioniert, und, wie Bourdieu sagte, die Herrschenden werden von ihrer eigenen Herrschaft beherrscht (30.3).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D19", "S22", "T032"], "citation": "« transformer une pression exogène en motivation endogène »", "loc": ["30.1", "30.2", "30.3"], "depends_on": ["D19", "S22", "T032"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T032, la manipulation visible des désirs engendre des tensions ; l'entreprise néolibérale a une tête, « qui sait ce qu'elle veut » (30.1).\n2. Le coaching va le plus loin : il veut, selon un coach, « transformer une pression exogène en motivation endogène » (note 97), ce qui est la maxime de S22 au parler managérial près. Produire le consentement, c'est produire l'*amor fati capitalistis* (D19) (30.1).\n3. Quelle que soit la rhétorique humaniste du travail sur soi, la finalité est adaptative : transfigurer la contrainte hors de tout questionnement de la contrainte. Même le coaching non directif des cadres supérieurs n'est ouvert que parce que le désir-maître est déjà rejeté dans l'impensé (30.2).\n4. L'épithumogénie capitaliste refoule l'extrospection, le regard vers les forces extérieures, au profit de l'introspection : ce qui arrive dans l'entreprise n'est pas questionnable, seule l'est la façon dont on fera avec (30.2). ∎\n\n## Scolie\n\nLes séminaires de « motivation » ne diffèrent parfois des pratiques sectaires que par l'objet. Que des entreprises ouvrent leurs portes aux caméras montre la bonne conscience des dirigeants : les conditionneurs sont conditionnés, et, comme le disait Bourdieu, les dominants sont dominés par leur propre domination (30.3).", "body_en": "## Argument\n\n1. By T032, visible manipulation of desires breeds tensions; the neoliberal firm has a head, \"which knows what it wants\" (30.1).\n2. Coaching goes furthest: it wants, according to one coach, \"to transform an exogenous pressure into endogenous motivation\" (note 97), which is the maxim of S22 bar the managerial idiom. Producing consent is producing *amor fati capitalistis* (D19) (30.1).\n3. Whatever the humanist rhetoric of working on oneself, the purpose is adaptive: to transfigure constraint without any questioning of constraint. Even non-directive coaching of senior executives is open only because the master-desire has already been cast into the unthought (30.2).\n4. Capitalist epithumogeny represses extrospection, the gaze towards external forces, in favour of introspection: what happens in the firm is not open to question, only how one will cope with it (30.2). ∎\n\n## Scholium\n\n\"Motivation\" seminars sometimes differ from sectarian practices only in their object. That firms open their doors to cameras shows the good conscience of executives: the conditioners are conditioned, and, as Bourdieu said, the dominant are dominated by their own domination (30.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D19", "S22", "T032"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D19", "S22", "T032"], "mentions": ["D19", "S22", "T032"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T034", "file": "theses/T034.md", "type": "these", "partie": "2", "titre": "Le voile des affects joyeux, le fond des affects tristes", "enonce": "La promesse d'affects joyeux reste brouillée par un fond d'affects tristes : derrière la colinéarisation heureuse se tient toujours la menace (déclassement, rétrogradation, renvoi). D'où le double bind du « sois spontané ». L'efficacité de la colinéarisation varie avec la proximité au désir-maître ; pour la plupart, les « consentements » restent mitigés, simples résultantes du conflit des affects joyeux et tristes.", "titre_en": "The veil of joyful affects, the background of sad affects", "enonce_en": "The promise of joyful affects remains blurred by a background of sad affects: behind happy collinearisation there always stands the threat (downgrading, demotion, dismissal). Hence the double bind of \"be spontaneous\". The effectiveness of collinearisation varies with proximity to the master-desire; for most, \"consents\" remain mixed, mere resultants of the conflict between joyful and sad affects.", "titre_de": "Der Schleier der freudigen Affekte, der Hintergrund der traurigen Affekte", "enonce_de": "Das Versprechen freudiger Affekte bleibt von einem Hintergrund trauriger Affekte getrübt: Hinter der glücklichen Kollinearisierung steht immer die Drohung (Herabstufung, Zurückversetzung, Entlassung). Daher der Doppelbefehl „sei spontan“. Die Wirksamkeit der Kollinearisierung schwankt mit der Nähe zum Herrenbegehren; für die meisten bleiben die „Zustimmungen“ gemischt, bloße Resultanten des Konflikts zwischen freudigen und traurigen Affekten.", "body_de": "## Argumentation\n\n1. Nach T033 erzählt die Arbeit der Kollinearisierung dem Eingespannten die Geschichte *seines* Begehrens; sie muss ihn vergessen lassen, dass er dem Herrenbegehren dient und dass ihr Versprechen der Freude die Sanktionen und Drohungen des Lohnverhältnisses (T006) zum Hintergrund hat (31.1).\n2. Da das Scheitern der Normalisierung nicht vorgesehen ist, treffen die „hartnäckig Abweichenden“ wieder auf den harten Kern des Lohnverhältnisses; der Kollinearisierte wird aufgefordert, sich zu freudigen Affekten zu bekehren, will er nicht von der Furcht überwältigt werden. Daher der *double bind* („sei autonom, aber in meiner Richtung“), gegen den er nur die Autosuggestion hat, wenn nicht die Krankheit (31.1).\n3. Die Wirksamkeit der Kollinearisierung folgt ungefähr der Hierarchiestufe (T011): Ganz oben sind die Individuen so vorausgerichtet, dass sich das Verhältnis umkehren kann und sie es sind, die die Organisation für ihre Leidenschaften nutzen, wie die „glühenden Seelen“, denen die Kirche misstraut (31.2-31.3).\n4. Für die anderen sind die Gefühle gemischt, das Gemüt schwankt (S08), und nach S24 gibt es anstelle von „Zustimmung“ nur den Zusammenstoß freudiger und trauriger Affekte. Die von der Drohung überwölbte Kollinearisierung kann ihren betrübenden Teil nicht bannen: Angestellte können sich für das Controlling begeistern und „zuweilen nicht weniger denken“ (31.4). ∎\n\n## Anmerkung\n\nBourdieu erwähnt die Agenten, die „Institutionen ausnutzen, um ihre Triebe zu befriedigen“ (Anm. 100): Die Kirche fürchtet den „verhängnisvollen Subjektivismus“ allzu glühender Seelen, das Gegenteil des Unternehmens, das einem Mangel an „Motivation“ misstraut (31.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["S08", "S24", "T006", "T011", "T033"], "citation": "« désire toi-même mais d’après moi seulement »", "loc": ["31.1", "31.2", "31.3", "31.4"], "depends_on": ["T033", "T006", "T011", "S08", "S24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T033, le travail de colinéarisation tient à l'enrôlé le discours de *son* désir ; il doit faire oublier qu'il sert le désir-maître, et que sa promesse de joie a pour arrière-plan les sanctions et les menaces du rapport salarial (T006) (31.1).\n2. L'échec de la normalisation n'étant pas une option, les « déviants persistants » retrouvent le dur du rapport salarial ; le colinéarisé est sommé de se convertir aux affects joyeux sous peine d'être submergé par la crainte. D'où le *double bind* (« sois autonome mais selon ma direction »), contre lequel il n'a que l'autosuggestion, quand ce n'est pas la pathologie (31.1).\n3. L'efficacité de la colinéarisation suit à peu près le niveau hiérarchique (T011) : tout en haut, les individus sont si préalignés que le rapport peut s'inverser, et que ce sont eux qui utilisent l'organisation pour leurs passions, comme les « âmes ardentes » dont l'Église se méfie (31.2-31.3).\n4. Pour les autres, les sentiments sont mêlés, l'âme flotte (S08), et par S24 il n'y a en fait de « consentement » que l'affrontement des affects joyeux et tristes. La colinéarisation, surplombée de menace, ne peut escamoter sa part attristante : les salariés peuvent se passionner pour le contrôle de gestion, et « par moments n'en penser pas moins » (31.4). ∎\n\n## Scolie\n\nBourdieu évoque les agents qui « exploitent les institutions pour assouvir leurs pulsions » (note 100) : l'Église redoute le « subjectivisme fatal » des âmes trop ardentes, à front renversé de l'entreprise, qui se méfie du défaut de « motivation » (31.2).", "body_en": "## Argument\n\n1. By T033, the work of collinearisation tells the enlisted the story of *his* desire; it must make him forget that he serves the master-desire, and that its promise of joy has as background the sanctions and threats of the wage relation (T006) (31.1).\n2. Failure of normalisation not being an option, \"persistent deviants\" meet again the hard core of the wage relation; the collinearised is summoned to convert to joyful affects on pain of being overwhelmed by fear. Hence the *double bind* (\"be autonomous but in my direction\"), against which he has only autosuggestion, when not pathology (31.1).\n3. The effectiveness of collinearisation roughly follows hierarchical level (T011): at the very top, individuals are so prealigned that the relation can be reversed, and it is they who use the organisation for their passions, like the \"ardent souls\" the Church distrusts (31.2-31.3).\n4. For the others, feelings are mixed, the mind vacillates (S08), and by S24 there is by way of \"consent\" only the clash of joyful and sad affects. Collinearisation, overhung by threat, cannot conjure away its saddening part: employees can become passionate about management control, and \"at times think no less\" (31.4). ∎\n\n## Scholium\n\nBourdieu evokes the agents who \"exploit institutions to satisfy their drives\" (note 100): the Church fears the \"fatal subjectivism\" of overly ardent souls, the reverse of the firm, which distrusts a lack of \"motivation\" (31.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S08", "S24", "T006", "T011", "T033"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S08", "S24", "T006", "T011", "T033"], "mentions": ["S08", "S24", "T006", "T011", "T033"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T035", "file": "theses/T035.md", "type": "these", "partie": "3", "titre": "La domination par les affects joyeux", "enonce": "Même joyeusement consenti, l'enrôlement reste domination : l'épithumogénie fixe le désir des enrôlés à des objets étroits, à l'exclusion de tous ceux qu'ils pourraient désirer comme associés. La domination est l'effet qui permet à certains de se réserver des possibilités de jouissance ; la violence symbolique de Bourdieu est une domination par les affects joyeux.", "titre_en": "Domination through joyful affects", "enonce_en": "Even joyfully consented to, enlistment remains domination: epithumogeny fixes the desire of the enlisted on narrow objects, to the exclusion of all those they could desire as associates. Domination is the effect that allows some to reserve possibilities of enjoyment for themselves; Bourdieu's symbolic violence is a domination through joyful affects.", "titre_de": "Herrschaft durch freudige Affekte", "enonce_de": "Selbst freudig gebilligt, bleibt die Einspannung Herrschaft: Die Epithumogenie fixiert das Begehren der Eingespannten auf enge Gegenstände, unter Ausschluss aller, die sie als Teilhaber begehren könnten. Herrschaft ist die Wirkung, die es den einen erlaubt, sich Möglichkeiten des Genießens vorzubehalten; Bourdieus symbolische Gewalt ist eine Herrschaft durch freudige Affekte.", "body_de": "## Argumentation\n\n1. Es gibt fast rein freudige „Zustimmungen“; wie kann man noch von Herrschaft sprechen? Nach T022 lässt sich die Entfremdung nicht nur einigen zurechnen, und der Betroffene könnte die Diagnose gegen den Fragenden wenden (33.1).\n2. Die Herrschaft im ersten Sinn bleibt, doch das Grundinteresse kann von höheren Begehren überlagert werden, bis die Abhängigkeit keine affektive Spur mehr hinterlässt (33.2).\n3. Nun hat die Epithumogenie die Wirkung und die Absicht, das Begehren der Eingespannten zu *fixieren*: Arbeitsteilung, Unterordnung und Konditionierung fesseln sie an einen ausschließlichen Gegenstand. Es gäbe viele andere Dinge, für die sie sich als Teilhaber interessieren könnten: die Arbeitsteilung selbst, die Bezahlung, die Strategie, das Schicksal der produktiven Gemeinschaft (33.2).\n4. Die glückliche Unterwerfung ist daher „Einschluss in einen beschränkten Bereich des Genießens“; sie ist noch eine Herrschaft, im Sinne von D20 (33.2).\n5. Nach S25 ist der eigene Nutzen jedes Einzelnen die Vielfalt der Betätigungen seiner Macht; die Herrschaft fesselt die Beherrschten an geringe Gegenstände des Begehrens und behält sich die anderen vor. „Harte“ und „weiche“ Herrschaft unterscheiden sich nur durch ihre Affekte (33.3). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D20", "S25", "T022"], "citation": "", "loc": ["33.1", "33.2", "33.3"], "depends_on": ["T022", "D20", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Il est des « consentements » presque purement joyeux ; comment parler encore de domination ? Par T022, l'aliénation ne peut être imputée à certains seulement, et l'intéressé pourrait retourner le diagnostic à son questionneur (33.1).\n2. La domination au premier sens demeure, mais l'intérêt basal peut être surmonté de désirs plus élevés, au point que la dépendance ne laisse plus de trace affective (33.2).\n3. Or l'épithumogénie a pour effet, et pour intention, de *fixer* le désir des enrôlés : division du travail, subordination et conditionnement les rivent à un objet exclusif. Il est plein d'autres choses auxquelles ils pourraient s'intéresser comme associés : la division du travail elle-même, les rémunérations, la stratégie, le destin de la communauté productive (33.2).\n4. L'assujettissement heureux est donc « enfermement dans un domaine restreint de jouissance » ; c'est encore une domination, au sens de D20 (33.2).\n5. Par S25, l'utile propre de chacun est la variété des effectuations de sa puissance ; la domination rive les dominés à des objets de désir mineurs et se réserve les autres. Domination « dure » et « douce » ne se distinguent que par leurs affects (33.3). ∎", "body_en": "## Argument\n\n1. There are almost purely joyful \"consents\"; how can one still speak of domination? By T022, alienation cannot be imputed to some only, and the person concerned could turn the diagnosis back on the questioner (33.1).\n2. Domination in the first sense remains, but basic interest can be topped by higher desires, to the point that dependence no longer leaves any affective trace (33.2).\n3. Now epithumogeny has the effect, and the intention, of *fixing* the desire of the enlisted: division of labour, subordination and conditioning rivet them to an exclusive object. There are plenty of other things they could take an interest in as associates: the division of labour itself, pay, strategy, the destiny of the productive community (33.2).\n4. Happy subjection is therefore \"confinement in a restricted domain of enjoyment\"; it is still a domination, in the sense of D20 (33.2).\n5. By S25, each one's own advantage is the variety of the enactments of his power; domination rivets the dominated to minor objects of desire and reserves the others for itself. \"Hard\" and \"soft\" domination differ only in their affects (33.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D20", "S25", "T022"], "sections": ["Argumentation"], "demo_refs": ["D20", "S25", "T022"], "mentions": ["D20", "S25", "T022"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T036", "file": "theses/T036.md", "type": "these", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La domination règle la distribution du désirable. La division du travail se convertit en division du désir par un double imaginaire : du comblement et de l'impuissance, qui transforme l'assignation en auto-assignation. Les objets réservés aux dominants doivent être reconnus désirables par les dominés, mais pas pour eux. Cette division arbitraire, diffuse et impersonnelle, est vécue comme une nécessité.", "titre_en": "The division of desire and the imaginary of powerlessness", "enonce_en": "Domination governs the distribution of the desirable. The division of labour converts into a division of desire through a double imaginary: of fulfilment and of powerlessness, which turns assignment into self-assignment. The objects reserved for the dominant must be recognised as desirable by the dominated, but not for them. This arbitrary division, diffuse and impersonal, is experienced as a necessity.", "titre_de": "Die Teilung des Begehrens und das Imaginäre der Ohnmacht", "enonce_de": "Herrschaft regelt die Verteilung des Begehrenswerten. Die Arbeitsteilung verwandelt sich in eine Teilung des Begehrens durch ein doppeltes Imaginäres: das der Erfüllung und das der Ohnmacht, das Zuweisung in Selbstzuweisung verwandelt. Die den Herrschenden vorbehaltenen Gegenstände müssen von den Beherrschten als begehrenswert anerkannt werden, aber nicht für sie. Diese willkürliche, diffuse und unpersönliche Teilung wird als Notwendigkeit erlebt.", "body_de": "## Beweis\n\n1. Nach T035 geht es bei der Herrschaft um Verteilung; die Regelung, die die Begehren der Beherrschten anpasst, verlangt ständige Verzauberung, umso mehr, als die Nachahmung (S06) den Neid auf die sichtbaren Freuden der Großen weckt (34.1).\n2. Daher das doppelte Imaginäre von D21; nach S26 kann man wirklich nicht, was man sich vorstellt, nicht zu können: Die Zuweisung wird zur Selbstzuweisung (34.1).\n3. Nach S27 sucht das Begehren seine Bestätigung im Begehren der anderen; nach S13 will jeder, dass die anderen nach seiner Sinnesart leben, und alle stehen einander im Weg. Die meisten sozialen Freuden sind daher differenziell: *Vorbehalten* und *Fernhalten* sind die der Herrschaft eigenen Gesten (34.2).\n4. Diese Zuweisungen sind vor dem Hintergrund anthropol
