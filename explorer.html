'époque voudrait faire la clé de lecture du rapport salarial » (08.2). Lordon distingue le titre de la thèse : la thèse de La Boétie « vaut mieux que son titre » (08.2, 10.1). La formule suppose un individu-sujet libre d'arbitre, dont les actes seraient l'effet d'un vouloir souverain. Elle reste alors une énigme insoluble (comment vouloir un état indésirable ?) et ne peut servir que d'appel politique au soulèvement des consciences, non de compréhension par les causes (08.2).", "body_en": "## As Lordon presents it\n\nA formula one ends up \"harping on\" for want of anything else (01.8): La Boétie's, which \"the age would like to make the key to reading the wage relation\" (08.2). Lordon distinguishes the title from the thesis: La Boétie's thesis \"is worth more than its title\" (08.2, 10.1). The formula assumes an individual-subject endowed with free will, whose acts would be the effect of a sovereign will. It then remains an insoluble riddle (how can one will an undesirable state?) and can only serve as a political call for the uprising of consciences, not as an understanding through causes (08.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R02", "file": "refutees/R02.md", "type": "refutee", "partie": "1", "titre": "L'intérêt comme calcul, le don comme désintéressement", "enonce": "L'intérêt se réduirait au calcul utilitariste ; à côté de lui existeraient des conduites désintéressées, un altruisme pur où le soi renoncerait à tout compte.", "titre_en": "Interest as calculation, the gift as disinterestedness", "enonce_en": "Interest would boil down to utilitarian calculation; alongside it there would be disinterested conduct, a pure altruism in which the self renounced all reckoning.", "titre_de": "Das Interesse als Kalkül, die Gabe als Uneigennützigkeit", "enonce_de": "Das Interesse liefe auf utilitaristisches Kalkül hinaus; daneben gäbe es uneigennütziges Verhalten, einen reinen Altruismus, in dem das Selbst auf jede Berechnung verzichtete.", "body_de": "## Wie Lordon sie darstellt\n\nDie Position der „Freunde der uneigennützigen Gabe“, insbesondere des MAUSS (Anm. 4), die den *homo donator* gegen den *homo œconomicus* verteidigen (05.2). Nach Lordon bestätigen sie die utilitaristische Verkürzung, die sie bekämpfen, indem sie ihrem Gegner das Wort Interesse und die Reichweite eines weit umfassenderen Begriffs überlassen.", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["05.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nPosition des « amis du don désintéressé », en particulier du MAUSS (note 4), qui défendent l'*homo donator* contre l'*homo œconomicus* (05.2). Selon Lordon, ils valident la réduction utilitariste qu'ils combattent, en abandonnant à l'adversaire le mot d'intérêt et l'étendue d'un concept bien plus vaste.", "body_en": "## As Lordon presents it\n\nThe position of the \"friends of the disinterested gift\", in particular MAUSS (note 4), who defend *homo donator* against *homo œconomicus* (05.2). According to Lordon, they validate the utilitarian reduction they fight, abandoning to their opponent the word interest and the scope of a far broader concept.", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R03", "file": "refutees/R03.md", "type": "refutee", "partie": "1", "titre": "Le désir comme attraction par le désirable", "enonce": "Le désir serait la traction exercée sur nous par des choses désirables en elles-mêmes, qui préexisteraient au désir.", "titre_en": "Desire as attraction by the desirable", "enonce_en": "Desire would be the pull exerted on us by things desirable in themselves, which would pre-exist desire.", "titre_de": "Das Begehren als Anziehung durch das Begehrenswerte", "enonce_de": "Das Begehren wäre der Zug, den an sich begehrenswerte Dinge auf uns ausüben, die dem Begehren vorausgingen.", "body_de": "## Wie Lordon sie darstellt\n\nDie „gewöhnliche Auffassung des Begehrens“, die die Lektüre Spinozas umkehrt (08.3). Lordon kommt in 22.2 gegen „die spontane Vorstellung, die den Vorrang des Werts vor dem Begehren setzt“, auf sie zurück (D17).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["08.3", "22.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa « conception ordinaire du désir », que la lecture de Spinoza renverse (08.3). Lordon y revient en 22.2 contre « la représentation spontanée qui pose l'antériorité de la valeur au désir » (D17).", "body_en": "## As Lordon presents it\n\nThe \"ordinary conception of desire\", which the reading of Spinoza reverses (08.3). Lordon returns to it in 22.2 against \"the spontaneous representation that posits the anteriority of value to desire\" (D17).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": ["D17"], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R04", "file": "refutees/R04.md", "type": "refutee", "partie": "1", "titre": "La symétrie du capital et du travail", "enonce": "Capital et travail dépendraient également l'un de l'autre, puisque l'employeur a autant besoin de force de travail que le salarié a besoin d'argent.", "titre_en": "The symmetry of capital and labour", "enonce_en": "Capital and labour would depend equally on each other, since the employer needs labour power as much as the employee needs money.", "titre_de": "Die Symmetrie von Kapital und Arbeit", "enonce_de": "Kapital und Arbeit hingen gleichermaßen voneinander ab, da der Arbeitgeber die Arbeitskraft ebenso braucht wie der Angestellte das Geld.", "body_de": "## Wie Lordon sie darstellt\n\nDer Einwand wird von Lordon selbst formuliert („Man wird einwenden, dass …“, 09.2): Die „Lieferanten der Maschinen“ brauchen formal die „Lieferanten der Arbeit“ nicht weniger als umgekehrt.", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["09.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'objection est formulée par Lordon lui-même (« On objectera que… », 09.2) : les « apporteurs de machines » n'ont formellement pas moins besoin des « apporteurs de travail » que l'inverse.", "body_en": "## As Lordon presents it\n\nThe objection is formulated by Lordon himself (\"It will be objected that…\", 09.2): the \"providers of machines\" formally need the \"providers of labour\" no less than the reverse.", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R05", "file": "refutees/R05.md", "type": "refutee", "partie": "1", "titre": "La retenue du licenciement comme norme morale", "enonce": "Sous le fordisme, les employeurs se seraient retenus de licencier par respect d'une norme morale : priver les salariés de leur subsistance serait trop grave pour relever d'une décision économique.", "titre_en": "Restraint in dismissals as a moral norm", "enonce_en": "Under Fordism, employers would have refrained from dismissing out of respect for a moral norm: depriving employees of their livelihood would be too serious to be an economic decision.", "titre_de": "Die Zurückhaltung bei Entlassungen als moralische Norm", "enonce_de": "Im Fordismus hätten die Arbeitgeber aus Achtung vor einer moralischen Norm auf Entlassungen verzichtet: Die Angestellten ihres Lebensunterhalts zu berauben, wäre zu schwerwiegend, um eine wirtschaftliche Entscheidung zu sein.", "body_de": "## Wie Lordon sie darstellt\n\nDas ist der Sinn der „quasi-moralischen Norm“, den die fordistische Beschäftigungsstabilität in den Augen der Öffentlichkeit annahm (16.1). Die Öffentlichkeit „hatte geglaubt oder zu glauben gewagt“, die Entlassung sei tabu (16.2).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["16.1", "16.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nC'est la signification de « quasi-norme morale » que la stabilité de l'emploi fordien a prise aux yeux de l'opinion (16.1). L'opinion « avait cru, ou s'était aventurée à croire » que le licenciement était un interdit (16.2).", "body_en": "## As Lordon presents it\n\nThis is the meaning of \"quasi-moral norm\" that Fordist job stability took on in the eyes of public opinion (16.1). Opinion \"had believed, or had ventured to believe\" that dismissal was taboo (16.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R06", "file": "refutees/R06.md", "type": "refutee", "partie": "2", "titre": "Le consentement, approbation d'une volonté libre", "enonce": "Consentir serait donner l'approbation intime d'une volonté libre : le sujet authentique, autonome et auto-fondé, parlerait en son noyau quand il consent.", "titre_en": "Consent, the approval of a free will", "enonce_en": "To consent would be to give the inner approval of a free will: the authentic subject, autonomous and self-founded, would speak from its core when it consents.", "titre_de": "Die Zustimmung, Billigung eines freien Willens", "enonce_de": "Zustimmen hieße, die innere Billigung eines freien Willens zu geben: Das authentische, autonome und selbstbegründete Subjekt spräche aus seinem Kern, wenn es zustimmt.", "body_de": "## Wie Lordon sie darstellt\n\nDas ist die „falsche Durchsichtigkeit“ der Zustimmung, ein Symptom der Metaphysik der Subjektivität (20.2-20.3). Sie stößt auf „problematische Zustimmungen“ (der Guru, der Schleier, zwölf Stunden am Tag arbeiten), die sie nur beiseiteschieben kann, indem sie bestimmte Gegenstände für nicht zustimmungsfähig oder bestimmte Subjekte für zeitweilig unzurechnungsfähig erklärt (20.3).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["20.3", "20.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nC'est la « fausse transparence » du consentement, symptôme de la métaphysique de la subjectivité (20.2-20.3). Elle bute sur les « consentements à problème » (le gourou, le voile, le travail douze heures par jour), qu'elle ne peut écarter qu'en déclarant certains objets inconsentables ou certains sujets intermittents (20.3).", "body_en": "## As Lordon presents it\n\nThis is the \"false transparency\" of consent, a symptom of the metaphysics of subjectivity (20.2-20.3). It runs up against \"problem consents\" (the guru, the veil, working twelve hours a day), which it can only set aside by declaring certain objects unconsentable or certain subjects intermittent (20.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R07", "file": "refutees/R07.md", "type": "refutee", "partie": "2", "titre": "L'aliénation comme étrangeté à soi", "enonce": "Être aliéné serait être séparé de soi-même : un sujet, autonome en son noyau, serait empêché de procéder de lui-même par un attachement à autre chose que lui.", "titre_en": "Alienation as estrangement from oneself", "enonce_en": "To be alienated would be to be separated from oneself: a subject, autonomous at its core, would be prevented from proceeding from itself by an attachment to something other than itself.", "titre_de": "Die Entfremdung als Trennung von sich selbst", "enonce_de": "Entfremdet zu sein hieße, von sich selbst getrennt zu sein: Ein in seinem Kern autonomes Subjekt würde durch die Bindung an etwas anderes als sich selbst daran gehindert, aus sich selbst hervorzugehen.", "body_de": "## Wie Lordon sie darstellt\n\nLordon verbindet sie mit „voralthusserianischen“ Lesarten von Marx (23.3) und mit dem gewöhnlichen Sprachgebrauch, der die Entfremdung den Bindungen vorbehält, die wir uns selbst nicht wünschen würden (20.5).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["20.5", "23.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLordon la rattache aux lectures « pré-althussériennes » de Marx (23.3) et à l'usage courant qui réserve l'aliénation aux attachements dont nous ne voudrions pas pour nous (20.5).", "body_en": "## As Lordon presents it\n\nLordon links it to \"pre-Althusserian\" readings of Marx (23.3) and to the common usage that reserves alienation for the attachments we would not want for ourselves (20.5).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2425492}, {"id": "R08", "file": "refutees/R08.md", "type": "refutee", "partie": "2", "titre": "L'intériorité et l'intériorisation", "enonce": "Le consentement serait l'adhésion d'un for intérieur : les normes seraient « intériorisées », et nos états d'âme situés au-dedans de nous.", "titre_en": "Interiority and internalisation", "enonce_en": "Consent would be the adherence of an inner self: norms would be \"internalised\", and our states of mind located inside us.", "titre_de": "Innerlichkeit und Verinnerlichung", "enonce_de": "Die Zustimmung wäre die Zustimmung eines inneren Selbst: Die Normen würden „verinnerlicht“, und unsere Gemütszustände befänden sich in uns.", "body_de": "## Wie Lordon sie darstellt\n\nEin Erbe der „cartesianischen Sackgassen“ (28.2): Damit die Seele dem Körper befehlen kann, muss Descartes ihnen einen gemeinsamen Ort finden, die Zirbeldrüse. Die Neurowissenschaften, die den Geist mit dem Gehirn verwechseln, „suchen weiter ‚innen‘“ (28.2).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["28.1", "28.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nHéritage des « impasses cartésiennes » (28.2) : pour que l'âme commande au corps, Descartes doit leur trouver un lieu commun, la glande pinéale. Les neurosciences qui confondent l'esprit et le cerveau « continuent de fouiller “dedans” » (28.2).", "body_en": "## As Lordon presents it\n\nA legacy of the \"Cartesian dead ends\" (28.2): for the soul to command the body, Descartes must find them a common place, the pineal gland. The neurosciences that confuse the mind with the brain \"keep searching 'inside'\" (28.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2472332}, {"id": "R09", "file": "refutees/R09.md", "type": "refutee", "partie": "2", "titre": "L'antinomie de la contrainte et du consentement", "enonce": "Contrainte et consentement, coercition et légitimité, *hard power* et *soft power* désigneraient deux opérations objectives différentes : la force extérieure d'un côté, l'assentiment intérieur de l'autre.", "titre_en": "The antinomy of constraint and consent", "enonce_en": "Constraint and consent, coercion and legitimacy, *hard power* and *soft power* would designate two different objective operations: external force on one side, inner assent on the other.", "titre_de": "Die Antinomie von Zwang und Zustimmung", "enonce_de": "Zwang und Zustimmung, Nötigung und Legitimität, *hard power* und *soft power* bezeichneten zwei verschiedene objektive Vorgänge: äußere Gewalt auf der einen Seite, innere Billigung auf der anderen.", "body_de": "## Wie Lordon sie darstellt\n\nEine „falsche Antinomie“ (21.4), in die selbst Durkheim verfällt, wenn er den „Zwang“ zur Wirkungsweise der Normen macht: Er hält für eine objektive Tatsache, was nur Ausdruck eines Gefühls ist (21.4). Dieselbe Aporie für Nötigung und Legitimität, *hard* und *soft power* (28.3).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["21.4", "28.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne « antinomie fausse » (21.4), à laquelle même Durkheim se laisse prendre en faisant de la « contrainte » le mode opératoire des normes : il prend pour un fait objectif ce qui n'est que l'expression d'un sentiment (21.4). Même aporie pour la coercition et la légitimité, le *hard* et le *soft power* (28.3).", "body_en": "## As Lordon presents it\n\nA \"false antinomy\" (21.4), into which even Durkheim falls when he makes \"constraint\" the mode of operation of norms: he takes for an objective fact what is only the expression of a feeling (21.4). Same aporia for coercion and legitimacy, *hard* and *soft power* (28.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.2472332}, {"id": "R10", "file": "refutees/R10.md", "type": "refutee", "partie": "2", "titre": "La demande d'amour au travail, sublimation de l'amour parental", "enonce": "La quête d'amour et de reconnaissance dans le travail serait une métamorphose, par sublimation, de la demande amoureuse originelle de l'enfant envers ses parents.", "titre_en": "The demand for love at work, a sublimation of parental love", "enonce_en": "The quest for love and recognition at work would be a metamorphosis, through sublimation, of the child's original demand for love towards its parents.", "titre_de": "Die Forderung nach Liebe in der Arbeit, Sublimierung der Elternliebe", "enonce_de": "Die Suche nach Liebe und Anerkennung in der Arbeit wäre eine Verwandlung, durch Sublimierung, der ursprünglichen Liebesforderung des Kindes an seine Eltern.", "body_de": "## Wie Lordon sie darstellt\n\nDie ontogenetische Hypothese der Psychoanalyse, die dieser Forderung „absoluten Vorrang“ einräumt (23.2).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["23.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'hypothèse ontogénétique de la psychanalyse, qui accorde à cette demande « l'absolu primat » (23.2).", "body_en": "## As Lordon presents it\n\nThe ontogenetic hypothesis of psychoanalysis, which grants this demand \"absolute primacy\" (23.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R11", "file": "refutees/R11.md", "type": "refutee", "partie": "3", "titre": "La valeur objective et l'exploitation comme extraction de plus-value", "enonce": "Il existerait une valeur substantielle, mesurée par le temps de travail abstrait ; l'exploitation serait l'appropriation par le capital de la plus-value, écart entre la valeur produite et la valeur de reproduction de la force de travail.", "titre_en": "Objective value, and exploitation as extraction of surplus value", "enonce_en": "There would be a substantial value, measured by abstract labour time; exploitation would be capital's appropriation of surplus value, the gap between the value produced and the value of reproducing labour power.", "titre_de": "Der objektive Wert und die Ausbeutung als Entziehung von Mehrwert", "enonce_de": "Es gäbe einen substanziellen Wert, gemessen an der abstrakten Arbeitszeit; die Ausbeutung wäre die Aneignung des Mehrwerts durch das Kapital, der Differenz zwischen dem erzeugten Wert und dem Wert der Reproduktion der Arbeitskraft.", "body_de": "## Wie Lordon sie darstellt\n\nDie marxsche Arbeitswerttheorie (35.1). Lordon sieht darin, zusammen mit der Dialektik des Negativen, die Hauptabweichung zwischen Marx und Spinoza: Der substanzielle Wert ist eine „heimlich ins Herz der Immanenz wieder eingeführte Figur der Transzendenz“ (35.2). Die Definition des Werts der Arbeitskraft ist überdies zirkulär: Es ist der Lohn, der ihn angibt (35.1).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["35.1", "35.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa théorie marxienne de la valeur-travail (35.1). Lordon y voit la principale divergence entre Marx et Spinoza, avec la dialectique du négatif : la valeur substantielle est une « figure de la transcendance subrepticement réintroduite au cœur de l'immanence » (35.2). La définition de la valeur de la force de travail est en outre circulaire : c'est le salaire qui l'indique (35.1).", "body_en": "## As Lordon presents it\n\nThe Marxian labour theory of value (35.1). Lordon sees in it the main divergence between Marx and Spinoza, together with the dialectic of the negative: substantial value is a \"figure of transcendence surreptitiously reintroduced at the heart of immanence\" (35.2). The definition of the value of labour power is moreover circular: it is the wage that indicates it (35.1).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R12", "file": "refutees/R12.md", "type": "refutee", "partie": "3", "titre": "Le changement suppose le libre arbitre", "enonce": "Le déterminisme ne pourrait penser le changement, puisque « tout est écrit » ; seules des volontés libres pourraient produire le nouveau et briser leurs chaînes.", "titre_en": "Change presupposes free will", "enonce_en": "Determinism could not think change, since \"everything is written\"; only free wills could produce the new and break their chains.", "titre_de": "Wandel setzt freien Willen voraus", "enonce_de": "Der Determinismus könnte den Wandel nicht denken, da „alles geschrieben steht“; nur freie Willen könnten das Neue hervorbringen und ihre Ketten sprengen.", "body_de": "## Wie Lordon sie darstellt\n\nEin Missverständnis des Determinismus (38.1), das, wie Lordon vermerkt, die Diskurse der Verherrlichung des Aufstands und die Lobreden auf den Unternehmer teilen: beide philosophisch liberal (38.2). Das „Neue“ beansprucht, ein ursachloses Auftauchen zu sein, das heißt ein Wunder (38.3).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["38.1", "38.2", "38.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUn contresens sur le déterminisme (38.1), partagé, note Lordon, par les discours d'exaltation du soulèvement et par les apologies de l'entrepreneur : tous deux libéraux en philosophie (38.2). Le « nouveau » se veut un surgissement sans cause, c'est-à-dire un miracle (38.3).", "body_en": "## As Lordon presents it\n\nA misreading of determinism (38.1), shared, Lordon notes, by the discourses exalting uprising and by the apologies for the entrepreneur: both liberal in philosophy (38.2). The \"new\" claims to be an uncaused emergence, that is, a miracle (38.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R13", "file": "refutees/R13.md", "type": "refutee", "partie": "3", "titre": "La désaliénation comme retrouvaille de sa puissance", "enonce": "L'aliéné serait « coupé de sa puissance d'agir » ; s'émanciper serait la rejoindre, la réapproprier, recoïncider avec soi.", "titre_en": "Disalienation as recovering one's power", "enonce_en": "The alienated would be \"cut off from their power of acting\"; emancipation would mean rejoining it, reappropriating it, coinciding with oneself again.", "titre_de": "Die Aufhebung der Entfremdung als Wiedergewinnung der eigenen Macht", "enonce_de": "Die Entfremdeten wären „von ihrer Handlungsmacht abgeschnitten“; Emanzipation hieße, sich mit ihr wieder zu vereinen, sie sich wieder anzueignen, wieder mit sich selbst zusammenzufallen.", "body_de": "## Wie Lordon sie darstellt\n\nDas Schema heutiger Relektüren des jungen Marx und nach Pascal Sévérac auch von Deleuze selbst in seiner Spinoza-Lektüre (40.1).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["40.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schème des relectures contemporaines du jeune Marx, et, selon Pascal Sévérac, de Deleuze lui-même lisant Spinoza (40.1).", "body_en": "## As Lordon presents it\n\nThe schema of contemporary rereadings of the young Marx, and, according to Pascal Sévérac, of Deleuze himself reading Spinoza (40.1).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R14", "file": "refutees/R14.md", "type": "refutee", "partie": "3", "titre": "La condition salariale fait à elle seule la classe", "enonce": "La situation objective de vendeur de force de travail déterminerait à elle seule l'appartenance de classe ; l'engagement vécu des salariés ne serait qu'une superficialité « subjectiviste ».", "titre_en": "The wage condition alone makes class", "enonce_en": "The objective situation of seller of labour power would alone determine class membership; the lived commitment of employees would be a mere \"subjectivist\" superficiality.", "titre_de": "Die Lohnabhängigkeit allein macht die Klasse", "enonce_de": "Die objektive Lage des Verkäufers von Arbeitskraft bestimmte allein die Klassenzugehörigkeit; das gelebte Engagement der Angestellten wäre bloß eine „subjektivistische“ Oberflächlichkeit.", "body_de": "## Wie Lordon sie darstellt\n\nDas Schema der ursprünglichen marxschen Theorie, in Schwierigkeiten geraten, sobald die Führungskraft Angestellter wurde, und durch die „Ausbreitung der Managementschicht“ (41.1, Anm. 140). Der Grenzfall des angestellten Vorstandschefs widerlegt es durch Zurückführung aufs Absurde (41.3).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["41.1", "41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLe schéma de la théorie marxienne originelle, mis en difficulté dès que le dirigeant est devenu salarié, et par la « diffusion cadriste » (41.1, note 140). Le cas limite du PDG salarié la réfute par l'absurde (41.3).", "body_en": "## As Lordon presents it\n\nThe schema of the original Marxian theory, put in difficulty as soon as the executive became an employee, and by the \"spread of the managerial layer\" (41.1, note 140). The limit case of the salaried CEO refutes it by reductio ad absurdum (41.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R15", "file": "refutees/R15.md", "type": "refutee", "partie": "3", "titre": "Les classes ont disparu", "enonce": "Il n'y aurait plus de classes : la fragmentation du salariat aurait rendu caduque l'idée même de lutte des classes.", "titre_en": "Classes have disappeared", "enonce_en": "There would be no more classes: the fragmentation of wage labour would have made the very idea of class struggle obsolete.", "titre_de": "Die Klassen sind verschwunden", "enonce_de": "Es gäbe keine Klassen mehr: Die Zersplitterung der Lohnarbeit hätte schon die Idee des Klassenkampfs überholt gemacht.", "body_de": "## Wie Lordon sie darstellt\n\nDie Position „einer gewissen Soziologie, die es eilig hat, die Seite des Marxismus umzublättern, um sich umso besser dem liberalen Zeitgeist anzuschließen“ (41.4).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["41.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa position d'« une certaine sociologie désireuse de tourner au plus vite la page du marxisme pour mieux épouser l'air du temps libéral » (41.4).", "body_en": "## As Lordon presents it\n\nThe position of \"a certain sociology eager to turn the page on Marxism as fast as possible, the better to embrace the liberal spirit of the times\" (41.4).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}, {"id": "R16", "file": "refutees/R16.md", "type": "refutee", "partie": "3", "titre": "L'émancipation comme grand soir", "enonce": "Il suffirait d'abolir la propriété privée des moyens de production pour en finir avec la domination ; la révolution ferait advenir d'un coup un ordre tout autre, où les classes et le politique s'éteindraient.", "titre_en": "Emancipation as the \"grand soir\"", "enonce_en": "It would suffice to abolish private ownership of the means of production to put an end to domination; revolution would bring about at a stroke an entirely different order, in which classes and politics would wither away.", "titre_de": "Die Emanzipation als „großer Abend“", "enonce_de": "Es würde genügen, das Privateigentum an den Produktionsmitteln abzuschaffen, um der Herrschaft ein Ende zu setzen; die Revolution würde mit einem Schlag eine ganz andere Ordnung herbeiführen, in der Klassen und Politik absterben würden.", "body_de": "## Wie Lordon sie darstellt\n\nDie übereilten Lesarten von Marx, die die Macht auf die Eigentumsordnung zurückführen (42.1); die Idee des „großen Abends“, der großen Nacht der Revolution (43.2); das „Absterben der Politik“, „postpolitische Phantasmagorien“, vielleicht „Marx' tiefster anthropologischer Irrtum“ (43.3).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "", "loc": ["42.1", "43.2", "43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLes lectures trop rapides de Marx qui réduisent le pouvoir au régime de propriété (42.1) ; l'idée du « grand soir » (43.2) ; l'« extinction du politique », « fantasmagories post-politiques », peut-être « l'erreur anthropologique la plus profonde de Marx » (43.3).", "body_en": "## As Lordon presents it\n\nThe overhasty readings of Marx that reduce power to the property regime (42.1); the idea of the \"grand soir\", the great night of revolution (43.2); the \"withering away of politics\", \"post-political phantasmagorias\", perhaps \"Marx's deepest anthropological error\" (43.3).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.248238}], "documents": [{"name": "PARCOURS.md", "kind": "projet", "body": "# Parcours de lecture\n\nLe treillis se parcourt dans tous les sens. Pour une première lecture, voici un fil de seize étapes, de la question du livre à sa conclusion. Chaque étape renvoie à un élément ; de là, « Chemin vers » montre ce sur quoi il repose, « Conséquences » ce qui en découle.\n\n## I. La question\n\n**1.** T001. Comment certains hommes « peuvent »-ils en faire travailler d'autres pour leur désir ? Ce pouvoir est un effet de structure (Marx), mais les structures agissent par les affects (Spinoza).\n\n**2.** T002. Le capitalisme contemporain produit des « dominés heureux ». Il faut repenser la domination sans recourir à la « servitude volontaire ».\n\n## II. Faire faire\n\n**3.** D01, T003. Le conatus est l'énergie du désir. Désirer faire est légitime ; faire faire, enrôler d'autres puissances (D02) au service d'un désir-maître (D03), pose une question politique.\n\n**4.** T006, T007. Dans une économie à travail divisé, la vie passe par l'argent : le rapport salarial est d'abord dépendance, donc domination, la plus puissante qui soit.\n\n**5.** T008, T009. Le désir est hétéronome : ses objets lui viennent du dehors. La servitude volontaire n'existe pas ; il n'y a que la servitude passionnelle, et elle est universelle.\n\n**6.** T014. Mobiliser, c'est aligner : le modèle de l'angle α (voir la [figure de l'angle α](#alpha)).\n\n**7.** T015, T019. Les régimes de mobilisation changent : la faim, puis la consommation, puis l'entreprise néolibérale, qui veut α = 0 et pousse la domination jusqu'à la tyrannie.\n\n## III. Joyeux automobiles\n\n**8.** T021. Le projet néolibéral : faire désirer le travail lui-même (voir la vue des [régimes d'affects](#regimes)).\n\n**9.** T022, T025. Le consentement, l'aliénation et l'intériorité n'existent pas comme on les entend ; contrainte et consentement ne sont que des affects tristes ou joyeux.\n\n**10.** T024, T027, T028. D'où vient l'obéissance joyeuse : le pouvoir règne mieux par l'amour ; l'amour du maître ; les images vocationnelles.\n\n**11.** T029, T034. L'entreprise vise la possession des âmes, mais le fond d'affects tristes demeure.\n\n## IV. Domination, émancipation\n\n**12.** T035, T036. Même joyeuse, la domination réserve le désirable aux uns et en écarte les autres.\n\n**13.** T038. L'exploitation est passionnelle : une capture de puissance d'agir, non une extraction de plus-value.\n\n**14.** T040. La récommune : l'entreprise constituée en démocratie radicale.\n\n**15.** T042, T043. Le changement sans libre arbitre : l'indignation fait « devenir perpendiculaire ».\n\n**16.** T048, T049. Le communisme véritable est un horizon ; mais tous les régimes passionnels ne se valent pas, et le progrès est l'enrichissement de la vie en affects joyeux.\n\n", "body_en": "# Reading path\n\nThe lattice can be explored in every direction. For a first reading, here is a thread of sixteen steps, from the book's question to its conclusion. Each step points to an element; from there, \"Path to\" shows what it rests on, \"Consequences\" what follows from it.\n\n## I. The question\n\n**1.** T001. How \"can\" some men make others work for their desire? This power is an effect of structure (Marx), but structures act through the affects (Spinoza).\n\n**2.** T002. Contemporary capitalism produces \"happy dominated\" people. Domination must be rethought without resorting to \"voluntary servitude\".\n\n## II. Making others do\n\n**3.** D01, T003. The conatus is the energy of desire. Desiring to do is legitimate; having others do, enlisting other powers (D02) in the service of a master-desire (D03), raises a political question.\n\n**4.** T006, T007. In an economy with a division of labour, life goes through money: the wage relation is first dependence, hence domination, the most powerful there is.\n\n**5.** T008, T009. Desire is heteronomous: its objects come to it from outside. Voluntary servitude does not exist; there is only passional servitude, and it is universal.\n\n**6.** T014. Mobilising means aligning: the model of the angle α (see the [figure of the angle α](#alpha)).\n\n**7.** T015, T019. Regimes of mobilisation change: hunger, then consumption, then the neoliberal firm, which wants α = 0 and pushes domination as far as tyranny.\n\n## III. Joyful self-movers\n\n**8.** T021. The neoliberal project: making work itself desired (see the view of the [regimes of affects](#regimes)).\n\n**9.** T022, T025. Consent, alienation and interiority do not exist as they are usually understood; constraint and consent are only sad or joyful affects.\n\n**10.** T024, T027, T028. Where joyful obedience comes from: power reigns better through love; love of the master; vocational images.\n\n**11.** T029, T034. The firm aims at possessing souls, but the background of sad affects remains.\n\n## IV. Domination, emancipation\n\n**12.** T035, T036. Even joyful, domination reserves the desirable for some and keeps it from others.\n\n**13.** T038. Exploitation is passional: a capture of power of acting, not an extraction of surplus value.\n\n**14.** T040. The récommune: the enterprise constituted as a radical democracy.\n\n**15.** T042, T043. Change without free will: indignation makes one \"become perpendicular\".\n\n**16.** T048, T049. True communism is a horizon; but not all passional regimes are equal, and progress is the enrichment of life in joyful affects.\n", "body_de": "# Lesepfad\n\nDas Gitter lässt sich in alle Richtungen erkunden. Für eine erste Lektüre hier ein Faden in sechzehn Schritten, von der Frage des Buches bis zu seinem Schluss. Jeder Schritt verweist auf ein Element; von dort zeigt „Pfad zu“, worauf es beruht, und „Folgen“, was aus ihm folgt.\n\n## I. Die Frage\n\n**1.** T001. Wie „können“ manche Menschen andere für ihr Begehren arbeiten lassen? Diese Macht ist eine Wirkung der Struktur (Marx), doch die Strukturen wirken durch die Affekte (Spinoza).\n\n**2.** T002. Der heutige Kapitalismus bringt „glückliche Beherrschte“ hervor. Herrschaft muss neu gedacht werden, ohne auf die „freiwillige Knechtschaft“ zurückzugreifen.\n\n## II. Andere tun lassen\n\n**3.** D01, T003. Der Conatus ist die Energie des Begehrens. Tun zu wollen ist legitim; andere tun zu lassen, andere Mächte (D02) in den Dienst eines Herrenbegehrens (D03) einzuspannen, wirft eine politische Frage auf.\n\n**4.** T006, T007. In einer arbeitsteiligen Wirtschaft geht das Leben über das Geld: Das Lohnverhältnis ist zuerst Abhängigkeit, also Herrschaft, die mächtigste, die es gibt.\n\n**5.** T008, T009. Das Begehren ist heteronom: Seine Gegenstände kommen ihm von außen. Freiwillige Knechtschaft gibt es nicht; es gibt nur leidenschaftliche Knechtschaft, und sie ist allgemein.\n\n**6.** T014. Mobilisieren heißt ausrichten: das Modell des Winkels α (siehe die [Abbildung des Winkels α](#alpha)).\n\n**7.** T015, T019. Die Mobilisierungsregime wandeln sich: der Hunger, dann der Konsum, dann das neoliberale Unternehmen, das α = 0 will und die Herrschaft bis zur Tyrannei treibt.\n\n## III. Freudige Selbstbeweger\n\n**8.** T021. Das neoliberale Vorhaben: die Arbeit selbst begehren lassen (siehe die Ansicht der [Affektregime](#regimes)).\n\n**9.** T022, T025. Zustimmung, Entfremdung und Innerlichkeit gibt es nicht, so wie man sie gewöhnlich versteht; Zwang und Zustimmung sind nur traurige oder freudige Affekte.\n\n**10.** T024, T027, T028. Woher der freudige Gehorsam kommt: Die Macht herrscht besser durch Liebe; die Liebe zum Herrn; die Berufungsbilder.\n\n**11.** T029, T034. Das Unternehmen zielt auf den Besitz der Seelen, doch der Hintergrund trauriger Affekte bleibt.\n\n## IV. Herrschaft, Emanzipation\n\n**12.** T035, T036. Selbst freudig behält die Herrschaft das Begehrenswerte den einen vor und enthält es den anderen vor.\n\n**13.** T038. Die Ausbeutung ist leidenschaftlich: eine Vereinnahmung von Handlungsmacht, keine Entziehung von Mehrwert.\n\n**14.** T040. Die Récommune: das als radikale Demokratie verfasste Unternehmen.\n\n**15.** T042, T043. Wandel ohne freien Willen: Die Empörung lässt „senkrecht werden“.\n\n**16.** T048, T049. Der wahre Kommunismus ist ein Horizont; doch nicht alle leidenschaftlichen Regime sind gleichwertig, und Fortschritt ist die Bereicherung des Lebens an freudigen Affekten.\n"}, {"name": "NOTICE.md", "kind": "projet", "body": "# Sources, droits et mentions\n\nCe projet reconstruit l'argument d'un livre sous droits. Il n'en reproduit pas le texte : il le **reformule**, en renvoyant à chaque passage, et n'en **cite** que de courts extraits. **Pour lire Lordon, lisez Lordon.**\n\n## Le livre\n\n- Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza*, Paris, La Fabrique, 2010. © Frédéric Lordon et La Fabrique éditions.\n- Traduction anglaise : *Willing Slaves of Capital. Spinoza and Marx on Desire*, trad. Gabriel Ash, Londres, Verso, 2014.\n- Ce que le dépôt contient du livre : de courtes citations (433 passages, presque tous de quelques mots ; au plus 29 mots consécutifs pour Lordon), chacune avec son repère (section et paragraphe), et les titres de ses sections, utilisés comme repères. Le texte lui-même n'est pas distribué : le dossier `source/` est exclu du dépôt, et `outils/check.py` vérifie qu'il le reste.\n- Ces citations relèvent du droit de courte citation (Code de la propriété intellectuelle, art. L122-5, 3°) : elles sont incorporées à un travail d'analyse et leur source est indiquée. Elles ne sont **pas** couvertes par les licences du dépôt (voir `LICENSE`).\n\n## Les versions anglaise et allemande\n\n- Les versions anglaise et allemande traduisent la reconstruction (titres, énoncés, démonstrations, commentaires). Elles sont faites sur la reconstruction française, non sur une traduction publiée du livre (en anglais, celle de Verso), qui n'est ni utilisée ni citée.\n- Dans les corps anglais et allemands, les mots de Lordon, quand ils sont cités, sont rendus brièvement par nous, avec les mêmes repères ; le champ `citation` garde l'original français.\n- Les titres de section et les repères (§ 08.4) renvoient à l'édition française.\n\n## Spinoza\n\n- Les liens vers l'*Éthique* renvoient à [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (en ligne : <https://treillis.qpetit.com/spinoza/>), qui publie le texte latin et des traductions du domaine public. Rien de SpinozaGraph n'est copié ici.\n- Les énoncés des prémisses S sont des reformulations de Spinoza. Les citations de Spinoza sont celles que fait Lordon, dans les traductions qu'il emploie : Robert Misrahi pour l'*Éthique* (traduction protégée), Charles Ramond pour le *Traité politique* (traduction protégée), Charles Appuhn pour quelques lettres et passages (domaine public). Elles sont courtes et sourcées.\n\n## Autres auteurs\n\nLes citations de Marx et Engels, Kant, Pascal, Camus, Bourdieu, Deleuze, Balibar et d'autres sont celles que rapporte Lordon, avec la référence qu'il donne en note.\n\n## Le projet\n\n- Reconstruction, traductions anglaise et allemande, outils et explorateur : auteur du dépôt [mqtin](https://github.com/mqtin), 2026, avec l'aide de Claude (Anthropic).\n- L'explorateur est adapté de celui d'Homo Status, autre projet du même auteur (<https://treillis.qpetit.com/status>).\n- Licences : code sous GPL-3.0, travail de reconstruction (et ses traductions) sous CC BY-SA 4.0, citations exclues (voir `LICENSE`).\n\n**Ces mentions doivent être conservées** dans toute redistribution du dépôt ou d'`explorer.html`.\n", "body_en": "# Sources, rights and credits\n\nThis project reconstructs the argument of a book under copyright. It does not reproduce its text: it **paraphrases** it, pointing to each passage, and **quotes** only short extracts. **To read Lordon, read Lordon.**\n\n## The book\n\n- Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza*, Paris, La Fabrique, 2010. © Frédéric Lordon and La Fabrique éditions.\n- English translation: *Willing Slaves of Capital. Spinoza and Marx on Desire*, trans. Gabriel Ash, London, Verso, 2014.\n- What the repository contains of the book: short quotations (433 passages, almost all a few words long; at most 29 consecutive words of Lordon), each with its locator (section and paragraph), and the titles of its sections, used as locators. The text itself is not distributed: the `source/` folder is excluded from the repository, and `outils/check.py` checks that it stays so.\n- These quotations fall under the right of short quotation (French Intellectual Property Code, art. L122-5, 3°): they are incorporated into a work of analysis and their source is given. They are **not** covered by the repository's licences (see `LICENSE`).\n\n## The English version\n\n- The English version translates the reconstruction (titles, statements, demonstrations, comments). It was made from the French reconstruction, not from the published English translation, which is neither used nor quoted.\n- In the English bodies, Lordon's words, where quoted, are our own short renderings of the French, with the same locators; the `citation` field keeps the original French.\n- Section titles and locators (§ 08.4) refer to the French edition.\n\n## Spinoza\n\n- Links to the *Ethics* point to [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (online: <https://treillis.qpetit.com/spinoza/>), which publishes the Latin text and public-domain translations, including Elwes's English. Nothing from SpinozaGraph is copied here.\n- The statements of the S premises are paraphrases of Spinoza. The quotations from Spinoza are those Lordon makes, in the translations he uses: Robert Misrahi for the *Ethics* (protected translation), Charles Ramond for the *Political Treatise* (protected translation), Charles Appuhn for a few letters and passages (public domain). They are short and sourced.\n\n## Other authors\n\nQuotations from Marx and Engels, Kant, Pascal, Camus, Bourdieu, Deleuze, Balibar and others are those Lordon reports, with the reference he gives in his notes.\n\n## The project\n\n- Reconstruction, translation, tools and explorer: repository author [mqtin](https://github.com/mqtin), 2026, with the help of Claude (Anthropic).\n- The explorer is adapted from that of Homo Status, another project by the same author (<https://treillis.qpetit.com/status>).\n- Licences: code under GPL-3.0, reconstruction work (and its translation) under CC BY-SA 4.0, quotations excluded (see `LICENSE`).\n\n**These notices must be kept** in any redistribution of the repository or of `explorer.html`.\n", "body_de": "# Quellen, Rechte und Angaben\n\nDieses Projekt rekonstruiert die Argumentation eines urheberrechtlich geschützten Buches. Es gibt seinen Text nicht wieder: Es **paraphrasiert** ihn, mit Verweis auf jede Stelle, und **zitiert** nur kurze Auszüge. **Wer Lordon lesen will, lese Lordon.**\n\n## Das Buch\n\n- Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza*, Paris, La Fabrique, 2010. © Frédéric Lordon und La Fabrique éditions.\n- Englische Übersetzung: *Willing Slaves of Capital. Spinoza and Marx on Desire*, übers. von Gabriel Ash, London, Verso, 2014.\n- Was das Repository vom Buch enthält: kurze Zitate (433 Stellen, fast alle wenige Wörter lang; höchstens 29 aufeinanderfolgende Wörter von Lordon), jeweils mit Fundstelle (Abschnitt und Absatz), und die Titel seiner Abschnitte, die als Fundstellen dienen. Der Text selbst wird nicht verbreitet: Der Ordner `source/` ist aus dem Repository ausgeschlossen, und `outils/check.py` prüft, dass es so bleibt.\n- Diese Zitate fallen unter das Recht des kurzen Zitats (französisches Gesetzbuch über geistiges Eigentum, Art. L122-5, 3°): Sie sind in eine analytische Arbeit eingebunden, und ihre Quelle ist angegeben. Sie fallen **nicht** unter die Lizenzen des Repositorys (siehe `LICENSE`).\n\n## Die übersetzten Fassungen\n\n- Die englische und die deutsche Fassung übersetzen die Rekonstruktion (Titel, Aussagen, Beweise, Kommentare). Sie beruhen auf der französischen Rekonstruktion, nicht auf einer veröffentlichten Übersetzung des Buches, die weder benutzt noch zitiert wird.\n- In den englischen und deutschen Texten sind Lordons Worte, wo sie zitiert werden, unsere eigenen kurzen Übertragungen aus dem Französischen, mit denselben Fundstellen; das Feld `citation` bewahrt das französische Original.\n- Abschnittstitel und Fundstellen (§ 08.4) beziehen sich auf die französische Ausgabe.\n\n## Spinoza\n\n- Die Verweise auf die *Ethik* führen zu [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (online: <https://treillis.qpetit.com/spinoza/>), das den lateinischen Text und gemeinfreie Übersetzungen veröffentlicht. Nichts aus SpinozaGraph wird hier kopiert.\n- Die Aussagen der S-Prämissen sind Paraphrasen Spinozas. Die Spinoza-Zitate sind die, die Lordon anführt, in den Übersetzungen, die er verwendet: Robert Misrahi für die *Ethik* (geschützte Übersetzung), Charles Ramond für den *Politischen Traktat* (geschützte Übersetzung), Charles Appuhn für einige Briefe und Stellen (gemeinfrei). Sie sind kurz und belegt; in der deutschen Fassung sind sie von uns übertragen.\n\n## Andere Autoren\n\nDie Zitate von Marx und Engels, Kant, Pascal, Camus, Bourdieu, Deleuze, Balibar und anderen sind die, die Lordon anführt, mit der Referenz, die er in seinen Anmerkungen angibt.\n\n## Das Projekt\n\n- Rekonstruktion, Übersetzungen, Werkzeuge und Explorer: Autor des Repositorys [mqtin](https://github.com/mqtin), 2026, mit Hilfe von Claude (Anthropic).\n- Der Explorer ist von dem von Homo Status übernommen, einem anderen Projekt desselben Autors (<https://treillis.qpetit.com/status>).\n- Lizenzen: Code unter GPL-3.0, Rekonstruktionsarbeit (und ihre Übersetzungen) unter CC BY-SA 4.0, Zitate ausgenommen (siehe `LICENSE`).\n\n**Diese Angaben müssen** bei jeder Weitergabe des Repositorys oder von `explorer.html` **erhalten bleiben**.\n"}, {"name": "AGENT.md", "kind": "projet", "body": "# AGENT.md : *Capitalisme, désir et servitude* en treillis\n\nCe fichier définit l'objectif, la méthode et les conventions du projet. Il s'adresse à l'agent (Claude) et à l'auteur. Tout travail dans ce dépôt doit s'y conformer. Il évolue avec le projet, et toute modification est discutée avec l'auteur.\n\nProjets voisins : [SpinozaGraph](https://github.com/mqtin/SpinozaGraph) (l'*Éthique*, `/spinoza`) et Homo Status (`/status`, dépôt `status-and-politics`), dont ce projet reprend l'outillage et une partie des conventions.\n\n## 1. Objectif\n\nReconstruire **fidèlement** l'argument de Frédéric Lordon, *Capitalisme, désir et servitude. Marx et Spinoza* (La Fabrique, 2010), dans l'ordre géométrique, et le rendre explorable comme un graphe. Depuis une thèse, on doit pouvoir voir le chemin qui y mène, jusqu'aux prémisses spinozistes et marxiennes, et ce qui en découle.\n\nC'est une **reconstruction, non une critique**. On ne juge pas les thèses, on ne cherche pas de rivales et on ne dit pas ce qui les réfuterait : ce travail-là appartient à Homo Status (`status-and-politics/references/lordon.md`). Ici, la seule question est : *qu'est-ce que Lordon dit, et comment est-ce que cela s'enchaîne ?*\n\n## 2. Fidélité\n\n1. **Rien qui ne soit dans le livre.** Chaque élément reformule un passage du livre. Si un pas manque pour relier deux thèses, on le signale (§ 2.4) ; on n'ajoute pas de contenu.\n2. **Toute affirmation a son repère** (champ `loc`, § 6). Dans une démonstration, chaque étape porte son repère entre parenthèses : « (08.4) ».\n3. **Les renvois à Spinoza sont ceux de Lordon.** Quand Lordon cite l'*Éthique*, on note le renvoi tel quel (champ `ethique`). Quand on identifie soi-même la proposition qu'il utilise sans la citer, on l'écrit dans le corps, marqué *[renvoi reconstruit]*.\n4. **Explicite ou reconstruit.** Le champ `lien_explicite` d'une thèse dit si Lordon fait lui-même les liens déclarés dans `depends_on` (`true`) ou si on les a reconstruits pour relier son argument (`false`). Dans le corps, un pas que Lordon ne fait pas est marqué *[reconstruit]*.\n5. **Démonstration ou argumentation.** Une thèse a une section `## Démonstration` quand Lordon déduit, et une `## Argumentation` quand il établit par exemples, analogies ou réfutation. On ne fabrique pas de déduction absente du livre.\n6. **Le vocabulaire de Lordon** est conservé (enrôlement, désir-maître, colinéarisation, épithumè…). On ne le traduit pas dans celui d'Homo Status.\n\n## 3. Types d'éléments\n\n| type | préfixe | dossier | rôle |\n|---|---|---|---|\n| `definition` | `D` | `definitions/` | un concept que Lordon définit ou forge (enrôlement, désir-maître, angle α…) |\n| `spinoza` | `S` | `premisses/` | une thèse de Spinoza que Lordon prend comme prémisse ; renvoie à l'*Éthique* (`ethique`) sans en recopier le texte, qui est dans SpinozaGraph, ou, pour une autre œuvre (*Traité politique*, lettres), la cite dans `ref` (ex. « Traité politique, III, 8 ») |\n| `marx` | `M` | `premisses/` | une thèse de Marx que Lordon prend comme prémisse (rapport salarial, double séparation, argent…) |\n| `these` | `T` | `theses/` | une thèse de Lordon, avec sa démonstration ou son argumentation |\n| `refutee` | `R` | `refutees/` | une position que Lordon réfute (servitude volontaire, consentement, intériorité…), énoncée telle qu'il la présente |\n\n- Concepts, prémisses et positions réfutées ne s'appuient que sur des concepts et des prémisses. Seules les thèses s'appuient sur des thèses.\n- Le champ `contre` d'une thèse liste les positions `R` qu'elle réfute. Ces arêtes « contre » sont distinctes des appuis : elles n'entrent ni dans le chemin ni dans les conséquences.\n- Un **corollaire** se rédige dans le fichier de sa thèse et porte l'identifiant `T012-C1`. Une **scolie** (exemples, digressions, résumés) est un commentaire et n'est pas porteuse logiquement.\n- Les identifiants sont globaux (`T012`, et non « chap. 1, thèse 12 »). Ils sont numérotés dans l'ordre d'apparition dans le livre et peuvent être renumérotés tant que le pilote n'est pas validé (§ 7) ; toute renumérotation est répercutée partout.\n\n## 4. Structure du dépôt\n\n```\nAGENT.md          ce fichier\nsections.yaml     titres des sections du livre, pour les repères (§ 6)\nREADME.md\nPARCOURS.md       parcours de lecture : un fil d'une quinzaine d'éléments, de la question du livre à sa conclusion\nPARCOURS.en.md    sa version anglaise ; de même NOTICE.en.md (§ 5 bis) ; PARCOURS.de.md, NOTICE.de.md en allemand (§ 5 ter)\nINDEX.md          table de tous les éléments, plan par chapitre, journal\nparties/          P (prémisses), 0 (avant-propos), 1, 2, 3 (chapitres) : titre de Lordon, sections, résumé\ndefinitions/      D01.md …\npremisses/        S01.md …, M01.md …\ntheses/           T001.md …\nrefutees/         R01.md …\noutils/           build_explorer.py, explorer_template.html, check.py, extract_epub.py\nsource/           NON VERSIONNÉ : le fichier du livre et le texte extrait (§ 6)\nexplorer.html     généré\n```\n\nChaque élément porte un champ `partie` : `P` pour les prémisses S et M, sinon le chapitre où il apparaît (`0` pour l'avant-propos). `INDEX.md` est mis à jour à chaque ajout, modification ou retrait.\n\n## 5. Format d'un fichier\n\n```markdown\n---\nid: T012\ntype: these                 # definition | spinoza | marx | these | refutee\npartie: \"1\"                 # P | 0 | 1 | 2 | 3\ntitre: Titre court\nenonce: >\n  Reformulation de la thèse, en une ou deux phrases.\nloc: [\"08.2\", \"08.4\"]        # repères section.paragraphe (§ 6)\ncitation: \"« … »\"           # facultative ; une ou deux phrases au plus (§ 6)\ndepends_on: [D03, S02, T009]\ncontre: [R02]               # thèses seulement\nethique: [3p6, 3p9sc]       # identifiants de SpinozaGraph (obligatoire pour S)\nlien_explicite: true        # thèses seulement (§ 2.4)\nstatut_revision: brouillon  # brouillon | verifie-texte\n---\n\n## Énoncé\n…\n\n## Démonstration            (ou ## Argumentation)\n1. Par S02, … (08.3).\n2. Par D03 et T009, … (08.4). ∎\n\n## Scolie\nExemples et digressions du livre, résumés.\n```\n\n**§ 5 bis. Version anglaise.** Chaque élément et chaque partie a sa version anglaise dans le même fichier : `titre_en`, `enonce_en` (ou `resume_en`) dans le front-matter, et, après une ligne `<!-- en -->`, le corps anglais, avec les sections `## Demonstration` (ou `## Argument`), `## Scholium`, `## In Lordon`, `## As Lordon presents it`. Le corps anglais garde les mêmes étapes, les mêmes identifiants et les mêmes repères que le français, ce que `check.py` vérifie. Il traduit la reconstruction, jamais la traduction anglaise publiée (Verso, 2014) ; les mots de Lordon y sont rendus brièvement entre guillemets anglais, et le champ `citation` reste en français. Un document `NOM.md` a sa version dans `NOM.en.md`. Toute correction du français se reporte dans l'anglais.\n\n**§ 5 ter. Version allemande.** Sur le même modèle, chaque élément et chaque partie a sa version allemande : `titre_de`, `enonce_de` (ou `resume_de`), et, après une ligne `<!-- de -->` placée après le corps anglais, le corps allemand, avec les sections `## Beweis` (ou `## Argumentation`), `## Anmerkung`, `## Bei Lordon`, `## Wie Lordon sie darstellt`. Il garde les mêmes étapes, les mêmes identifiants et les mêmes repères, ce que `check.py` vérifie. Il traduit la reconstruction, sans recourir à une traduction publiée du livre ; les mots de Lordon y sont rendus brièvement par nous entre guillemets allemands („…“). Un document `NOM.md` a sa version dans `NOM.de.md`. Toute correction du français se reporte dans l'anglais et dans l'allemand.\n\n`depends_on` correspond exactement aux identifiants invoqués dans la démonstration ou l'argumentation. Les identifiants de l'*Éthique* suivent SpinozaGraph : `1def3`, `1ax4`, `3p6`, `3p9sc`, `3p13csc`, `3ad1` (définitions des affects), `3agd` (définition générale des affects), `4pr` (préface), `4appc28` (appendice de la partie IV, chapitre 28). Une démonstration est citée par sa proposition (`3p37` pour « III, 37, démonstration »).\n\n## 6. Droits et texte source\n\nLe livre est sous droits.\n\n- Le fichier du livre et le texte extrait vivent dans `source/`, **exclu de Git** (`.gitignore`). On ne les publie jamais, ni en tout ni en partie. `outils/check.py` signale une erreur si un fichier de `source/` est suivi par Git ou si une citation du corps dépasse 300 caractères.\n- Les citations ne sont pas couvertes par les licences du dépôt (CC BY-SA 4.0 pour la reconstruction, GPL-3.0 pour le code) : voir `LICENSE` et `NOTICE.md`, à tenir à jour.\n- Les éléments **reformulent**. Une citation (champ `citation` ou dans le corps) tient en une ou deux phrases, au plus 300 caractères, entre guillemets, avec son repère, et seulement quand la formule compte (une formule célèbre, un concept). C'est l'usage du droit de citation : courte, justifiée par l'analyse, sourcée.\n- **Repères.** Le fichier de travail est un EPUB sans pagination. Un passage est donc repéré par **section et paragraphe** : `08.4` est le 4e paragraphe de la section 08, « La servitude volontaire n'existe pas ». Les sections sont celles de la table des matières de Lordon (`sections.yaml`, qui ne contient que les titres) ; les paragraphes sont numérotés par `outils/extract_epub.py`, qui produit `source/texte/` à partir de l'EPUB. Un lecteur de l'édition papier retrouve le passage par le titre de section. Si l'auteur fournit plus tard la pagination papier, on l'ajoutera à côté.\n\n## 7. Méthode de travail\n\n1. **Pilote** : l'avant-propos et le chapitre 1. L'auteur valide le découpage et le format avant qu'on poursuive.\n2. **Un chapitre à la fois** : lecture → éléments → `INDEX.md` → `python outils/check.py` → `python outils/build_explorer.py` → relecture par l'auteur → commit.\n3. **Audit de fidélité** : chaque élément est relu contre le passage cité (reformulation exacte, repère juste, liens explicites ou reconstruits bien marqués), puis passe à `verifie-texte`.\n\n   **Ce que `verifie-texte` garantit** : l'énoncé a été relu contre les passages cités et ne dit ni plus ni moins que Lordon (ou, pour une prémisse S, que Spinoza) ; tout passage entre guillemets est dans le livre mot pour mot ; repères et notes existent et sont à leur place (`audit_forme.py`) ; aucune étape ne renvoie à un passage manifestement moins pertinent qu'un autre (`audit_reperes.py`). Le corps des thèses, des concepts et des positions réfutées a en outre été relu phrase à phrase contre le texte par l'agent (13 novembre 2026) ; celui des prémisses S et M l'a été lors de leur rédaction et par les contrôles. **Ce qu'il ne garantit pas** : une relecture par l'auteur ; elle reste ouverte, et toute correction est consignée dans le journal d'`INDEX.md`.\n4. Les commits et les push se font seulement à la demande de l'auteur.\n\n## 8. Contrôles\n\n`python outils/check.py` vérifie : identifiants et types, repères présents et bien formés, longueur des citations, existence des dépendances, absence de cycle, concordance entre `depends_on` et la démonstration, arêtes `contre` vers des `R`, renvois à l'*Éthique* existants dans SpinozaGraph (si le dépôt est à côté), cohérence avec `INDEX.md`, exclusion de `source/`, complétude et concordance des versions anglaise et allemande (§ 5 bis et 5 ter). L'onglet « Audit » de l'explorateur affiche les mêmes contrôles.\n\n`python outils/audit_forme.py` fait l'audit de forme, sans juger l'argument : ponctuation et guillemets, structure des fichiers (sections attendues, étapes numérotées, chacune avec son repère, ∎ final), accord entre les repères du corps et le champ `loc`, existence des paragraphes cités, présence des notes citées dans les sections citées, et présence mot pour mot dans le livre de tout passage entre guillemets. Les contrôles qui lisent le livre demandent `source/texte/`.\n\nAucun de ces contrôles ne remplace l'audit de fidélité.\n\n## 9. Style\n\nLe style est celui des projets voisins : phrases courtes, vocabulaire précis, pas de jargon ajouté. Le texte est écrit en français, et un résumé en anglais n'est donné que dans le README.\n", "body_en": "", "body_de": ""}, {"name": "INDEX.md", "kind": "projet", "body": "# INDEX\n\nTable de tous les éléments, par partie. Chaque ligne : identifiant, titre, repères, statut. Mis à jour à chaque ajout, modification ou retrait (AGENT.md § 4).\n\n**Texte de travail** : EPUB sans pagination (calibre, 2012) ; repères par section et paragraphe, extraits par `outils/extract_epub.py` (AGENT.md § 6).\n\n## Plan\n\n| partie | titre | sections | éléments |\n|---|---|---|---|\n| P | Prémisses (Spinoza, Marx) | — | 46 |\n| 0 | Avant-propos | 01 | 2 |\n| 1 | Faire faire | 02–17 | 35 |\n| 2 | Joyeux automobiles | 18–31 | 26 |\n| 3 | Domination, émancipation | 32–43 | 28 |\n\n*Titres et sections d'après la table des matières de l'EPUB (`sections.yaml`). Repères : section.paragraphe (AGENT.md § 6).*\n\n## P. Prémisses\n\n| id | type | titre | repères | Éthique / réf. | statut |\n|---|---|---|---|---|---|\n| S01 | Spinoza | Le conatus | 03.1 | 3p6 | verifie-texte |\n| S02 | Spinoza | L'argent, condensé de tous les biens | 06.3, 12.2 | 4appc28 | verifie-texte |\n| S03 | Spinoza | Le désir, essence de l'homme | 08.3 | 3ad1 | verifie-texte |\n| S04 | Spinoza | On ne désire pas une chose parce qu'elle est bonne | 08.3, 22.2, 35.2 | 3p9sc | verifie-texte |\n| S05 | Spinoza | L'association des affects | 08.3, 24.1 | 3p15c | verifie-texte |\n| S06 | Spinoza | L'imitation des affects | 08.3, 12.4, 24.1, 29.2, 34.1 | 3p27 | verifie-texte |\n| S07 | Spinoza | La servitude | 08.4 | 4pr | verifie-texte |\n| S08 | Spinoza | La crainte | 11.1, 31.4 | 3ad13 | verifie-texte |\n| S09 | Spinoza | La force du désir suit celle de l'affect | 11.1, 22.8, 23.3, 38.4 | 3p37 | verifie-texte |\n| S10 | Spinoza | L'illusion du libre arbitre | 20.4, 24.3 | 2p35sc | verifie-texte |\n| S11 | Spinoza | Toute chose finie est déterminée par une autre | 20.4, 20.5 | 1p28 | verifie-texte |\n| S12 | Spinoza | Cause adéquate et cause inadéquate | 20.4 | 3def1 | verifie-texte |\n| S13 | Spinoza | L'ambition : vouloir que les autres vivent selon sa complexion | 20.6, 34.2 | 3p31csc | verifie-texte |\n| S14 | Spinoza | Le bien et le mal, joie et tristesse | 20.6 | 3p39sc | verifie-texte |\n| S15 | Spinoza | L'obsequium : crainte ou amour | 21.3 | Traité politique, III, 8 | verifie-texte |\n| S16 | Spinoza | Une vie humaine | 21.3, 43.2, 43.4 | Traité politique, V, 5 | verifie-texte |\n| S17 | Spinoza | Le conatus cherche la joie | 22.4, 22.8 | 3p12, 3p13c, 3p28 | verifie-texte |\n| S18 | Spinoza | L'amour | 23.1, 23.2 | 3p13csc, 3ad6 | verifie-texte |\n| S19 | Spinoza | Réjouir les autres pour s'en réjouir | 23.1, 23.2 | 3p29, 3p30 | verifie-texte |\n| S20 | Spinoza | L'affect, affection du corps et son idée | 23.2, 28.2 | 3def3 | verifie-texte |\n| S21 | Spinoza | L'âme et le corps, une seule chose | 28.2 | 3p2sc | verifie-texte |\n| S22 | Spinoza | Faire croire aux hommes qu'ils vivent selon leur libre décret | 29.3, 30.1 | Traité politique, X, 8 | verifie-texte |\n| S23 | Spinoza | On aime et hait davantage ce qu'on imagine libre | 29.4, 34.3 | 3p49 | verifie-texte |\n| S24 | Spinoza | Un affect ne cède qu'à un affect plus fort | 31.4 | 4p7 | verifie-texte |\n| S25 | Spinoza | Être affecté de nombreuses manières est utile | 33.3, 40.3 | 4p38, 4p45c2sc | verifie-texte |\n| S26 | Spinoza | On ne peut pas ce qu'on imagine ne pas pouvoir | 34.1, 37.5 | 3ad28 | verifie-texte |\n| S27 | Spinoza | Le désir cherche dans les autres sa confirmation | 34.2 | 3p31 | verifie-texte |\n| S28 | Spinoza | La nature est une et commune à tous | 34.2 | Traité politique, VII, 27 | verifie-texte |\n| S29 | Spinoza | La puissance est toujours en acte | 35.2, 40.1, 40.2 | 3p7, 2def6 | verifie-texte |\n| S30 | Spinoza | L'indignation | 38.4, 39.5 | 3ad20 | verifie-texte |\n| S31 | Spinoza | Les affects, propriétés naturelles de l'homme | 41.3 | Traité politique, I, 4 | verifie-texte
