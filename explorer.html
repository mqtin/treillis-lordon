ce désir comme le leur souverain (28.4).\n3. Nul ne peut faire la récollection des innombrables affections qui ont formé sa complexion désirante (29.1). Par S06, le désir imité d'un autre aimé peut être réfléchi, mais, environné d'affects amoureux, il est vécu comme absolument sien (29.2).\n4. Ce sont les commandements d'un autre haï qui font entrevoir l'exodétermination ; mais la rébellion qui s'ensuit n'est que la substitution d'une détermination à une autre, sous des affects joyeux (29.2). ∎\n\n## Scolie\n\nL'adolescent de Spinoza fuit l'autorité paternelle… en s'engageant dans l'armée, préférant « en toute liberté » « le despotisme d'un tyran plutôt que les sermons paternels » (*Éthique* IV, appendice, chap. 13, note 91 ; 29.2).", "body_en": "## Argument\n\n1. By T025, consenting is living one's determination joyfully. Now, as Deleuze says, it is \"the violence of a sign\" that forces one to seek: thought arises rather from a sad affect (28.4).\n2. By T008, desire is never *from* oneself while always being *one's own*; under joyful affects, the \"not from oneself\" is cast into oblivion and only the \"one's own\" remains. Executives do not go to work less alienated than their subordinates: they merely move under affects of hope powerful enough to live this desire as sovereignly theirs (28.4).\n3. No one can recollect the countless affections that formed his desiring complexion (29.1). By S06, the desire imitated from a loved other can be reflected on, but, surrounded by affects of love, it is lived as absolutely one's own (29.2).\n4. It is the commands of a hated other that give a glimpse of exodetermination; but the rebellion that follows is only the substitution of one determination for another, under joyful affects (29.2). ∎\n\n## Scholium\n\nSpinoza's adolescent flees paternal authority… by enlisting in the army, preferring \"in complete freedom\" \"the despotism of a tyrant to paternal lectures\" (*Ethics* IV, appendix, chap. 13, note 91; 29.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S06", "T008", "T025"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S06", "T008", "T025"], "mentions": ["S06", "T008", "T025"], "corollaires": [], "mtime": 1794571301.2965868}, {"id": "T032", "file": "theses/T032.md", "type": "these", "partie": "2", "titre": "Les risques du constructivisme du désir", "enonce": "Toute société façonne les désirs de ses membres, mais par un procès diffus, sans centre ni intention, qui apparaît comme une nécessité. Une instance de conditionnement visible, à laquelle on prête une intention, concentre au contraire des haines plus intenses. En prenant ouvertement en main la production des désirs, l'entreprise néolibérale prend le risque de l'intentionnalité assignable, que n'ont pas les forces du marché, « sans centre », et s'expose à la haine réservée aux causes libres.", "titre_en": "The risks of the constructivism of desire", "enonce_en": "Every society shapes the desires of its members, but through a diffuse process, without centre or intention, which appears as a necessity. A visible conditioning agency, to which an intention is attributed, by contrast concentrates more intense hatreds. By openly taking the production of desires in hand, the neoliberal firm takes the risk of assignable intentionality, which the \"centreless\" forces of the market do not run, and exposes itself to the hatred reserved for free causes.", "citation": "", "loc": ["29.3", "29.4", "29.5"], "depends_on": ["S22", "S23", "D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les constructivismes du désir, ou épithumogénies d'institution (D14), ne sont pas neufs : Spinoza conseillait à l'État de conduire les hommes de sorte qu'ils croient suivre leur libre décret (S22), et Platon en faisait le cœur de l'art politique (29.3).\n2. Le conditionnement n'est qu'un autre nom de la servitude passionnelle universelle ; mais la présence d'une instance et d'une intention identifiables fait une différence (29.3).\n3. L'auto-affection du corps social est inassignable et sans intention : elle apparaît comme une nécessité, et se rend inaperçue ou tolérable (29.4).\n4. Par S23, on hait davantage ce qu'on imagine libre : le parti, l'État, le Gosplan concentrent les haines, tandis que les forces du marché, qui ne broient pas moins, apparaissent comme un « effet de système » sans ingénieur, propice à la naturalisation ; c'est le fétichisme marchand de Marx (29.4).\n5. En se faisant ouvertement constructiviste, l'entreprise néolibérale prend le risque de la relocalisation et de l'intentionnalité assignable ; et ses sujets se croient, plus que les fidèles de l'Église d'autrefois, doués d'une autonomie de désir où toute intervention paraît une immixtion (29.5). ∎", "body_en": "## Argument\n\n1. Constructivisms of desire, or institutional epithumogenies (D14), are not new: Spinoza advised the State to lead men so that they believe they follow their own free decree (S22), and Plato made it the heart of the political art (29.3).\n2. Conditioning is only another name for universal passional servitude; but the presence of an identifiable agency and intention makes a difference (29.3).\n3. The self-affection of the social body cannot be assigned and has no intention: it appears as a necessity, and makes itself unnoticed or tolerable (29.4).\n4. By S23, we hate more what we imagine free: the party, the State, the Gosplan concentrate hatreds, while market forces, which grind no less, appear as a \"system effect\" with no engineer, conducive to naturalisation; this is Marx's commodity fetishism (29.4).\n5. By becoming openly constructivist, the neoliberal firm takes the risk of relocation and of assignable intentionality; and its subjects believe themselves, more than the faithful of the Church of old, endowed with an autonomy of desire in which any intervention looks like interference (29.5). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D14", "S22", "S23"], "sections": ["Argumentation"], "demo_refs": ["D14", "S22", "S23"], "mentions": ["D14", "S22", "S23"], "corollaires": [], "mtime": 1794571301.2965868}, {"id": "T033", "file": "theses/T033.md", "type": "these", "partie": "2", "titre": "L'amor fati capitalistis", "enonce": "Le coaching et les pratiques de « motivation » transforment des contraintes extérieures en « motivation endogène » : ils produisent l'amour par les salariés de la situation qui leur est faite. Leur finalité est adaptative : refouler toute extrospection et maintenir les individus dans l'introspection, comme si ce qui leur arrive dans l'entreprise n'était pas questionnable. Les conditionneurs sont eux-mêmes conditionnés.", "titre_en": "Amor fati capitalistis", "enonce_en": "Coaching and \"motivation\" practices transform external constraints into \"endogenous motivation\": they produce employees' love of the situation made for them. Their purpose is adaptive: to repress all extrospection and keep individuals in introspection, as if what happens to them in the firm were not open to question. The conditioners are themselves conditioned.", "citation": "« transformer une pression exogène en motivation endogène »", "loc": ["30.1", "30.2", "30.3"], "depends_on": ["D19", "S22", "T032"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T032, la manipulation visible des désirs engendre des tensions ; l'entreprise néolibérale a une tête, « qui sait ce qu'elle veut » (30.1).\n2. Le coaching va le plus loin : il veut, selon un coach, « transformer une pression exogène en motivation endogène » (note 97), ce qui est la maxime de S22 au parler managérial près. Produire le consentement, c'est produire l'*amor fati capitalistis* (D19) (30.1).\n3. Quelle que soit la rhétorique humaniste du travail sur soi, la finalité est adaptative : transfigurer la contrainte hors de tout questionnement de la contrainte. Même le coaching non directif des cadres supérieurs n'est ouvert que parce que le désir-maître est déjà rejeté dans l'impensé (30.2).\n4. L'épithumogénie capitaliste refoule l'extrospection, le regard vers les forces extérieures, au profit de l'introspection : ce qui arrive dans l'entreprise n'est pas questionnable, seule l'est la façon dont on fera avec (30.2). ∎\n\n## Scolie\n\nLes séminaires de « motivation » ne diffèrent parfois des pratiques sectaires que par l'objet. Que des entreprises ouvrent leurs portes aux caméras montre la bonne conscience des dirigeants : les conditionneurs sont conditionnés, et, comme le disait Bourdieu, les dominants sont dominés par leur propre domination (30.3).", "body_en": "## Argument\n\n1. By T032, visible manipulation of desires breeds tensions; the neoliberal firm has a head, \"which knows what it wants\" (30.1).\n2. Coaching goes furthest: it wants, according to one coach, \"to transform an exogenous pressure into endogenous motivation\" (note 97), which is the maxim of S22 bar the managerial idiom. Producing consent is producing *amor fati capitalistis* (D19) (30.1).\n3. Whatever the humanist rhetoric of working on oneself, the purpose is adaptive: to transfigure constraint without any questioning of constraint. Even non-directive coaching of senior executives is open only because the master-desire has already been cast into the unthought (30.2).\n4. Capitalist epithumogeny represses extrospection, the gaze towards external forces, in favour of introspection: what happens in the firm is not open to question, only how one will cope with it (30.2). ∎\n\n## Scholium\n\n\"Motivation\" seminars sometimes differ from sectarian practices only in their object. That firms open their doors to cameras shows the good conscience of executives: the conditioners are conditioned, and, as Bourdieu said, the dominant are dominated by their own domination (30.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D19", "S22", "T032"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D19", "S22", "T032"], "mentions": ["D19", "S22", "T032"], "corollaires": [], "mtime": 1794571301.2977622}, {"id": "T034", "file": "theses/T034.md", "type": "these", "partie": "2", "titre": "Le voile des affects joyeux, le fond des affects tristes", "enonce": "La promesse d'affects joyeux reste brouillée par un fond d'affects tristes : derrière la colinéarisation heureuse se tient toujours la menace (déclassement, rétrogradation, renvoi). D'où le double bind du « sois spontané ». L'efficacité de la colinéarisation varie avec la proximité au désir-maître ; pour la plupart, les « consentements » restent mitigés, simples résultantes du conflit des affects joyeux et tristes.", "titre_en": "The veil of joyful affects, the background of sad affects", "enonce_en": "The promise of joyful affects remains blurred by a background of sad affects: behind happy collinearisation there always stands the threat (downgrading, demotion, dismissal). Hence the double bind of \"be spontaneous\". The effectiveness of collinearisation varies with proximity to the master-desire; for most, \"consents\" remain mixed, mere resultants of the conflict between joyful and sad affects.", "citation": "« désire toi-même mais d’après moi seulement »", "loc": ["31.1", "31.2", "31.3", "31.4"], "depends_on": ["T033", "T006", "T011", "S08", "S24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T033, le travail de colinéarisation tient à l'enrôlé le discours de *son* désir ; il doit faire oublier qu'il sert le désir-maître, et que sa promesse de joie a pour arrière-plan les sanctions et les menaces du rapport salarial (T006) (31.1).\n2. L'échec de la normalisation n'étant pas une option, les « déviants persistants » retrouvent le dur du rapport salarial ; le colinéarisé est sommé de se convertir aux affects joyeux sous peine d'être submergé par la crainte. D'où le *double bind* (« sois autonome mais selon ma direction »), contre lequel il n'a que l'autosuggestion, quand ce n'est pas la pathologie (31.1).\n3. L'efficacité de la colinéarisation suit à peu près le niveau hiérarchique (T011) : tout en haut, les individus sont si préalignés que le rapport peut s'inverser, et que ce sont eux qui utilisent l'organisation pour leurs passions, comme les « âmes ardentes » dont l'Église se méfie (31.2-31.3).\n4. Pour les autres, les sentiments sont mêlés, l'âme flotte (S08), et par S24 il n'y a en fait de « consentement » que l'affrontement des affects joyeux et tristes. La colinéarisation, surplombée de menace, ne peut escamoter sa part attristante : les salariés peuvent se passionner pour le contrôle de gestion, et « par moments n'en penser pas moins » (31.4). ∎\n\n## Scolie\n\nBourdieu évoque les agents qui « exploitent les institutions pour assouvir leurs pulsions » (note 100) : l'Église redoute le « subjectivisme fatal » des âmes trop ardentes, à front renversé de l'entreprise, qui se méfie du défaut de « motivation » (31.2).", "body_en": "## Argument\n\n1. By T033, the work of collinearisation tells the enlisted the story of *his* desire; it must make him forget that he serves the master-desire, and that its promise of joy has as background the sanctions and threats of the wage relation (T006) (31.1).\n2. Failure of normalisation not being an option, \"persistent deviants\" meet again the hard core of the wage relation; the collinearised is summoned to convert to joyful affects on pain of being overwhelmed by fear. Hence the *double bind* (\"be autonomous but in my direction\"), against which he has only autosuggestion, when not pathology (31.1).\n3. The effectiveness of collinearisation roughly follows hierarchical level (T011): at the very top, individuals are so prealigned that the relation can be reversed, and it is they who use the organisation for their passions, like the \"ardent souls\" the Church distrusts (31.2-31.3).\n4. For the others, feelings are mixed, the mind vacillates (S08), and by S24 there is by way of \"consent\" only the clash of joyful and sad affects. Collinearisation, overhung by threat, cannot conjure away its saddening part: employees can become passionate about management control, and \"at times think no less\" (31.4). ∎\n\n## Scholium\n\nBourdieu evokes the agents who \"exploit institutions to satisfy their drives\" (note 100): the Church fears the \"fatal subjectivism\" of overly ardent souls, the reverse of the firm, which distrusts a lack of \"motivation\" (31.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S08", "S24", "T006", "T011", "T033"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S08", "S24", "T006", "T011", "T033"], "mentions": ["S08", "S24", "T006", "T011", "T033"], "corollaires": [], "mtime": 1794571301.2977622}, {"id": "T035", "file": "theses/T035.md", "type": "these", "partie": "3", "titre": "La domination par les affects joyeux", "enonce": "Même joyeusement consenti, l'enrôlement reste domination : l'épithumogénie fixe le désir des enrôlés à des objets étroits, à l'exclusion de tous ceux qu'ils pourraient désirer comme associés. La domination est l'effet qui permet à certains de se réserver des possibilités de jouissance ; la violence symbolique de Bourdieu est une domination par les affects joyeux.", "titre_en": "Domination through joyful affects", "enonce_en": "Even joyfully consented to, enlistment remains domination: epithumogeny fixes the desire of the enlisted on narrow objects, to the exclusion of all those they could desire as associates. Domination is the effect that allows some to reserve possibilities of enjoyment for themselves; Bourdieu's symbolic violence is a domination through joyful affects.", "citation": "", "loc": ["33.1", "33.2", "33.3"], "depends_on": ["T022", "D20", "S25"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Il est des « consentements » presque purement joyeux ; comment parler encore de domination ? Par T022, l'aliénation ne peut être imputée à certains seulement, et l'intéressé pourrait retourner le diagnostic à son questionneur (33.1).\n2. La domination au premier sens demeure, mais l'intérêt basal peut être surmonté de désirs plus élevés, au point que la dépendance ne laisse plus de trace affective (33.2).\n3. Or l'épithumogénie a pour effet, et pour intention, de *fixer* le désir des enrôlés : division du travail, subordination et conditionnement les rivent à un objet exclusif. Il est plein d'autres choses auxquelles ils pourraient s'intéresser comme associés : la division du travail elle-même, les rémunérations, la stratégie, le destin de la communauté productive (33.2).\n4. L'assujettissement heureux est donc « enfermement dans un domaine restreint de jouissance » ; c'est encore une domination, au sens de D20 (33.2).\n5. Par S25, l'utile propre de chacun est la variété des effectuations de sa puissance ; la domination rive les dominés à des objets de désir mineurs et se réserve les autres. Domination « dure » et « douce » ne se distinguent que par leurs affects (33.3). ∎", "body_en": "## Argument\n\n1. There are almost purely joyful \"consents\"; how can one still speak of domination? By T022, alienation cannot be imputed to some only, and the person concerned could turn the diagnosis back on the questioner (33.1).\n2. Domination in the first sense remains, but basic interest can be topped by higher desires, to the point that dependence no longer leaves any affective trace (33.2).\n3. Now epithumogeny has the effect, and the intention, of *fixing* the desire of the enlisted: division of labour, subordination and conditioning rivet them to an exclusive object. There are plenty of other things they could take an interest in as associates: the division of labour itself, pay, strategy, the destiny of the productive community (33.2).\n4. Happy subjection is therefore \"confinement in a restricted domain of enjoyment\"; it is still a domination, in the sense of D20 (33.2).\n5. By S25, each one's own advantage is the variety of the enactments of his power; domination rivets the dominated to minor objects of desire and reserves the others for itself. \"Hard\" and \"soft\" domination differ only in their affects (33.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D20", "S25", "T022"], "sections": ["Argumentation"], "demo_refs": ["D20", "S25", "T022"], "mentions": ["D20", "S25", "T022"], "corollaires": [], "mtime": 1794571301.2977622}, {"id": "T036", "file": "theses/T036.md", "type": "these", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La domination règle la distribution du désirable. La division du travail se convertit en division du désir par un double imaginaire : du comblement et de l'impuissance, qui transforme l'assignation en auto-assignation. Les objets réservés aux dominants doivent être reconnus désirables par les dominés, mais pas pour eux. Cette division arbitraire, diffuse et impersonnelle, est vécue comme une nécessité.", "titre_en": "The division of desire and the imaginary of powerlessness", "enonce_en": "Domination governs the distribution of the desirable. The division of labour converts into a division of desire through a double imaginary: of fulfilment and of powerlessness, which turns assignment into self-assignment. The objects reserved for the dominant must be recognised as desirable by the dominated, but not for them. This arbitrary division, diffuse and impersonal, is experienced as a necessity.", "citation": "« Le salarié ordinaire sait reconnaître comme désirable le pouvoir de direction mais sans en faire un objet de son désir. »", "loc": ["34.1", "34.2", "34.3"], "depends_on": ["T035", "D21", "S26", "S06", "S27", "S13", "S28", "S23"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T035, l'enjeu de la domination est distributif ; la régulation qui ajuste les désirs des dominés exige un enchantement constant, d'autant que l'imitation (S06) attise l'envie des joies visibles des grands (34.1).\n2. D'où le double imaginaire de D21 ; par S26, ce qu'on imagine ne pas pouvoir, on ne le peut effectivement pas : l'assignation devient auto-assignation (34.1).\n3. Par S27, le désir cherche sa confirmation dans le désir des autres ; par S13, chacun veut que les autres vivent selon sa complexion, et tous se font obstacle. La plupart des joies sociales sont donc différentielles : *réserver* et *écarter* sont les gestes propres de la domination (34.2).\n4. Ces assignations sont arbitraires sur un fond d'égalité anthropologique (S28) ; mais, diffuses et impersonnelles, elles sont vécues, par S23, comme une nécessité, un *fatum* sans dieu, qui attire moins de haine qu'une cause imaginée libre (34.3). ∎\n\n## Scolie\n\nLes justifications de l'arbitraire ne sortent pas, depuis les Grecs, du triangle de la naissance, de la richesse et de la compétence ; la « mythogénie contemporaine du diplôme » fournit des alibis à la répartition des individus dans la division du désir (34.3).", "body_en": "## Demonstration\n\n1. By T035, what is at stake in domination is distributive; the regulation that adjusts the desires of the dominated requires constant enchantment, all the more since imitation (S06) stirs envy of the visible joys of the great (34.1).\n2. Hence the double imaginary of D21; by S26, what one imagines one cannot do, one really cannot do: assignment becomes self-assignment (34.1).\n3. By S27, desire seeks its confirmation in the desire of others; by S13, each wants others to live according to his complexion, and all stand in one another's way. Most social joys are therefore differential: *reserving* and *keeping away* are the gestures proper to domination (34.2).\n4. These assignments are arbitrary against a background of anthropological equality (S28); but, diffuse and impersonal, they are experienced, by S23, as a necessity, a *fatum* without a god, which attracts less hatred than a cause imagined free (34.3). ∎\n\n## Scholium\n\nSince the Greeks, the justifications of the arbitrary have not left the triangle of birth, wealth and competence; the \"contemporary mythogeny of the diploma\" provides alibis for the distribution of individuals in the division of desire (34.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "mentions": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "corollaires": [], "mtime": 1794571301.2977622}, {"id": "T037", "file": "theses/T037.md", "type": "these", "partie": "3", "titre": "Il n'y a pas de valeur objective, seulement des affirmations de puissance", "enonce": "Le désir étant axiogène et la réalité pleine, il n'y a pas de valeur substantielle qui puisse faire norme : vaut ce que le plus puissant a déclaré valoir. Toute demande est en dernière analyse un « parce que » du conatus ; la justification n'a qu'une valeur extrinsèque, mais vitale : contenir la violence. Renoncer à la valeur-travail n'oblige donc pas à déserter la lutte pour le partage.", "titre_en": "There is no objective value, only affirmations of power", "enonce_en": "Since desire is axiogenic and reality is full, there is no substantial value that could set a norm: what is worth something is what the most powerful has declared to be worth something. Every demand is in the last analysis a \"because\" of the conatus; justification has only an extrinsic value, but a vital one: containing violence. Giving up labour value therefore does not oblige one to desert the struggle over distribution.", "citation": "« Vaut ce que le plus puissant a déclaré valoir »", "loc": ["35.2", "35.3"], "depends_on": ["D17", "S29"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La valeur substantielle (R11) réintroduit une norme transcendante ; Spinoza la récuse au nom de l'immanence, où réalité et perfection sont une même chose (S29) (35.2).\n2. Par D17, ce n'est pas la valeur qui attire le désir, c'est le désir qui constitue les valeurs ; cela vaut pour les valeurs esthétiques, morales et économiques, comme Durkheim le voulait pour sa théorie transversale de la valeur (35.2).\n3. Les valeurs sont donc des positions et des affirmations, victoires temporaires de puissances ; les luttes de valorisation sont l'ordinaire de la vie sociale de la valeur (35.2).\n4. À la question « au nom de quoi demandez-vous ? », la réponse est toujours en dernière analyse « parce que c'est moi », par le droit naturel du conatus ; la « généralité » et la justification suivent, et leur seule valeur est de faire rempart contre le « chaos pronateur » (35.3).\n5. On peut donc contester le partage de la valeur sans théorie objective de la plus-value, en assumant la partialité de son point de vue : « voilà notre norme à nous » (35.3). ∎", "body_en": "## Argument\n\n1. Substantial value (R11) reintroduces a transcendent norm; Spinoza rejects it in the name of immanence, where reality and perfection are one and the same (S29) (35.2).\n2. By D17, it is not value that attracts desire, it is desire that constitutes values; this holds for aesthetic, moral and economic values, as Durkheim wanted for his transversal theory of value (35.2).\n3. Values are therefore positions and affirmations, temporary victories of powers; struggles over valuation are the ordinary stuff of the social life of value (35.2).\n4. To the question \"in the name of what do you ask?\", the answer is always in the last analysis \"because it is me\", by the natural right of the conatus; \"generality\" and justification follow, and their only value is to form a bulwark against the \"grabbing chaos\" (35.3).\n5. One can therefore contest the distribution of value without an objective theory of surplus value, by owning the partiality of one's point of view: \"this is our norm\" (35.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D17", "R11", "S29"], "sections": ["Argumentation"], "demo_refs": ["D17", "R11", "S29"], "mentions": ["D17", "R11", "S29"], "corollaires": [], "mtime": 1794571357.2476025}, {"id": "T038", "file": "theses/T038.md", "type": "these", "partie": "3", "titre": "L'exploitation est passionnelle", "enonce": "L'exploitation ne tient pas à la privation d'une plus-value (rendue au corps salarial, elle ne serait plus exploitation), mais à son appropriation privative : elle relève d'une politique de la capture, non d'une économie de la valeur. Ce qui est capté est de la puissance d'agir, dirigée par des passions ; le patronat dépossède d'œuvre, d'argent et de reconnaissance. Faire marcher les salariés, c'est aussi leur faire prendre le désir-maître pour le leur.", "titre_en": "Exploitation is passional", "enonce_en": "Exploitation does not consist in the deprivation of a surplus value (returned to the body of employees, it would no longer be exploitation), but in its private appropriation: it belongs to a politics of capture, not to an economics of value. What is captured is power of acting, directed by passions; bosshood dispossesses of the work done, of money and of recognition. Making employees run is also making them take the master-desire for their own.", "citation": "« Si exploitation il y a, elle est donc davantage du ressort d’une théorie politique de la capture que d’une théorie économique de la valeur »", "loc": ["35.4", "35.5", "35.6", "35.7"], "depends_on": ["T037", "D22", "M06", "T036", "T004"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Les salariés n'ont pas besoin de la théorie de la plus-value pour se sentir exploités ; c'est l'idée de capture qui saisit leurs protestations (35.4).\n2. Si la plus-value revenait au corps salarial lui-même, l'algèbre de la valeur-travail resterait la même, et personne ne parlerait d'exploitation : ce qui la fait est l'appropriation privative. L'exploitation relève donc d'une politique de la capture (35.4), et par T037 on peut la penser sans valeur objective.\n3. Ce qui est capté est la puissance d'agir des enrôlés, dans la tristesse ou, quand l'épithumogénie réussit, dans la joie, mais rivée à la division du désir (T036). Par M06, les contributions sont parcellaires et seule les totalise le désir-maître : la capture est dépossession d'œuvre, et d'abord d'*autorat*, la reconnaissance de l'œuvre collective allant au sommet (D22) (35.5).\n4. Comme tout patronat (T004), le patronat capitaliste capte de l'effort ; il le convertit en argent, les autres en reconnaissance ; tous ne parviennent à leurs fins que par des énergies conatives dirigées par des affects : l'exploitation est passionnelle (35.6).\n5. Faire marcher les salariés, c'est les faire se mouvoir, les faire fonctionner, et les « faire marcher » : leur faire croire que s'activer pour la capture est se « réaliser » (35.7). ∎\n\n## Scolie\n\nLe patron scientifique passe pour « découvreur », le mandarin signe l'ouvrage de ses assistants, le réalisateur se fait reconnaître seul auteur d'images que son chef-opérateur était seul capable de produire ; ce n'est pas nier l'inégalité des contributions, mais l'effacement de presque toutes derrière une seule (35.5). Quand l'exploitation passionnelle réussit très bien, « les enrôlés ne marchent plus, ils courent » (35.7).", "body_en": "## Demonstration\n\n1. Employees do not need the theory of surplus value to feel exploited; it is the idea of capture that grasps their protests (35.4).\n2. If surplus value went back to the body of employees itself, the algebra of labour value would stay the same, and nobody would speak of exploitation: what makes it is private appropriation. Exploitation therefore belongs to a politics of capture (35.4), and by T037 it can be thought without objective value.\n3. What is captured is the power of acting of the enlisted, in sadness or, when epithumogeny succeeds, in joy, but riveted to the division of desire (T036). By M06, contributions are partial and only the master-desire totalises them: capture is dispossession of the work done, and first of *authorship*, recognition for the collective work going to the top (D22) (35.5).\n4. Like all bosshood (T004), capitalist bosshood captures effort; it converts it into money, the others into recognition; all reach their ends only through conative energies directed by affects: exploitation is passional (35.6).\n5. Making employees run (*faire marcher*) is making them move, making them function, and \"taking them for a ride\": making them believe that busying themselves for capture is \"fulfilling\" themselves (35.7). ∎\n\n## Scholium\n\nThe head of a science lab passes for the \"discoverer\", the mandarin signs his assistants' book, the director gets recognised as the sole author of images that only his cinematographer could produce; this is not to deny the inequality of contributions, but the effacement of almost all of them behind a single one (35.5). When passional exploitation succeeds very well, \"the enlisted no longer walk, they run\" (35.7).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D22", "M06", "T004", "T036", "T037"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D22", "M06", "T004", "T036", "T037"], "mentions": ["D22", "M06", "T004", "T036", "T037"], "corollaires": [], "mtime": 1794571357.2496195}, {"id": "T039", "file": "theses/T039.md", "type": "these", "partie": "3", "titre": "Communisme ou totalitarisme", "enonce": "Le projet néolibéral reste contradictoire : les salariés « courent de travers », et la « libre volonté obéissante » peut toujours se reprendre. Son modèle, le salarié-artiste dont la créativité exige l'autonomie, mène vers la libre association des travailleurs ; pour le gros des salariés, l'« autonomie » masque au contraire une servitude inédite. L'alternative est formellement celle-ci : communisme ou totalitarisme.", "titre_en": "Communism or totalitarianism", "enonce_en": "The neoliberal project remains contradictory: employees \"run crooked\", and the \"obedient free will\" can always take itself back. Its model, the employee-artist whose creativity requires autonomy, leads towards the free association of workers; for most employees, by contrast, \"autonomy\" masks an unprecedented servitude. The alternative is formally this: communism or totalitarianism.", "citation": "", "loc": ["36.1", "36.2", "36.3", "36.4"], "depends_on": ["T029", "T034"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T034, l'arrière-plan de menace persiste ; peu de salariés peuvent se couler sans réserve dans le projet de colonisation intégrale de leur être (T029). L'entreprise est doublement contradictoire : rétivité des salariés, et aléa irréductible du « libre arbitre », qui « ne hait rien tant que la subordination hiérarchique » (36.1).\n2. La sociologie du travail a vu dans l'artiste un modèle pour les salariés « créatifs » : sa productivité tient à la coïncidence avec son propre désir. Mais à pousser l'allègement hiérarchique, on rend les créatifs à eux-mêmes, et ils peuvent s'échapper : en reconnaissant la supériorité productive du travail non contraint, le capitalisme, demande Lordon, ne chemine-t-il pas « vers la libre association des travailleurs » ? (36.2).\n3. Le capitalisme pourrait se mettre en danger en poursuivant ce rêve, porteur de son principe antagoniste : liberté créative et collaborative, organisation délibérative-démocratique, « soit le communisme réalisé » (36.3).\n4. Il n'ira pas jusque-là : pour la plupart, l'extension de la latitude passe par le maintien de la colinéarisation ; d'où l'alternative « communisme ou totalitarisme », sur le modèle de « socialisme ou barbarie » (36.4). ∎\n\n## Scolie\n\nLordon reproche à certaines analyses, notamment *Le nouvel esprit du capitalisme* de Boltanski et Chiapello (note 118), d'avoir oublié et ce qu'ajoutaient les discours managériaux eux-mêmes, et l'étroitesse de la frange salariale réellement concernée (36.3).", "body_en": "## Argument\n\n1. By T034, the background of threat persists; few employees can slip without reserve into the project of complete colonisation of their being (T029). The firm is doubly contradictory: the recalcitrance of employees, and the irreducible hazard of \"free will\", which \"hates nothing so much as hierarchical subordination\" (36.1).\n2. The sociology of work saw the artist as a model for \"creative\" employees: his productivity comes from coinciding with his own desire. But pushing the lightening of hierarchy returns the creatives to themselves, and they can escape: by recognising the productive superiority of unconstrained work, is capitalism not, Lordon asks, moving \"towards the free association of workers\"? (36.2).\n3. Capitalism could endanger itself by pursuing this dream, which carries its antagonistic principle: creative and collaborative freedom, deliberative-democratic organisation, \"that is, communism realised\" (36.3).\n4. It will not go that far: for most, extending latitude goes with maintaining collinearisation; hence the alternative \"communism or totalitarianism\", on the model of \"socialism or barbarism\" (36.4). ∎\n\n## Scholium\n\nLordon criticises some analyses, notably Boltanski and Chiapello's *The New Spirit of Capitalism* (note 118), for having forgotten both what the managerial discourses themselves added and the narrowness of the fringe of employees really concerned (36.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T029", "T034"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T029", "T034"], "mentions": ["T029", "T034"], "corollaires": [], "mtime": 1794571357.2496195}, {"id": "T040", "file": "theses/T040.md", "type": "these", "partie": "3", "titre": "La récommune", "enonce": "Toute entreprise qui exige plusieurs personnes est une communauté politique. Retirées les structures du rapport salarial, elle devient association, et la réponse communiste est qu'elle doit être égalitaire. L'inégalité des contributions et la division de la conception et de l'exécution ne s'effaceront que lentement ; mais l'égalité peut être réalisée très vite dans la délibération : c'est la récommune, qui abolit le rapport salarial.", "titre_en": "The récommune", "enonce_en": "Every enterprise that requires several people is a political community. Once the structures of the wage relation are removed, it becomes an association, and the communist answer is that it must be egalitarian. The inequality of contributions and the division between conception and execution will fade only slowly; but equality can be achieved very quickly in deliberation: this is the récommune, which abolishes the wage relation.", "citation": "« Être le plus nombreux possible à penser le plus possible »", "loc": ["37.1", "37.2", "37.3", "37.4", "37.5", "37.6", "37.7"], "depends_on": ["T039", "T003", "D23", "M06", "S26"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T039, l'alternative est « communisme ou totalitarisme ». « Épurer les alternatives facilite les choix », et revenir au problème aussi, celui de T003 : quelqu'un veut faire quelque chose qui exige d'être plusieurs. Toute composition de puissances d'agir est politique ; la question est la constitution de cette communauté (37.1).\n2. Sous le capitalisme, on y entre par nécessité matérielle, sous une constitution monarchique, celle du désir-maître. Suspendue la nécessité, l'entreprise prend la forme de l'association : ses membres s'y rassemblent autour d'une proposition dans laquelle ils reconnaissent leur désir, formé ailleurs, et non sous menace ni induction délibérée (37.2).\n3. La position communiste est que l'égalité doit prévaloir en toute situation politique. Les contributions ne sont pourtant pas égales : le texte de *Richard III* n'est pas sur le même plan que ses costumes, et il faut pourtant des costumiers. D'où « l'équation communiste » : quelle égalité sous le legs de la division du travail, et de la séparation de la conception et de l'exécution (M06) ? (37.3-37.4)\n4. Cette division produit « empuissantisation » pour les uns et, par S26, « impuissantisation » pour les autres ; la dé-hiérarchisation contributive restera lointaine (37.5).\n5. Mais l'égalité peut être rapide dans l'ordre délibératif : être pleins associés d'un destin commun. C'est la récommune (D23), qui réalise l'abolition du rapport salarial (37.5-37.7). ∎\n\n## Scolie\n\nL'horizon est donné par Étienne Balibar (note 120) : « Être le plus nombreux possible à penser le plus possible » (37.5). Le capitalisme ayant « imbibé » le mot d'entreprise, Lordon propose de le lui rendre, « mais pour en faire aussitôt le nom de ce avec quoi il faut en finir » (37.7).", "body_en": "## Argument\n\n1. By T039, the alternative is \"communism or totalitarianism\". \"Purifying the alternatives makes choices easier\", and so does returning to the problem, that of T003: someone wants to do something that requires several people. Every composition of powers of acting is political; the question is the constitution of this community (37.1).\n2. Under capitalism, one enters it out of material necessity, under a monarchical constitution, that of the master-desire. With necessity suspended, the enterprise takes the form of association: its members gather around a proposal in which they recognise their desire, formed elsewhere, and not under threat or deliberate induction (37.2).\n3. The communist position is that equality must prevail in every political situation. Yet contributions are not equal: the text of *Richard III* is not on the same plane as its costumes, and yet costume makers are needed. Hence \"the communist equation\": what equality under the legacy of the division of labour, and of the separation of conception and execution (M06)? (37.3-37.4)\n4. This division produces \"empowerment\" for some and, by S26, \"impotentisation\" for the others; contributive de-hierarchisation will remain distant (37.5).\n5. But equality can be swift in the deliberative order: being full associates in a common destiny. This is the récommune (D23), which achieves the abolition of the wage relation (37.5-37.7). ∎\n\n## Scholium\n\nThe horizon is given by Étienne Balibar (note 120): \"As many as possible thinking as much as possible\" (37.5). Capitalism having \"soaked\" the word enterprise, Lordon proposes to give it back to it, \"but only to make it at once the name of what must be done away with\" (37.7).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D23", "M06", "S26", "T003", "T039"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D23", "M06", "S26", "T003", "T039"], "mentions": ["D23", "M06", "S26", "T003", "T039"], "corollaires": [], "mtime": 1794571357.251202}, {"id": "T041", "file": "theses/T041.md", "type": "these", "partie": "3", "titre": "La récommune n'épuise pas le communisme", "enonce": "La récommune reste locale : au-delà se posent la question du marché et de la planification, et surtout celle du travail. Le communisme vise aussi l'émancipation d'avec le travail, la reséparation du travail et de l'activité, et n'est pas un programme mais un mouvement réel.", "titre_en": "The récommune does not exhaust communism", "enonce_en": "The récommune remains local: beyond it arise the question of market and planning, and above all that of work. Communism also aims at emancipation from work, the re-separation of work and activity, and is not a programme but a real movement.", "citation": "", "loc": ["37.8"], "depends_on": ["T040", "M05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T040, la récommune affranchit ses membres de la monarchie du désir-maître ; mais elle est locale, et laisse entières la coordination à l'échelle de la société (marché ou planification) et la question du travail (37.8).\n2. Antoine Artous et Moshe Postone ont retrouvé chez Marx la visée de l'émancipation *d'avec* le travail : le travail, catégorie historique propre au capitalisme, ne doit pas absorber toutes les activités possibles (37.8).\n3. Par M05, le communisme n'est pas un programme mais « le mouvement réel qui abolit l'état actuel des choses » (37.8). ∎", "body_en": "## Argument\n\n1. By T040, the récommune frees its members from the monarchy of the master-desire; but it is local, and leaves untouched coordination at the scale of society (market or planning) and the question of work (37.8).\n2. Antoine Artous and Moishe Postone have rediscovered in Marx the aim of emancipation *from* work: work, a historical category proper to capitalism, must not absorb all possible activities (37.8).\n3. By M05, communism is not a programme but \"the real movement that abolishes the present state of things\" (37.8). ∎", "sections_en": ["Argument"], "demo_refs_en": ["M05", "T040"], "sections": ["Argumentation"], "demo_refs": ["M05", "T040"], "mentions": ["M05", "T040"], "corollaires": [], "mtime": 1794571357.251202}, {"id": "T042", "file": "theses/T042.md", "type": "these", "partie": "3", "titre": "Les passions séditieuses : le changement sans libre arbitre", "enonce": "Le déterminisme n'exclut pas le changement : le « nouveau » n'est que ce qui surprend notre entendement fini. Dans l'histoire comme ailleurs, les changements sont produits, par les passions et les institutions. Les passions qui maintiennent les hommes sous des rapports peuvent se reconfigurer pour les détruire, sous l'effet d'une affection, souvent le geste de trop du pouvoir : c'est l'indignation.", "titre_en": "Seditious passions: change without free will", "enonce_en": "Determinism does not exclude change: the \"new\" is only what surprises our finite understanding. In history as elsewhere, changes are produced, by passions and institutions. The passions that keep men under relations can reconfigure themselves to destroy them, under the effect of an affection, often power's gesture too many: this is indignation.", "citation": "", "loc": ["38.1", "38.2", "38.3", "38.4"], "depends_on": ["T041", "M05", "S11", "S30", "S09"], "contre": ["R12"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T041 et M05, le communisme est le mouvement réel qui abolit l'état actuel des choses ; d'où peut-il naître, si le libre arbitre est une fiction ? Le contresens qui refuse au déterminisme de penser le changement (R12) est partagé par les apologies du soulèvement et de l'entrepreneur, également libérales en philosophie (38.1-38.2).\n2. Le « nouveau » absolu serait un événement sans cause, un miracle ; par S11, il n'en est pas. Le nouveau n'est que ce qui surprend notre entendement fini (38.3).\n3. Le changement, lui, ne déroge à aucune loi : des étoiles meurent, des collines glissent. Les faits sociaux de transformation sont tout autant produits, par les énergies conatives et leurs passions, à travers les institutions, qu'on peut voir comme des dispositifs affectifs collectifs, capables d'affecter des multitudes (38.4).\n4. Ces passions se reconfigurent sous l'effet d'une affection antécédente, souvent le geste de trop du pouvoir. L'indignation (S30) coalise les sujets après une offense vécue comme les concernant tous ; par S09, plus grande la tristesse commune, plus grande la puissance d'agir qui lutte contre elle (38.4). ∎\n\n## Scolie\n\nLes matelots du *Potemkine* indignés par la condamnation de ceux qui protestaient contre la viande avariée ; une mise à pied abusive qui soulève une usine ; le plan social de trop qui met des cadres dans la rue (38.4).", "body_en": "## Demonstration\n\n1. By T041 and M05, communism is the real movement that abolishes the present state of things; where can it arise from, if free will is a fiction? The misreading that denies determinism the ability to think change (R12) is shared by the apologies for uprising and for the entrepreneur, equally liberal in philosophy (38.1-38.2).\n2. The absolutely \"new\" would be an event without a cause, a miracle; by S11, there is no such thing. The new is only what surprises our finite understanding (38.3).\n3. Change, for its part, breaks no law: stars die, hills slide. Social facts of transformation are just as much produced, by conative energies and their passions, through institutions, which can be seen as collective affective devices, able to affect multitudes (38.4).\n4. These passions reconfigure themselves under the effect of a prior affection, often power's gesture too many. Indignation (S30) brings subjects together after an offence felt as concerning them all; by S09, the greater the common sadness, the greater the power of acting that fights against it (38.4). ∎\n\n## Scholium\n\nThe sailors of the *Potemkin* indignant at the sentencing of those who protested against rotten meat; an abusive suspension that sets a whole factory in revolt; the redundancy plan too many that puts managers out on the street (38.4).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["M05", "R12", "S09", "S11", "S30", "T041"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["M05", "R12", "S09", "S11", "S30", "T041"], "mentions": ["M05", "R12", "S09", "S11", "S30", "T041"], "corollaires": [], "mtime": 1794571357.251202}, {"id": "T043", "file": "theses/T043.md", "type": "these", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "La sédition n'est pas un sursaut du libre arbitre : les individus sont toujours déterminés, mais désormais à autre chose, quand l'indignation l'emporte sur l'obsequium. Elle rouvre l'angle α : désalignés, les conatus n'offrent plus rien à la capture et s'efforcent vers de nouveaux objets de désir ; ils peuvent même s'opposer au désir-maître.", "titre_en": "Becoming perpendicular", "enonce_en": "Sedition is not a start of free will: individuals are always determined, but now to something else, when indignation prevails over obsequium. It reopens the angle α: misaligned, the conatuses offer nothing more to capture and strive towards new objects of desire; they can even oppose the master-desire.", "citation": "", "loc": ["39.4", "39.5"], "depends_on": ["T042", "D16", "D24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T042, la rupture doit tout au déterminisme des passions, ici des passions colériques, « la meilleure, ou la moins mauvaise, des passions tristes » ; une nouvelle résultante affective fait que l'indignation qui fait bouger l'emporte sur l'obsequium (D16) qui faisait rester (39.4).\n2. L'indignation peut rester isolée ou précipiter une cristallisation plus large, comme Lip en 1973, dont on a craint qu'elle vienne à « véroler tout le corps social » (39.4).\n3. Elle conduit à vivre *ex suo ingenio*, à sa guise, c'est-à-dire « déterminé autrement », et les guises se recomposent souvent collectivement. Le patron, par un abus marginal, a converti la crainte en haine : il a lui-même décolinéarisé ses enrôlés (39.5).\n4. Par D24, la sédition est le devenir orthogonal : capture nulle à l'angle droit, opposition déclarée à 180°. Les perpendiculaires résistent au détournement en inventant de nouveaux objets de désir (39.5). ∎\n\n## Scolie\n\nEn exergue de la section, *The Misfits* : « – C'est toujours mieux qu'un salaire, non ? – Oui, tout est mieux qu'un salaire » (39.1-39.3).", "body_en": "## Argument\n\n1. By T042, the break owes everything to the determinism of the passions, here angry passions, \"the best, or the least bad, of the sad passions\"; a new affective resultant makes the indignation that sets in motion prevail over the obsequium (D16) that made one stay (39.4).\n2. Indignation can remain isolated or precipitate a wider crystallisation, like Lip in 1973, which was feared to \"infect the whole social body\" (39.4).\n3. It leads to living *ex suo ingenio*, as one pleases, that is, \"determined otherwise\", and ways of pleasing often recompose collectively. The boss, by a marginal abuse, has converted fear into hatred: he has himself decollinearised his enlisted (39.5).\n4. By D24, sedition is becoming orthogonal: nil capture at the right angle, declared opposition at 180°. The perpendiculars resist diversion by inventing new objects of desire (39.5). ∎\n\n## Scholium\n\nAs the section's epigraph, *The Misfits*: \"– It's better than wages, isn't it? – Yes, anything's better than wages\" (39.1-39.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D16", "D24", "T042"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D16", "D24", "T042"], "mentions": ["D16", "D24", "T042"], "corollaires": [], "mtime": 1794571357.253219}, {"id": "T044", "file": "theses/T044.md", "type": "these", "partie": "3", "titre": "L'aliénation est fixation, l'émancipation défixation", "enonce": "On n'est jamais séparé de sa puissance : elle est toujours en acte, et l'émancipation n'est pas une retrouvaille. Si l'on veut sauver le mot, l'aliénation est la fixation de la puissance sur peu d'objets, celle que produit le désir-maître, même joyeusement ; le devenir orthogonal est un ré-élargissement, un commencement de défixation.", "titre_en": "Alienation is fixation, emancipation defixation", "enonce_en": "One is never separated from one's power: it is always in act, and emancipation is not a reunion. If one wants to save the word, alienation is the fixation of power on few objects, the one the master-desire produces, even joyfully; becoming orthogonal is a re-widening, a beginning of defixation.", "citation": "", "loc": ["40.1", "40.2", "40.3"], "depends_on": ["D25", "S29", "T043", "T038"], "contre": ["R13"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S29, il n'y a pas de puissance en réserve : le schème de la séparation (R13) contredit l'immanence (40.1).\n2. Même sous le plus tyrannique des désirs-maîtres, les individus ne sont pas séparés de leur puissance : ils sont déterminés à l'effectuer dans une direction, tristement ou joyeusement (40.2).\n3. Il y a pourtant du plus et du moins dans l'ordre de la puissance. L'exploitation passionnelle (T038) fixe la puissance sur les objets du désir-maître : c'est l'aliénation au sens de D25 (40.2-40.3).\n4. Le devenir orthogonal (T043) est donc « ré-élargissement par commencement de la défixation » (40.3). ∎", "body_en": "## Argument\n\n1. By S29, there is no power in reserve: the schema of separation (R13) contradicts immanence (40.1).\n2. Even under the most tyrannical of master-desires, individuals are not separated from their power: they are determined to enact it in one direction, sadly or joyfully (40.2).\n3. There is nonetheless more and less in the order of power. Passional exploitation (T038) fixes power on the objects of the master-desire: this is alienation in the sense of D25 (40.2-40.3).\n4. Becoming orthogonal (T043) is therefore \"re-widening through a beginning of defixation\" (40.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D25", "R13", "S29", "T038", "T043"], "sections": ["Argumentation"], "demo_refs": ["D25", "R13", "S29", "T038", "T043"], "mentions": ["D25", "R13", "S29", "T038", "T043"], "corollaires": [], "mtime": 1794571357.253219}, {"id": "T045", "file": "theses/T045.md", "type": "these", "partie": "3", "titre": "Le paysage de classe est le dual du paysage passionnel", "enonce": "Passer « symboliquement du côté du capital », c'est avoir le composé affectif salarial déplacé vers la joie : la « subsomption réelle » joyeuse. L'engagement des salariés forme un continuum, de sorte que le paysage de classe, brouillé, reflète le gradient affectif du salariat. Ce gradient n'est pas subjectif : les affects sont objectivement causés.", "titre_en": "The class landscape is the dual of the passional landscape", "enonce_en": "Going over \"symbolically to the side of capital\" means having one's wage-labour affective compound shifted towards joy: joyful \"real subsumption\". Employees' commitment forms a continuum, so that the class landscape, blurred, reflects the affective gradient of wage labour. This gradient is not subjective: affects are objectively caused.", "citation": "« passer symboliquement du côté du capital, c’est avoir la “subsomption réelle” joyeuse »", "loc": ["41.1", "41.2", "41.3"], "depends_on": ["T034", "S31"], "contre": ["R14"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le choc capital-travail n'a pas disparu, comme le montre la scène rapportée par François Ruffin, où les ouvrières d'un sous-traitant de LVMH affrontent l'assemblée des actionnaires (41.1). Mais la théorie marxienne originelle est en difficulté depuis que le dirigeant est salarié et avec la « diffusion cadriste » (41.1).\n2. Passer symboliquement du côté du capital, c'est voir son composé affectif déplacé du côté joyeux ; par T034, ce passage connaît des degrés, du rétif au salarié qui voue sa vie à l'entreprise. Le paysage de classe est brouillé par ce gradient de l'engagement, gradient de la joie (41.2).\n3. Par S31, les affects sont objectivement causés : le rapport subjectif du salarié à sa situation est objectivement produit. La condition salariale en elle-même n'épuise donc pas la vie salariale (R14), comme le montre le PDG salarié, auquel on passe sans solution de continuité (41.3). ∎", "body_en": "## Argument\n\n1. The clash of capital and labour has not disappeared, as the scene reported by François Ruffin shows, where the women workers of an LVMH subcontractor confront the shareholders' meeting (41.1). But the original Marxian theory has been in difficulty since the executive became an employee and with the \"spread of the managerial layer\" (41.1).\n2. Going over symbolically to the side of capital means seeing one's affective compound shifted to the joyful side; by T034, this passage has degrees, from the recalcitrant to the employee who devotes his life to the firm. The class landscape is blurred by this gradient of commitment, a gradient of joy (41.2).\n3. By S31, affects are objectively caused: the employee's subjective relation to his situation is objectively produced. The wage condition in itself therefore does not exhaust wage life (R14), as the salaried CEO shows, to whom one passes without any break in continuity (41.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["R14", "S31", "T034"], "sections": ["Argumentation"], "demo_refs": ["R14", "S31", "T034"], "mentions": ["R14", "S31", "T034"], "corollaires": [], "mtime": 1794571357.255225}, {"id": "T046", "file": "theses/T046.md", "type": "these", "partie": "3", "titre": "L'histoire comme mécontentement", "enonce": "L'antagonisme qui peut faire bifurquer l'histoire est affectif : le choc des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose. Il y a donc toujours des classes, mais des classes affectives. En maltraitant jusqu'aux salariés les plus engagés, le capitalisme, haïssable alors qu'il veut se rendre aimable, tend à reconstituer une classe homogène des mécontents, qui menace de remettre l'histoire en marche.", "titre_en": "History as discontent", "enonce_en": "The antagonism that can make history fork is affective: the clash of the joyful who want nothing changed and the discontented who want something else. There are therefore still classes, but affective classes. By mistreating even the most committed employees, capitalism, hateful when it wants to make itself lovable, tends to reconstitute a homogeneous class of the discontented, which threatens to set history moving again.", "citation": "« Le mécontentement : voilà la force historique affective capable de faire bifurquer le cours des choses. »", "loc": ["41.4", "41.5"], "depends_on": ["T045", "D26", "S32"], "contre": ["R15"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T045, l'appartenance au salariat n'a plus l'homogénéité qui faisait sa force motrice ; l'histoire, qui fonctionne aux affects, ne bifurque que par les affects colériques (41.4).\n2. Contre ceux qui veulent tourner la page (R15), il y a toujours des classes, au sens de D26 ; la lutte des classes devient lutte de classes affectives (41.4).\n3. Les affects communs ont une cause : le capital comme rapport social, et finalement comme forme de vie (41.4).\n4. Le capitalisme maltraite à des échelles inouïes au moment même où il veut des salariés contents ; il nourrit ainsi l'affect commun qui peut assembler une multitude (S32). Quand la maltraitance touche les salariés les plus engagés, leur situation affective rejoint leur situation matérielle : c'est une « re-purification » de la situation de classe, et la classe des mécontents menace de remettre l'histoire en marche (41.5). ∎", "body_en": "## Argument\n\n1. By T045, belonging to wage labour no longer has the homogeneity that made its driving force; history, which runs on affects, forks only through angry affects (41.4).\n2. Against those who want to turn the page (R15), there are still classes, in the sense of D26; the class struggle becomes a struggle of affective classes (41.4).\n3. Common affects have a cause: capital as a social relation, and ultimately as a form of life (41.4).\n4. Capitalism mistreats on unheard-of scales at the very moment it wants contented employees; it thus feeds the common affect that can assemble a multitude (S32). When mistreatment reaches the most committed employees, their affective situation rejoins their material situation: this is a \"re-purification\" of the class situation, and the class of the discontented threatens to set history moving again (41.5). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D26", "R15", "S32", "T045"], "sections": ["Argumentation"], "demo_refs": ["D26", "R15", "S32", "T045"], "mentions": ["D26", "R15", "S32", "T045"], "corollaires": [], "mtime": 1794571357.2562418}, {"id": "T047", "file": "theses/T047.md", "type": "these", "partie": "3", "titre": "La capture renaît sans cesse", "enonce": "Même hors du capitalisme, le désir-maître renaît : la division du travail produit du pouvoir, les associés entrent dans l'association inégalement armés et inégalement désirants, et toute action est prise dans une économie de la joie. Les joies extrinsèques, de reconnaissance, sont différentielles et appellent la captation attributive : l'œuvre est collective, mais c'est « mon œuvre ».", "titre_en": "Capture is constantly reborn", "enonce_en": "Even outside capitalism, the master-desire is reborn: the division of labour produces power, associates enter the association unequally armed and unequally desiring, and every action is caught in an economy of joy. Extrinsic joys, those of recognition, are differential and call for attributive capture: the work is collective, but it is \"my work\".", "citation": "« L’œuvre est collective, mais c’est mon œuvre… »", "loc": ["42.1", "42.2", "42.3"], "depends_on": ["T046", "M06", "S34", "S35", "T005"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T046, une classe des mécontents peut se reconstituer ; mais, parviendrait-elle à renverser le capitalisme, elle n'en aurait vraisemblablement pas fini avec le désir-maître. Par M06, la division du travail sécrète du pouvoir ; abolir la propriété privée est nécessaire mais pas suffisant (R16) : la propriété étatique en URSS n'a pas changé les rapports de production (42.1).\n2. Spinoza s'intéresse lui aussi à la division du travail (*Traité théologico-politique*, V) : par S34, elle rapproche les hommes, mais ils y entrent inégalement armés, ce qui fonde toutes les captures, et inégalement désirants (42.2).\n3. Par T005, le désir est intéressé à son objet, c'est-à-dire en quête de joie : le profit monétaire n'est qu'un cas d'une économie générale de la joie. L'économie de la joie intrinsèque est non rivale ; celle de la joie extrinsèque, de la reconnaissance, est différentielle (42.2).\n4. Par S35, chacun aime contempler sa puissance et la faire voir : d'où la captation des joies extrinsèques de l'action collective. Celui qui désire davantage est « l'appropriateur en puissance », et « prendre les choses en mains » est une annonce de pronation (42.2-42.3). ∎", "body_en": "## Argument\n\n1. By T046, a class of the discontented can reconstitute itself; but, should it manage to overthrow capitalism, it would probably not be done with the master-desire. By M06, the division of labour secretes power; abolishing private property is necessary but not sufficient (R16): state ownership in the USSR did not change the relations of production (42.1).\n2. Spinoza too is interested in the division of labour (*Theological-Political Treatise*, V): by S34, it brings men together, but they enter it unequally armed, which grounds all captures, and unequally desiring (42.2).\n3. By T005, desire is interested in its object, that is, in search of joy: monetary profit is only one case of a general economy of joy. The economy of intrinsic joy is non-rival; that of extrinsic joy, of recognition, is differential (42.2).\n4. By S35, everyone likes to contemplate his power and to display it: hence the capture of the extrinsic joys of collective action. Whoever desires more is \"the potential appropriator\", and \"taking things in hand\" announces grabbing (42.2-42.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["M06", "R16", "S34", "S35", "T005", "T046"], "sections": ["Argumentation"], "demo_refs": ["M06", "R16", "S34", "S35", "T005", "T046"], "mentions": ["M06", "R16", "S34", "S35", "T005", "T046"], "corollaires": [], "mtime": 1794571357.2562418}, {"id": "T048", "file": "theses/T048.md", "type": "these", "partie": "3", "titre": "Le communisme véritable est un horizon", "enonce": "Le communisme doit compter, comme le capitalisme, avec la servitude passionnelle. Le communisme véritable, la non-rivalité des vrais biens, supposerait des hommes conduits par la raison ; il est un horizon, une idée régulatrice. La sortie du capitalisme ne fait sortir ni de la servitude passionnelle, ni de la violence, ni des rapports de dépendance : il faut renoncer aux illusions de la société radieuse.", "titre_en": "True communism is a horizon", "enonce_en": "Communism must reckon, like capitalism, with passional servitude. True communism, the non-rivalry of true goods, would presuppose men guided by reason; it is a horizon, a regulative idea. Leaving capitalism leads out neither of passional servitude, nor of violence, nor of relations of dependence: the illusions of the radiant society must be given up.", "citation": "« le communisme est une longue patience, un effort continu, et peut-être seulement, pour parler encore une fois comme Kant, une idée régulatrice »", "loc": ["42.4", "43.1", "43.3"], "depends_on": ["T047", "S36", "S37", "S34", "S39"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S37, il faut prendre les hommes tels qu'ils sont : le communisme doit compter avec la « force des affects » et l'universelle « servitude humaine » (42.4).\n2. Par S36, l'exploitation passionnelle prendrait fin si les hommes dirigeaient leurs désirs communs vers des biens non rivaux, comme la raison ; par S34, les hommes conduits par la raison ne poursuivent rien pour eux qu'ils ne désirent pour les autres : « la formule la plus haute du communisme » (42.4, 43.1).\n3. Mais cette hypothèse n'est pas petite. Par T047, la capture renaît de la vie passionnelle, qui préexistait au capitalisme et lui survivra ; la structure de la capture est « un attracteur très puissant » (43.1).\n4. Par S39, le conatus n'exclut ni conflits ni haines : rêver l'éradication de la violence et l'extinction du politique (R16) est une fantasmagorie ; l'horizon est d'en trouver les formes les moins destructrices, sans abolir les dépendances, ne serait-ce qu'amoureuses (43.3). ∎\n\n## Scolie\n\nLe naufragé de Pascal, fait roi par les habitants de l'île où il échoue, montre que la capture échoit même à qui ne l'a pas demandée (43.1). L'*Éthique* trace la voie de la raison, mais « la voie est escarpée » (42.4, note 154).", "body_en": "## Argument\n\n1. By S37, men must be taken as they are: communism must reckon with the \"strength of the affects\" and universal \"human bondage\" (42.4).\n2. By S36, passional exploitation would end if men directed their common desires towards non-rival goods, like reason; by S34, men guided by reason seek nothing for themselves that they do not desire for others: \"the highest formula of communism\" (42.4, 43.1).\n3. But this hypothesis is no small one. By T047, capture is reborn from passional life, which pre-existed capitalism and will outlive it; the structure of capture is \"a very powerful attractor\" (43.1).\n4. By S39, the conatus excludes neither conflicts nor hatreds: dreaming of the eradication of violence and the withering away of politics (R16) is a phantasmagoria; the horizon is to find their least destructive forms, without abolishing dependences, if only those of love (43.3). ∎\n\n## Scholium\n\nPascal's castaway, made king by the inhabitants of the island where he washes up, shows that capture falls even to one who did not ask for it (43.1). The *Ethics* traces the path of reason, but \"the path is steep\" (42.4, note 154).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["R16", "S34", "S36", "S37", "S39", "T047"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["R16", "S34", "S36", "S37", "S39", "T047"], "mentions": ["R16", "S34", "S36", "S37", "S39", "T047"], "corollaires": [], "mtime": 1794571357.2562418}, {"id": "T049", "file": "theses/T049.md", "type": "these", "partie": "3", "titre": "Tous les régimes passionnels ne se valent pas", "enonce": "Tout ne s'équivaut pas du côté des passions : les institutions déterminent des possibilités contrastées de puissance, de désir et de joie. Une multitude conduite par l'espoir cultive la vie ; par la crainte, elle évite la mort. Le progrès, c'est l'enrichissement de la vie en affects joyeux qui élargissent les effectuations de puissance ; la démocratie radicale, que le Traité politique laisse inachevée, en est l'horizon.", "titre_en": "Not all passional regimes are equal", "enonce_en": "Not everything is equivalent on the side of the passions: institutions determine contrasting possibilities of power, desire and joy. A multitude led by hope cultivates life; by fear, it avoids death. Progress is the enrichment of life in joyful affects that widen the enactments of power; radical democracy, which the Political Treatise leaves unfinished, is its horizon.", "citation": "« Si l’idée de progrès a un sens, il ne peut être que l’enrichissement de la vie en affects joyeux »", "loc": ["43.2", "43.4"], "depends_on": ["T048", "S38", "S16", "S40", "T044"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T048, il faut renoncer au grand soir, mais pas aux progrès : la servitude passionnelle n'empêche pas la diversité des agencements institutionnels, et tous ne se valent pas (43.2).\n2. Par S38, le joug des affects tristes n'est pas moins joug que celui des affects joyeux, « mais il est… triste » : la crainte rive aux plus bas niveaux de puissance ; c'est par là que se hiérarchisent les régimes de la vie passionnelle collective (43.2).\n3. Le passage de la coercition aux assujettissements joyeux est un progrès, mais de second ordre, au sein du même : la capture fixe toujours les puissances (T044). Se libérer des désirs-maîtres, c'est rouvrir le spectre de leurs effectuations (43.4).\n4. La question du *Traité politique* est celle des agencements qui maximisent nos puissances d'agir et de penser ; toute *potestas* émane de la *potentia multitudinis*, et seule la démocratie, « absolu en tout » (S40), organise les retrouvailles de la multitude et de sa puissance (43.4).\n5. Le progrès est donc l'enrichissement de la vie en affects joyeux, et parmi eux en ceux qui élargissent nos effectuations de puissance et les orientent vers le vrai bien, une vie humaine (S16) (43.4). ∎\n\n## Scolie\n\nCe sont les derniers mots du livre : « j'entends par là une vie humaine » (43.4). Lordon reconnaît en note (note 163) qu'il reprend ici, pour le corps social, le schème de la dé-séparation qu'il avait écarté pour les individus.", "body_en": "## Argument\n\n1. By T048, the \"grand soir\" must be given up, but not progress: passional servitude does not prevent the diversity of institutional arrangements, and not all are equal (43.2).\n2. By S38, the yoke of sad affects is no less a yoke than that of joyful affects, \"but it is… sad\": fear rivets to the lowest levels of power; this is how the regimes of collective passional life are ranked (43.2).\n3. The passage from coercion to joyful subjections is progress, but of the second order, within the same: capture still fixes powers (T044). Freeing oneself from master-desires means reopening the spectrum of their enactments (43.4).\n4. The question of the *Political Treatise* is that of the arrangements that maximise our powers of acting and thinking; all *potestas* emanates from the *potentia multitudinis*, and only democracy, \"absolute in every respect\" (S40), organises the reunion of the multitude with its power (43.4).\n5. Progress is therefore the enrichment of life in joyful affects, and among them in those that widen our enactments of power and orient them towards the true good, a human life (S16) (43.4). ∎\n\n## Scholium\n\nThese are the last words of the book: \"by that I mean a human life\" (43.4). Lordon acknowledges in a note (note 163) that he takes up here, for the social body, the schema of de-separation he had set aside for individuals.", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S16", "S38", "S40", "T044", "T048"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S16", "S38", "S40", "T044", "T048"], "mentions": ["S16", "S38", "S40", "T044", "T048"], "corollaires": [], "mtime": 1794571357.2562418}, {"id": "R01", "file": "refutees/R01.md", "type": "refutee", "partie": "1", "titre": "La servitude volontaire", "enonce": "Le dominé serait serf faute de vouloir assez fort son affranchissement : sa servitude serait voulue, et une volonté plus ferme suffirait à la défaire.", "titre_en": "Voluntary servitude", "enonce_en": "The dominated would be in bondage for want of willing their liberation strongly enough: their servitude would be willed, and a firmer will would suffice to undo it.", "citation": "« oxymore sans doute suggestif mais qui, en soi […], cache à peine ses malfaçons »", "loc": ["01.8", "08.2", "08.4", "10.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne formule qu'on finit par « ressasser » faute d'autre chose (01.8) : celle de La Boétie, que « l'époque voudrait faire la clé de lecture du rapport salarial » (08.2). Lordon distingue le titre de la thèse : la thèse de La Boétie « vaut mieux que son titre » (08.2, 10.1). La formule suppose un individu-sujet libre d'arbitre, dont les actes seraient l'effet d'un vouloir souverain. Elle reste alors une énigme insoluble (comment vouloir un état indésirable ?) et ne peut servir que d'appel politique au soulèvement des consciences, non de compréhension par les causes (08.2).", "body_en": "## As Lordon presents it\n\nA formula one ends up \"harping on\" for want of anything else (01.8): La Boétie's, which \"the age would like to make the key to reading the wage relation\" (08.2). Lordon distinguishes the title from the thesis: La Boétie's thesis \"is worth more than its title\" (08.2, 10.1). The formula assumes an individual-subject endowed with free will, whose acts would be the effect of a sovereign will. It then remains an insoluble riddle (how can one will an undesirable state?) and can only serve as a political call for the uprising of consciences, not as an understanding through causes (08.2).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "R02", "file": "refutees/R02.md", "type": "refutee", "partie": "1", "titre": "L'intérêt comme calcul, le don comme désintéressement", "enonce": "L'intérêt se réduirait au calcul utilitariste ; à côté de lui existeraient des conduites désintéressées, un altruisme pur où le soi renoncerait à tout compte.", "titre_en": "Interest as calculation, the gift as disinterestedness", "enonce_en": "Interest would boil down to utilitarian calculation; alongside it there would be disinterested conduct, a pure altruism in which the self renounced all reckoning.", "citation": "", "loc": ["05.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nPosition des « amis du don désintéressé », en particulier du MAUSS (note 4), qui défendent l'*homo donator* contre l'*homo œconomicus* (05.2). Selon Lordon, ils valident la réduction utilitariste qu'ils combattent, en abandonnant à l'adversaire le mot d'intérêt et l'étendue d'un concept bien plus vaste.", "body_en": "## As Lordon presents it\n\nThe position of the \"friends of the disinterested gift\", in particular MAUSS (note 4), who defend *homo donator* against *homo œconomicus* (05.2). According to Lordon, they validate the utilitarian reduction they fight, abandoning to their opponent the word interest and the scope of a far broader concept.", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "R03", "file": "refutees/R03.md", "type": "refutee", "partie": "1", "titre": "Le désir comme attraction par le désirable", "enonce": "Le désir serait la traction exercée sur nous par des choses désirables en elles-mêmes, qui préexisteraient au désir.", "titre_en": "Desire as attraction by the desirable", "enonce_en": "Desire would be the pull exerted on us by things desirable in themselves, which would pre-exist desire.", "citation": "", "loc": ["08.3", "22.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nLa « conception ordinaire du désir », que la lecture de Spinoza renverse (08.3). Lordon y revient en 22.2 contre « la représentation spontanée qui pose l'antériorité de la valeur au désir » (D17).", "body_en": "## As Lordon presents it\n\nThe \"ordinary conception of desire\", which the reading of Spinoza reverses (08.3). Lordon returns to it in 22.2 against \"the spontaneous representation that posits the anteriority of value to desire\" (D17).", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": ["D17"], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "R04", "file": "refutees/R04.md", "type": "refutee", "partie": "1", "titre": "La symétrie du capital et du travail", "enonce": "Capital et travail dépendraient également l'un de l'autre, puisque l'employeur a autant besoin de force de travail que le salarié a besoin d'argent.", "titre_en": "The symmetry of capital and labour", "enonce_en": "Capital and labour would depend equally on each other, since the employer needs labour power as much as the employee needs money.", "citation": "", "loc": ["09.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nL'objection est formulée par Lordon lui-même (« On objectera que… », 09.2) : les « apporteurs de machines » n'ont formellement pas moins besoin des « apporteurs de travail » que l'inverse.", "body_en": "## As Lordon presents it\n\nThe objection is formulated by Lordon himself (\"It will be objected that…\", 09.2): the \"providers of machines\" formally need the \"providers of labour\" no less than the reverse.", "sections_en": ["As Lordon presents it"], "demo_refs_en": [], "sections": ["Telle que Lordon la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571085.9488046}, {"id": "R05", "file": "refutees/R05.md", "type": "refutee", "partie": "1", "titre": "La retenue du licenciement comme norme morale", "enonce": "Sous le fordisme, les employeurs se seraient retenus de licencier par respect d'une norme morale : priver les salariés de leur subsistance serait trop grave pour relever d'une décision économique.", "titre_en": "Restraint in dismissals as a moral norm", "enonce_en": "Under Fordism, employers would have refrained from dismissing out of respect for a moral norm: depriving employees of their livelihood would be too serious to be an economic decision.", "citation": "", "loc": ["16.1", "16.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente
