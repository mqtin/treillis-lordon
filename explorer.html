demo_refs_en": ["D10", "T007", "T009"], "sections": ["Argumentation"], "demo_refs": ["D10", "T007", "T009"], "mentions": ["D10", "T007", "T009"], "corollaires": [], "mtime": 1794571189.1450837}, {"id": "T012", "file": "theses/T012.md", "type": "these", "partie": "1", "titre": "La crainte et la violence se propagent le long des chaînes de dépendance", "enonce": "Toute pression venue d'en haut descend en cascade le long de la hiérarchie. Le désir d'argent restant impérieux tandis que ses conditions se durcissent, la crainte se diffuse et pousse chacun à un surcroît d'activité, qu'il reporte en violence sur ceux qui dépendent de lui. Contrainte actionnariale, concurrence et sous-traitance propagent ainsi la violence dans les entreprises et entre elles.", "titre_en": "Fear and violence spread along the chains of dependence", "enonce_en": "Any pressure from above cascades down the hierarchy. With the desire for money still imperious while its conditions harden, fear spreads and pushes each to extra activity, which he passes on as violence to those who depend on him. Shareholder constraint, competition and subcontracting thus spread violence within firms and between them.", "citation": "« l’implacable logique qui veut que les violences exercées soient proportionnelles aux violences subies »", "loc": ["11.1", "11.2", "11.3"], "depends_on": ["T011", "S08", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T011, à chaque échelon, conserver sa position exige l'effort réclamé par l'échelon supérieur ; une pression venue d'en haut se propage donc à tous les étages, et la probabilité d'y satisfaire diminue (11.1).\n2. Par S08, la crainte accompagne le désir dès que son objet est incertain. Le désir restant intense et ses conditions plus difficiles, la balance de l'espoir et de la crainte penche vers la crainte (11.1).\n3. Par S09, comme tout affect triste, la crainte induit un surcroît de puissance d'agir pour s'en défaire ; dans un contexte de domination, ce surcroît se traduit en violence exercée sur ceux qu'on peut dominer, et sur soi (11.1).\n4. Le choc actionnarial est réexprimé en objectifs intermédiaires à chaque échelon ; reporting, mise en concurrence interne et menace du déclassement élèvent la sanction de l'échec, donc la crainte (11.2).\n5. Les relations entre entreprises forment aussi des chaînes de dépendance : la sous-traitance jette les organisations les unes contre les autres pour leur survie, et chacun reporte sa contrainte sur ceux qui dépendent de lui (11.2-11.3). ∎\n\n## Scolie\n\nExemple d'un ancien dirigeant de PME (*Ma mondialisation*, documentaire de Gilles Perret, note 27) : des donneurs d'ordre envoient à dessein de jeunes cadres, plus vulnérables, donc plus enclins à la violence économique, exiger des baisses de prix (11.3).", "body_en": "## Demonstration\n\n1. By T011, at each rung, keeping one's position requires the effort demanded by the rung above; a pressure from above therefore spreads to every level, and the probability of meeting it decreases (11.1).\n2. By S08, fear accompanies desire as soon as its object is uncertain. With desire still intense and its conditions harder, the balance of hope and fear tips towards fear (11.1).\n3. By S09, like every sad affect, fear induces a surplus of power of acting to rid oneself of it; in a context of domination, this surplus translates into violence exercised on those one can dominate, and on oneself (11.1).\n4. The shareholder shock is re-expressed as intermediate targets at each rung; reporting, internal competition and the threat of demotion raise the penalty for failure, hence fear (11.2).\n5. Relations between firms also form chains of dependence: subcontracting throws organisations against one another for their survival, and each passes its constraint on to those who depend on it (11.2-11.3). ∎\n\n## Scholium\n\nThe example of a former head of an SME (*Ma mondialisation*, documentary by Gilles Perret, note 27): contractors deliberately send young managers, more vulnerable and therefore more inclined to economic violence, to demand price cuts (11.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["S08", "S09", "T011"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["S08", "S09", "T011"], "mentions": ["S08", "S09", "T011"], "corollaires": [], "mtime": 1794571189.1476164}, {"id": "T013", "file": "theses/T013.md", "type": "these", "partie": "1", "titre": "Le salariat attache aussi par la joie : le salaire et la marchandise", "enonce": "Les salariés ne tiennent pas au rapport d'enrôlement sous la seule contrainte : ils y trouvent des occasions de joie. La première est le salaire, joie de basse intensité ; la seconde, plus franche, est la consommation. La marchandise, en démultipliant les objets du désir, accroît la dépendance salariale tout en l'accompagnant d'affects joyeux, au point de durcir un renoncement au renversement du capitalisme.", "titre_en": "Wage labour also binds through joy: the wage and the commodity", "enonce_en": "Employees do not stay in the relation of enlistment under constraint alone: they find occasions of joy in it. The first is the wage, a joy of low intensity; the second, more outright, is consumption. The commodity, by multiplying the objects of desire, increases wage dependence while accompanying it with joyful affects, to the point of hardening a renunciation of overturning capitalism.", "citation": "", "loc": ["12.1", "12.2", "12.3", "12.4"], "depends_on": ["T006", "S02", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Comprendre ce qui fait durer le capitalisme, c'est saisir toute la variété de ses affects : les salariés y trouvent aussi un certain compte, des occasions de joie (12.1).\n2. Par T006, le salaire satisfait le désir basal ; son obtention est le moment joyeux du rapport salarial. La joie doit être prise « avec une certaine froideur analytique » : elle peut être très basse, comme l'est d'avoir la vie sauve dans l'esclavage (12.2).\n3. Le capitalisme, surtout à l'époque fordienne, y a ajouté la consommation : la marchandise offre au désir une démultiplication sans limite de ses points d'application, et le mot de Spinoza (S02) reçoit « sa pleine dimension » (12.2).\n4. La marchandise porte donc la dépendance salariale plus haut, mais avec les affects joyeux de l'acquisition. Le discours de l'ordre établi s'adresse « au seul consommateur » en chacun et fait retomber le salarié dans l'accessoire ; la construction européenne a évincé le droit social par le droit de la concurrence, présenté comme le plus grand service rendu aux individus, mais en tant que consommateurs (12.3).\n5. L'aliénation joyeuse accepte même des affects tristes, comme l'endettement, qui redouble la dépendance salariale (12.4). Par S06, une société qui réduirait seule ses aspirations resterait exposée à l'imitation du désir de ses voisins : la bifurcation décroissante doit d'abord se construire un imaginaire refait à neuf (12.4). ∎\n\n## Scolie\n\nL'allongement des médiations entre le travail de chacun et ses objets de consommation favorise un « compartimentage » : nul ou presque ne relie l'avantage du consommateur aux sujétions du salarié (12.3). L'emprunt immobilier des « jeunes installés » les rive à l'emploi pour vingt ans ; la fascination de l'opulence a eu sa part dans le rejet des « socialismes réels » (12.4).", "body_en": "## Argument\n\n1. Understanding what makes capitalism last means grasping the full variety of its affects: employees also find some account in it, occasions of joy (12.1).\n2. By T006, the wage satisfies basic desire; obtaining it is the joyful moment of the wage relation. Joy must be taken \"with a certain analytical coldness\": it can be very low, as is having one's life spared in slavery (12.2).\n3. Capitalism, especially in the Fordist era, added consumption: the commodity offers desire a limitless multiplication of its points of application, and Spinoza's phrase (S02) receives \"its full dimension\" (12.2).\n4. The commodity therefore carries wage dependence higher, but with the joyful affects of acquisition. The discourse of the established order addresses \"the consumer alone\" in each of us and relegates the employee to the incidental; European construction ousted social law in favour of competition law, presented as the greatest service rendered to individuals, but as consumers (12.3).\n5. Joyful alienation even accepts sad affects, such as debt, which doubles wage dependence (12.4). By S06, a society that reduced its aspirations on its own would remain exposed to the imitation of its neighbours' desire: the degrowth fork must first build itself an imaginary made anew (12.4). ∎\n\n## Scholium\n\nThe lengthening of mediations between each person's work and the objects of their consumption encourages \"compartmentalisation\": almost nobody connects the consumer's advantage with the employee's subjections (12.3). The mortgage of \"young settled couples\" rivets them to their job for twenty years; the fascination of opulence played its part in the rejection of \"really existing socialisms\" (12.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S02", "S06", "T006"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S02", "S06", "T006"], "mentions": ["S02", "S06", "T006"], "corollaires": [], "mtime": 1794571243.7003963}, {"id": "T014", "file": "theses/T014.md", "type": "these", "partie": "1", "titre": "Mobiliser, c'est aligner ; réduire α est l'idée fixe patronale", "enonce": "Mobiliser est affaire de colinéarité : un conatus se laisse enrôler à proportion de son alignement sur le désir-maître ; orthogonal, il est rétif ; aligné (α = 0), il vit entièrement pour lui. Chaque conatus garde un désalignement propre, son clinamen, qui mesure ce que le patron ne captera pas ; réduire cette dérive, faire des autres le prolongement de soi, est l'idée fixe de tout désir-maître.", "titre_en": "Mobilising means aligning; reducing α is the employer's obsession", "enonce_en": "Mobilising is a matter of collinearity: a conatus lets itself be enlisted in proportion to its alignment with the master-desire; orthogonal, it is recalcitrant; aligned (α = 0), it lives entirely for it. Each conatus keeps a misalignment of its own, its clinamen, which measures what the boss will not capture; reducing this drift, making others the extension of oneself, is the obsession of every master-desire.", "citation": "« la mobilisation est affaire de colinéarité : il s’agit d’aligner le désir des enrôlés sur le désir-maître »", "loc": ["13.2", "13.3", "13.7", "14.1", "14.2", "14.3"], "depends_on": ["D04", "D11", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La question est de savoir comment certains salariés en viennent à faire cause commune avec le capital, ce qui est la réussite suprême du patronat (D04) (13.2).\n2. Par D11, l'effort utile au désir-maître est la composante alignée du conatus enrôlé, d'intensité |**d**| cos α. Un conatus se laisse donc enrôler à proportion de sa colinéarité : à α droit, la capture est nulle ; à α = 0, l'alignement est intégral (13.5-13.7).\n3. Chaque conatus fixe « spontanément » ses directions dans l'espace des objets de désir, d'où un angle α propre, son *clinamen* ; les guillemets rappellent que ces directions viennent toujours en partie du dehors (14.1, note 33).\n4. La capture croissant quand α diminue, réduire la dérive est l'idée fixe de tout désir-maître (D03) : le métadésir de « la communication intégrale du désir », d'autres refaits identiques à soi (14.2). ∎\n\n## Scolie\n\nLe contremaître, cas « bâtard » de salarié délégataire de l'autorité patronale, puis les cadres et jusqu'aux plus hauts dirigeants, qui sont des salariés, troublent depuis longtemps le face-à-face capital-travail (13.2). Le petit patron se voit en son employé et ne comprend pas qu'il serve si mal son désir ; la grande entreprise garde des maximes comme « exigeant avec les autres comme avec soi-même » ; et le vocabulaire appelle les désirs-maîtres des « directeurs » (14.2-14.3).", "body_en": "## Demonstration\n\n1. The question is how some employees come to make common cause with capital, which is the supreme success of bosshood (D04) (13.2).\n2. By D11, the effort useful to the master-desire is the aligned component of the enlisted conatus, of magnitude |**d**| cos α. A conatus therefore lets itself be enlisted in proportion to its collinearity: at a right angle α, capture is nil; at α = 0, alignment is complete (13.5-13.7).\n3. Each conatus \"spontaneously\" sets its directions in the space of objects of desire, hence an angle α of its own, its *clinamen*; the quotation marks recall that these directions always come in part from outside (14.1, note 33).\n4. Since capture grows as α shrinks, reducing drift is the obsession of every master-desire (D03): the meta-desire for \"the complete communication of desire\", others remade identical to oneself (14.2). ∎\n\n## Scholium\n\nThe foreman, a \"bastard\" case of an employee delegated the employer's authority, then managers and up to the highest executives, who are employees, have long troubled the face-to-face of capital and labour (13.2). The small boss sees himself in his employee and cannot understand why the employee serves his desire so poorly; the large firm keeps maxims such as \"as demanding of others as of oneself\"; and vocabulary calls master-desires \"directors\" (14.2-14.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D03", "D04", "D11"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D03", "D04", "D11"], "mentions": ["D03", "D04", "D11"], "corollaires": [], "mtime": 1794571243.7003963}, {"id": "T015", "file": "theses/T015.md", "type": "these", "partie": "1", "titre": "Les régimes de mobilisation changent : l'entreprise néolibérale veut α = 0", "enonce": "Parce que les structures sont historiques, la mobilisation salariale change de régime : l'« aiguillon de la faim », puis la consommation fordienne. Aucun n'a produit l'alignement parfait. L'entreprise néolibérale ne tolère plus le résidu : elle veut α = 0, la mobilisation totale, et, faute de tâches délimitées, entend conformer les désirs et les dispositions qui produisent les actions.", "titre_en": "Regimes of mobilisation change: the neoliberal firm wants α = 0", "enonce_en": "Because structures are historical, wage mobilisation changes regime: the \"goad of hunger\", then Fordist consumption. None produced perfect alignment. The neoliberal firm no longer tolerates the residue: it wants α = 0, total mobilisation, and, lacking delimited tasks, means to shape the desires and dispositions that produce actions.", "citation": "", "loc": ["13.1", "14.3", "14.4", "14.5"], "depends_on": ["T007", "T013", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La configuration passionnelle de la mobilisation, déterminée par des structures plongées dans l'histoire, se transforme : le régime de « l'aiguillon de la faim », qui fait jouer « à l'os » le désir basal (T007), a cédé la place au régime fordien de la consommation (T013) ; celui-ci connaît à son tour une mutation profonde (13.1).\n2. Ni l'un ni l'autre n'a atteint la colinéarisation parfaite (T014). Le capitalisme change de méthode parce qu'il change d'ambition : les α résiduels lui sont devenus intolérables ; il veut α = 0, ce que la sociologie des organisations décrit comme un projet de mobilisation *totale* (14.3).\n3. Première cause : le pouvoir actionnarial et la dérégulation concurrentielle ont basculé le rapport de forces au point que le capital se sent autorisé à *tout* demander (14.4).\n4. Seconde cause : les tâches de l'économie de services et de l'innovation sont à contour flou. L'entreprise fordienne fixait un quantum de puissance à mobiliser et tolérait que le reste lui échappe ; l'entreprise néolibérale remonte des actions aux dispositions, et ouvre ainsi, idéalement à l'infini, le champ des actions escomptables (14.5). ∎\n\n## Scolie\n\nLe troisième régime, celui des affects joyeux intrinsèques, est l'objet du chapitre 2. Mesures de l'hégémonie actionnariale : la part des dividendes dans le PIB (3,2 % en 1982, 8,5 % en 2007, note 35), les rentabilités exigées des entreprises du CAC 40, passées de quelques pourcents à plus de 20 % (note 36) (14.4).", "body_en": "## Argument\n\n1. The passional configuration of mobilisation, determined by structures immersed in history, transforms itself: the regime of \"the goad of hunger\", which works basic desire \"to the bone\" (T007), gave way to the Fordist regime of consumption (T013); this in turn is undergoing a deep mutation (13.1).\n2. Neither achieved perfect collinearisation (T014). Capitalism changes method because it changes ambition: residual αs have become intolerable to it; it wants α = 0, which the sociology of organisations describes as a project of *total* mobilisation (14.3).\n3. First cause: shareholder power and competitive deregulation have tipped the balance of forces to the point that capital feels entitled to ask for *everything* (14.4).\n4. Second cause: the tasks of the service and innovation economy have blurred outlines. The Fordist firm set a quantum of power to be mobilised and tolerated the rest escaping it; the neoliberal firm goes back from actions to dispositions, and thus opens, ideally to infinity, the field of actions that can be counted on (14.5). ∎\n\n## Scholium\n\nThe third regime, that of intrinsic joyful affects, is the subject of chapter 2. Measures of shareholder hegemony: the share of dividends in GDP (3.2% in 1982, 8.5% in 2007, note 35), and the returns required of CAC 40 firms, up from a few per cent to over 20% (note 36) (14.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T007", "T013", "T014"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T007", "T013", "T014"], "mentions": ["T007", "T013", "T014"], "corollaires": [], "mtime": 1794571243.7024047}, {"id": "T016", "file": "theses/T016.md", "type": "these", "partie": "1", "titre": "Tant qu'il ne rencontre pas de résistance, le capital avance, et gouverne par la crainte", "enonce": "L'illimitation entre dans le concept du conatus capitaliste : il veut son augmentation sans fin, sauf si des forces contraires le retiennent. La configuration néolibérale ayant fait tomber ces barrières, le capital pousse son avantage ; une part du suralignement vient d'une radicalisation du gouvernement par la crainte, qui porte la dépendance monétaire à des intensités inconnues depuis longtemps.", "titre_en": "As long as it meets no resistance, capital advances, and governs by fear", "enonce_en": "Limitlessness is part of the concept of the capitalist conatus: it wants its endless increase, unless contrary forces hold it back. The neoliberal configuration having brought these barriers down, capital presses its advantage; part of the over-alignment comes from a radicalisation of government by fear, which carries monetary dependence to intensities unknown for a long time.", "citation": "« Très logiquement, tant qu’il ne rencontre pas de résistance, le capital avance. »", "loc": ["15.1", "15.2"], "depends_on": ["D01", "T015", "T012", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, le conatus est effort ; le conatus capitaliste veut sa propre augmentation sans fin, sauf le contrariement par des forces opposées. Le délire de l'illimité est un symptôme stratégique : l'indice de l'inexistence des résistances (15.1).\n2. Ce paysage de forces est celui des structures, qui seules distribuent les « ressources de pouvoir », terme qui désigne en fait un effet relationnel. De la configuration fordienne (protections, contrôle des capitaux, pas de contrainte actionnariale, politique de croissance) à la néolibérale (libéralisation, délocalisations, contrainte actionnariale, priorité à l'inflation), le rapport capital-travail est modifié du tout au tout (15.1).\n3. Le capital tire donc le profit maximal d'une situation qu'il a contribué à façonner ; la colinéarisation abandonne sa tolérance pour les déviations résiduelles et vise l'alignement parfait (T015) (15.2).\n4. Le chômage de masse rend plus facile que jamais le gouvernement par la crainte (T012) : les menaces de délocalisation et de licenciement jouent de l'affect princeps du rapport salarial, la dépendance monétaire (T006), à des intensités inédites, d'où la « coopération forcée » décrite par Thomas Coutrot (15.2, note 38). ∎\n\n## Scolie\n\nFermer un site en France parce qu'il est « insuffisamment rentable » et proposer un reclassement en Roumanie à 300 euros par mois : l'opprobre ne retient plus le capital, car il « demeure sans force » (15.2).", "body_en": "## Argument\n\n1. By D01, the conatus is striving; the capitalist conatus wants its own endless increase, barring opposition by contrary forces. The delirium of the limitless is a strategic symptom: the sign that resistances do not exist (15.1).\n2. This landscape of forces is that of structures, which alone distribute \"power resources\", a term that in fact designates a relational effect. From the Fordist configuration (protections, capital controls, no shareholder constraint, growth policy) to the neoliberal one (liberalisation, offshoring, shareholder constraint, priority to inflation), the capital-labour relation is transformed through and through (15.1).\n3. Capital therefore draws maximum profit from a situation it helped shape; collinearisation drops its tolerance for residual deviations and aims at perfect alignment (T015) (15.2).\n4. Mass unemployment makes government by fear (T012) easier than ever: the threats of offshoring and dismissal play on the primary affect of the wage relation, monetary dependence (T006), at unprecedented intensities, hence the \"forced cooperation\" described by Thomas Coutrot (15.2, note 38). ∎\n\n## Scholium\n\nClosing a site in France because it is \"insufficiently profitable\" and offering redeployment in Romania at 300 euros a month: opprobrium no longer holds capital back, because it \"remains without force\" (15.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D01", "T006", "T012", "T015"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "T006", "T012", "T015"], "mentions": ["D01", "T006", "T012", "T015"], "corollaires": [], "mtime": 1794571243.7024047}, {"id": "T017", "file": "theses/T017.md", "type": "these", "partie": "1", "titre": "Il n'y a pas de morale autonome", "enonce": "La vertu des agents s'établit au voisinage de leur intérêt à la vertu. La retenue fordienne du licenciement n'était pas une morale mais l'effet de structures stables qui la rendaient peu coûteuse ; quand les structures changent, la menace sur la reproduction matérielle devient la norme, une norme pratique amoralisée qui n'exprime plus qu'un rapport de forces.", "titre_en": "There is no autonomous morality", "enonce_en": "Agents' virtue settles in the vicinity of their interest in virtue. Fordist restraint in dismissals was not a morality but the effect of stable structures that made it cheap; when structures change, the threat to material reproduction becomes the norm, a de-moralised practical norm that expresses nothing but a balance of forces.", "citation": "« Il n’y a pas de morale autonome et la vertu des agents s’établit au voisinage de leurs intérêts à la vertu »", "loc": ["16.1", "16.2"], "depends_on": ["T005", "T016"], "contre": ["R05"], "ethique": [], "ref": "", "lien_explicite": false, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le chantage à la reproduction matérielle n'a atteint son intensité que par un basculement normatif : le licenciement, euphémisé en « plan social », est devenu une pratique de gestion courante (16.1).\n2. La vertu s'établit au voisinage de l'intérêt à la vertu, qu'elle soit directement profitable ou peu coûteuse (16.1). *[reconstruit : c'est l'application de l'intérêt au sens large de T005 ; Lordon renvoie seulement, en note 39, à des profits « pas nécessairement monétaires ».]*\n3. Sous le fordisme, la stabilité des structures dispensait des ajustements par les effectifs et rendait très abordable le « beau geste » du maintien de l'emploi ; le fait a pris la consistance d'une norme (R05) (16.1).\n4. Quand la déréglementation change les structures (T016), le malentendu éclate : la rupture de cette norme devient la nouvelle norme, une norme pratique amoralisée, où les uns ont toutes les cartes et les autres aucune (16.2). ∎", "body_en": "## Argument\n\n1. Blackmail over material reproduction reached its intensity only through a normative shift: dismissal, euphemised as a \"social plan\", has become a routine management practice (16.1).\n2. Virtue settles in the vicinity of the interest in virtue, whether it is directly profitable or cheap (16.1). *[reconstructed: this is the application of interest in the broad sense of T005; Lordon only refers, in note 39, to profits \"not necessarily monetary\".]*\n3. Under Fordism, the stability of structures spared adjustments through headcount and made the \"fine gesture\" of keeping jobs very affordable; the fact took on the consistency of a norm (R05) (16.1).\n4. When deregulation changes the structures (T016), the misunderstanding bursts: breaking this norm becomes the new norm, a de-moralised practical norm, in which some hold all the cards and the others none (16.2). ∎", "sections_en": ["Argument"], "demo_refs_en": ["R05", "T005", "T016"], "sections": ["Argumentation"], "demo_refs": ["R05", "T005", "T016"], "mentions": ["R05", "T005", "T016"], "corollaires": [], "mtime": 1794571243.7039564}, {"id": "T018", "file": "theses/T018.md", "type": "these", "partie": "1", "titre": "La liquidité, paradigme du désir-maître capitaliste", "enonce": "Le désir-maître libéré trouve son modèle dans la liquidité financière : s'engager en sachant pouvoir se désengager, embaucher avec l'idée de pouvoir débaucher. Débordant les marchés d'actifs, ce schème devient le fantasme de toute une époque et pousse les désirs-maîtres à obtenir les transformations de structure qui les en rapprochent.", "titre_en": "Liquidity, the paradigm of the capitalist master-desire", "enonce_en": "The liberated master-desire finds its model in financial liquidity: committing while knowing one can withdraw, hiring with the idea of being able to fire. Overflowing asset markets, this schema becomes the fantasy of a whole era and pushes master-desires to obtain the structural transformations that bring them closer to it.", "citation": "", "loc": ["16.2", "16.3"], "depends_on": ["T017", "D12", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T017, imposer aux salariés la crainte pour leur reproduction est devenu normal : c'est le signe d'un désir-maître qui ne se sent plus retenu par rien. Il trouve son paradigme dans le capital financier, sous la forme de la liquidité (16.2).\n2. Par D12, la liquidité est l'engagement minimal, la réversibilité parfaite. Elle fait doublement paradigme : comme accès à l'argent, objet du métadésir (T006), et comme modèle de réversibilité totale (16.3).\n3. Le schème déborde la finance : même si aucun marché du travail n'atteindra la flexibilité des marchés financiers, la liquidité fait point de mire (16.3). ∎\n\n## Scolie\n\nLa thèse patronale selon laquelle le chômage ne baisserait qu'en affranchissant les licenciements de toute règle exprime ce métadésir : « une sorte de mai 68 pour patrons ». La théorie des marchés de concurrence pure et parfaite en porte le message : tout doit pouvoir s'ajuster instantanément, aux variations des désirs-maîtres (16.3).", "body_en": "## Argument\n\n1. By T017, imposing on employees fear for their reproduction has become normal: it is the sign of a master-desire that no longer feels held back by anything. It finds its paradigm in financial capital, in the form of liquidity (16.2).\n2. By D12, liquidity is minimal commitment, perfect reversibility. It is a paradigm twice over: as access to money, the object of the meta-desire (T006), and as a model of total reversibility (16.3).\n3. The schema overflows finance: even if no labour market will ever reach the flexibility of financial markets, liquidity is the target (16.3). ∎\n\n## Scholium\n\nThe employers' thesis that unemployment would only fall by freeing dismissals from all rules expresses this meta-desire: \"a sort of May 68 for bosses\". The theory of pure and perfect competitive markets carries its message: everything must be able to adjust instantly, to the variations of master-desires (16.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D12", "T006", "T017"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D12", "T006", "T017"], "mentions": ["D12", "T006", "T017"], "corollaires": [], "mtime": 1794571243.7039564}, {"id": "T019", "file": "theses/T019.md", "type": "these", "partie": "1", "titre": "Tyrannie et terreur", "enonce": "L'égocentrisme du conatus, servi par une asymétrie de puissance, va nécessairement à l'abus : quand les structures ne retiennent plus rien des mouvements du désir-maître, la domination devient tyrannie. Son projet, rendre l'emploi aussi réversible qu'un portefeuille d'actifs, fait porter aux salariés les fluctuations de l'activité et les plonge dans un monde de terreur.", "titre_en": "Tyranny and terror", "enonce_en": "The egocentrism of the conatus, served by an asymmetry of power, necessarily goes to abuse: when structures no longer hold back anything of the master-desire's movements, domination becomes tyranny. Its project, making employment as reversible as a portfolio of assets, makes employees bear the fluctuations of activity and plunges them into a world of terror.", "citation": "", "loc": ["17.1", "17.2"], "depends_on": ["T018", "T016", "D13"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T018, le désir-maître, dans le paradigme de la liquidité, ne tolère plus de restriction et prend au sérieux l'idée de n'avoir plus à compter avec l'autre ; il trouve « naturels » tous ses réquisits, parce que ce sont les siens (17.1).\n2. Par T016, les structures présentes lui font droit, et rien ne le retient plus, pas même les régulations morales ou réputationnelles. Engagé dans des collaborations auxquelles il veut donner la forme de la subordination, il va à l'abus (17.1).\n3. Par D13, l'imposition unilatérale du désir de l'un à la multitude est tyrannie : le désir-maître capitaliste, qui ignore la maxime kantienne et projette la subordination sans limite des autres à son entreprise, est en devenir tyrannique (17.1).\n4. Ce désir veut liquéfier la force de travail. La part de revenu du capital était justifiée par le portage du risque, contre une rémunération salariale fixe ; c'est désormais la masse salariale qui accommode les fluctuations de l'activité, par les salaires, l'intensification ou les effectifs (17.2).\n5. La réduction à l'attente passive des commandements d'un désir tyrannique plonge le salariat dans un monde d'incertitude extrême, de terreur (17.2). ∎\n\n## Scolie\n\nCaligula demande à Lepidus s'il est de mauvaise humeur parce qu'il a fait mourir son fils ; Lepidus répond : « Mais non, Caïus, bien au contraire » (Camus, note 46). L'entreprise néolibérale n'en est pas là, et pourtant, selon un ancien cadre dirigeant, des salariés vont chaque jour au travail « morts de peur » (Teodor Limann, note 47) (17.2).", "body_en": "## Demonstration\n\n1. By T018, the master-desire, in the paradigm of liquidity, no longer tolerates restriction and takes seriously the idea of no longer having to reckon with the other; it finds all its requirements \"natural\", because they are its own (17.1).\n2. By T016, present structures grant it its way, and nothing holds it back any more, not even moral or reputational regulations. Engaged in collaborations to which it wants to give the form of subordination, it goes to abuse (17.1).\n3. By D13, the unilateral imposition of the desire of one on the multitude is tyranny: the capitalist master-desire, which ignores the Kantian maxim and projects the unlimited subordination of others to its enterprise, is becoming tyrannical (17.1).\n4. This desire wants to liquefy labour power. Capital's share of income was justified by carrying risk, against a fixed wage; it is now the wage bill that absorbs the fluctuations of activity, through wages, intensification or headcount (17.2).\n5. Reduction to passively awaiting the commands of a tyrannical desire plunges wage-earners into a world of extreme uncertainty, of terror (17.2). ∎\n\n## Scholium\n\nCaligula asks Lepidus whether he is in a bad mood because he has had his son killed; Lepidus answers: \"Why no, Caius, quite the contrary\" (Camus, note 46). The neoliberal firm is not there yet, and yet, according to a former senior executive, employees go to work every day \"scared to death\" (Teodor Limann, note 47) (17.2).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D13", "T016", "T018"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D13", "T016", "T018"], "mentions": ["D13", "T016", "T018"], "corollaires": [], "mtime": 1794571243.7059717}, {"id": "T020", "file": "theses/T020.md", "type": "these", "partie": "2", "titre": "Le capitalisme est un régime de désir", "enonce": "Le capitalisme doit être saisi en ses structures et comme régime de désir, une épithumè : désirer y devient majoritairement désirer selon l'ordre des choses capitaliste. L'entreprise néolibérale ne s'en remet plus au travail diffus de la société : elle prend elle-même en main l'épithumogénie.", "titre_en": "Capitalism is a regime of desire", "enonce_en": "Capitalism must be grasped in its structures and as a regime of desire, an epithumè: to desire becomes, for the most part, to desire according to the capitalist order of things. The neoliberal firm no longer relies on the diffuse work of society: it takes epithumogeny in hand itself.", "citation": "", "loc": ["19.1", "19.2", "19.3"], "depends_on": ["D14", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T014, l'enrôlement est affaire de colinéarisation, c'est-à-dire de production des désirs adéquats au désir-maître : le capitalisme est donc aussi un régime de désir, une épithumè (D14) (19.1).\n2. Les structures objectives se prolongent en structures subjectives : elles ont leur imaginaire propre, comme configuration de désirs et d'affects. Les rapports capitalistes ont acquis assez de centralité pour organiser la plus grande part de la vie sociale ; l'épithumè capitaliste capte la grande part commune des désirs (19.1-19.2).\n3. L'épithumè est produite par le travail que la société fait sur elle-même, mais aussi par des agents qui promeuvent des imaginaires conformes à leurs projets : l'entreprise néolibérale s'investit activement dans cette épithumogénie (19.2).\n4. Dépendance monétaire, hiérarchie et consommation appartenaient déjà à l'épithumè capitaliste ; mais le projet zéro-α montre qu'elle ne s'arrête pas là (19.3). ∎\n\n## Scolie\n\nLa société capitaliste est peut-être la première à présenter un régime *d'ensemble* de désir ; celle qui l'a précédée aurait pu être une « épithumè du salut » (19.2).", "body_en": "## Argument\n\n1. By T014, enlistment is a matter of collinearisation, that is, of producing the desires adequate to the master-desire: capitalism is therefore also a regime of desire, an epithumè (D14) (19.1).\n2. Objective structures extend into subjective structures: they have their own imaginary, as a configuration of desires and affects. Capitalist relations have acquired enough centrality to organise most of social life; the capitalist epithumè captures the large common share of desires (19.1-19.2).\n3. The epithumè is produced by the work society does on itself, but also by agents who promote imaginaries in keeping with their projects: the neoliberal firm invests itself actively in this epithumogeny (19.2).\n4. Monetary dependence, hierarchy and consumption already belonged to the capitalist epithumè; but the zero-α project shows that it does not stop there (19.3). ∎\n\n## Scholium\n\nCapitalist society is perhaps the first to present an *overall* regime of desire; the one before it might have been an \"epithumè of salvation\" (19.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D14", "T014"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D14", "T014"], "mentions": ["D14", "T014"], "corollaires": [], "mtime": 1794571243.7064764}, {"id": "T021", "file": "theses/T021.md", "type": "these", "partie": "2", "titre": "Le projet néolibéral : des affects joyeux intrinsèques", "enonce": "Pour réduire les α résiduels, l'épithumogénie néolibérale veut produire des affects joyeux intrinsèques : faire désirer l'activité de travail pour elle-même, comme source immédiate de joie, d'« épanouissement » et de « réalisation de soi ». Si vie salariale et vie tout court se confondent, les réticents deviennent « consentants », et sont mus plus intensément.", "titre_en": "The neoliberal project: intrinsic joyful affects", "enonce_en": "To reduce residual αs, neoliberal epithumogeny wants to produce intrinsic joyful affects: to make the activity of work desired for its own sake, as an immediate source of joy, \"fulfilment\" and \"self-realisation\". If wage life and life itself merge, the reluctant become \"consenting\", and are moved more intensely.", "citation": "", "loc": ["19.4", "19.5", "21.1"], "depends_on": ["T020", "D15", "T015"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T015, l'entreprise néolibérale veut α = 0 ; par T020, elle prend l'épithumogénie en main (19.4).\n2. Le premier enrichissement, fordien, avait ajouté aux affects tristes de la faim les affects joyeux de la consommation ; il a beaucoup fait pour l'alignement, mais pas assez au jugement de l'entreprise néolibérale (19.4).\n3. Par D15, la faim était intrinsèque mais triste, la consommation joyeuse mais extrinsèque : ni l'une ni l'autre ne suffisait à désarmer l'idée que « la vraie vie est ailleurs ». L'ajout stratégique est l'affect joyeux intrinsèque, désir de l'activité pour elle-même (19.5).\n4. Les salariés se rendaient au désir-maître à contrecœur, ou en pensant à autre chose ; « consentants », ils seront « autrement mus. Autrement signifiant plus intensément » (19.5). Le projet néolibéral est un projet de réenchantement : réinternaliser les objets du désir dans l'activité salariale (21.1). ∎\n\n## Scolie\n\nLe chapitre s'ouvre sur un paradoxe : « Et contradictoirement le tyran voudrait se faire aimer ! » (19.1), qui enchaîne sur la fin du chapitre 1 (T019).", "body_en": "## Argument\n\n1. By T015, the neoliberal firm wants α = 0; by T020, it takes epithumogeny in hand (19.4).\n2. The first, Fordist, enrichment had added to the sad affects of hunger the joyful affects of consumption; it did a great deal for alignment, but not enough in the judgement of the neoliberal firm (19.4).\n3. By D15, hunger was intrinsic but sad, consumption joyful but extrinsic: neither sufficed to disarm the idea that \"real life is elsewhere\". The strategic addition is the intrinsic joyful affect, desire for the activity for its own sake (19.5).\n4. Employees went over to the master-desire reluctantly, or thinking of something else; \"consenting\", they will be \"moved otherwise. Otherwise meaning more intensely\" (19.5). The neoliberal project is a project of re-enchantment: re-internalising the objects of desire within wage activity (21.1). ∎\n\n## Scholium\n\nThe chapter opens on a paradox: \"And contradictorily the tyrant would like to be loved!\" (19.1), which follows on from the end of chapter 1 (T019).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D15", "T015", "T020"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D15", "T015", "T020"], "mentions": ["D15", "T015", "T019", "T020"], "corollaires": [], "mtime": 1794571243.7075362}, {"id": "T022", "file": "theses/T022.md", "type": "these", "partie": "2", "titre": "Le consentement et l'aliénation n'existent pas", "enonce": "Si consentir est l'expression d'une intériorité librement autodéterminée, le consentement n'existe pas, car rien n'agit par soi seul : toute chose est en partie déterminée à agir par des choses extérieures. L'aliénation sombre avec lui : n'étant que l'hétérodétermination, elle est partout. Tous les désirs sont égaux sous le rapport de la détermination ; le refus de consentir aux consentements des autres vient de nos affects.", "titre_en": "Consent and alienation do not exist", "enonce_en": "If consenting is the expression of a freely self-determined inner self, consent does not exist, for nothing acts by itself alone: everything is partly determined to act by external things. Alienation sinks with it: being only heterodetermination, it is everywhere. All desires are equal from the point of view of determination; the refusal to consent to others' consents comes from our affects.", "citation": "« Détermination par le dehors, l’aliénation est elle-même sans dehors »", "loc": ["20.1", "20.3", "20.4", "20.5", "20.6", "28.3"], "depends_on": ["S10", "S11", "S12", "T008", "S13", "S14"], "contre": ["R06", "R07"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La sociologie du travail constate que les salariés « marchent d'eux-mêmes » et parle d'une nouvelle « servitude volontaire » à laquelle les asservis *consentent* (20.1). Le consentement compris comme approbation d'une volonté libre (R06) bute sur les consentements que nous refusons de valider (20.3).\n2. Par S12, toute chose est sous l'empire de la causalité inadéquate ; par S11, rien n'est déterminé à agir sans une cause extérieure. Aucune action n'est *entièrement* sienne : le consentement, compris comme approbation inconditionnée d'un sujet auto-fondé, n'existe pas (20.4).\n3. Par S10, la croyance en notre liberté naît de la conscience de nos actes jointe à l'ignorance de leurs causes. Nous sommes auto-mobiles en un sens faible, puisque c'est notre énergie qui s'active ; mais hétérodéterminés (20.4).\n4. Par T008, aucun désir n'est mon fait par sa détermination, et tout désir est mien comme expression de ma puissance. L'aliénation (R07) n'est alors qu'un autre nom de la servitude passionnelle : universelle, elle « n'existe pas » comme l'autre d'un introuvable état d'intégrité du sujet (20.5).\n5. Tous les désirs sont donc égaux sous le rapport de l'exodétermination. Le jugement d'aliénation vient de l'ambition (S13), qui veut que les autres vivent selon notre complexion, et de nos amours et haines, qui valorisent les choses (S14) (20.6). ∎\n\n## Scolie\n\nSpinoza va très loin dans le renoncement à trier : qui vivrait plus commodément au gibet qu'à sa table serait insensé de ne pas se pendre (lettre à Blyenbergh, note 53) ; et « je laisse chacun vivre selon sa complexion » (lettre à Oldenburg, note 54) (20.6). Le raisonnement se conclut en 28.3 : « Il n'y a pas plus de consentement qu'il n'y a de servitude volontaire : il n'y a que des assujettissements heureux » (T025).", "body_en": "## Demonstration\n\n1. The sociology of work observes that employees \"run by themselves\" and speaks of a new \"voluntary servitude\" to which the enslaved *consent* (20.1). Consent understood as the approval of a free will (R06) runs up against the consents we refuse to validate (20.3).\n2. By S12, every thing is under the sway of inadequate causality; by S11, nothing is determined to act without an external cause. No action is *entirely* one's own: consent, understood as the unconditioned approval of a self-founded subject, does not exist (20.4).\n3. By S10, the belief in our freedom arises from consciousness of our acts together with ignorance of their causes. We are self-moving in a weak sense, since it is our energy that is active; but heterodetermined (20.4).\n4. By T008, no desire is my doing as to its determination, and every desire is mine as an expression of my power. Alienation (R07) is then only another name for passional servitude: universal, it \"does not exist\" as the other of an unfindable state of integrity of the subject (20.5).\n5. All desires are therefore equal from the point of view of exodetermination. The judgement of alienation comes from ambition (S13), which wants others to live according to our complexion, and from our loves and hatreds, which make us value things (S14) (20.6). ∎\n\n## Scholium\n\nSpinoza goes very far in renouncing sorting: whoever would live more comfortably on the gallows than at his table would be mad not to hang himself (letter to Blyenbergh, note 53); and \"I let everyone live according to his complexion\" (letter to Oldenburg, note 54) (20.6). The reasoning concludes in 28.3: \"There is no more consent than there is voluntary servitude: there are only happy subjections\" (T025).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "mentions": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008", "T025"], "corollaires": [], "mtime": 1794571243.7075362}, {"id": "T023", "file": "theses/T023.md", "type": "these", "partie": "2", "titre": "Le pouvoir est un art d'affecter", "enonce": "Le pouvoir est un art de faire faire ; or faire faire est l'effet même des affects, puisqu'un affect redirige le conatus et fait naître le désir de faire quelque chose. Gouverner, c'est orienter les conatus dans certaines directions : le pouvoir est l'ensemble des pratiques de la colinéarisation.", "titre_en": "Power is an art of affecting", "enonce_en": "Power is an art of having others do; and having others do is the very effect of the affects, since an affect redirects the conatus and gives rise to the desire to do something. Governing is orienting conatuses in certain directions: power is the set of practices of collinearisation.", "citation": "« Le pouvoir est l’ensemble des pratiques de la colinéarisation. »", "loc": ["20.2", "21.2"], "depends_on": ["T008", "D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le pouvoir, envisagé avec Foucault comme « action sur des actions », est un *art de faire faire* (20.2, 21.2).\n2. Par T008, une affection produit en moi un affect, et par suite me fait faire quelque chose : d'un affect résultent une redirection du conatus et le désir d'agir (21.2).\n3. Donc le pouvoir, dans son mode opératoire, est production d'affects et induction par voie d'affects ; gouverner, c'est diriger au sens géométrique, orienter les conatus-vecteurs (D11) (21.2). ∎\n\n## Scolie\n\nLa philosophie politique de Spinoza se révèle ainsi philosophie des pouvoirs et des normes de toutes les institutions, et pas seulement de la Cité : les salariés sont sous l'empire de l'entreprise comme les citoyens sous celui de l'État (21.2).", "body_en": "## Demonstration\n\n1. Power, seen with Foucault as \"action upon actions\", is an *art of having others do* (20.2, 21.2).\n2. By T008, an affection produces an affect in me, and thereby makes me do something: from an affect result a redirection of the conatus and the desire to act (21.2).\n3. So power, in its mode of operation, is the production of affects and induction by way of affects; governing is directing in the geometrical sense, orienting conatus-vectors (D11) (21.2). ∎\n\n## Scholium\n\nSpinoza's political philosophy thus turns out to be a philosophy of the powers and norms of all institutions, and not only of the Commonwealth: employees are under the rule of the firm as citizens are under that of the State (21.2).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D11", "T008"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D11", "T008"], "mentions": ["D11", "T008"], "corollaires": [], "mtime": 1794571243.7075362}, {"id": "T024", "file": "theses/T024.md", "type": "these", "partie": "2", "titre": "Le pouvoir règne mieux par l'amour : l'obéissance joyeuse", "enonce": "Tout pouvoir, y compris patronal, fonctionne à la crainte ou à l'amour, et découvre qu'il est plus efficace de régner par l'amour. Réjouir l'assujetti en lui proposant des désirs qu'il prend pour les siens, et qui deviennent les siens, le met en mouvement sans réserve : le consentement a pour vrai nom l'obéissance heureuse.", "titre_en": "Power reigns better through love: joyful obedience", "enonce_en": "Every power, including the employer's, runs on fear or on love, and discovers that it is more effective to reign through love. Gladdening the subject by offering him desires he takes for his own, and which become his own, sets him moving without reserve: the true name of consent is happy obedience.", "citation": "« l’univers sucré du consentement, dont le vrai nom est l’obéissance heureuse »", "loc": ["21.3", "21.4"], "depends_on": ["T023", "D16", "S16", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T023, le pouvoir procède par affects ; par D16, l'obsequium a deux formules pures, la crainte et l'amour : c'est vrai de tous les pouvoirs, y compris le pouvoir patronal (21.3).\n2. Par S16, les hommes aspirent à une vie humaine ; or la reproduction de la vie nue, à laquelle le salaire pourvoit (T006), ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon à la puissance d'agir (21.3).\n3. Réjouir l'assujetti en organisant ce déploiement, mais dans les directions du désir-maître, est donc la stratégie efficace : l'assujetti se met en mouvement sans réserve quand on lui propose des désirs qu'il prend pour les siens (21.3).\n4. Obéir est pourtant un fardeau, car les hommes n'aiment pas être sous la coupe de leurs égaux ; l'individualisme ayant ruiné la sacralisation des rois, les patrons doivent trouver d'autres procédés pour produire de l'obéissance sans fardeau (21.4). ∎", "body_en": "## Argument\n\n1. By T023, power proceeds through affects; by D16, obsequium has two pure formulas, fear and love: this is true of all powers, including the employer's (21.3).\n2. By S16, men aspire to a human life; but the reproduction of bare life, which the wage provides for (T006), hardly goes beyond \"the circulation of the blood\" and offers no horizon to the power of acting (21.3).\n3. Gladdening the subject by organising this unfolding, but in the directions of the master-desire, is therefore the effective strategy: the subject sets himself moving without reserve when offered desires he takes for his own (21.3).\n4. Obeying is nonetheless a burden, for men do not like being under the thumb of their equals; individualism having ruined the sacralisation of kings, bosses must find other procedures to produce obedience without burden (21.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D16", "S16", "T006", "T023"], "sections": ["Argumentation"], "demo_refs": ["D16", "S16", "T006", "T023"], "mentions": ["D16", "S16", "T006", "T023"], "corollaires": [], "mtime": 1794571243.7075362}, {"id": "T025", "file": "theses/T025.md", "type": "these", "partie": "2", "titre": "Contrainte et consentement ne sont que des affects tristes ou joyeux", "enonce": "Contrainte et consentement ne se distinguent ni par la liberté ni par la topologie (l'extérieur contre l'intérieur), mais par les affects : être contraint, c'est être déterminé à faire quelque chose en s'en trouvant triste ; consentir, c'est vivre l'obéissance allégée par un affect joyeux. Il n'y a pas d'intériorité ; il n'y a que des assujettissements heureux ou tristes.", "titre_en": "Constraint and consent are only sad or joyful affects", "enonce_en": "Constraint and consent are distinguished neither by freedom nor by topology (the outside against the inside), but by the affects: to be constrained is to be determined to do something while being saddened by it; to consent is to live obedience lightened by a joyful affect. There is no interiority; there are only happy or sad subjections.", "citation": "« Le consentant n’est pas plus libre que quiconque, et pas moins “plié” que l’asservi : il est juste plié différemment et vit joyeusement sa détermination. »", "loc": ["21.4", "28.1", "28.2", "28.3"], "depends_on": ["T022", "T024", "S20", "S21"], "contre": ["R08", "R09"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T022, tous sont également asservis à leurs passions ; mais « enchaîné content ou enchaîné triste, ça n'est pas la même chose » (21.4).\n2. « Contrainte » et « consentement » sont donc les noms que prennent la tristesse et la joie dans des situations de pouvoir (T024). Ils ne désignent pas deux opérations objectives (R09) : le fait objectif est la détermination causale, et l'on n'est pas moins déterminé quand on consent (21.4).\n3. Le consentement veut toujours retourner au « noyau » intérieur du sujet (R08) (28.1). Or, par S21, l'âme et le corps sont une seule chose sous deux attributs, sans action de l'un sur l'autre ; par S20, les affects sont des affections du corps *et* leurs idées ; ces idées, relevant de la Pensée, sont sans lieu, et nos états d'âme ne sauraient être dits « intérieurs » (28.2).\n4. Consentement et intériorité sont donc solidairement vides de sens, comme les antinomies de la coercition et de la légitimité, du *hard* et du *soft power* ; leur différence vraie se ramène à la polarité du joyeux et du triste (28.3). ∎\n\n## Scolie\n\nLe mot « joug » dit les deux : « je suis sous le joug » et « je suis subjugué » (28.3). Si Spinoza refait les noms des affects, c'est pour ne pas se laisser prendre aux mots de la connaissance du premier genre, formée au voisinage des affects (21.4, notes 60-62).", "body_en": "## Demonstration\n\n1. By T022, all are equally enslaved to their passions; but to be chained and content or chained and sad \"is not the same thing\" (21.4).\n2. \"Constraint\" and \"consent\" are therefore the names that sadness and joy take in situations of power (T024). They do not designate two objective operations (R09): the objective fact is causal determination, and one is no less determined when one consents (21.4).\n3. Consent always wants to return to the subject's inner \"core\" (R08) (28.1). But, by S21, mind and body are one thing under two attributes, with no action of one on the other; by S20, affects are affections of the body *and* their ideas; these ideas, belonging to Thought, are without place, and our states of mind cannot be called \"inner\" (28.2).\n4. Consent and interiority are therefore jointly void of meaning, like the antinomies of coercion and legitimacy, of *hard* and *soft power*; their true difference comes down to the polarity of joyful and sad (28.3). ∎\n\n## Scholium\n\nThe French word *joug*, yoke, says both: \"I am under the yoke\" and \"I am subjugated\" (28.3). If Spinoza remakes the names of the affects, it is so as not to be caught by the words of knowledge of the first kind, formed in the vicinity of the affects (21.4, notes 60-62).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R08", "R09", "S20", "S21", "T022", "T024"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R08", "R09", "S20", "S21", "T022", "T024"], "mentions": ["R08", "R09", "S20", "S21", "T022", "T024"], "corollaires": [], "mtime": 1794571301.2872295}, {"id": "T026", "file": "theses/T026.md", "type": "these", "partie": "2", "titre": "Le ré-enchantement spontané du travail", "enonce": "Le désir étant axiogène et le conatus cherchant sa joie, le salarié peut lui-même recolorer sa situation et retrouver de l'intérêt et du sens dans des tâches imposées. Face à la menace du travail vide de sens, il n'a que deux parades : s'avouer sa déréliction (et se résigner ou se révolter), ou la repousser en recréant un désir propre, aligné mais distinct du désir-maître.", "titre_en": "The spontaneous re-enchantment of work", "enonce_en": "Since desire is axiogenic and the conatus seeks its joy, the employee can himself recolour his situation and find interest and meaning again in imposed tasks. Faced with the threat of meaningless work, he has only two defences: to admit his dereliction to himself (and resign himself or rebel), or to push it back by recreating a desire of his own, aligned with but distinct from the master-desire.", "citation": "", "loc": ["22.1", "22.2", "22.4", "22.5", "22.8"], "depends_on": ["D17", "S17", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Les affects qui allègent l'obéissance viennent d'abord du salarié lui-même (22.1) : par D17, aucune situation n'impose par elle-même une valeur ou un sens ; ils sont produits par les forces désirantes qui s'en saisissent (22.2).\n2. La tâche imposée entre le plus probablement dans la complexion de l'enrôlé comme chose attristante. Mais, par S17, le conatus cherche sa joie, et peut réinvestir les situations les plus défavorables (22.4).\n3. L'enrôleur capitalise sur cette propension : l'indifférence aux contenus du « travail abstrait », identifiée par la critique marxiste, est une tendance très puissante, mais pas irrésistible (22.5).\n4. Contre la menace de dépenser sa puissance d'agir en pure perte au service d'un désir étranger, il n'y a que deux parades. Ou bien le sujet se l'avoue : il se résigne (« la vraie vie est ailleurs »), voire déprime, ou bien il se révolte, la tristesse augmentant la puissance d'agir qui lutte contre elle (S09). Ou bien il recrée un désir propre, aligné mais distinct du désir-maître, sous l'effet d'un métadésir de vivre joyeux (22.8). ∎\n\n## Scolie\n\nCôté capital, les industriels s'attachent aussi à leur « faire » particulier, avec des identités vocationnelles (identité de « bâtisseur », d'agent historique du progrès technique), alors que le capital financier, détaché de tout contenu par la diversification et la liquidité, ne peut former aucun autre désir que celui du rendement (22.6-22.7). Cas limite du conatus qui cherche sa joie : Elias, que Primo Levi décrit à Auschwitz comme « vraisemblablement un homme heureux » (22.4).", "body_en": "## Argument\n\n1. The affects that lighten obedience come first from the employee himself (22.1): by D17, no situation imposes a value or a meaning by itself; they are produced by the desiring forces that take hold of it (22.2).\n2. The imposed task most probably enters the complexion of the enlisted as a saddening thing. But, by S17, the conatus seeks its joy, and can reinvest the most unfavourable situations (22.4).\n3. The enlister capitalises on this propensity: indifference to the contents of \"abstract labour\", identified by Marxist critique, is a very powerful tendency, but not an irresistible one (22.5).\n4. Against the threat of spending one's power of acting for nothing in the service of an alien desire, there are only two defences. Either the subject admits it to himself: he resigns himself (\"real life is elsewhere\"), even falls into depression, or he rebels, sadness increasing the power of acting that fights against it (S09). Or he recreates a desire of his own, aligned with but distinct from the master-desire, under the effect of a meta-desire to live joyfully (22.8). ∎\n\n## Scholium\n\nOn the side of capital, industrialists also become attached to their particular \"making\", with vocational identities (the identity of \"builder\", of historical agent of technical progress), whereas financial capital, detached from all content by diversification and liquidity, can form no desire other than for returns (22.6-22.7). A limit case of the conatus seeking its joy: Elias, whom Primo Levi describes at Auschwitz as \"probably a happy man\" (22.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D17", "S09", "S17"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D17", "S09", "S17"], "mentions": ["D17", "S09", "S17"], "corollaires": [], "mtime": 1794571301.2872295}, {"id": "T027", "file": "theses/T027.md", "type": "these", "partie": "2", "titre": "L'amour du maître", "enonce": "Les affects d'obéissance viennent surtout du dehors, notamment de l'amour du maître : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui. Ce mécanisme général de la demande de reconnaissance fait épouser au subordonné le désir du supérieur, le long de chaînes de dépendance qui sont aussi des chaînes de reconnaissance. Ce désir est pleinement le sien : rien d'« étranger » là-dedans.", "titre_en": "Love of the master", "enonce_en": "The affects of obedience come above all from outside, notably from love of the master: I do what gladdens the master so that he loves me and so that I rejoice in having gladdened him. This general mechanism of the demand for recognition makes the subordinate espouse the desire of the superior, along chains of dependence that are also chains of recognition. This desire is fully his own: nothing \"alien\" in it.", "citation": "", "loc": ["23.1", "23.2", "23.3"], "depends_on": ["S18", "S19", "S09", "T011", "T022"], "contre": ["R10"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par S18, l'amour est une joie accompagnée de l'idée d'une cause extérieure : j'obéis au maître parce qu'il est la cause imaginée de bienfaits qui me réjouissent (23.1).\n2. Par S19, je m'efforce de faire ce qui le réjouit, et je me réjouis de m'imaginer cause de sa joie : premier affect d'en être aimé, second de s'aimer soi-même. Le « maître » peut être le gourou, le parent, le professeur, le patron, l'opinion publique (23.1).\n3. Ce mécanisme est inscrit dans le conatus comme effort vers la joie ; il n'a pas besoin d'être une sublimation de l'amour parental (R10), qui n'en est que le premier point d'application (23.2).\n4. Dans l'entreprise, il conduit le demandeur à épouser et anticiper le désir de l'offreur ; par T011, il s'inscrit dans la structure hiérarchique, les chaînes de dépendance étant *aussi* des chaînes de dépendance à la reconnaissance (23.3).\n5. Par S09, l'homme affecté de joie désire la conserver : le salarié s'active joyeusement à servir un désir qui devient intégralement le sien. Par T022, ce désir n'est pas « étranger » à un noyau autonome qui n'existe pas ; la seule aliénation est la servitude passionnelle universelle (23.3). ∎\n\n## Scolie\n\nL'élargissement de la revendication salariale de l'argent à la reconnaissance, thème central de la sociologie du travail, est ainsi « obtenir la joie de la joie de celui à qui on apporte son travail, et partant son amour » (23.1). L'empressé, le fayot, l'obséquieux (« parangon bien nommé de l'*obsequium* ») cherchent aussi la joie d'être aimés du supérieur et de l'institution (23.3).", "body_en": "## Demonstration\n\n1. By S18, love is a joy accompanied by the idea of an external cause: I obey the master because he is the imagined cause of benefits that gladden me (23.1).\n2. By S19, I strive to do what gladdens him, and I rejoice in imagining myself the cause of his joy: first the affect of being loved by him, second that of loving oneself. The \"master\" can be the guru, the parent, the teacher, the boss, public opinion (23.1).\n3. This mechanism is inscribed in the conatus as a striving towards joy; it need not be a sublimation of parental love (R10), which is only its first point of application (23.2).\n4. In the firm, it leads the one who asks to espouse and anticipate the desire of the one who gives; by T011, it is inscribed in the hierarchical structure, the chains of dependence being *also* chains of dependence on recognition (23.3).\n5. By S09, a man affected with joy desires to preserve it: the employee busies himself joyfully serving a desire that becomes entirely his own. By T022, this desire is not \"alien\" to an autonomous core that does not exist; the only alienation is universal passional servitude (23.3). ∎\n\n## Scholium\n\nThe broadening of wage demands from money to recognition, a central theme of the sociology of work, thus means \"obtaining the joy of the joy of the one to whom one brings one's work, and hence his love\" (23.1). The eager beaver, the teacher's pet, the obsequious (\"aptly named paragon of *obsequium*\") also seek the joy of being loved by the superior and by the institution (23.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R10", "S09", "S18", "S19", "T011", "T022"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R10", "S09", "S18", "S19", "T011", "T022"], "mentions": ["R10", "S09", "S18", "S19", "T011", "T022"], "corollaires": [], "mtime": 1794571301.292259}, {"id": "T028", "file": "theses/T028.md", "type": "these", "partie": "2", "titre": "Les images vocationnelles font désirer l'enrôlement", "enonce": "Hors de tout maître particulier, la société produit, par l'imitation socialement médiée des désirs, des images vocationnelles qui disposent les individus à désirer l'enrôlement. Plus ces déterminations sont diffuses, plus elles sont oubliées : l'individu tient ce désir venu du dehors pour « son choix », et, quand un emploi lui correspond, il « se réalise » et se meut joyeusement.", "titre_en": "Vocational images make people desire enlistment", "enonce_en": "Apart from any particular master, society produces, through the socially mediated imitation of desires, vocational images that dispose individuals to desire enlistment. The more diffuse these determinations, the more they are forgotten: the individual takes this desire from outside for \"his choice\", and, when a job matches it, he \"fulfils himself\" and moves joyfully.", "citation": "", "loc": ["24.1", "24.2", "24.3", "24.4"], "depends_on": ["S05", "S06", "S10", "D18"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Désir sans objet, le conatus trouve ses objets dans le monde social, par association (S05) et surtout par imitation (S06) (24.1).\n2. L'imitation n'est jamais purement interpersonnelle : imiter quelqu'un, c'est déjà imiter un homme ou une femme, un riche ou un pauvre, un jeune ou un vieux, parfois un prescripteur doté de capital symbolique, et chacune de ces qualités, où s'expriment des rapports sociaux, module l'imitation. « Toute la société est à l'œuvre dans la moindre imitation de désir » (24.2).\n3. Par S10, la conscience du désir ne s'étend pas à ses causes ; à plus forte raison quand elles sont aussi diffuses et étirées. L'individu dit que c'est « son choix », sa vocation de toujours (aimer la vente « pour le contact », l'audit « pour le goût de la rigueur », l'aéronautique, le génie civil) (24.3).\n4. Ces désirs induits, devenus authentiquement intérieurs, déterminent des engagements joyeux quand un emploi les satisfait : l'individu « se réalise », il « consent » (24.3).\n5. Par D18, la société entière, par l'éducation et l'orientation, produit ainsi les images qui pré-colinéarisent les individus ; mais ce procès sans sujet n'est pas gouvernable et produit aussi des fuyards (24.4). ∎", "body_en": "## Argument\n\n1. A desire without an object, the conatus finds its objects in the social world, through association (S05) and above all through imitation (S06) (24.1).\n2. Imitation is never purely interpersonal: to imitate someone is already to imitate a man or a woman, a rich or a poor person, a young or an old one, sometimes a trendsetter endowed with symbolic capital, and each of these qualities, in which social relations are expressed, modulates imitation. \"The whole of society is at work in the least imitation of desire\" (24.2).\n3. By S10, consciousness of desire does not extend to its causes; all the more so when they are so diffuse and drawn out. The individual says it is \"his choice\", his lifelong vocation (loving sales \"for the human contact\", auditing \"for the taste of rigour\", aeronautics, civil engineering) (24.3).\n4. These induced desires, become authentically inner, determine joyful commitments when a job satisfies them: the individual \"fulfils himself\", he \"consents\" (24.3).\n5. By D18, the whole of society, through education and career guidance, thus produces the images that precollinearise individuals; but this process without a subject cannot be governed and also produces runaways (24.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D18", "S05", "S06", "S10"], "sections": ["Argumentation"], "demo_refs": ["D18", "S05", "S06", "S10"], "mentions": ["D18", "S05", "S06", "S10"], "corollaires": [], "mtime": 1794571301.292259}, {"id": "T029", "file": "theses/T029.md", "type": "these", "partie": "2", "titre": "Le totalitarisme de la possession des âmes", "enonce": "La précolinéarisation ne suffisant pas, l'entreprise néolibérale veut annuler α : investir totalement les salariés, refaire leurs désirs, leurs dispositions, leurs manières, jusqu'à leurs émotions, qui doivent être non plus jouées mais « authentiquement » éprouvées. C'est une visée totalitaire, celle d'une possession intégrale des individus.", "titre_en": "The totalitarianism of possessing souls", "enonce_en": "Since precollinearisation does not suffice, the neoliberal firm wants to cancel α: to invest employees totally, to remake their desires, their dispositions, their manners, down to their emotions, which must no longer be acted but \"authentically\" felt. It is a totalitarian aim, that of a complete possession of individuals.", "citation": "« Le capital néolibéral est le monde de la girl friend experience. »", "loc": ["25.1", "25.3", "25.4", "26.1", "26.2", "26.3"], "depends_on": ["T015", "T021", "T028"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T028, la précolinéarisation par la société est loin d'être parfaite ; par T015, la simple réduction de α ne suffit plus : l'entreprise néolibérale veut α = 0 (25.1).\n2. Par T021, elle entreprend de faire *épouser* son désir, au sens le plus exigeant. C'est un totalitarisme, non au sens classique, mais comme visée de subordination et d'investissement *total* : les salariés doivent « s'investir totalement » et sont totalement investis, envahis (25.3).\n3. Elle ne se contente plus d'obtenir des actions mais revendique la soumission de l'« intériorité » : la pleine coïncidence de l'individu et d'elle-même sous le critère du désir (25.3). Les cadres dirigeants y sont déjà alignés ; les autres seront « recolinéarisés » par les programmes de ressources humaines (25.4).\n4. Dans les services, la performance est affective. Des salariés indiens doivent adopter une identité américaine (accent, actualités, prénom) ; la *reductio ad utensilium* dit la vérité du rapport salarial (26.1).\n5. Pire : les émotions prescrites doivent être « authentiquement » éprouvées, comme l'Église demandait l'attrition et non plus la seule contrition. Le capitalisme néolibéral étend à tous les salariés le « don des larmes » des virtuoses, au prix du *double bind* de la spontanéité sur commande (26.2-26.3). ∎\n\n## Scolie\n\nLe documentaire de Jean-Robert Viallet (*La mise à mort du travail*, note 77) montre une plateforme téléphonique où l'on contrôle le chronométrage et les intonations, et un séminaire où des cadres rient sur commande ; l'animateur finit par quitter l'entreprise pour « une vie nouvelle » (25.4). Le « sourire doit être “vrai”, “naturel”, venir du “fond du cœur” » (26.3, note 82).", "body_en": "## Argument\n\n1. By T028, precollinearisation by society is far from perfect; by T015, merely reducing α no longer suffices: the neoliberal firm wants α = 0 (25.1).\n2. By T021, it sets out to have its desire *espoused*, in the most demanding sense. This is a totalitarianism, not in the classical sense, but as an aim of *total* subordination and investment: employees must \"invest themselves totally\" and are totally invested, invaded (25.3).\n3. It is no longer content to obtain actions but claims the submission of \"interiority\": the full coincidence of the individual with itself under the criterion of desire (25.3). Senior executives are already aligned; the others will be \"recollinearised\" by human resources programmes (25.4).\n4. In services, performance is affective. Indian employees must adopt an American identity (accent, current affairs, first name); the *reductio ad utensilium* tells the truth of the wage relation (26.1).\n5. Worse: the prescribed emotions must be \"authentically\" felt, as the Church came to demand attrition and no longer contrition alone. Neoliberal capitalism extends to all employees the virtuosos' \"gift of tears\", at the price of the *double bind* of spontaneity on command (26.2-26.3). ∎\n\n## Scholium\n\nJean-Robert Viallet's documentary (*La mise à mort du travail*, note 77) shows a call centre where timing and intonation are monitored, and a seminar where managers laugh on command; the facilitator ends up leaving the firm for \"a new life\" (25.4). The \"smile must be 'true', 'natural', come 'from the bottom of the heart'\" (26.3, note 82).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T015", "T021", "T028"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T015", "T021", "T028"], "mentions": ["T015", "T021", "T028"], "corollaires": [], "mtime": 1794571301.292259}, {"id": "T030", "file": "theses/T030.md", "type": "these", "partie": "2", "titre": "L'insondable mystère du désir enrôlé", "enonce": "Acheter une force de travail ne garantit pas sa mobilisation. Le désir étant devenu le premier réquisit, le recrutement cherche à sonder les dispositions plutôt que les compétences ; mais la complexion désirante est opaque, et cette enquête impossible voue les pratiques de recrutement à l'irrationalité. Il reste à l'entreprise à produire elle-même les désirs conformes.", "titre_en": "The unfathomable mystery of enlisted desire", "enonce_en": "Buying a labour power does not guarantee its mobilisation. Desire having become the first requirement, recruitment tries to probe dispositions rather than skills; but the desiring complexion is opaque, and this impossible inquiry dooms recruitment practices to irrationality. It remains for the firm to produce the conforming desires itself.", "citation": "", "loc": ["27.1", "27.2", "27.3"], "depends_on": ["M04", "T029"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. L'autre face de l'utopie néolibérale est celle d'une communauté d'individus *identiquement* désirants ; mais peut-on croire le candidat qui jure n'avoir d'autre passion que les yaourts de l'entreprise ? Par M04, l'achat de la force de travail ne garantit pas sa conversion en travail (27.1).\n2. Les compétences techniques sont devenues secondaires : sans désir moteur, à quoi serviraient-elles ? Le désir occupe la place hiérarchiquement supérieure parmi les réquisits, mais oppose « son irréductible opacité » (27.1-27.2).\n3. Les emplois définis par objectifs appellent des sélections par compétences comportementales génériques, infiniment moins rationalisables que les compétences techniques ; d'où les jeux de rôle, les questionnements inquisitoriaux, la graphologie, jusqu'à la numérologie (27.3).\n4. La vérification du degré de précolinéarisation rencontrant une limite insurmontable, l'entreprise doit parfaire elle-même l'alignement (T029) (27.3). ∎\n\n## Scolie\n\nLes lettres de non-motivation de Julien Prévieux (note 83) parodient la « déclaration préalable d'intérêt » ; la réponse automatique de l'entreprise, qui n'y voit que du feu, élève la stéréotypie au carré (27.2). Nous ne vivons pas dans une économie capitaliste mais dans la *société* capitaliste (27.2).", "body_en": "## Argument\n\n1. The other face of the neoliberal utopia is that of a community of *identically* desiring individuals; but can one believe the candidate who swears he has no other passion than the firm's yoghurts? By M04, buying labour power does not guarantee its conversion into labour (27.1).\n2. Technical skills have become secondary: without a driving desire, what use would they be? Desire occupies the hierarchically highest place among the requirements, but opposes \"its irreducible opacity\" (27.1-27.2).\n3. Jobs defined by objectives call for selection by generic behavioural skills, infinitely less rationalisable than technical skills; hence role plays, inquisitorial questioning, graphology, even numerology (27.3).\n4. Checking the degree of precollinearisation meeting an insurmountable limit, the firm must perfect the alignment itself (T029) (27.3). ∎\n\n## Scholium\n\nJulien Prévieux's letters of non-motivation (note 83) parody the \"prior declaration of interest\"; the firm's automatic reply, which notices nothing, squares the stereotypy (27.2). We do not live in a capitalist economy but in capitalist *society* (27.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["M04", "T029"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["M04", "T029"], "mentions": ["M04", "T029"], "corollaires": [], "mtime": 1794571301.292259}, {"id": "T031", "file": "theses/T031.md", "type": "these", "partie": "2", "titre": "La joie fait oublier l'hétéronomie", "enonce": "Les affects joyeux ne portent pas à penser : la pensée naît plutôt d'une rencontre contrariante. L'oubli de l'exodétermination est donc plus profond quand on est mû par la joie, et les dirigeants, pas moins déterminés que les autres, vivent leur désir comme souverain. Ce sont plutôt les commandements d'un autre qu'on hait qui font entrevoir le pliage par le dehors ; et la révolte n'est alors que la substitution d'une détermination à une autre.", "titre_en": "Joy makes one forget heteronomy", "enonce_en": "Joyful affects do not prompt thought: thought arises rather from a thwarting encounter. Forgetting exodetermination is therefore deeper when one is moved by joy, and executives, no less determined than others, live their desire as sovereign. It is rather the commands of another whom one hates that give a glimpse of being bent from outside; and revolt is then only the substitution of one determination for another.", "citation": "« la félicité est peu questionneuse »", "loc": ["28.4", "29.1", "29.2"], "depends_on": ["T025", "T008", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T025, consentir, c'est vivre joyeusement sa détermination. Or, comme le dit Deleuze, c'est « la violence d'un signe » qui force à chercher : la pensée naît plutôt d'un affect triste (28.4).\n2. Par T008, le désir n'est jamais *de* soi tout en étant toujours *à* soi ; sous affects joyeux, le « pas de soi » est rejeté dans l'oubli et seul reste le « à soi ». Les dirigeants ne vont pas au travail moins aliénés que leurs subordonnés : ils se meuvent seulement sous des affects d'espoir assez puissants pour vivre
