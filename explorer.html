<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capitalisme, désir et servitude — treillis</title>
<meta name="description" content="Le livre de Frédéric Lordon (2010) reconstruit dans l'ordre géométrique : prémisses de Spinoza et de Marx, concepts, thèses, positions réfutées. Frédéric Lordon's Willing Slaves of Capital, reconstructed in geometrical order.">
<meta name="author" content="mqtin">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Treillis">
<meta property="og:title" content="Capitalisme, désir et servitude — treillis">
<meta property="og:description" content="Le livre de Frédéric Lordon reconstruit dans l'ordre géométrique, en graphe explorable. Frédéric Lordon's book, reconstructed in geometrical order as an explorable graph.">
<meta property="og:url" content="https://treillis.qpetit.com/lordon/">
<meta property="og:locale" content="fr_FR">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:locale:alternate" content="de_DE">
<link rel="canonical" href="https://treillis.qpetit.com/lordon/">
<link rel="alternate" hreflang="fr" href="https://treillis.qpetit.com/lordon/?lang=fr">
<link rel="alternate" hreflang="en" href="https://treillis.qpetit.com/lordon/?lang=en">
<link rel="alternate" hreflang="de" href="https://treillis.qpetit.com/lordon/?lang=de">
<link rel="alternate" hreflang="x-default" href="https://treillis.qpetit.com/lordon/">
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2ded5;
  --accent: #2f5d8a; --hl: #fff3c4;
  --definition: #3b6ea8; --spinoza: #6b5bb0; --marx: #2f8a5b; --these: #c0702a; --refutee: #b83a3a; --manquant: #9b9b9b;
  --ok: #2f8a5b; --warn: #b7791f; --err: #b83a3a;
  --band: rgba(0,0,0,.035); --gut: 30px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1f2023; --ink: #e8e6e1; --muted: #9a968d; --line: #33353a;
    --accent: #7fb0e0; --hl: #4a4220;
    --definition: #6d9fd6; --spinoza: #a294e0; --marx: #5fbf8b; --these: #e39a55; --refutee: #e07070; --manquant: #777;
    --band: rgba(255,255,255,.04);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

#app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.navbtn { border: 1px solid var(--line); background: none; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink); }
.navbtn:hover:not(:disabled) { background: var(--bg); }
.navbtn:disabled { opacity: .3; cursor: default; }
#nav { display: flex; gap: 4px; }
#trail { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font-size: 12px; flex: 1; }
#trail .step { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 4px; white-space: nowrap; color: var(--c, var(--muted)); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
#trail .step:hover { background: var(--bg); }
#trail .step.cur { background: var(--bg); outline: 1px solid var(--c, var(--line)); }
#trail .step.fwd { opacity: .45; }
#trail .step .tt { font-weight: 400; color: var(--muted); margin-left: 4px; }
#trail .arrow { color: var(--line); }
#trail .lbl { color: var(--muted); margin-right: 4px; white-space: nowrap; }
.seq { display: flex; gap: 6px; }
.seq a { font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; color: var(--muted); white-space: nowrap; }
.seq a:hover { color: var(--ink); border-color: var(--ink); }
.seq a.off { visibility: hidden; }

/* Barre latérale */
#side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#search { margin: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
#filters { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip.on { color: var(--ink); border-color: var(--ink); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#list { overflow: auto; flex: 1; padding: 4px 0 16px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 14px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--bg); border-left-color: var(--accent); }
.item .id { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.item .t { color: var(--ink); }
.item .snip { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .badge-err { color: var(--err); font-size: 11px; margin-left: 4px; }
mark { background: var(--hl); color: inherit; padding: 0 1px; }

/* Zone principale */
#main { display: grid; grid-template-columns: 1fr 6px var(--readerW, 44%); min-height: 0; min-width: 0; }
#main.reading { grid-template-columns: 0 0 1fr; }
#main.reading #graphwrap, #main.reading #resizer { display: none; }
#graphwrap { position: relative; min-width: 0; overflow: hidden; }
#graph { position: absolute; top: 0; bottom: 0; left: var(--gut); width: calc(100% - var(--gut)); height: 100%; display: block; cursor: grab; user-select: none; }
#graph.drag { cursor: grabbing; }
#toolbar { position: absolute; top: 10px; left: calc(var(--gut) + 10px); z-index: 3; display: flex; gap: 4px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
#toolbar button { border: 0; background: none; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--muted); }
#toolbar button:hover { background: var(--bg); color: var(--ink); }
#toolbar button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
#toolbar .sep { width: 1px; background: var(--line); margin: 2px 2px; }
#legend { position: absolute; bottom: 10px; left: calc(var(--gut) + 10px); z-index: 3; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - var(--gut) - 20px); }
#legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
#empty { position: absolute; inset: 0 0 0 var(--gut); display: none; align-items: center; justify-content: center; color: var(--muted); }
#resizer { cursor: col-resize; background: var(--line); opacity: .5; }
#resizer:hover { opacity: 1; }
#legend span.dash::before { height: 0; border-top: 2px dashed var(--c); background: none; vertical-align: 3px; }
/* Marge des parties (reprise de SpinozaGraph) : hors du graphe, ne recouvre jamais les nœuds */
#gutter { position: absolute; top: 0; bottom: 0; left: 0; width: var(--gut); background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; z-index: 2; }
.glabel { position: absolute; left: 3px; right: 3px; border-radius: 6px; background: var(--band); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.glabel:hover { border-color: var(--ink); }
.glabel span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; font-family: var(--serif); font-size: 12.5px; padding: 6px 0; }
.glabel b { font-weight: 700; }
.glabel i { color: var(--muted); }
.band { fill: var(--band); cursor: pointer; }
.band:hover { fill: var(--hl); fill-opacity: .25; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 6px 4px 0; }
.seg button { border: 0; border-right: 1px solid var(--line); background: none; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bg); color: var(--ink); font-weight: 600; }

/* Nœuds */
.node rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; }
.node .bar { fill: var(--c); stroke: none; }
.node text { fill: var(--ink); font-size: 12px; pointer-events: none; }
.node text.nid { font-weight: 700; fill: var(--c); }
.node { cursor: pointer; transition: opacity .15s; }
.node.missing rect { stroke-dasharray: 4 3; }
.node.st-brouillon rect { stroke-dasharray: none; }
.node.st-retire { opacity: .45; }
.node.sel rect { stroke-width: 3; fill: var(--hl); }
.node.dim { opacity: .18; }
.node .status { stroke: var(--panel); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .5; transition: opacity .15s; }
.edge.anc { stroke: var(--accent); stroke-width: 2.2; opacity: .95; }
.edge.desc { stroke: var(--these); stroke-width: 2.2; opacity: .95; }
.edge.dim { opacity: .07; }
.edge.missing { stroke-dasharray: 4 3; }
.edge.xpart { stroke-dasharray: 6 4; opacity: .35; }
.edge.contre { stroke: var(--refutee); stroke-dasharray: 2 4; stroke-width: 1.6; opacity: .7; }
.citation { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin: -10px 0 22px 19px; }
.citation .pg { font-style: normal; font-size: 12px; margin-left: 6px; }
#graph.m-all .edge.xpart:not(.anc):not(.desc) { display: none; }

/* Lecteur */
#reader { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); min-width: 0; }
#reader .inner { max-width: 760px; margin: 0 auto; padding: 24px 32px 80px; }
#reader .crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#reader .crumbs button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
#reader .crumbs button:hover { color: var(--ink); }
#reader h1.title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0 8px; line-height: 1.2; }
#reader h1.title .eid { color: var(--c); margin-right: 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.badge { font-size: 11px; border-radius: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--muted); }
.badge b { color: var(--ink); font-weight: 600; }
.badge.type { background: var(--c); color: #fff; border-color: var(--c); }
.enonce { font-family: var(--serif); font-size: 17px; line-height: 1.55; border-left: 3px solid var(--c); padding: 4px 0 4px 16px; margin: 0 0 22px; }
.rel { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 13px; padding: 14px 16px; background: var(--bg); border-radius: 8px; margin-bottom: 26px; }
.rel .k { color: var(--muted); }
.pill { display: inline-block; border: 1px solid var(--c, var(--line)); color: var(--c, var(--ink)); border-radius: 4px; padding: 0 6px; margin: 0 4px 4px 0; cursor: pointer; font-weight: 600; font-size: 12px; background: var(--panel); text-decoration: none; }
.pill:hover { background: var(--c); color: #fff; }
.pill.missing { --c: var(--err); border-style: dashed; }
.pill .pt { font-weight: 400; margin-left: 4px; }
.chain { margin: 0; padding: 0; list-style: none; }
.chain li { padding: 1px 0; }
.md { font-family: var(--serif); font-size: 16px; line-height: 1.65; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--sans); line-height: 1.3; }
.md h1 { font-size: 24px; }
.md h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.md h3 { font-size: 15px; margin: 22px 0 6px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.45; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-family: var(--sans); font-size: 13px; margin: 12px 0; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); }
.md blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md a.ref { font-family: var(--sans); font-size: .82em; font-weight: 700; text-decoration: none; border: 1px solid var(--c); color: var(--c); border-radius: 3px; padding: 0 4px; cursor: pointer; }
.md a.ref:hover { background: var(--c); color: #fff; }
.md .ref.missing { color: var(--err); border: 1px dashed var(--err); border-radius: 3px; padding: 0 4px; font-family: var(--sans); font-size: .82em; }
.sources { font-size: 13px; line-height: 1.5; padding-left: 0; list-style: none; }
.sources li { border-left: 3px solid var(--warn); padding: 6px 0 6px 12px; margin: 8px 0; }
.sources li.ok { border-left-color: var(--ok); }
.sources .flag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); }
.sources li.ok .flag { color: var(--ok); }
.sources .note { color: var(--muted); display: block; margin-top: 2px; }
.file { color: var(--muted); font-size: 12px; margin-top: 30px; font-family: ui-monospace, Consolas, monospace; }
.home h2 { font-family: var(--serif); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 16px 0 24px; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; border-top: 3px solid var(--c, var(--line)); }
.stat .n { font-size: 22px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; }
.audit h3 { font-size: 14px; margin: 22px 0 6px; display: flex; gap: 8px; align-items: center; }
.audit .count { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--bg); color: var(--muted); }
.audit .count.err { background: var(--err); color: #fff; }
.audit .count.warn { background: var(--warn); color: #fff; }
.audit .count.ok { background: var(--ok); color: #fff; }
.audit ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.alpha svg { width: 100%; max-width: 520px; display: block; margin: 8px auto 4px; }
.regimes table.grid { border-collapse: separate; border-spacing: 6px; width: 100%; margin: 10px 0 18px; }
.regimes .grid th { font: 600 12px/1.3 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px; }
.regimes .grid td { vertical-align: top; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); font-size: 14px; line-height: 1.5; width: 42%; }
.regimes .grid td.empty { color: var(--muted); font-style: italic; background: transparent; border-style: dashed; }
.regimes .grid td b { font-family: var(--serif); font-size: 16px; font-weight: 600; display: block; margin-bottom: 4px; }
.regimes .grid td.sad { border-left: 4px solid var(--refutee); }
.regimes .grid td.joy { border-left: 4px solid var(--these); }
.regimes ol.timeline { list-style: none; padding: 0; margin: 8px 0 18px; border-left: 2px solid var(--line); }
.regimes ol.timeline li { position: relative; padding: 2px 0 14px 18px; font-size: 14px; line-height: 1.55; }
.regimes ol.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); }
.regimes ol.timeline li b { font-family: var(--serif); font-size: 16px; }
.alpha svg text { fill: var(--ink); font-family: var(--serif); font-size: 15px; }
.alpha .ctl { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; flex-wrap: wrap; }
.alpha input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); }
.alpha .presets button { font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.alpha .read { font-family: var(--serif); font-size: 16px; border-left: 3px solid var(--accent); padding: 6px 0 6px 14px; margin: 12px 0; min-height: 3.2em; }
.alpha .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin-top: 4px; }
.alpha .bar > i { display: block; height: 100%; background: var(--these); }
.audit .hint { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
.langsw { display: flex; gap: 2px; }
.langsw button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 3px 7px; font-size: 12px; cursor: pointer; color: var(--muted); }
.langsw button.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.kbd { font-family: ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><i>Capitalisme, désir et servitude</i></h1>
    <div id="nav">
      <button class="navbtn" id="back" title="Précédent (Alt+←)">←</button>
      <button class="navbtn" id="fwd" title="Suivant (Alt+→)">→</button>
    </div>
    <div id="trail"></div>
    <span class="meta" id="meta"></span>
    <div class="langsw" role="group" aria-label="Langue / Language"><button data-lang="fr" title="Français">FR</button><button data-lang="en" title="English">EN</button><button data-lang="de" title="Deutsch">DE</button></div>
  </header>
  <aside id="side">
    <input id="search" type="search" placeholder="Rechercher (id, titre, texte) — touche /" autocomplete="off">
    <div id="filters"></div>
    <nav id="list"></nav>
  </aside>
  <section id="main">
    <div id="graphwrap">
      <div id="gutter"></div>
      <svg id="graph"><g id="viewport"><g id="bands"></g><g id="edges"></g><g id="nodes"></g></g></svg>
      <div id="toolbar">
        <button data-mode="all" class="on" title="Tout le graphe ; la sélection met en évidence ses appuis et ses conséquences">Tout</button>
        <button data-mode="anc" title="Seulement le chemin qui mène à l'élément sélectionné">Chemin vers</button>
        <button data-mode="desc" title="Seulement ce qui découle de l'élément sélectionné">Conséquences</button>
        <button data-mode="near" title="Voisins directs">Voisinage</button>
        <span class="sep"></span>
        <button id="fit" title="Recadrer (touche F)">Recadrer</button>
        <button id="read" title="Masquer le graphe pour lire (touche R)">Lecture</button>
      </div>
      <div id="legend"></div>
      <div id="empty">Aucun élément à afficher avec ces filtres.</div>
    </div>
    <div id="resizer" title="Glisser pour redimensionner"></div>
    <article id="reader"><div class="inner" id="readerInner"></div></article>
  </section>
</div>

<script>
const DATA = {"generated": "2026-11-13 19:19", "elements": [{"id": "D01", "file": "definitions/D01.md", "type": "definition", "partie": "1", "titre": "Conatus, énergie du désir", "enonce": "Le conatus est la force d'exister, l'énergie qui met les corps en mouvement ; chez l'homme, c'est l'énergie du désir. Exister, c'est désirer, et donc s'activer à la poursuite de ses objets.", "titre_en": "Conatus, the energy of desire", "enonce_en": "The conatus is the force of existing, the energy that sets bodies in motion; in man, it is the energy of desire. To exist is to desire, and so to busy oneself in pursuit of its objects.", "titre_de": "Der Conatus, die Energie des Begehrens", "enonce_de": "Der Conatus ist die Kraft zu existieren, die Energie, die die Körper in Bewegung setzt; im Menschen ist er die Energie des Begehrens. Existieren heißt begehren und sich also in der Verfolgung seiner Gegenstände betätigen.", "body_de": "## Bei Lordon\n\nEine Lektüre von S01 (03.1). Das Verb *conor* bedeutet „unternehmen“ im Sinne von „beginnen“: Wie der *impetus* bezeichnet der Conatus den Anstoß, der von der Ruhe zur Bewegung führt. Die Frage, woher diese Energie kommt, überlässt Lordon dem ontologischen Kommentar: „die Energie des Conatus ist das Leben“ und, „Spinoza am nächsten“, die Energie des Begehrens.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["03.1"], "depends_on": ["S01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLecture de S01 (03.1). Le verbe *conor* signifie « entreprendre » au sens de « commencer » : comme l'*impetus*, le conatus désigne l'impulsion qui fait passer du repos au mouvement. Lordon laisse au commentaire ontologique la question de l'origine de cette énergie : « l'énergie du conatus, c'est la vie », et, « au plus près de Spinoza », l'énergie du désir.", "body_en": "## In Lordon\n\nA reading of S01 (03.1). The verb *conor* means \"to undertake\" in the sense of \"to begin\": like the *impetus*, the conatus designates the impulse that takes one from rest to motion. Lordon leaves to ontological commentary the question of where this energy comes from: \"the energy of the conatus is life\", and, \"closest to Spinoza\", the energy of desire.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S01"], "corollaires": [], "mtime": 1794593716.181303}, {"id": "D02", "file": "definitions/D02.md", "type": "definition", "partie": "1", "titre": "Enrôlement", "enonce": "L'enrôlement est le fait de faire entrer des puissances d'agir tierces dans la poursuite de son propre désir. C'est la catégorie la plus générale, dont le salariat n'est qu'un cas.", "titre_en": "Enlistment", "enonce_en": "Enlistment is bringing third-party powers of acting into the pursuit of one's own desire. It is the most general category, of which wage labour is only one case.", "titre_de": "Einspannung", "enonce_de": "Einspannung heißt, fremde Handlungsmächte in die Verfolgung des eigenen Begehrens einzubeziehen. Sie ist die allgemeinste Kategorie, deren bloßer Einzelfall die Lohnarbeit ist.", "body_de": "## Bei Lordon\n\nDas Lohnverhältnis ist „ein Verhältnis der *Einspannung*“ (04.1); „unter dem Gesichtspunkt der Vereinnahmung“ ist die Einspannung die allgemeinste Kategorie (04.2). Die Eingespannten sind Conatus (D01), deren Anstrengung im Dienst eines anderen vereinnahmt wird.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["04.1", "04.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe rapport salarial est « un rapport d'*enrôlement* » (04.1) ; « sous l'angle de la capture », l'enrôlement est la catégorie la plus générale (04.2). Les enrôlés sont des conatus (D01) dont l'effort est capté au service d'un autre.", "body_en": "## In Lordon\n\nThe wage relation is \"a relation of *enlistment*\" (04.1); \"from the angle of capture\", enlistment is the most general category (04.2). The enlisted are conatuses (D01) whose effort is captured in the service of another.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794593716.181303}, {"id": "D03", "file": "definitions/D03.md", "type": "definition", "partie": "1", "titre": "Désir-maître", "enonce": "Le désir-maître est le désir de celui qui enrôle, au service duquel sont mobilisées les puissances d'agir des enrôlés.", "titre_en": "Master-desire", "enonce_en": "The master-desire is the desire of the one who enlists, in whose service the powers of acting of the enlisted are mobilised.", "titre_de": "Herrenbegehren", "enonce_de": "Das Herrenbegehren ist das Begehren dessen, der einspannt, in dessen Dienst die Handlungsmächte der Eingespannten mobilisiert werden.", "body_de": "## Bei Lordon\n\nDer Begriff erscheint mit der Frage der *Vereinnahmung* „durch das Subjekt des Herrenbegehrens“ (04.1). Die Alltagssprache irrt sich nicht, wenn sie die Herrenbegehren „Direktoren“ nennt (14.3): Sie lenken die eingespannten Conatus (D11).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["04.1", "04.2", "14.3"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe terme apparaît avec la question de la *capture* « par le sujet du désir-maître » (04.1). Le vocabulaire commun ne s'y trompe pas, qui appelle les désirs-maîtres des « directeurs » (14.3) : ils orientent les conatus enrôlés (D11).", "body_en": "## In Lordon\n\nThe term appears with the question of *capture* \"by the subject of the master-desire\" (04.1). Common vocabulary is not mistaken, calling master-desires \"directors\" (14.3): they direct the enlisted conatuses (D11).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794593716.181303}, {"id": "D04", "file": "definitions/D04.md", "type": "definition", "partie": "1", "titre": "Patronat (au sens général)", "enonce": "Le patronat est le rapport sous lequel un désir-maître mobilise au service de son entreprise les puissances d'agir des enrôlés. En ce sens général, le patronat est un « capturat ».", "titre_en": "Bosshood (in the general sense)", "enonce_en": "Bosshood (*patronat*) is the relation under which a master-desire mobilises the powers of acting of the enlisted in the service of its enterprise. In this general sense, bosshood is a \"capturat\", a regime of capture.", "titre_de": "Patronat (im allgemeinen Sinn)", "enonce_de": "Das Patronat ist das Verhältnis, unter dem ein Herrenbegehren die Handlungsmächte der Eingespannten in den Dienst seines Unternehmens stellt. In diesem allgemeinen Sinn ist das Patronat ein „Capturat“, ein Regime der Vereinnahmung.", "body_de": "## Bei Lordon\n\nLordon benennt die Gattung nach einer ihrer Arten (04.2). Beispiele: der Kriegsherr und seine Eroberung, der Kreuzritter und sein Kreuzzug, der Souverän (dessen Macht in Wahrheit die der Menge ist), der kapitalistische Unternehmer und sein Profit, aber auch der Leiter einer NGO, der akademische Mandarin, der Künstler und seine Gehilfen. Alle vereinnahmen die Anstrengung (den Conatus) eingespannter Untergebener (D02) im Dienst eines Herrenbegehrens (D03).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["04.2"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon nomme le genre d'après l'une de ses espèces (04.2). Exemples : le chef de guerre et sa conquête, le croisé et sa croisade, le souverain (dont la puissance est en fait celle de la multitude), le patron capitaliste et son profit, mais aussi le dirigeant d'ONG, le mandarin universitaire, l'artiste et ses aides. Tous captent l'effort (conatus) de subordonnés enrôlés (D02) au service d'un désir-maître (D03).", "body_en": "## In Lordon\n\nLordon names the genus after one of its species (04.2). Examples: the warlord and his conquest, the crusader and his crusade, the sovereign (whose power is in fact that of the multitude), the capitalist boss and his profit, but also the NGO director, the academic mandarin, the artist and his assistants. All capture the effort (conatus) of enlisted subordinates (D02) in the service of a master-desire (D03).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794593716.1828418}, {"id": "D05", "file": "definitions/D05.md", "type": "definition", "partie": "1", "titre": "Rapport salarial", "enonce": "Le rapport salarial est l'ensemble des données structurelles (la double séparation) et des codifications juridiques qui permettent à certains individus d'en impliquer d'autres dans la réalisation de leur propre entreprise. C'est un rapport d'enrôlement.", "titre_en": "Wage relation", "enonce_en": "The wage relation is the set of structural givens (the double separation) and legal codifications that allow certain individuals to involve others in carrying out their own enterprise. It is a relation of enlistment.", "titre_de": "Lohnverhältnis", "enonce_de": "Das Lohnverhältnis ist das Bündel struktureller Gegebenheiten (die doppelte Trennung) und rechtlicher Festlegungen, die es bestimmten Individuen erlauben, andere in die Ausführung ihres eigenen Unternehmens einzubeziehen. Es ist ein Verhältnis der Einspannung.", "body_de": "## Bei Lordon\n\n„Fremde Handlungsmächte in die Verfolgung des eigenen industriellen Begehrens einzubeziehen: Das ist das Wesen des Lohnverhältnisses“ (04.1). Es verbindet die marxsche Struktur (M01) mit dem allgemeinen Begriff der Einspannung (D02).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["04.1"], "depends_on": ["M01", "D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Faire entrer des puissances d'agir tierces dans la poursuite de son désir industriel à soi, voilà l'essence du rapport salarial » (04.1). Il combine la structure marxienne (M01) et le concept général d'enrôlement (D02).", "body_en": "## In Lordon\n\n\"Bringing third-party powers of acting into the pursuit of one's own industrial desire: that is the essence of the wage relation\" (04.1). It combines the Marxian structure (M01) with the general concept of enlistment (D02).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "M01"], "corollaires": [], "mtime": 1794593716.1828418}, {"id": "D06", "file": "definitions/D06.md", "type": "definition", "partie": "1", "titre": "Intérêt", "enonce": "L'intérêt est la prise de satisfaction, c'est-à-dire l'autre nom de l'objet du désir, dont il épouse l'infinie variété : *interesse sive appetitus*.", "titre_en": "Interest", "enonce_en": "Interest is the taking of satisfaction, that is, another name for the object of desire, whose infinite variety it follows: *interesse sive appetitus*.", "titre_de": "Interesse", "enonce_de": "Interesse ist das Finden von Befriedigung, also ein anderer Name für den Gegenstand des Begehrens, dessen unendlicher Vielfalt es folgt: *interesse sive appetitus*.", "body_de": "## Bei Lordon\n\nDie Formel *interesse sive appetitus* ist Lordons Paraphrase Spinozas: „man könnte hier Spinoza paraphrasieren“ (05.2). Sie weigert sich, das Interesse auf utilitaristisches Kalkül zu verkürzen: Das ökonomische Interesse ist nur eine historisch gebildete Form, die sich in einer in Geld geführten Rechnung spiegelt. Lordon verweist auf sein *L'Intérêt souverain* (2006, Anm. 5).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’intérêt c’est la prise de satisfaction, c’est-à-dire l’autre nom de l’objet du désir »", "loc": ["05.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLa formule *interesse sive appetitus* est une paraphrase de Spinoza par Lordon : « on pourrait ici paraphraser Spinoza » (05.2). Elle refuse de réduire l'intérêt au calcul utilitariste : l'intérêt économique n'est qu'une forme historiquement construite, celle qui se réfléchit dans un compte en monnaie. Lordon renvoie à son *Intérêt souverain* (2006, note 5).", "body_en": "## In Lordon\n\nThe formula *interesse sive appetitus* is Lordon's paraphrase of Spinoza: \"one could paraphrase Spinoza here\" (05.2). It refuses to reduce interest to utilitarian calculation: economic interest is only a historically constructed form, the one reflected in an account kept in money. Lordon refers to his *L'Intérêt souverain* (2006, note 5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1828418}, {"id": "D07", "file": "definitions/D07.md", "type": "definition", "partie": "1", "titre": "Désir basal", "enonce": "Le désir basal est le désir de la reproduction matérielle, celle de la « vie nue » : le désir qui conditionne tous les autres.", "titre_en": "Basic desire", "enonce_en": "Basic desire is the desire for material reproduction, that of \"bare life\": the desire that conditions all the others.", "titre_de": "Grundbegehren", "enonce_de": "Das Grundbegehren ist das Begehren nach materieller Reproduktion, der des „nackten Lebens“: das Begehren, das alle anderen bedingt.", "body_de": "## Bei Lordon\n\n„Der Kapitalismus beginnt mit dem Geld. Oder vielmehr mit dem nackten Leben. Dem Leben, das zu reproduzieren ist“ (06.1). Dieses Begehren wird als Zwang oder Mühsal erlebt, bleibt aber begrifflich ein Begehren: Man braucht nur zu sehen, wie heftig die Menschen kämpfen, wenn ihnen die Gegenstände ihrer Reproduktion fehlen (09.1). Es ist das Begehren, das „alles bedingt, aber für nichts zählt“ (09.4).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["06.1", "09.1", "09.4"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Le capitalisme commence par l'argent. Ou plutôt la vie nue. La vie à reproduire » (06.1). Ce désir est vécu comme contrainte ou corvée, mais il reste conceptuellement un désir : il suffit de voir l'acharnement des hommes quand les objets de leur reproduction viennent à manquer (09.1). C'est le désir qui « conditionne tout mais compte pour rien » (09.4).", "body_en": "## In Lordon\n\n\"Capitalism begins with money. Or rather with bare life. Life to be reproduced\" (06.1). This desire is experienced as constraint or chore, but conceptually it remains a desire: one need only see how fiercely men struggle when the objects of their reproduction run short (09.1). It is the desire that \"conditions everything but counts for nothing\" (09.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1844027}, {"id": "D08", "file": "definitions/D08.md", "type": "definition", "partie": "1", "titre": "Monnaie et argent", "enonce": "La monnaie est un rapport social : la croyance collective, produite et entretenue par des institutions, qui fait accepter un signe sans valeur intrinsèque comme moyen de paiement. L'argent est la monnaie saisie du côté des sujets : l'objet de désir que ce rapport fait naître.", "titre_en": "Money as institution and as object", "enonce_en": "Money as an institution (*monnaie*) is a social relation: the collective belief, produced and sustained by institutions, that makes a sign without intrinsic value accepted as a means of payment. Money as an object (*argent*) is that institution grasped from the side of subjects: the object of desire this relation gives rise to.", "titre_de": "Geld als Institution und als Gegenstand", "enonce_de": "Geld als Institution (*monnaie*) ist ein soziales Verhältnis: der kollektive, von Institutionen erzeugte und gestützte Glaube, der ein Zeichen ohne inneren Wert als Zahlungsmittel annehmen lässt. Geld als Gegenstand (*argent*) ist diese Institution, von den Subjekten her erfasst: der Gegenstand des Begehrens, den dieses Verhältnis hervorbringt.", "body_de": "## Bei Lordon\n\nLordon führt Pepita Ould-Ahmed weiter, die in den beiden französischen Wörtern zwei fachliche Gesichtspunkte sieht (07.1), und stützt sich für das Geld als soziales Verhältnis fiduziarer Natur auf Michel Aglietta und André Orléan (07.2). Beide Gesichtspunkte müssen zusammengehalten werden, wie Bourdieu die Antinomie von Objektivismus und Subjektivismus zurückwies: Die Strukturen sind in den Subjekten in Gestalt von Begehren und Affekten gegenwärtig (07.3).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« L’argent, c’est la monnaie saisie du côté des sujets. »", "loc": ["07.1", "07.2", "07.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon prolonge Pepita Ould-Ahmed, qui voit dans les deux mots deux points de vue disciplinaires (07.1), et s'appuie sur Michel Aglietta et André Orléan pour la monnaie comme rapport social, de nature fiduciaire (07.2). Les deux points de vue doivent être tenus ensemble, comme Bourdieu récusait l'antinomie de l'objectivisme et du subjectivisme : les structures sont présentes dans les sujets sous forme de désirs et d'affects (07.3).", "body_en": "## In Lordon\n\nLordon extends Pepita Ould-Ahmed, who sees the two French words as two disciplinary points of view (07.1), and relies on Michel Aglietta and André Orléan for money as a social relation, fiduciary in nature (07.2). The two points of view must be held together, as Bourdieu rejected the antinomy of objectivism and subjectivism: structures are present in subjects in the form of desires and affects (07.3).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1844027}, {"id": "D09", "file": "definitions/D09.md", "type": "definition", "partie": "1", "titre": "Domination (premier sens)", "enonce": "Il y a domination quand un agent doit en passer par un autre pour accéder à son objet de désir.", "titre_en": "Domination (first sense)", "enonce_en": "There is domination when an agent must go through another to gain access to its object of desire.", "titre_de": "Herrschaft (erster Sinn)", "enonce_de": "Herrschaft liegt vor, wenn ein Agent über einen anderen gehen muss, um Zugang zu seinem Gegenstand des Begehrens zu erhalten.", "body_de": "## Bei Lordon\n\n„Wenn der erste Sinn von Herrschaft in der Notwendigkeit für einen Agenten besteht, über einen anderen zu gehen, um Zugang zu seinem Gegenstand des Begehrens zu erhalten…“ (08.1). Die Definition ist in Begriffen des Begehrens (D01) gefasst, nicht des Willens oder des physischen Zwangs. Lordon fügt sogleich die Folge hinzu: Die Stärke der Herrschaft entspricht der Stärke des Begehrens des Beherrschten (T007). Dieser erste Sinn bleibt in Kapitel 3 bestehen, neben einem zweiten (33.2; D20).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["08.1", "33.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Si le premier sens de la domination consiste en la nécessité pour un agent d'en passer par un autre pour accéder à son objet de désir… » (08.1). La définition est formulée en termes de désir (D01), non de volonté ni de contrainte physique. Lordon en ajoute aussitôt la conséquence : l'intensité de la domination est proportionnée à celle du désir du dominé (T007). Ce premier sens demeure au chapitre 3, à côté d'un second (33.2 ; D20).", "body_en": "## In Lordon\n\n\"If the first sense of domination consists in the necessity for an agent to go through another to gain access to its object of desire…\" (08.1). The definition is framed in terms of desire (D01), not of will or physical constraint. Lordon immediately adds the consequence: the intensity of domination is proportionate to that of the desire of the dominated (T007). This first sense remains in chapter 3, alongside a second one (33.2; D20).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01", "D20", "T007"], "corollaires": [], "mtime": 1794593716.1844027}, {"id": "D10", "file": "definitions/D10.md", "type": "definition", "partie": "1", "titre": "Stratégie", "enonce": "Est stratégique l'ensemble des actions enchaînées pour parvenir à une fin désirée, qu'elles procèdent du calcul ou de la conduite par les affects : la stratégie est la logique même du désir.", "titre_en": "Strategy", "enonce_en": "Strategic is the whole of the actions linked together to reach a desired end, whether they proceed from calculation or from conduct by the affects: strategy is the very logic of desire.", "titre_de": "Strategie", "enonce_de": "Strategisch ist die Gesamtheit der Handlungen, die verkettet werden, um ein begehrtes Ziel zu erreichen, ob sie aus Berechnung oder aus der Führung durch die Affekte hervorgehen: Strategie ist die Logik des Begehrens selbst.", "body_de": "## Bei Lordon\n\nLordon vermeidet einen „offen reflexiven und berechnenden“ Sinn (10.2): Handlungsketten können verkörperte, fast automatische Handlungsweisen sein (Bourdieus Habitus). Er übernimmt den Ausdruck von Laurent Bove, die „Strategien des Conatus“ (Anm. 23); der Gegensatz von Berechnung und Affekten ist eine „falsche Antinomie“ (Anm. 22).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["10.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon se garde d'un sens « ouvertement réfléchi et calculateur » (10.2) : les enchaînements d'actions peuvent être des manières de faire incorporées, quasi automatiques (l'habitus de Bourdieu). Il reprend l'expression de Laurent Bove, les « stratégies du conatus » (note 23) ; l'opposition du calcul et des affects est une « fausse antinomie » (note 22).", "body_en": "## In Lordon\n\nLordon avoids an \"openly reflective and calculating\" sense (10.2): chains of action can be embodied ways of doing, quasi-automatic (Bourdieu's habitus). He takes up Laurent Bove's expression, the \"strategies of the conatus\" (note 23); the opposition between calculation and affects is a \"false antinomy\" (note 22).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D11", "file": "definitions/D11.md", "type": "definition", "partie": "1", "titre": "Colinéarité et angle α", "enonce": "Le désir-maître et chaque conatus enrôlé sont figurés par des vecteurs. L'angle α qu'ils forment mesure le désalignement de l'enrôlé : seule la composante de son effort parallèle au désir-maître (d’intensité |d| cos α) lui est utile ; la composante orthogonale (|d| sin α) lui échappe.", "titre_en": "Collinearity and the angle α", "enonce_en": "The master-desire and each enlisted conatus are represented by vectors. The angle α between them measures the misalignment of the enlisted: only the component of its effort parallel to the master-desire (of magnitude |d| cos α) is useful to it; the orthogonal component (|d| sin α) escapes it.", "titre_de": "Kollinearität und der Winkel α", "enonce_de": "Das Herrenbegehren und jeder eingespannte Conatus werden durch Vektoren dargestellt. Der Winkel α zwischen ihnen misst die Abweichung des Eingespannten: Nur die zum Herrenbegehren parallele Komponente seiner Anstrengung (vom Betrag |d| cos α) nützt diesem; die orthogonale Komponente (|d| sin α) entgeht ihm.", "body_de": "## Bei Lordon\n\n„Wenn es um Richtung und Ausrichtung geht, ist die Vektormetapher treffend“ (13.3). Lordon schreibt **D** für das Herrenbegehren (D03) und **d** für den eingespannten Conatus (D02). Die Einspannung wird durch das Skalarprodukt **D**·**d** = |**D**| |**d**| cos α dargestellt (13.3-13.4); die nützliche Komponente d1 hat die Länge |**d**| cos α, kleiner als |**d**| (13.5-13.7). Der Winkel α ist das *clinamen* des einzelnen Conatus, seine „spontane Abweichung von den Zwecken des Unternehmens“; sein Sinus (die orthogonale Komponente d2) misst, „was sich nicht vereinnahmen lässt“ (14.1). Abbildung 1 des Buches zeigt diese Zerlegung (13.8).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["13.3", "13.5", "13.7", "14.1"], "depends_on": ["D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« S'il est question de direction et d'alignement la métaphore vectorielle est adéquate » (13.3). Lordon note **D** le désir-maître (D03) et **d** le conatus enrôlé (D02). L'enrôlement est figuré par le produit scalaire **D**·**d** = |**D**| |**d**| cos α (13.3-13.4) ; la composante utile d1 a pour longueur |**d**| cos α, inférieure à |**d**| (13.5-13.7). L'angle α est le *clinamen* du conatus individuel, son « désalignement spontané d'avec les finalités de l'entreprise » ; son sinus (la composante orthogonale d2) mesure « ce qui ne se laissera pas capturer » (14.1). La figure 1 du livre représente cette décomposition (13.8).", "body_en": "## In Lordon\n\n\"If it is a matter of direction and alignment, the vector metaphor is apt\" (13.3). Lordon writes **D** for the master-desire (D03) and **d** for the enlisted conatus (D02). Enlistment is represented by the scalar product **D**·**d** = |**D**| |**d**| cos α (13.3-13.4); the useful component d1 has length |**d**| cos α, less than |**d**| (13.5-13.7). The angle α is the *clinamen* of the individual conatus, its \"spontaneous misalignment with the firm's ends\"; its sine (the orthogonal component d2) measures \"what will not let itself be captured\" (14.1). Figure 1 of the book shows this decomposition (13.8).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02", "D03"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D12", "file": "definitions/D12.md", "type": "definition", "partie": "1", "titre": "Liquidité", "enonce": "Au sens strict, la liquidité est la possibilité de sortir à tout instant d'un marché d'actifs sans en faire varier le prix : une promesse de réversibilité parfaite. Au sens large, elle est le droit inconditionnel du désir à s'engager en sachant pouvoir se désengager.", "titre_en": "Liquidity", "enonce_en": "In the strict sense, liquidity is the possibility of leaving an asset market at any moment without moving its price: a promise of perfect reversibility. In the broad sense, it is the unconditional right of desire to commit while knowing it can withdraw.", "titre_de": "Liquidität", "enonce_de": "Im engen Sinn ist Liquidität die Möglichkeit, einen Vermögensmarkt jederzeit zu verlassen, ohne seinen Preis zu bewegen: ein Versprechen vollkommener Umkehrbarkeit. Im weiten Sinn ist sie das unbedingte Recht des Begehrens, sich zu binden im Wissen, sich zurückziehen zu können.", "body_de": "## Bei Lordon\n\nDasselbe Wort bezeichnet eine Eigenschaft der Märkte und das Geld selbst, zu dem diese Eigenschaft zurückzukehren erlaubt (16.3). Keynes hatte den antisozialen Charakter der Liquidität gesehen, eine Weigerung, sich dauerhaft zu binden, den Wunsch, sich alle Möglichkeiten offenzuhalten, „das heißt, *nie mit dem anderen rechnen zu müssen*“ (Anm. 40). Das Schema greift über die Finanz hinaus und wird zu dem der Herrenbegehren (D03).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["16.3"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe même mot désigne une propriété des marchés et l'argent lui-même, auquel cette propriété permet de revenir (16.3). Keynes avait vu le caractère antisocial de la liquidité, refus de tout engagement durable, désir de garder toutes ses options ouvertes, « c'est-à-dire de *n'avoir jamais à compter avec l'autre* » (note 40). Le schème déborde la finance et devient celui des désirs-maîtres (D03).", "body_en": "## In Lordon\n\nThe same word designates a property of markets and money itself, to which this property allows one to return (16.3). Keynes had seen the antisocial character of liquidity, a refusal of any lasting commitment, a desire to keep all one's options open, \"that is, *never to have to reckon with the other*\" (note 40). The schema overflows finance and becomes that of master-desires (D03).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D03"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D13", "file": "definitions/D13.md", "type": "definition", "partie": "1", "titre": "Tyrannie", "enonce": "La tyrannie est l'imposition unilatérale du désir de l'un à la multitude, sans égard ni compromis : « l'unité qui ne dépend pas de la multitude ».", "titre_en": "Tyranny", "enonce_en": "Tyranny is the unilateral imposition of the desire of one on the multitude, without regard or compromise: \"the unity that does not depend on the multitude\".", "titre_de": "Tyrannei", "enonce_de": "Tyrannei ist das einseitige Aufzwingen des Begehrens eines Einzelnen gegenüber der Menge, ohne Rücksicht und ohne Kompromiss: „die Einheit, die nicht von der Menge abhängt“.", "body_de": "## Bei Lordon\n\nLordon weist zunächst einen Einwand nach Pascal zurück: Tyrannei wäre das „Begehren nach Herrschaft außerhalb seiner Ordnung“, und das kapitalistische Herrenbegehren verlässt seine Ordnung nicht, da es nur auf Akkumulation zielt (17.1, Anm. 41-43). Er behält eine andere Definition Pascals (Anm. 44): die Nichtabhängigkeit des Einen von der Menge, die keine Abwesenheit von Beziehung ist, da der Tyrann weiterhin ihre Macht vereinnahmt. Das Beispiel Caligulas, nach Camus (Anm. 45).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« l’unité qui ne dépend pas de la multitude est tyrannie »", "loc": ["17.1"], "depends_on": ["D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon écarte d'abord une objection tirée de Pascal : la tyrannie serait le « désir de domination hors de son ordre », et le désir-maître capitaliste ne sort pas de son ordre, puisqu'il ne vise que l'accumulation (17.1, notes 41-43). Il retient une autre définition de Pascal (note 44) : la non-dépendance de l'un envers la multitude, qui n'est pas une absence de relation, puisque le tyran reste le captateur de sa puissance. Exemple de Caligula, d'après Camus (note 45).", "body_en": "## In Lordon\n\nLordon first sets aside an objection drawn from Pascal: tyranny would be the \"desire for domination outside its order\", and the capitalist master-desire does not leave its order, since it aims only at accumulation (17.1, notes 41-43). He retains another definition from Pascal (note 44): the non-dependence of the one on the multitude, which is not an absence of relation, since the tyrant remains the captor of its power. The example of Caligula, after Camus (note 45).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D14", "file": "definitions/D14.md", "type": "definition", "partie": "2", "titre": "Épithumè et épithumogénie", "enonce": "Une épithumè est un régime de désir : la configuration de désirs et d'affects par laquelle des structures sociales existent aussi dans les psychés. L'épithumogénie est le travail de production de désirs, mené par la société sur elle-même ou par des agents intéressés.", "titre_en": "Epithumè and epithumogeny", "enonce_en": "An epithumè is a regime of desire: the configuration of desires and affects through which social structures also exist in psyches. Epithumogeny is the work of producing desires, carried out by society on itself or by interested agents.", "titre_de": "Epithumè und Epithumogenie", "enonce_de": "Eine Epithumè ist ein Regime des Begehrens: die Konfiguration von Begehren und Affekten, durch die die sozialen Strukturen auch in den Psychen existieren. Epithumogenie ist die Arbeit der Hervorbringung von Begehren, die die Gesellschaft an sich selbst oder interessierte Agenten leisten.", "body_de": "## Bei Lordon\n\nDas nach dem griechischen *epithumia*, Begehren, gebildete Wort (Anm. 48) ist eine „foucaultsche Paronymie“ der *episteme* (19.1). Wie Bourdieus *illusio* benennt es die Triebkräfte des Engagements in einem sozialen Spiel, macht aber deutlich, dass dieses „Interesse“ Sache des Begehrens (D01) und der Affekte ist. Die kapitalistische Epithumè fügt sich in das „Gegenstandstriptychon“ aus Geld, Ware und Arbeit, gekrönt von der Größe (19.2). Epithumogenie ist nicht immer ein „Prozess ohne Subjekt“: Sie kann zu bestimmten Zwecken gehandhabt werden (19.2).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["19.1", "19.2"], "depends_on": ["D01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe mot, forgé sur le grec *épithumia*, désir (note 48), est une « paronymie foucaldienne » de l'*épistémè* (19.1). Comme l'*illusio* de Bourdieu, il nomme les forces motrices de l'engagement dans un jeu social, mais marque que cet « intérêt » est affaire de désir (D01) et d'affects. L'épithumè capitaliste s'inscrit dans le « triptyque objectal » de l'argent, de la marchandise et du travail, surmonté de la grandeur (19.2). L'épithumogénie n'est pas toujours un « procès sans sujet » : elle peut être maniée à des fins déterminées (19.2).", "body_en": "## In Lordon\n\nThe word, coined from the Greek *epithumia*, desire (note 48), is a \"Foucauldian paronymy\" of the *episteme* (19.1). Like Bourdieu's *illusio*, it names the driving forces of engagement in a social game, but marks that this \"interest\" is a matter of desire (D01) and affects. The capitalist epithumè fits into the \"object triptych\" of money, commodity and work, topped by greatness (19.2). Epithumogeny is not always a \"process without a subject\": it can be handled for determinate ends (19.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D01"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D15", "file": "definitions/D15.md", "type": "definition", "partie": "2", "titre": "Affects intrinsèques et extrinsèques", "enonce": "Un affect salarial est extrinsèque quand il se rapporte à des objets extérieurs à l'activité de travail (les biens que le salaire permet d'acheter), intrinsèque quand il ne passe pas par de tels objets. L'aiguillon de la faim est intrinsèque et triste ; la joie consumériste, extrinsèque et joyeuse ; l'épithumogénie néolibérale vise des affects intrinsèques joyeux.", "titre_en": "Intrinsic and extrinsic affects", "enonce_en": "A wage-labour affect is extrinsic when it relates to objects external to the work activity (the goods the wage can buy), intrinsic when it does not go through such objects. The goad of hunger is intrinsic and sad; consumerist joy, extrinsic and joyful; neoliberal epithumogeny aims at intrinsic joyful affects.", "titre_de": "Intrinsische und extrinsische Affekte", "enonce_de": "Ein Affekt der Lohnarbeit ist intrinsisch, wenn er aus der Arbeitstätigkeit selbst entsteht, extrinsisch, wenn er aus ihr äußerlichen Gegenständen entsteht (den Gütern, die der Lohn zu kaufen erlaubt). Der Stachel des Hungers ist intrinsisch und traurig; die Konsumfreude extrinsisch und freudig; die neoliberale Epithumogenie zielt auf intrinsische freudige Affekte.", "body_de": "## Bei Lordon\n\nDie drei Affektregime der Lohnarbeit lassen sich an dieser Doppeltabelle ablesen (19.5):\n\n| | traurig | freudig |\n|---|---|---|\n| **intrinsisch** | der Stachel des Hungers (T007) | intrinsische freudige Affekte (T021) |\n| **extrinsisch** | — | der Konsum (T013) |\n\nLordon bestimmt das Intrinsische nur negativ: Intrinsisch ist, was nicht „auf Gegenstände außerhalb der Tätigkeit der Lohnarbeit bezogen“ ist (19.5). Der Stachel des Hungers ist in diesem Sinn intrinsisch: Er treibt zur Arbeit, um ein Übel zu vermeiden, die materielle Verelendung, nicht um Güter zu erwerben (19.4). Er ist deshalb noch keine Freude oder Traurigkeit an der Tätigkeit selbst.\n\nFür die intrinsischen freudigen Affekte präzisiert Lordon: Sie sind „intransitiv“, die Tätigkeit *selbst* muss zur Quelle unmittelbarer Freude werden (19.5).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« l’aiguillon de la faim était un affect salarial intrinsèque, mais c’était un affect triste ; la joie consumériste est bien un affect joyeux, mais il est extrinsèque »", "loc": ["19.4", "19.5"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLes trois régimes d'affects du salariat se lisent sur ce tableau à double entrée (19.5) :\n\n| | triste | joyeux |\n|---|---|---|\n| **intrinsèque** | l'aiguillon de la faim (T007) | les affects joyeux intrinsèques (T021) |\n| **extrinsèque** | — | la consommation (T013) |\n\nLordon ne définit l'intrinsèque qu'en creux : est intrinsèque ce qui n'est pas « rendu à des objets extérieurs à l'activité du travail salarié » (19.5). L'aiguillon de la faim est intrinsèque en ce sens : il pousse à travailler pour éviter un mal, le dépérissement matériel, et non pour acquérir des biens (19.4). Ce n'est pas pour autant une joie ou une tristesse prise à l'activité elle-même.\n\nC'est pour les affects joyeux intrinsèques que Lordon précise : ils sont « intransitifs », c'est l'activité *elle-même* qui doit devenir source de joie immédiate (19.5).", "body_en": "## In Lordon\n\nThe three regimes of affects of wage labour can be read on this two-way table (19.5):\n\n| | sad | joyful |\n|---|---|---|\n| **intrinsic** | the goad of hunger (T007) | intrinsic joyful affects (T021) |\n| **extrinsic** | — | consumption (T013) |\n\nLordon defines the intrinsic only negatively: intrinsic is what is not \"referred to objects external to the activity of wage labour\" (19.5). The goad of hunger is intrinsic in this sense: it drives people to work in order to avoid an evil, material deprivation, not to acquire goods (19.4). It is not, for all that, a joy or sadness taken in the activity itself.\n\nIt is for intrinsic joyful affects that Lordon specifies: they are \"intransitive\", it is the activity *itself* that must become a source of immediate joy (19.5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T007", "T013", "T021"], "corollaires": [], "mtime": 1794593741.0846403}, {"id": "D16", "file": "definitions/D16.md", "type": "definition", "partie": "2", "titre": "Obsequium", "enonce": "L'obsequium est le complexe d'affects qui fait se mouvoir les corps assujettis vers les objets de la norme, et fait faire aux sujets les gestes conformes à ce que demande la persévérance du pouvoir.", "titre_en": "Obsequium", "enonce_en": "Obsequium is the complex of affects that moves subjected bodies towards the objects of the norm, and makes subjects perform the gestures that the persistence of power requires.", "titre_de": "Obsequium", "enonce_de": "Das Obsequium ist das Gefüge von Affekten, das die unterworfenen Körper zu den Gegenständen der Norm bewegt und die Subjekte die Gesten vollziehen lässt, die das Fortbestehen der Macht erfordert.", "body_de": "## Bei Lordon\n\nDas Subjekt ist hier *subditus*, Untertan *des* Souveräns, nicht *subjectum*, souveränes Subjekt; es folgt (*sequor*) der Regel (21.3). Nach S15 hat das Obsequium zwei reine Formeln: Furcht und Liebe.", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["21.3"], "depends_on": ["S15"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe sujet est ici *subditus*, sujet *du* souverain, non *subjectum*, sujet souverain ; il suit (*sequor*) la règle (21.3). Par S15, l'obsequium a deux formules pures : la crainte et l'amour.", "body_en": "## In Lordon\n\nThe subject here is *subditus*, subject *of* the sovereign, not *subjectum*, sovereign subject; he follows (*sequor*) the rule (21.3). By S15, obsequium has two pure formulas: fear and love.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S15"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D17", "file": "definitions/D17.md", "type": "definition", "partie": "2", "titre": "Puissance axiogène du désir", "enonce": "Le désir est axiogène : la valeur n'est pas une propriété des choses que le désir viendrait reconnaître ; c'est une production des investissements du désir.", "titre_en": "The axiogenic power of desire", "enonce_en": "Desire is axiogenic: value is not a property of things that desire would come to recognise; it is a product of the investments of desire.", "titre_de": "Die axiogene Macht des Begehrens", "enonce_de": "Das Begehren ist axiogen: Wert ist keine Eigenschaft der Dinge, die das Begehren anerkennen würde; er ist ein Erzeugnis der Besetzungen des Begehrens.", "body_de": "## Bei Lordon\n\nEine Folge von S04, die „jede Möglichkeit eines Wertobjektivismus zunichtemacht“ (22.2). Das heißt nicht, dass alles in jungfräulicher Neutralität erscheint: Jede wertende, sozial und biografisch gebildete Komplexion hat ihre widerständigen Schemata, stark vorbestimmend, aber nicht ganz sättigend (22.3).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Loin que le désir soit une induction par la valeur, c’est la valeur qui est une production par le désir. »", "loc": ["22.2", "22.3"], "depends_on": ["S04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nConséquence de S04, qui « ruine toute possibilité d'un objectivisme de la valeur » (22.2). Ce n'est pas dire que tout se présente dans une neutralité vierge : chaque complexion valorisante, socialement et biographiquement constituée, a ses schèmes résistants, très prédéterminants mais pas entièrement saturants (22.3).", "body_en": "## In Lordon\n\nA consequence of S04, which \"ruins any possibility of an objectivism of value\" (22.2). This is not to say that everything appears in virgin neutrality: each valuing complexion, socially and biographically constituted, has its resistant schemas, highly predetermining but not entirely saturating (22.3).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S04"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D18", "file": "definitions/D18.md", "type": "definition", "partie": "2", "titre": "Images vocationnelles et précolinéarisation", "enonce": "Les images vocationnelles sont les figures d'activités et de vies désirables que la société produit et fait imiter. Elles précolinéarisent les individus : elles les disposent à désirer l'enrôlement avant même qu'ils soient enrôlés.", "titre_en": "Vocational images and precollinearisation", "enonce_en": "Vocational images are the figures of desirable activities and lives that society produces and gets imitated. They precollinearise individuals: they dispose them to desire enlistment before they are even enlisted.", "titre_de": "Berufungsbilder und Präkollinearisierung", "enonce_de": "Berufungsbilder sind die Figuren begehrenswerter Tätigkeiten und Leben, die die Gesellschaft hervorbringt und nachahmen lässt. Sie präkollinearisieren die Individuen: Sie bereiten sie darauf vor, die Einspannung zu begehren, bevor sie überhaupt eingespannt sind.", "body_de": "## Bei Lordon\n\nDas System von Erziehung, Ausbildung und Berufsberatung, eine Erzählmacht, die Yves Citton „mythokratisch“ nennt (Anm. 74): Die ganze Gesellschaft arbeitet an der Hervorbringung dieser Bilder (24.3-24.4). Die Präkollinearisierung verringert den Winkel α (D11), bleibt aber „weit davon entfernt, vollkommen zu sein“ (25.1), umso mehr, als der Strom der Bilder auch den Dichter, den Reisenden, den unvereinnahmbaren Künstler, die Ausreißer enthält (24.4).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["24.3", "24.4", "25.1"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nSystème d'éducation, de formation et d'orientation, pouvoir du récit qu'Yves Citton qualifie de « mythocratique » (note 74) : la société entière travaille à produire ces images (24.3-24.4). La précolinéarisation réduit l'angle α (D11) mais reste « loin d'être parfaite » (25.1), d'autant que le flot des images comprend aussi le poète, le voyageur, l'artiste irrécupérable, les fuyards (24.4).", "body_en": "## In Lordon\n\nThe system of education, training and career guidance, a power of narrative that Yves Citton calls \"mythocratic\" (note 74): the whole of society works to produce these images (24.3-24.4). Precollinearisation reduces the angle α (D11) but remains \"far from perfect\" (25.1), all the more since the flow of images also includes the poet, the traveller, the unrecoverable artist, the runaways (24.4).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D11"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D19", "file": "definitions/D19.md", "type": "definition", "partie": "2", "titre": "Amor fati capitalistis", "enonce": "L'amor fati capitalistis est l'amour, par les salariés, de la situation que l'entreprise leur fait : la conversion de contraintes extérieures en affects joyeux et en désir propre.", "titre_en": "Amor fati capitalistis", "enonce_en": "Amor fati capitalistis is the love, by employees, of the situation the firm makes for them: the conversion of external constraints into joyful affects and into a desire of their own.", "titre_de": "Amor fati capitalistis", "enonce_de": "Amor fati capitalistis ist die Liebe der Angestellten zu der Lage, die das Unternehmen ihnen bereitet: die Umwandlung äußerer Zwänge in freudige Affekte und in ein eigenes Begehren.", "body_de": "## Bei Lordon\n\nDie neoliberale Epithumogenie (D14) bringt *amor fati* hervor, „aber nicht zu irgendeinem *fatum*: ausschließlich zu ihrem eigenen, dem, das sie auf dem Höhepunkt der Heteronomie über die Angestellten verhängt“ (30.1).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« Produire le consentement, c’est produire l’amour par les individus de la situation qui leur est faite. »", "loc": ["30.1", "30.3"], "depends_on": ["D14"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nL'épithumogénie néolibérale (D14) produit de l'*amor fati*, « mais pas de n'importe quel *fatum* : le sien exclusivement, celui qu'elle abat sur des salariés au comble de l'hétéronomie » (30.1).", "body_en": "## In Lordon\n\nNeoliberal epithumogeny (D14) produces *amor fati*, \"but not of just any *fatum*: its own exclusively, the one it brings down on employees at the height of heteronomy\" (30.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D14"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D20", "file": "definitions/D20.md", "type": "definition", "partie": "3", "titre": "Domination (second sens)", "enonce": "La domination est l'effet qui confère à certains l'aptitude à se réserver des possibilités de jouissance et à en écarter les autres.", "titre_en": "Domination (second sense)", "enonce_en": "Domination is the effect that gives some the ability to reserve possibilities of enjoyment for themselves and to keep others from them.", "titre_de": "Herrschaft (zweiter Sinn)", "enonce_de": "Herrschaft ist die Wirkung, die es den einen erlaubt, sich Möglichkeiten des Genießens vorzubehalten und die anderen davon fernzuhalten.", "body_de": "## Bei Lordon\n\nDer erste Sinn (D09) bleibt bestehen (33.2); dieser zweite Sinn gilt auch dann, wenn man von der Abhängigkeit absieht, und umfasst „harte“ und „weiche“ Herrschaft. Auf dem Spiel steht die Verteilung: „die Verteilung der Chancen der Freude“, um die Sprachen Webers und Spinozas zu mischen (34.1).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« l’effet qui confère à certains l’aptitude à se réserver des possibilités (de jouissance) et à en écarter les autres »", "loc": ["33.2", "34.1"], "depends_on": ["D09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLe premier sens (D09) demeure (33.2) ; ce second sens vaut même quand on fait abstraction de la dépendance, et englobe domination « dure » et domination « douce ». Son enjeu est distributif : « la répartition des chances de joie », pour mêler les langages de Weber et de Spinoza (34.1).", "body_en": "## In Lordon\n\nThe first sense (D09) remains (33.2); this second sense holds even when dependence is set aside, and encompasses \"hard\" and \"soft\" domination. What is at stake is distributive: \"the distribution of chances of joy\", to mix the languages of Weber and Spinoza (34.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D09"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D21", "file": "definitions/D21.md", "type": "definition", "partie": "3", "titre": "Division du désir et imaginaire de l'impuissance", "enonce": "La division du désir est la conversion de la division du travail en assignation des désirs : chacun est rivé aux objets que lui donne sa place. Elle est soutenue par un double imaginaire : du comblement, qui fait paraître suffisantes les petites joies des dominés, et de l'impuissance, qui les fait renoncer aux grandes.", "titre_en": "The division of desire and the imaginary of powerlessness", "enonce_en": "The division of desire is the conversion of the division of labour into an assignment of desires: each is riveted to the objects his position gives him. It is sustained by a double imaginary: of fulfilment, which makes the small joys of the dominated seem sufficient, and of powerlessness, which makes them renounce the great ones.", "titre_de": "Die Teilung des Begehrens und das Imaginäre der Ohnmacht", "enonce_de": "Die Teilung des Begehrens ist die Umwandlung der Arbeitsteilung in eine Zuweisung von Begehren: Jeder wird an die Gegenstände gefesselt, die seine Stellung ihm gibt. Sie wird von einem doppelten Imaginären getragen: dem der Erfüllung, das die kleinen Freuden der Beherrschten als genügend erscheinen lässt, und dem der Ohnmacht, das sie auf die großen verzichten lässt.", "body_de": "## Bei Lordon\n\nDieses doppelte Imaginäre nennt Lordon die symbolische Gewalt „im eigentlichen Sinn“ (34.1). Die den Herrschenden vorbehaltenen Gegenstände müssen von den Beherrschten als begehrenswert anerkannt werden, „unter der entscheidenden Klausel: begehrenswert im Allgemeinen, aber nicht für sie im Besonderen“ (34.2).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["34.1", "34.2"], "depends_on": ["D20"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nC'est ce double imaginaire que Lordon appelle la violence symbolique « à proprement parler » (34.1). Les objets réservés aux dominants doivent être reconnus désirables par les dominés, « sous la clause décisive : désirable en général mais pas pour eux en particulier » (34.2).", "body_en": "## In Lordon\n\nIt is this double imaginary that Lordon calls symbolic violence \"properly speaking\" (34.1). The objects reserved for the dominant must be recognised as desirable by the dominated, \"under the decisive clause: desirable in general but not for them in particular\" (34.2).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D22", "file": "definitions/D22.md", "type": "definition", "partie": "3", "titre": "Exploitation passionnelle", "enonce": "L'exploitation passionnelle est la capture, par un désir-maître, de la puissance d'agir d'enrôlés dont les passions dirigent l'effort dans sa direction. Elle est dépossession d'œuvre : du produit monétaire, et plus généralement de l'autorat, c'est-à-dire de la reconnaissance d'une œuvre collective.", "titre_en": "Passional exploitation", "enonce_en": "Passional exploitation is the capture, by a master-desire, of the power of acting of enlisted people whose passions direct their effort its way. It is a dispossession of the work done: of the monetary product, and more generally of authorship, that is, of recognition for a collective work.", "titre_de": "Leidenschaftliche Ausbeutung", "enonce_de": "Leidenschaftliche Ausbeutung ist die Vereinnahmung der Handlungsmacht von Eingespannten durch ein Herrenbegehren, deren Leidenschaften ihre Anstrengung in seine Richtung lenken. Sie ist eine Enteignung der geleisteten Arbeit: des monetären Ertrags und allgemeiner der Urheberschaft, das heißt der Anerkennung für ein gemeinsames Werk.", "body_de": "## Bei Lordon\n\n„Macht und Leidenschaften, von Leidenschaften gut gelenkte Macht“: Das beutet der allgemeine Patron (D04) aus, der kapitalistische Unternehmer, indem er diese Vereinnahmung in Geld verwandelt, die anderen in die ihrem Feld eigene Anerkennung (35.6). Die Anerkennung fließt dann von oben die Hierarchieketten hinab, eine *Trickle-down-Ökonomie* der Freude (35.5).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "", "loc": ["35.5", "35.6"], "depends_on": ["D03", "D04"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« De la puissance et des passions, de la puissance bien dirigée par des passions » : c'est ce qu'exploite le patron général (D04), le patron capitaliste convertissant cette capture en argent, les autres en reconnaissance propre à leur champ (35.6). La reconnaissance descend ensuite du sommet au long des chaînes hiérarchiques, *trickle-down economy* de la joie (35.5).", "body_en": "## In Lordon\n\n\"Power and passions, power well directed by passions\": that is what the general boss (D04) exploits, the capitalist boss converting this capture into money, the others into the recognition proper to their field (35.6). Recognition then flows down from the top along the hierarchical chains, a *trickle-down economy* of joy (35.5).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D04"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D23", "file": "definitions/D23.md", "type": "definition", "partie": "3", "titre": "Récommune", "enonce": "La récommune (*res communa*, décalquée de la *res publica*) est l'entreprise, au sens général d'un concours de puissances d'agir, constituée selon le principe de la démocratie radicale : ce qui affecte tous doit être l'objet de tous, débattu égalitairement par tous.", "titre_en": "Récommune", "enonce_en": "The récommune (*res communa*, modelled on *res publica*) is the enterprise, in the general sense of a concurrence of powers of acting, constituted on the principle of radical democracy: what affects all must be the business of all, debated equally by all.", "titre_de": "Récommune", "enonce_de": "Die Récommune (*res communa*, nach dem Vorbild der *res publica*) ist das Unternehmen im allgemeinen Sinn eines Zusammenwirkens von Handlungsmächten, gegründet auf dem Prinzip radikaler Demokratie: Was alle angeht, muss Sache aller sein und von allen gleichberechtigt beraten werden.", "body_de": "## Bei Lordon\n\nLordon übernimmt einen Begriff aus *La crise de trop* (2009, Anm. 122). Was das Unternehmen herstellen soll, in welcher Menge, mit welcher Besetzung und welcher Bezahlung: Nichts davon entzieht sich grundsätzlich der gemeinsamen Beratung (37.6). Die Récommune vollzieht die Abschaffung des Lohnverhältnisses als Verhältnis der Einspannung (D02) (37.7).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« ce qui affecte tous doit être l’objet de tous »", "loc": ["37.6", "37.7"], "depends_on": ["D02"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nLordon reprend un terme de *La crise de trop* (2009, note 122). Ce que l'entreprise doit fabriquer, en quelle quantité, avec quel emploi et quelles rémunérations : rien de cela n'échappe par principe à la délibération commune (37.6). La récommune réalise l'abolition du rapport salarial comme rapport d'enrôlement (D02) (37.7).", "body_en": "## In Lordon\n\nLordon takes up a term from *La crise de trop* (2009, note 122). What the enterprise should make, in what quantity, with what staffing and what pay: none of this escapes common deliberation in principle (37.6). The récommune achieves the abolition of the wage relation as a relation of enlistment (D02) (37.7).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D02"], "corollaires": [], "mtime": 1794593716.1859484}, {"id": "D24", "file": "definitions/D24.md", "type": "definition", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "Devenir perpendiculaire (orthogonal), c'est rouvrir l'angle α jusqu'à l'angle droit : le conatus n'offre plus rien à la capture, parce qu'il s'efforce dans de nouvelles directions, vers de nouveaux objets de désir. À α = 180°, il s'oppose activement au désir-maître.", "titre_en": "Becoming perpendicular", "enonce_en": "Becoming perpendicular (orthogonal) is reopening the angle α up to the right angle: the conatus offers nothing more to capture, because it strives in new directions, towards new objects of desire. At α = 180°, it actively opposes the master-desire.", "titre_de": "Senkrecht-Werden", "enonce_de": "Senkrecht (orthogonal) werden heißt, den Winkel α bis zum rechten Winkel wieder zu öffnen: Der Conatus bietet nichts mehr zur Vereinnahmung, weil er sich in neue Richtungen, auf neue Gegenstände des Begehrens hin bemüht. Bei α = 180° stellt er sich dem Herrenbegehren aktiv entgegen.", "body_de": "## Bei Lordon\n\nMit dem Modell von D11: Bei rechtem Winkel α ist cos α = 0 und die Vereinnahmung null (Abbildung 2-a); bei α = 180° ist cos α = -1, und der Conatus entzieht dem Herrenbegehren Zugkraft (Abbildung 2-b). Die Geometrie kehrt den Sinn des „Ins-Lot-Bringens“ um (*norma*, das Winkelmaß des Zimmermanns) (39.5). „Die Senkrechten wenden sich von der Ablenkung ab“ (39.5).", "sections_de": ["Bei Lordon"], "demo_refs_de": [], "citation": "« La sédition c’est le devenir orthogonal – prendre non pas la tangente mais la perpendiculaire. »", "loc": ["39.5"], "depends_on": ["D11"], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nAvec le modèle de D11 : à α droit, cos α = 0 et la
