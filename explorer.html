ogischer Gleichheit (S28) willkürlich; doch diffus und unpersönlich, werden sie nach S23 als Notwendigkeit erlebt, als *fatum* ohne Gott, das weniger Hass auf sich zieht als eine frei vorgestellte Ursache (34.3). ∎\n\n## Anmerkung\n\nSeit den Griechen haben die Rechtfertigungen der Willkür das Dreieck von Geburt, Reichtum und Kompetenz nicht verlassen; die „heutige Mythogenie des Diploms“ liefert Alibis für die Verteilung der Individuen in der Teilung des Begehrens (34.3).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "citation": "« Le salarié ordinaire sait reconnaître comme désirable le pouvoir de direction mais sans en faire un objet de son désir. »", "loc": ["34.1", "34.2", "34.3"], "depends_on": ["T035", "D21", "S26", "S06", "S27", "S13", "S28", "S23"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T035, l'enjeu de la domination est distributif ; la régulation qui ajuste les désirs des dominés exige un enchantement constant, d'autant que l'imitation (S06) attise l'envie des joies visibles des grands (34.1).\n2. D'où le double imaginaire de D21 ; par S26, ce qu'on imagine ne pas pouvoir, on ne le peut effectivement pas : l'assignation devient auto-assignation (34.1).\n3. Par S27, le désir cherche sa confirmation dans le désir des autres ; par S13, chacun veut que les autres vivent selon sa complexion, et tous se font obstacle. La plupart des joies sociales sont donc différentielles : *réserver* et *écarter* sont les gestes propres de la domination (34.2).\n4. Ces assignations sont arbitraires sur un fond d'égalité anthropologique (S28) ; mais, diffuses et impersonnelles, elles sont vécues, par S23, comme une nécessité, un *fatum* sans dieu, qui attire moins de haine qu'une cause imaginée libre (34.3). ∎\n\n## Scolie\n\nLes justifications de l'arbitraire ne sortent pas, depuis les Grecs, du triangle de la naissance, de la richesse et de la compétence ; la « mythogénie contemporaine du diplôme » fournit des alibis à la répartition des individus dans la division du désir (34.3).", "body_en": "## Demonstration\n\n1. By T035, what is at stake in domination is distributive; the regulation that adjusts the desires of the dominated requires constant enchantment, all the more since imitation (S06) stirs envy of the visible joys of the great (34.1).\n2. Hence the double imaginary of D21; by S26, what one imagines one cannot do, one really cannot do: assignment becomes self-assignment (34.1).\n3. By S27, desire seeks its confirmation in the desire of others; by S13, each wants others to live according to his complexion, and all stand in one another's way. Most social joys are therefore differential: *reserving* and *keeping away* are the gestures proper to domination (34.2).\n4. These assignments are arbitrary against a background of anthropological equality (S28); but, diffuse and impersonal, they are experienced, by S23, as a necessity, a *fatum* without a god, which attracts less hatred than a cause imagined free (34.3). ∎\n\n## Scholium\n\nSince the Greeks, the justifications of the arbitrary have not left the triangle of birth, wealth and competence; the \"contemporary mythogeny of the diploma\" provides alibis for the distribution of individuals in the division of desire (34.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "mentions": ["D21", "S06", "S13", "S23", "S26", "S27", "S28", "T035"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T037", "file": "theses/T037.md", "type": "these", "partie": "3", "titre": "Il n'y a pas de valeur objective, seulement des affirmations de puissance", "enonce": "Le désir étant axiogène et la réalité pleine, il n'y a pas de valeur substantielle qui puisse faire norme : vaut ce que le plus puissant a déclaré valoir. Toute demande est en dernière analyse un « parce que » du conatus ; la justification n'a qu'une valeur extrinsèque, mais vitale : contenir la violence. Renoncer à la valeur-travail n'oblige donc pas à déserter la lutte pour le partage.", "titre_en": "There is no objective value, only affirmations of power", "enonce_en": "Since desire is axiogenic and reality is full, there is no substantial value that could set a norm: what is worth something is what the most powerful has declared to be worth something. Every demand is in the last analysis a \"because\" of the conatus; justification has only an extrinsic value, but a vital one: containing violence. Giving up labour value therefore does not oblige one to desert the struggle over distribution.", "titre_de": "Es gibt keinen objektiven Wert, nur Bekräftigungen von Macht", "enonce_de": "Da das Begehren axiogen und die Wirklichkeit voll ist, gibt es keinen substanziellen Wert, der eine Norm setzen könnte: Etwas ist wert, was der Mächtigste für wert erklärt hat. Jede Forderung ist letztlich ein „weil“ des Conatus; die Rechtfertigung hat nur einen äußerlichen, aber lebenswichtigen Wert: die Gewalt einzudämmen. Den Arbeitswert aufzugeben, verpflichtet daher nicht, den Kampf um die Verteilung zu räumen.", "body_de": "## Argumentation\n\n1. Der substanzielle Wert (R11) führt eine transzendente Norm wieder ein; Spinoza weist ihn im Namen der Immanenz zurück, in der Realität und Vollkommenheit ein und dasselbe sind (S29) (35.2).\n2. Nach D17 zieht nicht der Wert das Begehren an, sondern das Begehren setzt die Werte ein; das gilt für ästhetische, moralische und ökonomische Werte, wie Durkheim es für seine übergreifende Werttheorie wollte (35.2).\n3. Werte sind daher Setzungen und Bekräftigungen, vorläufige Siege von Mächten; Kämpfe um Bewertung sind der gewöhnliche Stoff des sozialen Lebens des Werts (35.2).\n4. Auf die Frage „In wessen Namen forderst du?“ lautet die Antwort letztlich immer „weil ich es bin“, nach dem natürlichen Recht des Conatus; „Allgemeinheit“ und Rechtfertigung kommen danach, und ihr einziger Wert ist, ein Bollwerk gegen das „Chaos des Zugreifens“ zu bilden (35.3).\n5. Man kann daher die Verteilung des Werts ohne objektive Mehrwerttheorie anfechten, indem man sich zur Parteilichkeit seines Standpunkts bekennt: „Das ist unsere Norm“ (35.3). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D17", "R11", "S29"], "citation": "« Vaut ce que le plus puissant a déclaré valoir »", "loc": ["35.2", "35.3"], "depends_on": ["D17", "S29"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La valeur substantielle (R11) réintroduit une norme transcendante ; Spinoza la récuse au nom de l'immanence, où réalité et perfection sont une même chose (S29) (35.2).\n2. Par D17, ce n'est pas la valeur qui attire le désir, c'est le désir qui constitue les valeurs ; cela vaut pour les valeurs esthétiques, morales et économiques, comme Durkheim le voulait pour sa théorie transversale de la valeur (35.2).\n3. Les valeurs sont donc des positions et des affirmations, victoires temporaires de puissances ; les luttes de valorisation sont l'ordinaire de la vie sociale de la valeur (35.2).\n4. À la question « au nom de quoi demandez-vous ? », la réponse est toujours en dernière analyse « parce que c'est moi », par le droit naturel du conatus ; la « généralité » et la justification suivent, et leur seule valeur est de faire rempart contre le « chaos pronateur » (35.3).\n5. On peut donc contester le partage de la valeur sans théorie objective de la plus-value, en assumant la partialité de son point de vue : « voilà notre norme à nous » (35.3). ∎", "body_en": "## Argument\n\n1. Substantial value (R11) reintroduces a transcendent norm; Spinoza rejects it in the name of immanence, where reality and perfection are one and the same (S29) (35.2).\n2. By D17, it is not value that attracts desire, it is desire that constitutes values; this holds for aesthetic, moral and economic values, as Durkheim wanted for his transversal theory of value (35.2).\n3. Values are therefore positions and affirmations, temporary victories of powers; struggles over valuation are the ordinary stuff of the social life of value (35.2).\n4. To the question \"in the name of what do you ask?\", the answer is always in the last analysis \"because it is me\", by the natural right of the conatus; \"generality\" and justification follow, and their only value is to form a bulwark against the \"grabbing chaos\" (35.3).\n5. One can therefore contest the distribution of value without an objective theory of surplus value, by owning the partiality of one's point of view: \"this is our norm\" (35.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D17", "R11", "S29"], "sections": ["Argumentation"], "demo_refs": ["D17", "R11", "S29"], "mentions": ["D17", "R11", "S29"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T038", "file": "theses/T038.md", "type": "these", "partie": "3", "titre": "L'exploitation est passionnelle", "enonce": "L'exploitation ne tient pas à la privation d'une plus-value (rendue au corps salarial, elle ne serait plus exploitation), mais à son appropriation privative : elle relève d'une politique de la capture, non d'une économie de la valeur. Ce qui est capté est de la puissance d'agir, dirigée par des passions ; le patronat dépossède d'œuvre, d'argent et de reconnaissance. Faire marcher les salariés, c'est aussi leur faire prendre le désir-maître pour le leur.", "titre_en": "Exploitation is passional", "enonce_en": "Exploitation does not consist in the deprivation of a surplus value (returned to the body of employees, it would no longer be exploitation), but in its private appropriation: it belongs to a politics of capture, not to an economics of value. What is captured is power of acting, directed by passions; bosshood dispossesses of the work done, of money and of recognition. Making employees run is also making them take the master-desire for their own.", "titre_de": "Die Ausbeutung ist leidenschaftlich", "enonce_de": "Die Ausbeutung besteht nicht in der Entziehung eines Mehrwerts (der Gesamtheit der Angestellten zurückgegeben, wäre es keine Ausbeutung mehr), sondern in seiner privaten Aneignung: Sie gehört zu einer Politik der Vereinnahmung, nicht zu einer Ökonomie des Werts. Was vereinnahmt wird, ist von Leidenschaften gelenkte Handlungsmacht; das Patronat enteignet die geleistete Arbeit, das Geld und die Anerkennung. Die Angestellten laufen zu lassen, heißt auch, sie das Herrenbegehren für ihr eigenes halten zu lassen.", "body_de": "## Beweis\n\n1. Die Angestellten brauchen die Mehrwerttheorie nicht, um sich ausgebeutet zu fühlen; es ist die Idee der Vereinnahmung, die ihren Protest erfasst (35.4).\n2. Ginge der Mehrwert an die Gesamtheit der Angestellten selbst zurück, bliebe die Algebra des Arbeitswerts dieselbe, und niemand spräche von Ausbeutung: Was sie ausmacht, ist die private Aneignung. Die Ausbeutung gehört daher zu einer Politik der Vereinnahmung (35.4), und nach T037 lässt sie sich ohne objektiven Wert denken.\n3. Was vereinnahmt wird, ist die Handlungsmacht der Eingespannten, in Traurigkeit oder, wenn die Epithumogenie gelingt, in Freude, aber an die Teilung des Begehrens gefesselt (T036). Nach M06 sind die Beiträge partiell, und nur das Herrenbegehren fasst sie zusammen: Die Vereinnahmung ist Enteignung der geleisteten Arbeit, und zuerst der *Urheberschaft*, da die Anerkennung für das gemeinsame Werk an die Spitze geht (D22) (35.5).\n4. Wie jedes Patronat (T004) vereinnahmt das kapitalistische Patronat Anstrengung; es verwandelt sie in Geld, die anderen in Anerkennung; alle erreichen ihre Ziele nur durch von Affekten gelenkte konative Energien: Die Ausbeutung ist leidenschaftlich (35.6).\n5. Die Angestellten laufen zu lassen (*faire marcher*), heißt, sie in Bewegung zu setzen, sie funktionieren zu lassen und „sie an der Nase herumzuführen“: sie glauben zu machen, sich für die Vereinnahmung zu betätigen heiße, sich zu „verwirklichen“ (35.7). ∎\n\n## Anmerkung\n\nDer Leiter eines Forschungslabors gilt als „Entdecker“, der Mandarin unterzeichnet das Buch seiner Assistenten, der Regisseur lässt sich als alleiniger Urheber von Bildern anerkennen, die nur sein Kameramann schaffen konnte; das heißt nicht, die Ungleichheit der Beiträge zu leugnen, sondern das Verschwinden fast aller hinter einem einzigen (35.5). Wenn die leidenschaftliche Ausbeutung sehr gut gelingt, „gehen die Eingespannten nicht mehr, sie laufen“ (35.7).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D22", "M06", "T004", "T036", "T037"], "citation": "« Si exploitation il y a, elle est donc davantage du ressort d’une théorie politique de la capture que d’une théorie économique de la valeur »", "loc": ["35.4", "35.5", "35.6", "35.7"], "depends_on": ["T037", "D22", "M06", "T036", "T004"], "contre": ["R11"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Les salariés n'ont pas besoin de la théorie de la plus-value pour se sentir exploités ; c'est l'idée de capture qui saisit leurs protestations (35.4).\n2. Si la plus-value revenait au corps salarial lui-même, l'algèbre de la valeur-travail resterait la même, et personne ne parlerait d'exploitation : ce qui la fait est l'appropriation privative. L'exploitation relève donc d'une politique de la capture (35.4), et par T037 on peut la penser sans valeur objective.\n3. Ce qui est capté est la puissance d'agir des enrôlés, dans la tristesse ou, quand l'épithumogénie réussit, dans la joie, mais rivée à la division du désir (T036). Par M06, les contributions sont parcellaires et seule les totalise le désir-maître : la capture est dépossession d'œuvre, et d'abord d'*autorat*, la reconnaissance de l'œuvre collective allant au sommet (D22) (35.5).\n4. Comme tout patronat (T004), le patronat capitaliste capte de l'effort ; il le convertit en argent, les autres en reconnaissance ; tous ne parviennent à leurs fins que par des énergies conatives dirigées par des affects : l'exploitation est passionnelle (35.6).\n5. Faire marcher les salariés, c'est les faire se mouvoir, les faire fonctionner, et les « faire marcher » : leur faire croire que s'activer pour la capture est se « réaliser » (35.7). ∎\n\n## Scolie\n\nLe patron scientifique passe pour « découvreur », le mandarin signe l'ouvrage de ses assistants, le réalisateur se fait reconnaître seul auteur d'images que son chef-opérateur était seul capable de produire ; ce n'est pas nier l'inégalité des contributions, mais l'effacement de presque toutes derrière une seule (35.5). Quand l'exploitation passionnelle réussit très bien, « les enrôlés ne marchent plus, ils courent » (35.7).", "body_en": "## Demonstration\n\n1. Employees do not need the theory of surplus value to feel exploited; it is the idea of capture that grasps their protests (35.4).\n2. If surplus value went back to the body of employees itself, the algebra of labour value would stay the same, and nobody would speak of exploitation: what makes it is private appropriation. Exploitation therefore belongs to a politics of capture (35.4), and by T037 it can be thought without objective value.\n3. What is captured is the power of acting of the enlisted, in sadness or, when epithumogeny succeeds, in joy, but riveted to the division of desire (T036). By M06, contributions are partial and only the master-desire totalises them: capture is dispossession of the work done, and first of *authorship*, recognition for the collective work going to the top (D22) (35.5).\n4. Like all bosshood (T004), capitalist bosshood captures effort; it converts it into money, the others into recognition; all reach their ends only through conative energies directed by affects: exploitation is passional (35.6).\n5. Making employees run (*faire marcher*) is making them move, making them function, and \"taking them for a ride\": making them believe that busying themselves for capture is \"fulfilling\" themselves (35.7). ∎\n\n## Scholium\n\nThe head of a science lab passes for the \"discoverer\", the mandarin signs his assistants' book, the director gets recognised as the sole author of images that only his cinematographer could produce; this is not to deny the inequality of contributions, but the effacement of almost all of them behind a single one (35.5). When passional exploitation succeeds very well, \"the enlisted no longer walk, they run\" (35.7).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D22", "M06", "T004", "T036", "T037"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D22", "M06", "T004", "T036", "T037"], "mentions": ["D22", "M06", "T004", "T036", "T037"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T039", "file": "theses/T039.md", "type": "these", "partie": "3", "titre": "Communisme ou totalitarisme", "enonce": "Le projet néolibéral reste contradictoire : les salariés « courent de travers », et la « libre volonté obéissante » peut toujours se reprendre. Son modèle, le salarié-artiste dont la créativité exige l'autonomie, mène vers la libre association des travailleurs ; pour le gros des salariés, l'« autonomie » masque au contraire une servitude inédite. L'alternative est formellement celle-ci : communisme ou totalitarisme.", "titre_en": "Communism or totalitarianism", "enonce_en": "The neoliberal project remains contradictory: employees \"run crooked\", and the \"obedient free will\" can always take itself back. Its model, the employee-artist whose creativity requires autonomy, leads towards the free association of workers; for most employees, by contrast, \"autonomy\" masks an unprecedented servitude. The alternative is formally this: communism or totalitarianism.", "titre_de": "Kommunismus oder Totalitarismus", "enonce_de": "Das neoliberale Vorhaben bleibt widersprüchlich: Die Angestellten „laufen schief“, und der „gehorsame freie Wille“ kann sich jederzeit zurücknehmen. Sein Vorbild, der Angestellte-Künstler, dessen Kreativität Autonomie verlangt, führt zur freien Assoziation der Arbeitenden; für die meisten Angestellten verbirgt die „Autonomie“ dagegen eine beispiellose Knechtschaft. Die Alternative lautet formal: Kommunismus oder Totalitarismus.", "body_de": "## Argumentation\n\n1. Nach T034 bleibt der Hintergrund der Drohung bestehen; wenige Angestellte können sich rückhaltlos in das Vorhaben einer vollständigen Kolonisierung ihres Wesens (T029) fügen. Das Unternehmen ist doppelt widersprüchlich: durch die Widerspenstigkeit der Angestellten und durch das unaufhebbare Wagnis des „freien Willens“, der „nichts so sehr hasst wie die hierarchische Unterordnung“ (36.1).\n2. Die Arbeitssoziologie sah im Künstler ein Vorbild für „kreative“ Angestellte: Seine Produktivität kommt aus dem Zusammenfallen mit seinem eigenen Begehren. Doch die Verringerung der Hierarchie weiterzutreiben, gibt die Kreativen sich selbst zurück, und sie können entkommen: Bewegt sich der Kapitalismus, fragt Lordon, indem er die produktive Überlegenheit ungezwungener Arbeit anerkennt, nicht „auf die freie Assoziation der Arbeitenden zu“? (36.2).\n3. Der Kapitalismus könnte sich selbst gefährden, wenn er diesen Traum verfolgt, der sein antagonistisches Prinzip in sich trägt: schöpferische und kooperative Freiheit, beratend-demokratische Organisation, „das heißt der verwirklichte Kommunismus“ (36.3).\n4. So weit wird er nicht gehen: Für die meisten geht die Ausweitung des Spielraums mit der Aufrechterhaltung der Kollinearisierung einher; daher die Alternative „Kommunismus oder Totalitarismus“, nach dem Muster von „Sozialismus oder Barbarei“ (36.4). ∎\n\n## Anmerkung\n\nLordon kritisiert manche Analysen, insbesondere *Der neue Geist des Kapitalismus* von Boltanski und Chiapello (Anm. 118), weil sie sowohl vergessen haben, was die Managementdiskurse selbst hinzufügten, als auch die Schmalheit des wirklich betroffenen Randes der Angestellten (36.3).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["T029", "T034"], "citation": "", "loc": ["36.1", "36.2", "36.3", "36.4"], "depends_on": ["T029", "T034"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T034, l'arrière-plan de menace persiste ; peu de salariés peuvent se couler sans réserve dans le projet de colonisation intégrale de leur être (T029). L'entreprise est doublement contradictoire : rétivité des salariés, et aléa irréductible du « libre arbitre », qui « ne hait rien tant que la subordination hiérarchique » (36.1).\n2. La sociologie du travail a vu dans l'artiste un modèle pour les salariés « créatifs » : sa productivité tient à la coïncidence avec son propre désir. Mais à pousser l'allègement hiérarchique, on rend les créatifs à eux-mêmes, et ils peuvent s'échapper : en reconnaissant la supériorité productive du travail non contraint, le capitalisme, demande Lordon, ne chemine-t-il pas « vers la libre association des travailleurs » ? (36.2).\n3. Le capitalisme pourrait se mettre en danger en poursuivant ce rêve, porteur de son principe antagoniste : liberté créative et collaborative, organisation délibérative-démocratique, « soit le communisme réalisé » (36.3).\n4. Il n'ira pas jusque-là : pour la plupart, l'extension de la latitude passe par le maintien de la colinéarisation ; d'où l'alternative « communisme ou totalitarisme », sur le modèle de « socialisme ou barbarie » (36.4). ∎\n\n## Scolie\n\nLordon reproche à certaines analyses, notamment *Le nouvel esprit du capitalisme* de Boltanski et Chiapello (note 118), d'avoir oublié et ce qu'ajoutaient les discours managériaux eux-mêmes, et l'étroitesse de la frange salariale réellement concernée (36.3).", "body_en": "## Argument\n\n1. By T034, the background of threat persists; few employees can slip without reserve into the project of complete colonisation of their being (T029). The firm is doubly contradictory: the recalcitrance of employees, and the irreducible hazard of \"free will\", which \"hates nothing so much as hierarchical subordination\" (36.1).\n2. The sociology of work saw the artist as a model for \"creative\" employees: his productivity comes from coinciding with his own desire. But pushing the lightening of hierarchy returns the creatives to themselves, and they can escape: by recognising the productive superiority of unconstrained work, is capitalism not, Lordon asks, moving \"towards the free association of workers\"? (36.2).\n3. Capitalism could endanger itself by pursuing this dream, which carries its antagonistic principle: creative and collaborative freedom, deliberative-democratic organisation, \"that is, communism realised\" (36.3).\n4. It will not go that far: for most, extending latitude goes with maintaining collinearisation; hence the alternative \"communism or totalitarianism\", on the model of \"socialism or barbarism\" (36.4). ∎\n\n## Scholium\n\nLordon criticises some analyses, notably Boltanski and Chiapello's *The New Spirit of Capitalism* (note 118), for having forgotten both what the managerial discourses themselves added and the narrowness of the fringe of employees really concerned (36.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T029", "T034"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T029", "T034"], "mentions": ["T029", "T034"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T040", "file": "theses/T040.md", "type": "these", "partie": "3", "titre": "La récommune", "enonce": "Toute entreprise qui exige plusieurs personnes est une communauté politique. Retirées les structures du rapport salarial, elle devient association, et la réponse communiste est qu'elle doit être égalitaire. L'inégalité des contributions et la division de la conception et de l'exécution ne s'effaceront que lentement ; mais l'égalité peut être réalisée très vite dans la délibération : c'est la récommune, qui abolit le rapport salarial.", "titre_en": "The récommune", "enonce_en": "Every enterprise that requires several people is a political community. Once the structures of the wage relation are removed, it becomes an association, and the communist answer is that it must be egalitarian. The inequality of contributions and the division between conception and execution will fade only slowly; but equality can be achieved very quickly in deliberation: this is the récommune, which abolishes the wage relation.", "titre_de": "Die Récommune", "enonce_de": "Jedes Unternehmen, das mehrere Personen erfordert, ist eine politische Gemeinschaft. Sind die Strukturen des Lohnverhältnisses beseitigt, wird es zur Assoziation, und die kommunistische Antwort lautet, dass sie egalitär sein muss. Die Ungleichheit der Beiträge und die Teilung von Planung und Ausführung werden nur langsam verblassen; doch die Gleichheit kann in der Beratung sehr schnell erreicht werden: Das ist die Récommune, die das Lohnverhältnis abschafft.", "body_de": "## Argumentation\n\n1. Nach T039 lautet die Alternative „Kommunismus oder Totalitarismus“. „Die Alternativen zu klären, erleichtert die Entscheidungen“, ebenso die Rückkehr zum Problem, dem von T003: Jemand will etwas tun, das mehrere Personen erfordert. Jede Zusammensetzung von Handlungsmächten ist politisch; die Frage ist die Verfassung dieser Gemeinschaft (37.1).\n2. Im Kapitalismus tritt man aus materieller Notwendigkeit in sie ein, unter einer monarchischen Verfassung, der des Herrenbegehrens. Ist die Notwendigkeit aufgehoben, nimmt das Unternehmen die Form der Assoziation an: Seine Mitglieder versammeln sich um einen Vorschlag, in dem sie ihr anderswo gebildetes Begehren wiedererkennen, und nicht unter Drohung oder gezielter Anregung (37.2).\n3. Die kommunistische Position ist, dass in jeder politischen Lage die Gleichheit herrschen muss. Doch die Beiträge sind nicht gleich: Der Text von *Richard III.* steht nicht auf derselben Ebene wie seine Kostüme, und doch braucht man Kostümbildner. Daher „die kommunistische Gleichung“: Welche Gleichheit unter dem Erbe der Arbeitsteilung und der Trennung von Planung und Ausführung (M06)? (37.3-37.4)\n4. Diese Teilung erzeugt bei den einen „Ermächtigung“ und nach S26 bei den anderen „Ohnmächtigmachung“; die Enthierarchisierung der Beiträge wird fern bleiben (37.5).\n5. Doch die Gleichheit kann in der Ordnung der Beratung rasch kommen: volle Teilhaber an einem gemeinsamen Schicksal sein. Das ist die Récommune (D23), die die Abschaffung des Lohnverhältnisses vollzieht (37.5-37.7). ∎\n\n## Anmerkung\n\nDen Horizont gibt Étienne Balibar (Anm. 120): „Möglichst viele denken möglichst viel“ (37.5). Da der Kapitalismus das Wort Unternehmen „durchtränkt“ hat, schlägt Lordon vor, es ihm zurückzugeben, „aber nur, um es sogleich zum Namen dessen zu machen, was man loswerden muss“ (37.7).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D23", "M06", "S26", "T003", "T039"], "citation": "« Être le plus nombreux possible à penser le plus possible »", "loc": ["37.1", "37.2", "37.3", "37.4", "37.5", "37.6", "37.7"], "depends_on": ["T039", "T003", "D23", "M06", "S26"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T039, l'alternative est « communisme ou totalitarisme ». « Épurer les alternatives facilite les choix », et revenir au problème aussi, celui de T003 : quelqu'un veut faire quelque chose qui exige d'être plusieurs. Toute composition de puissances d'agir est politique ; la question est la constitution de cette communauté (37.1).\n2. Sous le capitalisme, on y entre par nécessité matérielle, sous une constitution monarchique, celle du désir-maître. Suspendue la nécessité, l'entreprise prend la forme de l'association : ses membres s'y rassemblent autour d'une proposition dans laquelle ils reconnaissent leur désir, formé ailleurs, et non sous menace ni induction délibérée (37.2).\n3. La position communiste est que l'égalité doit prévaloir en toute situation politique. Les contributions ne sont pourtant pas égales : le texte de *Richard III* n'est pas sur le même plan que ses costumes, et il faut pourtant des costumiers. D'où « l'équation communiste » : quelle égalité sous le legs de la division du travail, et de la séparation de la conception et de l'exécution (M06) ? (37.3-37.4)\n4. Cette division produit « empuissantisation » pour les uns et, par S26, « impuissantisation » pour les autres ; la dé-hiérarchisation contributive restera lointaine (37.5).\n5. Mais l'égalité peut être rapide dans l'ordre délibératif : être pleins associés d'un destin commun. C'est la récommune (D23), qui réalise l'abolition du rapport salarial (37.5-37.7). ∎\n\n## Scolie\n\nL'horizon est donné par Étienne Balibar (note 120) : « Être le plus nombreux possible à penser le plus possible » (37.5). Le capitalisme ayant « imbibé » le mot d'entreprise, Lordon propose de le lui rendre, « mais pour en faire aussitôt le nom de ce avec quoi il faut en finir » (37.7).", "body_en": "## Argument\n\n1. By T039, the alternative is \"communism or totalitarianism\". \"Purifying the alternatives makes choices easier\", and so does returning to the problem, that of T003: someone wants to do something that requires several people. Every composition of powers of acting is political; the question is the constitution of this community (37.1).\n2. Under capitalism, one enters it out of material necessity, under a monarchical constitution, that of the master-desire. With necessity suspended, the enterprise takes the form of association: its members gather around a proposal in which they recognise their desire, formed elsewhere, and not under threat or deliberate induction (37.2).\n3. The communist position is that equality must prevail in every political situation. Yet contributions are not equal: the text of *Richard III* is not on the same plane as its costumes, and yet costume makers are needed. Hence \"the communist equation\": what equality under the legacy of the division of labour, and of the separation of conception and execution (M06)? (37.3-37.4)\n4. This division produces \"empowerment\" for some and, by S26, \"impotentisation\" for the others; contributive de-hierarchisation will remain distant (37.5).\n5. But equality can be swift in the deliberative order: being full associates in a common destiny. This is the récommune (D23), which achieves the abolition of the wage relation (37.5-37.7). ∎\n\n## Scholium\n\nThe horizon is given by Étienne Balibar (note 120): \"As many as possible thinking as much as possible\" (37.5). Capitalism having \"soaked\" the word enterprise, Lordon proposes to give it back to it, \"but only to make it at once the name of what must be done away with\" (37.7).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D23", "M06", "S26", "T003", "T039"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D23", "M06", "S26", "T003", "T039"], "mentions": ["D23", "M06", "S26", "T003", "T039"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T041", "file": "theses/T041.md", "type": "these", "partie": "3", "titre": "La récommune n'épuise pas le communisme", "enonce": "La récommune reste locale : au-delà se posent la question du marché et de la planification, et surtout celle du travail. Le communisme vise aussi l'émancipation d'avec le travail, la reséparation du travail et de l'activité, et n'est pas un programme mais un mouvement réel.", "titre_en": "The récommune does not exhaust communism", "enonce_en": "The récommune remains local: beyond it arise the question of market and planning, and above all that of work. Communism also aims at emancipation from work, the re-separation of work and activity, and is not a programme but a real movement.", "titre_de": "Die Récommune erschöpft den Kommunismus nicht", "enonce_de": "Die Récommune bleibt lokal: Über sie hinaus stellen sich die Frage von Markt und Planung und vor allem die der Arbeit. Der Kommunismus zielt auch auf die Befreiung von der Arbeit, die Wiedertrennung von Arbeit und Tätigkeit, und ist kein Programm, sondern eine wirkliche Bewegung.", "body_de": "## Argumentation\n\n1. Nach T040 befreit die Récommune ihre Mitglieder von der Monarchie des Herrenbegehrens; doch sie ist lokal und lässt die Koordination auf gesellschaftlicher Ebene (Markt oder Planung) und die Frage der Arbeit unberührt (37.8).\n2. Antoine Artous und Moishe Postone haben bei Marx das Ziel der Befreiung *von* der Arbeit wiederentdeckt: Die Arbeit, eine dem Kapitalismus eigene geschichtliche Kategorie, darf nicht alle möglichen Tätigkeiten aufsaugen (37.8).\n3. Nach M05 ist der Kommunismus kein Programm, sondern „die wirkliche Bewegung, die den jetzigen Zustand aufhebt“ (37.8). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["M05", "T040"], "citation": "", "loc": ["37.8"], "depends_on": ["T040", "M05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T040, la récommune affranchit ses membres de la monarchie du désir-maître ; mais elle est locale, et laisse entières la coordination à l'échelle de la société (marché ou planification) et la question du travail (37.8).\n2. Antoine Artous et Moshe Postone ont retrouvé chez Marx la visée de l'émancipation *d'avec* le travail : le travail, catégorie historique propre au capitalisme, ne doit pas absorber toutes les activités possibles (37.8).\n3. Par M05, le communisme n'est pas un programme mais « le mouvement réel qui abolit l'état actuel des choses » (37.8). ∎", "body_en": "## Argument\n\n1. By T040, the récommune frees its members from the monarchy of the master-desire; but it is local, and leaves untouched coordination at the scale of society (market or planning) and the question of work (37.8).\n2. Antoine Artous and Moishe Postone have rediscovered in Marx the aim of emancipation *from* work: work, a historical category proper to capitalism, must not absorb all possible activities (37.8).\n3. By M05, communism is not a programme but \"the real movement that abolishes the present state of things\" (37.8). ∎", "sections_en": ["Argument"], "demo_refs_en": ["M05", "T040"], "sections": ["Argumentation"], "demo_refs": ["M05", "T040"], "mentions": ["M05", "T040"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T042", "file": "theses/T042.md", "type": "these", "partie": "3", "titre": "Les passions séditieuses : le changement sans libre arbitre", "enonce": "Le déterminisme n'exclut pas le changement : le « nouveau » n'est que ce qui surprend notre entendement fini. Dans l'histoire comme ailleurs, les changements sont produits, par les passions et les institutions. Les passions qui maintiennent les hommes sous des rapports peuvent se reconfigurer pour les détruire, sous l'effet d'une affection, souvent le geste de trop du pouvoir : c'est l'indignation.", "titre_en": "Seditious passions: change without free will", "enonce_en": "Determinism does not exclude change: the \"new\" is only what surprises our finite understanding. In history as elsewhere, changes are produced, by passions and institutions. The passions that keep men under relations can reconfigure themselves to destroy them, under the effect of an affection, often power's gesture too many: this is indignation.", "titre_de": "Aufrührerische Leidenschaften: Wandel ohne freien Willen", "enonce_de": "Der Determinismus schließt den Wandel nicht aus: Das „Neue“ ist nur, was unseren endlichen Verstand überrascht. In der Geschichte wie anderswo werden Veränderungen hervorgebracht, durch Leidenschaften und Institutionen. Die Leidenschaften, die die Menschen unter Verhältnissen halten, können sich neu ordnen, um sie zu zerstören, unter der Wirkung einer Affektion, oft der einen Geste der Macht zu viel: das ist die Empörung.", "body_de": "## Beweis\n\n1. Nach T041 und M05 ist der Kommunismus die wirkliche Bewegung, die den jetzigen Zustand aufhebt; woraus kann sie entstehen, wenn der freie Wille eine Fiktion ist? Das Missverständnis, das dem Determinismus abspricht, den Wandel denken zu können (R12), teilen die Lobreden auf den Aufstand und auf den Unternehmer, philosophisch gleichermaßen liberal (38.1-38.2).\n2. Das absolut „Neue“ wäre ein Ereignis ohne Ursache, ein Wunder; nach S11 gibt es das nicht. Das Neue ist nur, was unseren endlichen Verstand überrascht (38.3).\n3. Der Wandel seinerseits bricht kein Gesetz: Sterne sterben, Hügel rutschen. Die sozialen Tatsachen der Verwandlung werden ebenso hervorgebracht, durch konative Energien und ihre Leidenschaften, über Institutionen, die man als kollektive affektive Vorrichtungen sehen kann, fähig, Mengen zu affizieren (38.4).\n4. Diese Leidenschaften ordnen sich unter der Wirkung einer vorausgehenden Affektion neu, oft der einen Geste der Macht zu viel. Die Empörung (S30) führt die Subjekte nach einer Kränkung zusammen, die als alle betreffend empfunden wird; nach S09 ist die Handlungsmacht, die sie bekämpft, umso größer, je größer die gemeinsame Traurigkeit (38.4). ∎\n\n## Anmerkung\n\nDie Matrosen der *Potemkin*, empört über die Verurteilung derer, die gegen verdorbenes Fleisch protestierten; eine missbräuchliche Suspendierung, die eine ganze Fabrik in Aufruhr versetzt; der eine Sozialplan zu viel, der Führungskräfte auf die Straße treibt (38.4).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["M05", "R12", "S09", "S11", "S30", "T041"], "citation": "", "loc": ["38.1", "38.2", "38.3", "38.4"], "depends_on": ["T041", "M05", "S11", "S30", "S09"], "contre": ["R12"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T041 et M05, le communisme est le mouvement réel qui abolit l'état actuel des choses ; d'où peut-il naître, si le libre arbitre est une fiction ? Le contresens qui refuse au déterminisme de penser le changement (R12) est partagé par les apologies du soulèvement et de l'entrepreneur, également libérales en philosophie (38.1-38.2).\n2. Le « nouveau » absolu serait un événement sans cause, un miracle ; par S11, il n'en est pas. Le nouveau n'est que ce qui surprend notre entendement fini (38.3).\n3. Le changement, lui, ne déroge à aucune loi : des étoiles meurent, des collines glissent. Les faits sociaux de transformation sont tout autant produits, par les énergies conatives et leurs passions, à travers les institutions, qu'on peut voir comme des dispositifs affectifs collectifs, capables d'affecter des multitudes (38.4).\n4. Ces passions se reconfigurent sous l'effet d'une affection antécédente, souvent le geste de trop du pouvoir. L'indignation (S30) coalise les sujets après une offense vécue comme les concernant tous ; par S09, plus grande la tristesse commune, plus grande la puissance d'agir qui lutte contre elle (38.4). ∎\n\n## Scolie\n\nLes matelots du *Potemkine* indignés par la condamnation de ceux qui protestaient contre la viande avariée ; une mise à pied abusive qui soulève une usine ; le plan social de trop qui met des cadres dans la rue (38.4).", "body_en": "## Demonstration\n\n1. By T041 and M05, communism is the real movement that abolishes the present state of things; where can it arise from, if free will is a fiction? The misreading that denies determinism the ability to think change (R12) is shared by the apologies for uprising and for the entrepreneur, equally liberal in philosophy (38.1-38.2).\n2. The absolutely \"new\" would be an event without a cause, a miracle; by S11, there is no such thing. The new is only what surprises our finite understanding (38.3).\n3. Change, for its part, breaks no law: stars die, hills slide. Social facts of transformation are just as much produced, by conative energies and their passions, through institutions, which can be seen as collective affective devices, able to affect multitudes (38.4).\n4. These passions reconfigure themselves under the effect of a prior affection, often power's gesture too many. Indignation (S30) brings subjects together after an offence felt as concerning them all; by S09, the greater the common sadness, the greater the power of acting that fights against it (38.4). ∎\n\n## Scholium\n\nThe sailors of the *Potemkin* indignant at the sentencing of those who protested against rotten meat; an abusive suspension that sets a whole factory in revolt; the redundancy plan too many that puts managers out on the street (38.4).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["M05", "R12", "S09", "S11", "S30", "T041"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["M05", "R12", "S09", "S11", "S30", "T041"], "mentions": ["M05", "R12", "S09", "S11", "S30", "T041"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T043", "file": "theses/T043.md", "type": "these", "partie": "3", "titre": "Devenir perpendiculaire", "enonce": "La sédition n'est pas un sursaut du libre arbitre : les individus sont toujours déterminés, mais désormais à autre chose, quand l'indignation l'emporte sur l'obsequium. Elle rouvre l'angle α : désalignés, les conatus n'offrent plus rien à la capture et s'efforcent vers de nouveaux objets de désir ; ils peuvent même s'opposer au désir-maître.", "titre_en": "Becoming perpendicular", "enonce_en": "Sedition is not a start of free will: individuals are always determined, but now to something else, when indignation prevails over obsequium. It reopens the angle α: misaligned, the conatuses offer nothing more to capture and strive towards new objects of desire; they can even oppose the master-desire.", "titre_de": "Senkrecht werden", "enonce_de": "Der Aufruhr ist kein Anfang des freien Willens: Die Individuen sind immer bestimmt, nun aber zu etwas anderem, wenn die Empörung über das Obsequium siegt. Sie öffnet den Winkel α wieder: Abweichend bieten die Conatus nichts mehr zur Vereinnahmung und streben zu neuen Gegenständen des Begehrens; sie können sich sogar dem Herrenbegehren entgegenstellen.", "body_de": "## Argumentation\n\n1. Nach T042 verdankt der Bruch alles dem Determinismus der Leidenschaften, hier zorniger Leidenschaften, „der besten oder am wenigsten schlechten der traurigen Leidenschaften“; eine neue affektive Resultante lässt die Empörung, die in Bewegung setzt, über das Obsequium (D16) siegen, das bleiben ließ (39.4).\n2. Die Empörung kann vereinzelt bleiben oder eine weitere Kristallisation auslösen, wie Lip 1973, von dem man fürchtete, es könne „den ganzen sozialen Körper anstecken“ (39.4).\n3. Sie führt dazu, *ex suo ingenio* zu leben, nach eigenem Gutdünken, das heißt „anders bestimmt“, und die Weisen des Gutdünkens setzen sich oft gemeinsam neu zusammen. Der Chef hat durch einen kleinen Missbrauch Furcht in Hass verwandelt: Er hat seine Eingespannten selbst dekollinearisiert (39.5).\n4. Nach D24 ist Aufruhr Orthogonal-Werden: null Vereinnahmung im rechten Winkel, offene Gegnerschaft bei 180°. Die Senkrechten widerstehen der Ablenkung, indem sie neue Gegenstände des Begehrens erfinden (39.5). ∎\n\n## Anmerkung\n\nAls Motto des Abschnitts *Nicht gesellschaftsfähig* (*The Misfits*): „– Das ist besser als Lohn, oder? – Ja, alles ist besser als Lohn“ (39.1-39.3).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D16", "D24", "T042"], "citation": "", "loc": ["39.4", "39.5"], "depends_on": ["T042", "D16", "D24"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T042, la rupture doit tout au déterminisme des passions, ici des passions colériques, « la meilleure, ou la moins mauvaise, des passions tristes » ; une nouvelle résultante affective fait que l'indignation qui fait bouger l'emporte sur l'obsequium (D16) qui faisait rester (39.4).\n2. L'indignation peut rester isolée ou précipiter une cristallisation plus large, comme Lip en 1973, dont on a craint qu'elle vienne à « véroler tout le corps social » (39.4).\n3. Elle conduit à vivre *ex suo ingenio*, à sa guise, c'est-à-dire « déterminé autrement », et les guises se recomposent souvent collectivement. Le patron, par un abus marginal, a converti la crainte en haine : il a lui-même décolinéarisé ses enrôlés (39.5).\n4. Par D24, la sédition est le devenir orthogonal : capture nulle à l'angle droit, opposition déclarée à 180°. Les perpendiculaires résistent au détournement en inventant de nouveaux objets de désir (39.5). ∎\n\n## Scolie\n\nEn exergue de la section, *The Misfits* : « – C'est toujours mieux qu'un salaire, non ? – Oui, tout est mieux qu'un salaire » (39.1-39.3).", "body_en": "## Argument\n\n1. By T042, the break owes everything to the determinism of the passions, here angry passions, \"the best, or the least bad, of the sad passions\"; a new affective resultant makes the indignation that sets in motion prevail over the obsequium (D16) that made one stay (39.4).\n2. Indignation can remain isolated or precipitate a wider crystallisation, like Lip in 1973, which was feared to \"infect the whole social body\" (39.4).\n3. It leads to living *ex suo ingenio*, as one pleases, that is, \"determined otherwise\", and ways of pleasing often recompose collectively. The boss, by a marginal abuse, has converted fear into hatred: he has himself decollinearised his enlisted (39.5).\n4. By D24, sedition is becoming orthogonal: nil capture at the right angle, declared opposition at 180°. The perpendiculars resist diversion by inventing new objects of desire (39.5). ∎\n\n## Scholium\n\nAs the section's epigraph, *The Misfits*: \"– It's better than wages, isn't it? – Yes, anything's better than wages\" (39.1-39.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D16", "D24", "T042"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D16", "D24", "T042"], "mentions": ["D16", "D24", "T042"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T044", "file": "theses/T044.md", "type": "these", "partie": "3", "titre": "L'aliénation est fixation, l'émancipation défixation", "enonce": "On n'est jamais séparé de sa puissance : elle est toujours en acte, et l'émancipation n'est pas une retrouvaille. Si l'on veut sauver le mot, l'aliénation est la fixation de la puissance sur peu d'objets, celle que produit le désir-maître, même joyeusement ; le devenir orthogonal est un ré-élargissement, un commencement de défixation.", "titre_en": "Alienation is fixation, emancipation defixation", "enonce_en": "One is never separated from one's power: it is always in act, and emancipation is not a reunion. If one wants to save the word, alienation is the fixation of power on few objects, the one the master-desire produces, even joyfully; becoming orthogonal is a re-widening, a beginning of defixation.", "titre_de": "Entfremdung ist Fixierung, Emanzipation Entfixierung", "enonce_de": "Man ist nie von seiner Macht getrennt: Sie ist immer in Akt, und Emanzipation ist keine Wiedervereinigung. Will man das Wort retten, so ist Entfremdung die Fixierung der Macht auf wenige Gegenstände, die das Herrenbegehren hervorbringt, sogar freudig; orthogonal werden ist eine Wiederausweitung, ein Beginn der Entfixierung.", "body_de": "## Argumentation\n\n1. Nach S29 gibt es keine Macht in Reserve: Das Schema der Trennung (R13) widerspricht der Immanenz (40.1).\n2. Selbst unter dem tyrannischsten der Herrenbegehren sind die Individuen nicht von ihrer Macht getrennt: Sie sind bestimmt, sie in einer Richtung zu betätigen, traurig oder freudig (40.2).\n3. Es gibt dennoch ein Mehr und ein Weniger in der Ordnung der Macht. Die leidenschaftliche Ausbeutung (T038) fixiert die Macht auf die Gegenstände des Herrenbegehrens: Das ist Entfremdung im Sinne von D25 (40.2-40.3).\n4. Orthogonal werden (T043) ist daher „Wiederausweitung durch einen Beginn der Entfixierung“ (40.3). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D25", "R13", "S29", "T038", "T043"], "citation": "", "loc": ["40.1", "40.2", "40.3"], "depends_on": ["D25", "S29", "T043", "T038"], "contre": ["R13"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S29, il n'y a pas de puissance en réserve : le schème de la séparation (R13) contredit l'immanence (40.1).\n2. Même sous le plus tyrannique des désirs-maîtres, les individus ne sont pas séparés de leur puissance : ils sont déterminés à l'effectuer dans une direction, tristement ou joyeusement (40.2).\n3. Il y a pourtant du plus et du moins dans l'ordre de la puissance. L'exploitation passionnelle (T038) fixe la puissance sur les objets du désir-maître : c'est l'aliénation au sens de D25 (40.2-40.3).\n4. Le devenir orthogonal (T043) est donc « ré-élargissement par commencement de la défixation » (40.3). ∎", "body_en": "## Argument\n\n1. By S29, there is no power in reserve: the schema of separation (R13) contradicts immanence (40.1).\n2. Even under the most tyrannical of master-desires, individuals are not separated from their power: they are determined to enact it in one direction, sadly or joyfully (40.2).\n3. There is nonetheless more and less in the order of power. Passional exploitation (T038) fixes power on the objects of the master-desire: this is alienation in the sense of D25 (40.2-40.3).\n4. Becoming orthogonal (T043) is therefore \"re-widening through a beginning of defixation\" (40.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D25", "R13", "S29", "T038", "T043"], "sections": ["Argumentation"], "demo_refs": ["D25", "R13", "S29", "T038", "T043"], "mentions": ["D25", "R13", "S29", "T038", "T043"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T045", "file": "theses/T045.md", "type": "these", "partie": "3", "titre": "Le paysage de classe est le dual du paysage passionnel", "enonce": "Passer « symboliquement du côté du capital », c'est avoir le composé affectif salarial déplacé vers la joie : la « subsomption réelle » joyeuse. L'engagement des salariés forme un continuum, de sorte que le paysage de classe, brouillé, reflète le gradient affectif du salariat. Ce gradient n'est pas subjectif : les affects sont objectivement causés.", "titre_en": "The class landscape is the dual of the passional landscape", "enonce_en": "Going over \"symbolically to the side of capital\" means having one's wage-labour affective compound shifted towards joy: joyful \"real subsumption\". Employees' commitment forms a continuum, so that the class landscape, blurred, reflects the affective gradient of wage labour. This gradient is not subjective: affects are objectively caused.", "titre_de": "Die Klassenlandschaft ist das Gegenstück der leidenschaftlichen Landschaft", "enonce_de": "„Symbolisch auf die Seite des Kapitals“ überzugehen heißt, sein affektives Gefüge der Lohnarbeit zur Freude hin verschoben zu sehen: die freudige „reelle Subsumtion“. Das Engagement der Angestellten bildet ein Kontinuum, sodass die verwischte Klassenlandschaft das affektive Gefälle der Lohnarbeit widerspiegelt. Dieses Gefälle ist nicht subjektiv: Die Affekte sind objektiv verursacht.", "body_de": "## Argumentation\n\n1. Der Zusammenstoß von Kapital und Arbeit ist nicht verschwunden, wie die von François Ruffin berichtete Szene zeigt, in der die Arbeiterinnen eines Zulieferers von LVMH der Aktionärsversammlung gegenübertreten (41.1). Doch die ursprüngliche marxsche Theorie ist in Schwierigkeiten, seit die Führungskraft Angestellter geworden ist, und mit der „Ausbreitung der Managementschicht“ (41.1).\n2. Symbolisch auf die Seite des Kapitals überzugehen heißt, sein affektives Gefüge auf die freudige Seite verschoben zu sehen; nach T034 hat dieser Übergang Grade, vom Widerspenstigen bis zum Angestellten, der sein Leben dem Unternehmen widmet. Die Klassenlandschaft wird durch dieses Gefälle des Engagements verwischt, ein Gefälle der Freude (41.2).\n3. Nach S31 sind die Affekte objektiv verursacht: Das subjektive Verhältnis des Angestellten zu seiner Lage ist objektiv hervorgebracht. Die Lohnabhängigkeit als solche erschöpft daher das Lohnleben nicht (R14), wie der angestellte Vorstandschef zeigt, zu dem man ohne jeden Bruch der Kontinuität gelangt (41.3). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["R14", "S31", "T034"], "citation": "« passer symboliquement du côté du capital, c’est avoir la “subsomption réelle” joyeuse »", "loc": ["41.1", "41.2", "41.3"], "depends_on": ["T034", "S31"], "contre": ["R14"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le choc capital-travail n'a pas disparu, comme le montre la scène rapportée par François Ruffin, où les ouvrières d'un sous-traitant de LVMH affrontent l'assemblée des actionnaires (41.1). Mais la théorie marxienne originelle est en difficulté depuis que le dirigeant est salarié et avec la « diffusion cadriste » (41.1).\n2. Passer symboliquement du côté du capital, c'est voir son composé affectif déplacé du côté joyeux ; par T034, ce passage connaît des degrés, du rétif au salarié qui voue sa vie à l'entreprise. Le paysage de classe est brouillé par ce gradient de l'engagement, gradient de la joie (41.2).\n3. Par S31, les affects sont objectivement causés : le rapport subjectif du salarié à sa situation est objectivement produit. La condition salariale en elle-même n'épuise donc pas la vie salariale (R14), comme le montre le PDG salarié, auquel on passe sans solution de continuité (41.3). ∎", "body_en": "## Argument\n\n1. The clash of capital and labour has not disappeared, as the scene reported by François Ruffin shows, where the women workers of an LVMH subcontractor confront the shareholders' meeting (41.1). But the original Marxian theory has been in difficulty since the executive became an employee and with the \"spread of the managerial layer\" (41.1).\n2. Going over symbolically to the side of capital means seeing one's affective compound shifted to the joyful side; by T034, this passage has degrees, from the recalcitrant to the employee who devotes his life to the firm. The class landscape is blurred by this gradient of commitment, a gradient of joy (41.2).\n3. By S31, affects are objectively caused: the employee's subjective relation to his situation is objectively produced. The wage condition in itself therefore does not exhaust wage life (R14), as the salaried CEO shows, to whom one passes without any break in continuity (41.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["R14", "S31", "T034"], "sections": ["Argumentation"], "demo_refs": ["R14", "S31", "T034"], "mentions": ["R14", "S31", "T034"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T046", "file": "theses/T046.md", "type": "these", "partie": "3", "titre": "L'histoire comme mécontentement", "enonce": "L'antagonisme qui peut faire bifurquer l'histoire est affectif : le choc des joyeux qui ne veulent rien changer et des mécontents qui veulent autre chose. Il y a donc toujours des classes, mais des classes affectives. En maltraitant jusqu'aux salariés les plus engagés, le capitalisme, haïssable alors qu'il veut se rendre aimable, tend à reconstituer une classe homogène des mécontents, qui menace de remettre l'histoire en marche.", "titre_en": "History as discontent", "enonce_en": "The antagonism that can make history fork is affective: the clash of the joyful who want nothing changed and the discontented who want something else. There are therefore still classes, but affective classes. By mistreating even the most committed employees, capitalism, hateful when it wants to make itself lovable, tends to reconstitute a homogeneous class of the discontented, which threatens to set history moving again.", "titre_de": "Die Geschichte als Unzufriedenheit", "enonce_de": "Der Antagonismus, der die Geschichte verzweigen lassen kann, ist affektiv: der Zusammenstoß der Freudigen, die nichts geändert haben wollen, und der Unzufriedenen, die etwas anderes wollen. Es gibt also noch Klassen, aber affektive Klassen. Indem er selbst die engagiertesten Angestellten schlecht behandelt, neigt der Kapitalismus, hassenswert, wenn er sich liebenswert machen will, dazu, eine homogene Klasse der Unzufriedenen neu zu bilden, die die Geschichte wieder in Gang zu setzen droht.", "body_de": "## Argumentation\n\n1. Nach T045 hat die Zugehörigkeit zur Lohnarbeit nicht mehr die Homogenität, die ihre Triebkraft ausmachte; die Geschichte, die mit Affekten läuft, verzweigt sich nur durch zornige Affekte (41.4).\n2. Gegen die, die die Seite umblättern wollen (R15), gibt es noch Klassen im Sinne von D26; der Klassenkampf wird zum Kampf affektiver Klassen (41.4).\n3. Die gemeinsamen Affekte haben eine Ursache: das Kapital als soziales Verhältnis und letztlich als Lebensform (41.4).\n4. Der Kapitalismus misshandelt in unerhörtem Maßstab genau in dem Augenblick, in dem er zufriedene Angestellte will; er nährt so den gemeinsamen Affekt, der eine Menge versammeln kann (S32). Erreicht die Misshandlung die engagiertesten Angestellten, so stößt ihre affektive Lage wieder zu ihrer materiellen: Das ist eine „Rückreinigung“ der Klassenlage, und die Klasse der Unzufriedenen droht, die Geschichte wieder in Gang zu setzen (41.5). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D26", "R15", "S32", "T045"], "citation": "« Le mécontentement : voilà la force historique affective capable de faire bifurquer le cours des choses. »", "loc": ["41.4", "41.5"], "depends_on": ["T045", "D26", "S32"], "contre": ["R15"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T045, l'appartenance au salariat n'a plus l'homogénéité qui faisait sa force motrice ; l'histoire, qui fonctionne aux affects, ne bifurque que par les affects colériques (41.4).\n2. Contre ceux qui veulent tourner la page (R15), il y a toujours des classes, au sens de D26 ; la lutte des classes devient lutte de classes affectives (41.4).\n3. Les affects communs ont une cause : le capital comme rapport social, et finalement comme forme de vie (41.4).\n4. Le capitalisme maltraite à des échelles inouïes au moment même où il veut des salariés contents ; il nourrit ainsi l'affect commun qui peut assembler une multitude (S32). Quand la maltraitance touche les salariés les plus engagés, leur situation affective rejoint leur situation matérielle : c'est une « re-purification » de la situation de classe, et la classe des mécontents menace de remettre l'histoire en marche (41.5). ∎", "body_en": "## Argument\n\n1. By T045, belonging to wage labour no longer has the homogeneity that made its driving force; history, which runs on affects, forks only through angry affects (41.4).\n2. Against those who want to turn the page (R15), there are still classes, in the sense of D26; the class struggle becomes a struggle of affective classes (41.4).\n3. Common affects have a cause: capital as a social relation, and ultimately as a form of life (41.4).\n4. Capitalism mistreats on unheard-of scales at the very moment it wants contented employees; it thus feeds the common affect that can assemble a multitude (S32). When mistreatment reaches the most committed employees, their affective situation rejoins their material situation: this is a \"re-purification\" of the class situation, and the class of the discontented threatens to set history moving again (41.5). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D26", "R15", "S32", "T045"], "sections": ["Argumentation"], "demo_refs": ["D26", "R15", "S32", "T045"], "mentions": ["D26", "R15", "S32", "T045"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T047", "file": "theses/T047.md", "type": "these", "partie": "3", "titre": "La capture renaît sans cesse", "enonce": "Même hors du capitalisme, le désir-maître renaît : la division du travail produit du pouvoir, les associés entrent dans l'association inégalement armés et inégalement désirants, et toute action est prise dans une économie de la joie. Les joies extrinsèques, de reconnaissance, sont différentielles et appellent la captation attributive : l'œuvre est collective, mais c'est « mon œuvre ».", "titre_en": "Capture is constantly reborn", "enonce_en": "Even outside capitalism, the master-desire is reborn: the division of labour produces power, associates enter the association unequally armed and unequally desiring, and every action is caught in an economy of joy. Extrinsic joys, those of recognition, are differential and call for attributive capture: the work is collective, but it is \"my work\".", "titre_de": "Die Vereinnahmung entsteht immer neu", "enonce_de": "Selbst außerhalb des Kapitalismus entsteht das Herrenbegehren neu: Die Arbeitsteilung bringt Macht hervor, die Teilhaber treten ungleich gerüstet und ungleich begehrend in die Assoziation ein, und jede Handlung ist in eine Ökonomie der Freude eingebunden. Die extrinsischen Freuden, die der Anerkennung, sind differenziell und verlangen nach zurechnender Vereinnahmung: Das Werk ist gemeinsam, aber es ist „mein Werk“.", "body_de": "## Argumentation\n\n1. Nach T046 kann sich eine Klasse der Unzufriedenen neu bilden; doch sollte es ihr gelingen, den Kapitalismus zu stürzen, wäre sie das Herrenbegehren wahrscheinlich nicht los. Nach M06 sondert die Arbeitsteilung Macht ab; das Privateigentum abzuschaffen ist notwendig, aber nicht hinreichend (R16): Das Staatseigentum in der UdSSR veränderte die Produktionsverhältnisse nicht (42.1).\n2. Auch Spinoza interessiert sich für die Arbeitsteilung (*Theologisch-politischer Traktat*, V): Nach S34 bringt sie die Menschen zusammen, doch sie treten ungleich gerüstet in sie ein, was alle Vereinnahmungen begründet, und ungleich begehrend (42.2).\n3. Nach T005 ist das Begehren an seinem Gegenstand interessiert, das heißt auf der Suche nach Freude: Der monetäre Gewinn ist nur ein Fall einer allgemeinen Ökonomie der Freude. Die Ökonomie der intrinsischen Freude ist nicht rival; die der extrinsischen Freude, der Anerkennung, ist differenziell (42.2).\n4. Nach S35 betrachtet jeder gern seine Macht und stellt sie gern zur Schau: daher die Vereinnahmung der extrinsischen Freuden gemeinsamen Handelns. Wer mehr begehrt, ist „der mögliche Aneigner“, und „die Dinge in die Hand nehmen“ kündigt das Zugreifen an (42.2-42.3). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["M06", "R16", "S34", "S35", "T005", "T046"], "citation": "« L’œuvre est collective, mais c’est mon œuvre… »", "loc": ["42.1", "42.2", "42.3"], "depends_on": ["T046", "M06", "S34", "S35", "T005"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T046, une classe des mécontents peut se reconstituer ; mais, parviendrait-elle à renverser le capitalisme, elle n'en aurait vraisemblablement pas fini avec le désir-maître. Par M06, la division du travail sécrète du pouvoir ; abolir la propriété privée est nécessaire mais pas suffisant (R16) : la propriété étatique en URSS n'a pas changé les rapports de production (42.1).\n2. Spinoza s'intéresse lui aussi à la division du travail (*Traité théologico-politique*, V) : par S34, elle rapproche les hommes, mais ils y entrent inégalement armés, ce qui fonde toutes les captures, et inégalement désirants (42.2).\n3. Par T005, le désir est intéressé à son objet, c'est-à-dire en quête de joie : le profit monétaire n'est qu'un cas d'une économie générale de la joie. L'économie de la joie intrinsèque est non rivale ; celle de la joie extrinsèque, de la reconnaissance, est différentielle (42.2).\n4. Par S35, chacun aime contempler sa puissance et la faire voir : d'où la captation des joies extrinsèques de l'action collective. Celui qui désire davantage est « l'appropriateur en puissance », et « prendre les choses en mains » est une annonce de pronation (42.2-42.3). ∎", "body_en": "## Argument\n\n1. By T046, a class of the discontented can reconstitute itself; but, should it manage to overthrow capitalism, it would probably not be done with the master-desire. By M06, the division of labour secretes power; abolishing private property is necessary but not sufficient (R16): state ownership in the USSR did not change the relations of production (42.1).\n2. Spinoza too is interested in the division of labour (*Theological-Political Treatise*, V): by S34, it brings men together, but they enter it unequally armed, which grounds all captures, and unequally desiring (42.2).\n3. By T005, desire is interested in its object, that is, in search of joy: monetary profit is only one case of a general economy of joy. The economy of intrinsic joy is non-rival; that of extrinsic joy, of recognition, is differential (42.2).\n4. By S35, everyone likes to contemplate his power and to display it: hence the capture of the extrinsic joys of collective action. Whoever desires more is \"the potential appropriator\", and \"taking things in hand\" announces grabbing (42.2-42.3). ∎", "sections_en": ["Argument"], "demo_refs_en": ["M06", "R16", "S34", "S35", "T005", "T046"], "sections": ["Argumentation"], "demo_refs": ["M06", "R16", "S34", "S35", "T005", "T046"], "mentions": ["M06", "R16", "S34", "S35", "T005", "T046"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T048", "file": "theses/T048.md", "type": "these", "partie": "3", "titre": "Le communisme véritable est un horizon", "enonce": "Le communisme doit compter, comme le capitalisme, avec la servitude passionnelle. Le communisme véritable, la non-rivalité des vrais biens, supposerait des hommes conduits par la raison ; il est un horizon, une idée régulatrice. La sortie du capitalisme ne fait sortir ni de la servitude passionnelle, ni de la violence, ni des rapports de dépendance : il faut renoncer aux illusions de la société radieuse.", "titre_en": "True communism is a horizon", "enonce_en": "Communism must reckon, like capitalism, with passional servitude. True communism, the non-rivalry of true goods, would presuppose men guided by reason; it is a horizon, a regulative idea. Leaving capitalism leads out neither of passional servitude, nor of violence, nor of relations of dependence: the illusions of the radiant society must be given up.", "titre_de": "Der wahre Kommunismus ist ein Horizont", "enonce_de": "Der Kommunismus muss wie der Kapitalismus mit der leidenschaftlichen Knechtschaft rechnen. Der wahre Kommunismus, die Nichtrivalität der wahren Güter, würde von der Vernunft geleitete Menschen voraussetzen; er ist ein Horizont, eine regulative Idee. Den Kapitalismus zu verlassen, führt weder aus der leidenschaftlichen Knechtschaft heraus noch aus der Gewalt noch aus den Abhängigkeitsverhältnissen: Man muss die Illusionen der strahlenden Gesellschaft aufgeben.", "body_de": "## Argumentation\n\n1. Nach S37 muss man die Menschen nehmen, wie sie sind: Der Kommunismus muss mit der „Macht der Affekte“ und der allgemeinen „menschlichen Knechtschaft“ rechnen (42.4).\n2. Nach S36 endete die leidenschaftliche Ausbeutung, wenn die Menschen ihre gemeinsamen Begehren auf nicht rivale Güter richteten, wie die Vernunft; nach S34 erstreben von der Vernunft geleitete Menschen nichts für sich, was sie nicht für die anderen begehren: „die höchste Formel des Kommunismus“ (42.4, 43.1).\n3. Doch diese Hypothese ist keine geringe. Nach T047 entsteht die Vereinnahmung aus dem leidenschaftlichen Leben neu, das vor dem Kapitalismus bestand und ihn überleben wird; die Struktur der Vereinnahmung ist „ein sehr starker Anziehungspunkt“ (43.1).\n4. Nach S39 schließt der Conatus weder Konflikte noch Hass aus: Von der Ausrottung der Gewalt und dem Absterben der Politik zu träumen (R16), ist eine Phantasmagorie; der Horizont ist, ihre am wenigsten zerstörerischen Formen zu finden, ohne die Abhängigkeiten abzuschaffen, und seien es nur die der Liebe (43.3). ∎\n\n## Anmerkung\n\nPascals Schiffbrüchiger, von den Bewohnern der Insel, an die er gespült wird, zum König gemacht, zeigt, dass die Vereinnahmung selbst dem zufällt, der nicht um sie gebeten hat (43.1). Die *Ethik* zeichnet den Weg der Vernunft, doch „der Weg ist steil“ (42.4, Anm. 154).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["R16", "S34", "S36", "S37", "S39", "T047"], "citation": "« le communisme est une longue patience, un effort continu, et peut-être seulement, pour parler encore une fois comme Kant, une idée régulatrice »", "loc": ["42.4", "43.1", "43.3"], "depends_on": ["T047", "S36", "S37", "S34", "S39"], "contre": ["R16"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par S37, il faut prendre les hommes tels qu'ils sont : le communisme doit compter avec la « force des affects » et l'universelle « servitude humaine » (42.4).\n2. Par S36, l'exploitation passionnelle prendrait fin si les hommes dirigeaient leurs désirs communs vers des biens non rivaux, comme la raison ; par S34, les hommes conduits par la raison ne poursuivent rien pour eux qu'ils ne désirent pour les autres : « la formule la plus haute du communisme » (42.4, 43.1).\n3. Mais cette hypothèse n'est pas petite. Par T047, la capture renaît de la vie passionnelle, qui préexistait au capitalisme et lui survivra ; la structure de la capture est « un attracteur très puissant » (43.1).\n4. Par S39, le conatus n'exclut ni conflits ni haines : rêver l'éradication de la violence et l'extinction du politique (R16) est une fantasmagorie ; l'horizon est d'en trouver les formes les moins destructrices, sans abolir les dépendances, ne serait-ce qu'amoureuses (43.3). ∎\n\n## Scolie\n\nLe naufragé de Pascal, fait roi par les habitants de l'île où il échoue, montre que la capture échoit même à qui ne l'a pas demandée (43.1). L'*Éthique* trace la voie de la raison, mais « la voie est escarpée » (42.4, note 154).", "body_en": "## Argument\n\n1. By S37, men must be taken as they are: communism must reckon with the \"strength of the affects\" and universal \"human bondage\" (42.4).\n2. By S36, passional exploitation would end if men directed their common desires towards non-rival goods, like reason; by S34, men guided by reason seek nothing for themselves that they do not desire for others: \"the highest formula of communism\" (42.4, 43.1).\n3. But this hypothesis is no small one. By T047, capture is reborn from passional life, which pre-existed capitalism and will outlive it; the structure of capture is \"a very powerful attractor\" (43.1).\n4. By S39, the conatus excludes neither conflicts nor hatreds: dreaming of the eradication of violence and the withering away of politics (R16) is a phantasmagoria; the horizon is to find their least destructive forms, without abolishing dependences, if only those of love (43.3). ∎\n\n## Scholium\n\nPascal's castaway, made king by the inhabitants of the island where he washes up, shows that capture falls even to one who did not ask for it (43.1). The *Ethics* traces the path of reason, but \"the path is steep\" (42.4, note 154).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["R16", "S34", "S36", "S37", "S39", "T047"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["R16", "S34", "S36", "S37", "S39", "T047"], "mentions": ["R16", "S34", "S36", "S37", "S39", "T047"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T049", "file": "theses/T049.md", "type": "these", "partie": "3", "titre": "Tous les régimes passionnels ne se valent pas", "enonce": "Tout ne s'équivaut pas du côté des passions : les institutions déterminent des possibilités contrastées de puissance, de désir et de joie. Une multitude conduite par l'espoir cultive la vie ; par la crainte, elle évite la mort. Le progrès, c'est l'enrichissement de la vie en affects joyeux qui élargissent les effectuations de puissance ; la démocratie radicale, que le Traité politique laisse inachevée, en est l'horizon.", "titre_en": "Not all passional regimes are equal", "enonce_en": "Not everything is equivalent on the side of the passions: institutions determine contrasting possibilities of power, desire and joy. A multitude led by hope cultivates life; by fear, it avoids death. Progress is the enrichment of life in joyful affects that widen the enactments of power; radical democracy, which the Political Treatise leaves unfinished, is its horizon.", "titre_de": "Nicht alle leidenschaftlichen Regime sind gleichwertig", "enonce_de": "Auf der Seite der Leidenschaften ist nicht alles gleichwertig: Die Institutionen bestimmen gegensätzliche Möglichkeiten der Macht, des Begehrens und der Freude. Eine von Hoffnung geleitete Menge pflegt das Leben; eine von Furcht geleitete meidet den Tod. Fortschritt ist die Bereicherung des Lebens an freudigen Affekten, die die Betätigungen der Macht erweitern; die radikale Demokratie, die der Politische Traktat unvollendet lässt, ist sein Horizont.", "body_de": "## Argumentation\n\n1. Nach T048 muss man den „großen Abend“ aufgeben, nicht aber den Fortschritt: Die leidenschaftliche Knechtschaft verhindert nicht die Vielfalt institutioneller Einrichtungen, und nicht alle sind gleichwertig (43.2).\n2. Nach S38 ist das Joch trauriger Affekte nicht weniger ein Joch als das freudiger Affekte, „aber es ist … traurig“: Die Furcht fesselt an die niedrigsten Stufen der Macht; so werden die Regime des kollektiven leidenschaftlichen Lebens geordnet (43.2).\n3. Der Übergang vom Zwang zu freudigen Unterwerfungen ist Fortschritt, aber zweiter Ordnung, innerhalb desselben: Die Vereinnahmung fixiert die Mächte weiterhin (T044). Sich von den Herrenbegehren zu befreien heißt, das Spektrum ihrer Betätigungen wieder zu öffnen (43.4).\n4. Die Frage des *Politischen Traktats* ist die nach den Einrichtungen, die unsere Mächte des Handelns und Denkens steigern; alle *potestas* geht aus der *potentia multitudinis* hervor, und allein die Demokratie, „in jeder Hinsicht absolut“ (S40), ordnet die Wiedervereinigung der Menge mit ihrer Macht (43.4).\n5. Fortschritt ist daher die Bereicherung des Lebens an freudigen Affekten, und unter ihnen an denen, die unsere Betätigungen der Macht erweitern und sie auf das wahre Gut ausrichten, ein menschliches Leben (S16) (43.4). ∎\n\n## Anmerkung\n\nDas sind die letzten Worte des Buches: „darunter verstehe ich ein menschliches Leben“ (43.4). Lordon räumt in einer Anmerkung (Anm. 163) ein, hier für den sozialen Körper das Schema der Ent-Trennung aufzunehmen, das er für die Individuen beiseitegelassen hatte.", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["S16", "S38", "S40", "T044", "T048"], "citation": "« Si l’idée de progrès a un sens, il ne peut être que l’enrichissement de la vie en affects joyeux »", "loc": ["43.2", "43.4"], "depends_on": ["T048", "S38", "S16", "S40", "T044"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T048, il faut renoncer au grand soir, mais pas aux progrès : la servitude passionnelle n'empêche pas la diversité des agencements institutionnels, et tous ne se valent pas (43.2).\n2. Par S38, le joug des affects tristes n'est pas moins joug que celui des affects joyeux, « mais il est… triste » : la crainte rive aux plus bas niveaux de puissance ; c'est par là que se hiérarchisent les régimes de la vie passionnelle collective (43.2).\n3. Le passage de la coercition aux assujettissements joyeux est un progrès, mais de second ordre, au sein du même : la capture fixe toujours les puissances (T044). Se libérer des désirs-maîtres, c'est rouvrir le spectre de leurs effectuations (43.4).\n4. La question du *Traité politique* est celle des agencements qui maximisent nos puissances d'agir et de penser ; toute *potestas* émane de la *potentia multitudinis*, et seule la démocratie, « absolu en tout » (S40), organise les retrouvailles de la multitude et de sa puissance (43.4).\n5. Le progrès est donc l'enrichissement de la vie en affects joyeux, et parmi eux en ceux qui élargissent nos effectuations de puissance et les orientent vers le vrai bien, une vie humaine (S16) (43.4). ∎\n\n## Scolie\n\nCe sont les derniers mots du livre : « j'entends par là une vie humaine » (43.4). Lordon reconnaît en note (note 163) qu'il reprend ici, pour le corps social, le schème de la dé-séparation qu'il avait écarté pour les individus.", "body_en": "## Argument\n\n1. By T048, the \"grand soir\" must be given up, but not progress: passional servitude does not prevent the diversity of institutional arrangements, and not all are equal (43.2).\n2. By S38, the yoke of sad affects is no less a yoke than that of joyful affects, \"but it is… sad\": fear rivets to the lowest levels of power; this is how the regimes of collective passional life are ranked (43.2).\n3. The passage from coercion to joyful subjections is progress, but of the second order, within the same: capture still fixes powers (T044). Freeing oneself from master-desires means reopening the spectrum of their enactments (43.4).\n4. The question of the *Political Treatise* is that of the arrangements that maximise our powers of acting and thinking; all *potestas* emanates from the *potentia multitudinis*, and only democracy, \"absolute in every respect\" (S40), organises the reunion of the multitude with its power (43.4).\n5. Progress is therefore the enrichment of life in joyful affects, and among them in those that widen our enactments of power and orient them towards the true good, a human life (S16) (43.4). ∎\n\n## Scholium\n\nThese are the last words of the book: \"by that I mean a human life\" (43.4). Lordon acknowledges in a note (note 163) that he takes up here, for the social body, the schema of de-separation he had set aside for individuals.", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S16", "S38", "S40", "T044", "T048"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S16", "S38", "S40", "T044", "T048"], "mentions": ["S16", "S38", "S40", "T044", "T048"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "R01", "file": "refutees/R01.md", "type": "refutee", "partie": "1", "titre": "La servitude volontaire", "enonce": "Le dominé serait serf faute de vouloir assez fort son affranchissement : sa servitude serait voulue, et une volonté plus ferme suffirait à la défaire.", "titre_en": "Voluntary servitude", "enonce_en": "The dominated would be in bondage for want of willing their liberation strongly enough: their servitude would be willed, and a firmer will would suffice to undo it.", "titre_de": "Die freiwillige Knechtschaft", "enonce_de": "Die Beherrschten wären geknechtet, weil sie ihre Befreiung nicht stark genug wollen: Ihre Knechtschaft wäre gewollt, und ein festerer Wille würde genügen, sie aufzuheben.", "body_de": "## Wie Lordon sie darstellt\n\nEine Formel, die man mangels anderer schließlich „wiederkäut“ (01.8): die von La Boétie, die „die Zeit zum Leseschlüssel des Lohnverhältnisses machen möchte“ (08.2). Lordon unterscheidet den Titel von der These: La Boéties These „ist mehr wert als ihr Titel“ (08.2, 10.1). Die Formel unterstellt ein mit freiem Willen begabtes Individuum-Subjekt, dessen Handlungen die Wirkung eines souveränen Wollens wären. Sie bleibt dann ein unlösbares Rätsel (wie kann man einen unerwünschten Zustand wollen?) und kann nur als politischer Aufruf zur Erhebung der Gewissen dienen, nicht als Verständnis aus den Ursachen (08.2).", "sections_de": ["Wie Lordon sie darstellt"], "demo_refs_de": [], "citation": "« oxymore sans doute suggestif mais qui, en soi […], cache à peine ses malfaçons »", "loc": ["01.8", "08.2", "08.4", "10.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Telle que Lordon la présente\n\nUne formule qu'on finit par « ressasser » faute d'autre chose (01.8) : celle de La Boétie, que « l
