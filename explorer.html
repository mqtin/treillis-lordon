ut passional, and it is universal (08.4). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["R01", "S07", "T006", "T007", "T008"], "sections": ["Démonstration"], "demo_refs": ["R01", "S07", "T006", "T007", "T008"], "mentions": ["R01", "S07", "T006", "T007", "T008"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T010", "file": "theses/T010.md", "type": "these", "partie": "1", "titre": "La dépendance du capital et du travail est asymétrique", "enonce": "La symétrie formelle du capital et du travail cède devant deux faits : la force de travail est fongible, et le capital peut attendre alors que le salarié doit se reproduire chaque jour. Quant aux places de capitaliste et de salarié, c'est l'accès à l'argent qui les distribue : en flux pour le salarié, ce qui ne permet que de se reproduire ; en stock pour le capitaliste, ce qui permet l'avance et l'accumulation.", "titre_en": "The dependence of capital and labour is asymmetrical", "enonce_en": "The formal symmetry of capital and labour gives way before two facts: labour power is fungible, and capital can wait whereas the employee must reproduce himself every day. As for the positions of capitalist and employee, it is access to money that distributes them: as a flow for the employee, which only allows him to reproduce himself; as a stock for the capitalist, which allows advances and accumulation.", "titre_de": "Die Abhängigkeit von Kapital und Arbeit ist asymmetrisch", "enonce_de": "Die formale Symmetrie von Kapital und Arbeit weicht zwei Tatsachen: Arbeitskraft ist austauschbar, und das Kapital kann warten, während der Angestellte sich jeden Tag reproduzieren muss. Die Stellungen von Kapitalist und Angestelltem verteilt der Zugang zum Geld: als Fluss für den Angestellten, der ihm nur erlaubt, sich zu reproduzieren; als Bestand für den Kapitalisten, der Vorschüsse und Akkumulation erlaubt.", "body_de": "## Argumentation\n\n1. Nach T006 hält der Arbeitgeber als Geldgeber den Schlüssel zum Grundbegehren des Angestellten (09.1).\n2. Man wendet ein (R04), auch der Arbeitgeber hänge von der Arbeitskraft ab. Doch er braucht *irgendeine* Arbeitskraft, nicht die *dieser Person*: Die große Zahl der Angestellten macht sie austauschbar (09.2).\n3. Beherrscht ist derjenige der beiden, der die Erlangung seines Gegenstands am wenigsten aufschieben kann; und das Kapital hat Zeit zu warten. Die wirkliche Lage verzerrt also die formale Symmetrie zur Abhängigkeit und zur Herrschaft (09.2).\n4. Vorgelagert braucht der Kapitalist einen Bestand an Eigenmitteln, den der Bankier nur ergänzt: Die Weise des Zugangs zum Geld durch Lohn ist der Fluss, die finanzielle Weise der Bestand, der allein die Schwelle der Akkumulation zu überschreiten erlaubt (09.3).\n5. Wer nur seine Arbeitskraft hat, ist von Anfang an aus dem Rennen: Antoine Doinel, der davon träumt, ein Möbelstück zu stehlen, um anzufangen, entdeckt den Einbruch der ursprünglichen Akkumulation (M02) wieder. Die anderen bleiben an das Grundbegehren (D07) gefesselt, dessen einzige angebotene Befriedigung die Einspannung durch Lohn ist (09.4). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D07", "M02", "R04", "T006"], "citation": "« C’est une question de fric au départ »", "loc": ["09.1", "09.2", "09.3", "09.4"], "depends_on": ["T006", "D07", "M02"], "contre": ["R04"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T006, l'employeur, pourvoyeur d'argent, tient la clé du désir basal du salarié (09.1).\n2. On objecte (R04) que l'employeur dépend lui aussi de la force de travail. Mais il lui faut *de la* force de travail, non *sa* force de travail : le grand nombre des employés la rend fongible (09.2).\n3. Est dominé celui des deux qui peut le moins différer l'obtention de son objet ; or c'est le capital qui a le temps d'attendre. La situation réelle distord donc la symétrie formelle en dépendance, et en domination (09.2).\n4. En amont, le capitaliste a besoin d'un stock de fonds propres, que le banquier ne fait que compléter : le mode salarial d'accès à l'argent est le flux, le mode financier est le stock, qui seul permet de franchir le seuil de l'accumulation (09.3).\n5. Ceux qui n'ont que leur force de travail sont hors course dès le départ : Antoine Doinel, qui songe à voler un meuble pour se lancer, retrouve l'effraction de l'accumulation primitive (M02). Les autres restent rivés au désir basal (D07), dont la seule satisfaction offerte est l'enrôlement salarial (09.4). ∎", "body_en": "## Argument\n\n1. By T006, the employer, provider of money, holds the key to the employee's basic desire (09.1).\n2. It is objected (R04) that the employer also depends on labour power. But he needs *some* labour power, not *this person's* labour power: the large number of employees makes it fungible (09.2).\n3. The dominated one is whichever of the two can least defer obtaining its object; and it is capital that has time to wait. The real situation thus distorts the formal symmetry into dependence, and into domination (09.2).\n4. Upstream, the capitalist needs a stock of own funds, which the banker only supplements: the wage mode of access to money is the flow, the financial mode is the stock, which alone allows one to cross the threshold of accumulation (09.3).\n5. Those who have only their labour power are out of the race from the start: Antoine Doinel, who dreams of stealing a piece of furniture to get started, rediscovers the break-in of primitive accumulation (M02). The others remain riveted to basic desire (D07), whose only offered satisfaction is wage enlistment (09.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D07", "M02", "R04", "T006"], "sections": ["Argumentation"], "demo_refs": ["D07", "M02", "R04", "T006"], "mentions": ["D07", "M02", "R04", "T006"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T011", "file": "theses/T011.md", "type": "these", "partie": "1", "titre": "Domination à tous les étages", "enonce": "La grande entreprise diffracte la domination principale en une chaîne hiérarchique de dominations secondaires, où chacun est à la fois subordonné et subordonnant : une structure hiérarchique de la servitude passionnelle, chaîne montante de dépendance et descendante d'instrumentalisation. L'allongement de ces chaînes règle les conduites : il impose de ménager les intermédiaires, et produit la retenue, le compromis et le calcul.", "titre_en": "Domination at every level", "enonce_en": "The large firm diffracts the principal domination into a hierarchical chain of secondary dominations, where each is at once subordinate and subordinating: a hierarchical structure of passional servitude, a rising chain of dependence and a descending one of instrumentalisation. The lengthening of these chains regulates conduct: it requires sparing intermediaries, and produces restraint, compromise and calculation.", "titre_de": "Herrschaft auf allen Stufen", "enonce_de": "Das Großunternehmen bricht die Hauptherrschaft in eine Hierarchiekette sekundärer Herrschaften auf, in der jeder zugleich untergeordnet und unterordnend ist: eine hierarchische Struktur leidenschaftlicher Knechtschaft, eine aufsteigende Kette der Abhängigkeit und eine absteigende der Instrumentalisierung. Die Verlängerung dieser Ketten regelt das Verhalten: Sie verlangt, die Zwischenglieder zu schonen, und erzeugt Zurückhaltung, Kompromiss und Kalkül.", "body_de": "## Argumentation\n\n1. Das Gegenüber von Unternehmer und Proletariern (T007) ist Stufenstrukturen gewichen, in denen jeder das Lohnverhältnis in der Weise des Untergeordnet-Unterordnenden lebt (10.1).\n2. Hier ist La Boéties These mehr wert als ihr Titel: Er beschreibt eine *hierarchische Struktur der Knechtschaft*, in der die Individuen einzeln durch ihre Interessen gehalten werden. Ihr Umsturz kann nicht in der Reichweite eines „Willens“ liegen (T009), da auf jeder Stufe die Herrschaft umso stärker ist, als der örtliche Herrschende selbst beherrscht ist (10.1).\n3. Norbert Elias, „Fortsetzer La Boéties“, zeigt, dass die Verlängerung der Abhängigkeitsketten die Regelung des Verhaltens hervorruft: Spektakulär zu brechen heißt, mit dem zu brechen, über den die Verfolgung der begehrten Güter geht (10.2).\n4. Der Weg vom begehrenden Subjekt zum begehrten Gegenstand wird zu einer strategischen Vermittlung im Sinne von D10, ob die Handlung berechnet oder von verkörperten Gewohnheiten geleitet ist (10.2). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["D10", "T007", "T009"], "citation": "", "loc": ["10.1", "10.2"], "depends_on": ["T007", "T009", "D10"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le face-à-face du patron et des prolétaires (T007) a cédé la place à des structures feuilletées, où chacun vit le rapport salarial sur le mode subordonné-subordonnant (10.1).\n2. La thèse de La Boétie vaut ici mieux que son titre : il décrit une *structure hiérarchique de la servitude*, où les individus sont tenus séparément par leurs intérêts. Son renversement ne peut être à la portée d'une « volonté » (T009), puisqu'à chaque étage la domination est d'autant plus intense que le dominant local est lui-même dominé (10.1).\n3. Norbert Elias, « continuateur de La Boétie », montre que l'allongement des chaînes de dépendance incite à réguler les comportements : rompre avec éclat, c'est rompre avec celui par qui passe la poursuite des biens convoités (10.2).\n4. Le chemin du sujet désirant à l'objet désiré devient une médiation stratégique au sens de D10, que l'action soit calculée ou conduite par des habitudes incorporées (10.2). ∎", "body_en": "## Argument\n\n1. The face-to-face of the boss and the proletarians (T007) has given way to layered structures, where each lives the wage relation in the mode subordinate-subordinating (10.1).\n2. Here La Boétie's thesis is worth more than its title: he describes a *hierarchical structure of servitude*, where individuals are held separately by their interests. Its overturning cannot be within reach of a \"will\" (T009), since at each level domination is all the more intense as the local dominant is himself dominated (10.1).\n3. Norbert Elias, \"continuer of La Boétie\", shows that the lengthening of chains of dependence prompts the regulation of behaviour: to break off spectacularly is to break with the one through whom the pursuit of coveted goods passes (10.2).\n4. The path from the desiring subject to the desired object becomes a strategic mediation in the sense of D10, whether the action is calculated or guided by embodied habits (10.2). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D10", "T007", "T009"], "sections": ["Argumentation"], "demo_refs": ["D10", "T007", "T009"], "mentions": ["D10", "T007", "T009"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T012", "file": "theses/T012.md", "type": "these", "partie": "1", "titre": "La crainte et la violence se propagent le long des chaînes de dépendance", "enonce": "Toute pression venue d'en haut descend en cascade le long de la hiérarchie. Le désir d'argent restant impérieux tandis que ses conditions se durcissent, la crainte se diffuse et pousse chacun à un surcroît d'activité, qu'il reporte en violence sur ceux qui dépendent de lui. Contrainte actionnariale, concurrence et sous-traitance propagent ainsi la violence dans les entreprises et entre elles.", "titre_en": "Fear and violence spread along the chains of dependence", "enonce_en": "Any pressure from above cascades down the hierarchy. With the desire for money still imperious while its conditions harden, fear spreads and pushes each to extra activity, which he passes on as violence to those who depend on him. Shareholder constraint, competition and subcontracting thus spread violence within firms and between them.", "titre_de": "Furcht und Gewalt breiten sich entlang der Abhängigkeitsketten aus", "enonce_de": "Jeder Druck von oben fällt die Hierarchie hinab. Da das Begehren nach Geld gebieterisch bleibt, während seine Bedingungen sich verschärfen, breitet sich die Furcht aus und treibt jeden zu zusätzlicher Tätigkeit, die er als Gewalt an die weitergibt, die von ihm abhängen. Aktionärszwang, Wettbewerb und Zulieferung verbreiten so Gewalt in den Unternehmen und zwischen ihnen.", "body_de": "## Beweis\n\n1. Nach T011 verlangt auf jeder Sprosse der Erhalt der eigenen Stellung die von der Sprosse darüber geforderte Anstrengung; ein Druck von oben breitet sich daher auf alle Stufen aus, und die Wahrscheinlichkeit, ihm zu genügen, sinkt (11.1).\n2. Nach S08 begleitet die Furcht das Begehren, sobald sein Gegenstand ungewiss ist. Bei weiterhin starkem Begehren und härteren Bedingungen kippt das Gleichgewicht von Hoffnung und Furcht zur Furcht (11.1).\n3. Nach S09 bewirkt die Furcht wie jeder traurige Affekt einen Überschuss an Handlungsmacht, um sich von ihr zu befreien; in einem Herrschaftskontext übersetzt sich dieser Überschuss in Gewalt gegen die, die man beherrschen kann, und gegen sich selbst (11.1).\n4. Der Aktionärsschock wird auf jeder Sprosse in Zwischenziele übersetzt; Berichtswesen, interner Wettbewerb und die Drohung der Herabstufung erhöhen die Strafe für das Scheitern, also die Furcht (11.2).\n5. Auch die Beziehungen zwischen Unternehmen bilden Abhängigkeitsketten: Die Zulieferung wirft Organisationen um ihr Überleben gegeneinander, und jede gibt ihren Zwang an die weiter, die von ihr abhängen (11.2-11.3). ∎\n\n## Anmerkung\n\nDas Beispiel eines früheren Chefs eines mittelständischen Unternehmens (*Ma mondialisation*, Dokumentarfilm von Gilles Perret, Anm. 27): Auftraggeber schicken gezielt junge Führungskräfte, verletzlicher und daher zu ökonomischer Gewalt eher geneigt, um Preissenkungen zu verlangen (11.3).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["S08", "S09", "T011"], "citation": "« l’implacable logique qui veut que les violences exercées soient proportionnelles aux violences subies »", "loc": ["11.1", "11.2", "11.3"], "depends_on": ["T011", "S08", "S09"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T011, à chaque échelon, conserver sa position exige l'effort réclamé par l'échelon supérieur ; une pression venue d'en haut se propage donc à tous les étages, et la probabilité d'y satisfaire diminue (11.1).\n2. Par S08, la crainte accompagne le désir dès que son objet est incertain. Le désir restant intense et ses conditions plus difficiles, la balance de l'espoir et de la crainte penche vers la crainte (11.1).\n3. Par S09, comme tout affect triste, la crainte induit un surcroît de puissance d'agir pour s'en défaire ; dans un contexte de domination, ce surcroît se traduit en violence exercée sur ceux qu'on peut dominer, et sur soi (11.1).\n4. Le choc actionnarial est réexprimé en objectifs intermédiaires à chaque échelon ; reporting, mise en concurrence interne et menace du déclassement élèvent la sanction de l'échec, donc la crainte (11.2).\n5. Les relations entre entreprises forment aussi des chaînes de dépendance : la sous-traitance jette les organisations les unes contre les autres pour leur survie, et chacun reporte sa contrainte sur ceux qui dépendent de lui (11.2-11.3). ∎\n\n## Scolie\n\nExemple d'un ancien dirigeant de PME (*Ma mondialisation*, documentaire de Gilles Perret, note 27) : des donneurs d'ordre envoient à dessein de jeunes cadres, plus vulnérables, donc plus enclins à la violence économique, exiger des baisses de prix (11.3).", "body_en": "## Demonstration\n\n1. By T011, at each rung, keeping one's position requires the effort demanded by the rung above; a pressure from above therefore spreads to every level, and the probability of meeting it decreases (11.1).\n2. By S08, fear accompanies desire as soon as its object is uncertain. With desire still intense and its conditions harder, the balance of hope and fear tips towards fear (11.1).\n3. By S09, like every sad affect, fear induces a surplus of power of acting to rid oneself of it; in a context of domination, this surplus translates into violence exercised on those one can dominate, and on oneself (11.1).\n4. The shareholder shock is re-expressed as intermediate targets at each rung; reporting, internal competition and the threat of demotion raise the penalty for failure, hence fear (11.2).\n5. Relations between firms also form chains of dependence: subcontracting throws organisations against one another for their survival, and each passes its constraint on to those who depend on it (11.2-11.3). ∎\n\n## Scholium\n\nThe example of a former head of an SME (*Ma mondialisation*, documentary by Gilles Perret, note 27): contractors deliberately send young managers, more vulnerable and therefore more inclined to economic violence, to demand price cuts (11.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["S08", "S09", "T011"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["S08", "S09", "T011"], "mentions": ["S08", "S09", "T011"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T013", "file": "theses/T013.md", "type": "these", "partie": "1", "titre": "Le salariat attache aussi par la joie : le salaire et la marchandise", "enonce": "Les salariés ne tiennent pas au rapport d'enrôlement sous la seule contrainte : ils y trouvent des occasions de joie. La première est le salaire, joie de basse intensité ; la seconde, plus franche, est la consommation. La marchandise, en démultipliant les objets du désir, accroît la dépendance salariale tout en l'accompagnant d'affects joyeux, au point de durcir un renoncement au renversement du capitalisme.", "titre_en": "Wage labour also binds through joy: the wage and the commodity", "enonce_en": "Employees do not stay in the relation of enlistment under constraint alone: they find occasions of joy in it. The first is the wage, a joy of low intensity; the second, more outright, is consumption. The commodity, by multiplying the objects of desire, increases wage dependence while accompanying it with joyful affects, to the point of hardening a renunciation of overturning capitalism.", "titre_de": "Die Lohnarbeit bindet auch durch Freude: der Lohn und die Ware", "enonce_de": "Die Angestellten bleiben nicht nur unter Zwang im Verhältnis der Einspannung: Sie finden darin Anlässe der Freude. Der erste ist der Lohn, eine Freude von geringer Stärke; der zweite, unverhohlener, ist der Konsum. Indem die Ware die Gegenstände des Begehrens vervielfacht, verstärkt sie die Lohnabhängigkeit und begleitet sie zugleich mit freudigen Affekten, bis hin zur Verhärtung eines Verzichts auf den Umsturz des Kapitalismus.", "body_de": "## Argumentation\n\n1. Zu verstehen, was den Kapitalismus dauern lässt, heißt, die ganze Vielfalt seiner Affekte zu erfassen: Auch die Angestellten finden darin ihre Rechnung, Anlässe der Freude (12.1).\n2. Nach T006 befriedigt der Lohn das Grundbegehren; ihn zu erhalten ist der freudige Augenblick des Lohnverhältnisses. Die Freude ist „mit einer gewissen analytischen Kälte“ zu nehmen: Sie kann sehr gering sein, wie es in der Sklaverei das Verschontbleiben des Lebens ist (12.2).\n3. Der Kapitalismus, besonders in der fordistischen Zeit, fügte den Konsum hinzu: Die Ware bietet dem Begehren eine grenzenlose Vervielfachung seiner Angriffspunkte, und Spinozas Satz (S02) erhält „seine volle Tragweite“ (12.2).\n4. Die Ware treibt die Lohnabhängigkeit also höher, aber mit den freudigen Affekten des Erwerbs. Der Diskurs der bestehenden Ordnung wendet sich in jedem von uns „allein an den Konsumenten“ und verweist den Angestellten ins Nebensächliche; die europäische Einigung hat das Sozialrecht zugunsten des Wettbewerbsrechts verdrängt, das als größter Dienst an den Individuen dargestellt wird, aber als Konsumenten (12.3).\n5. Die freudige Entfremdung nimmt sogar traurige Affekte hin, etwa die Verschuldung, die die Lohnabhängigkeit verdoppelt (12.4). Nach S06 bliebe eine Gesellschaft, die ihre Ansprüche von sich aus verringerte, der Nachahmung des Begehrens ihrer Nachbarn ausgesetzt: Die Gabel der Wachstumsrücknahme muss sich zuerst ein erneuertes Imaginäres schaffen (12.4). ∎\n\n## Anmerkung\n\nDie Verlängerung der Vermittlungen zwischen der Arbeit jedes Einzelnen und den Gegenständen seines Konsums begünstigt die „Abschottung“: Fast niemand verbindet den Vorteil des Konsumenten mit den Unterwerfungen des Angestellten (12.3). Der Immobilienkredit der „jungen sesshaften Paare“ fesselt sie zwanzig Jahre an ihre Stelle; die Faszination des Überflusses hatte ihren Anteil an der Ablehnung der „real existierenden Sozialismen“ (12.4).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["S02", "S06", "T006"], "citation": "", "loc": ["12.1", "12.2", "12.3", "12.4"], "depends_on": ["T006", "S02", "S06"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Comprendre ce qui fait durer le capitalisme, c'est saisir toute la variété de ses affects : les salariés y trouvent aussi un certain compte, des occasions de joie (12.1).\n2. Par T006, le salaire satisfait le désir basal ; son obtention est le moment joyeux du rapport salarial. La joie doit être prise « avec une certaine froideur analytique » : elle peut être très basse, comme l'est d'avoir la vie sauve dans l'esclavage (12.2).\n3. Le capitalisme, surtout à l'époque fordienne, y a ajouté la consommation : la marchandise offre au désir une démultiplication sans limite de ses points d'application, et le mot de Spinoza (S02) reçoit « sa pleine dimension » (12.2).\n4. La marchandise porte donc la dépendance salariale plus haut, mais avec les affects joyeux de l'acquisition. Le discours de l'ordre établi s'adresse « au seul consommateur » en chacun et fait retomber le salarié dans l'accessoire ; la construction européenne a évincé le droit social par le droit de la concurrence, présenté comme le plus grand service rendu aux individus, mais en tant que consommateurs (12.3).\n5. L'aliénation joyeuse accepte même des affects tristes, comme l'endettement, qui redouble la dépendance salariale (12.4). Par S06, une société qui réduirait seule ses aspirations resterait exposée à l'imitation du désir de ses voisins : la bifurcation décroissante doit d'abord se construire un imaginaire refait à neuf (12.4). ∎\n\n## Scolie\n\nL'allongement des médiations entre le travail de chacun et ses objets de consommation favorise un « compartimentage » : nul ou presque ne relie l'avantage du consommateur aux sujétions du salarié (12.3). L'emprunt immobilier des « jeunes installés » les rive à l'emploi pour vingt ans ; la fascination de l'opulence a eu sa part dans le rejet des « socialismes réels » (12.4).", "body_en": "## Argument\n\n1. Understanding what makes capitalism last means grasping the full variety of its affects: employees also find some account in it, occasions of joy (12.1).\n2. By T006, the wage satisfies basic desire; obtaining it is the joyful moment of the wage relation. Joy must be taken \"with a certain analytical coldness\": it can be very low, as is having one's life spared in slavery (12.2).\n3. Capitalism, especially in the Fordist era, added consumption: the commodity offers desire a limitless multiplication of its points of application, and Spinoza's phrase (S02) receives \"its full dimension\" (12.2).\n4. The commodity therefore carries wage dependence higher, but with the joyful affects of acquisition. The discourse of the established order addresses \"the consumer alone\" in each of us and relegates the employee to the incidental; European construction ousted social law in favour of competition law, presented as the greatest service rendered to individuals, but as consumers (12.3).\n5. Joyful alienation even accepts sad affects, such as debt, which doubles wage dependence (12.4). By S06, a society that reduced its aspirations on its own would remain exposed to the imitation of its neighbours' desire: the degrowth fork must first build itself an imaginary made anew (12.4). ∎\n\n## Scholium\n\nThe lengthening of mediations between each person's work and the objects of their consumption encourages \"compartmentalisation\": almost nobody connects the consumer's advantage with the employee's subjections (12.3). The mortgage of \"young settled couples\" rivets them to their job for twenty years; the fascination of opulence played its part in the rejection of \"really existing socialisms\" (12.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["S02", "S06", "T006"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["S02", "S06", "T006"], "mentions": ["S02", "S06", "T006"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T014", "file": "theses/T014.md", "type": "these", "partie": "1", "titre": "Mobiliser, c'est aligner ; réduire α est l'idée fixe patronale", "enonce": "Mobiliser est affaire de colinéarité : un conatus se laisse enrôler à proportion de son alignement sur le désir-maître ; orthogonal, il est rétif ; aligné (α = 0), il vit entièrement pour lui. Chaque conatus garde un désalignement propre, son clinamen, qui mesure ce que le patron ne captera pas ; réduire cette dérive, faire des autres le prolongement de soi, est l'idée fixe de tout désir-maître.", "titre_en": "Mobilising means aligning; reducing α is the employer's obsession", "enonce_en": "Mobilising is a matter of collinearity: a conatus lets itself be enlisted in proportion to its alignment with the master-desire; orthogonal, it is recalcitrant; aligned (α = 0), it lives entirely for it. Each conatus keeps a misalignment of its own, its clinamen, which measures what the boss will not capture; reducing this drift, making others the extension of oneself, is the obsession of every master-desire.", "titre_de": "Mobilisieren heißt ausrichten; α zu verkleinern ist die fixe Idee der Unternehmer", "enonce_de": "Mobilisieren ist eine Sache der Kollinearität: Ein Conatus lässt sich im Maß seiner Ausrichtung auf das Herrenbegehren einspannen; orthogonal ist er widerspenstig; ausgerichtet (α = 0) lebt er ganz für es. Jeder Conatus behält eine eigene Abweichung, sein Clinamen, die misst, was der Unternehmer nicht vereinnahmen wird; diese Abweichung zu verringern, die anderen zur Verlängerung seiner selbst zu machen, ist die fixe Idee jedes Herrenbegehrens.", "body_de": "## Beweis\n\n1. Die Frage ist, wie manche Angestellte dazu kommen, mit dem Kapital gemeinsame Sache zu machen, was der höchste Erfolg des Patronats ist (D04) (13.2).\n2. Nach D11 ist die dem Herrenbegehren nützliche Anstrengung die ausgerichtete Komponente des eingespannten Conatus, vom Betrag |**d**| cos α. Ein Conatus lässt sich also im Maß seiner Kollinearität einspannen: Bei rechtem Winkel α ist die Vereinnahmung null; bei α = 0 ist die Ausrichtung vollständig (13.5-13.7).\n3. Jeder Conatus legt „spontan“ seine Richtungen im Raum der Gegenstände des Begehrens fest, daher ein eigener Winkel α, sein *clinamen*; die Anführungszeichen erinnern daran, dass diese Richtungen immer teilweise von außen kommen (14.1, Anm. 33).\n4. Da die Vereinnahmung wächst, wenn α kleiner wird, ist die Verringerung der Abweichung die fixe Idee jedes Herrenbegehrens (D03): das Metabegehren nach „der vollständigen Mitteilung des Begehrens“, nach anderen, die einem selbst gleich gemacht werden (14.2). ∎\n\n## Anmerkung\n\nDer Vorarbeiter, ein „Bastardfall“ eines Angestellten, dem die Autorität des Arbeitgebers übertragen ist, dann die Führungskräfte bis zu den höchsten Managern, die Angestellte sind, stören seit Langem das Gegenüber von Kapital und Arbeit (13.2). Der kleine Chef sieht sich in seinem Angestellten und versteht nicht, warum dieser seinem Begehren so schlecht dient; das Großunternehmen bewahrt Maximen wie „so anspruchsvoll gegenüber anderen wie gegenüber sich selbst“; und die Sprache nennt die Herrenbegehren „Direktoren“ (14.2-14.3).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D03", "D04", "D11"], "citation": "« la mobilisation est affaire de colinéarité : il s’agit d’aligner le désir des enrôlés sur le désir-maître »", "loc": ["13.2", "13.3", "13.7", "14.1", "14.2", "14.3"], "depends_on": ["D04", "D11", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La question est de savoir comment certains salariés en viennent à faire cause commune avec le capital, ce qui est la réussite suprême du patronat (D04) (13.2).\n2. Par D11, l'effort utile au désir-maître est la composante alignée du conatus enrôlé, d'intensité |**d**| cos α. Un conatus se laisse donc enrôler à proportion de sa colinéarité : à α droit, la capture est nulle ; à α = 0, l'alignement est intégral (13.5-13.7).\n3. Chaque conatus fixe « spontanément » ses directions dans l'espace des objets de désir, d'où un angle α propre, son *clinamen* ; les guillemets rappellent que ces directions viennent toujours en partie du dehors (14.1, note 33).\n4. La capture croissant quand α diminue, réduire la dérive est l'idée fixe de tout désir-maître (D03) : le métadésir de « la communication intégrale du désir », d'autres refaits identiques à soi (14.2). ∎\n\n## Scolie\n\nLe contremaître, cas « bâtard » de salarié délégataire de l'autorité patronale, puis les cadres et jusqu'aux plus hauts dirigeants, qui sont des salariés, troublent depuis longtemps le face-à-face capital-travail (13.2). Le petit patron se voit en son employé et ne comprend pas qu'il serve si mal son désir ; la grande entreprise garde des maximes comme « exigeant avec les autres comme avec soi-même » ; et le vocabulaire appelle les désirs-maîtres des « directeurs » (14.2-14.3).", "body_en": "## Demonstration\n\n1. The question is how some employees come to make common cause with capital, which is the supreme success of bosshood (D04) (13.2).\n2. By D11, the effort useful to the master-desire is the aligned component of the enlisted conatus, of magnitude |**d**| cos α. A conatus therefore lets itself be enlisted in proportion to its collinearity: at a right angle α, capture is nil; at α = 0, alignment is complete (13.5-13.7).\n3. Each conatus \"spontaneously\" sets its directions in the space of objects of desire, hence an angle α of its own, its *clinamen*; the quotation marks recall that these directions always come in part from outside (14.1, note 33).\n4. Since capture grows as α shrinks, reducing drift is the obsession of every master-desire (D03): the meta-desire for \"the complete communication of desire\", others remade identical to oneself (14.2). ∎\n\n## Scholium\n\nThe foreman, a \"bastard\" case of an employee delegated the employer's authority, then managers and up to the highest executives, who are employees, have long troubled the face-to-face of capital and labour (13.2). The small boss sees himself in his employee and cannot understand why the employee serves his desire so poorly; the large firm keeps maxims such as \"as demanding of others as of oneself\"; and vocabulary calls master-desires \"directors\" (14.2-14.3).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D03", "D04", "D11"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D03", "D04", "D11"], "mentions": ["D03", "D04", "D11"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T015", "file": "theses/T015.md", "type": "these", "partie": "1", "titre": "Les régimes de mobilisation changent : l'entreprise néolibérale veut α = 0", "enonce": "Parce que les structures sont historiques, la mobilisation salariale change de régime : l'« aiguillon de la faim », puis la consommation fordienne. Aucun n'a produit l'alignement parfait. L'entreprise néolibérale ne tolère plus le résidu : elle veut α = 0, la mobilisation totale, et, faute de tâches délimitées, entend conformer les désirs et les dispositions qui produisent les actions.", "titre_en": "Regimes of mobilisation change: the neoliberal firm wants α = 0", "enonce_en": "Because structures are historical, wage mobilisation changes regime: the \"goad of hunger\", then Fordist consumption. None produced perfect alignment. The neoliberal firm no longer tolerates the residue: it wants α = 0, total mobilisation, and, lacking delimited tasks, means to shape the desires and dispositions that produce actions.", "titre_de": "Die Mobilisierungsregime wandeln sich: Das neoliberale Unternehmen will α = 0", "enonce_de": "Weil die Strukturen geschichtlich sind, wechselt die Mobilisierung durch Lohn ihr Regime: der „Stachel des Hungers“, dann der fordistische Konsum. Keines erzeugte eine vollkommene Ausrichtung. Das neoliberale Unternehmen duldet den Rest nicht mehr: Es will α = 0, die totale Mobilisierung, und will, mangels abgegrenzter Aufgaben, die Begehren und Dispositionen formen, die die Handlungen hervorbringen.", "body_de": "## Argumentation\n\n1. Die leidenschaftliche Konfiguration der Mobilisierung, bestimmt von in die Geschichte eingetauchten Strukturen, verwandelt sich: Das Regime des „Stachels des Hungers“, das das Grundbegehren „bis auf die Knochen“ ausnutzt (T007), wich dem fordistischen Regime des Konsums (T013); dieses wiederum durchläuft einen tiefen Wandel (13.1).\n2. Keines erreichte eine vollkommene Kollinearisierung (T014). Der Kapitalismus wechselt die Methode, weil er den Ehrgeiz wechselt: Die verbleibenden α sind ihm unerträglich geworden; er will α = 0, was die Organisationssoziologie als Vorhaben einer *totalen* Mobilisierung beschreibt (14.3).\n3. Erste Ursache: Aktionärsmacht und Wettbewerbsderegulierung haben das Kräfteverhältnis so weit verschoben, dass das Kapital sich berechtigt fühlt, *alles* zu verlangen (14.4).\n4. Zweite Ursache: Die Aufgaben der Dienstleistungs- und Innovationswirtschaft haben unscharfe Umrisse. Das fordistische Unternehmen legte ein Quantum zu mobilisierender Macht fest und duldete, dass der Rest ihm entging; das neoliberale Unternehmen geht von den Handlungen auf die Dispositionen zurück und öffnet so, im Ideal bis ins Unendliche, das Feld der Handlungen, auf die man zählen kann (14.5). ∎\n\n## Anmerkung\n\nDas dritte Regime, das der intrinsischen freudigen Affekte, ist Gegenstand von Kapitel 2. Maße der Aktionärshegemonie: der Anteil der Dividenden am BIP (3,2 % 1982, 8,5 % 2007, Anm. 35) und die von den Unternehmen des CAC 40 verlangten Renditen, von einigen Prozent auf über 20 % gestiegen (Anm. 36) (14.4).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["T007", "T013", "T014"], "citation": "", "loc": ["13.1", "14.3", "14.4", "14.5"], "depends_on": ["T007", "T013", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La configuration passionnelle de la mobilisation, déterminée par des structures plongées dans l'histoire, se transforme : le régime de « l'aiguillon de la faim », qui fait jouer « à l'os » le désir basal (T007), a cédé la place au régime fordien de la consommation (T013) ; celui-ci connaît à son tour une mutation profonde (13.1).\n2. Ni l'un ni l'autre n'a atteint la colinéarisation parfaite (T014). Le capitalisme change de méthode parce qu'il change d'ambition : les α résiduels lui sont devenus intolérables ; il veut α = 0, ce que la sociologie des organisations décrit comme un projet de mobilisation *totale* (14.3).\n3. Première cause : le pouvoir actionnarial et la dérégulation concurrentielle ont basculé le rapport de forces au point que le capital se sent autorisé à *tout* demander (14.4).\n4. Seconde cause : les tâches de l'économie de services et de l'innovation sont à contour flou. L'entreprise fordienne fixait un quantum de puissance à mobiliser et tolérait que le reste lui échappe ; l'entreprise néolibérale remonte des actions aux dispositions, et ouvre ainsi, idéalement à l'infini, le champ des actions escomptables (14.5). ∎\n\n## Scolie\n\nLe troisième régime, celui des affects joyeux intrinsèques, est l'objet du chapitre 2. Mesures de l'hégémonie actionnariale : la part des dividendes dans le PIB (3,2 % en 1982, 8,5 % en 2007, note 35), les rentabilités exigées des entreprises du CAC 40, passées de quelques pourcents à plus de 20 % (note 36) (14.4).", "body_en": "## Argument\n\n1. The passional configuration of mobilisation, determined by structures immersed in history, transforms itself: the regime of \"the goad of hunger\", which works basic desire \"to the bone\" (T007), gave way to the Fordist regime of consumption (T013); this in turn is undergoing a deep mutation (13.1).\n2. Neither achieved perfect collinearisation (T014). Capitalism changes method because it changes ambition: residual αs have become intolerable to it; it wants α = 0, which the sociology of organisations describes as a project of *total* mobilisation (14.3).\n3. First cause: shareholder power and competitive deregulation have tipped the balance of forces to the point that capital feels entitled to ask for *everything* (14.4).\n4. Second cause: the tasks of the service and innovation economy have blurred outlines. The Fordist firm set a quantum of power to be mobilised and tolerated the rest escaping it; the neoliberal firm goes back from actions to dispositions, and thus opens, ideally to infinity, the field of actions that can be counted on (14.5). ∎\n\n## Scholium\n\nThe third regime, that of intrinsic joyful affects, is the subject of chapter 2. Measures of shareholder hegemony: the share of dividends in GDP (3.2% in 1982, 8.5% in 2007, note 35), and the returns required of CAC 40 firms, up from a few per cent to over 20% (note 36) (14.4).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["T007", "T013", "T014"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["T007", "T013", "T014"], "mentions": ["T007", "T013", "T014"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T016", "file": "theses/T016.md", "type": "these", "partie": "1", "titre": "Tant qu'il ne rencontre pas de résistance, le capital avance, et gouverne par la crainte", "enonce": "L'illimitation entre dans le concept du conatus capitaliste : il veut son augmentation sans fin, sauf si des forces contraires le retiennent. La configuration néolibérale ayant fait tomber ces barrières, le capital pousse son avantage ; une part du suralignement vient d'une radicalisation du gouvernement par la crainte, qui porte la dépendance monétaire à des intensités inconnues depuis longtemps.", "titre_en": "As long as it meets no resistance, capital advances, and governs by fear", "enonce_en": "Limitlessness is part of the concept of the capitalist conatus: it wants its endless increase, unless contrary forces hold it back. The neoliberal configuration having brought these barriers down, capital presses its advantage; part of the over-alignment comes from a radicalisation of government by fear, which carries monetary dependence to intensities unknown for a long time.", "titre_de": "Solange es auf keinen Widerstand stößt, schreitet das Kapital voran und regiert durch Furcht", "enonce_de": "Die Grenzenlosigkeit gehört zum Begriff des kapitalistischen Conatus: Er will seine endlose Vermehrung, es sei denn, entgegengesetzte Kräfte halten ihn zurück. Da die neoliberale Konfiguration diese Schranken niedergerissen hat, nutzt das Kapital seinen Vorteil; ein Teil der Überausrichtung kommt aus einer Radikalisierung der Regierung durch Furcht, die die monetäre Abhängigkeit auf seit Langem unbekannte Stärken treibt.", "body_de": "## Argumentation\n\n1. Nach D01 ist der Conatus Streben; der kapitalistische Conatus will seine eigene endlose Vermehrung, wenn ihm nicht entgegengesetzte Kräfte widerstehen. Der Wahn des Grenzenlosen ist ein strategisches Symptom: das Zeichen, dass es keine Widerstände gibt (15.1).\n2. Diese Kräftelandschaft ist die der Strukturen, die allein „Machtressourcen“ verteilen, ein Begriff, der in Wahrheit eine Beziehungswirkung bezeichnet. Von der fordistischen Konfiguration (Schutzrechte, Kapitalkontrollen, kein Aktionärszwang, Wachstumspolitik) zur neoliberalen (Liberalisierung, Verlagerung, Aktionärszwang, Vorrang der Inflationsbekämpfung) wird das Verhältnis von Kapital und Arbeit von Grund auf verwandelt (15.1).\n3. Das Kapital zieht daher größten Gewinn aus einer Lage, die es mitgestaltet hat; die Kollinearisierung senkt ihre Toleranz für verbleibende Abweichungen und zielt auf vollkommene Ausrichtung (T015) (15.2).\n4. Die Massenarbeitslosigkeit macht die Regierung durch Furcht (T012) leichter denn je: Die Drohungen mit Verlagerung und Entlassung spielen mit einer beispiellosen Stärke auf dem ersten Affekt des Lohnverhältnisses, der monetären Abhängigkeit (T006), daher die von Thomas Coutrot beschriebene „erzwungene Kooperation“ (15.2, Anm. 38). ∎\n\n## Anmerkung\n\nEinen Standort in Frankreich schließen, weil er „nicht rentabel genug“ ist, und eine Weiterbeschäftigung in Rumänien für 300 Euro im Monat anbieten: Die Schande hält das Kapital nicht mehr zurück, weil sie „ohne Kraft bleibt“ (15.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D01", "T006", "T012", "T015"], "citation": "« Très logiquement, tant qu’il ne rencontre pas de résistance, le capital avance. »", "loc": ["15.1", "15.2"], "depends_on": ["D01", "T015", "T012", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, le conatus est effort ; le conatus capitaliste veut sa propre augmentation sans fin, sauf le contrariement par des forces opposées. Le délire de l'illimité est un symptôme stratégique : l'indice de l'inexistence des résistances (15.1).\n2. Ce paysage de forces est celui des structures, qui seules distribuent les « ressources de pouvoir », terme qui désigne en fait un effet relationnel. De la configuration fordienne (protections, contrôle des capitaux, pas de contrainte actionnariale, politique de croissance) à la néolibérale (libéralisation, délocalisations, contrainte actionnariale, priorité à l'inflation), le rapport capital-travail est modifié du tout au tout (15.1).\n3. Le capital tire donc le profit maximal d'une situation qu'il a contribué à façonner ; la colinéarisation abandonne sa tolérance pour les déviations résiduelles et vise l'alignement parfait (T015) (15.2).\n4. Le chômage de masse rend plus facile que jamais le gouvernement par la crainte (T012) : les menaces de délocalisation et de licenciement jouent de l'affect princeps du rapport salarial, la dépendance monétaire (T006), à des intensités inédites, d'où la « coopération forcée » décrite par Thomas Coutrot (15.2, note 38). ∎\n\n## Scolie\n\nFermer un site en France parce qu'il est « insuffisamment rentable » et proposer un reclassement en Roumanie à 300 euros par mois : l'opprobre ne retient plus le capital, car il « demeure sans force » (15.2).", "body_en": "## Argument\n\n1. By D01, the conatus is striving; the capitalist conatus wants its own endless increase, barring opposition by contrary forces. The delirium of the limitless is a strategic symptom: the sign that resistances do not exist (15.1).\n2. This landscape of forces is that of structures, which alone distribute \"power resources\", a term that in fact designates a relational effect. From the Fordist configuration (protections, capital controls, no shareholder constraint, growth policy) to the neoliberal one (liberalisation, offshoring, shareholder constraint, priority to inflation), the capital-labour relation is transformed through and through (15.1).\n3. Capital therefore draws maximum profit from a situation it helped shape; collinearisation drops its tolerance for residual deviations and aims at perfect alignment (T015) (15.2).\n4. Mass unemployment makes government by fear (T012) easier than ever: the threats of offshoring and dismissal play on the primary affect of the wage relation, monetary dependence (T006), at unprecedented intensities, hence the \"forced cooperation\" described by Thomas Coutrot (15.2, note 38). ∎\n\n## Scholium\n\nClosing a site in France because it is \"insufficiently profitable\" and offering redeployment in Romania at 300 euros a month: opprobrium no longer holds capital back, because it \"remains without force\" (15.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D01", "T006", "T012", "T015"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "T006", "T012", "T015"], "mentions": ["D01", "T006", "T012", "T015"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T017", "file": "theses/T017.md", "type": "these", "partie": "1", "titre": "Il n'y a pas de morale autonome", "enonce": "La vertu des agents s'établit au voisinage de leur intérêt à la vertu. La retenue fordienne du licenciement n'était pas une morale mais l'effet de structures stables qui la rendaient peu coûteuse ; quand les structures changent, la menace sur la reproduction matérielle devient la norme, une norme pratique amoralisée qui n'exprime plus qu'un rapport de forces.", "titre_en": "There is no autonomous morality", "enonce_en": "Agents' virtue settles in the vicinity of their interest in virtue. Fordist restraint in dismissals was not a morality but the effect of stable structures that made it cheap; when structures change, the threat to material reproduction becomes the norm, a de-moralised practical norm that expresses nothing but a balance of forces.", "titre_de": "Es gibt keine autonome Moral", "enonce_de": "Die Tugend der Akteure richtet sich in der Nähe ihres Interesses an der Tugend ein. Die fordistische Zurückhaltung bei Entlassungen war keine Moral, sondern die Wirkung stabiler Strukturen, die sie billig machten; wenn die Strukturen sich ändern, wird die Bedrohung der materiellen Reproduktion zur Norm, einer entmoralisierten praktischen Norm, die nichts als ein Kräfteverhältnis ausdrückt.", "body_de": "## Argumentation\n\n1. Die Erpressung mit der materiellen Reproduktion erreichte ihre Stärke nur durch eine normative Verschiebung: Die Entlassung, beschönigend „Sozialplan“ genannt, ist zur gewöhnlichen Managementpraxis geworden (16.1).\n2. Die Tugend richtet sich in der Nähe des Interesses an der Tugend ein, ob sie unmittelbar einträglich oder billig ist (16.1). *[rekonstruiert: Das ist die Anwendung des Interesses im weiten Sinn von T005; Lordon verweist in Anm. 39 nur auf „nicht notwendig monetäre“ Gewinne.]*\n3. Im Fordismus ersparte die Stabilität der Strukturen Anpassungen über die Beschäftigtenzahl und machte die „schöne Geste“ der Arbeitsplatzerhaltung sehr erschwinglich; die Tatsache gewann die Festigkeit einer Norm (R05) (16.1).\n4. Wenn die Deregulierung die Strukturen verändert (T016), platzt das Missverständnis: Der Bruch dieser Norm wird zur neuen Norm, einer entmoralisierten praktischen Norm, bei der die einen alle Trümpfe haben und die anderen keinen (16.2). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["R05", "T005", "T016"], "citation": "« Il n’y a pas de morale autonome et la vertu des agents s’établit au voisinage de leurs intérêts à la vertu »", "loc": ["16.1", "16.2"], "depends_on": ["T005", "T016"], "contre": ["R05"], "ethique": [], "ref": "", "lien_explicite": false, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le chantage à la reproduction matérielle n'a atteint son intensité que par un basculement normatif : le licenciement, euphémisé en « plan social », est devenu une pratique de gestion courante (16.1).\n2. La vertu s'établit au voisinage de l'intérêt à la vertu, qu'elle soit directement profitable ou peu coûteuse (16.1). *[reconstruit : c'est l'application de l'intérêt au sens large de T005 ; Lordon renvoie seulement, en note 39, à des profits « pas nécessairement monétaires ».]*\n3. Sous le fordisme, la stabilité des structures dispensait des ajustements par les effectifs et rendait très abordable le « beau geste » du maintien de l'emploi ; le fait a pris la consistance d'une norme (R05) (16.1).\n4. Quand la déréglementation change les structures (T016), le malentendu éclate : la rupture de cette norme devient la nouvelle norme, une norme pratique amoralisée, où les uns ont toutes les cartes et les autres aucune (16.2). ∎", "body_en": "## Argument\n\n1. Blackmail over material reproduction reached its intensity only through a normative shift: dismissal, euphemised as a \"social plan\", has become a routine management practice (16.1).\n2. Virtue settles in the vicinity of the interest in virtue, whether it is directly profitable or cheap (16.1). *[reconstructed: this is the application of interest in the broad sense of T005; Lordon only refers, in note 39, to profits \"not necessarily monetary\".]*\n3. Under Fordism, the stability of structures spared adjustments through headcount and made the \"fine gesture\" of keeping jobs very affordable; the fact took on the consistency of a norm (R05) (16.1).\n4. When deregulation changes the structures (T016), the misunderstanding bursts: breaking this norm becomes the new norm, a de-moralised practical norm, in which some hold all the cards and the others none (16.2). ∎", "sections_en": ["Argument"], "demo_refs_en": ["R05", "T005", "T016"], "sections": ["Argumentation"], "demo_refs": ["R05", "T005", "T016"], "mentions": ["R05", "T005", "T016"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T018", "file": "theses/T018.md", "type": "these", "partie": "1", "titre": "La liquidité, paradigme du désir-maître capitaliste", "enonce": "Le désir-maître libéré trouve son modèle dans la liquidité financière : s'engager en sachant pouvoir se désengager, embaucher avec l'idée de pouvoir débaucher. Débordant les marchés d'actifs, ce schème devient le fantasme de toute une époque et pousse les désirs-maîtres à obtenir les transformations de structure qui les en rapprochent.", "titre_en": "Liquidity, the paradigm of the capitalist master-desire", "enonce_en": "The liberated master-desire finds its model in financial liquidity: committing while knowing one can withdraw, hiring with the idea of being able to fire. Overflowing asset markets, this schema becomes the fantasy of a whole era and pushes master-desires to obtain the structural transformations that bring them closer to it.", "titre_de": "Die Liquidität, Paradigma des kapitalistischen Herrenbegehrens", "enonce_de": "Das befreite Herrenbegehren findet sein Vorbild in der finanziellen Liquidität: sich binden im Wissen, sich zurückziehen zu können, einstellen mit dem Gedanken, entlassen zu können. Über die Vermögensmärkte hinausgreifend, wird dieses Schema zum Wunschbild einer ganzen Epoche und treibt die Herrenbegehren dazu, die strukturellen Veränderungen zu erwirken, die sie ihm näherbringen.", "body_de": "## Argumentation\n\n1. Nach T017 ist es normal geworden, den Angestellten Furcht um ihre Reproduktion aufzuerlegen: Das ist das Zeichen eines Herrenbegehrens, das sich durch nichts mehr zurückgehalten fühlt. Es findet sein Paradigma im Finanzkapital, in der Form der Liquidität (16.2).\n2. Nach D12 ist Liquidität minimale Bindung, vollkommene Umkehrbarkeit. Sie ist doppelt Paradigma: als Zugang zum Geld, dem Gegenstand des Metabegehrens (T006), und als Modell totaler Umkehrbarkeit (16.3).\n3. Das Schema greift über die Finanz hinaus: Auch wenn kein Arbeitsmarkt je die Flexibilität der Finanzmärkte erreichen wird, ist die Liquidität das Ziel (16.3). ∎\n\n## Anmerkung\n\nDie Unternehmerthese, die Arbeitslosigkeit sinke nur, wenn man die Entlassungen von allen Regeln befreie, drückt dieses Metabegehren aus: „eine Art Mai 68 der Unternehmer“. Die Theorie der reinen und vollkommenen Wettbewerbsmärkte trägt seine Botschaft: Alles muss sich augenblicklich an die Schwankungen der Herrenbegehren anpassen können (16.3).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D12", "T006", "T017"], "citation": "", "loc": ["16.2", "16.3"], "depends_on": ["T017", "D12", "T006"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T017, imposer aux salariés la crainte pour leur reproduction est devenu normal : c'est le signe d'un désir-maître qui ne se sent plus retenu par rien. Il trouve son paradigme dans le capital financier, sous la forme de la liquidité (16.2).\n2. Par D12, la liquidité est l'engagement minimal, la réversibilité parfaite. Elle fait doublement paradigme : comme accès à l'argent, objet du métadésir (T006), et comme modèle de réversibilité totale (16.3).\n3. Le schème déborde la finance : même si aucun marché du travail n'atteindra la flexibilité des marchés financiers, la liquidité fait point de mire (16.3). ∎\n\n## Scolie\n\nLa thèse patronale selon laquelle le chômage ne baisserait qu'en affranchissant les licenciements de toute règle exprime ce métadésir : « une sorte de mai 68 pour patrons ». La théorie des marchés de concurrence pure et parfaite en porte le message : tout doit pouvoir s'ajuster instantanément, aux variations des désirs-maîtres (16.3).", "body_en": "## Argument\n\n1. By T017, imposing on employees fear for their reproduction has become normal: it is the sign of a master-desire that no longer feels held back by anything. It finds its paradigm in financial capital, in the form of liquidity (16.2).\n2. By D12, liquidity is minimal commitment, perfect reversibility. It is a paradigm twice over: as access to money, the object of the meta-desire (T006), and as a model of total reversibility (16.3).\n3. The schema overflows finance: even if no labour market will ever reach the flexibility of financial markets, liquidity is the target (16.3). ∎\n\n## Scholium\n\nThe employers' thesis that unemployment would only fall by freeing dismissals from all rules expresses this meta-desire: \"a sort of May 68 for bosses\". The theory of pure and perfect competitive markets carries its message: everything must be able to adjust instantly, to the variations of master-desires (16.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D12", "T006", "T017"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D12", "T006", "T017"], "mentions": ["D12", "T006", "T017"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T019", "file": "theses/T019.md", "type": "these", "partie": "1", "titre": "Tyrannie et terreur", "enonce": "L'égocentrisme du conatus, servi par une asymétrie de puissance, va nécessairement à l'abus : quand les structures ne retiennent plus rien des mouvements du désir-maître, la domination devient tyrannie. Son projet, rendre l'emploi aussi réversible qu'un portefeuille d'actifs, fait porter aux salariés les fluctuations de l'activité et les plonge dans un monde de terreur.", "titre_en": "Tyranny and terror", "enonce_en": "The egocentrism of the conatus, served by an asymmetry of power, necessarily goes to abuse: when structures no longer hold back anything of the master-desire's movements, domination becomes tyranny. Its project, making employment as reversible as a portfolio of assets, makes employees bear the fluctuations of activity and plunges them into a world of terror.", "titre_de": "Tyrannei und Terror", "enonce_de": "Der Egozentrismus des Conatus, von einer Machtasymmetrie bedient, geht notwendig bis zum Missbrauch: Wenn die Strukturen nichts mehr von den Bewegungen des Herrenbegehrens zurückhalten, wird Herrschaft zur Tyrannei. Ihr Vorhaben, die Beschäftigung so umkehrbar zu machen wie ein Wertpapierportfolio, lässt die Angestellten die Schwankungen der Tätigkeit tragen und stürzt sie in eine Welt des Terrors.", "body_de": "## Beweis\n\n1. Nach T018 duldet das Herrenbegehren im Paradigma der Liquidität keine Einschränkung mehr und nimmt den Gedanken ernst, nicht mehr mit dem anderen rechnen zu müssen; es findet alle seine Forderungen „natürlich“, weil es seine eigenen sind (17.1).\n2. Nach T016 lassen ihm die gegenwärtigen Strukturen freie Hand, und nichts hält es mehr zurück, nicht einmal moralische Regeln oder der Ruf. In Kooperationen eingebunden, denen es die Form der Unterordnung geben will, geht es bis zum Missbrauch (17.1).\n3. Nach D13 ist das einseitige Aufzwingen des Begehrens eines Einzelnen gegenüber der Menge Tyrannei: Das kapitalistische Herrenbegehren, das die kantische Maxime missachtet und die unbegrenzte Unterordnung der anderen unter sein Unternehmen entwirft, wird tyrannisch (17.1).\n4. Dieses Begehren will die Arbeitskraft verflüssigen. Der Anteil des Kapitals am Einkommen wurde durch das Tragen des Risikos gerechtfertigt, gegenüber einem festen Lohn; nun ist es die Lohnsumme, die die Schwankungen der Tätigkeit auffängt, über Löhne, Verdichtung oder Beschäftigtenzahl (17.2).\n5. Die Reduktion auf das passive Warten auf die Befehle eines tyrannischen Begehrens stürzt die Lohnabhängigen in eine Welt äußerster Ungewissheit, des Terrors (17.2). ∎\n\n## Anmerkung\n\nCaligula fragt Lepidus, ob er schlechte Laune habe, weil er seinen Sohn habe töten lassen; Lepidus antwortet: „Aber nein, Caius, ganz im Gegenteil“ (Camus, Anm. 46). Das neoliberale Unternehmen ist noch nicht so weit, und doch gehen die Angestellten nach einem früheren leitenden Manager jeden Tag „zu Tode verängstigt“ zur Arbeit (Teodor Limann, Anm. 47) (17.2).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D13", "T016", "T018"], "citation": "", "loc": ["17.1", "17.2"], "depends_on": ["T018", "T016", "D13"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T018, le désir-maître, dans le paradigme de la liquidité, ne tolère plus de restriction et prend au sérieux l'idée de n'avoir plus à compter avec l'autre ; il trouve « naturels » tous ses réquisits, parce que ce sont les siens (17.1).\n2. Par T016, les structures présentes lui font droit, et rien ne le retient plus, pas même les régulations morales ou réputationnelles. Engagé dans des collaborations auxquelles il veut donner la forme de la subordination, il va à l'abus (17.1).\n3. Par D13, l'imposition unilatérale du désir de l'un à la multitude est tyrannie : le désir-maître capitaliste, qui ignore la maxime kantienne et projette la subordination sans limite des autres à son entreprise, est en devenir tyrannique (17.1).\n4. Ce désir veut liquéfier la force de travail. La part de revenu du capital était justifiée par le portage du risque, contre une rémunération salariale fixe ; c'est désormais la masse salariale qui accommode les fluctuations de l'activité, par les salaires, l'intensification ou les effectifs (17.2).\n5. La réduction à l'attente passive des commandements d'un désir tyrannique plonge le salariat dans un monde d'incertitude extrême, de terreur (17.2). ∎\n\n## Scolie\n\nCaligula demande à Lepidus s'il est de mauvaise humeur parce qu'il a fait mourir son fils ; Lepidus répond : « Mais non, Caïus, bien au contraire » (Camus, note 46). L'entreprise néolibérale n'en est pas là, et pourtant, selon un ancien cadre dirigeant, des salariés vont chaque jour au travail « morts de peur » (Teodor Limann, note 47) (17.2).", "body_en": "## Demonstration\n\n1. By T018, the master-desire, in the paradigm of liquidity, no longer tolerates restriction and takes seriously the idea of no longer having to reckon with the other; it finds all its requirements \"natural\", because they are its own (17.1).\n2. By T016, present structures grant it its way, and nothing holds it back any more, not even moral or reputational regulations. Engaged in collaborations to which it wants to give the form of subordination, it goes to abuse (17.1).\n3. By D13, the unilateral imposition of the desire of one on the multitude is tyranny: the capitalist master-desire, which ignores the Kantian maxim and projects the unlimited subordination of others to its enterprise, is becoming tyrannical (17.1).\n4. This desire wants to liquefy labour power. Capital's share of income was justified by carrying risk, against a fixed wage; it is now the wage bill that absorbs the fluctuations of activity, through wages, intensification or headcount (17.2).\n5. Reduction to passively awaiting the commands of a tyrannical desire plunges wage-earners into a world of extreme uncertainty, of terror (17.2). ∎\n\n## Scholium\n\nCaligula asks Lepidus whether he is in a bad mood because he has had his son killed; Lepidus answers: \"Why no, Caius, quite the contrary\" (Camus, note 46). The neoliberal firm is not there yet, and yet, according to a former senior executive, employees go to work every day \"scared to death\" (Teodor Limann, note 47) (17.2).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D13", "T016", "T018"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D13", "T016", "T018"], "mentions": ["D13", "T016", "T018"], "corollaires": [], "mtime": 1794593716.2155945}, {"id": "T020", "file": "theses/T020.md", "type": "these", "partie": "2", "titre": "Le capitalisme est un régime de désir", "enonce": "Le capitalisme doit être saisi en ses structures et comme régime de désir, une épithumè : désirer y devient majoritairement désirer selon l'ordre des choses capitaliste. L'entreprise néolibérale ne s'en remet plus au travail diffus de la société : elle prend elle-même en main l'épithumogénie.", "titre_en": "Capitalism is a regime of desire", "enonce_en": "Capitalism must be grasped in its structures and as a regime of desire, an epithumè: to desire becomes, for the most part, to desire according to the capitalist order of things. The neoliberal firm no longer relies on the diffuse work of society: it takes epithumogeny in hand itself.", "titre_de": "Der Kapitalismus ist ein Regime des Begehrens", "enonce_de": "Der Kapitalismus muss in seinen Strukturen und als Regime des Begehrens erfasst werden, als Epithumè: Begehren heißt größtenteils, gemäß der kapitalistischen Ordnung der Dinge zu begehren. Das neoliberale Unternehmen verlässt sich nicht mehr auf die diffuse Arbeit der Gesellschaft: Es nimmt die Epithumogenie selbst in die Hand.", "body_de": "## Argumentation\n\n1. Nach T014 ist Einspannung Sache der Kollinearisierung, das heißt der Hervorbringung der dem Herrenbegehren angemessenen Begehren: Der Kapitalismus ist daher auch ein Regime des Begehrens, eine Epithumè (D14) (19.1).\n2. Die objektiven Strukturen setzen sich in subjektiven Strukturen fort: Sie haben ihr eigenes Imaginäres, als Konfiguration von Begehren und Affekten. Die kapitalistischen Verhältnisse haben genug Zentralität erlangt, um den Großteil des sozialen Lebens zu ordnen; die kapitalistische Epithumè vereinnahmt den großen gemeinsamen Teil der Begehren (19.1-19.2).\n3. Die Epithumè wird durch die Arbeit der Gesellschaft an sich selbst hervorgebracht, aber auch von Agenten, die ihren Vorhaben entsprechende Imaginäre fördern: Das neoliberale Unternehmen investiert sich aktiv in diese Epithumogenie (19.2).\n4. Monetäre Abhängigkeit, Hierarchie und Konsum gehörten bereits zur kapitalistischen Epithumè; doch das Vorhaben α = 0 zeigt, dass sie dabei nicht stehen bleibt (19.3). ∎\n\n## Anmerkung\n\nDie kapitalistische Gesellschaft ist vielleicht die erste, die ein *umfassendes* Regime des Begehrens darbietet; die vorangehende war vielleicht eine „Epithumè des Heils“ (19.2).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D14", "T014"], "citation": "", "loc": ["19.1", "19.2", "19.3"], "depends_on": ["D14", "T014"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T014, l'enrôlement est affaire de colinéarisation, c'est-à-dire de production des désirs adéquats au désir-maître : le capitalisme est donc aussi un régime de désir, une épithumè (D14) (19.1).\n2. Les structures objectives se prolongent en structures subjectives : elles ont leur imaginaire propre, comme configuration de désirs et d'affects. Les rapports capitalistes ont acquis assez de centralité pour organiser la plus grande part de la vie sociale ; l'épithumè capitaliste capte la grande part commune des désirs (19.1-19.2).\n3. L'épithumè est produite par le travail que la société fait sur elle-même, mais aussi par des agents qui promeuvent des imaginaires conformes à leurs projets : l'entreprise néolibérale s'investit activement dans cette épithumogénie (19.2).\n4. Dépendance monétaire, hiérarchie et consommation appartenaient déjà à l'épithumè capitaliste ; mais le projet zéro-α montre qu'elle ne s'arrête pas là (19.3). ∎\n\n## Scolie\n\nLa société capitaliste est peut-être la première à présenter un régime *d'ensemble* de désir ; celle qui l'a précédée aurait pu être une « épithumè du salut » (19.2).", "body_en": "## Argument\n\n1. By T014, enlistment is a matter of collinearisation, that is, of producing the desires adequate to the master-desire: capitalism is therefore also a regime of desire, an epithumè (D14) (19.1).\n2. Objective structures extend into subjective structures: they have their own imaginary, as a configuration of desires and affects. Capitalist relations have acquired enough centrality to organise most of social life; the capitalist epithumè captures the large common share of desires (19.1-19.2).\n3. The epithumè is produced by the work society does on itself, but also by agents who promote imaginaries in keeping with their projects: the neoliberal firm invests itself actively in this epithumogeny (19.2).\n4. Monetary dependence, hierarchy and consumption already belonged to the capitalist epithumè; but the zero-α project shows that it does not stop there (19.3). ∎\n\n## Scholium\n\nCapitalist society is perhaps the first to present an *overall* regime of desire; the one before it might have been an \"epithumè of salvation\" (19.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D14", "T014"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D14", "T014"], "mentions": ["D14", "T014"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T021", "file": "theses/T021.md", "type": "these", "partie": "2", "titre": "Le projet néolibéral : des affects joyeux intrinsèques", "enonce": "Pour réduire les α résiduels, l'épithumogénie néolibérale veut produire des affects joyeux intrinsèques : faire désirer l'activité de travail pour elle-même, comme source immédiate de joie, d'« épanouissement » et de « réalisation de soi ». Si vie salariale et vie tout court se confondent, les réticents deviennent « consentants », et sont mus plus intensément.", "titre_en": "The neoliberal project: intrinsic joyful affects", "enonce_en": "To reduce residual αs, neoliberal epithumogeny wants to produce intrinsic joyful affects: to make the activity of work desired for its own sake, as an immediate source of joy, \"fulfilment\" and \"self-realisation\". If wage life and life itself merge, the reluctant become \"consenting\", and are moved more intensely.", "titre_de": "Das neoliberale Vorhaben: die intrinsischen freudigen Affekte", "enonce_de": "Um die verbleibenden α zu verringern, will die neoliberale Epithumogenie intrinsische freudige Affekte hervorbringen: die Arbeitstätigkeit um ihrer selbst willen begehren lassen, als unmittelbare Quelle der Freude, der „Entfaltung“ und der „Selbstverwirklichung“. Verschmelzen Lohnleben und Leben selbst, so werden die Widerwilligen „zustimmend“ und bewegen sich intensiver.", "body_de": "## Argumentation\n\n1. Nach T015 will das neoliberale Unternehmen α = 0; nach T020 nimmt es die Epithumogenie in die Hand (19.4).\n2. Die erste, fordistische Bereicherung hatte den traurigen Affekten des Hungers die freudigen Affekte des Konsums hinzugefügt; sie hat viel für die Ausrichtung getan, aber nach dem Urteil des neoliberalen Unternehmens nicht genug (19.4).\n3. Nach D15 war der Hunger intrinsisch, aber traurig, der Konsum freudig, aber extrinsisch: Keiner genügte, um den Gedanken zu entwaffnen, dass „das wahre Leben anderswo ist“. Die strategische Ergänzung ist der intrinsische freudige Affekt, das Begehren nach der Tätigkeit um ihrer selbst willen (19.5).\n4. Die Angestellten gingen widerwillig zum Herrenbegehren über oder dachten an etwas anderes; „zustimmend“ werden sie „anders bewegt. Anders heißt intensiver“ (19.5). Das neoliberale Vorhaben ist ein Vorhaben der Wiederverzauberung: die Gegenstände des Begehrens in die Lohntätigkeit zurückzuholen (21.1). ∎\n\n## Anmerkung\n\nDas Kapitel beginnt mit einem Paradox: „Und widersprüchlich möchte der Tyrann geliebt werden!“ (19.1), das an das Ende von Kapitel 1 anschließt (T019).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D15", "T015", "T020"], "citation": "", "loc": ["19.4", "19.5", "21.1"], "depends_on": ["T020", "D15", "T015"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T015, l'entreprise néolibérale veut α = 0 ; par T020, elle prend l'épithumogénie en main (19.4).\n2. Le premier enrichissement, fordien, avait ajouté aux affects tristes de la faim les affects joyeux de la consommation ; il a beaucoup fait pour l'alignement, mais pas assez au jugement de l'entreprise néolibérale (19.4).\n3. Par D15, la faim était intrinsèque mais triste, la consommation joyeuse mais extrinsèque : ni l'une ni l'autre ne suffisait à désarmer l'idée que « la vraie vie est ailleurs ». L'ajout stratégique est l'affect joyeux intrinsèque, désir de l'activité pour elle-même (19.5).\n4. Les salariés se rendaient au désir-maître à contrecœur, ou en pensant à autre chose ; « consentants », ils seront « autrement mus. Autrement signifiant plus intensément » (19.5). Le projet néolibéral est un projet de réenchantement : réinternaliser les objets du désir dans l'activité salariale (21.1). ∎\n\n## Scolie\n\nLe chapitre s'ouvre sur un paradoxe : « Et contradictoirement le tyran voudrait se faire aimer ! » (19.1), qui enchaîne sur la fin du chapitre 1 (T019).", "body_en": "## Argument\n\n1. By T015, the neoliberal firm wants α = 0; by T020, it takes epithumogeny in hand (19.4).\n2. The first, Fordist, enrichment had added to the sad affects of hunger the joyful affects of consumption; it did a great deal for alignment, but not enough in the judgement of the neoliberal firm (19.4).\n3. By D15, hunger was intrinsic but sad, consumption joyful but extrinsic: neither sufficed to disarm the idea that \"real life is elsewhere\". The strategic addition is the intrinsic joyful affect, desire for the activity for its own sake (19.5).\n4. Employees went over to the master-desire reluctantly, or thinking of something else; \"consenting\", they will be \"moved otherwise. Otherwise meaning more intensely\" (19.5). The neoliberal project is a project of re-enchantment: re-internalising the objects of desire within wage activity (21.1). ∎\n\n## Scholium\n\nThe chapter opens on a paradox: \"And contradictorily the tyrant would like to be loved!\" (19.1), which follows on from the end of chapter 1 (T019).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D15", "T015", "T020"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D15", "T015", "T020"], "mentions": ["D15", "T015", "T019", "T020"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T022", "file": "theses/T022.md", "type": "these", "partie": "2", "titre": "Le consentement et l'aliénation n'existent pas", "enonce": "Si consentir est l'expression d'une intériorité librement autodéterminée, le consentement n'existe pas, car rien n'agit par soi seul : toute chose est en partie déterminée à agir par des choses extérieures. L'aliénation sombre avec lui : n'étant que l'hétérodétermination, elle est partout. Tous les désirs sont égaux sous le rapport de la détermination ; le refus de consentir aux consentements des autres vient de nos affects.", "titre_en": "Consent and alienation do not exist", "enonce_en": "If consenting is the expression of a freely self-determined inner self, consent does not exist, for nothing acts by itself alone: everything is partly determined to act by external things. Alienation sinks with it: being only heterodetermination, it is everywhere. All desires are equal from the point of view of determination; the refusal to consent to others' consents comes from our affects.", "titre_de": "Zustimmung und Entfremdung gibt es nicht", "enonce_de": "Ist Zustimmen der Ausdruck eines frei sich selbst bestimmenden Inneren, so gibt es keine Zustimmung, denn nichts handelt allein durch sich selbst: Alles ist teilweise von äußeren Dingen zum Handeln bestimmt. Die Entfremdung geht mit ihr unter: Als bloße Fremdbestimmung ist sie überall. Alle Begehren sind unter dem Gesichtspunkt der Bestimmung gleich; die Weigerung, der Zustimmung anderer zuzustimmen, kommt aus unseren Affekten.", "body_de": "## Beweis\n\n1. Die Arbeitssoziologie beobachtet, dass die Angestellten „von selbst laufen“, und spricht von einer neuen „freiwilligen Knechtschaft“, der die Geknechteten *zustimmen* (20.1). Die als Billigung eines freien Willens verstandene Zustimmung (R06) stößt auf die Zustimmungen, die wir nicht anerkennen wollen (20.3).\n2. Nach S12 steht jedes Ding unter der Herrschaft der inadäquaten Kausalität; nach S11 wird nichts ohne äußere Ursache zum Handeln bestimmt. Keine Handlung ist *ganz* die eigene: Die als unbedingte Billigung eines selbstbegründeten Subjekts verstandene Zustimmung gibt es nicht (20.4).\n3. Nach S10 entsteht der Glaube an unsere Freiheit aus dem Bewusstsein unserer Handlungen zusammen mit der Unkenntnis ihrer Ursachen. Wir bewegen uns selbst in einem schwachen Sinn, da es unsere Energie ist, die tätig ist; aber fremdbestimmt (20.4).\n4. Nach T008 ist kein Begehren hinsichtlich seiner Bestimmung mein Werk, und jedes Begehren ist als Ausdruck meiner Macht meines. Die Entfremdung (R07) ist dann nur ein anderer Name für die leidenschaftliche Knechtschaft: allgemein, „gibt es sie nicht“ als das Andere eines unauffindbaren Zustands der Unversehrtheit des Subjekts (20.5).\n5. Alle Begehren sind daher unter dem Gesichtspunkt der Fremdbestimmung gleich. Das Urteil der Entfremdung kommt aus dem Ehrgeiz (S13), der will, dass die anderen nach unserer Sinnesart leben, und aus unseren Lieben und unserem Hass, die uns die Dinge bewerten lassen (S14) (20.6). ∎\n\n## Anmerkung\n\nSpinoza geht sehr weit im Verzicht auf das Sortieren: Wer bequemer am Galgen lebte als an seinem Tisch, wäre töricht, sich nicht zu erhängen (Brief an Blyenbergh, Anm. 53); und „ich lasse jeden nach seiner Sinnesart leben“ (Brief an Oldenburg, Anm. 54) (20.6). Die Überlegung schließt in 28.3: „Es gibt ebenso wenig Zustimmung wie freiwillige Knechtschaft: Es gibt nur glückliche Unterwerfungen“ (T025).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "citation": "« Détermination par le dehors, l’aliénation est elle-même sans dehors »", "loc": ["20.1", "20.3", "20.4", "20.5", "20.6", "28.3"], "depends_on": ["S10", "S11", "S12", "T008", "S13", "S14"], "contre": ["R06", "R07"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. La sociologie du travail constate que les salariés « marchent d'eux-mêmes » et parle d'une nouvelle « servitude volontaire » à laquelle les asservis *consentent* (20.1). Le consentement compris comme approbation d'une volonté libre (R06) bute sur les consentements que nous refusons de valider (20.3).\n2. Par S12, toute chose est sous l'empire de la causalité inadéquate ; par S11, rien n'est déterminé à agir sans une cause extérieure. Aucune action n'est *entièrement* sienne : le consentement, compris comme approbation inconditionnée d'un sujet auto-fondé, n'existe pas (20.4).\n3. Par S10, la croyance en notre liberté naît de la conscience de nos actes jointe à l'ignorance de leurs causes. Nous sommes auto-mobiles en un sens faible, puisque c'est notre énergie qui s'active ; mais hétérodéterminés (20.4).\n4. Par T008, aucun désir n'est mon fait par sa détermination, et tout désir est mien comme expression de ma puissance. L'aliénation (R07) n'est alors qu'un autre nom de la servitude passionnelle : universelle, elle « n'existe pas » comme l'autre d'un introuvable état d'intégrité du sujet (20.5).\n5. Tous les désirs sont donc égaux sous le rapport de l'exodétermination. Le jugement d'aliénation vient de l'ambition (S13), qui veut que les autres vivent selon notre complexion, et de nos amours et haines, qui valorisent les choses (S14) (20.6). ∎\n\n## Scolie\n\nSpinoza va très loin dans le renoncement à trier : qui vivrait plus commodément au gibet qu'à sa table serait insensé de ne pas se pendre (lettre à Blyenbergh, note 53) ; et « je laisse chacun vivre selon sa complexion » (lettre à Oldenburg, note 54) (20.6). Le raisonnement se conclut en 28.3 : « Il n'y a pas plus de consentement qu'il n'y a de servitude volontaire : il n'y a que des assujettissements heureux » (T025).", "body_en": "## Demonstration\n\n1. The sociology of work observes that employees \"run by themselves\" and speaks of a new \"voluntary servitude\" to which the enslaved *consent* (20.1). Consent understood as the approval of a free will (R06) runs up against the consents we refuse to validate (20.3).\n2. By S12, every thing is under the sway of inadequate causality; by S11, nothing is determined to act without an external cause. No action is *entirely* one's own: consent, understood as the unconditioned approval of a self-founded subject, does not exist (20.4).\n3. By S10, the belief in our freedom arises from consciousness of our acts together with ignorance of their causes. We are self-moving in a weak sense, since it is our energy that is active; but heterodetermined (20.4).\n4. By T008, no desire is my doing as to its determination, and every desire is mine as an expression of my power. Alienation (R07) is then only another name for passional servitude: universal, it \"does not exist\" as the other of an unfindable state of integrity of the subject (20.5).\n5. All desires are therefore equal from the point of view of exodetermination. The judgement of alienation comes from ambition (S13), which wants others to live according to our complexion, and from our loves and hatreds, which make us value things (S14) (20.6). ∎\n\n## Scholium\n\nSpinoza goes very far in renouncing sorting: whoever would live more comfortably on the gallows than at his table would be mad not to hang himself (letter to Blyenbergh, note 53); and \"I let everyone live according to his complexion\" (letter to Oldenburg, note 54) (20.6). The reasoning concludes in 28.3: \"There is no more consent than there is voluntary servitude: there are only happy subjections\" (T025).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008"], "mentions": ["R06", "R07", "S10", "S11", "S12", "S13", "S14", "T008", "T025"], "corollaires": [], "mtime": 1794593716.2267714}, {"id": "T023", "file": "theses/T023.md", "type": "these", "partie": "2", "titre": "Le pouvoir est un art d'affecter", "enonce": "Le pouvoir est un art de faire faire ; or faire faire est l'effet même des affects, puisqu'un affect redirige le conatus et fait naître le désir de faire quelque chose. Gouverner, c'est orienter les conatus dans certaines directions : le pouvoir est l'ensemble des pratiques de la colinéarisation.", "titre_en": "Power is an art of affecting", "enonce_en": "Power is an art of having others do; and having others do is the very effect of the affects, since an affect redirects the conatus and gives rise to the desire to do something. Governing is orienting conatuses in certain directions: power is the set of practices of collinearisation.", "
