 une vie humaine, qui ne se définit pas par la seule circulation du sang et les autres fonctions communes à tous les animaux.", "titre_en": "A human life", "enonce_en": "Men aspire to a human life, which is not defined merely by the circulation of the blood and the other functions common to all animals.", "citation": "« une vie humaine, qui se définit non par la seule circulation du sang et par les autres fonctions communes à tous les animaux »", "loc": ["21.3", "43.2", "43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 5", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 21.3. La reproduction de la vie nue ne va guère au-delà de « la circulation du sang » et n'offre pas d'horizon au déploiement de la puissance d'agir : d'où l'intérêt du pouvoir à réjouir ses sujets. Lordon note (note 59) que la formule vise probablement Hobbes. Elle revient à la fin du livre (43.2, 43.4) : « j'entends par là une vie humaine » est le dernier mot, le « vrai bien » vers lequel orienter le progrès (T049).", "body_en": "## In Lordon\n\nQuoted in 21.3. The reproduction of bare life hardly goes beyond \"the circulation of the blood\" and offers no horizon for the unfolding of the power of acting: hence power's interest in gladdening its subjects. Lordon notes (note 59) that the phrase probably targets Hobbes. It returns at the end of the book (43.2, 43.4): \"by that I mean a human life\" is the last word, the \"true good\" towards which progress should be oriented (T049).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S17", "file": "premisses/S17.md", "type": "spinoza", "partie": "P", "titre": "Le conatus cherche la joie", "enonce": "L'esprit s'efforce, autant qu'il le peut, d'imaginer ce qui accroît ou seconde la puissance d'agir du corps, et répugne à imaginer ce qui la réduit ; nous nous efforçons de promouvoir tout ce dont nous imaginons que cela conduit à la joie.", "titre_en": "The conatus seeks joy", "enonce_en": "The mind strives, as far as it can, to imagine what increases or aids the body's power of acting, and is averse to imagining what diminishes it; we strive to further whatever we imagine leads to joy.", "citation": "« L’esprit, autant qu’il le peut, s’efforce d’imaginer ce qui accroît ou ce qui seconde la puissance d’agir du corps »", "loc": ["22.4", "22.8"], "depends_on": [], "contre": [], "ethique": ["3p12", "3p13c", "3p28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nTrois énoncés cités ensemble en 22.4. « Autant qu'il est en lui, le conatus cherche sa joie », jusque dans les situations les plus défavorables : c'est le ressort du réenchantement spontané du travail (T026).", "body_en": "## In Lordon\n\nThree statements quoted together in 22.4. \"As far as it is in it, the conatus seeks its joy\", even in the most unfavourable situations: this is the mainspring of the spontaneous re-enchantment of work (T026).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T026"], "corollaires": [], "mtime": 1794571050.6124642}, {"id": "S18", "file": "premisses/S18.md", "type": "spinoza", "partie": "P", "titre": "L'amour", "enonce": "L'amour est une joie accompagnée de l'idée d'une cause extérieure.", "titre_en": "Love", "enonce_en": "Love is a joy accompanied by the idea of an external cause.", "citation": "", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p13csc", "3ad6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nRenvoi de la note 65 (scolie du corollaire de III, 13). Refait d'après la définition génétique, l'amour donne « la notion la plus générale de la satisfaction objectale », bien au-delà de l'amour érotique ; c'est pourquoi on peut parler d'amour dans le salariat (23.2). Lordon reprend à Laurent Bove « la structure amoureuse du comportement » humain.", "body_en": "## In Lordon\n\nReferred to in note 65 (scholium to the corollary of III, 13). Redone from the genetic definition, love gives \"the most general notion of object satisfaction\", far beyond erotic love; this is why one can speak of love in wage labour (23.2). Lordon borrows from Laurent Bove \"the amorous structure of behaviour\" in humans.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6173997}, {"id": "S19", "file": "premisses/S19.md", "type": "spinoza", "partie": "P", "titre": "Réjouir les autres pour s'en réjouir", "enonce": "Nous nous efforçons de faire tout ce que nous imaginons que les hommes considèrent avec joie ; et qui agit d'une manière dont il imagine qu'elle réjouit les autres est affecté d'une joie accompagnée de l'idée de soi comme cause.", "titre_en": "Gladdening others to rejoice in it", "enonce_en": "We strive to do whatever we imagine men regard with joy; and whoever acts in a way he imagines gladdens others is affected with a joy accompanied by the idea of himself as cause.", "citation": "« nous nous efforcerons d’accomplir tout ce que nous imaginons considéré avec joie par les hommes »", "loc": ["23.1", "23.2"], "depends_on": [], "contre": [], "ethique": ["3p29", "3p30"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 66 et 67 (23.1), repris en 23.2. Lordon en tire le mécanisme de la « demande amoureuse » : je fais ce qui réjouit le maître pour qu'il m'aime et pour me réjouir de l'avoir réjoui (T027).", "body_en": "## In Lordon\n\nNotes 66 and 67 (23.1), taken up in 23.2. Lordon draws from it the mechanism of the \"demand for love\": I do what gladdens the master so that he loves me and so that I rejoice in having gladdened him (T027).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T027"], "corollaires": [], "mtime": 1794571050.6184058}, {"id": "S20", "file": "premisses/S20.md", "type": "spinoza", "partie": "P", "titre": "L'affect, affection du corps et son idée", "enonce": "Par affects, il faut entendre les affections du corps par lesquelles sa puissance d'agir est accrue ou réduite, secondée ou réprimée, et en même temps les idées de ces affections.", "titre_en": "The affect, an affection of the body and its idea", "enonce_en": "By affects are to be understood the affections of the body by which its power of acting is increased or diminished, aided or restrained, and at the same time the ideas of these affections.", "citation": "", "loc": ["23.2", "28.2"], "depends_on": [], "contre": [], "ethique": ["3def3"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 23.2 (note 69), où Lordon rappelle que la joie est définie par Spinoza comme augmentation de la puissance d'agir du corps : le conatus est effort vers davantage de puissance, donc recherche de la joie ; et en 28.2 (notes 87-88) : les affects s'inscrivent d'abord dans les corps, mais ont *aussi* une part mentale, comme idées de ces affections.", "body_en": "## In Lordon\n\nQuoted in 23.2 (note 69), where Lordon recalls that Spinoza defines joy as an increase in the body's power of acting: the conatus is a striving towards more power, hence a search for joy; and in 28.2 (notes 87-88): affects are inscribed first in bodies, but *also* have a mental part, as ideas of these affections.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6184058}, {"id": "S21", "file": "premisses/S21.md", "type": "spinoza", "partie": "P", "titre": "L'âme et le corps, une seule chose", "enonce": "L'âme et le corps sont une seule et même chose, conçue tantôt sous l'attribut de la Pensée, tantôt sous celui de l'Étendue ; il n'y a donc pas d'action causale de l'une sur l'autre.", "titre_en": "Mind and body, one and the same thing", "enonce_en": "Mind and body are one and the same thing, conceived now under the attribute of Thought, now under that of Extension; so there is no causal action of one on the other.", "citation": "", "loc": ["28.2"], "depends_on": [], "contre": [], "ethique": ["3p2", "3p2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExposé en 28.2, contre la glande pinéale de Descartes, sans renvoi précis. *[renvoi reconstruit : III, 2 nie que le corps puisse déterminer l'âme à penser et l'âme le corps au mouvement ; le scolie dit qu'ils sont une seule et même chose.]* Lordon en tire que les idées, appartenant à la Pensée, sont « sans lieu » : nos états d'âme ne sauraient être dits « intérieurs » (T025).", "body_en": "## In Lordon\n\nSet out in 28.2, against Descartes's pineal gland, without a precise reference. *[reconstructed reference: III, 2 denies that the body can determine the mind to think or the mind the body to move; the scholium says they are one and the same thing.]* Lordon concludes that ideas, belonging to Thought, are \"without place\": our states of mind cannot be called \"inner\" (T025).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T025"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S22", "file": "premisses/S22.md", "type": "spinoza", "partie": "P", "titre": "Faire croire aux hommes qu'ils vivent selon leur libre décret", "enonce": "Il faut conduire les hommes de telle façon qu'ils aient le sentiment, non d'être conduits, mais de vivre selon leur complexion et leur libre décret.", "titre_en": "Making men believe they live by their own free decree", "enonce_en": "Men must be led in such a way that they feel not that they are being led, but that they are living according to their own complexion and free decree.", "citation": "« conduire les hommes de façon telle qu’ils aient le sentiment, non pas d’être conduits, mais de vivre selon leur complexion et leur libre décret »", "loc": ["29.3", "30.1"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, X, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nMaxime de prudence politique adressée à l'État (note 92), où Lordon reconnaît « le projet même de l'entreprise néolibérale » (29.3) et la formule du coaching (30.1).", "body_en": "## In Lordon\n\nA maxim of political prudence addressed to the State (note 92), in which Lordon recognises \"the very project of the neoliberal firm\" (29.3) and the formula of coaching (30.1).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S23", "file": "premisses/S23.md", "type": "spinoza", "partie": "P", "titre": "On aime et hait davantage ce qu'on imagine libre", "enonce": "L'amour et la haine envers un objet que nous imaginons libre doivent être, à cause égale, plus grands qu'envers un objet nécessaire.", "titre_en": "We love and hate more what we imagine to be free", "enonce_en": "Love and hatred towards an object we imagine to be free must, other things being equal, be greater than towards a necessary object.", "citation": "« L’amour et la haine doivent être plus grands, à cause égale, envers un objet que nous imaginons être libre qu’envers un objet nécessaire »", "loc": ["29.4", "34.3"], "depends_on": [], "contre": [], "ethique": ["3p49"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 29.4 (note 95) : Spinoza « touche là le mécanisme affectif qui trace d'emblée la limite des constructivismes politiques » (T032). Repris en 34.3 : la division sociale du désir, diffuse et impersonnelle, est vécue comme une nécessité, un *fatum* sans dieu (T036).", "body_en": "## In Lordon\n\nQuoted in 29.4 (note 95): Spinoza \"touches here the affective mechanism that from the outset draws the limit of political constructivisms\" (T032). Taken up in 34.3: the social division of desire, diffuse and impersonal, is experienced as a necessity, a *fatum* without a god (T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T032", "T036"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S24", "file": "premisses/S24.md", "type": "spinoza", "partie": "P", "titre": "Un affect ne cède qu'à un affect plus fort", "enonce": "Un affect ne peut être réprimé ni supprimé que par un affect contraire et plus fort que lui.", "titre_en": "An affect yields only to a stronger affect", "enonce_en": "An affect can be restrained or removed only by a contrary affect stronger than it.", "citation": "« un affect ne peut être ni réprimé ni supprimé si ce n’est par un affect contraire et plus fort que l’affect à réprimer »", "loc": ["31.4"], "depends_on": [], "contre": [], "ethique": ["4p7"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 31.4 (note 104) : en fait de « consentement », il n'y a que l'affrontement intrapsychique des affects joyeux et tristes selon cette loi de puissance (T034).", "body_en": "## In Lordon\n\nQuoted in 31.4 (note 104): by way of \"consent\", there is only the intrapsychic clash of joyful and sad affects according to this law of power (T034).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T034"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S25", "file": "premisses/S25.md", "type": "spinoza", "partie": "P", "titre": "Être affecté de nombreuses manières est utile", "enonce": "Ce qui dispose le corps humain à être affecté de nombreuses manières, ou le rend capable d'affecter les corps extérieurs de nombreuses manières, est utile à l'homme ; d'où le conseil de donner au corps des apports aussi variés que sa structure est complexe.", "titre_en": "Being affected in many ways is useful", "enonce_en": "Whatever disposes the human body to be affected in many ways, or makes it capable of affecting external bodies in many ways, is useful to man; hence the advice to give the body nourishment as varied as its structure is complex.", "citation": "« ce qui prédispose la corps humain à être affecté selon de nombreuses modalités, ou le rend capable d’affecter les corps extérieurs selon de nombreuses modalités, est utile à l’homme »", "loc": ["33.3", "40.3"], "depends_on": [], "contre": [], "ethique": ["4p38", "4p45c2sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nCité en 33.3 (note 106) : l'« utile propre » de chacun est d'échapper aux fixations du conatus pour effectuer la variété de sa puissance (T035). En 40.3 (notes 137-138), avec le « scolie diététique » (nourritures, senteurs, sons, plaisirs des yeux), il fonde, d'après Pascal Sévérac, la lecture de l'aliénation comme fixation (D25, T044).", "body_en": "## In Lordon\n\nQuoted in 33.3 (note 106): each one's \"own advantage\" is to escape the fixations of the conatus so as to enact the variety of its power (T035). In 40.3 (notes 137-138), with the \"dietary scholium\" (food, scents, sounds, pleasures of the eye), it grounds, following Pascal Sévérac, the reading of alienation as fixation (D25, T044).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25", "T035", "T044"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S26", "file": "premisses/S26.md", "type": "spinoza", "partie": "P", "titre": "On ne peut pas ce qu'on imagine ne pas pouvoir", "enonce": "Ce qu'on imagine ne pas pouvoir, on l'imagine nécessairement, et l'on est par cette imagination même disposé de telle sorte qu'on ne le peut effectivement pas.", "titre_en": "One cannot do what one imagines one cannot do", "enonce_en": "What one imagines one cannot do, one imagines necessarily, and by this very imagination one is so disposed that one really cannot do it.", "citation": "« Tout ce qu’en effet l’on imagine ne pas pouvoir, on l’imagine nécessairement, et l’on est par cette imagination même disposé de telle sorte qu’on n’a effectivement pas le pouvoir qu’on imagine ne pas avoir »", "loc": ["34.1", "37.5"], "depends_on": [], "contre": [], "ethique": ["3ad28"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nExplication de la définition des affects 28 (note 107) : « voilà le mécanisme passionnel de conversion de l'assignation en auto-assignation » (34.1). Repris en 37.5 pour les effets d'« impuissantisation » de la division du travail.", "body_en": "## In Lordon\n\nExplanation of the definition of the affects 28 (note 107): \"there is the passional mechanism converting assignment into self-assignment\" (34.1). Taken up in 37.5 for the \"impotentising\" effects of the division of labour.", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S27", "file": "premisses/S27.md", "type": "spinoza", "partie": "P", "titre": "Le désir cherche dans les autres sa confirmation", "enonce": "Si nous imaginons qu'un autre aime ou désire ce que nous-mêmes aimons ou désirons, nous l'aimerons ou le désirerons avec plus de constance.", "titre_en": "Desire seeks its confirmation in others", "enonce_en": "If we imagine that another loves or desires what we ourselves love or desire, we shall love or desire it more constantly.", "citation": "« Si nous imaginons qu’un autre aime ou désire […] ce que nous-mêmes aimons ou désirons […], par là même nous aimerons, désirerons […] avec plus de constance »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": ["3p31"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 108. Avec le scolie du corollaire (S13), c'est la « contradiction sociale princeps du désir » : il cherche dans le regard des autres sa confirmation, et tente d'éloigner de ses objets ceux qu'il y a amenés (34.2 ; T036).", "body_en": "## In Lordon\n\nNote 108. With the scholium to the corollary (S13), this is the \"primary social contradiction of desire\": it seeks its confirmation in the gaze of others, and tries to keep away from its objects those it has brought to them (34.2; T036).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["S13", "T036"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S28", "file": "premisses/S28.md", "type": "spinoza", "partie": "P", "titre": "La nature est une et commune à tous", "enonce": "La nature humaine est une et commune à tous ; c'est la puissance et la culture qui nous trompent, en nous faisant juger différemment une même action selon qui la fait.", "titre_en": "Nature is one and common to all", "enonce_en": "Human nature is one and common to all; it is power and culture that deceive us, making us judge the same action differently according to who performs it.", "citation": "« La nature [humaine] est une, et commune à tous »", "loc": ["34.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VII, 27", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 110 et 112. Pour Lordon, c'est « la réaffirmation la plus radicale de l'égalité anthropologique fondamentale », que recouvre l'arbitraire des classifications sociales (34.2 ; T036). Il la rapproche du premier des *Trois discours sur la condition des grands* de Pascal : votre bien n'est pas « un titre de nature, mais d'un établissement humain ».", "body_en": "## In Lordon\n\nNotes 110 and 112. For Lordon, it is \"the most radical reaffirmation of fundamental anthropological equality\", which the arbitrariness of social classifications covers over (34.2; T036). He compares it with the first of Pascal's *Three Discourses on the Condition of the Great*: your wealth is not \"a title of nature, but of a human establishment\".", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T036"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S29", "file": "premisses/S29.md", "type": "spinoza", "partie": "P", "titre": "La puissance est toujours en acte", "enonce": "L'effort par lequel chaque chose s'efforce de persévérer dans son être n'est rien en dehors de son essence actuelle ; réalité et perfection sont une même chose.", "titre_en": "Power is always in act", "enonce_en": "The striving by which each thing strives to persevere in its being is nothing apart from its actual essence; reality and perfection are one and the same.", "citation": "« Par réalité et par perfection, j’entends la même chose »", "loc": ["35.2", "40.1", "40.2"], "depends_on": [], "contre": [], "ethique": ["3p7", "2def6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n*Éthique* II, définition 6, citée en 35.2 et 40.1 ; III, 7, en note 134 (40.2). Lordon en tire, avec Pascal Sévérac, qu'« il n'y a pas de réserve dans l'ontologie spinoziste » : l'immanence intégrale exclut la différence aristotélicienne de la puissance et de l'acte ; « toujours le conatus est au bout de ce qu'il peut », même s'il peut très peu, et le conditionnel passé, « j'aurais pu », est « le non-sens spinoziste par excellence » (40.1). Elle exclut aussi toute valeur objective qui ferait norme (35.2 ; T037).", "body_en": "## In Lordon\n\n*Ethics* II, definition 6, quoted in 35.2 and 40.1; III, 7, in note 134 (40.2). Lordon concludes, with Pascal Sévérac, that \"there is no reserve in Spinozist ontology\": integral immanence excludes the Aristotelian difference between potency and act; \"the conatus is always at the limit of what it can do\", even if it can do very little, and the past conditional, \"I could have\", is \"the Spinozist nonsense par excellence\" (40.1). It also excludes any objective value that would set a norm (35.2; T037).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T037"], "corollaires": [], "mtime": 1794571050.6194236}, {"id": "S30", "file": "premisses/S30.md", "type": "spinoza", "partie": "P", "titre": "L'indignation", "enonce": "L'indignation est la haine envers quelqu'un qui a fait du mal à autrui.", "titre_en": "Indignation", "enonce_en": "Indignation is hatred towards someone who has done harm to another.", "citation": "", "loc": ["38.4", "39.5"], "depends_on": [], "contre": [], "ethique": ["3ad20"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\n« Spinoza nomme génériquement “indignation” cet affect, non pas moral mais politique par excellence », qui coalise les sujets dans la révolte après une offense faite parfois à un seul (38.4). *[renvoi reconstruit : Lordon ne donne pas de référence ; la définition est celle de III, définition des affects 20. Le sens politique qu'il en tire vient surtout du* Traité politique.*]* L'indignation est le nom de la dynamique qui « réouvre l'angle α » (39.5 ; T043).", "body_en": "## In Lordon\n\n\"Spinoza generically names 'indignation' this affect, not moral but political par excellence\", which brings subjects together in revolt after an offence sometimes done to a single one (38.4). *[reconstructed reference: Lordon gives no reference; the definition is that of III, definition of the affects 20. The political sense he draws from it comes mostly from the* Political Treatise.*]* Indignation is the name of the dynamic that \"reopens the angle α\" (39.5; T043).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T043"], "corollaires": [], "mtime": 1794571050.626687}, {"id": "S31", "file": "premisses/S31.md", "type": "spinoza", "partie": "P", "titre": "Les affects, propriétés naturelles de l'homme", "enonce": "Les affects doivent être considérés comme des propriétés de la nature humaine, au même titre que la chaleur, le froid, la tempête ou le tonnerre appartiennent à la nature de l'air : fâcheux, mais nécessaires, et ayant des causes déterminées.", "titre_en": "The affects, natural properties of man", "enonce_en": "The affects must be regarded as properties of human nature, just as heat, cold, storm and thunder belong to the nature of the air: troublesome, but necessary, and with determinate causes.", "citation": "« comme des propriétés qui appartiennent [à la nature humaine], comme appartiennent à la nature de l’air chaleur, froid, tempête, tonnerre […] »", "loc": ["41.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 4", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 141. Les affects, quoique éprouvés individuellement, « n'ont rien de subjectif : ils sont objectivement causés » ; le rapport subjectif du salarié à sa situation est objectivement produit (41.3 ; T045).", "body_en": "## In Lordon\n\nNote 141. The affects, though felt individually, \"have nothing subjective about them: they are objectively caused\"; the employee's subjective relation to his situation is objectively produced (41.3; T045).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T045"], "corollaires": [], "mtime": 1794571050.6286573}, {"id": "S32", "file": "premisses/S32.md", "type": "spinoza", "partie": "P", "titre": "L'affect commun qui assemble une multitude", "enonce": "Une multitude s'assemble et s'accorde non par la raison, mais sous l'effet d'un affect commun.", "titre_en": "The common affect that assembles a multitude", "enonce_en": "A multitude comes together and agrees not by reason, but under the effect of a common affect.", "citation": "« l’affect commun par lequel une multitude pourrait venir à s’assembler »", "loc": ["41.5"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, VI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nParaphrase du *Traité politique*, VI, 1, signalée comme telle (note 143) : en maltraitant, le capitalisme nourrit l'affect commun du mécontentement (41.5 ; T046).", "body_en": "## In Lordon\n\nA paraphrase of the *Political Treatise*, VI, 1, flagged as such (note 143): by mistreating, capitalism feeds the common affect of discontent (41.5; T046).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T046"], "corollaires": [], "mtime": 1794571050.629704}, {"id": "S33", "file": "premisses/S33.md", "type": "spinoza", "partie": "P", "titre": "L'affect tenace", "enonce": "La force d'une passion peut surpasser les autres actions d'un homme, ou sa puissance, au point que l'affect se fixe en lui de façon tenace.", "titre_en": "The stubborn affect", "enonce_en": "The force of a passion can surpass a man's other actions, or his power, so that the affect becomes stubbornly fixed in him.", "citation": "« La force d’une passion, ou affect, peut surpasser les autres actions d’un homme, ou sa puissance, au point que l’affect se fixe en lui d’une façon tenace »", "loc": ["40.2"], "depends_on": [], "contre": [], "ethique": ["4p6"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 135. Avec « l'occupation de l'esprit » (Sévérac, note 136), c'est le sens à donner à l'aliénation, si l'on veut sauver le mot : l'esprit rempli par trop peu de choses, mais entièrement (40.2 ; D25).", "body_en": "## In Lordon\n\nNote 135. With \"the occupation of the mind\" (Sévérac, note 136), this is the meaning to give to alienation, if one wants to save the word: the mind filled by too few things, but entirely (40.2; D25).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["D25"], "corollaires": [], "mtime": 1794571050.629704}, {"id": "S34", "file": "premisses/S34.md", "type": "spinoza", "partie": "P", "titre": "Rien n'est plus utile à l'homme que l'homme", "enonce": "Rien n'est plus utile à l'homme que l'homme ; les hommes conduits par la raison ne poursuivent rien pour eux-mêmes qu'ils ne le désirent aussi pour les autres.", "titre_en": "Nothing is more useful to man than man", "enonce_en": "Nothing is more useful to man than man; men guided by reason seek nothing for themselves that they do not also desire for others.", "citation": "« rien n’est plus utile à l’homme que l’homme »", "loc": ["42.2", "43.1"], "depends_on": [], "contre": [], "ethique": ["4p18sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 147 et 155. La première formule éclaire la division du travail, « ce que les hommes ont de meilleur » (42.2 ; T047) ; la seconde donne « la formule la plus haute du communisme », la non-rivalité des vrais biens (43.1 ; T048).", "body_en": "## In Lordon\n\nNotes 147 and 155. The first phrase sheds light on the division of labour, \"the best that men have\" (42.2; T047); the second gives \"the highest formula of communism\", the non-rivalry of true goods (43.1; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047", "T048"], "corollaires": [], "mtime": 1794571050.6313002}, {"id": "S35", "file": "premisses/S35.md", "type": "spinoza", "partie": "P", "titre": "La joie de se considérer soi-même", "enonce": "La joie de considérer sa propre puissance se renouvelle chaque fois qu'on considère ses vertus : chacun s'empresse donc de raconter ses hauts faits et d'étaler ses forces, et c'est pourquoi les hommes sont pénibles les uns aux autres.", "titre_en": "The joy of contemplating oneself", "enonce_en": "The joy of contemplating one's own power is renewed each time one contemplates one's virtues: so everyone is eager to tell of his deeds and display his strength, which is why men are troublesome to one another.", "citation": "« chacun s’empresse de raconter ses faits et gestes et d’étaler ostensiblement ses forces physiques et morales ; c’est pour cette raison aussi que les hommes sont pénibles les uns aux autres »", "loc": ["42.2"], "depends_on": [], "contre": [], "ethique": ["3p55c1sc"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 148. Lordon prolonge le propos « au-delà de ce qu'il dit textuellement » : le pénible est aussi la captation individuelle des joies extrinsèques de l'action collective (42.2 ; T047).", "body_en": "## In Lordon\n\nNote 148. Lordon extends the point \"beyond what it literally says\": what is troublesome is also the individual capture of the extrinsic joys of collective action (42.2; T047).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T047"], "corollaires": [], "mtime": 1794571050.6313002}, {"id": "S36", "file": "premisses/S36.md", "type": "spinoza", "partie": "P", "titre": "Le vrai bien est commun", "enonce": "Le bien que désire pour soi celui qui suit la vertu, il le désirera aussi pour les autres ; les hommes, en tant qu'ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes.", "titre_en": "The true good is common", "enonce_en": "The good that whoever follows virtue desires for himself, he will also desire for others; men, insofar as they live under the guidance of reason, are supremely useful to men.", "citation": "« les hommes, en tant qu’ils vivent sous la conduite de la raison, sont suprêmement utiles aux hommes »", "loc": ["42.4"], "depends_on": [], "contre": [], "ethique": ["4p37"], "ref": "", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 153. Le vrai bien est celui dont il faut souhaiter que les autres le possèdent en même temps que soi, comme la raison : c'est « peut-être la définition du communisme véritable » (42.4 ; T048).", "body_en": "## In Lordon\n\nNote 153. The true good is the one we must wish others to possess at the same time as ourselves, like reason: it is \"perhaps the definition of true communism\" (42.4; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794571050.6313002}, {"id": "S37", "file": "premisses/S37.md", "type": "spinoza", "partie": "P", "titre": "Prendre les hommes tels qu'ils sont", "enonce": "En politique, il faut prendre les hommes tels qu'ils sont et non tels qu'on voudrait qu'ils soient, sous peine de n'écrire qu'une chimère bonne pour l'île d'Utopie.", "titre_en": "Taking men as they are", "enonce_en": "In politics, men must be taken as they are and not as one would wish them to be, on pain of writing only a chimera fit for the island of Utopia.", "citation": "« tels qu’ils sont et non tels qu’ [on] voudrait qu’ils fussent »", "loc": ["23.3", "42.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, I, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 150-151. Lordon y lit la version spinoziste de la vertu matérialiste selon Althusser : « ne plus se raconter d'histoires » (42.4). Le *Traité politique* est déjà cité ainsi en 23.3 (note 72).", "body_en": "## In Lordon\n\nNotes 150-151. Lordon reads in it the Spinozist version of materialist virtue according to Althusser: \"no longer telling oneself stories\" (42.4). The *Political Treatise* is already quoted this way in 23.3 (note 72).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794571050.6313002}, {"id": "S38", "file": "premisses/S38.md", "type": "spinoza", "partie": "P", "titre": "Cultiver la vie ou éviter la mort", "enonce": "Une Cité qui ne tient ses sujets que par la crainte mérite le nom de solitude plutôt que de Cité ; une multitude conduite par l'espoir s'applique à cultiver la vie, une multitude soumise par la crainte, seulement à éviter la mort.", "titre_en": "Cultivating life or avoiding death", "enonce_en": "A Commonwealth that holds its subjects only by fear deserves the name of solitude rather than Commonwealth; a multitude led by hope strives to cultivate life, a multitude subdued by fear only to avoid death.", "citation": "« L’une s’applique à cultiver la vie, l’autre seulement à éviter la mort »", "loc": ["43.2"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, V, 4 et V, 6", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNotes 157-158. Lordon restitue le mot « solitude » de la traduction d'Appuhn. C'est par là que « se hiérarchisent les différents régimes de la vie passionnelle collective » : non par le relâchement de la servitude, mais par le jeu plus ou moins réjouissant de leurs formes institutionnelles (43.2 ; T049).", "body_en": "## In Lordon\n\nNotes 157-158. Lordon restores the word \"solitude\" from Appuhn's translation. This is how \"the different regimes of collective passional life are ranked\": not by the loosening of bondage, but by the more or less gladdening play of their institutional forms (43.2; T049).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794571050.6313002}, {"id": "S39", "file": "premisses/S39.md", "type": "spinoza", "partie": "P", "titre": "Le conatus n'exclut ni conflits ni haines", "enonce": "Le droit naturel, qui s'étend aussi loin que la puissance de chacun, n'exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni rien de ce que l'appétit conseille.", "titre_en": "The conatus excludes neither conflicts nor hatreds", "enonce_en": "Natural right, which extends as far as each one's power, excludes neither conflicts, nor hatreds, nor anger, nor deceit, nor anything appetite advises.", "citation": "« n’exclut ni les conflits, ni les haines, ni la colère, ni les ruses, ni absolument rien de ce que l’appétit conseille »", "loc": ["43.3"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, II, 8", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 161. Lordon ajoute que Spinoza fait remarquer que, si les hommes étaient des sages, conduits par la raison, ils n'auraient besoin ni de lois ni d'institutions politiques ; mais ils ne le sont pas (43.3). D'où l'impossibilité d'une éradication définitive de la violence, que rêvait Marx (43.3 ; T048).", "body_en": "## In Lordon\n\nNote 161. Lordon adds that Spinoza remarks that if men were sages, guided by reason, they would need neither laws nor political institutions; but they are not (43.3). Hence the impossibility of a definitive eradication of violence, which Marx dreamed of (43.3; T048).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T048"], "corollaires": [], "mtime": 1794571050.6350923}, {"id": "S40", "file": "premisses/S40.md", "type": "spinoza", "partie": "P", "titre": "La démocratie, État absolu en tout", "enonce": "La démocratie est le troisième type d'État, « absolu en tout » (*omnino absolutum imperium*).", "titre_en": "Democracy, the absolute State in every respect", "enonce_en": "Democracy is the third type of State, \"absolute in every respect\" (*omnino absolutum imperium*).", "citation": "« J’en viens enfin à ce troisième type d’État, absolu en tout, que nous appelons “démocratique” »", "loc": ["43.4"], "depends_on": [], "contre": [], "ethique": [], "ref": "Traité politique, XI, 1", "lien_explicite": null, "statut_revision": "verifie-texte", "body": "## Chez Lordon\n\nNote 164. Chapitre inachevé, « ouverture à la fois opaque et vertigineuse » : la promesse de l'État absolu serait celle de la multitude à nouveau souveraine, toute *potestas* émanant de la *potentia multitudinis* (43.4, note 162 ; T049).", "body_en": "## In Lordon\n\nNote 164. An unfinished chapter, an \"opening both opaque and dizzying\": the promise of the absolute State would be that of the multitude sovereign once again, all *potestas* emanating from the *potentia multitudinis* (43.4, note 162; T049).", "sections_en": ["In Lordon"], "demo_refs_en": [], "sections": ["Chez Lordon"], "demo_refs": [], "mentions": ["T049"], "corollaires": [], "mtime": 1794571050.636261}, {"id": "T001", "file": "theses/T001.md", "type": "these", "partie": "0", "titre": "Le pouvoir patronal est un effet de structure qui agit par les affects", "enonce": "Que certains hommes, les patrons, « puissent » en amener d'autres à entrer dans leur désir, ce pouvoir ne leur appartient pas : il est l'effet de la structure du rapport salarial. Mais les structures ne disent pas ce qui fait leur efficacité ; la réponse spinoziste est : les affects. D'où le programme du livre : combiner un structuralisme des rapports (Marx) et une anthropologie des passions (Spinoza).", "titre_en": "The employer's power is an effect of structure that acts through the affects", "enonce_en": "That some men, the bosses, \"can\" bring others to enter into their desire is a power that does not belong to them: it is the effect of the structure of the wage relation. But structures do not say what makes them effective; the Spinozist answer is: the affects. Hence the book's programme: to combine a structuralism of relations (Marx) with an anthropology of the passions (Spinoza).", "citation": "« la proposition de combiner un structuralisme des rapports et une anthropologie des passions »", "loc": ["01.2", "01.3", "01.4", "01.5"], "depends_on": ["M01"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. La Boétie avertit que l'habitude de la servitude en fait perdre de vue la condition : les asservissements réussis coupent, dans l'imagination des asservis, les affects tristes de l'idée de l'asservissement. Ainsi le fait patronal, très étonnant, n'étonne plus personne (01.2).\n2. Ce pouvoir n'appartient pas aux patrons : par M01, il est l'effet d'une configuration de structures sociales, le rapport salarial comme double séparation (01.3).\n3. Dégager les structures ne dit pas encore « à quoi » elles fonctionnent : ce qui fait *in concreto* leur efficacité, « non pas le fantôme mais le moteur dans la machine ». La réponse spinoziste est : les affects (01.4).\n4. « La vie sociale n'est que l'autre nom de la vie passionnelle collective » : sous des formes institutionnelles très diverses, affects et forces de désir restent le *primum mobile*. Reconnaître que les affects sont structurés n'interdit donc pas de reprendre le problème salarial « par les passions » (01.5). ∎\n\n## Scolie\n\nL'avant-propos s'ouvre sur Kant : le libéralisme commande de ne jamais traiter l'humanité simplement comme un moyen ; le salariat est cette « magnifique rencontre de deux libertés », celle des uns d'utiliser les autres et celle des autres de se laisser utiliser (01.1). Marx est postérieur à Spinoza, mais c'est Spinoza qui peut aider à le compléter (01.4). Le livre ne prétend pas ajouter à la psychologie ou à la sociologie du travail dans leur registre, mais leur faire « une proposition plus abstraite » (01.3).", "body_en": "## Argument\n\n1. La Boétie warns that the habit of servitude makes one lose sight of its condition: successful subjugations cut off, in the imagination of the subjugated, the sad affects from the idea of subjugation. So the employer fact, so astonishing, no longer astonishes anyone (01.2).\n2. This power does not belong to the bosses: by M01, it is the effect of a configuration of social structures, the wage relation as a double separation (01.3).\n3. Bringing out the structures does not yet say \"on what\" they run: what makes them effective *in concreto*, \"not the ghost but the engine in the machine\". The Spinozist answer is: the affects (01.4).\n4. \"Social life is only another name for collective passional life\": under very diverse institutional forms, affects and forces of desire remain the *primum mobile*. Recognising that affects are structured does not therefore forbid taking up the wage problem again \"through the passions\" (01.5). ∎\n\n## Scholium\n\nThe foreword opens with Kant: liberalism commands never to treat humanity merely as a means; wage labour is that \"magnificent encounter of two freedoms\", that of some to use others and that of the others to let themselves be used (01.1). Marx comes after Spinoza, but it is Spinoza who can help complete him (01.4). The book does not claim to add to the psychology or sociology of work in their own register, but to make them \"a more abstract proposal\" (01.3).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["M01"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["M01"], "mentions": ["M01"], "corollaires": [], "mtime": 1794571189.136971}, {"id": "T002", "file": "theses/T002.md", "type": "these", "partie": "0", "titre": "Les dominés heureux et le triangle de l'engagement pour autrui", "enonce": "Le capitalisme contemporain produit des salariés contents, qui déconcertent une idée trop simple de la domination ; faute de demander ce que consentir veut dire, on se rabat sur la « servitude volontaire ». Il faut plutôt partir du triangle élémentaire : le désir d'un, la puissance d'agir des autres, et les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre.", "titre_en": "The happy dominated and the triangle of commitment to others", "enonce_en": "Contemporary capitalism produces contented employees, who baffle an overly simple idea of domination; for want of asking what consenting means, one falls back on \"voluntary servitude\". One should rather start from the elementary triangle: the desire of one, the power of acting of others, and the affects, produced by the structures of the wage relation, that determine their encounter.", "citation": "« le désir d’un, la puissance d’agir des autres, les affects, produits par les structures du rapport salarial, qui déterminent leur rencontre »", "loc": ["01.5", "01.6", "01.7", "01.8", "01.9"], "depends_on": ["T001"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T001, il faut reprendre le salariat par les passions. Or il faut alors tenir ensemble des faits disparates : aller au travail pour ne pas dépérir, être racheté par ses plaisirs de consommateur, engloutir sa vie au travail, adhérer avec enthousiasme, basculer un jour dans la révolte (01.5).\n2. Le paysage passionnel du capitalisme contemporain est bien plus riche qu'au temps de Marx. Les cadres, « matériellement du côté du travail et symboliquement du côté du capital », sont le prototype du salariat content, alors même que le capitalisme régresse *aussi* vers la coercition la plus brutale. Une idée trop simple de la domination est « déconcertée au spectacle des dominés heureux » (01.6-01.7).\n3. Faute de demander ce que consentir veut dire, les faits de « consentement » déstabilisent les concepts d'exploitation, d'aliénation et de domination, et l'on ressasse la formule de la servitude volontaire (R01), oxymore suggestif mais impropre à la théorie (01.8).\n4. Être mobilisé, réticent ou révolté, ce sont autant de manières d'être affecté comme salarié, c'est-à-dire déterminé à entrer dans un désir qui n'est pas d'abord le sien. Le mystère de l'engagement pour autrui se loge dans le triangle du désir d'un, de la puissance d'agir des autres et des affects qui règlent leur rencontre (01.9). ∎\n\n## Scolie\n\nLordon reconnaît le travail de la sociologie héritière de Bourdieu, dont la violence symbolique visait ce croisement de la domination et du consentement (01.7) ; rendre les dominés contents est l'une des plus vieilles ficelles de l'art de régner. Le but est de « discuter » le capitalisme, au double sens de la critique et de l'analyse, avec l'espoir qu'il entre « dans la région du dépassable » (01.9). Le chapitre 1 donne leurs noms aux sommets du triangle : désir-maître (D03), enrôlement (D02) ; la question du consentement est l'objet du chapitre 2.", "body_en": "## Argument\n\n1. By T001, wage labour must be taken up again through the passions. But one must then hold together disparate facts: going to work so as not to waste away, being redeemed by one's pleasures as a consumer, sinking one's life into work, adhering with enthusiasm, tipping over one day into revolt (01.5).\n2. The passional landscape of contemporary capitalism is far richer than in Marx's time. Managers, \"materially on the side of labour and symbolically on the side of capital\", are the prototype of the contented employee, even as capitalism *also* regresses towards the most brutal coercion. An overly simple idea of domination is \"baffled at the spectacle of the happy dominated\" (01.6-01.7).\n3. For want of asking what consenting means, the facts of \"consent\" destabilise the concepts of exploitation, alienation and domination, and one harps on the formula of voluntary servitude (R01), a suggestive oxymoron but unfit for theory (01.8).\n4. Being mobilised, reluctant or rebellious are so many ways of being affected as an employee, that is, determined to enter into a desire that is not first one's own. The mystery of commitment to others lodges in the triangle of the desire of one, the power of acting of others and the affects that govern their encounter (01.9). ∎\n\n## Scholium\n\nLordon acknowledges the work of the sociology descended from Bourdieu, whose symbolic violence aimed at this crossing of domination and consent (01.7); keeping the dominated content is one of the oldest tricks of the art of ruling. The aim is to \"discuss\" capitalism, in the double sense of critique and analysis, in the hope that it enters \"the region of the surpassable\" (01.9). Chapter 1 gives names to the vertices of the triangle: master-desire (D03), enlistment (D02); the question of consent is the subject of chapter 2.", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["R01", "T001"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["R01", "T001"], "mentions": ["D02", "D03", "R01", "T001"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T003", "file": "theses/T003.md", "type": "these", "partie": "1", "titre": "Le désir de faire est légitime, non le désir de faire faire", "enonce": "Au sens du conatus, la liberté d'entreprendre est la liberté de désirer, irréfragable sous les restrictions que fixe chaque société. Mais cette légitimité ne s'étend pas au désir de faire faire : dès qu'une entreprise enrôle d'autres puissances d'agir, se pose la question politique de la participation à son organisation et de l'appropriation de ses produits, celle de la capture par un désir-maître.", "titre_en": "The desire to do is legitimate, not the desire to have others do", "enonce_en": "In the sense of the conatus, freedom of enterprise is the freedom to desire, irrefutable under the restrictions each society sets. But this legitimacy does not extend to the desire to have others do: as soon as an enterprise enlists other powers of acting, there arises the political question of participation in its organisation and of the appropriation of its products, that of capture by a master-desire.", "citation": "« la légitimité de son “envie de faire” ne s’étend pas à une envie de faire faire »", "loc": ["03.1", "04.1"], "depends_on": ["D01", "D02", "D03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D01, exister, c'est désirer et s'activer ; *conor* signifie « entreprendre ». L'histoire délimite les objets de désir licites ; sous ces réserves, la liberté d'entreprendre est celle du conatus, et jouit d'une évidence *a priori* (03.1).\n2. L'entreprise, en tant que désir, se conçoit donc légitimement en première personne : « j'ai envie de faire quelque chose ». Fort bien, « mais qu'il le fasse lui-même – s'il le peut » (04.1).\n3. La division du travail, jointe à l'ambition des hommes, conduit à poursuivre la plupart des désirs de production collectivement. Embarquer d'autres puissances dans son désir, c'est l'enrôlement (D02) ; c'est là que naît le rapport salarial (04.1).\n4. Cette liberté-là n'est pas *a priori* : la collaboration pose la question de ses formes politiques, celle de la capture par le sujet du désir-maître (D03) (04.1). ∎\n\n## Scolie\n\nL'entrepreneur qui proteste qu'on bride sa « liberté d'entreprendre » ne parle que des élans de son conatus : « J'ai un désir conforme à la division du travail et on m'empêche de le poursuivre » (03.1). Sur ce point, Lordon lui donne raison : rapportée à la constitution désirante de chaque être, « cette liberté-là est irréfragable » (03.1).", "body_en": "## Argument\n\n1. By D01, to exist is to desire and to be active; *conor* means \"to undertake\". History delimits the licit objects of desire; under these reservations, freedom of enterprise is that of the conatus, and enjoys an *a priori* self-evidence (03.1).\n2. The enterprise, as desire, can therefore legitimately be conceived in the first person: \"I want to do something\". Very well, \"but let him do it himself – if he can\" (04.1).\n3. The division of labour, together with men's ambition, leads them to pursue most desires of production collectively. Bringing other powers into one's desire is enlistment (D02); this is where the wage relation is born (04.1).\n4. That freedom is not *a priori*: collaboration raises the question of its political forms, that of capture by the subject of the master-desire (D03) (04.1). ∎\n\n## Scholium\n\nThe entrepreneur who protests that his \"freedom of enterprise\" is being curbed speaks only of the impulses of his conatus: \"I have a desire in keeping with the division of labour and I am prevented from pursuing it\" (03.1). On this point, Lordon grants that he is right: related to the desiring constitution of each being, \"that freedom is irrefutable\" (03.1).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D01", "D02", "D03"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D01", "D02", "D03"], "mentions": ["D01", "D02", "D03"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T004", "file": "theses/T004.md", "type": "these", "partie": "1", "titre": "Le salariat est un cas du patronat, dont le problème est la mobilisation", "enonce": "L'enrôlement au service d'un désir-maître se rencontre bien au-delà de l'entreprise capitaliste : le salariat n'en est qu'un cas. Tout patronat doit faire se mouvoir des corps au service d'un désir qui n'est pas le leur ; la mobilisation est sa préoccupation constitutive, et la méthode du patronat capitaliste est d'abord l'argent.", "titre_en": "Wage labour is a case of bosshood, whose problem is mobilisation", "enonce_en": "Enlistment in the service of a master-desire is found well beyond the capitalist firm: wage labour is only one case of it. Every bosshood must get bodies moving in the service of a desire that is not theirs; mobilisation is its constitutive concern, and the method of capitalist bosshood is first of all money.", "citation": "", "loc": ["04.2", "05.1"], "depends_on": ["D04", "D05"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D05, le rapport salarial est un rapport d'enrôlement ; par D04, le patronat au sens général est tout rapport sous lequel un désir-maître mobilise des puissances enrôlées (04.2).\n2. Ce rapport se retrouve chez le chef de guerre, le croisé, le souverain, le dirigeant d'ONG, le mandarin universitaire, l'artiste : tous captent l'effort de leurs subordonnés (04.2).\n3. Capter suppose de mettre en mouvement. Que des personnes « acceptent » de s'activer pour un désir qui n'est pas le leur est très étrange ; seule l'habitude fait oublier l'immense travail social requis pour produire du « se mouvoir pour autrui » (05.1).\n4. Chaque patronat a ses méthodes ; celle du patronat capitaliste est *d'abord* l'argent (05.1). ∎", "body_en": "## Argument\n\n1. By D05, the wage relation is a relation of enlistment; by D04, bosshood in the general sense is any relation under which a master-desire mobilises enlisted powers (04.2).\n2. This relation is found in the warlord, the crusader, the sovereign, the NGO director, the academic mandarin, the artist: all capture the effort of their subordinates (04.2).\n3. Capturing presupposes setting in motion. That people \"agree\" to busy themselves for a desire that is not theirs is very strange; only habit makes one forget the immense social work required to produce \"moving for others\" (05.1).\n4. Each bosshood has its methods; that of capitalist bosshood is *first of all* money (05.1). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D04", "D05"], "sections": ["Argumentation"], "demo_refs": ["D04", "D05"], "mentions": ["D04", "D05"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T005", "file": "theses/T005.md", "type": "these", "partie": "1", "titre": "Tous les comportements sont intéressés", "enonce": "Le patronat fonctionne à l'intérêt, c'est-à-dire au désir. Puisque l'effort de persévérer n'est jamais poursuivi qu'en première personne, toute conduite, y compris le don, doit être dite intéressée, au sens large d'un intérêt qui n'est pas le calcul.", "titre_en": "All behaviour is interested", "enonce_en": "Bosshood runs on interest, that is, on desire. Since the striving to persevere is only ever pursued in the first person, all conduct, including the gift, must be called interested, in the broad sense of an interest that is not calculation.", "citation": "« ce désir-intérêt au principe de toutes les servitudes »", "loc": ["05.2"], "depends_on": ["D06", "D01"], "contre": ["R02"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par D06, l'intérêt est l'objet du désir sous un autre nom ; posée l'essence désirante de l'homme (D01), tous ses comportements sont donc intéressés (05.2).\n2. Il ne reste « rien » de l'altruisme pur, mais « tout » de la chaleur des relations, si l'on refuse de réduire l'intérêt au calcul : il y a de l'intérêt dans la reconnaissance escomptée d'un don, dans l'attente d'être aimé en retour, dans les profits symboliques, sur d'autres modes que le calcul explicite (05.2).\n3. Les amis du désintéressement (R02) valident la réduction utilitariste qu'ils combattent, en abandonnant le mot d'intérêt à l'adversaire (05.2).\n4. Le conatus unifie toute la gamme des intérêts, de l'économique au moral, au symbolique et au psychique ; les rapports sociaux du capitalisme puisent dans cette gamme bien plus largement que ne le croit une lecture économiciste (05.2). ∎", "body_en": "## Argument\n\n1. By D06, interest is the object of desire under another name; given man's desiring essence (D01), all his behaviour is therefore interested (05.2).\n2. \"Nothing\" remains of pure altruism, but \"everything\" of the warmth of relationships, if one refuses to reduce interest to calculation: there is interest in the expected recognition of a gift, in the hope of being loved in return, in symbolic profits, in modes other than explicit calculation (05.2).\n3. The friends of disinterestedness (R02) validate the utilitarian reduction they fight, abandoning the word interest to their opponent (05.2).\n4. The conatus unifies the whole range of interests, from the economic to the moral, the symbolic and the psychic; the social relations of capitalism draw on this range far more widely than an economistic reading believes (05.2). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D01", "D06", "R02"], "sections": ["Argumentation"], "demo_refs": ["D01", "D06", "R02"], "mentions": ["D01", "D06", "R02"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T006", "file": "theses/T006.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est d'abord une dépendance à l'argent", "enonce": "Dans une économie à travail divisé, la reproduction matérielle, la « vie nue », passe par l'argent, et le capitalisme ne naît qu'en fermant les dernières possibilités d'autoproduction. Le rapport salarial est donc d'abord un rapport de dépendance, où l'employeur détient les conditions de la reproduction du salarié ; l'argent, qui conditionne presque tous les autres désirs, devient l'objet d'un métadésir.", "titre_en": "The wage relation is first a dependence on money", "enonce_en": "In an economy with a division of labour, material reproduction, \"bare life\", goes through money, and capitalism is born only by closing off the last possibilities of self-production. The wage relation is therefore first a relation of dependence, in which the employer holds the conditions of the employee's reproduction; money, which conditions almost all other desires, becomes the object of a meta-desire.", "citation": "« le fond inamovible, l’arrière-plan permanent de tout ce qui pourra s’élaborer par là-dessus »", "loc": ["06.1", "06.2", "06.3", "07.3"], "depends_on": ["D07", "M02", "D05", "S02", "D08"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le capitalisme commence par le désir basal (D07), qui passe par l'argent dans une économie à travail divisé. Par l'accumulation primitive (M02), il ferme l'autoproduction et porte l'hétéronomie matérielle à un degré inouï : la dépendance intégrale à la division marchande du travail est sa condition de possibilité (06.1).\n2. Par D05, le rapport salarial permet à certains d'impliquer les autres dans leur entreprise ; il n'est possible qu'en faisant de l'argent le passage obligé et exclusif du désir basal. C'est d'abord un rapport de dépendance, fond permanent de tout le reste (06.2).\n3. Les « plans » plus raffinés (avancement, socialisation, « épanouissement ») peuvent à tout instant s'effondrer, et ne laisser debout que la dépendance matérielle, « fond brut de menace jetée sur la vie à nouveau nue » (06.2).\n4. Il n'y a que deux fournisseurs d'argent, l'employeur et le financier ; pour le salarié, c'est l'employeur. L'argent conditionne presque tous les autres désirs : c'est le « condensé de tous les biens » de Spinoza (S02), objet de métadésir (06.3).\n5. Par D08, ce désir est l'expression subjective du rapport social monétaire, dont toute l'armature institutionnelle fournit à l'économie marchande du désir l'un de ses attracteurs les plus puissants (07.3). ∎\n\n## Scolie\n\nLordon dit devoir rappeler cette évidence parce que les discours sur l'« enrichissement du travail », le « management participatif » et la « réalisation de soi » finissent par la faire oublier (06.2).", "body_en": "## Argument\n\n1. Capitalism begins with basic desire (D07), which goes through money in an economy with a division of labour. Through primitive accumulation (M02), it closes off self-production and carries material heteronomy to an unheard-of degree: complete dependence on the market division of labour is its condition of possibility (06.1).\n2. By D05, the wage relation allows some to involve others in their enterprise; it is possible only by making money the obligatory and exclusive passage of basic desire. It is first a relation of dependence, the permanent background of all the rest (06.2).\n3. The more refined \"planes\" (promotion, socialisation, \"fulfilment\") can collapse at any moment, leaving standing only material dependence, the \"raw background of threat cast over life once again bare\" (06.2).\n4. There are only two suppliers of money, the employer and the financier; for the employee, it is the employer. Money conditions almost all other desires: it is Spinoza's \"epitome of all goods\" (S02), the object of a meta-desire (06.3).\n5. By D08, this desire is the subjective expression of the monetary social relation, whose whole institutional framework provides the market economy of desire with one of its most powerful attractors (07.3). ∎\n\n## Scholium\n\nLordon says he must recall this obvious fact because the talk of \"job enrichment\", \"participative management\" and \"self-realisation\" ends up making it forgotten (06.2).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D05", "D07", "D08", "M02", "S02"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D05", "D07", "D08", "M02", "S02"], "mentions": ["D05", "D07", "D08", "M02", "S02"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T007", "file": "theses/T007.md", "type": "these", "partie": "1", "titre": "Le rapport salarial est un rapport de domination", "enonce": "La dépendance au désir d'argent, dont les employeurs sont les seuls pourvoyeurs, fait du rapport salarial un rapport de domination. L'intensité d'une domination étant proportionnée à celle du désir dont le dominant tient la clé, il n'y a pas, dans le capitalisme, de plus puissante emprise que l'enrôlement salarial.", "titre_en": "The wage relation is a relation of domination", "enonce_en": "Dependence on the desire for money, of which employers are the only providers, makes the wage relation a relation of domination. Since the intensity of a domination is proportionate to that of the desire to which the dominant holds the key, there is in capitalism no more powerful hold than wage enlistment.", "citation": "« il n’y a pas plus impérieux que le désir d’argent, par conséquent pas de plus puissante emprise que celle de l’enrôlement salarial »", "loc": ["08.1"], "depends_on": ["D09", "T006", "M03"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par T006, la mise en mouvement des corps salariés tire son énergie de la fixation du désir sur l'argent, dont les employeurs sont établis comme seuls pourvoyeurs (08.1).\n2. Par D09, il y a domination quand un agent doit passer par un autre pour accéder à son objet de désir : le rapport salarial est donc un rapport de domination (08.1).\n3. L'intensité de la domination est proportionnée à l'intensité du désir du dominé dont le dominant détient la clé (08.1).\n4. Or, quand l'hétéronomie matérielle est radicale, l'argent conditionne tous les autres désirs, et par M03 il faut d'abord vivre : aucun désir n'est plus impérieux (08.1).\n5. De 2, 3 et 4 : nulle emprise n'est plus puissante que l'enrôlement salarial (08.1). ∎", "body_en": "## Demonstration\n\n1. By T006, the setting in motion of wage-earning bodies draws its energy from the fixation of desire on money, of which employers are established as the only providers (08.1).\n2. By D09, there is domination when an agent must go through another to gain access to its object of desire: the wage relation is therefore a relation of domination (08.1).\n3. The intensity of domination is proportionate to the intensity of the desire of the dominated to which the dominant holds the key (08.1).\n4. Now, when material heteronomy is radical, money conditions all other desires, and by M03 one must first live: no desire is more imperious (08.1).\n5. From 2, 3 and 4: no hold is more powerful than wage enlistment (08.1). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D09", "M03", "T006"], "sections": ["Démonstration"], "demo_refs": ["D09", "M03", "T006"], "mentions": ["D09", "M03", "T006"], "corollaires": [], "mtime": 1794571189.138027}, {"id": "T008", "file": "theses/T008.md", "type": "these", "partie": "1", "titre": "L'hétéronomie du désir", "enonce": "Le conatus est un élan sans direction définie, un « désir sans objet ». Ses objets lui sont tous désignés du dehors, par les affections qu'il rencontre, par la mémoire et l'association, par l'imitation des désirs d'autrui. Rien, dans la vie passionnelle, n'est de l'ordre d'une volonté autonome.", "titre_en": "The heteronomy of desire", "enonce_en": "The conatus is an impulse with no definite direction, a \"desire without an object\". Its objects are all designated to it from outside, by the affections it encounters, by memory and association, by the imitation of others' desires. Nothing in passional life is a matter of autonomous will.", "citation": "", "loc": ["08.3", "08.4"], "depends_on": ["D01", "S03", "S04", "S05", "S06"], "contre": ["R03"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Par D01, le conatus est force désirante ; ontologiquement, il est pur élan sans direction définie, « désir sans objet » selon Laurent Bove (08.3).\n2. Par S03, le désir est l'essence de l'homme déterminée par une affection à faire quelque chose : c'est une affection antécédente qui lui donne direction et objet (08.3).\n3. Par S04, ce n'est pas le désirable qui attire le désir : c'est la poussée du conatus qui investit les choses et les institue comme objets de désir. La conception ordinaire (R03) est renversée (08.3).\n4. La séquence élémentaire est : une affection (ce qui arrive), un affect (son effet, triste ou joyeux), l'envie de faire qui s'ensuit. La vie du désir l'élabore par la mémoire et l'association (S05), et par l'imitation des désirs d'autrui (S06), surtout à travers des médiations sociales (08.3).\n5. Le désir et les affects sont donc profondément hétéronomes, fruits des rencontres et des dispositions formées le long de trajectoires sociales : rien d'une volonté autonome ni d'une libre autodétermination (08.4). ∎", "body_en": "## Demonstration\n\n1. By D01, the conatus is desiring force; ontologically, it is pure impulse with no definite direction, a \"desire without an object\" according to Laurent Bove (08.3).\n2. By S03, desire is the essence of man determined by an affection to do something: it is a prior affection that gives it direction and object (08.3).\n3. By S04, it is not the desirable that attracts desire: it is the thrust of the conatus that invests things and institutes them as objects of desire. The ordinary conception (R03) is reversed (08.3).\n4. The elementary sequence is: an affection (what happens), an affect (its effect, sad or joyful), the urge to act that follows. The life of desire elaborates it through memory and association (S05), and through the imitation of others' desires (S06), above all through social mediations (08.3).\n5. Desire and the affects are therefore deeply heteronomous, products of encounters and of dispositions formed along social trajectories: nothing of an autonomous will or of free self-determination (08.4). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D01", "R03", "S03", "S04", "S05", "S06"], "sections": ["Démonstration"], "demo_refs": ["D01", "R03", "S03", "S04", "S05", "S06"], "mentions": ["D01", "R03", "S03", "S04", "S05", "S06"], "corollaires": [], "mtime": 1794571189.1428883}, {"id": "T009", "file": "theses/T009.md", "type": "these", "partie": "1", "titre": "La servitude volontaire n'existe pas", "enonce": "On n'est pas asservi par défaut de volonté, mais par la nécessité et l'intensité d'un désir, que les structures configurent : dans l'hétéronomie matérielle, le désir de persévérer devient désir d'argent, puis désir d'emploi salarié. Les véritables chaînes sont nos affects et nos désirs : la servitude volontaire n'existe pas, il n'y a que la servitude passionnelle, et elle est universelle.", "titre_en": "Voluntary servitude does not exist", "enonce_en": "One is not enslaved by a lack of will, but by the necessity and intensity of a desire, which structures configure: in material heteronomy, the desire to persevere becomes desire for money, then desire for wage employment. Our real chains are our affects and our desires: voluntary servitude does not exist, there is only passional servitude, and it is universal.", "citation": "« La servitude volontaire n’existe pas. Il n’y a que la servitude passionnelle. Mais elle est universelle. »", "loc": ["08.2", "08.4"], "depends_on": ["T006", "T007", "T008", "S07"], "contre": ["R01"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Démonstration\n\n1. Le rapport salarial expose « dans sa nudité » le principe réel de l'asservissement : la nécessité et l'intensité d'un désir (T007) (08.2).\n2. Ce désir ne s'impose pas sur le mode du libre choix. Par T006, les structures de l'hétéronomie matérielle déterminent le désir de persévérer comme désir d'argent, et celui-ci comme désir d'emploi salarié ; parler ici de servitude volontaire, ce serait le dire aussi de l'otage qui obéit, un pistolet sur la tempe (08.2).\n3. L'exemple salarial n'est pas une exception : par T008, l'hétéronomie du désir est une absolue généralité (08.3-08.4).\n4. Par S07, la servitude est l'impuissance à diriger ses affects ; l'ordre fortuit des rencontres et les lois de la vie affective font de l'homme un « automate passionnel » (08.4).\n5. L'idée de servitude volontaire (R01) exprime le refus individualiste de ce verdict d'hétéronomie ; Spinoza propose un autre mécanisme de l'aliénation, par les affects et les désirs. La servitude n'est donc pas volontaire mais passionnelle, et elle est universelle (08.4). ∎", "body_en": "## Demonstration\n\n1. The wage relation exposes \"in its nakedness\" the real principle of enslavement: the necessity and intensity of a desire (T007) (08.2).\n2. This desire does not impose itself in the mode of free choice. By T006, the structures of material heteronomy determine the desire to persevere as desire for money, and the latter as desire for wage employment; to speak of voluntary servitude here would be to say it also of the hostage who obeys with a pistol to his temple (08.2).\n3. The wage example is no exception: by T008, the heteronomy of desire is an absolute generality (08.3-08.4).\n4. By S07, servitude is the powerlessness to govern one's affects; the fortuitous order of encounters and the laws of affective life make man a \"passional automaton\" (08.4).\n5. The idea of voluntary servitude (R01) expresses the individualist refusal of this verdict of heteronomy; Spinoza proposes another mechanism of alienation, through affects and desires. Servitude is therefore not voluntary but passional, and it is universal (08.4). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["R01", "S07", "T006", "T007", "T008"], "sections": ["Démonstration"], "demo_refs": ["R01", "S07", "T006", "T007", "T008"], "mentions": ["R01", "S07", "T006", "T007", "T008"], "corollaires": [], "mtime": 1794571189.1444998}, {"id": "T010", "file": "theses/T010.md", "type": "these", "partie": "1", "titre": "La dépendance du capital et du travail est asymétrique", "enonce": "La symétrie formelle du capital et du travail cède devant deux faits : la force de travail est fongible, et le capital peut attendre alors que le salarié doit se reproduire chaque jour. Quant aux places de capitaliste et de salarié, c'est l'accès à l'argent qui les distribue : en flux pour le salarié, ce qui ne permet que de se reproduire ; en stock pour le capitaliste, ce qui permet l'avance et l'accumulation.", "titre_en": "The dependence of capital and labour is asymmetrical", "enonce_en": "The formal symmetry of capital and labour gives way before two facts: labour power is fungible, and capital can wait whereas the employee must reproduce himself every day. As for the positions of capitalist and employee, it is access to money that distributes them: as a flow for the employee, which only allows him to reproduce himself; as a stock for the capitalist, which allows advances and accumulation.", "citation": "« C’est une question de fric au départ »", "loc": ["09.1", "09.2", "09.3", "09.4"], "depends_on": ["T006", "D07", "M02"], "contre": ["R04"], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Par T006, l'employeur, pourvoyeur d'argent, tient la clé du désir basal du salarié (09.1).\n2. On objecte (R04) que l'employeur dépend lui aussi de la force de travail. Mais il lui faut *de la* force de travail, non *sa* force de travail : le grand nombre des employés la rend fongible (09.2).\n3. Est dominé celui des deux qui peut le moins différer l'obtention de son objet ; or c'est le capital qui a le temps d'attendre. La situation réelle distord donc la symétrie formelle en dépendance, et en domination (09.2).\n4. En amont, le capitaliste a besoin d'un stock de fonds propres, que le banquier ne fait que compléter : le mode salarial d'accès à l'argent est le flux, le mode financier est le stock, qui seul permet de franchir le seuil de l'accumulation (09.3).\n5. Ceux qui n'ont que leur force de travail sont hors course dès le départ : Antoine Doinel, qui songe à voler un meuble pour se lancer, retrouve l'effraction de l'accumulation primitive (M02). Les autres restent rivés au désir basal (D07), dont la seule satisfaction offerte est l'enrôlement salarial (09.4). ∎", "body_en": "## Argument\n\n1. By T006, the employer, provider of money, holds the key to the employee's basic desire (09.1).\n2. It is objected (R04) that the employer also depends on labour power. But he needs *some* labour power, not *this person's* labour power: the large number of employees makes it fungible (09.2).\n3. The dominated one is whichever of the two can least defer obtaining its object; and it is capital that has time to wait. The real situation thus distorts the formal symmetry into dependence, and into domination (09.2).\n4. Upstream, the capitalist needs a stock of own funds, which the banker only supplements: the wage mode of access to money is the flow, the financial mode is the stock, which alone allows one to cross the threshold of accumulation (09.3).\n5. Those who have only their labour power are out of the race from the start: Antoine Doinel, who dreams of stealing a piece of furniture to get started, rediscovers the break-in of primitive accumulation (M02). The others remain riveted to basic desire (D07), whose only offered satisfaction is wage enlistment (09.4). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D07", "M02", "R04", "T006"], "sections": ["Argumentation"], "demo_refs": ["D07", "M02", "R04", "T006"], "mentions": ["D07", "M02", "R04", "T006"], "corollaires": [], "mtime": 1794571189.1450837}, {"id": "T011", "file": "theses/T011.md", "type": "these", "partie": "1", "titre": "Domination à tous les étages", "enonce": "La grande entreprise diffracte la domination principale en une chaîne hiérarchique de dominations secondaires, où chacun est à la fois subordonné et subordonnant : une structure hiérarchique de la servitude passionnelle, chaîne montante de dépendance et descendante d'instrumentalisation. L'allongement de ces chaînes règle les conduites : il impose de ménager les intermédiaires, et produit la retenue, le compromis et le calcul.", "titre_en": "Domination at every level", "enonce_en": "The large firm diffracts the principal domination into a hierarchical chain of secondary dominations, where each is at once subordinate and subordinating: a hierarchical structure of passional servitude, a rising chain of dependence and a descending one of instrumentalisation. The lengthening of these chains regulates conduct: it requires sparing intermediaries, and produces restraint, compromise and calculation.", "citation": "", "loc": ["10.1", "10.2"], "depends_on": ["T007", "T009", "D10"], "contre": [], "ethique": [], "ref": "", "lien_explicite": true, "statut_revision": "verifie-texte", "body": "## Argumentation\n\n1. Le face-à-face du patron et des prolétaires (T007) a cédé la place à des structures feuilletées, où chacun vit le rapport salarial sur le mode subordonné-subordonnant (10.1).\n2. La thèse de La Boétie vaut ici mieux que son titre : il décrit une *structure hiérarchique de la servitude*, où les individus sont tenus séparément par leurs intérêts. Son renversement ne peut être à la portée d'une « volonté » (T009), puisqu'à chaque étage la domination est d'autant plus intense que le dominant local est lui-même dominé (10.1).\n3. Norbert Elias, « continuateur de La Boétie », montre que l'allongement des chaînes de dépendance incite à réguler les comportements : rompre avec éclat, c'est rompre avec celui par qui passe la poursuite des biens convoités (10.2).\n4. Le chemin du sujet désirant à l'objet désiré devient une médiation stratégique au sens de D10, que l'action soit calculée ou conduite par des habitudes incorporées (10.2). ∎", "body_en": "## Argument\n\n1. The face-to-face of the boss and the proletarians (T007) has given way to layered structures, where each lives the wage relation in the mode subordinate-subordinating (10.1).\n2. Here La Boétie's thesis is worth more than its title: he describes a *hierarchical structure of servitude*, where individuals are held separately by their interests. Its overturning cannot be within reach of a \"will\" (T009), since at each level domination is all the more intense as the local dominant is himself dominated (10.1).\n3. Norbert Elias, \"continuer of La Boétie\", shows that the lengthening of chains of dependence prompts the regulation of behaviour: to break off spectacularly is to break with the one through whom the pursuit of coveted goods passes (10.2).\n4. The path from the desiring subject to the desired object becomes a strategic mediation in the sense of D10, whether the action is calculated or guided by embodied habits (10.2). ∎", "sections_en": ["Argument"], "
